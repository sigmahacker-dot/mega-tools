<div class="tool-card">
  <div class="field">
    <label for="csv-to-markdown-input">CSV</label>
    <textarea class="textarea" id="csv-to-markdown-input" rows="7" style="font-family:monospace">Name,Role,"Start date"
"Ada Lovelace","Engineer, backend","2024-01-15"
"Grace ""Amazing"" Hopper",CTO,"2023-06-01"
Alan Turing,Researcher,"2025-03-20"</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="csv-to-markdown-align">Alignment</label>
      <select class="select" id="csv-to-markdown-align">
        <option value="left">Left</option>
        <option value="center">Center</option>
        <option value="right">Right</option>
      </select>
    </div>
    <div class="field checkline" style="align-self:end">
      <input type="checkbox" id="csv-to-markdown-header" checked>
      <label for="csv-to-markdown-header">First row is header</label>
    </div>
    <div class="field checkline" style="align-self:end">
      <input type="checkbox" id="csv-to-markdown-trim" checked>
      <label for="csv-to-markdown-trim">Trim cells</label>
    </div>
  </div>
  <div class="error" id="csv-to-markdown-error"></div>
  <div class="field">
    <label for="csv-to-markdown-output">Markdown table</label>
    <textarea class="textarea" id="csv-to-markdown-output" rows="10" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="csv-to-markdown-copy">Copy table</button>
    <button class="btn btn-outline" id="csv-to-markdown-download">Download table.md</button>
  </div>
</div>
