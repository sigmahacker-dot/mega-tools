<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="ultradian-rhythm-planner-wake">Wake up</label>
      <input class="input" id="ultradian-rhythm-planner-wake" type="time" value="07:00">
    </div>
    <div class="field">
      <label for="ultradian-rhythm-planner-bed">Bedtime</label>
      <input class="input" id="ultradian-rhythm-planner-bed" type="time" value="23:00">
    </div>
    <div class="field">
      <label for="ultradian-rhythm-planner-focus">Focus block (min)</label>
      <input class="input" id="ultradian-rhythm-planner-focus" type="number" min="25" max="180" value="90">
    </div>
    <div class="field">
      <label for="ultradian-rhythm-planner-break">Break (min)</label>
      <input class="input" id="ultradian-rhythm-planner-break" type="number" min="5" max="60" value="20">
    </div>
    <div class="field">
      <label for="ultradian-rhythm-planner-warmup">Morning warm-up (min)</label>
      <input class="input" id="ultradian-rhythm-planner-warmup" type="number" min="0" max="180" value="60">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="ultradian-rhythm-planner-plan">Plan day</button>
    </div>
  </div>
  <div class="error" id="ultradian-rhythm-planner-error"></div>
  <div id="ultradian-rhythm-planner-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ultradian-rhythm-planner-nblocks">–</div><div class="l">Focus blocks</div></div>
      <div class="stat-card"><div class="v" id="ultradian-rhythm-planner-focus-t">–</div><div class="l">Total deep work</div></div>
    </div>
    <div class="result">
      <h3>Your day</h3>
      <div style="overflow-x:auto"><table class="data"><thead><tr><th>Time</th><th>Block</th><th>Do</th></tr></thead><tbody id="ultradian-rhythm-planner-rows"></tbody></table></div>
    </div>
  </div>
</div>
