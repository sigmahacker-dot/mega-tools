<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ratio-simplifier-a">First number</label>
      <input type="number" class="input" id="ratio-simplifier-a" step="any" min="0" placeholder="e.g. 12">
    </div>
    <div class="field">
      <label for="ratio-simplifier-b">Second number</label>
      <input type="number" class="input" id="ratio-simplifier-b" step="any" min="0" placeholder="e.g. 18">
    </div>
    <div class="field">
      <label for="ratio-simplifier-c">Third number (optional)</label>
      <input type="number" class="input" id="ratio-simplifier-c" step="any" min="0" placeholder="e.g. 30">
    </div>
  </div>
  <div class="error" id="ratio-simplifier-error"></div>
  <div class="result" id="ratio-simplifier-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ratio-simplifier-simple">–</div><div class="l">Simplified ratio</div></div>
      <div class="stat-card"><div class="v" id="ratio-simplifier-gcd">–</div><div class="l">Greatest common divisor</div></div>
      <div class="stat-card"><div class="v" id="ratio-simplifier-total">–</div><div class="l">Total simplified parts</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Part</th><th>Original</th><th>Simplified</th><th>Share of whole</th><th>Percentage</th></tr></thead>
      <tbody id="ratio-simplifier-body">
        <tr><td colspan="5" class="muted">Enter at least two numbers to simplify the ratio.</td></tr>
      </tbody>
    </table>
  </div>
</div>
