<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="howto-schema-generator-name">How-to name</label>
      <input class="input" type="text" id="howto-schema-generator-name" placeholder="e.g. How to tie a tie">
    </div>
    <div class="field">
      <label for="howto-schema-generator-time">Total time (e.g. PT30M)</label>
      <input class="input" type="text" id="howto-schema-generator-time" placeholder="PT15M">
    </div>
  </div>
  <div class="field">
    <label for="howto-schema-generator-desc">Description</label>
    <input class="input" type="text" id="howto-schema-generator-desc">
  </div>
  <h3>Add steps</h3>
  <div class="grid3">
    <div class="field">
      <label for="howto-schema-generator-sname">Step name</label>
      <input class="input" type="text" id="howto-schema-generator-sname">
    </div>
    <div class="field">
      <label for="howto-schema-generator-smins">Minutes (optional)</label>
      <input class="input" type="number" id="howto-schema-generator-smins" min="0">
    </div>
    <div class="field">
      <label for="howto-schema-generator-simg">Image URL (optional)</label>
      <input class="input" type="url" id="howto-schema-generator-simg">
    </div>
  </div>
  <div class="field">
    <label for="howto-schema-generator-stext">Step details</label>
    <textarea class="textarea" id="howto-schema-generator-stext" rows="2"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="howto-schema-generator-add">Add Step</button>
    <button class="btn btn-outline" id="howto-schema-generator-clear">Clear Steps</button>
  </div>
  <div class="error" id="howto-schema-generator-error"></div>
  <div id="howto-schema-generator-steps" style="margin-top:10px"></div>
</div>

<div class="tool-card">
  <div class="btn-row">
    <button class="btn" id="howto-schema-generator-gen">Generate Schema</button>
    <button class="btn btn-outline" id="howto-schema-generator-copy">Copy JSON-LD</button>
    <button class="btn btn-outline" id="howto-schema-generator-dl">Download .json</button>
  </div>
  <pre id="howto-schema-generator-out" style="white-space:pre-wrap;font-family:monospace;font-size:13px;margin-top:10px"></pre>
</div>
