<div class="tool-card">
  <div class="dropzone" id="image-brightness-contrast-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-brightness-contrast-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-brightness-contrast-wrap" style="text-align:center">
    <canvas id="image-brightness-contrast-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="image-brightness-contrast-bright">Brightness: <span id="image-brightness-contrast-bright-val">0</span></label>
      <input type="range" id="image-brightness-contrast-bright" min="-100" max="100" value="0">
    </div>
    <div class="field">
      <label for="image-brightness-contrast-cont">Contrast: <span id="image-brightness-contrast-cont-val">0</span></label>
      <input type="range" id="image-brightness-contrast-cont" min="-100" max="100" value="0">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-brightness-contrast-download">Download PNG</button>
  </div>
  <div class="error" id="image-brightness-contrast-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
