<div class="tool-card">
  <div class="field">
    <label for="meal-planner-weekly-label">Week label</label>
    <input class="input" type="text" id="meal-planner-weekly-label" placeholder="e.g. Week of Oct 5">
  </div>
  <div style="overflow-x:auto">
    <table id="meal-planner-weekly-grid" style="width:100%;border-collapse:collapse;min-width:640px">
      <thead>
        <tr><th style="text-align:left;padding:8px">Meal</th><th style="padding:8px">Mon</th><th style="padding:8px">Tue</th><th style="padding:8px">Wed</th><th style="padding:8px">Thu</th><th style="padding:8px">Fri</th><th style="padding:8px">Sat</th><th style="padding:8px">Sun</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="meal-planner-weekly-print">Print / Save PDF</button>
    <button class="btn btn-outline" id="meal-planner-weekly-clear">Clear Week</button>
  </div>
  <div class="error" id="meal-planner-weekly-error"></div>
  <p class="muted">Edits save automatically.</p>
</div>
