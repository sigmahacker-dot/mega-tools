<div class="tool-card">
  <div class="field"><label for="uni-text">Text to inspect</label><textarea class="textarea" id="uni-text" rows="3" placeholder="Hello 😀 مرحبا"></textarea></div>
  <div class="error" id="unicode-inspector-error"></div>
  <div class="result" id="uni-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="uni-cps">–</div><div class="l">Code points</div></div>
      <div class="stat-card"><div class="v" id="uni-units">–</div><div class="l">UTF-16 units</div></div>
      <div class="stat-card"><div class="v" id="uni-bytes">–</div><div class="l">UTF-8 bytes</div></div>
    </div>
    <div style="overflow-x:auto">
      <table class="data"><thead><tr><th>Char</th><th>Code point</th><th>UTF-16</th><th>UTF-8 bytes</th><th>Block</th><th>Category</th></tr></thead><tbody id="uni-body"></tbody></table>
    </div>
  </div>
</div>
