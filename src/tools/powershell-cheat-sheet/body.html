<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="powershell-cheat-sheet-q">Search cmdlets</label>
      <input class="input" id="powershell-cheat-sheet-q" placeholder="e.g. process, network, csv…">
    </div>
    <div class="field">
      <label for="powershell-cheat-sheet-cat">Category</label>
      <select class="select" id="powershell-cheat-sheet-cat"><option value="">All categories</option></select>
    </div>
  </div>
  <p class="muted" id="powershell-cheat-sheet-count"></p>
  <div style="overflow:auto">
    <table style="width:100%;border-collapse:collapse;font-size:14px" id="powershell-cheat-sheet-table">
      <thead><tr style="text-align:left;border-bottom:1px solid #3f3f46">
        <th style="padding:8px">Cmdlet</th><th style="padding:8px">Alias</th><th style="padding:8px">Category</th><th style="padding:8px">Description</th>
      </tr></thead>
      <tbody id="powershell-cheat-sheet-body"></tbody>
    </table>
  </div>
  <div class="error" id="powershell-cheat-sheet-error"></div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-outline" id="powershell-cheat-sheet-download">Download as Markdown</button>
  </div>
</div>
