<div class="tool-card">
  <div class="field">
    <label for="audio-normalizer-file">Audio file</label>
    <input type="file" id="audio-normalizer-file" accept="audio/*" class="input">
  </div>
  <div class="field">
    <label for="audio-normalizer-target">Target peak: <span id="audio-normalizer-target-val">−1.0</span> dB</label>
    <input type="range" id="audio-normalizer-target" min="-12" max="-0.5" step="0.5" value="-1">
    <span class="hint">−1 dB for music masters · −3 dB for podcasts/voice.</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="audio-normalizer-go">Normalize</button>
  </div>
  <div class="result hidden" id="audio-normalizer-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="audio-normalizer-before">–</div><div class="l">Original peak</div></div>
      <div class="stat-card"><div class="v" id="audio-normalizer-gain">–</div><div class="l">Gain applied</div></div>
      <div class="stat-card"><div class="v" id="audio-normalizer-after">–</div><div class="l">New peak</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="audio-normalizer-download">Download WAV</button>
    </div>
  </div>
  <div class="error" id="audio-normalizer-error"></div>
  <p class="note">True peak normalization via an OfflineAudioContext gain stage — no limiting, no compression. Runs in your browser.</p>
</div>
