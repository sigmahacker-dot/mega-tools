<div class="tool-card">
  <div class="field">
    <label for="birthday-countdown-date">Your birthday</label>
    <input type="date" id="birthday-countdown-date" class="input">
  </div>
  <div class="error" id="birthday-countdown-error"></div>
  <div id="birthday-countdown-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="birthday-countdown-d">0</div><div class="l">Days</div></div>
      <div class="stat-card"><div class="v" id="birthday-countdown-h">0</div><div class="l">Hours</div></div>
      <div class="stat-card"><div class="v" id="birthday-countdown-m">0</div><div class="l">Minutes</div></div>
      <div class="stat-card"><div class="v" id="birthday-countdown-s">0</div><div class="l">Seconds</div></div>
    </div>
    <h3 class="center mt" id="birthday-countdown-turns"></h3>
    <p class="note" id="birthday-countdown-msg"></p>
  </div>
  <p class="muted">Your date of birth never leaves your browser — the countdown runs entirely on your device.</p>
</div>
