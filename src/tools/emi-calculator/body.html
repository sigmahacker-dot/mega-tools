<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="emi-principal">Loan amount</label>
      <input type="number" class="input" id="emi-principal" min="0" step="any" placeholder="e.g. 500000">
    </div>
    <div class="field">
      <label for="emi-rate">Annual interest rate (%)</label>
      <input type="number" class="input" id="emi-rate" min="0" step="any" placeholder="e.g. 9.5">
    </div>
    <div class="field">
      <label for="emi-tenure">Tenure</label>
      <input type="number" class="input" id="emi-tenure" min="0" step="any" placeholder="e.g. 5">
    </div>
    <div class="field">
      <label for="emi-tenure-unit">Tenure unit</label>
      <select class="select" id="emi-tenure-unit">
        <option value="years" selected>Years</option>
        <option value="months">Months</option>
      </select>
    </div>
  </div>
  <div class="error" id="emi-calculator-error"></div>
  <div class="result" id="emi-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="emi-monthly">–</div><div class="l">Monthly EMI</div></div>
      <div class="stat-card"><div class="v" id="emi-interest">–</div><div class="l">Total interest</div></div>
      <div class="stat-card"><div class="v" id="emi-total">–</div><div class="l">Total payable</div></div>
    </div>
    <p class="note">Fixed annual rate, monthly compounding. Excludes fees, insurance and taxes.</p>
  </div>
</div>
