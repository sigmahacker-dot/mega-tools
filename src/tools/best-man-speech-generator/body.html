<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="best-man-speech-generator-you">Your name</label>
      <input class="input" id="best-man-speech-generator-you" type="text" placeholder="e.g. Alex" maxlength="40">
    </div>
    <div class="field">
      <label for="best-man-speech-generator-groom">Groom's name</label>
      <input class="input" id="best-man-speech-generator-groom" type="text" placeholder="e.g. Dan" maxlength="40">
    </div>
    <div class="field">
      <label for="best-man-speech-generator-partner">Partner's name</label>
      <input class="input" id="best-man-speech-generator-partner" type="text" placeholder="e.g. Sam" maxlength="40">
    </div>
    <div class="field">
      <label for="best-man-speech-generator-know">How you know the groom</label>
      <select class="select" id="best-man-speech-generator-know">
        <option value="childhood friends">Childhood friends</option>
        <option value="college friends">College friends</option>
        <option value="brothers">Brothers</option>
        <option value="cousins">Cousins</option>
        <option value="work friends">Work friends</option>
      </select>
    </div>
    <div class="field">
      <label for="best-man-speech-generator-tone">Tone</label>
      <select class="select" id="best-man-speech-generator-tone">
        <option value="funny">Funny</option>
        <option value="heartfelt">Heartfelt</option>
        <option value="short">Short &amp; sweet</option>
      </select>
    </div>
    <div class="field">
      <label for="best-man-speech-generator-joke">Joke style</label>
      <select class="select" id="best-man-speech-generator-joke">
        <option value="gentle">Gentle teasing</option>
        <option value="cheeky">Cheeky</option>
        <option value="none">No jokes, keep it classy</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="best-man-speech-generator-memory">A funny memory with the groom</label>
    <input class="input" id="best-man-speech-generator-memory" type="text" placeholder="e.g. the camping trip where he lost the tent" maxlength="160">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="best-man-speech-generator-go" type="button">Build My Speech</button>
  </div>
  <div class="error" id="best-man-speech-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your speech outline</label>
    <div class="result" id="best-man-speech-generator-output" style="white-space:pre-wrap">Your speech outline will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="best-man-speech-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="best-man-speech-generator-download" type="button">Download .txt</button>
  </div>
  <p class="note">An outline to rehearse from — add your own stories so it sounds like you.</p>
</div>
