<div class="tool-card">
  <div class="field">
    <label for="blackout-poetry-maker-input">Paste your source text</label>
    <textarea class="textarea" id="blackout-poetry-maker-input" rows="5" placeholder="Paste an article, lyrics or any text"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="blackout-poetry-maker-load">Load text</button>
    <button class="btn btn-outline" id="blackout-poetry-maker-reset">Reset</button>
  </div>
  <div class="field">
    <label>Click words to black them out (click again to restore)</label>
    <div class="result"><div class="data" id="blackout-poetry-maker-words" style="line-height:2.2"></div></div>
  </div>
  <div class="field">
    <label>Your poem (surviving words)</label>
    <div class="result"><div class="data" id="blackout-poetry-maker-poem" style="white-space:pre-wrap;font-size:1.1em"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="blackout-poetry-maker-copy">Copy poem</button></div>
  </div>
  <div class="error" id="blackout-poetry-maker-error"></div>
</div>
