<div class="tool-card" style="text-align:center">
  <div class="grid3" style="max-width:560px;margin:0 auto 10px">
    <div class="field" style="text-align:left">
      <label for="gomoku-game-mode">Mode</label>
      <select class="input" id="gomoku-game-mode">
        <option value="ai" selected>Vs Computer</option>
        <option value="2p">Two players</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label for="gomoku-game-color">Your stones</label>
      <select class="input" id="gomoku-game-color">
        <option value="1" selected>Black (first)</option>
        <option value="2">White (second)</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="gomoku-game-new" style="width:100%">New game</button>
    </div>
  </div>
  <p class="muted" id="gomoku-game-status" style="min-height:24px;font-weight:600"></p>
  <div style="display:inline-block;max-width:100%;overflow:auto">
    <div id="gomoku-game-board" style="display:inline-grid;grid-template-columns:repeat(15,minmax(20px,30px));gap:0;background:#d6a75c;padding:6px;border-radius:8px"></div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="gomoku-game-w1">0</div><div class="l">Black wins</div></div>
    <div class="stat-card"><div class="v" id="gomoku-game-w2">0</div><div class="l">White wins</div></div>
    <div class="stat-card"><div class="v" id="gomoku-game-wd">0</div><div class="l">Draws</div></div>
  </div>
  <div class="error" id="gomoku-game-error"></div>
</div>
