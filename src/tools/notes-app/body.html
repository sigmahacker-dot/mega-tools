<div class="tool-card">
  <div class="field">
    <label for="notes-app-search">Search notes</label>
    <input class="input" id="notes-app-search" type="text" placeholder="Type to filter notes..." autocomplete="off">
  </div>
  <div class="row mt">
    <div class="field" style="flex:1;min-width:200px;">
      <label>Your notes</label>
      <ul class="file-list" id="notes-app-list"></ul>
      <p class="muted" id="notes-app-empty">No notes yet. Create one to get started.</p>
    </div>
    <div class="field" style="flex:2;min-width:260px;">
      <label for="notes-app-title">Title</label>
      <input class="input" id="notes-app-title" type="text" placeholder="Note title" maxlength="120" autocomplete="off">
      <div class="field mt">
        <label for="notes-app-body">Body</label>
        <textarea class="textarea" id="notes-app-body" rows="10" placeholder="Write your note here..."></textarea>
      </div>
      <p class="muted" id="notes-app-edited"></p>
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="notes-app-new" type="button">New Note</button>
    <button class="btn btn-danger" id="notes-app-delete" type="button">Delete Note</button>
    <button class="btn btn-outline" id="notes-app-export" type="button">Export All (.txt)</button>
  </div>
  <div class="error" id="notes-app-error"></div>
  <p class="note">Notes save automatically as you type and stay in this browser only. Nothing is uploaded anywhere.</p>
</div>
