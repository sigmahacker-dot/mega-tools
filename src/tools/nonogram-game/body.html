<div class="tool-card" style="text-align:center">
  <div class="grid3" style="max-width:560px;margin:0 auto 10px">
    <div class="field" style="text-align:left">
      <label for="nonogram-game-puzzle">Puzzle</label>
      <select class="input" id="nonogram-game-puzzle">
        <option value="0">Heart (5×5)</option>
        <option value="1">Mushroom (10×10)</option>
        <option value="2">Rocket (15×15)</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label for="nonogram-game-markmode">Tap mode</label>
      <select class="input" id="nonogram-game-markmode">
        <option value="fill">■ Fill</option>
        <option value="cross">✕ Cross out</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="nonogram-game-reset" style="width:100%">Reset</button>
    </div>
  </div>
  <label class="checkline" style="justify-content:center;margin-bottom:8px"><input type="checkbox" id="nonogram-game-mistakes"> Flag mistakes immediately</label>
  <p class="muted" id="nonogram-game-status" style="min-height:24px;font-weight:600"></p>
  <div style="display:inline-block;max-width:100%;overflow:auto">
    <div id="nonogram-game-wrap" style="display:inline-block"></div>
  </div>
  <div class="error" id="nonogram-game-error"></div>
</div>
