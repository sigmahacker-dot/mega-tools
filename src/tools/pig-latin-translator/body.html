<div class="tool-card">
  <div class="field">
    <label for="pig-latin-translator-input">Input text</label>
    <textarea class="textarea" id="pig-latin-translator-input" rows="5" placeholder="Type English to encode, or Pig Latin to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="pig-latin-translator-mode">Mode</label>
      <select class="input" id="pig-latin-translator-mode">
        <option value="encode">English → Pig Latin</option>
        <option value="decode">Pig Latin → English</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="pig-latin-translator-run">Convert</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="pig-latin-translator-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="pig-latin-translator-copy">Copy output</button></div>
  </div>
  <p class="hint">Vowel start → +way · consonant cluster → move +ay · qu moves together · case & punctuation kept.</p>
  <div class="error" id="pig-latin-translator-error"></div>
</div>
