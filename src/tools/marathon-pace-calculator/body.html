<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="mp-dist">Race distance</label>
      <select class="input" id="mp-dist">
        <option value="42.195">Marathon (42.195 km)</option>
        <option value="21.0975">Half marathon (21.0975 km)</option>
        <option value="10">10K (10 km)</option>
        <option value="5">5K (5 km)</option>
        <option value="1.60934">Mile (1.609 km)</option>
        <option value="custom">Custom distance…</option>
      </select>
    </div>
    <div class="field"><label for="mp-custom">Custom distance (km)</label><input type="number" class="input" id="mp-custom" min="0" step="any" placeholder="15"></div>
    <div class="field"><label for="mp-h">Goal time — hours</label><input type="number" class="input" id="mp-h" min="0" max="24" step="1" placeholder="4"></div>
    <div class="field"><label for="mp-m">Goal time — minutes</label><input type="number" class="input" id="mp-m" min="0" max="59" step="1" placeholder="0"></div>
    <div class="field"><label for="mp-s">Goal time — seconds</label><input type="number" class="input" id="mp-s" min="0" max="59" step="1" placeholder="0"></div>
  </div>
  <div class="error" id="marathon-pace-calculator-error"></div>
  <div class="result" id="mp-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="mp-pacekm">–</div><div class="l">Pace per km</div></div>
      <div class="stat-card"><div class="v" id="mp-pacemi">–</div><div class="l">Pace per mile</div></div>
      <div class="stat-card"><div class="v" id="mp-speed">–</div><div class="l">Avg. speed</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Split</th><th>Target time</th></tr></thead>
      <tbody id="mp-body"><tr><td colspan="2" class="muted">Enter a distance and goal time.</td></tr></tbody>
    </table>
  </div>
</div>
