<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="chord-progression-generator-key">Key</label>
      <select class="select" id="chord-progression-generator-key"></select>
    </div>
    <div class="field">
      <label for="chord-progression-generator-mood">Mood</label>
      <select class="select" id="chord-progression-generator-mood">
        <option value="happy">😊 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="epic">⚔️ Epic</option>
        <option value="chill">🌊 Chill</option>
        <option value="jazzy">🎷 Jazzy</option>
        <option value="dark">🌑 Dark</option>
      </select>
    </div>
    <div class="field">
      <label for="chord-progression-generator-pattern">Progression</label>
      <select class="select" id="chord-progression-generator-pattern"></select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="chord-progression-generator-playall">▶ Play progression</button>
    <button class="btn btn-outline" id="chord-progression-generator-stop">Stop</button>
  </div>
  <div class="result" id="chord-progression-generator-result">
    <div id="chord-progression-generator-chords" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;"></div>
    <p class="muted" id="chord-progression-generator-numerals"></p>
  </div>
  <div class="error" id="chord-progression-generator-error"></div>
  <p class="note">Chords are harmonized from your key with real music theory and synthesized live with WebAudio.</p>
</div>
