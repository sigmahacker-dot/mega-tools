<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="contact-form-generator-title">Title</label>
      <input class="input" id="contact-form-generator-title" value="Get in touch">
    </div>
    <div class="field">
      <label for="contact-form-generator-btn">Button text</label>
      <input class="input" id="contact-form-generator-btn" value="Send message">
    </div>
  </div>
  <div class="grid3">
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-f-name" checked><label for="contact-form-generator-f-name">Name</label></div>
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-f-email" checked><label for="contact-form-generator-f-email">Email</label></div>
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-f-phone"><label for="contact-form-generator-f-phone">Phone</label></div>
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-f-subject" checked><label for="contact-form-generator-f-subject">Subject</label></div>
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-f-message" checked><label for="contact-form-generator-f-message">Message</label></div>
    <div class="field checkline"><input type="checkbox" id="contact-form-generator-required" checked><label for="contact-form-generator-required">Mark fields required</label></div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="contact-form-generator-accent">Accent color</label>
      <input class="input" id="contact-form-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="contact-form-generator-theme">Theme</label>
      <select class="select" id="contact-form-generator-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="contact-form-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:24px 16px;background:#18181b"></div>
  </div>
  <div class="error" id="contact-form-generator-error"></div>
  <div class="field">
    <label for="contact-form-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="contact-form-generator-output" rows="16" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="contact-form-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="contact-form-generator-download">Download contact.html</button>
  </div>
  <p class="note">Front-end markup only — connect the form action to your own backend or form service.</p>
</div>
