<div class="tool-card">
  <div class="field">
    <label for="pdf-page-counter-file">Upload PDF</label>
    <input type="file" class="input" id="pdf-page-counter-file" accept="application/pdf,.pdf">
  </div>
  <div class="error" id="pdf-page-counter-error"></div>
  <div class="result" id="pdf-page-counter-result" hidden>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-page-counter-pages">–</div><div class="l">Pages</div></div>
      <div class="stat-card"><div class="v" id="pdf-page-counter-size">–</div><div class="l">File size</div></div>
      <div class="stat-card"><div class="v" id="pdf-page-counter-enc">–</div><div class="l">Encrypted</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><td>File name</td><td id="pdf-page-counter-name">–</td></tr>
        <tr><td>Page sizes (points)</td><td id="pdf-page-counter-dims">–</td></tr>
        <tr><td>PDF producer</td><td id="pdf-page-counter-producer">–</td></tr>
        <tr><td>Title</td><td id="pdf-page-counter-title">–</td></tr>
      </tbody>
    </table>
  </div>
</div>
