<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:260px;margin:0 auto 12px;text-align:left">
    <label for="date-to-roman-numerals-date">Calendar date</label>
    <input class="input" type="date" id="date-to-roman-numerals-date">
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="date-to-roman-numerals-convert">Convert</button>
  </div>
  <div class="result" id="date-to-roman-numerals-out" style="font-size:30px;font-weight:700;letter-spacing:2px;margin-top:16px"></div>
  <p class="muted" id="date-to-roman-numerals-sub"></p>
  <div class="error" id="date-to-roman-numerals-error"></div>
</div>
