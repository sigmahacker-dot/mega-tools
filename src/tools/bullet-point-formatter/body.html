<div class="tool-card">
  <div class="field">
    <label for="bullet-point-formatter-input">Items (one per line)</label>
    <textarea class="textarea" id="bullet-point-formatter-input" rows="6" placeholder="Apples&#10;Bananas&#10;Cherries"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="bullet-point-formatter-style">Bullet style</label>
      <select class="input" id="bullet-point-formatter-style">
        <option value="•">• Bullet</option>
        <option value="–">– Dash</option>
        <option value="*">* Asterisk</option>
        <option value="→">→ Arrow</option>
        <option value="✓">✓ Check</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="bullet-point-formatter-run">Format</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="bullet-point-formatter-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="bullet-point-formatter-copy">Copy list</button></div>
  </div>
  <div class="error" id="bullet-point-formatter-error"></div>
</div>
