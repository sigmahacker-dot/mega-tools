<div class="tool-card">
  <div class="field">
    <label for="emmet-cheat-sheet-search">Search abbreviations</label>
    <input class="input" id="emmet-cheat-sheet-search" placeholder="e.g. ul>li, input, table…">
    <p class="hint">Click any abbreviation to copy it.</p>
  </div>
  <div class="error" id="emmet-cheat-sheet-error"></div>
  <div id="emmet-cheat-sheet-list"></div>
  <p class="muted hidden" id="emmet-cheat-sheet-none">No abbreviations match your search.</p>
</div>
