<div class="tool-card">
  <h2>Merge PDFs</h2>
  <p class="muted">Select two or more PDF files, arrange them in order, then merge them into a single PDF.</p>
  <div class="field">
    <label for="pdf-merger-files">PDF files</label>
    <input type="file" id="pdf-merger-files" class="input" accept=".pdf,application/pdf" multiple>
  </div>
  <div id="pdf-merger-list" class="file-list"><p class="muted">No files added yet.</p></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="pdf-merger-merge">Merge PDFs</button>
    <button class="btn btn-outline" id="pdf-merger-clear">Clear list</button>
  </div>
  <div class="progress mt hidden" id="pdf-merger-progress"><div style="width:0%"></div></div>
  <div class="error" id="pdf-merger-error"></div>
  <div class="result hidden" id="pdf-merger-result"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
