<div class="tool-card">
  <div class="field">
    <label for="article-rewriter-input">Original article</label>
    <textarea class="textarea" id="article-rewriter-input" rows="10" placeholder="Paste your article here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="article-rewriter-rewrite" type="button">Rewrite Article</button>
    <button class="btn btn-outline" id="article-rewriter-copy" type="button">Copy Result</button>
    <button class="btn btn-outline" id="article-rewriter-download" type="button">Download .txt</button>
    <button class="btn btn-outline" id="article-rewriter-clear" type="button">Clear</button>
  </div>
  <div class="error" id="article-rewriter-error"></div>
  <div class="field mt">
    <label>Rewritten article</label>
    <div class="result" id="article-rewriter-output">Your rewritten article will appear here...</div>
  </div>
  <div class="stat-cards mt hidden" id="article-rewriter-stats">
    <div class="stat-card"><div class="v" id="article-rewriter-changed">0</div><div class="l">Words changed</div></div>
    <div class="stat-card"><div class="v" id="article-rewriter-total">0</div><div class="l">Total words</div></div>
    <div class="stat-card"><div class="v" id="article-rewriter-pct">0%</div><div class="l">Changed</div></div>
  </div>
  <p class="note">Basic synonym-based rewriting — always review the output before publishing.</p>
</div>
