<div class="tool-card">
  <div class="grid2">
    <div style="border:1px solid #e0e0e0;border-radius:10px;padding:12px;text-align:center">
      <h3 style="margin:0 0 8px">🧺 Washer</h3>
      <div class="field" style="text-align:left">
        <label for="laundry-timer-w-preset">Preset</label>
        <select class="input" id="laundry-timer-w-preset">
          <option value="35">Normal — 35 min</option>
          <option value="45">Heavy — 45 min</option>
          <option value="60">Deep clean — 60 min</option>
        </select>
      </div>
      <div class="field" style="text-align:left">
        <label for="laundry-timer-w-custom">Custom (min)</label>
        <input class="input" type="number" id="laundry-timer-w-custom" min="1" max="300" placeholder="optional">
      </div>
      <div class="countdown-digits"><div class="cd-cell"><span id="laundry-timer-w-clock">0:00</span></div></div>
      <div class="btn-row" style="justify-content:center;margin-top:8px">
        <button class="btn btn-primary" id="laundry-timer-w-start">Start</button>
        <button class="btn btn-outline" id="laundry-timer-w-reset">Reset</button>
      </div>
    </div>
    <div style="border:1px solid #e0e0e0;border-radius:10px;padding:12px;text-align:center">
      <h3 style="margin:0 0 8px">🌀 Dryer</h3>
      <div class="field" style="text-align:left">
        <label for="laundry-timer-d-preset">Preset</label>
        <select class="input" id="laundry-timer-d-preset">
          <option value="45">Normal — 45 min</option>
          <option value="60">Heavy — 60 min</option>
          <option value="90">Bulky — 90 min</option>
        </select>
      </div>
      <div class="field" style="text-align:left">
        <label for="laundry-timer-d-custom">Custom (min)</label>
        <input class="input" type="number" id="laundry-timer-d-custom" min="1" max="300" placeholder="optional">
      </div>
      <div class="countdown-digits"><div class="cd-cell"><span id="laundry-timer-d-clock">0:00</span></div></div>
      <div class="btn-row" style="justify-content:center;margin-top:8px">
        <button class="btn btn-primary" id="laundry-timer-d-start">Start</button>
        <button class="btn btn-outline" id="laundry-timer-d-reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="error" id="laundry-timer-error"></div>
</div>
