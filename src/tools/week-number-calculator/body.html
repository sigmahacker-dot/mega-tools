<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="week-number-calculator-date">Date</label>
      <input type="date" class="input" id="week-number-calculator-date">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" id="week-number-calculator-go">Calculate</button>
    </div>
  </div>
  <div class="error" id="week-number-calculator-error"></div>
  <div class="result" id="week-number-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="week-number-calculator-week">&ndash;</div><div class="l">ISO week</div></div>
      <div class="stat-card"><div class="v" id="week-number-calculator-doy">&ndash;</div><div class="l">Day of year</div></div>
      <div class="stat-card"><div class="v" id="week-number-calculator-q">&ndash;</div><div class="l">Quarter</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Week-year</th><td id="week-number-calculator-wy">&ndash;</td></tr>
        <tr><th scope="row">Weekday</th><td id="week-number-calculator-wd">&ndash;</td></tr>
        <tr><th scope="row">Days remaining in year</th><td id="week-number-calculator-rem">&ndash;</td></tr>
      </tbody>
    </table>
    <p class="note">ISO-8601: week 1 is the week containing the year's first Thursday.</p>
  </div>
</div>
