<div class="tool-card">
  <div class="field">
    <label for="binary-text-converter-mode">Conversion direction</label>
    <select class="select" id="binary-text-converter-mode">
      <option value="t2b">Text → Binary (8-bit groups)</option>
      <option value="t2h">Text → Hexadecimal</option>
      <option value="b2t">Binary → Text</option>
      <option value="h2t">Hexadecimal → Text</option>
    </select>
  </div>
  <div class="field">
    <label for="binary-text-converter-in">Input</label>
    <textarea class="textarea" id="binary-text-converter-in" rows="4" placeholder="Type or paste here…" spellcheck="false"></textarea>
  </div>
  <div class="error" id="binary-text-converter-error"></div>
  <div class="result" id="binary-text-converter-result">
  <div class="field">
    <label for="binary-text-converter-out">Output</label>
    <textarea class="textarea" id="binary-text-converter-out" rows="4" readonly spellcheck="false"></textarea>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="binary-text-converter-copy">Copy output</button>
    <button type="button" class="btn btn-outline btn-sm" id="binary-text-converter-swap">Swap direction</button>
  </div>
  </div>
  <p class="note">UTF-8 is used throughout, so emoji and non-Latin text convert correctly.</p>
</div>
