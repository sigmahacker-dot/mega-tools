<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="id-badge-maker-file">Headshot photo</label>
      <input type="file" id="id-badge-maker-file" accept="image/*" class="input">
    </div>
    <div class="field">
      <label for="id-badge-maker-company">Company / org</label>
      <input type="text" id="id-badge-maker-company" class="input" value="ACME CORP" maxlength="30">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="id-badge-maker-name">Full name</label>
      <input type="text" id="id-badge-maker-name" class="input" value="Alex Morgan" maxlength="30">
    </div>
    <div class="field">
      <label for="id-badge-maker-role">Role</label>
      <input type="text" id="id-badge-maker-role" class="input" value="Event Staff" maxlength="30">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="id-badge-maker-idnum">ID number</label>
      <input type="text" id="id-badge-maker-idnum" class="input" value="ID-004213" maxlength="20">
    </div>
    <div class="field">
      <label for="id-badge-maker-color">Theme color</label>
      <input type="color" id="id-badge-maker-color" class="input" value="#166534" style="height:42px;padding:4px;">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="id-badge-maker-download">Download badge</button>
  </div>
  <div class="result">
    <canvas id="id-badge-maker-canvas" style="width:100%;max-width:320px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.25);"></canvas>
  </div>
  <div class="error" id="id-badge-maker-error"></div>
  <p class="note">For novelty, events, cosplay and mockups — not a real credential. The striped code is decorative. Your photo never leaves your browser.</p>
</div>
