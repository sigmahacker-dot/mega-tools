<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="justify-content:center;margin-bottom:12px">
    <button class="btn btn-outline" data-nap="10">10 min</button>
    <button class="btn btn-outline" data-nap="20">20 min</button>
    <button class="btn btn-outline" data-nap="26">26 min</button>
    <button class="btn btn-outline" data-nap="90">90 min</button>
  </div>
  <div class="field" style="max-width:220px;margin:0 auto 12px;text-align:left">
    <label for="nap-timer-custom">Custom (minutes)</label>
    <input class="input" type="number" id="nap-timer-custom" min="1" max="480" placeholder="e.g. 45">
  </div>
  <div class="countdown-digits" style="margin-bottom:8px"><div class="cd-cell"><span id="nap-timer-clock">0:00:00</span></div></div>
  <p class="muted" id="nap-timer-status" style="min-height:24px">Choose a length, then start your nap. 😴</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="nap-timer-start">Start nap</button>
    <button class="btn btn-outline" id="nap-timer-stop">Stop</button>
  </div>
  <div class="error" id="nap-timer-error"></div>
</div>
