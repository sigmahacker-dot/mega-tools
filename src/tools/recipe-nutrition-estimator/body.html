<div class="tool-card">
  <div class="field">
    <label for="recipe-nutrition-estimator-ingredients">Ingredients (one per line)</label>
    <textarea class="textarea" id="recipe-nutrition-estimator-ingredients" rows="7" placeholder="200g chicken breast&#10;150g white rice (cooked)&#10;1 tbsp olive oil&#10;100g broccoli"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="recipe-nutrition-estimator-servings">Servings</label>
      <input type="number" class="input" id="recipe-nutrition-estimator-servings" min="1" step="1" value="2">
    </div>
    <div class="field" style="display:flex;align-items:flex-end">
      <button class="btn" id="recipe-nutrition-estimator-go" type="button">Estimate nutrition</button>
    </div>
  </div>
  <div class="error" id="recipe-nutrition-estimator-error"></div>
  <div class="result" id="recipe-nutrition-estimator-result">
    <div id="recipe-nutrition-estimator-out"></div>
    <p class="note">Estimates from typical per-100g values. For information only &mdash; not medical advice.</p>
  </div>
</div>
