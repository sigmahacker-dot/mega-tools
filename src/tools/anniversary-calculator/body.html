<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="anniversary-calculator-date">Original date</label>
      <input type="date" class="input" id="anniversary-calculator-date">
    </div>
  </div>
  <div class="error" id="anniversary-calculator-error"></div>
  <div class="result" id="anniversary-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="anniversary-calculator-until">–</div><div class="l">Days until next</div></div>
      <div class="stat-card"><div class="v" id="anniversary-calculator-num">–</div><div class="l">Next anniversary</div></div>
      <div class="stat-card"><div class="v" id="anniversary-calculator-total">–</div><div class="l">Total days elapsed</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Detail</th><th>Value</th></tr></thead>
      <tbody id="anniversary-calculator-body">
        <tr><td colspan="2" class="muted">Enter the original date to track the anniversary.</td></tr>
      </tbody>
    </table>
  </div>
</div>
