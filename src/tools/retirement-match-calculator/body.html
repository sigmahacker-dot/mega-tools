<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="retirement-match-calculator-salary">Salary ($/yr)</label>
      <input type="number" class="input" id="retirement-match-calculator-salary" min="0" step="any" placeholder="90000">
    </div>
    <div class="field">
      <label for="retirement-match-calculator-contrib">Your contribution (%)</label>
      <input type="number" class="input" id="retirement-match-calculator-contrib" min="0" max="100" step="any" placeholder="6">
    </div>
    <div class="field">
      <label for="retirement-match-calculator-rate">Employer match rate (%)</label>
      <input type="number" class="input" id="retirement-match-calculator-rate" min="0" max="100" step="any" placeholder="50">
    </div>
    <div class="field">
      <label for="retirement-match-calculator-cap">Match applies to first (%) of salary</label>
      <input type="number" class="input" id="retirement-match-calculator-cap" min="0" max="100" step="any" placeholder="6">
    </div>
  </div>
  <div class="error" id="retirement-match-calculator-error"></div>
  <div class="result" id="retirement-match-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="retirement-match-calculator-yours">&ndash;</div><div class="l">Your contribution</div></div>
      <div class="stat-card"><div class="v" id="retirement-match-calculator-employer">&ndash;</div><div class="l">Employer match</div></div>
      <div class="stat-card"><div class="v" id="retirement-match-calculator-total">&ndash;</div><div class="l">Combined / yr</div></div>
      <div class="stat-card"><div class="v" id="retirement-match-calculator-freepct">&ndash;</div><div class="l">Match as % of salary</div></div>
    </div>
    <p class="note" id="retirement-match-calculator-note"></p>
    <p class="note">For information only &mdash; not financial advice. Match dollars may vest over time.</p>
  </div>
</div>
