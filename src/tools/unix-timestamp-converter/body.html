<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="unix-timestamp-converter-ts">Unix timestamp</label>
      <input type="text" class="input" id="unix-timestamp-converter-ts" placeholder="e.g. 1727740800" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="unix-timestamp-converter-dt">Date and time</label>
      <input type="datetime-local" class="input" id="unix-timestamp-converter-dt">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary btn-sm" id="unix-timestamp-converter-now">Use now</button>
  </div>
  <div class="error" id="unix-timestamp-converter-error"></div>
  <div class="result" id="unix-timestamp-converter-result">
    <table class="data">
      <tbody>
        <tr><th scope="row">UTC</th><td id="unix-timestamp-converter-utc">–</td></tr>
        <tr><th scope="row">Local time</th><td id="unix-timestamp-converter-local">–</td></tr>
        <tr><th scope="row">ISO 8601</th><td id="unix-timestamp-converter-iso">–</td></tr>
        <tr><th scope="row">Seconds</th><td id="unix-timestamp-converter-sec">–</td></tr>
        <tr><th scope="row">Milliseconds</th><td id="unix-timestamp-converter-ms">–</td></tr>
      </tbody>
    </table>
    <p class="note">Values ≥ 1,000,000,000,000 are read as milliseconds, smaller values as seconds.</p>
  </div>
</div>
