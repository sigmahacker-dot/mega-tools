<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="gym-plate-calculator-bar">Bar weight</label>
      <select class="input" id="gym-plate-calculator-bar">
        <option value="20">20 kg (Olympic men's)</option>
        <option value="15">15 kg (Olympic women's)</option>
      </select>
    </div>
    <div class="field">
      <label for="gym-plate-calculator-target">Target total weight (kg)</label>
      <input class="input" id="gym-plate-calculator-target" type="number" min="1" step="0.5" placeholder="e.g. 100">
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="gym-plate-calculator-calc">Calculate plates</button></div>
  <div class="stat-cards hidden" id="gym-plate-calculator-out">
    <div class="stat-card"><div class="v" id="gym-plate-calculator-side">–</div><div class="l">Per side (kg)</div></div>
    <div class="stat-card"><div class="v" id="gym-plate-calculator-total">–</div><div class="l">Loaded total (kg)</div></div>
  </div>
  <div class="result hidden" id="gym-plate-calculator-plates"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Always use collars and load both sides evenly.</p>
  <div class="error" id="gym-plate-calculator-error"></div>
</div>
