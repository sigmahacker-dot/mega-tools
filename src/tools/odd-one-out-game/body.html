<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="odd-one-out-game-level">1</div><div class="l">Level</div></div>
    <div class="stat-card"><div class="v" id="odd-one-out-game-time">15</div><div class="l">Seconds left</div></div>
    <div class="stat-card"><div class="v" id="odd-one-out-game-best">0</div><div class="l">Best level</div></div>
  </div>
  <div id="odd-one-out-game-board" style="display:grid;gap:8px;max-width:400px;margin:0 auto"></div>
  <p class="muted" id="odd-one-out-game-msg" style="min-height:24px;margin:12px 0">Find the different emoji!</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="odd-one-out-game-start">Start</button>
  </div>
  <div class="error" id="odd-one-out-game-error"></div>
</div>
