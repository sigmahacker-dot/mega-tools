<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="wo-goal">Goal</label>
      <select class="select" id="wo-goal">
        <option value="strength">Build strength</option>
        <option value="muscle">Build muscle</option>
        <option value="fat">Lose fat</option>
        <option value="endurance">Endurance</option>
      </select>
    </div>
    <div class="field"><label for="wo-days">Training days / week</label>
      <select class="select" id="wo-days"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    </div>
    <div class="field"><label for="wo-equip">Equipment</label>
      <select class="select" id="wo-equip">
        <option value="gym">Full gym</option>
        <option value="dumbbell">Dumbbells only</option>
        <option value="body">Bodyweight</option>
      </select>
    </div>
    <div class="field"><label for="wo-level">Level</label>
      <select class="select" id="wo-level"><option value="beginner">Beginner</option><option value="inter">Intermediate</option></select>
    </div>
  </div>
  <div class="error" id="workout-plan-generator-error"></div>
  <div class="result" id="wo-result">
    <div id="wo-plan"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="wo-go" type="button">Generate program</button>
      <button class="btn btn-outline" id="wo-dl" type="button">Download .txt</button>
    </div>
  </div>
</div>
