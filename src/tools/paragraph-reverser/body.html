<div class="tool-card">
  <div class="field">
    <label for="paragraph-reverser-input">Your text</label>
    <textarea class="textarea" id="paragraph-reverser-input" rows="8" placeholder="Paste paragraphs here..."></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="paragraph-reverser-mode">Reverse mode</label>
      <select class="select" id="paragraph-reverser-mode">
        <option value="para">Paragraph order</option>
        <option value="line">Line order</option>
        <option value="word">Word order (within each paragraph)</option>
      </select>
    </div>
  </div>
  <div class="error" id="paragraph-reverser-error"></div>
  <div class="field mt">
    <label for="paragraph-reverser-output">Reversed result</label>
    <textarea class="textarea" id="paragraph-reverser-output" rows="8" readonly placeholder="Reversed text appears here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="paragraph-reverser-copy" type="button">Copy result</button>
    <button class="btn btn-outline btn-sm" id="paragraph-reverser-clear" type="button">Clear</button>
  </div>
</div>
