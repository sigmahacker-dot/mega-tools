<div class="tool-card">
  <div class="field">
    <label for="iso8601-converter-local">Local datetime</label>
    <input type="datetime-local" class="input" id="iso8601-converter-local">
  </div>
  <div class="field">
    <label for="iso8601-converter-iso">ISO 8601 string</label>
    <input class="input" id="iso8601-converter-iso" placeholder="2026-10-01T09:30:00Z">
  </div>
  <div class="field">
    <label for="iso8601-converter-ts">Unix timestamp</label>
    <input class="input" id="iso8601-converter-ts" placeholder="1759295400 (seconds) or 1759295400000 (ms)">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="iso8601-converter-convert">Convert</button>
    <button class="btn btn-outline" id="iso8601-converter-now">Use now</button>
  </div>
  <div class="error" id="iso8601-converter-error"></div>
  <div class="result hidden" id="iso8601-converter-result">
    <table class="data" id="iso8601-converter-table"></table>
  </div>
</div>
