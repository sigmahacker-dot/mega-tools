<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="never-have-i-ever-prompts-draw" type="button">Draw a Prompt</button>
    <button class="btn btn-outline" id="never-have-i-ever-prompts-shuffle" type="button">Shuffle Deck</button>
  </div>
  <div class="error" id="never-have-i-ever-prompts-error"></div>
  <div class="result" id="never-have-i-ever-prompts-card" style="margin:14px auto;max-width:560px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;padding:24px">Press Draw to flip the first card.</div>
  <p class="muted"><span id="never-have-i-ever-prompts-left">90</span> prompts left in the deck</p>
</div>
