<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="engagement-rate-calculator-likes">Likes</label>
      <input class="input" type="number" id="engagement-rate-calculator-likes" min="0" placeholder="1200">
    </div>
    <div class="field">
      <label for="engagement-rate-calculator-comments">Comments</label>
      <input class="input" type="number" id="engagement-rate-calculator-comments" min="0" placeholder="80">
    </div>
    <div class="field">
      <label for="engagement-rate-calculator-shares">Shares / saves</label>
      <input class="input" type="number" id="engagement-rate-calculator-shares" min="0" placeholder="40">
    </div>
    <div class="field">
      <label for="engagement-rate-calculator-followers">Followers</label>
      <input class="input" type="number" id="engagement-rate-calculator-followers" min="0" placeholder="50000">
    </div>
    <div class="field">
      <label for="engagement-rate-calculator-reach">Reach (optional)</label>
      <input class="input" type="number" id="engagement-rate-calculator-reach" min="0" placeholder="30000">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="engagement-rate-calculator-calc">Calculate</button>
  </div>
  <div class="error" id="engagement-rate-calculator-error"></div>
</div>

<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="engagement-rate-calculator-erf">—</div><div class="l">ER by followers</div></div>
    <div class="stat-card"><div class="v" id="engagement-rate-calculator-err">—</div><div class="l">ER by reach</div></div>
    <div class="stat-card"><div class="v" id="engagement-rate-calculator-rating">—</div><div class="l">Rating</div></div>
  </div>
  <div class="result" id="engagement-rate-calculator-detail"></div>
</div>
