<div class="tool-card">
  <div class="field">
    <label for="joke-generator-category">Category</label>
    <select class="select" id="joke-generator-category">
      <option value="all">All categories</option>
      <option value="animals">Animals</option>
      <option value="food">Food</option>
      <option value="school">School</option>
      <option value="science">Science</option>
      <option value="general">General</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="joke-generator-generate" type="button">Tell Me Jokes</button>
  </div>
  <div class="error" id="joke-generator-error"></div>
  <div class="mt" id="joke-generator-list"></div>
</div>
