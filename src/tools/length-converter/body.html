<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="length-converter-value">Value</label>
      <input type="number" step="any" class="input" id="length-converter-value" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="length-converter-from">From</label>
      <select class="select" id="length-converter-from">
        <option value="mm">Millimeters (mm)</option>
        <option value="cm">Centimeters (cm)</option>
        <option value="m" selected>Meters (m)</option>
        <option value="km">Kilometers (km)</option>
        <option value="in">Inches (in)</option>
        <option value="ft">Feet (ft)</option>
        <option value="yd">Yards (yd)</option>
        <option value="mi">Miles (mi)</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="length-converter-to">To</label>
      <select class="select" id="length-converter-to">
        <option value="mm">Millimeters (mm)</option>
        <option value="cm">Centimeters (cm)</option>
        <option value="m">Meters (m)</option>
        <option value="km">Kilometers (km)</option>
        <option value="in">Inches (in)</option>
        <option value="ft" selected>Feet (ft)</option>
        <option value="yd">Yards (yd)</option>
        <option value="mi">Miles (mi)</option>
      </select>
    </div>
    <div class="field">
      <label aria-hidden="true">&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-outline" id="length-converter-swap" type="button">⇄ Swap units</button>
      </div>
    </div>
  </div>
  <div class="error" id="length-converter-error"></div>
  <div class="result" id="length-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="length-converter-result-value">–</div><div class="l">Result</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="length-converter-table"></tbody>
    </table>
  </div>
</div>
