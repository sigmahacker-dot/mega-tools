<div class="tool-card">
  <h2>LinkedIn Text Formatter</h2>
  <p class="muted">Unicode bold and italic styling for LinkedIn posts — the style travels with the characters.</p>
  <div class="field">
    <label for="linkedin-text-formatter-input">Your text</label>
    <textarea class="textarea" id="linkedin-text-formatter-input" rows="4" placeholder="Type the text to style..."></textarea>
  </div>
  <div class="error" id="linkedin-text-formatter-error"></div>
  <div class="result" id="linkedin-text-formatter-result">
    <div id="linkedin-text-formatter-outputs"></div>
    <p class="note">This is Unicode styling, not real formatting — it works anywhere plain text works, including LinkedIn posts and comments.</p>
  </div>
</div>
