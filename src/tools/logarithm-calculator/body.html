<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="logarithm-calculator-x">Number (x)</label>
      <input type="number" class="input" id="logarithm-calculator-x" step="any" min="0" placeholder="e.g. 100">
    </div>
    <div class="field">
      <label for="logarithm-calculator-base">Logarithm base</label>
      <select class="select" id="logarithm-calculator-base">
        <option value="10">10 (common log)</option>
        <option value="e">e ≈ 2.71828 (natural log)</option>
        <option value="2">2 (binary log)</option>
        <option value="custom">Custom base…</option>
      </select>
    </div>
    <div class="field" id="logarithm-calculator-customwrap" style="display:none;">
      <label for="logarithm-calculator-custom">Custom base</label>
      <input type="number" class="input" id="logarithm-calculator-custom" step="any" min="0" placeholder="e.g. 5">
    </div>
  </div>
  <div class="error" id="logarithm-calculator-error"></div>
  <div class="result" id="logarithm-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="logarithm-calculator-main">–</div><div class="l" id="logarithm-calculator-mainlabel">log₁₀(x)</div></div>
      <div class="stat-card"><div class="v" id="logarithm-calculator-ln">–</div><div class="l">ln(x)</div></div>
      <div class="stat-card"><div class="v" id="logarithm-calculator-log2">–</div><div class="l">log₂(x)</div></div>
    </div>
    <p class="note" id="logarithm-calculator-steps">Enter a positive number to compute its logarithm.</p>
  </div>
</div>
