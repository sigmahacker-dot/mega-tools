<div class="tool-card">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px">
    <fieldset style="border:1px solid #ddd;border-radius:8px;padding:12px">
      <legend><b>Lease</b></legend>
      <div class="field"><label for="car-lease-vs-buy-calculator-ldown">Down payment ($)</label><input class="input" id="car-lease-vs-buy-calculator-ldown" type="number" min="0" step="any" value="2000"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-lmonthly">Monthly payment ($)</label><input class="input" id="car-lease-vs-buy-calculator-lmonthly" type="number" min="0" step="any" value="350"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-lmonths">Lease months</label><input class="input" id="car-lease-vs-buy-calculator-lmonths" type="number" min="1" step="1" value="36"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-ldisp">Disposition fee ($)</label><input class="input" id="car-lease-vs-buy-calculator-ldisp" type="number" min="0" step="any" value="400"></div>
    </fieldset>
    <fieldset style="border:1px solid #ddd;border-radius:8px;padding:12px">
      <legend><b>Buy</b></legend>
      <div class="field"><label for="car-lease-vs-buy-calculator-bprice">Purchase price ($)</label><input class="input" id="car-lease-vs-buy-calculator-bprice" type="number" min="0" step="any" value="30000"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-bdown">Down payment ($)</label><input class="input" id="car-lease-vs-buy-calculator-bdown" type="number" min="0" step="any" value="3000"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-brate">Loan rate (% APR)</label><input class="input" id="car-lease-vs-buy-calculator-brate" type="number" min="0" step="any" value="7"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-bterm">Loan term (months)</label><input class="input" id="car-lease-vs-buy-calculator-bterm" type="number" min="1" step="1" value="60"></div>
      <div class="field"><label for="car-lease-vs-buy-calculator-bresale">Resale value after term ($)</label><input class="input" id="car-lease-vs-buy-calculator-bresale" type="number" min="0" step="any" value="18000"></div>
    </fieldset>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="car-lease-vs-buy-calculator-calc">Compare</button></div>
  <div class="error" id="car-lease-vs-buy-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="car-lease-vs-buy-calculator-lease">—</div><div class="l">Total lease cost</div></div>
    <div class="stat-card"><div class="v" id="car-lease-vs-buy-calculator-buy">—</div><div class="l">Total buy cost</div></div>
    <div class="stat-card"><div class="v" id="car-lease-vs-buy-calculator-diff">—</div><div class="l">Difference</div></div>
  </div>
  <p class="note" id="car-lease-vs-buy-calculator-verdict"></p>
</div>
