<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="hexadecimal-calculator-a">Hex A</label><input class="input" id="hexadecimal-calculator-a" type="text" value="1F4"></div>
    <div class="field"><label for="hexadecimal-calculator-b">Hex B</label><input class="input" id="hexadecimal-calculator-b" type="text" value="2A"></div>
    <div class="field"><label for="hexadecimal-calculator-op">Operation</label>
      <select class="input" id="hexadecimal-calculator-op"><option value="+">Add (+)</option><option value="-">Subtract (\u2212)</option></select>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="hexadecimal-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="hexadecimal-calculator-hex" style="font-size:1.1rem">21E</div><div class="l">Hex result</div></div>
    <div class="stat-card"><div class="v" id="hexadecimal-calculator-dec">542</div><div class="l">Decimal result</div></div>
  </div>
  <div class="result"><pre class="code" id="hexadecimal-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="hexadecimal-calculator-error"></div>
</div>
