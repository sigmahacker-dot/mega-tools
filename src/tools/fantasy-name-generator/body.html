<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="fantasy-name-generator-style">Style</label>
      <select class="select" id="fantasy-name-generator-style">
        <option value="male">Male names</option>
        <option value="female">Female names</option>
        <option value="place">Place names</option>
      </select>
    </div>
    <div class="field">
      <label for="fantasy-name-generator-length">Length</label>
      <select class="select" id="fantasy-name-generator-length">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="fantasy-name-generator-count">How many</label>
    <select class="select" id="fantasy-name-generator-count">
      <option value="1">1 name</option>
      <option value="10" selected>10 names</option>
      <option value="25">25 names</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="fantasy-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="fantasy-name-generator-error"></div>
  <div class="mt" id="fantasy-name-generator-list"></div>
</div>
