<div class="tool-card">
  <div class="field">
    <label for="passive-voice-highlighter-input">Your text</label>
    <textarea class="textarea" id="passive-voice-highlighter-input" rows="8" placeholder="Paste your writing here..."></textarea>
  </div>
  <div class="error" id="passive-voice-highlighter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="passive-voice-highlighter-count">0</div><div class="l">Passive hits</div></div>
    <div class="stat-card"><div class="v" id="passive-voice-highlighter-ratio">0%</div><div class="l">Of sentences flagged</div></div>
  </div>
  <div class="result mt">
    <div id="passive-voice-highlighter-out" class="muted" style="white-space:pre-wrap;line-height:1.8;">Highlights appear here as you type.</div>
    <p class="note">Heuristic highlighter: a form of "be" + past participle (-ed/-en ending or a known irregular like "written"). Review each hit — adjectives such as "was tired" can be false positives.</p>
  </div>
</div>
