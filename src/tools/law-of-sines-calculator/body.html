<div class="tool-card">
  <div class="field"><label for="law-of-sines-calculator-case">Known case</label>
    <select class="input" id="law-of-sines-calculator-case">
      <option value="AAS">AAS — two angles + a non-included side (A, B, a)</option>
      <option value="ASA">ASA — two angles + included side (A, B, c)</option>
      <option value="SSA">SSA — two sides + non-included angle (a, b, A) — ambiguous</option>
    </select>
  </div>
  <div class="grid2" id="law-of-sines-calculator-fields">
    <div class="field"><label id="law-of-sines-calculator-l1" for="law-of-sines-calculator-v1">A (deg)</label><input class="input" id="law-of-sines-calculator-v1" type="number" value="40"></div>
    <div class="field"><label id="law-of-sines-calculator-l2" for="law-of-sines-calculator-v2">B (deg)</label><input class="input" id="law-of-sines-calculator-v2" type="number" value="60"></div>
    <div class="field"><label id="law-of-sines-calculator-l3" for="law-of-sines-calculator-v3">a</label><input class="input" id="law-of-sines-calculator-v3" type="number" value="10"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="law-of-sines-calculator-go">Solve triangle</button></div>
  <div class="result"><pre class="code" id="law-of-sines-calculator-out" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="law-of-sines-calculator-error"></div>
</div>
