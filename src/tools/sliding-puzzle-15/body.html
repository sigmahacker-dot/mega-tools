<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="sliding-puzzle-15-moves">0</div><div class="l">Moves</div></div>
    <div class="stat-card"><div class="v" id="sliding-puzzle-15-best">—</div><div class="l">Best</div></div>
  </div>
  <p class="muted" id="sliding-puzzle-15-msg" style="min-height:24px">Tap a tile next to the gap to slide it.</p>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="sliding-puzzle-15-board" style="display:inline-grid;grid-template-columns:repeat(4,72px);gap:6px;background:#8d6e63;padding:8px;border-radius:10px"></div>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="sliding-puzzle-15-new">New game</button>
  </div>
  <div class="error" id="sliding-puzzle-15-error"></div>
</div>
