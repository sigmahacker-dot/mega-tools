<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="r72-rate">Annual interest rate (%)</label><input type="number" class="input" id="r72-rate" min="0" step="any" placeholder="8"></div>
    <div class="field"><label for="r72-years">Target years to double</label><input type="number" class="input" id="r72-years" min="0" step="any" placeholder="10"></div>
  </div>
  <div class="error" id="rule-of-72-calculator-error"></div>
  <div class="result" id="r72-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="r72-double">–</div><div class="l">Years to double</div></div>
      <div class="stat-card"><div class="v" id="r72-triple">–</div><div class="l">Years to triple</div></div>
      <div class="stat-card"><div class="v" id="r72-need">–</div><div class="l">Rate to double in target</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Milestone</th><th>Rule estimate</th><th>Exact</th></tr></thead>
      <tbody id="r72-body"><tr><td colspan="3" class="muted">Enter a rate or a target time.</td></tr></tbody>
    </table>
    <p class="note">Rule estimates vs exact ln-based compounding. Assumes a constant annual rate.</p>
  </div>
</div>
