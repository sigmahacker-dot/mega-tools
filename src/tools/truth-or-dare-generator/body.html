<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:520px;margin:0 auto">
    <div class="field">
      <label for="truth-or-dare-generator-type">Pick</label>
      <select class="select" id="truth-or-dare-generator-type">
        <option value="truth">Truth</option>
        <option value="dare">Dare</option>
        <option value="random">Random</option>
      </select>
    </div>
    <div class="field">
      <label for="truth-or-dare-generator-level">Level</label>
      <select class="select" id="truth-or-dare-generator-level">
        <option value="mild">Mild</option>
        <option value="wild">Wild</option>
      </select>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="truth-or-dare-generator-draw" type="button">Draw Card</button>
    <button class="btn btn-outline" id="truth-or-dare-generator-shuffle" type="button">Reshuffle</button>
  </div>
  <div class="error" id="truth-or-dare-generator-error"></div>
  <div class="result" id="truth-or-dare-generator-card" style="margin:14px auto;max-width:560px;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;padding:24px">Choose truth or dare, then draw.</div>
  <p class="muted">Golden rule: anyone can skip any card, no questions asked.</p>
</div>
