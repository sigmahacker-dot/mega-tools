<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="lorem-ipsum-generator-count">Amount</label>
      <input class="input" id="lorem-ipsum-generator-count" type="number" min="1" max="500" value="3">
    </div>
    <div class="field">
      <label for="lorem-ipsum-generator-type">Type</label>
      <select class="select" id="lorem-ipsum-generator-type">
        <option value="paragraphs">Paragraphs</option>
        <option value="words">Words</option>
        <option value="sentences">Sentences</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="lorem-ipsum-generator-generate" type="button">Generate</button>
    <button class="btn btn-outline" id="lorem-ipsum-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline" id="lorem-ipsum-generator-download" type="button">Download .txt</button>
  </div>
  <div class="error" id="lorem-ipsum-generator-error"></div>
  <div class="field mt">
    <label>Generated text</label>
    <div class="result" id="lorem-ipsum-generator-output">Click Generate to create lorem ipsum text...</div>
  </div>
</div>
