<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="navbar-snippet-generator-brand">Brand name</label>
      <input class="input" id="navbar-snippet-generator-brand" value="Acme">
    </div>
    <div class="field">
      <label for="navbar-snippet-generator-cta">CTA button text (blank = none)</label>
      <input class="input" id="navbar-snippet-generator-cta" value="Get started">
    </div>
  </div>
  <div class="field">
    <label for="navbar-snippet-generator-links">Links (one per line: "Label|/path")</label>
    <textarea class="textarea" id="navbar-snippet-generator-links" rows="4">Home|/
Features|/features
Pricing|/pricing
Blog|/blog
Contact|/contact</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="navbar-snippet-generator-bg">Background</label>
      <input class="input" id="navbar-snippet-generator-bg" type="color" value="#18181b">
    </div>
    <div class="field">
      <label for="navbar-snippet-generator-accent">Accent (CTA + hover)</label>
      <input class="input" id="navbar-snippet-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="navbar-snippet-generator-text">Text color</label>
      <input class="input" id="navbar-snippet-generator-text" type="color" value="#f4f4f5">
    </div>
  </div>
  <div class="field checkline">
    <input type="checkbox" id="navbar-snippet-generator-sticky" checked>
    <label for="navbar-snippet-generator-sticky">Sticky navbar (stays on top while scrolling)</label>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="navbar-snippet-generator-preview" style="border:1px solid #27272a;border-radius:12px;overflow:hidden;background:#0e0e10"></div>
  </div>
  <div class="error" id="navbar-snippet-generator-error"></div>
  <div class="field">
    <label for="navbar-snippet-generator-output">HTML + CSS + JS</label>
    <textarea class="textarea" id="navbar-snippet-generator-output" rows="16" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="navbar-snippet-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="navbar-snippet-generator-download">Download navbar.html</button>
  </div>
</div>
