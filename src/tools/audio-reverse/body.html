<div class="tool-card">
  <div class="dropzone" id="audio-reverse-drop">
    <span class="dz-icon">⏪</span>
    <strong>Drop an audio file here</strong> or click to browse
    <input type="file" id="audio-reverse-file" accept="audio/*" class="hidden">
  </div>
  <div class="stat-cards hidden" id="audio-reverse-stats">
    <div class="stat-card"><div class="v" id="audio-reverse-duration">0:00</div><div class="l">Duration</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="audio-reverse-preview">Preview</button>
    <button class="btn btn-primary" id="audio-reverse-go">Reverse &amp; download WAV</button>
  </div>
  <div class="error" id="audio-reverse-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
