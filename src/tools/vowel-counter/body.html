<div class="tool-card">
  <div class="field">
    <label for="vowel-counter-input">Your text</label>
    <textarea class="textarea" id="vowel-counter-input" rows="5" placeholder="Type or paste text — counts update live…"></textarea>
  </div>
  <div class="error" id="vowel-counter-error"></div>
  <div class="stat-cards" id="vowel-counter-cards">
    <div class="stat-card"><div class="v" id="vowel-counter-a">0</div><div class="l">A</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-e">0</div><div class="l">E</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-i">0</div><div class="l">I</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-o">0</div><div class="l">O</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-u">0</div><div class="l">U</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-total">0</div><div class="l">Total vowels</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-ratio">0%</div><div class="l">Vowel ratio</div></div>
    <div class="stat-card"><div class="v" id="vowel-counter-letters">0</div><div class="l">Letters</div></div>
  </div>
</div>
