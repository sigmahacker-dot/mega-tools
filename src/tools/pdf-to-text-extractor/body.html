<div class="tool-card">
  <div class="field">
    <label for="pdf-to-text-extractor-file">Upload PDF</label>
    <input type="file" class="input" id="pdf-to-text-extractor-file" accept="application/pdf,.pdf">
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-outline" id="pdf-to-text-extractor-copy" disabled>Copy text</button>
    <button class="btn btn-outline" id="pdf-to-text-extractor-dl" disabled>Download .txt</button>
  </div>
  <div class="error" id="pdf-to-text-extractor-error"></div>
  <div class="result" id="pdf-to-text-extractor-result" hidden>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-to-text-extractor-pages">–</div><div class="l">Pages</div></div>
      <div class="stat-card"><div class="v" id="pdf-to-text-extractor-chars">–</div><div class="l">Characters</div></div>
      <div class="stat-card"><div class="v" id="pdf-to-text-extractor-words">–</div><div class="l">Words</div></div>
    </div>
    <div class="field">
      <label for="pdf-to-text-extractor-out">Extracted text</label>
      <textarea class="input" id="pdf-to-text-extractor-out" rows="14" readonly style="font-family:monospace;white-space:pre-wrap"></textarea>
    </div>
  </div>
</div>
