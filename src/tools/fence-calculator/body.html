<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="fence-length">Fence length (ft)</label><input type="number" class="input" id="fence-length" min="0" step="any" placeholder="100"></div>
    <div class="field"><label for="fence-spacing">Post spacing (ft)</label><input type="number" class="input" id="fence-spacing" min="1" step="any" placeholder="8"></div>
    <div class="field"><label for="fence-picket">Picket width (inches)</label><input type="number" class="input" id="fence-picket" min="0" step="any" placeholder="5.5"></div>
    <div class="field"><label for="fence-rails">Rails per section</label>
      <select class="input" id="fence-rails"><option value="2">2 rails</option><option value="3" selected>3 rails</option></select>
    </div>
  </div>
  <div class="error" id="fence-calculator-error"></div>
  <div class="result" id="fence-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="fence-posts">–</div><div class="l">Posts</div></div>
      <div class="stat-card"><div class="v" id="fence-pickets">–</div><div class="l">Pickets</div></div>
      <div class="stat-card"><div class="v" id="fence-railsout">–</div><div class="l">Rails</div></div>
    </div>
    <p class="note">Pickets assume tight privacy-style spacing with no gaps. Add 5–10% extra for cuts and mistakes.</p>
  </div>
</div>
