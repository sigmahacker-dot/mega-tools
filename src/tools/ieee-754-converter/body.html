<div class="tool-card">
  <div class="field"><label for="ieee-754-converter-mode">Direction</label>
    <select class="input" id="ieee-754-converter-mode">
      <option value="d2h">Decimal \u2192 IEEE 754 (32-bit)</option>
      <option value="h2d">Hex (8 digits) \u2192 float</option>
    </select>
  </div>
  <div class="field"><label for="ieee-754-converter-in" id="ieee-754-converter-inlabel">Decimal number</label><input class="input" id="ieee-754-converter-in" type="text" value="-12.75"></div>
  <div class="btn-row"><button class="btn btn-primary" id="ieee-754-converter-go">Convert</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="ieee-754-converter-hex" style="font-size:1rem">C14C0000</div><div class="l">Hex</div></div>
    <div class="stat-card"><div class="v" id="ieee-754-converter-out" style="font-size:1rem">-12.75</div><div class="l">Value</div></div>
  </div>
  <div class="result"><pre class="code" id="ieee-754-converter-bits" style="text-align:left;white-space:pre-wrap;word-break:break-all"></pre></div>
  <div class="error" id="ieee-754-converter-error"></div>
</div>
