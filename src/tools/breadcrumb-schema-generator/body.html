<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="breadcrumb-schema-generator-label">Crumb label</label>
      <input class="input" type="text" id="breadcrumb-schema-generator-label" placeholder="e.g. Home">
    </div>
    <div class="field">
      <label for="breadcrumb-schema-generator-url">Crumb URL</label>
      <input class="input" type="url" id="breadcrumb-schema-generator-url" placeholder="https://example.com/">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="breadcrumb-schema-generator-add">Add Crumb</button>
    <button class="btn btn-outline" id="breadcrumb-schema-generator-clear">Clear All</button>
  </div>
  <div class="error" id="breadcrumb-schema-generator-error"></div>
  <div id="breadcrumb-schema-generator-trail" style="margin-top:10px"></div>
</div>

<div class="tool-card">
  <div class="btn-row">
    <button class="btn" id="breadcrumb-schema-generator-gen">Generate Schema</button>
    <button class="btn btn-outline" id="breadcrumb-schema-generator-copy">Copy JSON-LD</button>
    <button class="btn btn-outline" id="breadcrumb-schema-generator-dl">Download .json</button>
  </div>
  <pre id="breadcrumb-schema-generator-out" style="white-space:pre-wrap;font-family:monospace;font-size:13px;margin-top:10px"></pre>
</div>
