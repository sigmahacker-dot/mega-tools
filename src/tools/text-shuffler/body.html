<div class="tool-card">
  <div class="field">
    <label for="text-shuffler-input">Your text</label>
    <textarea class="textarea" id="text-shuffler-input" rows="6" placeholder="Paste text — one item per line"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="text-shuffler-mode">Shuffle</label>
      <select class="input" id="text-shuffler-mode">
        <option value="lines">Lines</option>
        <option value="words">Words</option>
        <option value="paragraphs">Paragraphs</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="text-shuffler-run">Shuffle</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="text-shuffler-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="text-shuffler-copy">Copy output</button></div>
  </div>
  <div class="error" id="text-shuffler-error"></div>
</div>
