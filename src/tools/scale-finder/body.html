<div class="tool-card">
  <div class="field">
    <label for="scale-finder-notes">Your notes (space separated)</label>
    <input type="text" id="scale-finder-notes" class="input" value="A C D E G" maxlength="80" placeholder="e.g. C D E F# G A B">
    <span class="hint">Use # and b for sharps/flats: F#, Bb, Eb…</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="scale-finder-go">Find scales</button>
  </div>
  <div class="result hidden" id="scale-finder-result">
    <p class="muted" id="scale-finder-summary"></p>
    <div id="scale-finder-list"></div>
  </div>
  <div class="error" id="scale-finder-error"></div>
  <p class="note">216 scales checked (18 types × 12 roots). Enharmonic equivalents (F# = Gb) are treated as the same pitch.</p>
</div>
