<div class="tool-card">
  <h2>YouTube Thumbnail Maker</h2>
  <p class="muted">1280×720 thumbnails — bold text, accent styles, PNG download.</p>
  <div class="grid2">
    <div class="field" style="grid-column:1/-1">
      <label for="youtube-thumbnail-maker-headline">Headline</label>
      <input type="text" class="input" id="youtube-thumbnail-maker-headline" value="I BUILT THIS IN ONE NIGHT">
    </div>
    <div class="field">
      <label for="youtube-thumbnail-maker-sub">Subtext</label>
      <input type="text" class="input" id="youtube-thumbnail-maker-sub" value="full process inside">
    </div>
    <div class="field">
      <label for="youtube-thumbnail-maker-style">Background style</label>
      <select class="input" id="youtube-thumbnail-maker-style">
        <option value="burst">Radial burst</option>
        <option value="diag">Diagonal split</option>
        <option value="dark">Dark backdrop</option>
        <option value="neon">Neon grid</option>
      </select>
    </div>
    <div class="field">
      <label for="youtube-thumbnail-maker-accent">Accent color</label>
      <input type="color" class="input" id="youtube-thumbnail-maker-accent" value="#facc15" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="youtube-thumbnail-maker-align">Text position</label>
      <select class="input" id="youtube-thumbnail-maker-align">
        <option value="left">Left</option>
        <option value="center">Center</option>
        <option value="right">Right</option>
      </select>
    </div>
    <div class="field">
      <label for="youtube-thumbnail-maker-size">Text size: <span id="youtube-thumbnail-maker-size-v">96</span></label>
      <input type="range" class="input" id="youtube-thumbnail-maker-size" min="48" max="150" step="2" value="96">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" style="display:flex;justify-content:center">
    <canvas id="youtube-thumbnail-maker-canvas" width="1280" height="720" style="max-width:640px;width:100%;height:auto;border-radius:10px"></canvas>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="youtube-thumbnail-maker-download">⬇ Download PNG</button>
  </div>
  <div class="error" id="youtube-thumbnail-maker-error"></div>
</div>
