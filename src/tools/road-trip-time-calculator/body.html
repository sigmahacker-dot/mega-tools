<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="road-trip-time-calculator-dist">Distance (km)</label>
      <input class="input" id="road-trip-time-calculator-dist" type="number" min="0" step="any" value="450">
    </div>
    <div class="field">
      <label for="road-trip-time-calculator-speed">Avg speed (km/h)</label>
      <input class="input" id="road-trip-time-calculator-speed" type="number" min="1" step="any" value="80">
    </div>
    <div class="field">
      <label for="road-trip-time-calculator-dep">Departure</label>
      <input class="input" id="road-trip-time-calculator-dep" type="datetime-local">
    </div>
    <div class="field">
      <label for="road-trip-time-calculator-stops">Number of stops</label>
      <input class="input" id="road-trip-time-calculator-stops" type="number" min="0" step="1" value="2">
    </div>
    <div class="field">
      <label for="road-trip-time-calculator-stopmin">Minutes per stop</label>
      <input class="input" id="road-trip-time-calculator-stopmin" type="number" min="0" step="1" value="20">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="road-trip-time-calculator-calc">Calculate</button>
    </div>
  </div>
  <div class="error" id="road-trip-time-calculator-error"></div>
  <div id="road-trip-time-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="road-trip-time-calculator-drive">–</div><div class="l">Driving time</div></div>
      <div class="stat-card"><div class="v" id="road-trip-time-calculator-stopt">–</div><div class="l">Stop time</div></div>
      <div class="stat-card"><div class="v" id="road-trip-time-calculator-total">–</div><div class="l">Total trip time</div></div>
      <div class="stat-card"><div class="v" id="road-trip-time-calculator-arr" style="font-size:1.05em">–</div><div class="l">Arrival</div></div>
    </div>
    <div class="result">
      <h3>Breakdown</h3>
      <div id="road-trip-time-calculator-steps"></div>
    </div>
  </div>
</div>
