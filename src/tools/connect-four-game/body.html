<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="connect-four-game-mode">Mode</label>
      <select class="input" id="connect-four-game-mode">
        <option value="ai" selected>Vs Computer</option>
        <option value="2p">2 Players</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="connect-four-game-new" style="width:100%">New game</button>
    </div>
  </div>
  <p class="muted" id="connect-four-game-msg" style="min-height:24px">Your turn — drop a red disc!</p>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="connect-four-game-drop" style="display:grid;grid-template-columns:repeat(7,44px);gap:4px;justify-content:center;margin-bottom:4px"></div>
    <div id="connect-four-game-board" style="display:inline-grid;grid-template-columns:repeat(7,44px);gap:4px;background:#1565c0;padding:8px;border-radius:10px"></div>
  </div>
  <div class="error" id="connect-four-game-error"></div>
</div>
