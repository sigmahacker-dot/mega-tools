<div class="tool-card">
  <div class="field"><label for="bracket-names">Players / teams <span class="hint">(one per line)</span></label><textarea class="textarea" id="bracket-names" rows="6" placeholder="Team A&#10;Team B&#10;Team C&#10;Team D&#10;..."></textarea></div>
  <div class="checkbox-row"><input type="checkbox" id="bracket-shuffle" checked><label for="bracket-shuffle">Shuffle seeds randomly</label></div>
  <div class="error" id="tournament-bracket-maker-error"></div>
  <div class="result" id="bracket-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="bracket-players">–</div><div class="l">Entrants</div></div>
      <div class="stat-card"><div class="v" id="bracket-rounds">–</div><div class="l">Rounds</div></div>
      <div class="stat-card"><div class="v" id="bracket-byes">–</div><div class="l">Byes</div></div>
    </div>
    <div id="bracket-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="bracket-go" type="button">Build bracket</button>
      <button class="btn btn-outline" id="bracket-dl" type="button">Download .txt</button>
    </div>
  </div>
</div>
