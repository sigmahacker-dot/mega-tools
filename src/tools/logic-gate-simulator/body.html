<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="logic-gate-simulator-gate">Gate</label>
      <select class="select" id="logic-gate-simulator-gate">
        <option value="AND">AND</option>
        <option value="OR">OR</option>
        <option value="NOT">NOT</option>
        <option value="XOR">XOR</option>
        <option value="NAND">NAND</option>
        <option value="NOR">NOR</option>
        <option value="XNOR">XNOR</option>
      </select>
    </div>
    <div class="field">
      <label>Inputs (click to toggle)</label>
      <div class="btn-row">
        <button type="button" class="btn" id="logic-gate-simulator-a">A = 0</button>
        <button type="button" class="btn" id="logic-gate-simulator-b">B = 0</button>
      </div>
    </div>
  </div>
  <div class="error" id="logic-gate-simulator-error"></div>
  <div class="result" style="text-align:center">
    <div id="logic-gate-simulator-lamp" style="width:72px;height:72px;border-radius:50%;margin:8px auto;background:#1e293b;border:3px solid #475569;transition:all .15s"></div>
    <p style="font-family:monospace;font-size:1.3em">Output = <b id="logic-gate-simulator-out">0</b></p>
    <p class="muted" id="logic-gate-simulator-expr" style="font-family:monospace"></p>
  </div>
  <div class="result">
    <h3>Truth table</h3>
    <table class="data"><thead><tr><th>A</th><th>B</th><th>Output</th></tr></thead><tbody id="logic-gate-simulator-table"></tbody></table>
  </div>
</div>
