<div class="tool-card" style="text-align:center;max-width:480px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn btn-primary" id="flappy-bird-clone-start">Start</button>
  </div>
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card"><div class="v" id="flappy-bird-clone-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="flappy-bird-clone-best">0</div><div class="l">Best</div></div>
  </div>
  <canvas id="flappy-bird-clone-canvas" width="400" height="560" style="width:100%;max-width:400px;border-radius:12px;background:#70c5ce;cursor:pointer;touch-action:none"></canvas>
  <p class="note">Click / tap / Space to flap.</p>
  <div class="error" id="flappy-bird-clone-error"></div>
</div>
