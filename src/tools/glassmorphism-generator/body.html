<div class="tool-card">
  <h2>Glassmorphism Generator</h2>
  <p class="muted">Frosted-glass card CSS with live preview.</p>
  <div class="grid2">
    <div class="field">
      <label for="glassmorphism-generator-blur">Blur: <span id="glassmorphism-generator-blur-v">12px</span></label>
      <input type="range" class="input" id="glassmorphism-generator-blur" min="0" max="40" step="1" value="12">
    </div>
    <div class="field">
      <label for="glassmorphism-generator-opacity">Background opacity: <span id="glassmorphism-generator-opacity-v">0.20</span></label>
      <input type="range" class="input" id="glassmorphism-generator-opacity" min="0" max="0.9" step="0.01" value="0.20">
    </div>
    <div class="field">
      <label for="glassmorphism-generator-saturate">Saturation: <span id="glassmorphism-generator-saturate-v">150%</span></label>
      <input type="range" class="input" id="glassmorphism-generator-saturate" min="0" max="300" step="5" value="150">
    </div>
    <div class="field">
      <label for="glassmorphism-generator-radius">Corner radius: <span id="glassmorphism-generator-radius-v">16px</span></label>
      <input type="range" class="input" id="glassmorphism-generator-radius" min="0" max="40" step="1" value="16">
    </div>
    <div class="field">
      <label for="glassmorphism-generator-border">Border opacity: <span id="glassmorphism-generator-border-v">0.30</span></label>
      <input type="range" class="input" id="glassmorphism-generator-border" min="0" max="1" step="0.01" value="0.30">
    </div>
    <div class="field">
      <label for="glassmorphism-generator-text">Text color</label>
      <input type="color" class="input" id="glassmorphism-generator-text" value="#ffffff" style="height:44px;padding:4px">
    </div>
  </div>
  <h3>Live preview</h3>
  <div id="glassmorphism-generator-stage" class="preview" style="min-height:260px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#f59e0b,#ec4899 40%,#7c3aed 75%,#0ea5e9)">
    <div style="position:absolute;width:220px;height:220px;border-radius:50%;background:#facc15;opacity:.55;top:-60px;left:8%"></div>
    <div style="position:absolute;width:260px;height:260px;border-radius:50%;background:#22d3ee;opacity:.5;bottom:-80px;right:6%"></div>
    <div id="glassmorphism-generator-card" style="position:relative;padding:32px 36px;max-width:300px;text-align:center;transition:all .15s ease">
      <div style="font-size:40px">✨</div>
      <div style="font-size:20px;font-weight:700;margin:8px 0 4px">Glass Card</div>
      <div style="font-size:14px;opacity:.85">Frosted glass effect preview</div>
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="glassmorphism-generator-copy">Copy CSS</button>
  </div>
  <h3 class="mt">Generated CSS</h3>
  <pre class="code" id="glassmorphism-generator-code"></pre>
  <div class="error" id="glassmorphism-generator-error"></div>
</div>
