<div class="tool-card">
  <h2>SVG Blob Generator</h2>
  <p class="muted">Smooth organic blob shapes — deterministic per seed, infinitely scalable.</p>
  <div class="grid2">
    <div class="field">
      <label for="svg-blob-generator-seed">Seed: <span id="svg-blob-generator-seed-v">7</span></label>
      <input type="range" class="input" id="svg-blob-generator-seed" min="1" max="999" step="1" value="7">
    </div>
    <div class="field">
      <label for="svg-blob-generator-points">Complexity: <span id="svg-blob-generator-points-v">8</span></label>
      <input type="range" class="input" id="svg-blob-generator-points" min="4" max="16" step="1" value="8">
    </div>
    <div class="field">
      <label for="svg-blob-generator-round">Roundness: <span id="svg-blob-generator-round-v">0.65</span></label>
      <input type="range" class="input" id="svg-blob-generator-round" min="0.1" max="1" step="0.01" value="0.65">
    </div>
    <div class="field">
      <label for="svg-blob-generator-wobble">Wobble: <span id="svg-blob-generator-wobble-v">0.30</span></label>
      <input type="range" class="input" id="svg-blob-generator-wobble" min="0" max="0.8" step="0.01" value="0.30">
    </div>
    <div class="field">
      <label for="svg-blob-generator-fill">Fill style</label>
      <select class="input" id="svg-blob-generator-fill">
        <option value="grad">Gradient</option>
        <option value="flat">Flat color</option>
      </select>
    </div>
    <div class="field">
      <label for="svg-blob-generator-color">Color</label>
      <input type="color" class="input" id="svg-blob-generator-color" value="#7c3aed" style="height:44px;padding:4px">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="svg-blob-generator-stage" style="display:flex;align-items:center;justify-content:center;min-height:260px"></div>
  <div class="btn-row mt">
    <button class="btn btn-outline" id="svg-blob-generator-random">🎲 Random seed</button>
    <button class="btn btn-primary" id="svg-blob-generator-copy">Copy SVG</button>
  </div>
  <h3 class="mt">Generated SVG</h3>
  <pre class="code" id="svg-blob-generator-code" style="max-height:300px;overflow:auto"></pre>
  <div class="error" id="svg-blob-generator-error"></div>
</div>
