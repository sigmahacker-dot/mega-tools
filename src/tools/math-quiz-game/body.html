<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="math-quiz-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="math-quiz-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="math-quiz-game-level">1</div><div class="l">Level</div></div>
    <div class="stat-card"><div class="v" id="math-quiz-game-time">60</div><div class="l">Seconds</div></div>
  </div>
  <div id="math-quiz-game-q" style="font-size:44px;font-weight:bold;margin:16px 0;min-height:64px">? + ? = ?</div>
  <p class="muted" id="math-quiz-game-msg" style="min-height:24px">Press Start — solve as many as you can in 60 seconds!</p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="math-quiz-game-ans">Your answer</label>
      <input class="input" id="math-quiz-game-ans" type="number" placeholder="Answer…" disabled autocomplete="off">
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="math-quiz-game-submit" style="width:100%" disabled>Answer</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="math-quiz-game-start">▶ Start</button>
  </div>
  <div class="error" id="math-quiz-game-error"></div>
</div>
