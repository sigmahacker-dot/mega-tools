<div class="tool-card">
  <div class="field">
    <label for="fiber-intake-calculator-target">Daily target</label>
    <select class="input" id="fiber-intake-calculator-target" style="max-width:320px">
      <option value="25">25 g (women)</option>
      <option value="30" selected>30 g (men)</option>
    </select>
  </div>
  <div id="fiber-intake-calculator-foods"></div>
  <div class="grid2" style="margin-top:8px">
    <div class="field">
      <label for="fiber-intake-calculator-cname">Custom food</label>
      <input class="input" id="fiber-intake-calculator-cname" type="text" placeholder="e.g. Protein bar">
    </div>
    <div class="field">
      <label for="fiber-intake-calculator-cg">Fiber (g)</label>
      <div class="btn-row" style="justify-content:flex-start">
        <input class="input" id="fiber-intake-calculator-cg" type="number" min="0" step="0.5" placeholder="e.g. 6" style="flex:1">
        <button class="btn" id="fiber-intake-calculator-add">Add</button>
      </div>
    </div>
  </div>
  <div class="stat-cards" style="margin-top:12px">
    <div class="stat-card"><div class="v" id="fiber-intake-calculator-total">0 g</div><div class="l">Total fiber today</div></div>
    <div class="stat-card"><div class="v" id="fiber-intake-calculator-pct">0%</div><div class="l">Of target</div></div>
  </div>
  <div style="background:#eee;border-radius:6px;height:14px;margin-top:8px;overflow:hidden">
    <div id="fiber-intake-calculator-bar" style="height:100%;width:0%;background:#2e7d32;transition:width .3s"></div>
  </div>
  <p class="hint" id="fiber-intake-calculator-msg"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Increase fiber gradually and drink enough water.</p>
  <div class="error" id="fiber-intake-calculator-error"></div>
</div>
