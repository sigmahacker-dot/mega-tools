<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="pricing-table-generator-tiers">Number of tiers</label>
      <select class="select" id="pricing-table-generator-tiers">
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
      </select>
    </div>
    <div class="field">
      <label for="pricing-table-generator-accent">Accent color</label>
      <input class="input" id="pricing-table-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="pricing-table-generator-theme">Theme</label>
      <select class="select" id="pricing-table-generator-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
  </div>
  <div id="pricing-table-generator-tierinputs"></div>
  <div class="field">
    <label for="pricing-table-generator-highlight">Highlight tier (0 = none)</label>
    <select class="select" id="pricing-table-generator-highlight">
      <option value="0">None</option>
      <option value="1">Tier 1</option>
      <option value="2" selected>Tier 2</option>
      <option value="3">Tier 3</option>
      <option value="4">Tier 4</option>
    </select>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="pricing-table-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:20px;background:#18181b;overflow:auto"></div>
  </div>
  <div class="error" id="pricing-table-generator-error"></div>
  <div class="field">
    <label for="pricing-table-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="pricing-table-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="pricing-table-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="pricing-table-generator-download">Download pricing.html</button>
  </div>
</div>
