<div class="tool-card">
  <div class="field">
    <label for="pdf-booklet-imposer-file">PDF file</label>
    <input type="file" id="pdf-booklet-imposer-file" accept="application/pdf" class="input">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pdf-booklet-imposer-go">Make booklet</button>
  </div>
  <div class="result hidden" id="pdf-booklet-imposer-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-booklet-imposer-pages">–</div><div class="l">Source pages</div></div>
      <div class="stat-card"><div class="v" id="pdf-booklet-imposer-sheets">–</div><div class="l">Booklet sheets</div></div>
      <div class="stat-card"><div class="v" id="pdf-booklet-imposer-size">–</div><div class="l">Output size</div></div>
    </div>
    <p class="muted" id="pdf-booklet-imposer-info"></p>
    <div class="btn-row">
      <button class="btn btn-primary" id="pdf-booklet-imposer-download">Download booklet PDF</button>
    </div>
  </div>
  <div class="error" id="pdf-booklet-imposer-error"></div>
  <p class="note">Print double-sided flipping on the short edge, then fold and staple the spine. Everything runs in your browser.</p>
</div>
