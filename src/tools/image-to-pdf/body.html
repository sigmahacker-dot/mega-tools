<div class="tool-card">
  <div class="dropzone" id="image-to-pdf-drop">
    <span class="dz-icon">📄</span>
    <strong>Drop images here</strong> or click to browse
    <input type="file" id="image-to-pdf-file" accept="image/*" multiple class="hidden">
  </div>
  <ul class="file-list" id="image-to-pdf-list"></ul>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-to-pdf-go">Create PDF</button>
  </div>
  <div class="progress hidden" id="image-to-pdf-progresswrap"><div id="image-to-pdf-bar"></div></div>
  <p class="muted" id="image-to-pdf-status"></p>
  <div class="error" id="image-to-pdf-error"></div>
  <p class="note">Pages appear in the order shown above — use ↑ ↓ to reorder. Each page matches its image size. Files never leave your device — everything is processed in your browser.</p>
</div>
