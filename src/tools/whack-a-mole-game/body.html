<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="whack-a-mole-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="whack-a-mole-game-time">30</div><div class="l">Seconds left</div></div>
    <div class="stat-card"><div class="v" id="whack-a-mole-game-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="whack-a-mole-game-board" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto"></div>
  <p class="muted" id="whack-a-mole-game-msg" style="min-height:24px;margin:12px 0">Press Start. 🐹 = 1 pt, ⭐ golden = 3 pts.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="whack-a-mole-game-start">Start</button>
  </div>
  <div class="error" id="whack-a-mole-game-error"></div>
</div>
