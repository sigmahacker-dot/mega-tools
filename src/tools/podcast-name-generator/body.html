<div class="tool-card">

    <label for="podcast-name-generator-topic">Podcast topic</label>
    <input class="input" id="podcast-name-generator-topic" type="text" placeholder="e.g. gardening, true crime, startups" maxlength="60">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="podcast-name-generator-generate" type="button">Generate Names</button>
  </div>

  <div class="mt" id="podcast-name-generator-list"></div>
</div>
