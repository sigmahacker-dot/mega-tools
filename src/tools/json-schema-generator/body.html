<div class="tool-card">
  <div class="field">
    <label for="json-schema-generator-input">Sample JSON</label>
    <textarea class="textarea" id="json-schema-generator-input" rows="8" style="font-family:monospace">{
  "id": 42,
  "name": "Ada Lovelace",
  "email": "ada@example.com",
  "active": true,
  "score": 98.6,
  "createdAt": "2026-09-30T10:15:00Z",
  "tags": ["admin", "beta"],
  "address": {
    "city": "Lahore",
    "zip": "54000"
  },
  "nickname": null
}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="json-schema-generator-generate">Generate schema</button>
  </div>
  <div class="error" id="json-schema-generator-error"></div>
  <div class="field">
    <label for="json-schema-generator-output">JSON Schema (draft-07)</label>
    <textarea class="textarea" id="json-schema-generator-output" rows="16" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="json-schema-generator-copy">Copy schema</button>
    <button class="btn btn-outline" id="json-schema-generator-download">Download schema.json</button>
  </div>
  <p class="note">"required" lists every key seen in the sample — review it against your full dataset.</p>
</div>
