<div class="tool-card">
  <div class="field">
    <label for="url-encoder-decoder-input">Text or URL</label>
    <textarea class="textarea code" id="url-encoder-decoder-input" rows="6" placeholder="Paste text or a URL here..."></textarea>
  </div>
  <div class="checkbox-row">
    <label><input type="radio" name="url-encoder-decoder-mode" value="component" checked> Encode component</label>
    <label><input type="radio" name="url-encoder-decoder-mode" value="full"> Encode full URL</label>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="url-encoder-decoder-encode" type="button">Encode</button>
    <button class="btn btn-outline" id="url-encoder-decoder-decode" type="button">Decode</button>
    <button class="btn btn-outline" id="url-encoder-decoder-copy" type="button">Copy result</button>
  </div>
  <div class="error" id="url-encoder-decoder-error"></div>
  <div class="result hidden" id="url-encoder-decoder-result">
    <pre id="url-encoder-decoder-output"></pre>
  </div>
  <p class="note">Full URL encoding keeps : / ? &amp; # intact; component encoding encodes everything except a few safe characters. Runs entirely in your browser.</p>
</div>
