<div class="tool-card">
  <div class="field">
    <label for="unit-category">Category</label>
    <select class="select" id="unit-category">
      <option value="length" selected>Length</option>
      <option value="weight">Weight</option>
      <option value="temperature">Temperature</option>
      <option value="data">Data</option>
      <option value="speed">Speed</option>
      <option value="area">Area</option>
    </select>
  </div>
  <div class="field">
    <label for="unit-value">Value</label>
    <input type="number" class="input" id="unit-value" step="any" placeholder="e.g. 10">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="unit-from">From</label>
      <select class="select" id="unit-from"></select>
    </div>
    <div class="field">
      <label for="unit-to">To</label>
      <select class="select" id="unit-to"></select>
    </div>
  </div>
  <div class="error" id="unit-converter-error"></div>
  <div class="result" id="unit-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="unit-output">–</div><div class="l">Converted result</div></div>
    </div>
    <p class="muted" id="unit-formula"></p>
  </div>
</div>
