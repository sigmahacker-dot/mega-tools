<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="content-calendar-maker-month">Month</label>
      <input class="input" type="month" id="content-calendar-maker-month">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-outline" id="content-calendar-maker-export">Export Text</button></div>
    </div>
  </div>
  <div class="error" id="content-calendar-maker-error"></div>
</div>

<div class="tool-card">
  <h3 id="content-calendar-maker-title"></h3>
  <div id="content-calendar-maker-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
  <p class="muted">Click a day to schedule or view posts.</p>
</div>

<div class="tool-card" id="content-calendar-maker-daypane" style="display:none">
  <h3>Posts for <span id="content-calendar-maker-daylabel"></span></h3>
  <div class="grid2">
    <div class="field">
      <label for="content-calendar-maker-platform">Platform</label>
      <select class="select" id="content-calendar-maker-platform">
        <option value="Instagram">Instagram</option>
        <option value="TikTok">TikTok</option>
        <option value="YouTube">YouTube</option>
        <option value="X">X</option>
        <option value="Facebook">Facebook</option>
        <option value="LinkedIn">LinkedIn</option>
      </select>
    </div>
    <div class="field">
      <label for="content-calendar-maker-text">Post idea / caption</label>
      <input class="input" type="text" id="content-calendar-maker-text" placeholder="What to post…">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="content-calendar-maker-add">Schedule Post</button>
  </div>
  <div id="content-calendar-maker-posts" style="margin-top:10px"></div>
</div>
