<div class="tool-card">
  <div class="row">
    <div class="field" style="flex:1;">
      <label for="todo-list-input">New task</label>
      <input class="input" id="todo-list-input" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off">
    </div>
    <div class="field" style="align-self:end;">
      <button class="btn btn-primary" id="todo-list-add" type="button">Add</button>
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-outline btn-sm" id="todo-list-filter-all" type="button">All</button>
    <button class="btn btn-outline btn-sm" id="todo-list-filter-active" type="button">Active</button>
    <button class="btn btn-outline btn-sm" id="todo-list-filter-done" type="button">Done</button>
    <button class="btn btn-danger btn-sm" id="todo-list-clear" type="button">Clear completed</button>
  </div>
  <div class="error" id="todo-list-error"></div>
  <div class="field mt">
    <label>Tasks <span class="muted" id="todo-list-count"></span></label>
    <ul class="file-list" id="todo-list-items"></ul>
    <p class="muted" id="todo-list-empty">No tasks yet &mdash; add your first one above.</p>
  </div>
  <p class="note">Your tasks are saved in this browser only, so they survive reloads on this device.</p>
</div>
