<div class="tool-card">
  <div class="field">
    <label for="zodiac-sign-calculator-dob">Date of birth</label>
    <input type="date" class="input" id="zodiac-sign-calculator-dob" max="2026-12-31">
  </div>
  <div class="error" id="zodiac-sign-calculator-error"></div>
  <div class="result" id="zodiac-sign-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="zodiac-sign-calculator-sign">–</div><div class="l">Sign</div></div>
      <div class="stat-card"><div class="v" id="zodiac-sign-calculator-element">–</div><div class="l">Element</div></div>
      <div class="stat-card"><div class="v" id="zodiac-sign-calculator-dates">–</div><div class="l">Date range</div></div>
    </div>
    <p id="zodiac-sign-calculator-traits" class="center muted">Pick your birthdate to reveal your sign.</p>
    <p class="note">For entertainment only — the stars have no say in your personality.</p>
  </div>
</div>
