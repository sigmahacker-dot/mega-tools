<div class="tool-card">
  <div class="field">
    <label for="syllable-counter-input">Your text</label>
    <textarea class="textarea" id="syllable-counter-input" rows="8" placeholder="Paste text, lyrics or a poem here..."></textarea>
  </div>
  <div class="error" id="syllable-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="syllable-counter-total">0</div><div class="l">Total syllables</div></div>
    <div class="stat-card"><div class="v" id="syllable-counter-words">0</div><div class="l">Words</div></div>
    <div class="stat-card"><div class="v" id="syllable-counter-avg">0</div><div class="l">Avg syllables / word</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Word</th><th>Syllables</th></tr></thead>
      <tbody id="syllable-counter-body"><tr><td colspan="2" class="muted">Per-word breakdown appears here.</td></tr></tbody>
    </table>
    <p class="note">Heuristic: vowel groups count as one syllable; silent trailing "e" is dropped; every word gets at least one.</p>
  </div>
</div>
