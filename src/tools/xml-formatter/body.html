<div class="tool-card">
  <div class="field">
    <label for="xml-formatter-input">XML input</label>
    <textarea class="textarea" id="xml-formatter-input" rows="10" placeholder="Paste XML here…"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="xml-formatter-mode">Mode</label>
      <select class="input" id="xml-formatter-mode">
        <option value="pretty">Pretty-print</option>
        <option value="minify">Minify</option>
      </select>
    </div>
    <div class="field">
      <label for="xml-formatter-indent">Indent style</label>
      <select class="input" id="xml-formatter-indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="xml-formatter-format">Format</button>
    <button class="btn btn-outline" id="xml-formatter-sample">Load sample</button>
    <label style="display:inline-flex;align-items:center;gap:6px;">
      <input type="checkbox" id="xml-formatter-strip"> Remove comments (minify mode)
    </label>
  </div>
  <div class="error" id="xml-formatter-error"></div>
  <div class="field">
    <label for="xml-formatter-output">Output</label>
    <textarea class="textarea" id="xml-formatter-output" rows="10" readonly placeholder="Formatted XML will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="xml-formatter-copy">Copy output</button>
    <button class="btn btn-outline" id="xml-formatter-download">Download .xml</button>
  </div>
</div>
