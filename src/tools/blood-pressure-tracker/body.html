<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="bp-sys">Systolic (top number)</label><input type="number" class="input" id="bp-sys" min="40" max="300" step="1" placeholder="120"></div>
    <div class="field"><label for="bp-dia">Diastolic (bottom number)</label><input type="number" class="input" id="bp-dia" min="20" max="200" step="1" placeholder="80"></div>
    <div class="field"><label>&nbsp;</label>
      <div>
        <button class="btn" id="bp-add">Add reading</button>
        <button class="btn" id="bp-clear">Clear history</button>
      </div>
    </div>
  </div>
  <div class="error" id="blood-pressure-tracker-error"></div>
  <div class="result" id="bp-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="bp-avg">–</div><div class="l">Average reading</div></div>
      <div class="stat-card"><div class="v" id="bp-cat">–</div><div class="l">Average category</div></div>
      <div class="stat-card"><div class="v" id="bp-count">–</div><div class="l">Readings logged</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Date</th><th>Reading</th><th>Category</th></tr></thead>
      <tbody id="bp-body"><tr><td colspan="3" class="muted">No readings yet.</td></tr></tbody>
    </table>
    <p class="note">Not medical advice. Above 180/120 with symptoms is an emergency — seek care immediately.</p>
  </div>
</div>
