<div class="tool-card">
  <h2>CSS Animation Generator</h2>
  <p class="muted">Design a CSS keyframe animation, preview it live, and copy production-ready code.</p>
  <div class="grid2">
    <div class="field">
      <label for="css-animation-generator-type">Animation type</label>
      <select class="input" id="css-animation-generator-type">
        <option value="fade-in">Fade in</option>
        <option value="slide-in">Slide in (from bottom)</option>
        <option value="slide-left">Slide in (from right)</option>
        <option value="bounce">Bounce in</option>
        <option value="spin">Spin</option>
        <option value="pulse">Pulse</option>
        <option value="shake">Shake</option>
        <option value="flip">Flip in</option>
      </select>
    </div>
    <div class="field">
      <label for="css-animation-generator-timing">Timing function</label>
      <select class="input" id="css-animation-generator-timing">
        <option value="ease">ease</option>
        <option value="ease-in">ease-in</option>
        <option value="ease-out">ease-out</option>
        <option value="ease-in-out">ease-in-out</option>
        <option value="linear">linear</option>
        <option value="cubic-bezier(0.34,1.56,0.64,1)">springy (cubic-bezier)</option>
      </select>
    </div>
    <div class="field">
      <label for="css-animation-generator-duration">Duration: <span id="css-animation-generator-duration-v">1s</span></label>
      <input type="range" class="input" id="css-animation-generator-duration" min="0.2" max="5" step="0.1" value="1">
    </div>
    <div class="field">
      <label for="css-animation-generator-delay">Delay: <span id="css-animation-generator-delay-v">0s</span></label>
      <input type="range" class="input" id="css-animation-generator-delay" min="0" max="3" step="0.1" value="0">
    </div>
    <div class="field">
      <label for="css-animation-generator-iter">Iterations</label>
      <select class="input" id="css-animation-generator-iter">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="infinite">infinite</option>
      </select>
    </div>
    <div class="field">
      <label for="css-animation-generator-class">CSS class name</label>
      <input type="text" class="input" id="css-animation-generator-class" value="my-animation">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="css-animation-generator-stage" style="min-height:180px;display:flex;align-items:center;justify-content:center">
    <div id="css-animation-generator-box" style="width:120px;height:120px;border-radius:16px;background:linear-gradient(135deg,#e11d48,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">✨</div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-outline" id="css-animation-generator-replay">↻ Replay</button>
    <button class="btn btn-primary" id="css-animation-generator-copy">Copy CSS</button>
  </div>
  <h3 class="mt">Generated CSS</h3>
  <pre class="code" id="css-animation-generator-code" style="max-height:320px;overflow:auto"></pre>
  <div class="error" id="css-animation-generator-error"></div>
</div>
