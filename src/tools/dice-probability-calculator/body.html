<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="dice-probability-calculator-x">Dice (X)</label><input class="input" id="dice-probability-calculator-x" type="number" value="2" min="1" max="20" step="1"></div>
    <div class="field"><label for="dice-probability-calculator-y">Sides (Y)</label><input class="input" id="dice-probability-calculator-y" type="number" value="6" min="2" max="100" step="1"></div>
    <div class="field"><label for="dice-probability-calculator-mod">Modifier (+/-)</label><input class="input" id="dice-probability-calculator-mod" type="number" value="0" step="1"></div>
    <div class="field"><label for="dice-probability-calculator-target">Target (\u2265)</label><input class="input" id="dice-probability-calculator-target" type="number" value="7" step="1"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="dice-probability-calculator-go">Compute</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="dice-probability-calculator-p">58.33%</div><div class="l">P(\u2265 target)</div></div>
    <div class="stat-card"><div class="v" id="dice-probability-calculator-mean">7</div><div class="l">Mean</div></div>
  </div>
  <div class="result"><div class="data" id="dice-probability-calculator-table" style="max-height:300px;overflow:auto"></div></div>
  <div class="error" id="dice-probability-calculator-error"></div>
</div>
