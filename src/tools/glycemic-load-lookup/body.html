<div class="tool-card">
  <div class="field">
    <label for="glycemic-load-lookup-search">Search foods</label>
    <input type="text" class="input" id="glycemic-load-lookup-search" placeholder="e.g. rice, banana, bread...">
  </div>
  <div class="error" id="glycemic-load-lookup-error"></div>
  <div class="result" id="glycemic-load-lookup-result">
    <p class="muted" id="glycemic-load-lookup-count"></p>
    <div id="glycemic-load-lookup-out"></div>
    <p class="note">Typical values; actual GI varies with ripeness, cooking, variety, and brand. For information only &mdash; not medical advice.</p>
  </div>
</div>
