<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="blood-donation-eligibility-checker-age">Age (years)</label>
      <input type="number" class="input" id="blood-donation-eligibility-checker-age" min="1" max="120" step="1" placeholder="28">
    </div>
    <div class="field">
      <label for="blood-donation-eligibility-checker-weight">Weight (kg)</label>
      <input type="number" class="input" id="blood-donation-eligibility-checker-weight" min="1" step="any" placeholder="70">
    </div>
    <div class="field">
      <label for="blood-donation-eligibility-checker-hb">Hemoglobin (g/dL)</label>
      <input type="number" class="input" id="blood-donation-eligibility-checker-hb" min="1" step="any" placeholder="14">
    </div>
    <div class="field">
      <label for="blood-donation-eligibility-checker-sex">Sex (for hemoglobin threshold)</label>
      <select class="select" id="blood-donation-eligibility-checker-sex">
        <option value="male">Male (min 13.0)</option>
        <option value="female">Female (min 12.5)</option>
      </select>
    </div>
    <div class="field">
      <label for="blood-donation-eligibility-checker-last">Last whole-blood donation (optional)</label>
      <input type="date" class="input" id="blood-donation-eligibility-checker-last">
    </div>
  </div>
  <div class="field">
    <label class="checkline"><input type="checkbox" id="blood-donation-eligibility-checker-well"> I feel healthy and well today</label>
    <label class="checkline"><input type="checkbox" id="blood-donation-eligibility-checker-abx"> No antibiotics or active infection in the last 7 days</label>
    <label class="checkline"><input type="checkbox" id="blood-donation-eligibility-checker-tat"> No new tattoo, piercing, or transfusion in the last 3 months</label>
    <label class="checkline"><input type="checkbox" id="blood-donation-eligibility-checker-preg"> Not pregnant and not given birth in the last 6 weeks</label>
  </div>
  <div class="btn-row"><button class="btn" id="blood-donation-eligibility-checker-go" type="button">Check eligibility</button></div>
  <div class="error" id="blood-donation-eligibility-checker-error"></div>
  <div class="result" id="blood-donation-eligibility-checker-result">
    <div id="blood-donation-eligibility-checker-out"></div>
    <p class="note">Informational only &mdash; the donation center makes the final decision after its own screening. For information only &mdash; not medical advice.</p>
  </div>
</div>
