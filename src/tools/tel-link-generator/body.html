<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="tel-num">Phone number</label><input type="tel" class="input" id="tel-num" placeholder="+1 (555) 010-2030"></div>
    <div class="field"><label for="tel-ext">Extension <span class="hint">(optional)</span></label><input type="text" class="input" id="tel-ext" placeholder="123"></div>
  </div>
  <div class="error" id="tel-link-generator-error"></div>
  <div class="result" id="tel-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="tel-normalized">–</div><div class="l">Normalized number</div></div>
    </div>
    <div class="field"><label for="tel-out">Generated link</label><input type="text" class="input" id="tel-out" readonly></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="tel-open" href="tel:">Test call link</a>
      <button class="btn btn-outline" id="tel-copy" type="button">Copy link</button>
    </div>
  </div>
</div>
