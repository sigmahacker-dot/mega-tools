<div class="tool-card">
  <h2>Voice Recorder</h2>
  <p class="muted">Record audio with your microphone, play it back and download it.</p>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="audio-voice-recorder-timer">0:00</div><div class="l">Recording time</div></div>
    <div class="stat-card"><div class="v" id="audio-voice-recorder-status">Ready</div><div class="l">Status</div></div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="audio-voice-recorder-start">Start recording</button>
    <button class="btn btn-outline" id="audio-voice-recorder-stop" disabled>Stop recording</button>
  </div>
  <div class="error" id="audio-voice-recorder-error"></div>
  <div class="result hidden" id="audio-voice-recorder-result">
    <div class="field">
      <label>Playback</label>
      <audio id="audio-voice-recorder-audio" controls style="width:100%;"></audio>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="audio-voice-recorder-download">Download .webm</button>
      <button class="btn btn-outline" id="audio-voice-recorder-discard">Discard</button>
    </div>
    <p class="note" id="audio-voice-recorder-info"></p>
  </div>
  <p class="note">Your browser will ask for microphone permission. Recording stays on your device.</p>
</div>
