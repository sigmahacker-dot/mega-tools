<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="permutation-combination-calculator-n">n (total items)</label>
      <input type="number" class="input" id="permutation-combination-calculator-n" min="0" max="1000" step="1" placeholder="e.g. 10">
    </div>
    <div class="field">
      <label for="permutation-combination-calculator-r">r (items picked)</label>
      <input type="number" class="input" id="permutation-combination-calculator-r" min="0" max="1000" step="1" placeholder="e.g. 3">
    </div>
    <div class="field">
      <label for="permutation-combination-calculator-mode">Calculation</label>
      <select class="select" id="permutation-combination-calculator-mode">
        <option value="P">Permutation P(n,r) — order matters</option>
        <option value="C" selected>Combination C(n,r) — order ignored</option>
      </select>
    </div>
  </div>
  <div class="error" id="permutation-combination-calculator-error"></div>
  <div class="result" id="permutation-combination-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="permutation-combination-calculator-value">–</div><div class="l" id="permutation-combination-calculator-lab">C(n,r)</div></div>
      <div class="stat-card"><div class="v" id="permutation-combination-calculator-other">–</div><div class="l" id="permutation-combination-calculator-lab2">P(n,r)</div></div>
    </div>
    <p class="note" id="permutation-combination-calculator-steps">Enter n and r to compute.</p>
  </div>
</div>
