<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:420px;margin:0 auto 12px;text-align:left">
    <div class="field">
      <label for="meditation-timer-mins">Session length (minutes)</label>
      <input class="input" id="meditation-timer-mins" type="number" min="1" max="180" step="1" value="10">
    </div>
    <div class="field">
      <label for="meditation-timer-interval">Interval bell every (minutes, 0 = off)</label>
      <input class="input" id="meditation-timer-interval" type="number" min="0" max="60" step="1" value="0">
    </div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="meditation-timer-clock" style="font-size:2.2em">10:00</div><div class="l">Remaining</div></div>
    <div class="stat-card"><div class="v" id="meditation-timer-state">Ready</div><div class="l">Status</div></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="meditation-timer-start">Start</button>
    <button class="btn" id="meditation-timer-pause">Pause</button>
    <button class="btn btn-outline" id="meditation-timer-reset">Reset</button>
  </div>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance.</p>
  <div class="error" id="meditation-timer-error"></div>
</div>
