<div class="tool-card">
  <div class="field">
    <label for="rot13-cipher-input">Input text</label>
    <textarea class="textarea" id="rot13-cipher-input" rows="5" placeholder="Type text to ROT13"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="rot13-cipher-run">Apply ROT13</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="rot13-cipher-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="rot13-cipher-copy">Copy output</button></div>
  </div>
  <p class="hint">ROT13 is its own inverse — applying it twice restores the original.</p>
  <div class="error" id="rot13-cipher-error"></div>
</div>
