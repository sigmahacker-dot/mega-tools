<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="resting-heart-rate-tracker-date">Date</label>
      <input class="input" id="resting-heart-rate-tracker-date" type="date">
    </div>
    <div class="field">
      <label for="resting-heart-rate-tracker-bpm">Resting HR (bpm)</label>
      <div class="btn-row" style="justify-content:flex-start">
        <input class="input" id="resting-heart-rate-tracker-bpm" type="number" min="25" max="220" step="1" placeholder="e.g. 62" style="flex:1">
        <button class="btn btn-primary" id="resting-heart-rate-tracker-add">Log</button>
      </div>
    </div>
  </div>
  <div class="stat-cards" id="resting-heart-rate-tracker-out">
    <div class="stat-card"><div class="v" id="resting-heart-rate-tracker-avg">–</div><div class="l">7-day average (bpm)</div></div>
    <div class="stat-card"><div class="v" id="resting-heart-rate-tracker-trend">–</div><div class="l">Trend</div></div>
    <div class="stat-card"><div class="v" id="resting-heart-rate-tracker-level" style="font-size:1em">–</div><div class="l">Interpretation</div></div>
  </div>
  <div class="result" id="resting-heart-rate-tracker-list"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. See a doctor about a persistently high or suddenly changed resting heart rate.</p>
  <div class="error" id="resting-heart-rate-tracker-error"></div>
</div>
