<div class="tool-card">
  <div id="fc-edit">
    <div class="grid2">
      <div class="field"><label for="fc-front">Front <span class="hint">(question)</span></label><input type="text" class="input" id="fc-front" placeholder="What is the capital of Japan?"></div>
      <div class="field"><label for="fc-back">Back <span class="hint">(answer)</span></label><input type="text" class="input" id="fc-back" placeholder="Tokyo"></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary btn-sm" id="fc-add" type="button">Add card</button></div>
    <div class="error" id="flashcard-maker-error"></div>
    <div class="field" style="margin-top:12px"><label>Your deck (<span id="fc-count">0</span>)</label><div id="fc-list"></div></div>
    <div class="btn-row"><button class="btn btn-primary" id="fc-study" type="button">Study deck</button></div>
  </div>
  <div id="fc-mode" style="display:none">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="fc-pos">–</div><div class="l">Card</div></div>
      <div class="stat-card"><div class="v" id="fc-known-n">0</div><div class="l">Known</div></div>
    </div>
    <div id="fc-card" style="border:1px solid rgba(255,255,255,.14);border-radius:16px;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:1.25rem;cursor:pointer;background:#0c0c11"></div>
    <p class="muted" style="text-align:center">Tap the card to flip</p>
    <div style="height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:10px 0">
      <div id="fc-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#22c55e)"></div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-outline btn-sm" id="fc-prev" type="button">← Prev</button>
      <button class="btn btn-outline btn-sm" id="fc-unknown" type="button">Still learning</button>
      <button class="btn btn-outline btn-sm" id="fc-known" type="button">Known ✓</button>
      <button class="btn btn-outline btn-sm" id="fc-next" type="button">Next →</button>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:10px">
      <button class="btn btn-outline btn-sm" id="fc-shuffle" type="button">Shuffle deck</button>
      <button class="btn btn-outline btn-sm" id="fc-exit" type="button">Exit study mode</button>
    </div>
  </div>
</div>
