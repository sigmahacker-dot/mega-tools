<div class="tool-card">
  <div class="dropzone" id="audio-to-wav-converter-drop">
    <span class="dz-icon">🎵</span>
    <strong>Drop an audio file here</strong> or click to browse
    <input type="file" id="audio-to-wav-converter-file" accept="audio/*" class="hidden">
  </div>
  <div class="result hidden" id="audio-to-wav-converter-result">
    <table class="data"><tbody id="audio-to-wav-converter-rows"></tbody></table>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="audio-to-wav-converter-go">Convert &amp; download WAV</button>
  </div>
  <div class="error" id="audio-to-wav-converter-error"></div>
  <p class="note">Works with MP3, OGG, M4A/AAC, FLAC and anything else your browser can decode. Files never leave your device — everything is processed in your browser.</p>
</div>
