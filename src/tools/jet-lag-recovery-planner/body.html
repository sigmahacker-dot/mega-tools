<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="jet-lag-recovery-planner-zones">Time zones crossed</label>
      <input class="input" id="jet-lag-recovery-planner-zones" type="number" min="1" max="12" value="7">
    </div>
    <div class="field">
      <label for="jet-lag-recovery-planner-dir">Direction</label>
      <select class="select" id="jet-lag-recovery-planner-dir">
        <option value="east">Eastward (harder)</option>
        <option value="west" selected>Westward (easier)</option>
      </select>
    </div>
    <div class="field">
      <label for="jet-lag-recovery-planner-arr">Arrival date</label>
      <input class="input" id="jet-lag-recovery-planner-arr" type="date">
    </div>
    <div class="field">
      <label for="jet-lag-recovery-planner-bed">Usual bedtime</label>
      <input class="input" id="jet-lag-recovery-planner-bed" type="time" value="23:00">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="jet-lag-recovery-planner-plan">Plan recovery</button>
    </div>
  </div>
  <div class="error" id="jet-lag-recovery-planner-error"></div>
  <div id="jet-lag-recovery-planner-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="jet-lag-recovery-planner-days">–</div><div class="l">Recovery days</div></div>
      <div class="stat-card"><div class="v" id="jet-lag-recovery-planner-done">–</div><div class="l">Fully adjusted by</div></div>
    </div>
    <div class="result">
      <h3>Daily plan</h3>
      <div style="overflow-x:auto"><table class="data"><thead><tr><th>Day</th><th>Date</th><th>Sleep target</th><th>Light & tips</th></tr></thead><tbody id="jet-lag-recovery-planner-rows"></tbody></table></div>
    </div>
  </div>
  <p class="note">General guidance based on common sleep-research rules of thumb — not medical advice.</p>
</div>
