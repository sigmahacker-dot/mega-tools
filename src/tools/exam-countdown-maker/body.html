<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:520px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="exam-countdown-maker-name">Exam name</label>
      <input class="input" type="text" id="exam-countdown-maker-name" placeholder="e.g. Physics final" maxlength="80">
    </div>
    <div class="field" style="text-align:left">
      <label for="exam-countdown-maker-when">Date &amp; time</label>
      <input class="input" type="datetime-local" id="exam-countdown-maker-when">
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="exam-countdown-maker-add">Add exam</button>
  </div>
  <div id="exam-countdown-maker-hero" class="hidden" style="margin:16px 0">
    <p class="muted" style="margin:0 0 4px">Next up: <strong id="exam-countdown-maker-hero-name"></strong></p>
    <div class="countdown-digits" style="justify-content:center">
      <div class="cd-cell"><span id="exam-countdown-maker-h-d">0</span><small>days</small></div>
      <div class="cd-cell"><span id="exam-countdown-maker-h-h">0</span><small>hrs</small></div>
      <div class="cd-cell"><span id="exam-countdown-maker-h-m">0</span><small>min</small></div>
      <div class="cd-cell"><span id="exam-countdown-maker-h-s">0</span><small>sec</small></div>
    </div>
  </div>
  <div id="exam-countdown-maker-list" style="max-width:560px;margin:0 auto;text-align:left"></div>
  <div class="error" id="exam-countdown-maker-error"></div>
</div>
