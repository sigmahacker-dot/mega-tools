<div class="tool-card">
  <h2>PDF Metadata Editor</h2>
  <p class="muted">Read and edit a PDF's title, author, subject and keywords.</p>
  <div class="field">
    <label for="pdf-metadata-editor-file">Choose a PDF</label>
    <input type="file" class="input" id="pdf-metadata-editor-file" accept=".pdf,application/pdf">
  </div>
  <div class="error" id="pdf-metadata-editor-error"></div>
  <div class="result hidden" id="pdf-metadata-editor-result">
    <table class="data">
      <tbody>
        <tr><th scope="row">Current title</th><td id="pdf-metadata-editor-cur-title">–</td></tr>
        <tr><th scope="row">Current author</th><td id="pdf-metadata-editor-cur-author">–</td></tr>
        <tr><th scope="row">Current subject</th><td id="pdf-metadata-editor-cur-subject">–</td></tr>
        <tr><th scope="row">Current keywords</th><td id="pdf-metadata-editor-cur-keywords">–</td></tr>
      </tbody>
    </table>
    <div class="field">
      <label for="pdf-metadata-editor-title">Title</label>
      <input type="text" class="input" id="pdf-metadata-editor-title" placeholder="Document title">
    </div>
    <div class="field">
      <label for="pdf-metadata-editor-author">Author</label>
      <input type="text" class="input" id="pdf-metadata-editor-author" placeholder="Author name">
    </div>
    <div class="field">
      <label for="pdf-metadata-editor-subject">Subject</label>
      <input type="text" class="input" id="pdf-metadata-editor-subject" placeholder="Subject">
    </div>
    <div class="field">
      <label for="pdf-metadata-editor-keywords">Keywords</label>
      <input type="text" class="input" id="pdf-metadata-editor-keywords" placeholder="comma, separated, keywords">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="pdf-metadata-editor-save">Save metadata</button>
      <button class="btn btn-outline" id="pdf-metadata-editor-clear">Clear</button>
    </div>
    <p class="note">Empty fields are cleared from the metadata. Document content is never modified.</p>
  </div>
</div>
