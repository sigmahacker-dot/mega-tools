<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="riddle-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="riddle-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="riddle-game-done">0</div><div class="l">Solved</div></div>
  </div>
  <div id="riddle-game-q" style="font-size:21px;font-weight:bold;margin:16px auto;max-width:560px;min-height:60px;line-height:1.5">Press Start for your first riddle!</div>
  <p class="muted" id="riddle-game-msg" style="min-height:24px">Type your answer below.</p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="riddle-game-guess">Your answer</label>
      <input class="input" id="riddle-game-guess" placeholder="What is it?…" autocomplete="off" disabled>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="riddle-game-submit" style="width:100%" disabled>Answer</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="riddle-game-start">▶ Start</button>
    <button class="btn btn-outline" id="riddle-game-reveal" disabled>👁 Show Answer</button>
    <button class="btn btn-outline" id="riddle-game-skip" disabled>Skip ↷</button>
  </div>
  <div class="error" id="riddle-game-error"></div>
</div>
