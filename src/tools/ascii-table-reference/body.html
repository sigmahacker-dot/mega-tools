<div class="tool-card">
  <div class="field"><label for="ascii-q">Search <span class="hint">(decimal, hex like 0x41, character, or name like NUL)</span></label><input type="text" class="input" id="ascii-q" placeholder="e.g. 65, 0x41, A, LF"></div>
  <div class="error" id="ascii-table-reference-error"></div>
  <div class="result" id="ascii-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ascii-count">128</div><div class="l">Codes shown</div></div>
    </div>
    <div style="max-height:440px;overflow-y:auto">
      <table class="data"><thead><tr><th>Dec</th><th>Hex</th><th>Oct</th><th>Char</th><th>Name</th><th>HTML</th></tr></thead><tbody id="ascii-body"></tbody></table>
    </div>
  </div>
</div>
