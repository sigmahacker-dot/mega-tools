<div class="tool-card">
  <div class="dropzone" id="webp-converter-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop images here</strong> or click to browse
    <input type="file" id="webp-converter-file" accept="image/*" multiple class="hidden">
  </div>
  <ul class="file-list" id="webp-converter-list"></ul>
  <div class="field">
    <label for="webp-converter-quality">WebP quality: <span id="webp-converter-quality-val">85</span></label>
    <input type="range" id="webp-converter-quality" min="10" max="100" value="85">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="webp-converter-go">Convert to WebP</button>
    <button class="btn btn-outline hidden" id="webp-converter-zip">Download all as ZIP</button>
  </div>
  <div class="result hidden" id="webp-converter-result">
    <table class="data">
      <thead><tr><th>File</th><th>Original</th><th>WebP size</th><th>Saved</th><th></th></tr></thead>
      <tbody id="webp-converter-rows"></tbody>
    </table>
  </div>
  <div class="error" id="webp-converter-error"></div>
  <p class="note">WebP is supported in all modern browsers (Chrome, Edge, Firefox, Safari 14+) and keeps transparency like PNG. Files never leave your device — everything is processed in your browser.</p>
</div>
