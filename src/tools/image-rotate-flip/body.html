<div class="tool-card">
  <div class="dropzone" id="image-rotate-flip-drop">
    <span class="dz-icon">🔄</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-rotate-flip-file" accept="image/*" class="hidden">
  </div>
  <div class="btn-row hidden" id="image-rotate-flip-controls">
    <button class="btn btn-outline" id="image-rotate-flip-left" type="button">⟲ Rotate left</button>
    <button class="btn btn-outline" id="image-rotate-flip-right" type="button">⟳ Rotate right</button>
    <button class="btn btn-outline" id="image-rotate-flip-h" type="button">⇋ Flip H</button>
    <button class="btn btn-outline" id="image-rotate-flip-v" type="button">⇅ Flip V</button>
    <button class="btn btn-outline btn-sm" id="image-rotate-flip-reset" type="button">Reset</button>
  </div>
  <div class="error" id="image-rotate-flip-error"></div>
  <div class="result hidden" id="image-rotate-flip-result">
    <canvas class="preview" id="image-rotate-flip-canvas" style="max-width:100%;height:auto;border-radius:8px;"></canvas>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-primary" id="image-rotate-flip-download">Download PNG</button>
    </div>
    <p class="note">Exported as PNG at full resolution. Your original file is never modified.</p>
  </div>
</div>
