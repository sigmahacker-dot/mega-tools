<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="espp-calculator-fmvstart">FMV at offering date ($)</label>
      <input type="number" class="input" id="espp-calculator-fmvstart" min="0" step="any" placeholder="50">
    </div>
    <div class="field">
      <label for="espp-calculator-fmvend">FMV at purchase date ($)</label>
      <input type="number" class="input" id="espp-calculator-fmvend" min="0" step="any" placeholder="60">
    </div>
    <div class="field">
      <label for="espp-calculator-discount">Discount (%)</label>
      <input type="number" class="input" id="espp-calculator-discount" min="0" max="100" step="any" placeholder="15">
    </div>
    <div class="field">
      <label for="espp-calculator-contrib">Your contribution ($)</label>
      <input type="number" class="input" id="espp-calculator-contrib" min="0" step="any" placeholder="3000">
    </div>
  </div>
  <div class="error" id="espp-calculator-error"></div>
  <div class="result" id="espp-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="espp-calculator-price">&ndash;</div><div class="l">Purchase price / share</div></div>
      <div class="stat-card"><div class="v" id="espp-calculator-shares">&ndash;</div><div class="l">Shares purchased</div></div>
      <div class="stat-card"><div class="v" id="espp-calculator-value">&ndash;</div><div class="l">Market value</div></div>
      <div class="stat-card"><div class="v" id="espp-calculator-gain">&ndash;</div><div class="l">Instant gain</div></div>
      <div class="stat-card"><div class="v" id="espp-calculator-return">&ndash;</div><div class="l">Return</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice. Assumes a lookback to the lower FMV; check your plan document.</p>
  </div>
</div>
