<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="song-title-generator-mood">Mood</label>
      <select class="select" id="song-title-generator-mood">
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="angry">Angry</option>
        <option value="romantic">Romantic</option>
        <option value="chill">Chill</option>
        <option value="party">Party</option>
        <option value="nostalgic">Nostalgic</option>
        <option value="motivational">Motivational</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="song-title-generator-go" type="button">Generate Titles</button>
      </div>
    </div>
  </div>
  <div class="error" id="song-title-generator-error"></div>
  <div class="mt" id="song-title-generator-list"></div>
</div>
