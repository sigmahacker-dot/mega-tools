<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="synthetic-division-calculator-coeffs">Dividend coefficients (highest → constant)</label>
      <input class="input" id="synthetic-division-calculator-coeffs" type="text" placeholder="e.g. 2 3 -4 1" value="2 3 -4 1" style="font-family:monospace">
    </div>
    <div class="field">
      <label for="synthetic-division-calculator-c">Divisor (x − c): enter c</label>
      <input class="input" id="synthetic-division-calculator-c" type="number" step="any" value="2">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="synthetic-division-calculator-divide">Divide</button>
    <button type="button" class="btn btn-outline btn-sm" id="synthetic-division-calculator-copy">Copy result</button>
  </div>
  <div class="error" id="synthetic-division-calculator-error"></div>
  <div id="synthetic-division-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="synthetic-division-calculator-quot" style="font-family:monospace;font-size:1em">–</div><div class="l">Quotient coefficients</div></div>
      <div class="stat-card"><div class="v" id="synthetic-division-calculator-rem">–</div><div class="l">Remainder (= P(c))</div></div>
    </div>
    <div class="result">
      <h3>Tableau</h3>
      <div id="synthetic-division-calculator-table" style="overflow-x:auto"></div>
    </div>
    <div class="result">
      <h3>Steps</h3>
      <div id="synthetic-division-calculator-steps"></div>
    </div>
  </div>
</div>
