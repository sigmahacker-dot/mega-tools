<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="http-q">Search code or name</label><input type="text" class="input" id="http-q" placeholder="e.g. 404 or not found"></div>
    <div class="field"><label for="http-class">Class filter</label>
      <select class="select" id="http-class">
        <option value="">All classes</option>
        <option value="1">1xx Informational</option>
        <option value="2">2xx Success</option>
        <option value="3">3xx Redirection</option>
        <option value="4">4xx Client error</option>
        <option value="5">5xx Server error</option>
      </select>
    </div>
  </div>
  <div class="error" id="http-status-lookup-error"></div>
  <div class="result" id="http-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="http-count">–</div><div class="l">Codes shown</div></div>
    </div>
    <div style="max-height:440px;overflow-y:auto">
      <table class="data"><thead><tr><th>Code</th><th>Name</th><th>Meaning</th></tr></thead><tbody id="http-body"></tbody></table>
    </div>
  </div>
</div>
