<div class="tool-card">
  <div class="field">
    <label for="repeated-word-finder-input">Your text</label>
    <textarea class="textarea" id="repeated-word-finder-input" rows="8" placeholder="Paste your writing here..."></textarea>
  </div>
  <div class="error" id="repeated-word-finder-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="repeated-word-finder-doubles">0</div><div class="l">Double-words</div></div>
    <div class="stat-card"><div class="v" id="repeated-word-finder-repeated">0</div><div class="l">Repeated words</div></div>
    <div class="stat-card"><div class="v" id="repeated-word-finder-top">–</div><div class="l">Most repeated</div></div>
  </div>
  <div class="result mt">
    <div id="repeated-word-finder-out" class="muted" style="white-space:pre-wrap;line-height:1.8;">Results appear here as you type.</div>
    <table class="data mt">
      <thead><tr><th>Word</th><th>Count</th><th>% of words</th></tr></thead>
      <tbody id="repeated-word-finder-body"><tr><td colspan="3" class="muted">Frequency table appears here.</td></tr></tbody>
    </table>
  </div>
</div>
