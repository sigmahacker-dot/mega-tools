<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="flight-time-calculator-dep">Departure (origin local)</label>
      <input class="input" id="flight-time-calculator-dep" type="datetime-local">
    </div>
    <div class="field">
      <label for="flight-time-calculator-durh">Duration hours</label>
      <input class="input" id="flight-time-calculator-durh" type="number" min="0" step="1" value="7">
    </div>
    <div class="field">
      <label for="flight-time-calculator-durm">Duration minutes</label>
      <input class="input" id="flight-time-calculator-durm" type="number" min="0" max="59" step="1" value="30">
    </div>
    <div class="field">
      <label for="flight-time-calculator-off1">Origin UTC offset (hours)</label>
      <input class="input" id="flight-time-calculator-off1" type="number" min="-12" max="14" step="0.5" value="5">
    </div>
    <div class="field">
      <label for="flight-time-calculator-off2">Destination UTC offset (hours)</label>
      <input class="input" id="flight-time-calculator-off2" type="number" min="-12" max="14" step="0.5" value="4">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="flight-time-calculator-calc">Calculate</button>
    </div>
  </div>
  <div class="error" id="flight-time-calculator-error"></div>
  <div id="flight-time-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="flight-time-calculator-arr" style="font-size:1.05em">–</div><div class="l">Arrival (destination local)</div></div>
      <div class="stat-card"><div class="v" id="flight-time-calculator-utc">–</div><div class="l">Arrival (UTC)</div></div>
    </div>
    <div class="result">
      <h3>Timeline</h3>
      <div id="flight-time-calculator-steps"></div>
    </div>
  </div>
</div>
