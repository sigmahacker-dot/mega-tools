<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ideal-weight-calculator-height">Height (cm)</label>
      <input class="input" id="ideal-weight-calculator-height" type="number" min="100" max="250" step="0.5" placeholder="e.g. 175">
    </div>
    <div class="field">
      <label for="ideal-weight-calculator-sex">Sex</label>
      <select class="input" id="ideal-weight-calculator-sex">
        <option value="m">Male</option>
        <option value="f">Female</option>
      </select>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="ideal-weight-calculator-calc">Calculate</button></div>
  <div class="stat-cards hidden" id="ideal-weight-calculator-out">
    <div class="stat-card"><div class="v" id="ideal-weight-calculator-range">–</div><div class="l">Healthy range (kg)</div></div>
  </div>
  <div class="result hidden" id="ideal-weight-calculator-table"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. These formulas estimate frame-based ideals and ignore muscle mass.</p>
  <div class="error" id="ideal-weight-calculator-error"></div>
</div>
