<div class="tool-card">
  <div class="field">
    <label for="weasel-word-highlighter-input">Your text</label>
    <textarea class="textarea" id="weasel-word-highlighter-input" rows="8" placeholder="Paste your draft here..."></textarea>
  </div>
  <div class="error" id="weasel-word-highlighter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="weasel-word-highlighter-count">0</div><div class="l">Weasel words</div></div>
    <div class="stat-card"><div class="v" id="weasel-word-highlighter-unique">0</div><div class="l">Unique</div></div>
    <div class="stat-card"><div class="v" id="weasel-word-highlighter-density">0%</div><div class="l">Of all words</div></div>
  </div>
  <div class="result mt">
    <div id="weasel-word-highlighter-out" class="muted" style="white-space:pre-wrap;line-height:1.8;">Highlights appear here as you type.</div>
    <table class="data mt">
      <thead><tr><th>Weasel word</th><th>Times used</th></tr></thead>
      <tbody id="weasel-word-highlighter-body"><tr><td colspan="2" class="muted">No weasel words found yet.</td></tr></tbody>
    </table>
    <p class="note">Checks against a built-in bank of 95+ weasel words and filler phrases, matched case-insensitively.</p>
  </div>
</div>
