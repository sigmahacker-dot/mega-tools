<div class="tool-card">
  <div class="field">
    <label for="sql-formatter-input">SQL input</label>
    <textarea class="textarea" id="sql-formatter-input" rows="8" placeholder="Paste SQL here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="sql-formatter-format">Format SQL</button>
    <button class="btn btn-outline" id="sql-formatter-sample">Load sample</button>
    <label style="display:inline-flex;align-items:center;gap:6px;">
      <input type="checkbox" id="sql-formatter-upper" checked> Uppercase keywords
    </label>
  </div>
  <div class="error" id="sql-formatter-error"></div>
  <div class="field">
    <label for="sql-formatter-output">Formatted SQL</label>
    <textarea class="textarea" id="sql-formatter-output" rows="12" readonly placeholder="Formatted SQL will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="sql-formatter-copy">Copy SQL</button>
  </div>
</div>
