<div class="tool-card">
  <div class="row">
    <div class="field" style="flex:1;">
      <label for="weather-app-city">City</label>
      <input class="input" id="weather-app-city" type="text" placeholder="e.g. Lahore" autocomplete="off" maxlength="80">
    </div>
    <div class="field" style="align-self:end;">
      <button class="btn btn-primary" id="weather-app-get" type="button">Get Weather</button>
    </div>
  </div>
  <div class="error" id="weather-app-error"></div>
  <div class="result hidden" id="weather-app-result">
    <p class="center" style="font-size:1.25rem;font-weight:700;" id="weather-app-place"></p>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="weather-app-temp">&ndash;</div><div class="l">Temperature</div></div>
      <div class="stat-card"><div class="v" id="weather-app-feels">&ndash;</div><div class="l">Feels like</div></div>
      <div class="stat-card"><div class="v" id="weather-app-humidity">&ndash;</div><div class="l">Humidity</div></div>
      <div class="stat-card"><div class="v" id="weather-app-wind">&ndash;</div><div class="l">Wind</div></div>
    </div>
    <p class="center" id="weather-app-desc"></p>
    <div class="field mt">
      <label>5-day forecast</label>
      <div class="stat-cards" id="weather-app-daily"></div>
    </div>
  </div>
  <p class="note">Temperatures in &deg;C, wind in km/h. Data comes from ToolNest&rsquo;s live weather API.</p>
</div>
