<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cp-buy">Buy price ($)</label><input type="number" class="input" id="cp-buy" min="0" step="any" placeholder="30000"></div>
    <div class="field"><label for="cp-sell">Sell price ($)</label><input type="number" class="input" id="cp-sell" min="0" step="any" placeholder="42000"></div>
    <div class="field"><label for="cp-amount">Amount (coins)</label><input type="number" class="input" id="cp-amount" min="0" step="any" placeholder="0.5"></div>
    <div class="field"><label for="cp-buyfee">Buy fee (%)</label><input type="number" class="input" id="cp-buyfee" min="0" max="100" step="any" placeholder="0.5"></div>
    <div class="field"><label for="cp-sellfee">Sell fee (%)</label><input type="number" class="input" id="cp-sellfee" min="0" max="100" step="any" placeholder="0.5"></div>
  </div>
  <div class="error" id="crypto-profit-calculator-error"></div>
  <div class="result" id="cp-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cp-profit">–</div><div class="l">Net profit / loss</div></div>
      <div class="stat-card"><div class="v" id="cp-roi">–</div><div class="l">ROI</div></div>
      <div class="stat-card"><div class="v" id="cp-fees">–</div><div class="l">Total fees</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Item</th><th>Amount</th></tr></thead>
      <tbody id="cp-body"><tr><td colspan="2" class="muted">Enter trade details.</td></tr></tbody>
    </table>
  </div>
</div>
