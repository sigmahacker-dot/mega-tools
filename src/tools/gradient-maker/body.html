<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="gradient-maker-c1">Color 1</label>
      <input type="color" class="input" id="gradient-maker-c1" value="#4D7C0F" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label for="gradient-maker-c2">Color 2</label>
      <input type="color" class="input" id="gradient-maker-c2" value="#166534" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label for="gradient-maker-c3">Color 3</label>
      <input type="color" class="input" id="gradient-maker-c3" value="#0ea5e9" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label for="gradient-maker-type">Type</label>
      <select class="select" id="gradient-maker-type">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
        <option value="conic">Conic</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="gradient-maker-angle">Angle: <span id="gradient-maker-angle-v">135</span>°</label>
    <input type="range" id="gradient-maker-angle" min="0" max="360" value="135">
  </div>
  <div class="error" id="gradient-maker-error"></div>
  <div class="result mt">
    <div id="gradient-maker-preview" style="height:140px;border-radius:12px;border:1px solid var(--line);"></div>
    <div class="field mt">
      <label for="gradient-maker-css">CSS code</label>
      <input type="text" class="input" id="gradient-maker-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="gradient-maker-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
