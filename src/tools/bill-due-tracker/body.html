<div class="tool-card">
  <div class="grid2" style="margin-bottom:8px">
    <div class="field">
      <label for="bill-due-tracker-name">Bill name</label>
      <input class="input" type="text" id="bill-due-tracker-name" placeholder="e.g. Electricity" maxlength="60">
    </div>
    <div class="field">
      <label for="bill-due-tracker-amount">Amount</label>
      <input class="input" type="number" id="bill-due-tracker-amount" min="0" step="0.01" placeholder="e.g. 2500">
    </div>
  </div>
  <div class="grid2" style="margin-bottom:8px">
    <div class="field">
      <label for="bill-due-tracker-day">Due day of month (1–31)</label>
      <input class="input" type="number" id="bill-due-tracker-day" min="1" max="31" placeholder="e.g. 15">
    </div>
    <div class="field" style="display:flex;align-items:flex-end">
      <button class="btn btn-primary" id="bill-due-tracker-add" style="width:100%">Add bill</button>
    </div>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="bill-due-tracker-total">0</div><div class="l">Bills tracked</div></div>
    <div class="stat-card"><div class="v" id="bill-due-tracker-duesoon">0</div><div class="l">Due within 7 days</div></div>
    <div class="stat-card"><div class="v" id="bill-due-tracker-monthsum">—</div><div class="l">Monthly total</div></div>
  </div>
  <div id="bill-due-tracker-list"></div>
  <div class="error" id="bill-due-tracker-error"></div>
</div>
