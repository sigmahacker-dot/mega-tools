<div class="tool-card">
  <div class="field">
    <label for="remove-vowels-tool-input">Your text</label>
    <textarea class="textarea" id="remove-vowels-tool-input" rows="4" placeholder="Type or paste text here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="remove-vowels-tool-go" type="button">Remove Vowels</button>
  </div>
  <div class="error" id="remove-vowels-tool-error"></div>
  <div class="stat-cards" id="remove-vowels-tool-stats" style="margin-top:12px">
    <div class="stat-card"><div class="v" id="remove-vowels-tool-count">0</div><div class="l">Vowels removed</div></div>
    <div class="stat-card"><div class="v" id="remove-vowels-tool-left">0</div><div class="l">Characters left</div></div>
  </div>
  <div class="field" style="margin-top:12px">
    <label>Result</label>
    <div class="result" id="remove-vowels-tool-output">Your vowel-free text will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="remove-vowels-tool-copy" type="button">Copy Result</button>
  </div>
</div>
