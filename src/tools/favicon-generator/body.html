<div class="tool-card">
  <div class="dropzone" id="favicon-generator-drop">
    <span class="dz-icon">⭐</span>
    <strong>Drop your logo here</strong> or click to browse
    <input type="file" id="favicon-generator-file" accept="image/*" class="hidden">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="favicon-generator-go" disabled>Generate favicons</button>
  </div>
  <div id="favicon-generator-result" class="hidden">
    <h3 class="mt">Preview</h3>
    <div class="stat-cards" id="favicon-generator-grid"></div>
    <div class="btn-row mt">
      <button class="btn btn-outline" id="favicon-generator-zip">Download ZIP</button>
      <button class="btn btn-outline" id="favicon-generator-copy">Copy HTML snippet</button>
    </div>
    <div class="field mt">
      <label for="favicon-generator-snippet">HTML — paste into your page's &lt;head&gt;</label>
      <textarea class="textarea code" id="favicon-generator-snippet" rows="8" readonly></textarea>
    </div>
    <div class="success" id="favicon-generator-success"></div>
  </div>
  <div class="error" id="favicon-generator-error"></div>
  <p class="note">Generates a PNG favicon set (universally supported); .ico format not included. Files never leave your device — everything is processed in your browser.</p>
</div>
