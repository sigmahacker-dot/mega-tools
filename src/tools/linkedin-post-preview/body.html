<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="linkedin-post-preview-name">Your name</label>
      <input class="input" type="text" id="linkedin-post-preview-name" placeholder="Jane Doe">
    </div>
    <div class="field">
      <label for="linkedin-post-preview-headline">Headline</label>
      <input class="input" type="text" id="linkedin-post-preview-headline" placeholder="Marketing Lead @ Acme">
    </div>
  </div>
  <div class="field">
    <label for="linkedin-post-preview-text">Post text</label>
    <textarea class="textarea" id="linkedin-post-preview-text" rows="6" placeholder="Write your LinkedIn post…"></textarea>
  </div>
  <div class="field">
    <label for="linkedin-post-preview-img">Image URL (optional)</label>
    <input class="input" type="url" id="linkedin-post-preview-img" placeholder="https://example.com/image.png">
  </div>
  <div class="btn-row">
    <button class="btn" id="linkedin-post-preview-render">Render Preview</button>
    <button class="btn btn-outline" id="linkedin-post-preview-copy">Copy Post Text</button>
  </div>
  <div class="error" id="linkedin-post-preview-error"></div>
  <p class="muted"><span id="linkedin-post-preview-count">0</span> characters</p>
</div>

<div class="tool-card">
  <h3>Preview</h3>
  <div id="linkedin-post-preview-mock" style="max-width:560px"></div>
</div>
