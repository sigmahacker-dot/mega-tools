<div class="tool-card">
  <div class="field">
    <label for="golden-ratio-calculator-base">Base value</label>
    <input type="number" class="input" id="golden-ratio-calculator-base" value="100" min="0.01" step="any">
  </div>
  <div class="error" id="golden-ratio-calculator-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="golden-ratio-calculator-phi">1.6180339887</div><div class="l">φ (constant)</div></div>
    <div class="stat-card"><div class="v" id="golden-ratio-calculator-up">–</div><div class="l">Base × φ</div></div>
    <div class="stat-card"><div class="v" id="golden-ratio-calculator-down">–</div><div class="l">Base ÷ φ</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Step</th><th>Value</th></tr></thead>
      <tbody id="golden-ratio-calculator-body"></tbody>
    </table>
    <div class="field mt">
      <label>Golden rectangle <span class="muted">(aspect ratio φ : 1)</span></label>
      <div id="golden-ratio-calculator-rect" style="background:linear-gradient(135deg,#4D7C0F,#166534);border-radius:10px;max-width:100%;"></div>
    </div>
  </div>
</div>
