<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="wall-length">Total wall length (ft)</label><input type="number" class="input" id="wall-length" min="0" step="any" placeholder="40"></div>
    <div class="field"><label for="wall-height">Wall height (ft)</label><input type="number" class="input" id="wall-height" min="0" step="any" placeholder="8"></div>
    <div class="field"><label for="wall-coverage">Coverage per roll (sq ft)</label><input type="number" class="input" id="wall-coverage" min="0" step="any" placeholder="56"></div>
    <div class="field"><label for="wall-repeat">Large pattern repeat?</label>
      <select class="input" id="wall-repeat"><option value="no">No / small repeat</option><option value="yes">Yes, add 1 spare roll</option></select>
    </div>
  </div>
  <div class="error" id="wallpaper-calculator-error"></div>
  <div class="result" id="wall-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="wall-rolls">–</div><div class="l">Rolls to buy</div></div>
      <div class="stat-card"><div class="v" id="wall-area">–</div><div class="l">Wall area</div></div>
      <div class="stat-card"><div class="v" id="wall-strips">–</div><div class="l">Strips needed</div></div>
    </div>
    <p class="note">Strips assume a 27 in (2.25 ft) wide roll. Always buy all rolls from the same dye lot.</p>
  </div>
</div>
