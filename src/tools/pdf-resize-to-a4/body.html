<div class="tool-card">
  <h2>Resize PDF to A4</h2>
  <p class="muted">Scale every page to fit A4 — orientation auto-detected per page, aspect ratio preserved.</p>
  <div class="field">
    <label for="pdf-resize-to-a4-file">PDF file</label>
    <input type="file" class="input" id="pdf-resize-to-a4-file" accept=".pdf,application/pdf">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="pdf-resize-to-a4-orient">Page orientation</label>
      <select class="input" id="pdf-resize-to-a4-orient">
        <option value="auto">Auto (per page)</option>
        <option value="portrait">Force portrait</option>
        <option value="landscape">Force landscape</option>
      </select>
    </div>
    <div class="field">
      <label for="pdf-resize-to-a4-pad">Padding: <span id="pdf-resize-to-a4-pad-v">0.3in</span></label>
      <input type="range" class="input" id="pdf-resize-to-a4-pad" min="0" max="1" step="0.05" value="0.3">
    </div>
  </div>
  <div id="pdf-resize-to-a4-info" class="muted" style="margin:8px 0"></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="pdf-resize-to-a4-go" disabled>Resize to A4 &amp; Download</button>
  </div>
  <div class="error" id="pdf-resize-to-a4-error"></div>
  <div class="result hidden" id="pdf-resize-to-a4-result"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
