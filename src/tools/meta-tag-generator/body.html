<div class="tool-card">
  <div class="error" id="meta-tag-generator-error"></div>
  <div class="grid2">
    <div>
      <div class="field">
        <label for="meta-tag-generator-title">Page title</label>
        <input class="input" id="meta-tag-generator-title" type="text" maxlength="70" placeholder="e.g. Best Hiking Trails in Pakistan 2026">
      </div>
      <div class="field">
        <label for="meta-tag-generator-description">Meta description</label>
        <textarea class="textarea" id="meta-tag-generator-description" rows="3" maxlength="160" placeholder="Short summary shown in search results (up to ~160 characters)"></textarea>
      </div>
      <div class="field">
        <label for="meta-tag-generator-keywords">Keywords (comma separated)</label>
        <input class="input" id="meta-tag-generator-keywords" type="text" placeholder="hiking, pakistan, trails">
      </div>
      <div class="field">
        <label for="meta-tag-generator-author">Author</label>
        <input class="input" id="meta-tag-generator-author" type="text" placeholder="Your name or brand">
      </div>
      <div class="field">
        <label for="meta-tag-generator-theme-color">Theme color</label>
        <input class="input" id="meta-tag-generator-theme-color" type="color" value="#166534">
      </div>
    </div>
    <div>
      <div class="field">
        <label for="meta-tag-generator-og-title">Open Graph title</label>
        <input class="input" id="meta-tag-generator-og-title" type="text" placeholder="Leave blank to reuse page title">
      </div>
      <div class="field">
        <label for="meta-tag-generator-og-description">Open Graph description</label>
        <textarea class="textarea" id="meta-tag-generator-og-description" rows="3" placeholder="Leave blank to reuse meta description"></textarea>
      </div>
      <div class="field">
        <label for="meta-tag-generator-og-image">Open Graph image URL</label>
        <input class="input" id="meta-tag-generator-og-image" type="url" placeholder="https://example.com/share-image.jpg">
      </div>
      <div class="field">
        <label for="meta-tag-generator-twitter-card">Twitter card type</label>
        <select class="select" id="meta-tag-generator-twitter-card">
          <option value="summary">summary</option>
          <option value="summary_large_image" selected>summary_large_image</option>
        </select>
      </div>
      <p class="note">Tags and previews update live as you type. Copy or download the block and paste it inside your page's &lt;head&gt;.</p>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="meta-tag-generator-copy" type="button">Copy HTML</button>
    <button class="btn btn-outline" id="meta-tag-generator-download" type="button">Download .html</button>
  </div>
  <div class="success hidden" id="meta-tag-generator-success"></div>
  <div class="result hidden" id="meta-tag-generator-output">
    <pre id="meta-tag-generator-code"></pre>
  </div>
  <div class="result hidden" id="meta-tag-generator-preview">
    <p class="muted">Search result preview</p>
    <div id="meta-tag-generator-google" style="background:#fff;border:1px solid #e2e6f5;border-radius:10px;padding:12px 14px;margin:8px 0;max-width:560px"></div>
    <p class="muted">Social card preview</p>
    <div id="meta-tag-generator-social" style="margin:8px 0"></div>
  </div>
</div>
