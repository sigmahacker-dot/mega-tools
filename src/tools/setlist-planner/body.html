<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="setlist-planner-name">Song name</label>
      <input type="text" id="setlist-planner-name" class="input" maxlength="80" placeholder="e.g. Midnight Run">
    </div>
    <div class="field">
      <label for="setlist-planner-dur">Duration</label>
      <input type="text" id="setlist-planner-dur" class="input" placeholder="3:45 or 3.75" maxlength="10">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="setlist-planner-add" style="width:100%">Add song</button>
    </div>
  </div>
  <div class="result" id="setlist-planner-list-wrap">
    <table class="data">
      <thead><tr><th>#</th><th>Song</th><th>Duration</th><th>Encore</th><th></th></tr></thead>
      <tbody id="setlist-planner-rows"></tbody>
    </table>
    <p class="muted" id="setlist-planner-empty">No songs yet — add your first song above.</p>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="setlist-planner-main">0:00</div><div class="l">Main set</div></div>
    <div class="stat-card"><div class="v" id="setlist-planner-encore">0:00</div><div class="l">Encore</div></div>
    <div class="stat-card"><div class="v" id="setlist-planner-total">0:00</div><div class="l">Total stage time</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="setlist-planner-copy">Copy setlist</button>
    <button class="btn btn-outline" id="setlist-planner-clear">Clear all</button>
  </div>
  <div class="error" id="setlist-planner-error"></div>
  <p class="note">Saved automatically in this browser. Durations accept m:ss or decimal minutes.</p>
</div>
