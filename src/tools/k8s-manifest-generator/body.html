<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="k8s-manifest-generator-name">App name</label>
      <input class="input" id="k8s-manifest-generator-name" value="my-app">
    </div>
    <div class="field">
      <label for="k8s-manifest-generator-image">Image</label>
      <input class="input" id="k8s-manifest-generator-image" value="nginx:1.27">
    </div>
    <div class="field">
      <label for="k8s-manifest-generator-replicas">Replicas</label>
      <input class="input" id="k8s-manifest-generator-replicas" type="number" value="2" min="1" max="50">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="k8s-manifest-generator-port">Container port</label>
      <input class="input" id="k8s-manifest-generator-port" type="number" value="80" min="1" max="65535">
    </div>
    <div class="field">
      <label for="k8s-manifest-generator-svcport">Service port</label>
      <input class="input" id="k8s-manifest-generator-svcport" type="number" value="80" min="1" max="65535">
    </div>
    <div class="field">
      <label for="k8s-manifest-generator-svctype">Service type</label>
      <select class="select" id="k8s-manifest-generator-svctype">
        <option>ClusterIP</option>
        <option>NodePort</option>
        <option>LoadBalancer</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="k8s-manifest-generator-namespace">Namespace</label>
      <input class="input" id="k8s-manifest-generator-namespace" value="default">
    </div>
    <div class="field">
      <label for="k8s-manifest-generator-env">Env vars (one KEY=value per line)</label>
      <textarea class="textarea" id="k8s-manifest-generator-env" rows="2">NODE_ENV=production
LOG_LEVEL=info</textarea>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="k8s-manifest-generator-generate">Generate YAML</button>
  </div>
  <div class="error" id="k8s-manifest-generator-error"></div>
  <div class="field">
    <label for="k8s-manifest-generator-output">Kubernetes manifests</label>
    <textarea class="textarea" id="k8s-manifest-generator-output" rows="18" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="k8s-manifest-generator-copy">Copy YAML</button>
    <button class="btn btn-outline" id="k8s-manifest-generator-download">Download deployment.yaml</button>
  </div>
</div>
