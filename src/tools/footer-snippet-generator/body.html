<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="footer-snippet-generator-brand">Brand name</label>
      <input class="input" id="footer-snippet-generator-brand" value="Acme">
    </div>
    <div class="field">
      <label for="footer-snippet-generator-tagline">Tagline</label>
      <input class="input" id="footer-snippet-generator-tagline" value="Build something great.">
    </div>
  </div>
  <div class="field">
    <label for="footer-snippet-generator-cols">Columns (one per line: "Title|Link1|Link2|Link3")</label>
    <textarea class="textarea" id="footer-snippet-generator-cols" rows="4">Product|Features|Pricing|Changelog
Company|About|Careers|Press
Resources|Blog|Docs|Support
Legal|Privacy|Terms|Cookies</textarea>
  </div>
  <div class="field">
    <label for="footer-snippet-generator-social">Social links (one per line: "Label|https://…")</label>
    <textarea class="textarea" id="footer-snippet-generator-social" rows="2">Twitter|https://twitter.com
GitHub|https://github.com
LinkedIn|https://linkedin.com</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="footer-snippet-generator-copyright">Copyright text</label>
      <input class="input" id="footer-snippet-generator-copyright" value="© 2026 Acme Inc. All rights reserved.">
    </div>
    <div class="field">
      <label for="footer-snippet-generator-bg">Background</label>
      <input class="input" id="footer-snippet-generator-bg" type="color" value="#18181b">
    </div>
    <div class="field">
      <label for="footer-snippet-generator-accent">Accent</label>
      <input class="input" id="footer-snippet-generator-accent" type="color" value="#4d7c0f">
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="footer-snippet-generator-preview" style="border:1px solid #27272a;border-radius:12px;overflow:hidden"></div>
  </div>
  <div class="error" id="footer-snippet-generator-error"></div>
  <div class="field">
    <label for="footer-snippet-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="footer-snippet-generator-output" rows="16" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="footer-snippet-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="footer-snippet-generator-download">Download footer.html</button>
  </div>
</div>
