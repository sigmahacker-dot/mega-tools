<div class="tool-card">
  <div class="dropzone" id="pencil-sketch-effect-drop">
    <span class="dz-icon">✏️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="pencil-sketch-effect-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="pencil-sketch-effect-wrap" style="text-align:center">
    <canvas id="pencil-sketch-effect-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pencil-sketch-effect-download">Download PNG</button>
  </div>
  <div class="error" id="pencil-sketch-effect-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
