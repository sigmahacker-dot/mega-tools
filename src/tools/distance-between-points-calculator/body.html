<div class="tool-card">
  <div class="field"><label for="distance-between-points-calculator-dim">Dimension</label>
    <select class="input" id="distance-between-points-calculator-dim">
      <option value="2">2D (x, y)</option><option value="3">3D (x, y, z)</option>
    </select>
  </div>
  <div class="grid2">
    <div class="field"><label for="distance-between-points-calculator-x1">x\u2081</label><input class="input" id="distance-between-points-calculator-x1" type="number" value="1" step="any"></div>
    <div class="field"><label for="distance-between-points-calculator-y1">y\u2081</label><input class="input" id="distance-between-points-calculator-y1" type="number" value="2" step="any"></div>
    <div class="field hidden" id="distance-between-points-calculator-z1w"><label for="distance-between-points-calculator-z1">z\u2081</label><input class="input" id="distance-between-points-calculator-z1" type="number" value="0" step="any"></div>
    <div class="field"><label for="distance-between-points-calculator-x2">x\u2082</label><input class="input" id="distance-between-points-calculator-x2" type="number" value="4" step="any"></div>
    <div class="field"><label for="distance-between-points-calculator-y2">y\u2082</label><input class="input" id="distance-between-points-calculator-y2" type="number" value="6" step="any"></div>
    <div class="field hidden" id="distance-between-points-calculator-z2w"><label for="distance-between-points-calculator-z2">z\u2082</label><input class="input" id="distance-between-points-calculator-z2" type="number" value="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="distance-between-points-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="distance-between-points-calculator-d">5</div><div class="l">Distance</div></div>
    <div class="stat-card"><div class="v" id="distance-between-points-calculator-d2">25</div><div class="l">Distance\u00B2</div></div>
  </div>
  <div class="result"><pre class="code" id="distance-between-points-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="distance-between-points-calculator-error"></div>
</div>
