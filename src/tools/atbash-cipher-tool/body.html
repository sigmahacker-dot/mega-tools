<div class="tool-card">
  <div class="field">
    <label for="atbash-cipher-tool-input">Input text</label>
    <textarea class="textarea" id="atbash-cipher-tool-input" rows="5" placeholder="Type text to apply Atbash"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="atbash-cipher-tool-run">Apply Atbash</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="atbash-cipher-tool-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="atbash-cipher-tool-copy">Copy output</button></div>
  </div>
  <p class="hint">Atbash is its own inverse — applying it twice restores the original.</p>
  <div class="error" id="atbash-cipher-tool-error"></div>
</div>
