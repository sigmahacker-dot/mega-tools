<div class="tool-card">
  <div class="result">
    <h3>Segments</h3>
    <div id="debate-timer-segs"></div>
    <div class="grid3" style="margin-top:8px">
      <div class="field"><label for="debate-timer-name">Segment name</label><input class="input" id="debate-timer-name" type="text" placeholder="e.g. Rebuttal"></div>
      <div class="field"><label for="debate-timer-mins">Minutes</label><input class="input" id="debate-timer-mins" type="number" min="0.5" max="120" step="0.5" value="3"></div>
      <div class="field" style="align-self:end"><button type="button" class="btn btn-outline btn-sm" id="debate-timer-add">+ Add</button></div>
    </div>
  </div>
  <div class="error" id="debate-timer-error"></div>
  <div class="result" style="text-align:center">
    <p class="muted" id="debate-timer-cur-label">Ready</p>
    <p id="debate-timer-clock" style="font-size:3.2em;font-family:monospace;margin:4px 0">05:00</p>
    <p class="muted" id="debate-timer-next"></p>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn" id="debate-timer-start">Start</button>
      <button type="button" class="btn btn-outline" id="debate-timer-nextbtn">Next segment</button>
      <button type="button" class="btn btn-outline" id="debate-timer-reset">Reset</button>
    </div>
  </div>
</div>
