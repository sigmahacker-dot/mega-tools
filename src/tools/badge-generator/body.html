<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="badge-generator-text">Badge text</label>
      <input class="input" id="badge-generator-text" value="NEW">
    </div>
    <div class="field">
      <label for="badge-generator-bg">Background</label>
      <input class="input" id="badge-generator-bg" type="color" value="#4d7c0f">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="badge-generator-size">Size</label>
      <select class="select" id="badge-generator-size">
        <option value="sm">Small</option>
        <option value="md" selected>Medium</option>
        <option value="lg">Large</option>
      </select>
    </div>
    <div class="field">
      <label for="badge-generator-radius">Corners</label>
      <select class="select" id="badge-generator-radius">
        <option value="pill" selected>Pill</option>
        <option value="rounded">Rounded</option>
        <option value="square">Square</option>
      </select>
    </div>
    <div class="field">
      <label for="badge-generator-dotcolor">Dot color</label>
      <input class="input" id="badge-generator-dotcolor" type="color" value="#ffffff">
    </div>
  </div>
  <div class="grid3">
    <div class="field checkline"><input type="checkbox" id="badge-generator-auto" checked><label for="badge-generator-auto">Auto text color</label></div>
    <div class="field checkline"><input type="checkbox" id="badge-generator-upper" checked><label for="badge-generator-upper">Uppercase</label></div>
    <div class="field checkline"><input type="checkbox" id="badge-generator-dot"><label for="badge-generator-dot">Status dot</label></div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="badge-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:32px;background:#18181b;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap"></div>
  </div>
  <div class="error" id="badge-generator-error"></div>
  <div class="field">
    <label for="badge-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="badge-generator-output" rows="12" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="badge-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="badge-generator-download">Download badge.html</button>
  </div>
</div>
