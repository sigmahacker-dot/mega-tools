<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="youtube-description-generator-title">Video title</label>
      <input class="input" type="text" id="youtube-description-generator-title" placeholder="Video title">
    </div>
    <div class="field">
      <label for="youtube-description-generator-topic">Main topic / keyword</label>
      <input class="input" type="text" id="youtube-description-generator-topic" placeholder="e.g. budget travel tips">
    </div>
  </div>
  <div class="field">
    <label for="youtube-description-generator-hook">Hook (first 2 lines viewers see)</label>
    <textarea class="textarea" id="youtube-description-generator-hook" rows="2" placeholder="What will viewers learn? Why watch?"></textarea>
  </div>
  <div class="field">
    <label for="youtube-description-generator-points">Key points covered (one per line)</label>
    <textarea class="textarea" id="youtube-description-generator-points" rows="3" placeholder="Point one&#10;Point two"></textarea>
  </div>
  <div class="field">
    <label for="youtube-description-generator-chapters">Chapters — one per line as "mm:ss topic"</label>
    <textarea class="textarea" id="youtube-description-generator-chapters" rows="3" placeholder="00:00 Intro&#10;02:15 Main tips"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="youtube-description-generator-links">Links (one per line as "label | url")</label>
      <textarea class="textarea" id="youtube-description-generator-links" rows="3" placeholder="My website | https://example.com"></textarea>
    </div>
    <div class="field">
      <label for="youtube-description-generator-cta">Call to action</label>
      <select class="select" id="youtube-description-generator-cta">
        <option value="subscribe">Subscribe + bell</option>
        <option value="comment">Comment your thoughts</option>
        <option value="share">Share with a friend</option>
        <option value="playlist">Watch the playlist</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="youtube-description-generator-gen">Generate Description</button>
    <button class="btn btn-outline" id="youtube-description-generator-copy">Copy Description</button>
  </div>
  <div class="error" id="youtube-description-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Description</h3>
  <pre id="youtube-description-generator-out" style="white-space:pre-wrap;font-family:inherit"></pre>
</div>
