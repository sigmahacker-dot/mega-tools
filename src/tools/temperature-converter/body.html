<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="temperature-converter-c">Celsius (°C)</label>
      <input type="number" step="any" class="input" id="temperature-converter-c" placeholder="0">
    </div>
    <div class="field">
      <label for="temperature-converter-f">Fahrenheit (°F)</label>
      <input type="number" step="any" class="input" id="temperature-converter-f" placeholder="32">
    </div>
    <div class="field">
      <label for="temperature-converter-k">Kelvin (K)</label>
      <input type="number" step="any" class="input" id="temperature-converter-k" placeholder="273.15">
    </div>
    <div class="field">
      <label for="temperature-converter-r">Rankine (°R)</label>
      <input type="number" step="any" class="input" id="temperature-converter-r" placeholder="491.67">
    </div>
  </div>
  <div class="error" id="temperature-converter-error"></div>
  <p class="note">Type in any field — the other three update instantly. Absolute zero is −273.15 °C.</p>
</div>
