<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="shift-scheduler-start">Rotation start date</label>
      <input type="date" class="input" id="shift-scheduler-start">
    </div>
    <div class="field">
      <label for="shift-scheduler-on">Days on</label>
      <input type="number" class="input" id="shift-scheduler-on" min="1" max="30" step="1" value="4">
    </div>
    <div class="field">
      <label for="shift-scheduler-off">Days off</label>
      <input type="number" class="input" id="shift-scheduler-off" min="1" max="30" step="1" value="4">
    </div>
    <div class="field">
      <label for="shift-scheduler-total">Days to show (1–120)</label>
      <input type="number" class="input" id="shift-scheduler-total" min="1" max="120" step="1" value="28">
    </div>
    <div class="field">
      <label for="shift-scheduler-pattern">Shift pattern</label>
      <select class="select" id="shift-scheduler-pattern">
        <option value="day">Day shifts</option>
        <option value="night">Night shifts</option>
        <option value="alt">Alternating day / night</option>
      </select>
    </div>
  </div>
  <div class="error" id="shift-scheduler-error"></div>
  <div class="result" id="shift-scheduler-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="shift-scheduler-ondays">–</div><div class="l">Working days</div></div>
      <div class="stat-card"><div class="v" id="shift-scheduler-offdays">–</div><div class="l">Days off</div></div>
      <div class="stat-card"><div class="v" id="shift-scheduler-cycles">–</div><div class="l">Full rotations</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Shift</th></tr></thead>
      <tbody id="shift-scheduler-body">
        <tr><td colspan="4" class="muted">Set the rotation to generate the schedule.</td></tr>
      </tbody>
    </table>
  </div>
</div>
