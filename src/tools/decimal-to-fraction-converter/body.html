<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="decimal-to-fraction-converter-dec">Decimal number</label><input class="input" id="decimal-to-fraction-converter-dec" type="text" inputmode="decimal" value="0.75"></div>
    <div class="field"><label for="decimal-to-fraction-converter-max">Max denominator (optional)</label><input class="input" id="decimal-to-fraction-converter-max" type="number" value="" placeholder="e.g. 100"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="decimal-to-fraction-converter-go">Convert</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="decimal-to-fraction-converter-frac">3/4</div><div class="l">Simplified fraction</div></div>
    <div class="stat-card"><div class="v" id="decimal-to-fraction-converter-mixed">3/4</div><div class="l">As mixed number</div></div>
  </div>
  <div class="result"><pre class="code" id="decimal-to-fraction-converter-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="decimal-to-fraction-converter-error"></div>
</div>
