<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="chord-finder-root">Root note</label>
      <select class="select" id="chord-finder-root">
        <option>C</option><option>C#</option><option>D</option><option>D#</option>
        <option>E</option><option>F</option><option>F#</option><option>G</option>
        <option>G#</option><option>A</option><option>A#</option><option>B</option>
      </select>
    </div>
    <div class="field">
      <label for="chord-finder-type">Chord type</label>
      <select class="select" id="chord-finder-type">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="7">7th (dominant)</option>
        <option value="maj7">Major 7th</option>
        <option value="min7">Minor 7th</option>
        <option value="dim">Diminished</option>
        <option value="aug">Augmented</option>
        <option value="sus4">Suspended 4th</option>
      </select>
    </div>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="chord-finder-name" style="font-size:1.6rem">C</div><div class="l">Chord</div></div>
    <div class="stat-card"><div class="v" id="chord-finder-notes" style="font-size:1.1rem">C – E – G</div><div class="l">Notes</div></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="chord-finder-play">🔊 Play chord</button>
  </div>
  <div class="error" id="chord-finder-error"></div>
  <p class="note">Chords are synthesized live with Web Audio. Files never leave your device — everything is processed in your browser.</p>
</div>
