<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="link-in-bio-maker-name">Name</label>
      <input class="input" type="text" id="link-in-bio-maker-name" placeholder="Your name">
    </div>
    <div class="field">
      <label for="link-in-bio-maker-tag">Tagline</label>
      <input class="input" type="text" id="link-in-bio-maker-tag" placeholder="e.g. Traveler & photographer">
    </div>
  </div>
  <div class="field">
    <label for="link-in-bio-maker-bio">Bio</label>
    <textarea class="textarea" id="link-in-bio-maker-bio" rows="2" placeholder="Short bio…"></textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="link-in-bio-maker-label">Link label</label>
      <input class="input" type="text" id="link-in-bio-maker-label" placeholder="e.g. My YouTube">
    </div>
    <div class="field">
      <label for="link-in-bio-maker-url">Link URL</label>
      <input class="input" type="url" id="link-in-bio-maker-url" placeholder="https://…">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-outline" id="link-in-bio-maker-add">Add Link</button></div>
    </div>
  </div>
  <div class="field">
    <label for="link-in-bio-maker-theme">Theme</label>
    <select class="select" id="link-in-bio-maker-theme">
      <option value="midnight">Midnight</option>
      <option value="sunset">Sunset</option>
      <option value="forest">Forest</option>
      <option value="paper">Paper</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn" id="link-in-bio-maker-dl">Download HTML</button>
    <button class="btn btn-outline" id="link-in-bio-maker-clear">Clear Links</button>
  </div>
  <div class="error" id="link-in-bio-maker-error"></div>
  <div id="link-in-bio-maker-links" style="margin-top:10px"></div>
</div>

<div class="tool-card">
  <h3>Live preview</h3>
  <div id="link-in-bio-maker-preview" style="max-width:420px;margin:0 auto"></div>
</div>
