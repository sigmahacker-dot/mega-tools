<div class="tool-card">
  <div class="field" style="max-width:320px">
    <label for="sleep-debt-calculator-target">Nightly sleep target (hours)</label>
    <input class="input" id="sleep-debt-calculator-target" type="number" min="4" max="12" step="0.5" value="8">
  </div>
  <div id="sleep-debt-calculator-days" class="grid2"></div>
  <div class="btn-row"><button class="btn btn-primary" id="sleep-debt-calculator-calc">Calculate debt</button></div>
  <div class="stat-cards hidden" id="sleep-debt-calculator-out">
    <div class="stat-card"><div class="v" id="sleep-debt-calculator-total">–</div><div class="l">Total sleep debt</div></div>
    <div class="stat-card"><div class="v" id="sleep-debt-calculator-avg">–</div><div class="l">Avg nightly sleep</div></div>
  </div>
  <div class="result hidden" id="sleep-debt-calculator-table"></div>
  <p class="hint" id="sleep-debt-calculator-plan"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Persistent insomnia or snoring deserves a clinician's attention.</p>
  <div class="error" id="sleep-debt-calculator-error"></div>
</div>
