<div class="tool-card">
  <div class="field">
    <label for="env-example-generator-input">.env contents</label>
    <textarea class="textarea" id="env-example-generator-input" rows="10" placeholder="Paste your .env here — values are stripped locally, nothing is uploaded."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="env-example-generator-generate">Generate .env.example</button>
    <button class="btn btn-outline" id="env-example-generator-sample">Load sample</button>
  </div>
  <div class="error" id="env-example-generator-error"></div>
  <div class="field">
    <label for="env-example-generator-output">.env.example</label>
    <textarea class="textarea" id="env-example-generator-output" rows="10" readonly placeholder="Stripped template will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="env-example-generator-copy">Copy</button>
    <button class="btn btn-outline" id="env-example-generator-download">Download .env.example</button>
  </div>
</div>
