<div class="tool-card">
  <div class="error" id="battery-status-checker-error"></div>
  <p class="note hidden" id="battery-status-checker-unsupported">Battery API not supported in this browser (e.g. Firefox/Safari desktop).</p>
  <div id="battery-status-checker-out" class="hidden">
    <div class="progress"><div id="battery-status-checker-bar"></div></div>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="battery-status-checker-level">–</div><div class="l">Battery level</div></div>
      <div class="stat-card"><div class="v" id="battery-status-checker-charging">–</div><div class="l">Charging</div></div>
      <div class="stat-card"><div class="v" id="battery-status-checker-time">–</div><div class="l" id="battery-status-checker-time-label">Time remaining</div></div>
    </div>
    <p class="muted">Plug or unplug your charger to watch the values update live. Time estimates are the browser's best guess and change with your usage.</p>
  </div>
</div>
