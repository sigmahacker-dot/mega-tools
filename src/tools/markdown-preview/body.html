<div class="tool-card">
  <div class="field"><label for="md-src">Markdown</label><textarea class="textarea" id="md-src" rows="12" placeholder="# Hello&#10;&#10;Type **markdown** here..."></textarea></div>
  <div class="error" id="markdown-preview-error"></div>
  <div class="result" id="md-result">
    <div class="field"><label>Preview</label><div id="md-out" style="border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;min-height:120px;background:#0c0c11"></div></div>
    <div class="btn-row">
      <button class="btn btn-outline" id="md-copy-html" type="button">Copy HTML</button>
      <button class="btn btn-outline" id="md-clear" type="button">Clear</button>
    </div>
  </div>
</div>
