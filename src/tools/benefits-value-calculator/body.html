<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="benefits-value-calculator-salary">Base salary ($/yr)</label>
      <input type="number" class="input" id="benefits-value-calculator-salary" min="0" step="any" placeholder="85000">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-health">Employer-paid health insurance ($/yr)</label>
      <input type="number" class="input" id="benefits-value-calculator-health" min="0" step="any" placeholder="9000">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-contrib">Your retirement contribution (%)</label>
      <input type="number" class="input" id="benefits-value-calculator-contrib" min="0" max="100" step="any" placeholder="6">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-matchrate">Employer match rate (%)</label>
      <input type="number" class="input" id="benefits-value-calculator-matchrate" min="0" max="100" step="any" placeholder="50">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-matchcap">Match applies to first (%)</label>
      <input type="number" class="input" id="benefits-value-calculator-matchcap" min="0" max="100" step="any" placeholder="6">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-pto">PTO days / yr</label>
      <input type="number" class="input" id="benefits-value-calculator-pto" min="0" step="1" placeholder="18">
    </div>
    <div class="field">
      <label for="benefits-value-calculator-perks">Other perks ($/yr)</label>
      <input type="number" class="input" id="benefits-value-calculator-perks" min="0" step="any" placeholder="1200">
    </div>
  </div>
  <div class="error" id="benefits-value-calculator-error"></div>
  <div class="result" id="benefits-value-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-salary">&ndash;</div><div class="l">Salary</div></div>
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-health">&ndash;</div><div class="l">Health insurance</div></div>
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-match">&ndash;</div><div class="l">Employer match</div></div>
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-pto">&ndash;</div><div class="l">PTO value</div></div>
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-perks">&ndash;</div><div class="l">Other perks</div></div>
      <div class="stat-card"><div class="v" id="benefits-value-calculator-v-total">&ndash;</div><div class="l">Total compensation</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
