<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="pxrem-base">Root font size (px)</label><input type="number" class="input" id="pxrem-base" min="1" max="100" step="any" value="16"></div>
    <div class="field"><label for="pxrem-px">Pixels (px)</label><input type="number" class="input" id="pxrem-px" step="any" placeholder="24"></div>
    <div class="field"><label for="pxrem-rem">Rem</label><input type="number" class="input" id="pxrem-rem" step="any" placeholder="1.5"></div>
  </div>
  <div class="error" id="px-to-rem-converter-error"></div>
  <div class="result" id="pxrem-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pxrem-out">–</div><div class="l" id="pxrem-out-l">Result</div></div>
    </div>
    <div style="max-height:300px;overflow-y:auto">
      <table class="data"><thead><tr><th>px</th><th>rem</th></tr></thead><tbody id="pxrem-table"></tbody></table>
    </div>
  </div>
</div>
