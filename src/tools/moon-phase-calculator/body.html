<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="moon-phase-calculator-date">Date</label>
      <input type="date" class="input" id="moon-phase-calculator-date">
    </div>
  </div>
  <div class="error" id="moon-phase-calculator-error"></div>
  <div class="result" id="moon-phase-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="moon-phase-calculator-emoji" style="font-size:2rem;">–</div><div class="l" id="moon-phase-calculator-name">Phase</div></div>
      <div class="stat-card"><div class="v" id="moon-phase-calculator-illum">–</div><div class="l">Illumination</div></div>
      <div class="stat-card"><div class="v" id="moon-phase-calculator-age">–</div><div class="l">Moon age (days)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Event</th><th>Date</th></tr></thead>
      <tbody id="moon-phase-calculator-body"></tbody>
    </table>
    <p class="note">Approximate — computed from the 29.530588853-day synodic month, accurate to about a day.</p>
  </div>
</div>
