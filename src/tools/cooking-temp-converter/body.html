<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cooking-temp-converter-value">Oven temperature</label>
      <input type="number" step="any" class="input" id="cooking-temp-converter-value" placeholder="e.g. 350">
    </div>
    <div class="field">
      <label for="cooking-temp-converter-from">Entered as</label>
      <select class="select" id="cooking-temp-converter-from">
        <option value="F" selected>Fahrenheit (°F)</option>
        <option value="C">Celsius (°C)</option>
      </select>
    </div>
  </div>
  <div class="error" id="cooking-temp-converter-error"></div>
  <div class="result" id="cooking-temp-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cooking-temp-converter-converted">–</div><div class="l">Converted</div></div>
      <div class="stat-card"><div class="v" id="cooking-temp-converter-gasmark">–</div><div class="l">Nearest gas mark</div></div>
      <div class="stat-card"><div class="v" id="cooking-temp-converter-desc">–</div><div class="l">Oven descriptor</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Gas mark</th><th>°C</th><th>°F</th></tr></thead>
      <tbody id="cooking-temp-converter-table"></tbody>
    </table>
  </div>
</div>
