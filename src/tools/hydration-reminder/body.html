<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="hyd-weight">Body weight</label><input type="number" class="input" id="hyd-weight" min="0" step="any" placeholder="70"></div>
    <div class="field"><label for="hyd-unit">Weight unit</label>
      <select class="input" id="hyd-unit"><option value="kg">Kilograms (kg)</option><option value="lb">Pounds (lb)</option></select>
    </div>
    <div class="field"><label for="hyd-every">Remind me every</label>
      <select class="input" id="hyd-every"><option value="30">30 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="120">2 hours</option></select>
    </div>
    <div class="field"><label>Log water</label>
      <div>
        <button class="btn" id="hyd-250">+250 ml</button>
        <button class="btn" id="hyd-500">+500 ml</button>
        <button class="btn" id="hyd-reset">Reset day</button>
      </div>
    </div>
  </div>
  <div class="error" id="hydration-reminder-error"></div>
  <div class="result" id="hyd-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hyd-drank">–</div><div class="l">Drank today</div></div>
      <div class="stat-card"><div class="v" id="hyd-goal">–</div><div class="l">Daily goal</div></div>
      <div class="stat-card"><div class="v" id="hyd-left">–</div><div class="l">Remaining</div></div>
    </div>
    <div class="field"><label for="hyd-bar">Progress</label><progress class="input" id="hyd-bar" max="100" value="0" style="width:100%"></progress></div>
    <p class="muted" id="hyd-detail">Enter your weight to set a goal.</p>
  </div>
</div>
