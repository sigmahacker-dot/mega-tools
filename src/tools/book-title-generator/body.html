<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="book-title-generator-genre">Genre</label>
      <select class="select" id="book-title-generator-genre">
        <option value="romance">Romance</option>
        <option value="thriller">Thriller</option>
        <option value="fantasy">Fantasy</option>
        <option value="scifi">Sci-Fi</option>
        <option value="mystery">Mystery</option>
        <option value="horror">Horror</option>
        <option value="nonfiction">Nonfiction</option>
        <option value="kids">Children's</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="book-title-generator-go" type="button">Generate Titles</button>
      </div>
    </div>
  </div>
  <div class="error" id="book-title-generator-error"></div>
  <div class="mt" id="book-title-generator-list"></div>
</div>
