<div class="tool-card">
  <div class="field">
    <label for="caption-counter-input">Your caption</label>
    <textarea class="textarea" id="caption-counter-input" rows="7" placeholder="Write your Instagram caption here..."></textarea>
  </div>
  <div class="error" id="caption-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="caption-counter-chars">0 / 2200</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="caption-counter-tags">0 / 30</div><div class="l">Hashtags</div></div>
    <div class="stat-card"><div class="v" id="caption-counter-mentions">0</div><div class="l">Mentions</div></div>
    <div class="stat-card"><div class="v" id="caption-counter-words">0</div><div class="l">Words</div></div>
  </div>
  <div class="result mt">
    <div class="field">
      <label>Feed preview <span class="muted">(folds after ~125 characters)</span></label>
      <div style="border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;max-width:480px;">
        <div style="font-weight:700;font-size:.9rem;margin-bottom:6px;">your_account</div>
        <div style="font-size:.9rem;line-height:1.5;" id="caption-counter-preview">Your caption preview appears here…</div>
      </div>
    </div>
  </div>
</div>
