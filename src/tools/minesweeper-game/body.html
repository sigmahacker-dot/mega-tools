<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="minesweeper-game-diff">Difficulty</label>
      <select class="input" id="minesweeper-game-diff">
        <option value="9,9,10">Beginner — 9×9, 10 mines</option>
        <option value="16,16,40">Intermediate — 16×16, 40 mines</option>
        <option value="16,30,99">Expert — 16×30, 99 mines</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label for="minesweeper-game-flagmode">Tap mode</label>
      <select class="input" id="minesweeper-game-flagmode">
        <option value="dig">⛏️ Reveal</option>
        <option value="flag">🚩 Flag</option>
      </select>
    </div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="minesweeper-game-mines">10</div><div class="l">Mines left</div></div>
    <div class="stat-card"><div class="v" id="minesweeper-game-time">0</div><div class="l">Seconds</div></div>
  </div>
  <p class="muted" id="minesweeper-game-msg" style="min-height:24px">Right-click (or 🚩 mode) to flag.</p>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="minesweeper-game-board" style="display:inline-grid;gap:2px;background:#9e9e9e;padding:4px;border-radius:6px"></div>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="minesweeper-game-new">New game</button>
  </div>
  <div class="error" id="minesweeper-game-error"></div>
</div>
