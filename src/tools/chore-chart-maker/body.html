<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="chore-chart-maker-member">Family member</label>
      <div style="display:flex;gap:8px">
        <input class="input" type="text" id="chore-chart-maker-member" placeholder="e.g. Mom">
        <button class="btn btn-outline" id="chore-chart-maker-addmember">Add</button>
      </div>
    </div>
    <div class="field">
      <label for="chore-chart-maker-chore">Chore</label>
      <div style="display:flex;gap:8px">
        <input class="input" type="text" id="chore-chart-maker-chore" placeholder="e.g. Dishes">
        <button class="btn btn-outline" id="chore-chart-maker-addchore">Add</button>
      </div>
    </div>
  </div>
  <div class="error" id="chore-chart-maker-error"></div>
</div>

<div class="tool-card">
  <p class="muted">Click a cell to cycle through family members. Members: <span id="chore-chart-maker-members"></span></p>
  <div style="overflow-x:auto">
    <table id="chore-chart-maker-grid" style="width:100%;border-collapse:collapse;min-width:640px"></table>
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="chore-chart-maker-print">Print Chart</button>
    <button class="btn btn-outline" id="chore-chart-maker-reset">Reset Chart</button>
  </div>
</div>
