<div class="tool-card">
  <div class="field">
    <label for="palindrome-checker-input">Your text</label>
    <textarea class="textarea" id="palindrome-checker-input" rows="6" placeholder="e.g. A man, a plan, a canal: Panama"></textarea>
  </div>
  <div class="grid2">
    <div class="checkbox-row"><input type="checkbox" id="palindrome-checker-case" checked> <label for="palindrome-checker-case">Ignore case</label></div>
    <div class="checkbox-row"><input type="checkbox" id="palindrome-checker-space" checked> <label for="palindrome-checker-space">Ignore spaces</label></div>
    <div class="checkbox-row"><input type="checkbox" id="palindrome-checker-punct" checked> <label for="palindrome-checker-punct">Ignore punctuation</label></div>
  </div>
  <div class="error" id="palindrome-checker-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="palindrome-checker-result">–</div><div class="l">Palindrome?</div></div>
    <div class="stat-card"><div class="v" id="palindrome-checker-len">0</div><div class="l">Characters checked</div></div>
    <div class="stat-card"><div class="v" id="palindrome-checker-longest">–</div><div class="l">Longest palindromic part</div></div>
  </div>
  <p class="note">All checks run in your browser — nothing is uploaded.</p>
</div>
