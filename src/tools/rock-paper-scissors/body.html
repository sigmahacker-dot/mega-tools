<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="rock-paper-scissors-you">0</div><div class="l">You</div></div>
    <div class="stat-card"><div class="v" id="rock-paper-scissors-comp">0</div><div class="l">Computer</div></div>
    <div class="stat-card"><div class="v" id="rock-paper-scissors-round">1</div><div class="l">Round</div></div>
  </div>
  <div class="btn-row center rps-choices">
    <button type="button" class="btn btn-outline rps-btn" data-choice="rock" id="rock-paper-scissors-c-rock">🪨<span>Rock</span></button>
    <button type="button" class="btn btn-outline rps-btn" data-choice="paper" id="rock-paper-scissors-c-paper">📄<span>Paper</span></button>
    <button type="button" class="btn btn-outline rps-btn" data-choice="scissors" id="rock-paper-scissors-c-scissors">✂️<span>Scissors</span></button>
  </div>
  <div class="error" id="rock-paper-scissors-error"></div>
  <div class="result center" id="rock-paper-scissors-result">
    <p class="muted">First to 3 round wins takes the match. Good luck!</p>
  </div>
  <div class="field">
    <label>Round history</label>
    <ul class="rps-history" id="rock-paper-scissors-history"><li class="muted">No rounds played yet.</li></ul>
  </div>
  <style>
    .rps-choices{gap:10px}
    .rps-btn{font-size:1.8rem;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 22px}
    .rps-btn span{font-size:.8rem}
    .rps-btn:disabled{opacity:.45;cursor:default}
    .rps-history{list-style:none;margin:0;padding:0;font-size:.92rem;line-height:1.9}
    .rps-history li{border-bottom:1px dashed #e2e8f0}
  </style>
</div>
