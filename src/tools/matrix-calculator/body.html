<div class="tool-card">
  <div class="field">
    <label for="matrix-calculator-size">Matrix size</label>
    <select class="select" id="matrix-calculator-size">
      <option value="2">2 &times; 2</option>
      <option value="3">3 &times; 3</option>
    </select>
  </div>
  <div class="grid2">
    <div class="field">
      <label>Matrix A</label>
      <div id="matrix-calculator-grid-a" style="display:grid;gap:6px;"></div>
    </div>
    <div class="field">
      <label>Matrix B</label>
      <div id="matrix-calculator-grid-b" style="display:grid;gap:6px;"></div>
    </div>
  </div>
  <div class="btn-row" id="matrix-calculator-ops" style="flex-wrap:wrap;gap:8px;">
    <button type="button" class="btn btn-outline btn-sm" data-op="add">A + B</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="sub">A &minus; B</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="mul">A &times; B</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="detA">det(A)</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="detB">det(B)</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="invA">inv(A)</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="invB">inv(B)</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="trA">Aᵀ</button>
    <button type="button" class="btn btn-outline btn-sm" data-op="trB">Bᵀ</button>
  </div>
  <div class="error" id="matrix-calculator-error"></div>
  <div class="result" id="matrix-calculator-result">
    <div class="field">
      <label id="matrix-calculator-result-label">Result</label>
      <div id="matrix-calculator-out" style="display:grid;gap:6px;max-width:280px;"></div>
    </div>
    <p class="note" id="matrix-calculator-note"></p>
  </div>
</div>
