<div class="tool-card">
  <h2>Split PDF</h2>
  <p class="muted">Extract exactly the pages you want into a new PDF.</p>
  <div class="field">
    <label for="pdf-splitter-file">PDF file</label>
    <input type="file" id="pdf-splitter-file" class="input" accept=".pdf,application/pdf">
  </div>
  <p class="muted" id="pdf-splitter-info">No file loaded yet.</p>
  <div class="field">
    <label for="pdf-splitter-ranges">Pages to extract</label>
    <input type="text" id="pdf-splitter-ranges" class="input" placeholder="e.g. 1-3, 5, 8-10">
    <p class="muted">Use single pages (5), ranges (1-3), or mix them with commas: 1-3, 5, 8-10.</p>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pdf-splitter-split">Extract pages</button>
    <button class="btn btn-outline" id="pdf-splitter-clear">Clear</button>
  </div>
  <div class="error" id="pdf-splitter-error"></div>
  <div class="result hidden" id="pdf-splitter-result"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
