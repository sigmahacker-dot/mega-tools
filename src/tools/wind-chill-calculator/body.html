<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="wind-chill-calculator-temp">Air temperature</label>
      <input type="number" step="any" class="input" id="wind-chill-calculator-temp" placeholder="e.g. 20">
    </div>
    <div class="field">
      <label for="wind-chill-calculator-tunit">Temperature unit</label>
      <select class="select" id="wind-chill-calculator-tunit">
        <option value="F" selected>Fahrenheit (°F)</option>
        <option value="C">Celsius (°C)</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="wind-chill-calculator-wind">Wind speed</label>
      <input type="number" step="any" min="0" class="input" id="wind-chill-calculator-wind" placeholder="e.g. 15">
    </div>
    <div class="field">
      <label for="wind-chill-calculator-wunit">Wind unit</label>
      <select class="select" id="wind-chill-calculator-wunit">
        <option value="mph" selected>mph</option>
        <option value="kmh">km/h</option>
      </select>
    </div>
  </div>
  <div class="error" id="wind-chill-calculator-error"></div>
  <div class="result" id="wind-chill-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="wind-chill-calculator-wc">–</div><div class="l">Wind chill</div></div>
      <div class="stat-card"><div class="v" id="wind-chill-calculator-diff">–</div><div class="l">Feels colder by</div></div>
    </div>
    <p class="note" id="wind-chill-calculator-note">NWS formula. Valid only at or below 50°F (10°C) with wind ≥ 3 mph (4.8 km/h).</p>
  </div>
</div>
