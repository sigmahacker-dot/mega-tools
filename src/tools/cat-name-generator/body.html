<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cat-name-generator-style">Style</label>
      <select class="select" id="cat-name-generator-style">
        <option value="mischievous">Mischievous</option>
        <option value="regal">Regal</option>
        <option value="food">Food names</option>
      </select>
    </div>
    <div class="field">
      <label for="cat-name-generator-count">How many</label>
      <select class="select" id="cat-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="cat-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="cat-name-generator-error"></div>
  <div class="mt" id="cat-name-generator-list"></div>
</div>
