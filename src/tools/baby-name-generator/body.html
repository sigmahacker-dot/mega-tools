<div class="tool-card">
  <div class="row">
    <div class="field">
      <label for="baby-name-generator-gender">Gender</label>
      <select id="baby-name-generator-gender" class="select">
        <option value="boy">Boy</option>
        <option value="girl">Girl</option>
        <option value="any">Any</option>
      </select>
    </div>
    <div class="field">
      <label for="baby-name-generator-origin">Origin</label>
      <select id="baby-name-generator-origin" class="select">
        <option value="pakistani">Pakistani</option>
        <option value="arabic">Arabic</option>
        <option value="western">Western</option>
        <option value="indian">Indian</option>
        <option value="turkish">Turkish</option>
      </select>
    </div>
    <div class="field">
      <label for="baby-name-generator-count">How many</label>
      <select id="baby-name-generator-count" class="select">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="baby-name-generator-go">Generate Names</button>
  </div>
  <div class="error" id="baby-name-generator-error"></div>
  <div class="success" id="baby-name-generator-copied"></div>
  <div class="grid2 mt" id="baby-name-generator-list"></div>
  <p class="note">Tap any name to copy it to your clipboard.</p>
  <style>
    .name-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;cursor:pointer;transition:transform .1s,box-shadow .15s}
    .name-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
    .name-card:active{transform:scale(.98)}
    .name-card .nm{font-weight:800;font-size:1.05rem;color:#1e293b}
    .name-card .mn{font-size:.85rem;color:#64748b}
  </style>
</div>
