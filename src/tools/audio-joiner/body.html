<div class="tool-card">
  <div class="dropzone" id="audio-joiner-drop">
    <span class="dz-icon">🎵</span>
    <strong>Drop audio files here</strong> or click to browse (multiple)
    <input type="file" id="audio-joiner-file" accept="audio/*" multiple class="hidden">
  </div>
  <ul class="file-list" id="audio-joiner-list"></ul>
  <div class="stat-cards hidden" id="audio-joiner-stats">
    <div class="stat-card"><div class="v" id="audio-joiner-count">0</div><div class="l">Files</div></div>
    <div class="stat-card"><div class="v" id="audio-joiner-duration">0:00</div><div class="l">Total duration</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="audio-joiner-join">Join &amp; download WAV</button>
  </div>
  <div class="error" id="audio-joiner-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
