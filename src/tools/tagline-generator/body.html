<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tagline-generator-keywords">Keywords (comma separated)</label>
      <input class="input" id="tagline-generator-keywords" type="text" placeholder="e.g. coffee, mornings, fast" maxlength="80">
    </div>
    <div class="field">
      <label for="tagline-generator-tone">Tone</label>
      <select class="select" id="tagline-generator-tone">
        <option value="classic">Classic</option>
        <option value="playful">Playful</option>
        <option value="bold">Bold</option>
        <option value="minimal">Minimal</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="tagline-generator-go" type="button">Generate Taglines</button>
  </div>
  <div class="error" id="tagline-generator-error"></div>
  <div class="mt" id="tagline-generator-list"></div>
</div>
