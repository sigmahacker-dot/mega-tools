<div class="tool-card">
  <div class="field">
    <label for="prime-number-checker-input">Integer to test</label>
    <input type="text" class="input" id="prime-number-checker-input" placeholder="e.g. 99999999999999999989" inputmode="numeric" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="prime-number-checker-go">Check</button>
  </div>
  <div class="error" id="prime-number-checker-error"></div>
  <div class="result" id="prime-number-checker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="prime-number-checker-verdict">&ndash;</div><div class="l">Verdict</div></div>
      <div class="stat-card"><div class="v" id="prime-number-checker-factor">&ndash;</div><div class="l">Smallest factor</div></div>
    </div>
    <p class="note">Deterministic Miller-Rabin for n &lt; 2^64. Trial division searches factors up to 1,000,000.</p>
  </div>
</div>
