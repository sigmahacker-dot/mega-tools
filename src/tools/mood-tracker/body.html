<div class="tool-card">
  <div class="field">
    <label>Mood for <span id="mood-tracker-today"></span> (1 = very low, 5 = great)</label>
    <div class="btn-row" id="mood-tracker-pick">
      <button class="btn btn-outline" data-m="1">1 😞</button>
      <button class="btn btn-outline" data-m="2">2 😕</button>
      <button class="btn btn-outline" data-m="3">3 😐</button>
      <button class="btn btn-outline" data-m="4">4 🙂</button>
      <button class="btn btn-outline" data-m="5">5 😄</button>
    </div>
  </div>
  <div class="field">
    <label for="mood-tracker-note">Note (optional)</label>
    <input class="input" type="text" id="mood-tracker-note" placeholder="Why do you feel this way?">
  </div>
  <div class="btn-row">
    <button class="btn" id="mood-tracker-save">Save Mood</button>
  </div>
  <div class="error" id="mood-tracker-error"></div>
</div>

<div class="tool-card">
  <h3>Last 30 days</h3>
  <canvas id="mood-tracker-chart" width="900" height="260" style="width:100%;height:auto"></canvas>
  <div class="stat-cards" id="mood-tracker-stats"></div>
  <p class="note">For information only — not medical advice. If you are struggling, consider talking to a professional.</p>
</div>
