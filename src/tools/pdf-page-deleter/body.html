<div class="tool-card">
  <div class="field">
    <label for="pdf-page-deleter-file">Upload PDF</label>
    <input type="file" class="input" id="pdf-page-deleter-file" accept="application/pdf,.pdf">
  </div>
  <div class="field" id="pdf-page-deleter-form" hidden>
    <label for="pdf-page-deleter-pages">Pages to delete (e.g. 2, 5-8, 12)</label>
    <input type="text" class="input" id="pdf-page-deleter-pages" placeholder="2, 5-8">
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="pdf-page-deleter-go" disabled>Delete pages &amp; download</button>
  </div>
  <div class="error" id="pdf-page-deleter-error"></div>
  <div class="result" id="pdf-page-deleter-result" hidden>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-page-deleter-total">–</div><div class="l">Total pages</div></div>
      <div class="stat-card"><div class="v" id="pdf-page-deleter-del">–</div><div class="l">Pages to delete</div></div>
      <div class="stat-card"><div class="v" id="pdf-page-deleter-keep">–</div><div class="l">Pages kept</div></div>
    </div>
    <p class="muted" id="pdf-page-deleter-list"></p>
  </div>
</div>
