<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="rectangle-calculator-l">Length</label><input class="input" id="rectangle-calculator-l" type="number" value="8" min="0" step="any"></div>
    <div class="field"><label for="rectangle-calculator-w">Width</label><input class="input" id="rectangle-calculator-w" type="number" value="6" min="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="rectangle-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="rectangle-calculator-a">48</div><div class="l">Area</div></div>
    <div class="stat-card"><div class="v" id="rectangle-calculator-p">28</div><div class="l">Perimeter</div></div>
    <div class="stat-card"><div class="v" id="rectangle-calculator-d">10</div><div class="l">Diagonal</div></div>
  </div>
  <div class="result"><pre class="code" id="rectangle-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="rectangle-calculator-error"></div>
</div>
