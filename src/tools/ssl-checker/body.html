<div class="tool-card">
  <div class="error" id="ssl-checker-error"></div>
  <div class="field">
    <label for="ssl-checker-domain">Domain</label>
    <input class="input" id="ssl-checker-domain" type="text" placeholder="example.com" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="ssl-checker-check" type="button">Check SSL</button>
  </div>
  <div class="result hidden" id="ssl-checker-output">
    <div id="ssl-checker-badge" class="center" style="margin-bottom:8px"></div>
    <table class="data" id="ssl-checker-table"><tbody></tbody></table>
  </div>
  <p class="note">Checked live via our own API endpoint (/api/ssl). Paste just the domain — no https:// needed.</p>
</div>
