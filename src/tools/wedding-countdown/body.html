<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="wedding-countdown-date">Wedding date</label>
      <input type="date" class="input" id="wedding-countdown-date">
    </div>
    <div class="field">
      <label for="wedding-countdown-time">Ceremony time (optional)</label>
      <input type="time" class="input" id="wedding-countdown-time" value="12:00">
    </div>
  </div>
  <div class="error" id="wedding-countdown-error"></div>
  <div class="result" id="wedding-countdown-result">
    <div style="text-align:center;margin:10px 0;">
      <div class="muted" id="wedding-countdown-label" style="font-size:1rem;">Time remaining</div>
      <div id="wedding-countdown-display" style="font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;">–</div>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="wedding-countdown-weeks">–</div><div class="l">Weeks</div></div>
      <div class="stat-card"><div class="v" id="wedding-countdown-months">–</div><div class="l">Months (approx)</div></div>
      <div class="stat-card"><div class="v" id="wedding-countdown-dow">–</div><div class="l">Weekday</div></div>
    </div>
    <p class="note" id="wedding-countdown-note">Enter the wedding date to start the countdown.</p>
  </div>
</div>
