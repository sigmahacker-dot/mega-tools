<div class="tool-card">
  <div class="field">
    <label for="commission-calculator-sales">Total sales ($)</label>
    <input type="number" class="input" id="commission-calculator-sales" min="0" step="any" placeholder="75000">
  </div>
  <div class="field">
    <label>Commission tiers (applied marginally)</label>
    <div id="commission-calculator-tiers"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="commission-calculator-add" type="button">+ Add tier</button>
    </div>
    <p class="muted">Leave the last tier's "Up to" empty for no cap.</p>
  </div>
  <div class="error" id="commission-calculator-error"></div>
  <div class="result" id="commission-calculator-result">
    <div id="commission-calculator-out"></div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
