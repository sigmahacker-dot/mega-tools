<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="capital-gains-calculator-buy">Buy price per unit ($)</label><input class="input" id="capital-gains-calculator-buy" type="number" min="0" step="any" value="100"></div>
    <div class="field"><label for="capital-gains-calculator-sell">Sell price per unit ($)</label><input class="input" id="capital-gains-calculator-sell" type="number" min="0" step="any" value="160"></div>
    <div class="field"><label for="capital-gains-calculator-qty">Quantity</label><input class="input" id="capital-gains-calculator-qty" type="number" min="0" step="any" value="50"></div>
    <div class="field"><label for="capital-gains-calculator-holding">Holding period</label><select class="input select" id="capital-gains-calculator-holding"><option value="short">Short-term (≤ 1 year)</option><option value="long">Long-term (&gt; 1 year)</option></select></div>
    <div class="field"><label for="capital-gains-calculator-taxrate">Applicable tax rate (%)</label><input class="input" id="capital-gains-calculator-taxrate" type="number" min="0" max="100" step="any" value="15"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="capital-gains-calculator-calc">Calculate</button></div>
  <div class="error" id="capital-gains-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="capital-gains-calculator-gain">—</div><div class="l">Total gain / loss</div></div>
    <div class="stat-card"><div class="v" id="capital-gains-calculator-tax">—</div><div class="l">Est. tax owed</div></div>
    <div class="stat-card"><div class="v" id="capital-gains-calculator-net">—</div><div class="l">Net proceeds</div></div>
    <div class="stat-card"><div class="v" id="capital-gains-calculator-gainpct">—</div><div class="l">Return on cost</div></div>
  </div>
  <p class="note">Educational estimates only — not tax advice. Consult a tax professional for your situation.</p>
</div>
