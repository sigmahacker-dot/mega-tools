<div class="tool-card" style="text-align:center;max-width:520px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="bulls-and-cows-game-new">New game</button>
    <button class="btn btn-outline" id="bulls-and-cows-game-reveal">Reveal number</button>
  </div>
  <p class="muted" id="bulls-and-cows-game-status" style="min-height:24px;font-weight:600"></p>
  <div class="grid2" style="margin-bottom:8px">
    <div class="field" style="text-align:left">
      <label for="bulls-and-cows-game-guess">Your guess (4 different digits)</label>
      <input class="input" id="bulls-and-cows-game-guess" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" style="font-size:22px;letter-spacing:6px;text-align:center">
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="bulls-and-cows-game-go" style="width:100%">Guess</button>
    </div>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="bulls-and-cows-game-tries">0</div><div class="l">Guesses</div></div>
    <div class="stat-card"><div class="v" id="bulls-and-cows-game-best">—</div><div class="l">Best (fewest)</div></div>
  </div>
  <div id="bulls-and-cows-game-history" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;text-align:left"></div>
  <p class="note">A = bulls (right digit, right spot) · B = cows (right digit, wrong spot). The secret never repeats a digit.</p>
  <div class="error" id="bulls-and-cows-game-error"></div>
</div>
