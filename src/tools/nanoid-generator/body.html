<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="nanoid-generator-length">Length (1–128)</label>
      <input type="number" class="input" id="nanoid-generator-length" min="1" max="128" value="21">
    </div>
    <div class="field">
      <label for="nanoid-generator-count">How many? (1–500)</label>
      <input type="number" class="input" id="nanoid-generator-count" min="1" max="500" value="10">
    </div>
  </div>
  <div class="field">
    <label for="nanoid-generator-alphabet">Alphabet</label>
    <select class="input" id="nanoid-generator-alphabet">
      <option value="urlsafe">URL-safe (A–Z a–z 0–9 _ -)</option>
      <option value="alpha">Alphanumeric (A–Z a–z 0–9)</option>
      <option value="lower">Lowercase (a–z)</option>
      <option value="digits">Digits (0–9)</option>
      <option value="hex">Hexadecimal (0–9 a–f)</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="nanoid-generator-generate">Generate NanoIDs</button>
  </div>
  <div class="error" id="nanoid-generator-error"></div>
  <div class="field">
    <label for="nanoid-generator-output">Generated IDs</label>
    <textarea class="textarea" id="nanoid-generator-output" rows="10" readonly placeholder="Your NanoIDs will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="nanoid-generator-copy">Copy all</button>
    <button class="btn btn-outline" id="nanoid-generator-download">Download .txt</button>
  </div>
</div>
