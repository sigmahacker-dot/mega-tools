<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="100-day-challenge-tracker-name">Challenge name</label>
      <input class="input" type="text" id="100-day-challenge-tracker-name" placeholder="e.g. Read 20 pages daily">
    </div>
    <div class="field">
      <label for="100-day-challenge-tracker-start">Start date</label>
      <input class="input" type="date" id="100-day-challenge-tracker-start">
    </div>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="100-day-challenge-tracker-done">0/100</div><div class="l">Days done</div></div>
    <div class="stat-card"><div class="v" id="100-day-challenge-tracker-cur">0</div><div class="l">Current streak</div></div>
    <div class="stat-card"><div class="v" id="100-day-challenge-tracker-best">0</div><div class="l">Longest streak</div></div>
    <div class="stat-card"><div class="v" id="100-day-challenge-tracker-pct">0%</div><div class="l">Complete</div></div>
  </div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn btn-outline" id="100-day-challenge-tracker-reset">Reset Challenge</button>
  </div>
  <div class="error" id="100-day-challenge-tracker-error"></div>
</div>

<div class="tool-card">
  <div id="100-day-challenge-tracker-grid" style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px"></div>
  <p class="muted" style="margin-top:8px">Click a cell to toggle it. <span id="100-day-challenge-tracker-finish"></span></p>
</div>
