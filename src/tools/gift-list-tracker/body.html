<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="gift-for">Recipient</label><input type="text" class="input" id="gift-for" placeholder="Mom"></div>
    <div class="field"><label for="gift-idea">Gift idea</label><input type="text" class="input" id="gift-idea" placeholder="Silk scarf"></div>
    <div class="field"><label for="gift-budget">Budget ($)</label><input type="number" class="input" id="gift-budget" min="0" step="any" placeholder="50"></div>
    <div class="field"><label for="gift-cost">Actual cost ($) <span class="hint">(optional)</span></label><input type="number" class="input" id="gift-cost" min="0" step="any" placeholder=""></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary btn-sm" id="gift-add" type="button">Add gift</button></div>
  <div class="error" id="gift-list-tracker-error"></div>
  <div class="result" id="gift-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="gift-tbudget">$0</div><div class="l">Total budget</div></div>
      <div class="stat-card"><div class="v" id="gift-tcost">$0</div><div class="l">Planned cost</div></div>
      <div class="stat-card"><div class="v" id="gift-left">$0</div><div class="l">Remaining</div></div>
      <div class="stat-card"><div class="v" id="gift-bought">0/0</div><div class="l">Purchased</div></div>
    </div>
    <table class="data"><thead><tr><th>Recipient</th><th>Gift</th><th>Budget</th><th>Cost</th><th>Bought</th><th></th></tr></thead><tbody id="gift-body"></tbody></table>
  </div>
</div>
