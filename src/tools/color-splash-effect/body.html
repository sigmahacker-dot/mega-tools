<div class="tool-card">
  <div class="field">
    <label for="color-splash-effect-file">Photo</label>
    <input type="file" id="color-splash-effect-file" accept="image/*" class="input">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="color-splash-effect-color">Color to keep</label>
      <input type="color" id="color-splash-effect-color" class="input" value="#e11d48" style="height:42px;padding:4px;">
    </div>
    <div class="field">
      <label for="color-splash-effect-tol">Tolerance: <span id="color-splash-effect-tol-val">80</span></label>
      <input type="range" id="color-splash-effect-tol" min="10" max="220" value="80">
      <span class="hint">Lower = stricter color match.</span>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="color-splash-effect-download">Download image</button>
  </div>
  <div class="result">
    <canvas id="color-splash-effect-canvas" style="width:100%;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="color-splash-effect-error"></div>
  <p class="note">Tip: in Chrome/Edge the color picker has an eyedropper to sample the exact color from your photo. Processed locally in your browser.</p>
</div>
