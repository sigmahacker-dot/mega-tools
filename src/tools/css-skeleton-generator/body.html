<div class="tool-card">
  <h2>CSS Skeleton Loader Generator</h2>
  <p class="muted">Generate a content-loading skeleton placeholder with an optional shimmer sweep.</p>
  <div class="grid2">
    <div class="field">
      <label for="css-skeleton-generator-lines">Lines: <span id="css-skeleton-generator-lines-v">5</span></label>
      <input type="range" class="input" id="css-skeleton-generator-lines" min="1" max="12" step="1" value="5">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-height">Line height: <span id="css-skeleton-generator-height-v">16px</span></label>
      <input type="range" class="input" id="css-skeleton-generator-height" min="8" max="40" step="1" value="16">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-gap">Line gap: <span id="css-skeleton-generator-gap-v">12px</span></label>
      <input type="range" class="input" id="css-skeleton-generator-gap" min="4" max="30" step="1" value="12">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-radius">Corner radius: <span id="css-skeleton-generator-radius-v">8px</span></label>
      <input type="range" class="input" id="css-skeleton-generator-radius" min="0" max="30" step="1" value="8">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-base">Base color</label>
      <input type="color" class="input" id="css-skeleton-generator-base" value="#e5e7eb" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-shimmer">Shimmer color</label>
      <input type="color" class="input" id="css-skeleton-generator-shimmer" value="#f9fafb" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-skeleton-generator-anim">Shimmer effect</label>
      <select class="input" id="css-skeleton-generator-anim">
        <option value="on">On</option>
        <option value="off">Off (static)</option>
      </select>
    </div>
    <div class="field">
      <label for="css-skeleton-generator-speed">Shimmer speed: <span id="css-skeleton-generator-speed-v">1.5s</span></label>
      <input type="range" class="input" id="css-skeleton-generator-speed" min="0.5" max="4" step="0.1" value="1.5">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="css-skeleton-generator-stage" style="min-height:200px"></div>
  <div class="btn-row mt">
    <button class="btn btn-outline" id="css-skeleton-generator-regen">⟳ Randomize widths</button>
    <button class="btn btn-primary" id="css-skeleton-generator-copy">Copy HTML + CSS</button>
  </div>
  <h3 class="mt">Generated code</h3>
  <pre class="code" id="css-skeleton-generator-code" style="max-height:340px;overflow:auto"></pre>
  <div class="error" id="css-skeleton-generator-error"></div>
</div>
