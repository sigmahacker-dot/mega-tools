<div class="tool-card" style="text-align:center;max-width:640px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn btn-primary" id="asteroid-shooter-start">Start</button>
  </div>
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card"><div class="v" id="asteroid-shooter-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="asteroid-shooter-lives">3</div><div class="l">Lives</div></div>
    <div class="stat-card"><div class="v" id="asteroid-shooter-level">1</div><div class="l">Level</div></div>
    <div class="stat-card"><div class="v" id="asteroid-shooter-best">0</div><div class="l">Best</div></div>
  </div>
  <canvas id="asteroid-shooter-canvas" width="600" height="420" style="width:100%;max-width:600px;border-radius:12px;background:#0c0a09;touch-action:none"></canvas>
  <div id="asteroid-shooter-touch" style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
    <button class="btn btn-outline" data-k="left" style="min-width:56px">◀</button>
    <button class="btn btn-outline" data-k="right" style="min-width:56px">▶</button>
    <button class="btn btn-outline" data-k="up" style="min-width:56px">▲</button>
    <button class="btn btn-outline" data-k="fire" style="min-width:72px">FIRE</button>
  </div>
  <p class="note">←/→ rotate · ↑ thrust · Space fire</p>
  <div class="error" id="asteroid-shooter-error"></div>
</div>
