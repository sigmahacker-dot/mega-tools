<div class="tool-card">
  <div class="field"><label for="midpoint-calculator-dim">Dimension</label>
    <select class="input" id="midpoint-calculator-dim">
      <option value="2">2D (x, y)</option><option value="3">3D (x, y, z)</option>
    </select>
  </div>
  <div class="grid2">
    <div class="field"><label for="midpoint-calculator-x1">x\u2081</label><input class="input" id="midpoint-calculator-x1" type="number" value="2" step="any"></div>
    <div class="field"><label for="midpoint-calculator-y1">y\u2081</label><input class="input" id="midpoint-calculator-y1" type="number" value="4" step="any"></div>
    <div class="field hidden" id="midpoint-calculator-z1w"><label for="midpoint-calculator-z1">z\u2081</label><input class="input" id="midpoint-calculator-z1" type="number" value="0" step="any"></div>
    <div class="field"><label for="midpoint-calculator-x2">x\u2082</label><input class="input" id="midpoint-calculator-x2" type="number" value="8" step="any"></div>
    <div class="field"><label for="midpoint-calculator-y2">y\u2082</label><input class="input" id="midpoint-calculator-y2" type="number" value="10" step="any"></div>
    <div class="field hidden" id="midpoint-calculator-z2w"><label for="midpoint-calculator-z2">z\u2082</label><input class="input" id="midpoint-calculator-z2" type="number" value="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="midpoint-calculator-go">Find midpoint</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="midpoint-calculator-m" style="font-size:1.1rem">(5, 7)</div><div class="l">Midpoint</div></div>
  </div>
  <div class="result"><pre class="code" id="midpoint-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="midpoint-calculator-error"></div>
</div>
