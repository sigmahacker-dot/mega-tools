<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tiktok-hashtag-generator-niche">Your niche / topic</label>
      <input class="input" type="text" id="tiktok-hashtag-generator-niche" placeholder="e.g. fitness, cooking, travel">
    </div>
    <div class="field">
      <label for="tiktok-hashtag-generator-mix">Mix style</label>
      <select class="select" id="tiktok-hashtag-generator-mix">
        <option value="balanced">Balanced</option>
        <option value="broad">Broad reach</option>
        <option value="niche">Niche-targeted</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="tiktok-hashtag-generator-gen">Generate Hashtags</button>
    <button class="btn btn-outline" id="tiktok-hashtag-generator-copy">Copy Hashtags</button>
  </div>
  <div class="error" id="tiktok-hashtag-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Hashtag set <span class="muted" id="tiktok-hashtag-generator-count"></span></h3>
  <p id="tiktok-hashtag-generator-out" style="line-height:2"></p>
</div>
