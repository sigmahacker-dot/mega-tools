<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="spell-name-generator-school">School of magic</label>
      <select class="select" id="spell-name-generator-school">
        <option value="all">All schools</option>
        <option value="Evocation">Evocation</option>
        <option value="Illusion">Illusion</option>
        <option value="Necromancy">Necromancy</option>
        <option value="Abjuration">Abjuration</option>
        <option value="Divination">Divination</option>
        <option value="Enchantment">Enchantment</option>
        <option value="Conjuration">Conjuration</option>
        <option value="Transmutation">Transmutation</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="spell-name-generator-go" type="button">Conjure Spells</button>
      </div>
    </div>
  </div>
  <div class="error" id="spell-name-generator-error"></div>
  <div class="mt" id="spell-name-generator-list"></div>
</div>
