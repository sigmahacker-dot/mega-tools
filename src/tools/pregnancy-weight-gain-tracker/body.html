<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pregnancy-weight-gain-tracker-height">Height (cm)</label>
      <input type="number" class="input" id="pregnancy-weight-gain-tracker-height" min="0" step="any" placeholder="165">
    </div>
    <div class="field">
      <label for="pregnancy-weight-gain-tracker-prew">Pre-pregnancy weight (kg)</label>
      <input type="number" class="input" id="pregnancy-weight-gain-tracker-prew" min="0" step="any" placeholder="62">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="pregnancy-weight-gain-tracker-date">Weigh-in date</label>
      <input type="date" class="input" id="pregnancy-weight-gain-tracker-date">
    </div>
    <div class="field">
      <label for="pregnancy-weight-gain-tracker-weight">Weight (kg)</label>
      <input type="number" class="input" id="pregnancy-weight-gain-tracker-weight" min="0" step="any" placeholder="64.5">
    </div>
    <div class="field" style="display:flex;align-items:flex-end">
      <button class="btn" id="pregnancy-weight-gain-tracker-add" type="button">Log weigh-in</button>
    </div>
  </div>
  <div class="error" id="pregnancy-weight-gain-tracker-error"></div>
  <div class="result" id="pregnancy-weight-gain-tracker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pregnancy-weight-gain-tracker-bmi">&ndash;</div><div class="l">Pre-pregnancy BMI</div></div>
      <div class="stat-card"><div class="v" id="pregnancy-weight-gain-tracker-range">&ndash;</div><div class="l">IOM gain range</div></div>
      <div class="stat-card"><div class="v" id="pregnancy-weight-gain-tracker-current">&ndash;</div><div class="l">Current gain</div></div>
      <div class="stat-card"><div class="v" id="pregnancy-weight-gain-tracker-status">&ndash;</div><div class="l">Status</div></div>
    </div>
    <canvas id="pregnancy-weight-gain-tracker-chart" width="640" height="280" style="width:100%;height:auto;margin-top:12px;background:rgba(255,255,255,.03);border-radius:8px"></canvas>
    <div id="pregnancy-weight-gain-tracker-out" style="margin-top:12px"></div>
    <p class="note">Guideline ranges from the Institute of Medicine. Discuss your personal target with your healthcare provider. For information only &mdash; not medical advice.</p>
  </div>
</div>
