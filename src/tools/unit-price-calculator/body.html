<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="unitprice-name1">Product 1 name</label><input type="text" class="input" id="unitprice-name1" placeholder="e.g. Brand A"></div>
    <div class="field"><label for="unitprice-price1">Product 1 price ($)</label><input type="number" class="input" id="unitprice-price1" min="0" step="any" placeholder="4.99"></div>
    <div class="field"><label for="unitprice-qty1">Product 1 quantity</label><input type="number" class="input" id="unitprice-qty1" min="0" step="any" placeholder="500"></div>
    <div class="field"><label for="unitprice-name2">Product 2 name</label><input type="text" class="input" id="unitprice-name2" placeholder="e.g. Brand B"></div>
    <div class="field"><label for="unitprice-price2">Product 2 price ($)</label><input type="number" class="input" id="unitprice-price2" min="0" step="any" placeholder="7.49"></div>
    <div class="field"><label for="unitprice-qty2">Product 2 quantity</label><input type="number" class="input" id="unitprice-qty2" min="0" step="any" placeholder="1000"></div>
    <div class="field"><label for="unitprice-name3">Product 3 name (optional)</label><input type="text" class="input" id="unitprice-name3" placeholder="e.g. Brand C"></div>
    <div class="field"><label for="unitprice-price3">Product 3 price ($)</label><input type="number" class="input" id="unitprice-price3" min="0" step="any" placeholder=""></div>
    <div class="field"><label for="unitprice-qty3">Product 3 quantity (optional)</label><input type="number" class="input" id="unitprice-qty3" min="0" step="any" placeholder=""></div>
  </div>
  <div class="error" id="unit-price-calculator-error"></div>
  <div class="result" id="unitprice-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="unitprice-best">–</div><div class="l">Best deal</div></div>
      <div class="stat-card"><div class="v" id="unitprice-bestunit">–</div><div class="l">Lowest unit price</div></div>
      <div class="stat-card"><div class="v" id="unitprice-count">–</div><div class="l">Products compared</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Unit price</th><th>vs best</th></tr></thead>
      <tbody id="unitprice-body"><tr><td colspan="5" class="muted">Enter at least two products to compare.</td></tr></tbody>
    </table>
    <p class="note">Unit price = price ÷ quantity. Use the same quantity unit (g, ml, pieces) for every product.</p>
  </div>
</div>
