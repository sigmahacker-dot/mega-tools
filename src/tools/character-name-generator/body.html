<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="character-name-generator-culture">Culture</label>
      <select class="select" id="character-name-generator-culture">
        <option value="western">Western</option>
        <option value="east-asian">East Asian</option>
        <option value="south-asian">South Asian</option>
        <option value="middle-eastern">Middle Eastern</option>
        <option value="african">African</option>
        <option value="latin">Latin</option>
        <option value="fantasy">Fantasy</option>
      </select>
    </div>
    <div class="field">
      <label for="character-name-generator-count">How many</label>
      <select class="select" id="character-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="character-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="character-name-generator-error"></div>
  <div class="mt" id="character-name-generator-list"></div>
</div>
