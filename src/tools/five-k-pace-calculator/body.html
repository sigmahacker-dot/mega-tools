<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="fk-m">Goal time — minutes</label><input type="number" class="input" id="fk-m" min="0" max="120" step="1" placeholder="25"></div>
    <div class="field"><label for="fk-s">Goal time — seconds</label><input type="number" class="input" id="fk-s" min="0" max="59" step="1" placeholder="0"></div>
  </div>
  <div class="error" id="five-k-pace-calculator-error"></div>
  <div class="result" id="fk-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="fk-pacekm">–</div><div class="l">Pace per km</div></div>
      <div class="stat-card"><div class="v" id="fk-pacemi">–</div><div class="l">Pace per mile</div></div>
      <div class="stat-card"><div class="v" id="fk-400">–</div><div class="l">400 m split</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Distance</th><th>Cumulative time</th></tr></thead>
      <tbody id="fk-body"><tr><td colspan="2" class="muted">Enter a goal time to see splits.</td></tr></tbody>
    </table>
  </div>
</div>
