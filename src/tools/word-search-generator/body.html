<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:560px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="word-search-generator-words">Your words (one per line or comma-separated)</label>
      <textarea class="input" id="word-search-generator-words" rows="4" style="resize:vertical">PUZZLE, RAINBOW, CASTLE, DRAGON, FOREST, GUITAR, OCEAN, ROCKET, TIGER, VOLCANO</textarea>
    </div>
    <div class="field" style="text-align:left">
      <label for="word-search-generator-size">Grid size</label>
      <select class="input" id="word-search-generator-size">
        <option value="10">10 × 10</option>
        <option value="12" selected>12 × 12</option>
        <option value="15">15 × 15</option>
      </select>
      <div style="margin-top:12px">
        <button class="btn btn-primary" id="word-search-generator-gen" style="width:100%">Generate puzzle</button>
      </div>
    </div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="word-search-generator-found">0</div><div class="l">Found</div></div>
    <div class="stat-card"><div class="v" id="word-search-generator-total">0</div><div class="l">Words</div></div>
  </div>
  <p class="muted" id="word-search-generator-msg" style="min-height:24px">Drag across letters (or tap start, then tap end) to select a word.</p>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="word-search-generator-board" style="display:inline-grid;gap:2px;background:#cfd8dc;padding:6px;border-radius:8px;user-select:none;-webkit-user-select:none;touch-action:none"></div>
  </div>
  <div id="word-search-generator-list" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-width:560px;margin-left:auto;margin-right:auto"></div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="word-search-generator-new">New puzzle</button>
  </div>
  <div class="error" id="word-search-generator-error"></div>
</div>
