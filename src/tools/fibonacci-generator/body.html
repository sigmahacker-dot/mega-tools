<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="fibonacci-generator-n">How many terms (N)</label><input class="input" id="fibonacci-generator-n" type="number" value="15" min="1" max="5000" step="1"></div>
    <div class="field"><label for="fibonacci-generator-start">Start</label>
      <select class="input" id="fibonacci-generator-start"><option value="0">0, 1, 1, 2, \u2026</option><option value="1">1, 1, 2, 3, \u2026</option></select>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="fibonacci-generator-go">Generate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="fibonacci-generator-nth" style="font-size:1rem">377</div><div class="l">Nth term (fast doubling)</div></div>
    <div class="stat-card"><div class="v" id="fibonacci-generator-ratio" style="font-size:1rem">1.618</div><div class="l">Ratio \u2192 golden \u03C6</div></div>
  </div>
  <div class="result"><pre class="code" id="fibonacci-generator-list" style="text-align:left;white-space:pre-wrap;max-height:260px;overflow:auto"></pre></div>
  <div class="error" id="fibonacci-generator-error"></div>
</div>
