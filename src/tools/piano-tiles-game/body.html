<div class="tool-card" style="text-align:center;max-width:420px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn btn-primary" id="piano-tiles-game-start">Start</button>
  </div>
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card"><div class="v" id="piano-tiles-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="piano-tiles-game-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="piano-tiles-game-stage" style="position:relative;height:440px;border-radius:12px;overflow:hidden;background:#e7e5e4;touch-action:none;user-select:none">
    <div id="piano-tiles-game-lanes" style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)">
      <div style="border-right:1px solid #d6d3d1"></div><div style="border-right:1px solid #d6d3d1"></div><div style="border-right:1px solid #d6d3d1"></div><div></div>
    </div>
    <div id="piano-tiles-game-tiles" style="position:absolute;inset:0"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:#dc2626"></div>
  </div>
  <p class="note">Tap the black tiles only — don't tap white, don't miss.</p>
  <div class="error" id="piano-tiles-game-error"></div>
</div>
