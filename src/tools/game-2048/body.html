<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="game-2048-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="game-2048-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="game-2048-board" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin:0 auto;background:#bbada0;padding:8px;border-radius:10px;touch-action:none"></div>
  <p class="muted" id="game-2048-msg" style="min-height:24px;margin:12px 0">Use arrow keys / WASD or swipe.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="game-2048-new">New game</button>
  </div>
  <div class="error" id="game-2048-error"></div>
</div>
