<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="excuse-generator-category">Category</label>
      <select class="select" id="excuse-generator-category">
        <option value="work">Work</option>
        <option value="school">School</option>
        <option value="social">Social</option>
      </select>
    </div>
    <div class="field">
      <label for="excuse-generator-severity">Severity</label>
      <select class="select" id="excuse-generator-severity">
        <option value="mild">Mild (believable)</option>
        <option value="bold">Bold (suspicious)</option>
        <option value="outrageous">Outrageous (hilarious)</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="excuse-generator-generate" type="button">Generate Excuse</button>
  </div>
  <div class="error" id="excuse-generator-error"></div>
  <div class="mt" id="excuse-generator-list"></div>
</div>
