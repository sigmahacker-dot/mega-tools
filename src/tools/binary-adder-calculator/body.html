<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="binary-adder-calculator-a">Binary A</label><input class="input" id="binary-adder-calculator-a" type="text" inputmode="numeric" value="1011"></div>
    <div class="field"><label for="binary-adder-calculator-b">Binary B</label><input class="input" id="binary-adder-calculator-b" type="text" inputmode="numeric" value="1101"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="binary-adder-calculator-go">Add</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="binary-adder-calculator-sum" style="font-size:1.1rem">11000</div><div class="l">Binary sum</div></div>
    <div class="stat-card"><div class="v" id="binary-adder-calculator-dec">24</div><div class="l">Decimal check</div></div>
  </div>
  <div class="result"><pre class="code" id="binary-adder-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="binary-adder-calculator-error"></div>
</div>
