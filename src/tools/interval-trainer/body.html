<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="interval-trainer-score">0 / 0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="interval-trainer-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="interval-trainer-best">0</div><div class="l">Best streak</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="interval-trainer-new">New round</button>
    <button class="btn btn-outline" id="interval-trainer-replay">Replay notes</button>
    <button class="btn btn-outline" id="interval-trainer-reset">Reset score</button>
  </div>
  <p class="muted" id="interval-trainer-status" style="min-height:24px">Press "New round" to begin.</p>
  <div class="grid3" id="interval-trainer-buttons"></div>
  <div class="error" id="interval-trainer-error"></div>
  <p class="note">Notes are synthesized live with the Web Audio API — no audio files. Best streak is saved in this browser.</p>
</div>
