<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="discount-price">Original price</label>
      <input type="number" class="input" id="discount-price" min="0" step="any" placeholder="e.g. 2000">
    </div>
    <div class="field">
      <label for="discount-percent">Discount (%)</label>
      <input type="number" class="input" id="discount-percent" min="0" max="100" step="any" placeholder="e.g. 25">
    </div>
    <div class="field">
      <label for="discount-second">Second discount (%) <span class="muted">(optional)</span></label>
      <input type="number" class="input" id="discount-second" min="0" max="100" step="any" placeholder="e.g. 10">
    </div>
    <div class="field">
      <label for="discount-coupon">Coupon amount <span class="muted">(optional)</span></label>
      <input type="number" class="input" id="discount-coupon" min="0" step="any" placeholder="e.g. 100">
    </div>
  </div>
  <div class="error" id="discount-calculator-error"></div>
  <div class="result" id="discount-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="discount-final">–</div><div class="l">Final price</div></div>
      <div class="stat-card"><div class="v" id="discount-savings">–</div><div class="l">You save</div></div>
      <div class="stat-card"><div class="v" id="discount-pct">–</div><div class="l">Effective savings</div></div>
    </div>
    <p class="muted" id="discount-breakdown"></p>
  </div>
</div>
