<div class="tool-card">
  <div class="error" id="screen-info-tool-error"></div>
  <div class="result" id="scr-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="scr-screen">–</div><div class="l">Screen (CSS px)</div></div>
      <div class="stat-card"><div class="v" id="scr-viewport">–</div><div class="l">Viewport (CSS px)</div></div>
      <div class="stat-card"><div class="v" id="scr-dpr">–</div><div class="l">Device pixel ratio</div></div>
      <div class="stat-card"><div class="v" id="scr-phys">–</div><div class="l">Physical pixels</div></div>
    </div>
    <table class="data"><tbody id="scr-body"></tbody></table>
    <div class="field" style="margin-top:14px"><label>CSS reference: this bar is exactly 96px (1 inch in CSS)</label>
      <div style="width:96px;height:24px;background:linear-gradient(90deg,#f23333,#c80f0f);border-radius:6px"></div>
    </div>
    <p class="note">Values update live on resize / rotation.</p>
  </div>
</div>
