<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="resignation-letter-generator-name">Your full name</label>
      <input class="input" id="resignation-letter-generator-name" type="text" placeholder="e.g. Alex Khan" maxlength="60">
    </div>
    <div class="field">
      <label for="resignation-letter-generator-role">Your role / job title</label>
      <input class="input" id="resignation-letter-generator-role" type="text" placeholder="e.g. Marketing Manager" maxlength="60">
    </div>
    <div class="field">
      <label for="resignation-letter-generator-company">Company name</label>
      <input class="input" id="resignation-letter-generator-company" type="text" placeholder="e.g. Acme Corp" maxlength="60">
    </div>
    <div class="field">
      <label for="resignation-letter-generator-manager">Manager's name (optional)</label>
      <input class="input" id="resignation-letter-generator-manager" type="text" placeholder="e.g. Sarah Ahmed" maxlength="60">
    </div>
    <div class="field">
      <label for="resignation-letter-generator-lastday">Last working day</label>
      <input class="input" id="resignation-letter-generator-lastday" type="date">
    </div>
    <div class="field">
      <label for="resignation-letter-generator-notice">Notice period</label>
      <select class="select" id="resignation-letter-generator-notice">
        <option value="two weeks">Two weeks</option>
        <option value="one month">One month</option>
        <option value="two months">Two months</option>
        <option value="immediate">Immediate</option>
      </select>
    </div>
    <div class="field">
      <label for="resignation-letter-generator-reason">Reason for leaving</label>
      <select class="select" id="resignation-letter-generator-reason">
        <option value="new opportunity">A new opportunity</option>
        <option value="personal reasons">Personal reasons</option>
        <option value="career growth">Career growth</option>
        <option value="relocation">Relocation</option>
        <option value="further studies">Further studies</option>
      </select>
    </div>
    <div class="field">
      <label for="resignation-letter-generator-tone">Tone</label>
      <select class="select" id="resignation-letter-generator-tone">
        <option value="professional">Professional</option>
        <option value="grateful">Warm &amp; grateful</option>
        <option value="brief">Short &amp; direct</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="resignation-letter-generator-go" type="button">Write My Letter</button>
  </div>
  <div class="error" id="resignation-letter-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your resignation letter</label>
    <div class="result" id="resignation-letter-generator-output" style="white-space:pre-wrap">Your letter will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="resignation-letter-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="resignation-letter-generator-download" type="button">Download .txt</button>
  </div>
  <p class="note">Template only — review and personalize before sending, and check your contract's notice terms.</p>
</div>
