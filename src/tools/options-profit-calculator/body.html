<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="options-profit-calculator-type">Option type</label><select class="input select" id="options-profit-calculator-type"><option value="call">Call (long)</option><option value="put">Put (long)</option></select></div>
    <div class="field"><label for="options-profit-calculator-strike">Strike price ($)</label><input class="input" id="options-profit-calculator-strike" type="number" min="0" step="any" value="100"></div>
    <div class="field"><label for="options-profit-calculator-premium">Premium per share ($)</label><input class="input" id="options-profit-calculator-premium" type="number" min="0" step="any" value="5"></div>
    <div class="field"><label for="options-profit-calculator-contracts">Contracts</label><input class="input" id="options-profit-calculator-contracts" type="number" min="1" step="1" value="1"></div>
    <div class="field"><label for="options-profit-calculator-price">Price at expiry ($)</label><input class="input" id="options-profit-calculator-price" type="number" min="0" step="any" value="110"></div>
  </div>
  <div class="field"><label for="options-profit-calculator-slider">Price at expiry (slider)</label><input type="range" id="options-profit-calculator-slider" min="0" max="200" step="0.5" value="110" style="width:100%"></div>
  <div class="btn-row"><button class="btn btn-primary" id="options-profit-calculator-calc">Calculate</button></div>
  <div class="error" id="options-profit-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="options-profit-calculator-pl">—</div><div class="l">Profit / loss at expiry</div></div>
    <div class="stat-card"><div class="v" id="options-profit-calculator-plshare">—</div><div class="l">P/L per share</div></div>
    <div class="stat-card"><div class="v" id="options-profit-calculator-be">—</div><div class="l">Break-even price</div></div>
    <div class="stat-card"><div class="v" id="options-profit-calculator-maxp">—</div><div class="l">Max profit</div></div>
    <div class="stat-card"><div class="v" id="options-profit-calculator-maxl">—</div><div class="l">Max loss</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice. Each contract = 100 shares.</p>
</div>
