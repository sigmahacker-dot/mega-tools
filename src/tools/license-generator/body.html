<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="license-generator-type">License</label>
      <select class="input" id="license-generator-type">
        <option value="mit">MIT License</option>
        <option value="isc">ISC License</option>
        <option value="apache">Apache License 2.0</option>
        <option value="gpl">GNU GPL v3.0</option>
      </select>
    </div>
    <div class="field">
      <label for="license-generator-year">Year</label>
      <input class="input" id="license-generator-year" value="2026">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="license-generator-name">Copyright holder name</label>
      <input class="input" id="license-generator-name" placeholder="Jane Doe">
    </div>
    <div class="field">
      <label for="license-generator-project">Project name (optional)</label>
      <input class="input" id="license-generator-project" placeholder="my-awesome-app">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="license-generator-generate">Generate license</button>
  </div>
  <div class="error" id="license-generator-error"></div>
  <div class="field">
    <label for="license-generator-output">License text</label>
    <textarea class="textarea" id="license-generator-output" rows="16" readonly placeholder="Your license will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="license-generator-copy">Copy</button>
    <button class="btn btn-outline" id="license-generator-download">Download LICENSE</button>
  </div>
</div>
