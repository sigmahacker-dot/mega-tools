<div class="tool-card">
  <div class="field">
    <label for="json-formatter-input">JSON input</label>
    <textarea class="textarea code" id="json-formatter-input" rows="10" placeholder='Paste JSON here, e.g. {"name":"Ada","tags":["dev","tools"]}'></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="json-formatter-format2" type="button">Format (2-space)</button>
    <button class="btn btn-outline" id="json-formatter-format4" type="button">Format (4-space)</button>
    <button class="btn btn-outline" id="json-formatter-minify" type="button">Minify</button>
    <button class="btn btn-outline" id="json-formatter-validate" type="button">Validate</button>
    <button class="btn btn-outline" id="json-formatter-sample" type="button">Sample</button>
  </div>
  <div class="error" id="json-formatter-error"></div>
  <div class="success hidden" id="json-formatter-success"></div>
  <div class="result hidden" id="json-formatter-result">
    <pre id="json-formatter-output"></pre>
    <div class="btn-row mt">
      <button class="btn btn-sm" id="json-formatter-copy" type="button">Copy</button>
      <button class="btn btn-sm btn-outline" id="json-formatter-download" type="button">Download .json</button>
    </div>
  </div>
  <p class="note">All processing happens in your browser — your JSON is never uploaded.</p>
</div>
