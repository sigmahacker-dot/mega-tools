<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="slot-machine-game-credits">100</div><div class="l">Credits</div></div>
    <div class="stat-card"><div class="v" id="slot-machine-game-won">0</div><div class="l">Total won</div></div>
  </div>
  <div style="display:flex;gap:12px;justify-content:center;margin:16px 0">
    <div id="slot-machine-game-r0" style="width:90px;height:90px;font-size:56px;background:#fff;border:3px solid #f9a825;border-radius:12px;display:flex;align-items:center;justify-content:center">🍒</div>
    <div id="slot-machine-game-r1" style="width:90px;height:90px;font-size:56px;background:#fff;border:3px solid #f9a825;border-radius:12px;display:flex;align-items:center;justify-content:center">🍒</div>
    <div id="slot-machine-game-r2" style="width:90px;height:90px;font-size:56px;background:#fff;border:3px solid #f9a825;border-radius:12px;display:flex;align-items:center;justify-content:center">🍒</div>
  </div>
  <p class="muted" id="slot-machine-game-msg" style="min-height:24px">Place your bet and spin!</p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="slot-machine-game-bet">Bet size</label>
      <select class="input" id="slot-machine-game-bet">
        <option value="1">1 credit</option>
        <option value="5" selected>5 credits</option>
        <option value="10">10 credits</option>
        <option value="25">25 credits</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="slot-machine-game-spin" style="width:100%;font-size:18px">🎰 SPIN</button>
    </div>
  </div>
  <div class="note" style="max-width:440px;margin:0 auto 12px;text-align:left;font-size:13px">
    <strong>Payouts (3 of a kind):</strong> 7️⃣ 50× · 💎 25× · ⭐ 10× · 🔔 5× · 🍋 3× · 🍒 2×<br>
    <strong>Two of a kind:</strong> bet returned.
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-outline" id="slot-machine-game-reset">Reset credits</button>
  </div>
  <div class="error" id="slot-machine-game-error"></div>
</div>
