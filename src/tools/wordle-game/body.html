<div class="tool-card" style="text-align:center;max-width:480px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn btn-primary" id="wordle-game-new">New word</button>
  </div>
  <p class="muted" id="wordle-game-status" style="min-height:24px;font-weight:600"></p>
  <div id="wordle-game-board" style="display:inline-grid;grid-template-rows:repeat(6,1fr);gap:5px;margin:8px 0"></div>
  <div id="wordle-game-kb" style="margin-top:6px;display:flex;flex-direction:column;gap:5px;align-items:center"></div>
  <div class="stat-cards" style="margin-top:10px">
    <div class="stat-card"><div class="v" id="wordle-game-played">0</div><div class="l">Played</div></div>
    <div class="stat-card"><div class="v" id="wordle-game-won">0</div><div class="l">Won</div></div>
    <div class="stat-card"><div class="v" id="wordle-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="wordle-game-max">0</div><div class="l">Max streak</div></div>
  </div>
  <div class="error" id="wordle-game-error"></div>
</div>
