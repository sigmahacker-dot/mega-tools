<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="med-name">Medication name</label><input type="text" class="input" id="med-name" placeholder="e.g. Vitamin D"></div>
    <div class="field"><label for="med-time">Dose time</label><input type="time" class="input" id="med-time" value="08:00"></div>
    <div class="field"><label>&nbsp;</label><button class="btn" id="med-add">Add medication</button></div>
  </div>
  <div class="error" id="medication-reminder-error"></div>
  <div class="result" id="med-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="med-count">–</div><div class="l">Medications</div></div>
      <div class="stat-card"><div class="v" id="med-next">–</div><div class="l">Next dose in</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Medication</th><th>Time</th><th>Next dose</th><th>Status</th><th></th></tr></thead>
      <tbody id="med-body"><tr><td colspan="5" class="muted">No medications added yet.</td></tr></tbody>
    </table>
    <p class="note">Keep this tab open for live countdowns. For critical medication, also set a phone alarm.</p>
  </div>
</div>
