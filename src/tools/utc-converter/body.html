<div class="tool-card">
  <h3 style="margin:0 0 8px">UTC → other zone</h3>
  <div class="grid2">
    <div class="field">
      <label for="utc-converter-utc">UTC date &amp; time</label>
      <input class="input" type="datetime-local" id="utc-converter-utc">
    </div>
    <div class="field">
      <label for="utc-converter-target">Target UTC offset</label>
      <select class="input" id="utc-converter-target"></select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="utc-converter-go1">Convert from UTC</button>
  </div>
  <div class="result" id="utc-converter-out1"></div>
  <hr style="border:none;border-top:1px solid #eee;margin:16px 0">
  <h3 style="margin:0 0 8px">Your local time → UTC</h3>
  <div class="field" style="max-width:260px">
    <label for="utc-converter-local">Local date &amp; time</label>
    <input class="input" type="datetime-local" id="utc-converter-local">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="utc-converter-go2">Convert to UTC</button>
  </div>
  <div class="result" id="utc-converter-out2"></div>
  <p class="note" style="margin-top:12px">⏰ Honest note: this tool uses <strong>fixed</strong> UTC offsets. It does not apply daylight saving time automatically — regions observing DST shift by an hour for part of the year, so pick the offset that's actually in effect on your date.</p>
  <div class="error" id="utc-converter-error"></div>
</div>
