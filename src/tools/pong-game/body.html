<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="pong-game-you">0</div><div class="l">You</div></div>
    <div class="stat-card"><div class="v" id="pong-game-ai">0</div><div class="l">Computer</div></div>
    <div class="stat-card"><div class="v">7</div><div class="l">To win</div></div>
  </div>
  <p class="muted" id="pong-game-msg" style="min-height:24px">Press Start — first to 7 wins!</p>
  <canvas id="pong-game-canvas" width="480" height="320" style="max-width:100%;border-radius:8px;background:#101418;box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none"></canvas>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="pong-game-start">▶ Start</button>
    <button class="btn btn-outline" id="pong-game-pause" disabled>⏸ Pause</button>
  </div>
  <div class="error" id="pong-game-error"></div>
</div>
