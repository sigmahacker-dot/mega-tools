<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="hr-age">Age (years)</label>
      <input type="number" class="input" id="hr-age" min="10" max="100" step="1" placeholder="30">
    </div>
    <div class="field">
      <label for="hr-resting">Resting heart rate (BPM)</label>
      <input type="number" class="input" id="hr-resting" min="30" max="120" step="1" placeholder="60">
    </div>
  </div>
  <div class="error" id="heart-rate-zone-calculator-error"></div>
  <div class="result" id="hr-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hr-max">–</div><div class="l">Max heart rate (BPM)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Zone</th><th>Intensity</th><th>BPM range</th><th>Purpose</th></tr></thead>
      <tbody id="hr-zone-body">
        <tr><td colspan="4" class="muted">Enter your age and resting heart rate to see your zones.</td></tr>
      </tbody>
    </table>
    <p class="note">Max HR is estimated as 220 − age, a rough average. Zones are guidance, not medical precision.</p>
  </div>
</div>
