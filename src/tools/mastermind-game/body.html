<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="max-width:440px;margin:0 auto 10px">
    <button class="btn btn-primary" id="mastermind-game-new">New game</button>
    <button class="btn btn-outline" id="mastermind-game-reveal">Reveal code</button>
  </div>
  <p class="muted" id="mastermind-game-status" style="min-height:24px;font-weight:600"></p>
  <div id="mastermind-game-secret" style="display:flex;gap:8px;justify-content:center;margin-bottom:12px"></div>
  <div class="field" style="max-width:440px;margin:0 auto 8px;text-align:left">
    <label>Your guess — pick 4 colors</label>
    <div id="mastermind-game-pick" style="display:flex;gap:8px;margin-bottom:8px"></div>
    <div id="mastermind-game-palette" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
  <div class="btn-row" style="margin:8px 0">
    <button class="btn btn-primary" id="mastermind-game-check">Check guess</button>
    <button class="btn btn-outline" id="mastermind-game-clear">Clear</button>
  </div>
  <div id="mastermind-game-history" style="max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:6px"></div>
  <div class="error" id="mastermind-game-error"></div>
</div>
