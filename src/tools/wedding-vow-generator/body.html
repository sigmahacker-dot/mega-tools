<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="wedding-vow-generator-you">Your name</label>
      <input class="input" id="wedding-vow-generator-you" type="text" placeholder="e.g. Alex" maxlength="40">
    </div>
    <div class="field">
      <label for="wedding-vow-generator-partner">Partner's name</label>
      <input class="input" id="wedding-vow-generator-partner" type="text" placeholder="e.g. Sam" maxlength="40">
    </div>
    <div class="field">
      <label for="wedding-vow-generator-tone">Tone</label>
      <select class="select" id="wedding-vow-generator-tone">
        <option value="romantic">Romantic</option>
        <option value="funny">Funny</option>
        <option value="classic">Classic</option>
        <option value="short">Short &amp; sweet</option>
      </select>
    </div>
    <div class="field">
      <label for="wedding-vow-generator-memory">A favorite memory (optional)</label>
      <input class="input" id="wedding-vow-generator-memory" type="text" placeholder="e.g. our first road trip" maxlength="120">
    </div>
  </div>
  <div class="field">
    <label>Promises to include</label>
    <div class="grid3" id="wedding-vow-generator-promises">
      <label class="checkline"><input type="checkbox" value="laughter" checked> Laughter</label>
      <label class="checkline"><input type="checkbox" value="adventure" checked> Adventure</label>
      <label class="checkline"><input type="checkbox" value="patience"> Patience</label>
      <label class="checkline"><input type="checkbox" value="honesty" checked> Honesty</label>
      <label class="checkline"><input type="checkbox" value="support"> Unwavering support</label>
      <label class="checkline"><input type="checkbox" value="comfort"> Comfort in hard times</label>
      <label class="checkline"><input type="checkbox" value="growth"> Growing together</label>
      <label class="checkline"><input type="checkbox" value="friendship"> Lifelong friendship</label>
      <label class="checkline"><input type="checkbox" value="home"> Building a home</label>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="wedding-vow-generator-go" type="button">Write My Vows</button>
  </div>
  <div class="error" id="wedding-vow-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your vows</label>
    <div class="result" id="wedding-vow-generator-output" style="white-space:pre-wrap">Your vows will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="wedding-vow-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="wedding-vow-generator-download" type="button">Download .txt</button>
  </div>
  <p class="note">A starting draft — rewrite in your own words so it sounds like you.</p>
</div>
