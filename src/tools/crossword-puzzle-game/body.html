<div class="tool-card">
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="crossword-puzzle-game-check">Check</button>
    <button class="btn btn-outline" id="crossword-puzzle-game-reveal">Reveal</button>
    <button class="btn btn-outline" id="crossword-puzzle-game-clear">Clear</button>
  </div>
  <p class="muted" id="crossword-puzzle-game-status" style="min-height:24px;font-weight:600;text-align:center"></p>
  <div class="grid2" style="align-items:start">
    <div style="text-align:center">
      <div id="crossword-puzzle-game-grid" style="display:inline-grid;grid-template-columns:repeat(9,minmax(26px,38px));gap:2px"></div>
      <p class="note" style="margin-top:8px"><span id="crossword-puzzle-game-progress">0</span>/16 answers complete</p>
    </div>
    <div style="display:grid;gap:10px">
      <div>
        <h4 style="margin:0 0 6px">Across</h4>
        <div id="crossword-puzzle-game-across" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto"></div>
      </div>
      <div>
        <h4 style="margin:0 0 6px">Down</h4>
        <div id="crossword-puzzle-game-down" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto"></div>
      </div>
    </div>
  </div>
  <div class="error" id="crossword-puzzle-game-error"></div>
</div>
