<div class="tool-card">
  <div class="dropzone" id="image-threshold-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-threshold-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-threshold-wrap" style="text-align:center">
    <canvas id="image-threshold-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="field">
    <label for="image-threshold-level">Threshold: <span id="image-threshold-level-val">128</span></label>
    <input type="range" id="image-threshold-level" min="0" max="255" value="128">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-threshold-download">Download PNG</button>
  </div>
  <div class="error" id="image-threshold-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
