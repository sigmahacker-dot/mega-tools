<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label>First fraction</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <input type="number" class="input" id="fraction-calculator-a-whole" placeholder="Whole" step="1">
        <input type="number" class="input" id="fraction-calculator-a-num" placeholder="Numer." step="1">
        <input type="number" class="input" id="fraction-calculator-a-den" placeholder="Denom." step="1">
      </div>
    </div>
    <div class="field">
      <label>Second fraction</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <input type="number" class="input" id="fraction-calculator-b-whole" placeholder="Whole" step="1">
        <input type="number" class="input" id="fraction-calculator-b-num" placeholder="Numer." step="1">
        <input type="number" class="input" id="fraction-calculator-b-den" placeholder="Denom." step="1">
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="fraction-calculator-op">Operation</label>
      <select class="select" id="fraction-calculator-op">
        <option value="+">Add (+)</option>
        <option value="-">Subtract (&minus;)</option>
        <option value="*">Multiply (&times;)</option>
        <option value="/">Divide (&divide;)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" id="fraction-calculator-go">Calculate</button>
    </div>
  </div>
  <div class="error" id="fraction-calculator-error"></div>
  <div class="result" id="fraction-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="fraction-calculator-simple">&ndash;</div><div class="l">Simplified</div></div>
      <div class="stat-card"><div class="v" id="fraction-calculator-mixed">&ndash;</div><div class="l">Mixed number</div></div>
      <div class="stat-card"><div class="v" id="fraction-calculator-decimal">&ndash;</div><div class="l">Decimal</div></div>
    </div>
  </div>
</div>
