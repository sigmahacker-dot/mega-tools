<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="step-to-calorie-converter-steps">Steps walked</label>
      <input class="input" id="step-to-calorie-converter-steps" type="number" min="0" step="1" placeholder="e.g. 10000">
    </div>
    <div class="field">
      <label for="step-to-calorie-converter-weight">Body weight (kg)</label>
      <input class="input" id="step-to-calorie-converter-weight" type="number" min="20" max="300" step="0.1" placeholder="e.g. 70">
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="step-to-calorie-converter-calc">Calculate</button></div>
  <div class="stat-cards hidden" id="step-to-calorie-converter-out">
    <div class="stat-card"><div class="v" id="step-to-calorie-converter-total">0</div><div class="l">Calories burned (kcal)</div></div>
    <div class="stat-card"><div class="v" id="step-to-calorie-converter-per1k">0</div><div class="l">Calories per 1,000 steps</div></div>
  </div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Estimate assumes walking; running burns roughly twice as much per step.</p>
  <div class="error" id="step-to-calorie-converter-error"></div>
</div>
