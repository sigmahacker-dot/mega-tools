<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="customs-duty-estimator-value">Item value ($)</label>
      <input type="number" class="input" id="customs-duty-estimator-value" min="0" step="any" placeholder="500">
    </div>
    <div class="field">
      <label for="customs-duty-estimator-rate">Duty rate (%)</label>
      <input type="number" class="input" id="customs-duty-estimator-rate" min="0" max="100" step="any" placeholder="12">
    </div>
    <div class="field">
      <label for="customs-duty-estimator-shipping">Shipping ($)</label>
      <input type="number" class="input" id="customs-duty-estimator-shipping" min="0" step="any" placeholder="45">
    </div>
    <div class="field">
      <label for="customs-duty-estimator-insurance">Insurance ($)</label>
      <input type="number" class="input" id="customs-duty-estimator-insurance" min="0" step="any" placeholder="10">
    </div>
    <div class="field">
      <label for="customs-duty-estimator-fees">Other fees ($)</label>
      <input type="number" class="input" id="customs-duty-estimator-fees" min="0" step="any" placeholder="25">
    </div>
  </div>
  <div class="error" id="customs-duty-estimator-error"></div>
  <div class="result" id="customs-duty-estimator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="customs-duty-estimator-duty">&ndash;</div><div class="l">Duty owed</div></div>
      <div class="stat-card"><div class="v" id="customs-duty-estimator-total">&ndash;</div><div class="l">Total landed cost</div></div>
      <div class="stat-card"><div class="v" id="customs-duty-estimator-eff">&ndash;</div><div class="l">Duty as % of item value</div></div>
    </div>
    <p class="note">Estimate only &mdash; real rates vary by country, product classification, and trade agreements. Confirm with your customs authority. For information only &mdash; not financial advice.</p>
  </div>
</div>
