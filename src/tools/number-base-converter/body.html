<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="number-base-converter-bin">Binary (base 2)</label>
      <input type="text" class="input" id="number-base-converter-bin" placeholder="e.g. 1010" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="number-base-converter-oct">Octal (base 8)</label>
      <input type="text" class="input" id="number-base-converter-oct" placeholder="e.g. 12" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="number-base-converter-dec">Decimal (base 10)</label>
      <input type="text" class="input" id="number-base-converter-dec" placeholder="e.g. 10" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="number-base-converter-hex">Hexadecimal (base 16)</label>
      <input type="text" class="input" id="number-base-converter-hex" placeholder="e.g. A" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div class="error" id="number-base-converter-error"></div>
  <div class="result" id="number-base-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="number-base-converter-bits">–</div><div class="l">Bits</div></div>
      <div class="stat-card"><div class="v" id="number-base-converter-digits">–</div><div class="l">Decimal digits</div></div>
      <div class="stat-card"><div class="v" id="number-base-converter-bytes">–</div><div class="l">Bytes</div></div>
    </div>
    <p class="note">Non-negative integers only. Spaces and underscores are ignored. BigInt is used, so very large numbers convert exactly.</p>
  </div>
</div>
