<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="apology-generator-name">Apologizing to</label>
      <input class="input" id="apology-generator-name" type="text" placeholder="e.g. Sarah" maxlength="40">
    </div>
    <div class="field">
      <label for="apology-generator-from">Your name</label>
      <input class="input" id="apology-generator-from" type="text" placeholder="e.g. Alex" maxlength="40">
    </div>
    <div class="field">
      <label for="apology-generator-type">Situation</label>
      <select class="select" id="apology-generator-type">
        <option value="late">I was late / missed something</option>
        <option value="hurt">I said something hurtful</option>
        <option value="forgot">I forgot something important</option>
        <option value="broke">I broke / lost something</option>
        <option value="cancelled">I cancelled plans</option>
        <option value="work">A work mistake</option>
      </select>
    </div>
    <div class="field">
      <label for="apology-generator-tone">Tone</label>
      <select class="select" id="apology-generator-tone">
        <option value="sincere">Sincere</option>
        <option value="light">Lighthearted</option>
        <option value="formal">Formal</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="apology-generator-what">What happened? (a few words)</label>
    <input class="input" id="apology-generator-what" type="text" placeholder="e.g. your birthday dinner" maxlength="120">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="apology-generator-go" type="button">Write My Apology</button>
  </div>
  <div class="error" id="apology-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your apology</label>
    <div class="result" id="apology-generator-output" style="white-space:pre-wrap">Your structured apology will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="apology-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="apology-generator-download" type="button">Download .txt</button>
  </div>
</div>
