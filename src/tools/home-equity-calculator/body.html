<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="home-equity-calculator-value">Home value ($)</label><input class="input" id="home-equity-calculator-value" type="number" min="0" step="any" value="450000"></div>
    <div class="field"><label for="home-equity-calculator-balance">Mortgage balance ($)</label><input class="input" id="home-equity-calculator-balance" type="number" min="0" step="any" value="300000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="home-equity-calculator-calc">Calculate</button></div>
  <div class="error" id="home-equity-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="home-equity-calculator-equity">—</div><div class="l">Home equity</div></div>
    <div class="stat-card"><div class="v" id="home-equity-calculator-pct">—</div><div class="l">Equity percentage</div></div>
    <div class="stat-card"><div class="v" id="home-equity-calculator-line">—</div><div class="l">Max credit @ 80% CLTV</div></div>
    <div class="stat-card"><div class="v" id="home-equity-calculator-ltv">—</div><div class="l">Current LTV</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
