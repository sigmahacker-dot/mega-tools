<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="justify-content:center;flex-wrap:wrap" id="online-guitar-tuner-strings">
    <button class="btn btn-sm btn-outline" data-s="0">E2</button>
    <button class="btn btn-sm btn-outline" data-s="1">A2</button>
    <button class="btn btn-sm btn-outline" data-s="2">D3</button>
    <button class="btn btn-sm btn-outline" data-s="3">G3</button>
    <button class="btn btn-sm btn-outline" data-s="4">B3</button>
    <button class="btn btn-sm btn-outline" data-s="5">E4</button>
  </div>
  <div style="font-size:64px;font-weight:800;margin:8px 0" id="online-guitar-tuner-note">–</div>
  <div style="max-width:420px;margin:0 auto;position:relative;height:30px;background:linear-gradient(90deg,#e53935,#fdd835 35%,#43a047 50%,#fdd835 65%,#e53935);border-radius:15px">
    <div id="online-guitar-tuner-needle" style="position:absolute;top:-4px;width:4px;height:38px;background:#212121;border-radius:2px;left:50%;transition:left .08s"></div>
  </div>
  <div style="display:flex;justify-content:space-between;max-width:420px;margin:4px auto" class="muted"><span>-50¢ flat</span><span>0¢</span><span>+50¢ sharp</span></div>
  <div class="stat-cards" style="max-width:420px;margin:12px auto">
    <div class="stat-card"><div class="v" id="online-guitar-tuner-hz">–</div><div class="l">Detected Hz</div></div>
    <div class="stat-card"><div class="v" id="online-guitar-tuner-cents">–</div><div class="l">Cents off</div></div>
    <div class="stat-card"><div class="v" id="online-guitar-tuner-target">E2 · 82.41 Hz</div><div class="l">Target string</div></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="online-guitar-tuner-start">🎤 Enable microphone</button>
  </div>
  <p class="muted" id="online-guitar-tuner-status">Microphone access is required. Nothing is recorded or uploaded.</p>
  <div class="error" id="online-guitar-tuner-error"></div>
</div>
