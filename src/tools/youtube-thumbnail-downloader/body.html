<div class="tool-card">
  <div class="field">
    <label for="youtube-thumbnail-downloader-input">YouTube URL or video ID</label>
    <input class="input" id="youtube-thumbnail-downloader-input" type="text" placeholder="https://www.youtube.com/watch?v=VIDEO_ID" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="youtube-thumbnail-downloader-get" type="button">Get Thumbnails</button>
    <button class="btn btn-outline" id="youtube-thumbnail-downloader-clear" type="button">Clear</button>
  </div>
  <div class="error" id="youtube-thumbnail-downloader-error"></div>
  <div id="youtube-thumbnail-downloader-results" class="mt"></div>
  <p class="note">Downloads public video thumbnails only. Thumbnails are fetched straight from YouTube's image servers — nothing is uploaded anywhere.</p>
</div>
