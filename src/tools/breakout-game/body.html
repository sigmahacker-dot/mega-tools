<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="breakout-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="breakout-game-lives">3</div><div class="l">Lives</div></div>
    <div class="stat-card"><div class="v" id="breakout-game-level">1</div><div class="l">Level</div></div>
  </div>
  <p class="muted" id="breakout-game-msg" style="min-height:24px">Press Start — move with mouse, touch, or ←/→.</p>
  <canvas id="breakout-game-canvas" width="480" height="360" style="max-width:100%;border-radius:8px;background:#0d1b2a;box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none"></canvas>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="breakout-game-start">▶ Start</button>
  </div>
  <div class="error" id="breakout-game-error"></div>
</div>
