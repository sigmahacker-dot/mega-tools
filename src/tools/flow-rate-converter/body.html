<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="flow-rate-converter-value">Flow rate</label>
      <input type="number" step="any" class="input" id="flow-rate-converter-value" placeholder="e.g. 10">
    </div>
    <div class="field">
      <label for="flow-rate-converter-from">From unit</label>
      <select class="select" id="flow-rate-converter-from">
        <option value="lmin" selected>Litres/minute (L/min)</option>
        <option value="ls">Litres/second (L/s)</option>
        <option value="m3h">Cubic metres/hour (m³/h)</option>
        <option value="gpm">Gallons/minute, US (GPM)</option>
        <option value="cfm">Cubic feet/minute (CFM)</option>
        <option value="ft3s">Cubic feet/second (ft³/s)</option>
      </select>
    </div>
  </div>
  <div class="error" id="flow-rate-converter-error"></div>
  <div class="result" id="flow-rate-converter-result">
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="flow-rate-converter-table"></tbody>
    </table>
    <p class="note">Based on the US liquid gallon (3.785411784 L exactly) and the international foot (0.3048 m exactly).</p>
  </div>
</div>
