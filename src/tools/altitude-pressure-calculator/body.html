<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="altitude-pressure-calculator-p0">Sea-level pressure (hPa)</label>
      <input type="number" step="any" min="0" class="input" id="altitude-pressure-calculator-p0" placeholder="e.g. 1013.25" value="1013.25">
    </div>
    <div class="field">
      <label for="altitude-pressure-calculator-aunit">Altitude unit</label>
      <select class="select" id="altitude-pressure-calculator-aunit">
        <option value="m" selected>Metres</option>
        <option value="ft">Feet</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="altitude-pressure-calculator-alt">Altitude</label>
    <input type="number" step="any" class="input" id="altitude-pressure-calculator-alt" placeholder="e.g. 1500">
  </div>
  <div class="error" id="altitude-pressure-calculator-error"></div>
  <div class="result" id="altitude-pressure-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="altitude-pressure-calculator-hpa">–</div><div class="l">Pressure (hPa)</div></div>
      <div class="stat-card"><div class="v" id="altitude-pressure-calculator-inhg">–</div><div class="l">Pressure (inHg)</div></div>
      <div class="stat-card"><div class="v" id="altitude-pressure-calculator-pct">–</div><div class="l">% of sea level</div></div>
    </div>
    <p class="note">P = P₀ · (1 − 0.0065·h/288.15)^5.25588. Valid below 11,000 m (tropopause). Assumes the standard 6.5 °C/km lapse rate.</p>
  </div>
</div>
