<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="dividend-reinvestment-calculator-initial">Initial investment ($)</label><input class="input" id="dividend-reinvestment-calculator-initial" type="number" min="0" step="any" value="10000"></div>
    <div class="field"><label for="dividend-reinvestment-calculator-yield">Dividend yield (%)</label><input class="input" id="dividend-reinvestment-calculator-yield" type="number" min="0" step="any" value="3"></div>
    <div class="field"><label for="dividend-reinvestment-calculator-growth">Annual dividend growth (%)</label><input class="input" id="dividend-reinvestment-calculator-growth" type="number" min="0" step="any" value="5"></div>
    <div class="field"><label for="dividend-reinvestment-calculator-years">Years</label><input class="input" id="dividend-reinvestment-calculator-years" type="number" min="1" step="1" value="20"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="dividend-reinvestment-calculator-calc">Calculate</button></div>
  <div class="error" id="dividend-reinvestment-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="dividend-reinvestment-calculator-drip">—</div><div class="l">With DRIP (ending value)</div></div>
    <div class="stat-card"><div class="v" id="dividend-reinvestment-calculator-cash">—</div><div class="l">Cash payouts (ending value)</div></div>
    <div class="stat-card"><div class="v" id="dividend-reinvestment-calculator-divs">—</div><div class="l">Total dividends received</div></div>
    <div class="stat-card"><div class="v" id="dividend-reinvestment-calculator-edge">—</div><div class="l">DRIP advantage</div></div>
  </div>
  <p class="hint">Price is assumed flat so the comparison isolates the pure dividend-compounding effect; taxes and fees are not modeled.</p>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
