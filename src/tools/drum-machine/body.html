<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <label for="drum-machine-bpm">Tempo: <span id="drum-machine-bpm-val">120</span> BPM</label>
    <input type="range" id="drum-machine-bpm" min="60" max="200" value="120">
  </div>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="drum-machine-grid" style="display:inline-grid;grid-template-columns:64px repeat(16,34px);gap:4px;align-items:center"></div>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="drum-machine-play">▶ Play</button>
    <button class="btn btn-outline" id="drum-machine-clear">Clear</button>
  </div>
  <div class="error" id="drum-machine-error"></div>
  <p class="note">All sounds are synthesized live with Web Audio — no samples, no downloads. Files never leave your device — everything is processed in your browser.</p>
</div>
