<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="app-name-generator-kw">Keyword (optional)</label>
      <input class="input" id="app-name-generator-kw" type="text" placeholder="e.g. task, photo, fit" maxlength="20">
    </div>
    <div class="field">
      <label for="app-name-generator-style">Naming style</label>
      <select class="select" id="app-name-generator-style">
        <option value="blend">Blend (fused syllables)</option>
        <option value="compound">Compound (two words)</option>
        <option value="suffix">Suffix (-ly, -ify, -io…)</option>
        <option value="mixed">Mixed</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="app-name-generator-go" type="button">Generate App Names</button>
  </div>
  <div class="error" id="app-name-generator-error"></div>
  <div class="mt" id="app-name-generator-list"></div>
  <p class="note">Always check trademark and domain availability before using a name.</p>
</div>
