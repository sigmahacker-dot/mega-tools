<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="webinar-title-generator-topic">Webinar topic</label>
      <input class="input" id="webinar-title-generator-topic" type="text" placeholder="e.g. email marketing" maxlength="80">
    </div>
    <div class="field">
      <label for="webinar-title-generator-audience">Target audience</label>
      <input class="input" id="webinar-title-generator-audience" type="text" placeholder="e.g. small business owners" maxlength="80">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="webinar-title-generator-generate" type="button">Generate Titles</button>
  </div>
  <div class="error" id="webinar-title-generator-error"></div>
  <div class="mt" id="webinar-title-generator-list"></div>
</div>
