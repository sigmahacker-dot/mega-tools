<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="bio-generator-name">Name</label>
      <input class="input" id="bio-generator-name" type="text" placeholder="e.g. Rawi" maxlength="40">
    </div>
    <div class="field">
      <label for="bio-generator-profession">Profession</label>
      <input class="input" id="bio-generator-profession" type="text" placeholder="e.g. travel vlogger" maxlength="60">
    </div>
  </div>
  <div class="field">
    <label for="bio-generator-interests">Interests (comma separated)</label>
    <input class="input" id="bio-generator-interests" type="text" placeholder="e.g. mountains, photography, chai" maxlength="120">
  </div>
  <div class="field">
    <label for="bio-generator-tone">Tone</label>
    <select class="select" id="bio-generator-tone">
      <option value="professional">Professional</option>
      <option value="funny">Funny</option>
      <option value="minimalist">Minimalist</option>
      <option value="inspirational">Inspirational</option>
      <option value="emoji">✨ Emoji Style</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="bio-generator-generate" type="button">Generate Bios</button>
  </div>
  <div class="error" id="bio-generator-error"></div>
  <div class="mt" id="bio-generator-list"></div>
  <hr class="mt">
  <div class="field">
    <label for="bio-generator-custom">Your own bio</label>
    <textarea class="input" id="bio-generator-custom" rows="3" placeholder="e.g. Food lover, weekend traveller, chai enthusiast..." maxlength="300"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="bio-generator-sprinkle" type="button">✨ Sprinkle random emojis</button>
  </div>
  <div class="mt" id="bio-generator-sprinkled"></div>
</div>
