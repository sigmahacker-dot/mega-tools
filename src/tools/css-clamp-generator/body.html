<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="css-clamp-generator-min">Min size (px)</label>
      <input type="number" class="input" id="css-clamp-generator-min" value="16" min="1" step="any">
    </div>
    <div class="field">
      <label for="css-clamp-generator-max">Max size (px)</label>
      <input type="number" class="input" id="css-clamp-generator-max" value="32" min="1" step="any">
    </div>
    <div class="field">
      <label for="css-clamp-generator-minvw">Min viewport (px)</label>
      <input type="number" class="input" id="css-clamp-generator-minvw" value="360" min="1" step="1">
    </div>
    <div class="field">
      <label for="css-clamp-generator-maxvw">Max viewport (px)</label>
      <input type="number" class="input" id="css-clamp-generator-maxvw" value="1280" min="1" step="1">
    </div>
  </div>
  <div class="checkbox-row"><input type="checkbox" id="css-clamp-generator-rem" checked> <label for="css-clamp-generator-rem">Output in rem (16px root)</label></div>
  <div class="error" id="css-clamp-generator-error"></div>
  <div class="result mt">
    <div class="field">
      <label for="css-clamp-generator-css">Generated CSS</label>
      <input type="text" class="input" id="css-clamp-generator-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="css-clamp-generator-copy" type="button">Copy CSS</button>
    </div>
    <div class="field mt">
      <label>Live demo <span class="muted">(resize your browser window)</span></label>
      <div id="css-clamp-generator-demo" style="border:1px solid var(--line);border-radius:10px;padding:16px;">Fluid typography scales with the viewport</div>
    </div>
    <p class="note" id="css-clamp-generator-math"></p>
  </div>
</div>
