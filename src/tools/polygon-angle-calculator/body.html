<div class="tool-card">
  <div class="field"><label for="polygon-angle-calculator-n">Number of sides (n \u2265 3)</label><input class="input" id="polygon-angle-calculator-n" type="number" value="6" min="3" step="1"></div>

  <div class="stat-cards">

    <div class="stat-card"><div class="v" id="polygon-angle-calculator-ext">60\u00B0</div><div class="l">Exterior angle</div></div>
    <div class="stat-card"><div class="v" id="polygon-angle-calculator-sum">720\u00B0</div><div class="l">Sum of interior</div></div>
  </div>
  <div class="result"><pre class="code" id="polygon-angle-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
