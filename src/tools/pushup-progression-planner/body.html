<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pushup-progression-planner-max">Current max push-ups (one set)</label>
      <input class="input" id="pushup-progression-planner-max" type="number" min="1" max="500" step="1" placeholder="e.g. 20">
    </div>
    <div class="field" style="align-self:end">
      <button class="btn btn-primary" id="pushup-progression-planner-gen">Generate plan</button>
    </div>
  </div>
  <div class="result hidden" id="pushup-progression-planner-out"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Stop if you feel pain and rest at least one day between sessions.</p>
  <div class="error" id="pushup-progression-planner-error"></div>
</div>
