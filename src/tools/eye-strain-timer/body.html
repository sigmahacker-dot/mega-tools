<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="eye-focus">Focus block (minutes)</label><input type="number" class="input" id="eye-focus" min="1" max="120" step="1" placeholder="20"></div>
    <div class="field"><label>&nbsp;</label>
      <div>
        <button class="btn" id="eye-start">Start</button>
        <button class="btn" id="eye-pause">Pause</button>
        <button class="btn" id="eye-reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="error" id="eye-strain-timer-error"></div>
  <div class="result" id="eye-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="eye-phase">Ready</div><div class="l">Phase</div></div>
      <div class="stat-card"><div class="v" id="eye-time">–</div><div class="l">Time left</div></div>
      <div class="stat-card"><div class="v" id="eye-count">0</div><div class="l">Breaks today</div></div>
    </div>
    <div class="field"><label for="eye-bar">Progress</label><progress class="input" id="eye-bar" max="100" value="0" style="width:100%"></progress></div>
    <p class="muted" id="eye-detail">Press Start to begin a focus block.</p>
  </div>
</div>
