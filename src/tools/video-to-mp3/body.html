<div class="tool-card">
  <div class="field">
    <label for="video-to-mp3-file">Choose a video file</label>
    <input class="input" id="video-to-mp3-file" type="file" accept="video/*">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="video-to-mp3-convert" type="button" disabled>Convert to MP3</button>
  </div>
  <div class="error" id="video-to-mp3-error"></div>
  <div class="progress hidden" id="video-to-mp3-progress"><div id="video-to-mp3-bar" style="width:0%"></div></div>
  <p class="muted" id="video-to-mp3-status"></p>
  <p class="note">Your file never leaves your device. Large videos may take a minute to decode and encode.</p>
</div>
