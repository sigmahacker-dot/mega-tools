<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="energy-converter-val">Value</label>
      <input type="number" class="input" id="energy-converter-val" step="any" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="energy-converter-from">From</label>
      <select class="select" id="energy-converter-from"></select>
    </div>
    <div class="field">
      <label for="energy-converter-to">To</label>
      <select class="select" id="energy-converter-to"></select>
    </div>
  </div>
  <div class="error" id="energy-converter-error"></div>
  <div class="result" id="energy-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="energy-converter-res">–</div><div class="l">Converted value</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="energy-converter-body">
        <tr><td colspan="2" class="muted">Enter a value to convert.</td></tr>
      </tbody>
    </table>
  </div>
</div>
