<div class="tool-card">
  <div class="field">
    <label for="flesch-kincaid-calculator-input">Your text</label>
    <textarea class="textarea" id="flesch-kincaid-calculator-input" rows="8" placeholder="Paste at least a few sentences for a meaningful score..."></textarea>
  </div>
  <div class="error" id="flesch-kincaid-calculator-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="flesch-kincaid-calculator-ease">–</div><div class="l">Reading Ease (0–100)</div></div>
    <div class="stat-card"><div class="v" id="flesch-kincaid-calculator-grade">–</div><div class="l">Grade Level</div></div>
    <div class="stat-card"><div class="v" id="flesch-kincaid-calculator-level">–</div><div class="l">Difficulty</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <tbody>
        <tr><td>Words</td><td id="flesch-kincaid-calculator-words">0</td></tr>
        <tr><td>Sentences</td><td id="flesch-kincaid-calculator-sentences">0</td></tr>
        <tr><td>Syllables</td><td id="flesch-kincaid-calculator-syllables">0</td></tr>
        <tr><td>Avg words / sentence</td><td id="flesch-kincaid-calculator-wps">0</td></tr>
        <tr><td>Avg syllables / word</td><td id="flesch-kincaid-calculator-spw">0</td></tr>
      </tbody>
    </table>
    <p class="note">Formulas: Ease = 206.835 − 1.015·(W/S) − 84.6·(syl/W); Grade = 0.39·(W/S) + 11.8·(syl/W) − 15.59. Scores need several sentences to be meaningful.</p>
  </div>
</div>
