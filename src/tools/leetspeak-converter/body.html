<div class="tool-card">
  <div class="field">
    <label for="leetspeak-converter-input">Input text</label>
    <textarea class="textarea" id="leetspeak-converter-input" rows="5" placeholder="Type text to leetspeak-ify"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="leetspeak-converter-level">Intensity</label>
      <select class="input" id="leetspeak-converter-level">
        <option value="basic">Basic (A→4 E→3 I→1 O→0 S→5 T→7)</option>
        <option value="medium">Medium (+ L→1 G→6 Z→2 B→8)</option>
        <option value="full">Full (nearly every letter)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="leetspeak-converter-run">Convert</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="leetspeak-converter-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="leetspeak-converter-copy">Copy output</button></div>
  </div>
  <div class="error" id="leetspeak-converter-error"></div>
</div>
