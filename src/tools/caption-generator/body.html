<div class="tool-card">
  <div class="field">
    <label for="caption-generator-topic">Topic / post description</label>
    <input class="input" id="caption-generator-topic" type="text" placeholder="e.g. sunset at the beach" maxlength="120">
  </div>
  <div class="field">
    <label for="caption-generator-mood">Mood</label>
    <select class="select" id="caption-generator-mood">
      <option value="funny">Funny</option>
      <option value="aesthetic">Aesthetic</option>
      <option value="motivational">Motivational</option>
      <option value="savage">Savage</option>
      <option value="cute">Cute</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="caption-generator-generate" type="button">Generate Captions</button>
  </div>
  <div class="error" id="caption-generator-error"></div>
  <div class="mt" id="caption-generator-list"></div>
</div>
