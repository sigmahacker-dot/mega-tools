<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="waist-to-height-calculator-waist">Waist (cm)</label>
      <input class="input" id="waist-to-height-calculator-waist" type="number" min="20" max="300" step="0.5" placeholder="e.g. 85">
    </div>
    <div class="field">
      <label for="waist-to-height-calculator-height">Height (cm)</label>
      <input class="input" id="waist-to-height-calculator-height" type="number" min="50" max="250" step="0.5" placeholder="e.g. 175">
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="waist-to-height-calculator-calc">Calculate</button></div>
  <div class="stat-cards hidden" id="waist-to-height-calculator-out">
    <div class="stat-card"><div class="v" id="waist-to-height-calculator-ratio">–</div><div class="l">Waist-to-height ratio</div></div>
    <div class="stat-card"><div class="v" id="waist-to-height-calculator-cat" style="font-size:1em">–</div><div class="l">Category</div></div>
  </div>
  <p class="hint" id="waist-to-height-calculator-tip"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Aim to keep your waist under half your height.</p>
  <div class="error" id="waist-to-height-calculator-error"></div>
</div>
