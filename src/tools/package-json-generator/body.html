<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="package-json-generator-name">Package name</label>
      <input class="input" id="package-json-generator-name" placeholder="my-package">
    </div>
    <div class="field">
      <label for="package-json-generator-version">Version</label>
      <input class="input" id="package-json-generator-version" value="1.0.0">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="package-json-generator-desc">Description</label>
      <input class="input" id="package-json-generator-desc" placeholder="What does it do?">
    </div>
    <div class="field">
      <label for="package-json-generator-main">Main entry</label>
      <input class="input" id="package-json-generator-main" value="index.js">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="package-json-generator-license">License</label>
      <select class="input" id="package-json-generator-license">
        <option>MIT</option><option>ISC</option><option>Apache-2.0</option><option>GPL-3.0</option><option>UNLICENSED</option>
      </select>
    </div>
    <div class="field">
      <label for="package-json-generator-type">Module type</label>
      <select class="input" id="package-json-generator-type">
        <option value="commonjs">CommonJS</option>
        <option value="module">ES Module</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Scripts</label>
    <div id="package-json-generator-scripts"></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-outline" id="package-json-generator-add-script">+ Add script</button></div>
  </div>
  <div class="field">
    <label>Dependencies</label>
    <div id="package-json-generator-deps"></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-outline" id="package-json-generator-add-dep">+ Add dependency</button></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="package-json-generator-generate">Generate package.json</button>
  </div>
  <div class="error" id="package-json-generator-error"></div>
  <div class="field">
    <label for="package-json-generator-output">package.json</label>
    <textarea class="textarea" id="package-json-generator-output" rows="14" readonly placeholder="Your package.json will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="package-json-generator-copy">Copy</button>
    <button class="btn btn-outline" id="package-json-generator-download">Download package.json</button>
  </div>
</div>
