<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cooking-converter-value">Amount</label>
      <input type="number" step="any" class="input" id="cooking-converter-value" placeholder="e.g. 2">
    </div>
    <div class="field">
      <label for="cooking-converter-from">From unit</label>
      <select class="select" id="cooking-converter-from">
        <option value="cup" selected>Cups</option>
        <option value="tbsp">Tablespoons</option>
        <option value="tsp">Teaspoons</option>
        <option value="floz">Fluid ounces</option>
        <option value="ml">Milliliters</option>
        <option value="l">Liters</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="cooking-converter-ingredient">Ingredient (for gram weight)</label>
    <select class="select" id="cooking-converter-ingredient">
      <option value="water" selected>Water</option>
      <option value="flour">All-purpose flour</option>
      <option value="sugar">Granulated sugar</option>
      <option value="butter">Butter</option>
      <option value="oil">Vegetable oil</option>
      <option value="milk">Milk</option>
      <option value="honey">Honey</option>
      <option value="salt">Table salt</option>
    </select>
  </div>
  <div class="error" id="cooking-converter-error"></div>
  <div class="result" id="cooking-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cooking-converter-grams">–</div><div class="l">Weight (grams)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Volume</th></tr></thead>
      <tbody id="cooking-converter-table"></tbody>
    </table>
    <p class="note">Gram weights use typical ingredient densities, so they are estimates. 1 US cup = 236.588 ml.</p>
  </div>
</div>
