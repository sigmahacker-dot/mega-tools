<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="book-tracker-year">0</div><div class="l" id="book-tracker-yearlabel">Books this year</div></div>
    <div class="stat-card"><div class="v" id="book-tracker-avg">—</div><div class="l">Average rating</div></div>
    <div class="stat-card"><div class="v" id="book-tracker-total">0</div><div class="l">Total books</div></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="book-tracker-title">Title</label>
      <input class="input" type="text" id="book-tracker-title" placeholder="Book title">
    </div>
    <div class="field">
      <label for="book-tracker-author">Author</label>
      <input class="input" type="text" id="book-tracker-author" placeholder="Author">
    </div>
    <div class="field">
      <label for="book-tracker-date">Finished on</label>
      <input class="input" type="date" id="book-tracker-date">
    </div>
  </div>
  <div class="field">
    <label>Rating</label>
    <div class="btn-row" id="book-tracker-stars">
      <button class="btn btn-outline btn-sm" data-r="1">★</button>
      <button class="btn btn-outline btn-sm" data-r="2">★</button>
      <button class="btn btn-outline btn-sm" data-r="3">★</button>
      <button class="btn btn-outline btn-sm" data-r="4">★</button>
      <button class="btn btn-outline btn-sm" data-r="5">★</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="book-tracker-add">Log Book</button>
  </div>
  <div class="error" id="book-tracker-error"></div>
</div>

<div class="tool-card">
  <h3>Log</h3>
  <div id="book-tracker-list"></div>
</div>
