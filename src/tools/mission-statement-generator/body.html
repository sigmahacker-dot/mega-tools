<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="mission-statement-generator-name">Company / org name</label>
      <input class="input" id="mission-statement-generator-name" type="text" placeholder="e.g. Brightleaf Studio" maxlength="60">
    </div>
    <div class="field">
      <label for="mission-statement-generator-audience">Who you serve</label>
      <input class="input" id="mission-statement-generator-audience" type="text" placeholder="e.g. small businesses" maxlength="60">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="mission-statement-generator-values">Core values (comma separated)</label>
      <input class="input" id="mission-statement-generator-values" type="text" placeholder="e.g. honesty, craft, speed" maxlength="80">
    </div>
    <div class="field">
      <label for="mission-statement-generator-style">Style</label>
      <select class="select" id="mission-statement-generator-style">
        <option value="inspiring">Inspiring</option>
        <option value="professional">Professional</option>
        <option value="bold">Bold</option>
        <option value="playful">Playful</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="mission-statement-generator-go" type="button">Draft Statements</button>
  </div>
  <div class="error" id="mission-statement-generator-error"></div>
  <div class="mt" id="mission-statement-generator-list"></div>
</div>
