<div class="tool-card">
  <div class="field">
    <label for="8d-audio-panner-file">Audio file</label>
    <input type="file" id="8d-audio-panner-file" accept="audio/*" class="input">
    <span class="hint">🎧 Headphones required for the full effect.</span>
  </div>
  <div class="field">
    <label for="8d-audio-panner-speed">Rotation speed: <span id="8d-audio-panner-speed-val">0.15</span> Hz</label>
    <input type="range" id="8d-audio-panner-speed" min="0.05" max="1" step="0.05" value="0.15">
    <span class="hint">One full orbit every <span id="8d-audio-panner-period">6.7</span> seconds.</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="8d-audio-panner-play">Play 8D</button>
    <button class="btn btn-outline" id="8d-audio-panner-stop">Stop</button>
    <button class="btn btn-outline" id="8d-audio-panner-download">Download 8D WAV</button>
  </div>
  <div class="error" id="8d-audio-panner-error"></div>
  <p class="note">A rotating stereo-pan LFO orbits the sound around you. Preview and download use the same graph — rendered in your browser.</p>
</div>
