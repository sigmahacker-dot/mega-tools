<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="blog-title-generator-keyword">Keyword / topic</label>
      <input type="text" class="input" id="blog-title-generator-keyword" placeholder="e.g. hunza valley tours" maxlength="60">
    </div>
    <div class="field">
      <label for="blog-title-generator-tone">Tone</label>
      <select class="select" id="blog-title-generator-tone">
        <option value="pro">Professional</option>
        <option value="casual">Casual</option>
        <option value="bold">Bold</option>
        <option value="curious">Curious</option>
      </select>
    </div>
  </div>
  <div class="error" id="blog-title-generator-error"></div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>#</th><th>Generated title</th><th></th></tr></thead>
      <tbody id="blog-title-generator-body"><tr><td colspan="3" class="muted">Enter a keyword to generate titles.</td></tr></tbody>
    </table>
    <p class="note">Titles are built from proven templates — always rewrite your favorite in your own voice.</p>
  </div>
</div>
