<div class="tool-card">
  <div class="field">
    <label for="nato-phonetic-converter-input">Input text</label>
    <textarea class="textarea" id="nato-phonetic-converter-input" rows="5" placeholder="Type text to encode, or phonetic words like Alpha Bravo to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="nato-phonetic-converter-mode">Mode</label>
      <select class="input" id="nato-phonetic-converter-mode">
        <option value="encode">Encode (text → NATO)</option>
        <option value="decode">Decode (NATO → text)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="nato-phonetic-converter-run">Convert</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="nato-phonetic-converter-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="nato-phonetic-converter-copy">Copy output</button></div>
  </div>
  <div class="error" id="nato-phonetic-converter-error"></div>
</div>
