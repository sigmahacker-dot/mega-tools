<div class="tool-card">
  <div class="field">
    <label for="acronym-generator-input">Phrases (one per line)</label>
    <textarea class="textarea" id="acronym-generator-input" rows="6" placeholder="North Atlantic Treaty Organization&#10;Federal Bureau of Investigation"></textarea>
  </div>
  <div class="grid2">
    <div class="checkbox-row"><input type="checkbox" id="acronym-generator-upper" checked> <label for="acronym-generator-upper">UPPERCASE</label></div>
    <div class="checkbox-row"><input type="checkbox" id="acronym-generator-periods"> <label for="acronym-generator-periods">Add periods (N.A.T.O.)</label></div>
    <div class="checkbox-row"><input type="checkbox" id="acronym-generator-skip" checked> <label for="acronym-generator-skip">Skip small words (of, the, and…)</label></div>
  </div>
  <div class="error" id="acronym-generator-error"></div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Phrase</th><th>Acronym</th><th></th></tr></thead>
      <tbody id="acronym-generator-body"><tr><td colspan="3" class="muted">Type a phrase above to generate its acronym.</td></tr></tbody>
    </table>
  </div>
  <p class="note">Everything runs locally in your browser.</p>
</div>
