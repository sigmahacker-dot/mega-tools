<div class="tool-card">
  <div class="field">
    <label for="vaporwave-text-generator-input">Your text</label>
    <input type="text" class="input" id="vaporwave-text-generator-input" placeholder="type something aesthetic" maxlength="120" value="vaporwave">
  </div>
  <div class="error" id="vaporwave-text-generator-error"></div>
  <div class="field mt">
    <label for="vaporwave-text-generator-output">Full-width result</label>
    <textarea class="textarea" id="vaporwave-text-generator-output" rows="3" readonly style="font-size:1.3rem;"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="vaporwave-text-generator-copy" type="button">Copy result</button>
    <button class="btn btn-outline btn-sm" id="vaporwave-text-generator-clear" type="button">Clear</button>
  </div>
  <p class="note">Maps A–Z, a–z, 0–9 and ASCII punctuation to Unicode full-width forms; spaces become ideographic spaces.</p>
</div>
