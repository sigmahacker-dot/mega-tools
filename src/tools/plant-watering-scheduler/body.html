<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="plant-watering-scheduler-name">Plant name</label>
      <input class="input" id="plant-watering-scheduler-name" type="text" placeholder="e.g. Monstera">
    </div>
    <div class="field">
      <label for="plant-watering-scheduler-interval">Water every (days)</label>
      <input class="input" id="plant-watering-scheduler-interval" type="number" min="1" max="365" value="7">
    </div>
    <div class="field">
      <label for="plant-watering-scheduler-last">Last watered</label>
      <input class="input" id="plant-watering-scheduler-last" type="date">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="plant-watering-scheduler-add">Add plant</button>
  </div>
  <div class="error" id="plant-watering-scheduler-error"></div>
  <div class="result">
    <h3>My plants</h3>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>Plant</th><th>Every</th><th>Last watered</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody id="plant-watering-scheduler-list"></tbody></table></div>
  </div>
</div>
