<div class="tool-card">
  <div class="field">
    <label>Mode</label>
    <div class="btn-row" role="radiogroup" aria-label="Conversion mode">
      <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;">
        <input type="radio" name="data-storage-converter-mode" id="data-storage-converter-decimal" checked> Decimal (1000)
      </label>
      <label style="display:inline-flex;align-items:center;gap:6px;">
        <input type="radio" name="data-storage-converter-mode" id="data-storage-converter-binary"> Binary (1024)
      </label>
    </div>
    <span class="hint">Decimal: 1 KB = 1,000 bytes. Binary: 1 KiB = 1,024 bytes.</span>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="data-storage-converter-value">Value</label>
      <input type="number" step="any" class="input" id="data-storage-converter-value" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="data-storage-converter-from">From</label>
      <select class="select" id="data-storage-converter-from"></select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="data-storage-converter-to">To</label>
      <select class="select" id="data-storage-converter-to"></select>
    </div>
    <div class="field">
      <label aria-hidden="true">&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-outline" id="data-storage-converter-swap" type="button">⇄ Swap units</button>
      </div>
    </div>
  </div>
  <div class="error" id="data-storage-converter-error"></div>
  <div class="result" id="data-storage-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="data-storage-converter-result-value">–</div><div class="l">Result</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="data-storage-converter-table"></tbody>
    </table>
  </div>
</div>
