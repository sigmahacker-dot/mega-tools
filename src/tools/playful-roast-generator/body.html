<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="playful-roast-generator-name">Name (optional)</label>
      <input class="input" id="playful-roast-generator-name" type="text" placeholder="e.g. Alex" maxlength="30">
    </div>
    <div class="field">
      <label for="playful-roast-generator-vibe">Vibe</label>
      <select class="select" id="playful-roast-generator-vibe">
        <option value="goofy">Goofy</option>
        <option value="nerdy">Nerdy</option>
        <option value="lazy">Lazy</option>
        <option value="dramatic">Dramatic</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="playful-roast-generator-go" type="button">Roast Me</button>
  </div>
  <div class="error" id="playful-roast-generator-error"></div>
  <div class="mt" id="playful-roast-generator-list"></div>
  <p class="note">All roasts are friendly and clean — tease with love, never punch down.</p>
</div>
