<div class="tool-card">
  <h2>Before/After Comparison Slider</h2>
  <p class="muted">A draggable before/after slider — try the live demo, then copy the dependency-free snippet.</p>
  <div class="grid2">
    <div class="field">
      <label for="image-comparison-slider-snippet-before">Before image</label>
      <input type="file" class="input" id="image-comparison-slider-snippet-before" accept="image/*">
    </div>
    <div class="field">
      <label for="image-comparison-slider-snippet-after">After image</label>
      <input type="file" class="input" id="image-comparison-slider-snippet-after" accept="image/*">
    </div>
    <div class="field">
      <label for="image-comparison-slider-snippet-handle">Handle color</label>
      <input type="color" class="input" id="image-comparison-slider-snippet-handle" value="#e11d48" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="image-comparison-slider-snippet-start">Start position: <span id="image-comparison-slider-snippet-start-v">50%</span></label>
      <input type="range" class="input" id="image-comparison-slider-snippet-start" min="5" max="95" value="50">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="image-comparison-slider-snippet-placeholder">Use canvas placeholders</button>
    <button class="btn btn-primary" id="image-comparison-slider-snippet-copy">Copy HTML + CSS + JS</button>
  </div>
  <h3 class="mt">Live demo <span class="muted" style="font-weight:normal;font-size:13px">(drag the handle)</span></h3>
  <div class="preview" style="display:flex;justify-content:center">
    <div id="image-comparison-slider-snippet-wrap" style="position:relative;width:100%;max-width:560px;aspect-ratio:16/9;overflow:hidden;border-radius:10px;user-select:none;touch-action:pan-y;cursor:ew-resize">
      <img id="image-comparison-slider-snippet-img-a" alt="After" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none">
      <img id="image-comparison-slider-snippet-img-b" alt="Before" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none">
      <div id="image-comparison-slider-snippet-line" style="position:absolute;top:0;bottom:0;width:3px;transform:translateX(-50%);pointer-events:none"></div>
      <div id="image-comparison-slider-snippet-knob" style="position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;cursor:ew-resize;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none">⇔</div>
      <span class="tag" id="image-comparison-slider-snippet-lab-a" style="position:absolute;top:10px;left:10px">Before</span>
      <span class="tag" id="image-comparison-slider-snippet-lab-b" style="position:absolute;top:10px;right:10px">After</span>
    </div>
  </div>
  <h3 class="mt">Generated code</h3>
  <pre class="code" id="image-comparison-slider-snippet-code" style="max-height:420px;overflow:auto"></pre>
  <div class="error" id="image-comparison-slider-snippet-error"></div>
</div>
