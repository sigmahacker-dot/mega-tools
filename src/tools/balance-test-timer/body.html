<div class="tool-card">
  <div class="field" style="max-width:280px">
    <label for="balance-test-timer-age">Age band</label>
    <select class="select" id="balance-test-timer-age">
      <option value="45">18–39</option>
      <option value="40">40–49</option>
      <option value="35">50–59</option>
      <option value="25">60–69</option>
      <option value="15">70–79</option>
      <option value="8">80+</option>
    </select>
  </div>
  <div style="text-align:center;margin:20px 0">
    <div id="balance-test-timer-display" style="font-size:3rem;font-weight:bold;font-variant-numeric:tabular-nums">0.0s</div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="balance-test-timer-start" type="button">Start</button>
    <button class="btn btn-outline" id="balance-test-timer-stop" type="button">Stop</button>
    <button class="btn btn-outline" id="balance-test-timer-reset" type="button">Reset</button>
  </div>
  <div class="error" id="balance-test-timer-error"></div>
  <div class="result" id="balance-test-timer-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="balance-test-timer-last">&ndash;</div><div class="l">Last time</div></div>
      <div class="stat-card"><div class="v" id="balance-test-timer-bench">&ndash;</div><div class="l">Benchmark</div></div>
      <div class="stat-card"><div class="v" id="balance-test-timer-best">&ndash;</div><div class="l">Your best</div></div>
    </div>
    <p class="note" id="balance-test-timer-msg">Stand near support. Stop if you feel dizzy.</p>
    <p class="note">For information only &mdash; not medical advice.</p>
  </div>
</div>
