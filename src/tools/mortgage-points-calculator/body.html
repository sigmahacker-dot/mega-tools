<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="mortgage-points-calculator-amount">Loan amount ($)</label><input class="input" id="mortgage-points-calculator-amount" type="number" min="0" step="any" value="350000"></div>
    <div class="field"><label for="mortgage-points-calculator-rate">Base rate (% APR)</label><input class="input" id="mortgage-points-calculator-rate" type="number" min="0" step="any" value="7"></div>
    <div class="field"><label for="mortgage-points-calculator-points">Points (1 point = 1%)</label><input class="input" id="mortgage-points-calculator-points" type="number" min="0" step="any" value="2"></div>
    <div class="field"><label for="mortgage-points-calculator-reduction">Rate reduction per point (%)</label><input class="input" id="mortgage-points-calculator-reduction" type="number" min="0" step="any" value="0.25"></div>
    <div class="field"><label for="mortgage-points-calculator-stay">Years you will stay</label><input class="input" id="mortgage-points-calculator-stay" type="number" min="1" step="any" value="10"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="mortgage-points-calculator-calc">Calculate</button></div>
  <div class="error" id="mortgage-points-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="mortgage-points-calculator-cost">—</div><div class="l">Points cost</div></div>
    <div class="stat-card"><div class="v" id="mortgage-points-calculator-newrate">—</div><div class="l">New rate</div></div>
    <div class="stat-card"><div class="v" id="mortgage-points-calculator-breakeven">—</div><div class="l">Break-even (months)</div></div>
    <div class="stat-card"><div class="v" id="mortgage-points-calculator-net">—</div><div class="l">Net savings</div></div>
  </div>
  <p class="hint">Assumes a 30-year fixed loan; comparisons are principal &amp; interest only.</p>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
