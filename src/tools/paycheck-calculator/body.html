<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="pc-gross">Gross pay per period ($)</label><input type="number" class="input" id="pc-gross" min="0" step="any" placeholder="2500"></div>
    <div class="field"><label for="pc-freq">Pay frequency</label>
      <select class="input" id="pc-freq">
        <option value="52">Weekly (52)</option>
        <option value="26" selected>Biweekly (26)</option>
        <option value="24">Semimonthly (24)</option>
        <option value="12">Monthly (12)</option>
      </select>
    </div>
    <div class="field"><label for="pc-fed">Federal tax (%)</label><input type="number" class="input" id="pc-fed" min="0" max="60" step="any" placeholder="12"></div>
    <div class="field"><label for="pc-state">State/local tax (%)</label><input type="number" class="input" id="pc-state" min="0" max="30" step="any" placeholder="5"></div>
    <div class="field"><label for="pc-fica">Payroll tax / FICA (%)</label><input type="number" class="input" id="pc-fica" min="0" max="30" step="any" placeholder="7.65"></div>
    <div class="field"><label for="pc-pretax">Pre-tax deductions ($)</label><input type="number" class="input" id="pc-pretax" min="0" step="any" placeholder="150"></div>
    <div class="field"><label for="pc-posttax">Post-tax deductions ($)</label><input type="number" class="input" id="pc-posttax" min="0" step="any" placeholder="0"></div>
  </div>
  <div class="error" id="paycheck-calculator-error"></div>
  <div class="result" id="pc-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pc-net">–</div><div class="l">Net per paycheck</div></div>
      <div class="stat-card"><div class="v" id="pc-annual">–</div><div class="l">Annual take-home</div></div>
      <div class="stat-card"><div class="v" id="pc-rate">–</div><div class="l">Effective tax rate</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Item</th><th>Per paycheck</th><th>Annual</th></tr></thead>
      <tbody id="pc-body"><tr><td colspan="3" class="muted">Enter your pay details.</td></tr></tbody>
    </table>
    <p class="note">Flat-rate planning estimate. Real payroll uses progressive brackets.</p>
  </div>
</div>
