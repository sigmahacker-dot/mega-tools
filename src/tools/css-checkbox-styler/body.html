<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="css-checkbox-styler-accent">Accent color</label>
      <input class="input" id="css-checkbox-styler-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="css-checkbox-styler-size">Box size (px)</label>
      <input class="input" id="css-checkbox-styler-size" type="number" value="22" min="14" max="48">
    </div>
    <div class="field">
      <label for="css-checkbox-styler-radius">Corner radius (px)</label>
      <input class="input" id="css-checkbox-styler-radius" type="number" value="6" min="0" max="24">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="css-checkbox-styler-mark">Check mark style</label>
      <select class="select" id="css-checkbox-styler-mark">
        <option value="check">Check ✓</option>
        <option value="dash">Dash –</option>
      </select>
    </div>
    <div class="field">
      <label for="css-checkbox-styler-label">Label text</label>
      <input class="input" id="css-checkbox-styler-label" value="I agree to the terms">
    </div>
  </div>
  <div class="field">
    <label>Live preview (clickable)</label>
    <div id="css-checkbox-styler-preview" style="border:1px solid #27272a;border-radius:12px;padding:32px;background:#18181b;display:flex;justify-content:center"></div>
  </div>
  <div class="error" id="css-checkbox-styler-error"></div>
  <div class="field">
    <label for="css-checkbox-styler-output">HTML + CSS</label>
    <textarea class="textarea" id="css-checkbox-styler-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="css-checkbox-styler-copy">Copy code</button>
    <button class="btn btn-outline" id="css-checkbox-styler-download">Download checkbox.html</button>
  </div>
</div>
