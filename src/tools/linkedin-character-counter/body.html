<div class="tool-card">
  <div class="field">
    <label for="linkedin-character-counter-field">LinkedIn field</label>
    <select class="select" id="linkedin-character-counter-field">
      <option value="3000">Post — 3,000</option>
      <option value="220">Profile headline — 220</option>
      <option value="2600">About section — 2,600</option>
      <option value="8000">Message — 8,000</option>
      <option value="100">Article headline — 100</option>
    </select>
  </div>
  <div class="field">
    <label for="linkedin-character-counter-input">Your text</label>
    <textarea class="textarea" id="linkedin-character-counter-input" rows="7" placeholder="Write here..."></textarea>
  </div>
  <div class="error" id="linkedin-character-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="linkedin-character-counter-used">0</div><div class="l">Characters used</div></div>
    <div class="stat-card"><div class="v" id="linkedin-character-counter-left">3000</div><div class="l">Remaining</div></div>
    <div class="stat-card"><div class="v" id="linkedin-character-counter-words">0</div><div class="l">Words</div></div>
  </div>
  <div class="result mt">
    <div class="field">
      <label>Limit usage</label>
      <div style="background:rgba(0,0,0,.12);border-radius:8px;height:14px;overflow:hidden;"><div id="linkedin-character-counter-bar" style="height:100%;width:0%;background:#0a66c2;transition:width .15s;"></div></div>
    </div>
    <p class="note" id="linkedin-character-counter-note">Feed posts fold after ~140 characters — put your hook first.</p>
  </div>
</div>
