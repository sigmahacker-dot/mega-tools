<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="ring-circ">Inner circumference (mm)</label><input type="number" class="input" id="ring-circ" min="0" step="any" placeholder="54.4"></div>
    <div class="field"><label for="ring-dia">Inner diameter (mm)</label><input type="number" class="input" id="ring-dia" min="0" step="any" placeholder="17.3"></div>
    <div class="field"><label for="ring-us">US size</label><input type="number" class="input" id="ring-us" min="0" step="any" placeholder="7"></div>
  </div>
  <div class="error" id="ring-size-converter-error"></div>
  <div class="result" id="ring-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ring-usout">–</div><div class="l">US size</div></div>
      <div class="stat-card"><div class="v" id="ring-uk">–</div><div class="l">UK size</div></div>
      <div class="stat-card"><div class="v" id="ring-eu">–</div><div class="l">EU / ISO size</div></div>
      <div class="stat-card"><div class="v" id="ring-jp">–</div><div class="l">Japan size</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Measurement</th><th>Value</th></tr></thead>
      <tbody id="ring-body"><tr><td colspan="2" class="muted">Fill in one field to convert.</td></tr></tbody>
    </table>
    <p class="note">Conversions are approximate — sizing varies slightly between jewelers.</p>
  </div>
</div>
