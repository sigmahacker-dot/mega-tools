<div class="tool-card">
  <div class="field">
    <label for="ascii-art-text-banner-text">Text</label>
    <input class="input" id="ascii-art-text-banner-text" value="TOOLNEST" maxlength="40" autocomplete="off">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="ascii-art-text-banner-fill">Fill character</label>
      <select class="input select" id="ascii-art-text-banner-fill">
        <option value="#">#</option>
        <option value="*">*</option>
        <option value="@">@</option>
        <option value="█">█</option>
        <option value="o">o</option>
        <option value="+">+</option>
      </select>
    </div>
    <div class="field">
      <label for="ascii-art-text-banner-gap">Letter spacing</label>
      <select class="input select" id="ascii-art-text-banner-gap">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
      </select>
    </div>
  </div>
  <div class="result">
    <pre id="ascii-art-text-banner-out" style="font-family:monospace;font-size:12px;line-height:1.15;overflow-x:auto;background:#0d0d13;border:1px solid #2a2a33;border-radius:10px;padding:14px;white-space:pre"></pre>
  </div>
  <div class="btn-row">
    <button class="btn" id="ascii-art-text-banner-copy">Copy</button>
    <button class="btn btn-outline" id="ascii-art-text-banner-dl">Download .txt</button>
  </div>
  <div class="error" id="ascii-art-text-banner-error"></div>
</div>
