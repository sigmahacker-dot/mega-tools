<div class="tool-card">
  <div class="field">
    <label for="mood-board-maker-file">Images (up to 9)</label>
    <input type="file" id="mood-board-maker-file" accept="image/*" multiple class="input">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="mood-board-maker-title">Board title</label>
      <input type="text" id="mood-board-maker-title" class="input" value="Autumn Vibes" maxlength="40">
    </div>
    <div class="field">
      <label for="mood-board-maker-bg">Background</label>
      <input type="color" id="mood-board-maker-bg" class="input" value="#f4f1ea" style="height:42px;padding:4px;">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="mood-board-maker-download">Download board</button>
    <button class="btn btn-outline" id="mood-board-maker-clear">Clear images</button>
  </div>
  <div class="result">
    <canvas id="mood-board-maker-canvas" style="width:100%;border-radius:10px;"></canvas>
  </div>
  <div class="error" id="mood-board-maker-error"></div>
  <p class="note">Images stay on your device — the collage is built locally in your browser.</p>
</div>
