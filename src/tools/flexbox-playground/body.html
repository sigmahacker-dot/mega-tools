<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="flexbox-playground-direction">flex-direction</label>
      <select class="select" id="flexbox-playground-direction">
        <option value="row" selected>row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>
    </div>
    <div class="field">
      <label for="flexbox-playground-wrap">flex-wrap</label>
      <select class="select" id="flexbox-playground-wrap">
        <option value="nowrap" selected>nowrap</option>
        <option value="wrap">wrap</option>
        <option value="wrap-reverse">wrap-reverse</option>
      </select>
    </div>
    <div class="field">
      <label for="flexbox-playground-justify">justify-content</label>
      <select class="select" id="flexbox-playground-justify">
        <option value="flex-start" selected>flex-start</option>
        <option value="flex-end">flex-end</option>
        <option value="center">center</option>
        <option value="space-between">space-between</option>
        <option value="space-around">space-around</option>
        <option value="space-evenly">space-evenly</option>
      </select>
    </div>
    <div class="field">
      <label for="flexbox-playground-align-items">align-items</label>
      <select class="select" id="flexbox-playground-align-items">
        <option value="stretch" selected>stretch</option>
        <option value="flex-start">flex-start</option>
        <option value="flex-end">flex-end</option>
        <option value="center">center</option>
        <option value="baseline">baseline</option>
      </select>
    </div>
    <div class="field">
      <label for="flexbox-playground-align-content">align-content</label>
      <select class="select" id="flexbox-playground-align-content">
        <option value="stretch" selected>stretch</option>
        <option value="flex-start">flex-start</option>
        <option value="flex-end">flex-end</option>
        <option value="center">center</option>
        <option value="space-between">space-between</option>
        <option value="space-around">space-around</option>
      </select>
    </div>
    <div class="field">
      <label for="flexbox-playground-items">Items: <span id="flexbox-playground-items-val">5</span></label>
      <input type="range" id="flexbox-playground-items" min="1" max="12" value="5">
    </div>
  </div>
  <div class="field">
    <label for="flexbox-playground-gap">Gap: <span id="flexbox-playground-gap-val">12</span>px</label>
    <input type="range" id="flexbox-playground-gap" min="0" max="40" value="12">
  </div>
  <div class="field">
    <label>Live demo</label>
    <div id="flexbox-playground-demo" style="background:#f3f4f6;border-radius:12px;padding:16px;min-height:220px;"></div>
  </div>
  <div class="error" id="flexbox-playground-error"></div>
  <div class="result" id="flexbox-playground-result">
    <div class="field">
      <label for="flexbox-playground-css">Generated CSS</label>
      <pre id="flexbox-playground-css" style="background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;"></pre>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="flexbox-playground-copy">Copy CSS</button>
    </div>
  </div>
</div>
