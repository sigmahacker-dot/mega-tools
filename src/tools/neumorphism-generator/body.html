<div class="tool-card">
  <h2>Neumorphism Generator</h2>
  <p class="muted">Soft-UI box-shadow recipes with live raised/pressed previews.</p>
  <div class="grid2">
    <div class="field">
      <label for="neumorphism-generator-mode">Mode</label>
      <select class="input" id="neumorphism-generator-mode">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="field">
      <label for="neumorphism-generator-depth">Shadow mode</label>
      <select class="input" id="neumorphism-generator-depth">
        <option value="outset">Raised (outset)</option>
        <option value="inset">Pressed (inset)</option>
      </select>
    </div>
    <div class="field">
      <label for="neumorphism-generator-bg">Background color</label>
      <input type="color" class="input" id="neumorphism-generator-bg" value="#e0e5ec" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="neumorphism-generator-distance">Distance: <span id="neumorphism-generator-distance-v">10px</span></label>
      <input type="range" class="input" id="neumorphism-generator-distance" min="2" max="30" step="1" value="10">
    </div>
    <div class="field">
      <label for="neumorphism-generator-blur">Blur: <span id="neumorphism-generator-blur-v">20px</span></label>
      <input type="range" class="input" id="neumorphism-generator-blur" min="0" max="60" step="1" value="20">
    </div>
    <div class="field">
      <label for="neumorphism-generator-intensity">Intensity: <span id="neumorphism-generator-intensity-v">0.30</span></label>
      <input type="range" class="input" id="neumorphism-generator-intensity" min="0.05" max="0.9" step="0.01" value="0.30">
    </div>
    <div class="field">
      <label for="neumorphism-generator-radius">Corner radius: <span id="neumorphism-generator-radius-v">20px</span></label>
      <input type="range" class="input" id="neumorphism-generator-radius" min="0" max="60" step="1" value="20">
    </div>
    <div class="field">
      <label for="neumorphism-generator-class">CSS class name</label>
      <input type="text" class="input" id="neumorphism-generator-class" value="neu-card">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="neumorphism-generator-stage" style="min-height:240px;display:flex;gap:28px;align-items:center;justify-content:center;transition:background .2s">
    <div id="neumorphism-generator-card" style="width:150px;height:110px;display:flex;align-items:center;justify-content:center;font-weight:700">Card</div>
    <button id="neumorphism-generator-btn" class="btn" style="border:none;padding:14px 26px;font-weight:700;cursor:pointer">Button</button>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="neumorphism-generator-copy">Copy CSS</button>
  </div>
  <h3 class="mt">Generated CSS</h3>
  <pre class="code" id="neumorphism-generator-code"></pre>
  <div class="error" id="neumorphism-generator-error"></div>
</div>
