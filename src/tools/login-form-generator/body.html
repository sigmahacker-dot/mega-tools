<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="login-form-generator-title">Title</label>
      <input class="input" id="login-form-generator-title" value="Welcome back">
    </div>
    <div class="field">
      <label for="login-form-generator-sub">Subtitle</label>
      <input class="input" id="login-form-generator-sub" value="Sign in to your account">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="login-form-generator-btn">Button text</label>
      <input class="input" id="login-form-generator-btn" value="Sign in">
    </div>
    <div class="field">
      <label for="login-form-generator-accent">Accent color</label>
      <input class="input" id="login-form-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="login-form-generator-theme">Theme</label>
      <select class="select" id="login-form-generator-theme">
        <option value="dark">Dark page</option>
        <option value="light">Light page</option>
      </select>
    </div>
  </div>
  <div class="grid3">
    <div class="field checkline">
      <input type="checkbox" id="login-form-generator-remember" checked>
      <label for="login-form-generator-remember">Remember me</label>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="login-form-generator-forgot" checked>
      <label for="login-form-generator-forgot">Forgot password link</label>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="login-form-generator-social">
      <label for="login-form-generator-social">Social buttons</label>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="login-form-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:32px 16px;background:#18181b"></div>
  </div>
  <div class="error" id="login-form-generator-error"></div>
  <div class="field">
    <label for="login-form-generator-output">HTML + CSS + JS</label>
    <textarea class="textarea" id="login-form-generator-output" rows="16" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="login-form-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="login-form-generator-download">Download login.html</button>
  </div>
  <p class="note">Front-end markup only — connect the form action to your own backend.</p>
</div>
