<div class="tool-card">
  <div class="btn-row">
    <button class="btn btn-sm" id="quiz-maker-tab-author">Author</button>
    <button class="btn btn-sm btn-outline" id="quiz-maker-tab-take">Take Quiz</button>
  </div>
  <div class="error" id="quiz-maker-error"></div>
</div>

<div class="tool-card" id="quiz-maker-author-pane">
  <h3>Author questions</h3>
  <div class="field">
    <label for="quiz-maker-q">Question</label>
    <input class="input" type="text" id="quiz-maker-q" placeholder="Question text">
  </div>
  <div class="grid2">
    <div class="field"><label for="quiz-maker-o1">Option A</label><input class="input" type="text" id="quiz-maker-o1"></div>
    <div class="field"><label for="quiz-maker-o2">Option B</label><input class="input" type="text" id="quiz-maker-o2"></div>
    <div class="field"><label for="quiz-maker-o3">Option C</label><input class="input" type="text" id="quiz-maker-o3"></div>
    <div class="field"><label for="quiz-maker-o4">Option D</label><input class="input" type="text" id="quiz-maker-o4"></div>
  </div>
  <div class="field">
    <label for="quiz-maker-correct">Correct answer</label>
    <select class="select" id="quiz-maker-correct">
      <option value="0">A</option>
      <option value="1">B</option>
      <option value="2">C</option>
      <option value="3">D</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn" id="quiz-maker-add">Add Question</button>
    <button class="btn btn-outline" id="quiz-maker-clear">Clear Quiz</button>
  </div>
  <div id="quiz-maker-qlist" style="margin-top:12px"></div>
</div>

<div class="tool-card hidden" id="quiz-maker-take-pane">
  <h3>Take the quiz</h3>
  <div id="quiz-maker-take"></div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn" id="quiz-maker-submit">Submit Answers</button>
    <button class="btn btn-outline" id="quiz-maker-retry">Retry</button>
  </div>
  <div class="result" id="quiz-maker-result" style="margin-top:10px"></div>
</div>
