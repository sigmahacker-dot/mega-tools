<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="yahtzee-dice-game-rolls">3</div><div class="l">Rolls left</div></div>
    <div class="stat-card"><div class="v" id="yahtzee-dice-game-upper">0</div><div class="l">Upper subtotal</div></div>
    <div class="stat-card"><div class="v" id="yahtzee-dice-game-total">0</div><div class="l">Total</div></div>
  </div>
  <p class="muted" id="yahtzee-dice-game-msg" style="min-height:24px">Press Roll Dice, tap dice to hold, then pick a category.</p>
  <div id="yahtzee-dice-game-dice" style="display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap"></div>
  <div class="btn-row" style="justify-content:center;margin-bottom:12px">
    <button class="btn btn-primary" id="yahtzee-dice-game-roll">🎲 Roll Dice</button>
    <button class="btn" id="yahtzee-dice-game-new">New game</button>
  </div>
  <div id="yahtzee-dice-game-card" style="max-width:440px;margin:0 auto;text-align:left"></div>
  <div class="error" id="yahtzee-dice-game-error"></div>
</div>
