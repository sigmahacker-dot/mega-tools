<div class="tool-card">
  <h2>PDF Form Filler</h2>
  <p class="muted">Fill AcroForm fields in any PDF — everything happens in your browser.</p>
  <div class="field">
    <label for="pdf-form-filler-file">PDF with form fields</label>
    <input type="file" class="input" id="pdf-form-filler-file" accept=".pdf,application/pdf">
  </div>
  <div id="pdf-form-filler-info" class="muted" style="margin:8px 0"></div>
  <div id="pdf-form-filler-fields" class="file-list"><p class="muted">No PDF loaded yet.</p></div>
  <div class="btn-row mt">
    <button class="btn btn-outline" id="pdf-form-filler-clear">Clear</button>
    <button class="btn btn-primary" id="pdf-form-filler-fill" disabled>Fill &amp; Download</button>
  </div>
  <div class="error" id="pdf-form-filler-error"></div>
  <div class="result hidden" id="pdf-form-filler-result"></div>
  <p class="note">Works on PDFs that already contain fillable form fields. Your files never leave your device.</p>
</div>
