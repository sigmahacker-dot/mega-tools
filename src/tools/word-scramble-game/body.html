<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="word-scramble-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="word-scramble-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="word-scramble-game-time">60</div><div class="l">Seconds</div></div>
  </div>
  <div id="word-scramble-game-word" style="font-size:42px;font-weight:bold;letter-spacing:10px;margin:16px 0;min-height:60px;color:#1b5e20">????</div>
  <p class="muted" id="word-scramble-game-msg" style="min-height:24px">Press Start — unscramble as many words as you can in 60 seconds!</p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="word-scramble-game-guess">Your guess</label>
      <input class="input" id="word-scramble-game-guess" placeholder="Type the word…" autocomplete="off" disabled>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="word-scramble-game-submit" style="width:100%" disabled>Guess</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="word-scramble-game-start">▶ Start</button>
    <button class="btn btn-outline" id="word-scramble-game-skip" disabled>Skip ↷</button>
  </div>
  <div class="error" id="word-scramble-game-error"></div>
</div>
