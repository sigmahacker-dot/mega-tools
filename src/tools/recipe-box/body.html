<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="recipe-box-name">Recipe name</label>
      <input class="input" type="text" id="recipe-box-name" placeholder="e.g. Chicken Biryani">
    </div>
    <div class="field">
      <label for="recipe-box-cat">Category</label>
      <select class="select" id="recipe-box-cat">
        <option value="Main">Main</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Dessert">Dessert</option>
        <option value="Snack">Snack</option>
        <option value="Drink">Drink</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="recipe-box-ing">Ingredients (one per line)</label>
    <textarea class="textarea" id="recipe-box-ing" rows="4" placeholder="2 cups rice&#10;500g chicken&#10;2 onions"></textarea>
  </div>
  <div class="field">
    <label for="recipe-box-steps">Steps (one per line)</label>
    <textarea class="textarea" id="recipe-box-steps" rows="4" placeholder="Marinate the chicken…&#10;Fry the onions…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="recipe-box-add">Save Recipe</button>
  </div>
  <div class="error" id="recipe-box-error"></div>
</div>

<div class="tool-card">
  <div class="field">
    <label for="recipe-box-search">Search recipes</label>
    <input class="input" type="text" id="recipe-box-search" placeholder="Search name, ingredients, steps…">
  </div>
  <div id="recipe-box-list"></div>
</div>
