<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cubic-bezier-generator-x1">x1: <span id="cubic-bezier-generator-x1-v">0.25</span></label><input type="range" id="cubic-bezier-generator-x1" min="0" max="1" step="0.01" value="0.25"></div>
    <div class="field"><label for="cubic-bezier-generator-y1">y1: <span id="cubic-bezier-generator-y1-v">0.1</span></label><input type="range" id="cubic-bezier-generator-y1" min="-1" max="2" step="0.01" value="0.1"></div>
    <div class="field"><label for="cubic-bezier-generator-x2">x2: <span id="cubic-bezier-generator-x2-v">0.25</span></label><input type="range" id="cubic-bezier-generator-x2" min="0" max="1" step="0.01" value="0.25"></div>
    <div class="field"><label for="cubic-bezier-generator-y2">y2: <span id="cubic-bezier-generator-y2-v">1</span></label><input type="range" id="cubic-bezier-generator-y2" min="-1" max="2" step="0.01" value="1"></div>
  </div>
  <div class="field">
    <label for="cubic-bezier-generator-preset">Presets</label>
    <select class="select" id="cubic-bezier-generator-preset">
      <option value="">Custom…</option>
      <option value="0.25,0.1,0.25,1">ease</option>
      <option value="0.42,0,1,1">ease-in</option>
      <option value="0,0,0.58,1">ease-out</option>
      <option value="0.42,0,0.58,1">ease-in-out</option>
      <option value="0.34,1.56,0.64,1">ease-out-back</option>
      <option value="0.68,-0.55,0.27,1.55">ease-in-out-back</option>
      <option value="0.55,0.055,0.675,0.19">ease-in-cubic</option>
      <option value="0.215,0.61,0.355,1">ease-out-cubic</option>
    </select>
  </div>
  <div class="error" id="cubic-bezier-generator-error"></div>
  <div class="result mt">
    <canvas class="preview" id="cubic-bezier-generator-canvas" width="640" height="340" style="background:#fff;width:100%;"></canvas>
    <div class="field mt">
      <label for="cubic-bezier-generator-css">CSS</label>
      <input type="text" class="input" id="cubic-bezier-generator-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="cubic-bezier-generator-replay" type="button">Replay ball</button>
      <button class="btn btn-outline btn-sm" id="cubic-bezier-generator-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
