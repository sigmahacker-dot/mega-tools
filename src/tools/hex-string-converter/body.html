<div class="tool-card">
  <div class="field">
    <label for="hex-string-converter-dir">Direction</label>
    <select class="select" id="hex-string-converter-dir">
      <option value="t2h" selected>Text → Hex</option>
      <option value="h2t">Hex → Text</option>
    </select>
  </div>
  <div class="field">
    <label for="hex-string-converter-in">Input</label>
    <textarea class="textarea" id="hex-string-converter-in" rows="4" placeholder="Type text or paste hex…"></textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="hex-string-converter-prefix">0x prefix</label>
      <select class="select" id="hex-string-converter-prefix">
        <option value="none" selected>None</option>
        <option value="all">0x on every byte</option>
        <option value="single">Single 0x at start</option>
      </select>
    </div>
    <div class="field">
      <label for="hex-string-converter-sep">Separator</label>
      <select class="select" id="hex-string-converter-sep">
        <option value="none" selected>None</option>
        <option value="space">Space</option>
        <option value="colon">Colon</option>
      </select>
    </div>
    <div class="field">
      <label for="hex-string-converter-case">Case</label>
      <select class="select" id="hex-string-converter-case">
        <option value="lower" selected>Lowercase</option>
        <option value="upper">Uppercase</option>
      </select>
    </div>
  </div>
  <div class="error" id="hex-string-converter-error"></div>
  <div class="result" id="hex-string-converter-result">
    <div class="field">
      <label for="hex-string-converter-out">Output</label>
      <textarea class="textarea" id="hex-string-converter-out" rows="4" readonly placeholder="Result appears here…"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" id="hex-string-converter-copy">Copy result</button>
      <button class="btn btn-outline" id="hex-string-converter-swap">Swap direction</button>
    </div>
  </div>
</div>
