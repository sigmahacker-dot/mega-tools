<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="gradient-generator-c1">Color 1</label>
      <input type="color" id="gradient-generator-c1" value="#166534" class="input">
    </div>
    <div class="field">
      <label for="gradient-generator-c2">Color 2</label>
      <input type="color" id="gradient-generator-c2" value="#4d7c0f" class="input">
    </div>
  </div>
  <div class="field">
    <label for="gradient-generator-angle">Angle: <span id="gradient-generator-angle-val">135</span>°</label>
    <input type="range" id="gradient-generator-angle" min="0" max="360" value="135" style="width:100%">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="gradient-generator-random">Random</button>
    <button class="btn btn-outline" id="gradient-generator-copy">Copy CSS</button>
  </div>
  <div class="error" id="gradient-generator-error"></div>
  <div class="mt">
    <div id="gradient-generator-preview" style="height:180px;border-radius:8px"></div>
  </div>
  <div class="result mt"><code id="gradient-generator-css" style="word-break:break-all"></code></div>
</div>
