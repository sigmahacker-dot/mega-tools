<div class="tool-card">
  <h2>CSS Loader Generator</h2>
  <p class="muted">Generate a pure-CSS loading spinner snippet — no images, no JavaScript.</p>
  <div class="grid2">
    <div class="field">
      <label for="css-loader-generator-style">Spinner style</label>
      <select class="input" id="css-loader-generator-style">
        <option value="ring">Ring</option>
        <option value="dual-ring">Dual ring</option>
        <option value="dots">Dots</option>
        <option value="bars">Bars</option>
      </select>
    </div>
    <div class="field">
      <label for="css-loader-generator-color">Color</label>
      <input type="color" class="input" id="css-loader-generator-color" value="#e11d48" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-loader-generator-size">Size: <span id="css-loader-generator-size-v">48px</span></label>
      <input type="range" class="input" id="css-loader-generator-size" min="16" max="120" step="2" value="48">
    </div>
    <div class="field">
      <label for="css-loader-generator-speed">Speed: <span id="css-loader-generator-speed-v">0.8s</span></label>
      <input type="range" class="input" id="css-loader-generator-speed" min="0.3" max="3" step="0.1" value="0.8">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="css-loader-generator-stage" style="min-height:160px;display:flex;align-items:center;justify-content:center"></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="css-loader-generator-copy">Copy HTML + CSS</button>
  </div>
  <h3 class="mt">Generated code</h3>
  <pre class="code" id="css-loader-generator-code" style="max-height:340px;overflow:auto"></pre>
  <div class="error" id="css-loader-generator-error"></div>
</div>
