<div class="tool-card">
  <div class="field">
    <label for="anagram-generator-input">Word (up to 8 letters)</label>
    <input class="input" type="text" id="anagram-generator-input" placeholder="e.g. listen" maxlength="8" autocomplete="off">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="anagram-generator-run">Find anagrams</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="anagram-generator-found">0</div><div class="l">Real anagrams</div></div>
    <div class="stat-card"><div class="v" id="anagram-generator-checked">0</div><div class="l">Permutations checked</div></div>
  </div>
  <div class="field">
    <label>Anagrams</label>
    <div class="result"><div class="data" id="anagram-generator-output" style="white-space:pre-wrap"></div></div>
  </div>
  <div class="error" id="anagram-generator-error"></div>
</div>
