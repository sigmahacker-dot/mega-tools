<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ulid-generator-count">How many? (1–500)</label>
      <input type="number" class="input" id="ulid-generator-count" min="1" max="500" value="10">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="ulid-generator-generate">Generate ULIDs</button></div>
    </div>
  </div>
  <div class="error" id="ulid-generator-error"></div>
  <div class="field">
    <label for="ulid-generator-output">Generated ULIDs</label>
    <textarea class="textarea" id="ulid-generator-output" rows="10" readonly placeholder="Your ULIDs will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="ulid-generator-copy">Copy all</button>
    <button class="btn btn-outline" id="ulid-generator-download">Download .txt</button>
  </div>
</div>
