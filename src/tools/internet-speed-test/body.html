<div class="tool-card">
  <p class="note"><strong>Approximate — measures download speed from our server to your device. Real-world speeds vary.</strong> The test downloads a 10&nbsp;MB file three times (about 30&nbsp;MB total), so avoid it on metered connections.</p>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="internet-speed-test-start">Start Test</button>
  </div>
  <div class="error" id="internet-speed-test-error"></div>
  <div class="progress hidden" id="internet-speed-test-progress"><div id="internet-speed-test-bar"></div></div>
  <p class="muted" id="internet-speed-test-status"></p>
  <div id="internet-speed-test-results" class="hidden">
    <table class="data">
      <thead><tr><th>Run</th><th>Speed (Mbps)</th><th>Time</th></tr></thead>
      <tbody id="internet-speed-test-rows"></tbody>
    </table>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="internet-speed-test-avg">–</div><div class="l">Average Mbps</div></div>
      <div class="stat-card"><div class="v" id="internet-speed-test-best">–</div><div class="l">Best run Mbps</div></div>
    </div>
  </div>
</div>
