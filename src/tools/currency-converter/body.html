<div class="tool-card">
  <div class="field">
    <label for="currency-amount">Amount</label>
    <input type="number" class="input" id="currency-amount" min="0" step="any" placeholder="e.g. 100">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="currency-from">From</label>
      <select class="select" id="currency-from"></select>
    </div>
    <div class="field">
      <label for="currency-to">To</label>
      <select class="select" id="currency-to"></select>
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="currency-convert-btn">Convert</button>
    <button type="button" class="btn btn-outline" id="currency-swap-btn">⇄ Swap</button>
  </div>
  <div class="error" id="currency-converter-error"></div>
  <div class="result" id="currency-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="currency-value">–</div><div class="l">Converted amount</div></div>
      <div class="stat-card"><div class="v" id="currency-rate">–</div><div class="l">Exchange rate</div></div>
    </div>
    <p class="muted" id="currency-updated">Rates not loaded yet.</p>
  </div>
</div>
