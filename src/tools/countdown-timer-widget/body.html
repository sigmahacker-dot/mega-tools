<div class="tool-card" style="text-align:center">
  <div style="font-size:72px;font-weight:800;font-variant-numeric:tabular-nums" id="countdown-timer-widget-display">00:00:00</div>
  <div class="grid2" style="max-width:420px;margin:12px auto;text-align:left">
    <div class="field">
      <label for="countdown-timer-widget-h">Hours</label>
      <input type="number" class="input" id="countdown-timer-widget-h" min="0" max="99" step="1" value="0">
    </div>
    <div class="field">
      <label for="countdown-timer-widget-m">Minutes</label>
      <input type="number" class="input" id="countdown-timer-widget-m" min="0" max="59" step="1" value="5">
    </div>
    <div class="field">
      <label for="countdown-timer-widget-s">Seconds</label>
      <input type="number" class="input" id="countdown-timer-widget-s" min="0" max="59" step="1" value="0">
    </div>
    <div class="field">
      <label for="countdown-timer-widget-preset">Presets</label>
      <select class="input" id="countdown-timer-widget-preset">
        <option value="">Custom…</option>
        <option value="60">1 minute</option>
        <option value="300">5 minutes</option>
        <option value="600">10 minutes</option>
        <option value="900">15 minutes</option>
        <option value="1500">25 min (Pomodoro)</option>
        <option value="1800">30 minutes</option>
        <option value="3600">1 hour</option>
      </select>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="countdown-timer-widget-toggle">▶ Start</button>
    <button class="btn btn-outline" id="countdown-timer-widget-reset">Reset</button>
  </div>
  <p class="muted" id="countdown-timer-widget-msg" style="min-height:24px"></p>
  <div class="error" id="countdown-timer-widget-error"></div>
</div>
