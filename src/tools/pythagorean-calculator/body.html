<div class="tool-card">
  <p class="note">Enter any <strong>two</strong> sides and leave the third blank.</p>
  <div class="grid2">
    <div class="field">
      <label for="pythagorean-calculator-a">Leg a</label>
      <input type="number" class="input" id="pythagorean-calculator-a" step="any" min="0" placeholder="e.g. 3">
    </div>
    <div class="field">
      <label for="pythagorean-calculator-b">Leg b</label>
      <input type="number" class="input" id="pythagorean-calculator-b" step="any" min="0" placeholder="e.g. 4">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="pythagorean-calculator-c">Hypotenuse c</label>
      <input type="number" class="input" id="pythagorean-calculator-c" step="any" min="0" placeholder="e.g. 5">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" id="pythagorean-calculator-go">Solve</button>
    </div>
  </div>
  <div class="error" id="pythagorean-calculator-error"></div>
  <div class="result" id="pythagorean-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pythagorean-calculator-side">&ndash;</div><div class="l">Missing side</div></div>
      <div class="stat-card"><div class="v" id="pythagorean-calculator-area">&ndash;</div><div class="l">Area</div></div>
      <div class="stat-card"><div class="v" id="pythagorean-calculator-perim">&ndash;</div><div class="l">Perimeter</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Sides a / b / c</th><td id="pythagorean-calculator-sides">&ndash;</td></tr>
        <tr><th scope="row">Angle opposite a</th><td id="pythagorean-calculator-angA">&ndash;</td></tr>
        <tr><th scope="row">Angle opposite b</th><td id="pythagorean-calculator-angB">&ndash;</td></tr>
      </tbody>
    </table>
  </div>
</div>
