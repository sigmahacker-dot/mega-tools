<div class="tool-card">
  <div class="field">
    <label for="palette-from-image-file">Upload image</label>
    <input type="file" class="input" id="palette-from-image-file" accept="image/*">
  </div>
  <div class="error" id="palette-from-image-error"></div>
  <div class="result" id="palette-from-image-result">
    <div class="field">
      <label>Dominant colors (click to copy)</label>
      <div id="palette-from-image-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;"></div>
    </div>
    <p class="note">Pixels are sampled at ~64px and bucketed into 4-bit color bins; the top 8 bins win.</p>
  </div>
</div>
