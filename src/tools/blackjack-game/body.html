<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="blackjack-game-bank">1000</div><div class="l">Bankroll</div></div>
    <div class="stat-card"><div class="v" id="blackjack-game-bet">0</div><div class="l">Current bet</div></div>
  </div>
  <p class="muted" id="blackjack-game-msg" style="min-height:24px">Choose a bet and press Deal!</p>
  <div style="max-width:440px;margin:0 auto;text-align:left">
    <p style="margin:8px 0 4px"><strong>Dealer</strong> <span class="muted" id="blackjack-game-dval"></span></p>
    <div id="blackjack-game-dealer" style="display:flex;gap:8px;flex-wrap:wrap;min-height:64px"></div>
    <p style="margin:12px 0 4px"><strong>You</strong> <span class="muted" id="blackjack-game-pval"></span></p>
    <div id="blackjack-game-player" style="display:flex;gap:8px;flex-wrap:wrap;min-height:64px"></div>
  </div>
  <div class="grid2" style="max-width:420px;margin:12px auto">
    <div class="field" style="text-align:left">
      <label for="blackjack-game-betsize">Bet size</label>
      <select class="input" id="blackjack-game-betsize">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="blackjack-game-deal" style="width:100%">Deal</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="blackjack-game-hit" disabled>Hit</button>
    <button class="btn" id="blackjack-game-stand" disabled>Stand</button>
    <button class="btn btn-outline" id="blackjack-game-double" disabled>Double ⬆</button>
  </div>
  <div class="error" id="blackjack-game-error"></div>
</div>
