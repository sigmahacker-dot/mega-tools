<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="workout-log-total">0</div><div class="l">Total entries</div></div>
    <div class="stat-card"><div class="v" id="workout-log-vol">0</div><div class="l">Total volume (kg)</div></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="workout-log-date">Date</label>
      <input class="input" type="date" id="workout-log-date">
    </div>
    <div class="field">
      <label for="workout-log-ex">Exercise</label>
      <input class="input" type="text" id="workout-log-ex" placeholder="e.g. Bench Press">
    </div>
    <div class="field">
      <label for="workout-log-sets">Sets</label>
      <input class="input" type="number" id="workout-log-sets" min="1" value="3">
    </div>
    <div class="field">
      <label for="workout-log-reps">Reps</label>
      <input class="input" type="number" id="workout-log-reps" min="1" value="10">
    </div>
    <div class="field">
      <label for="workout-log-weight">Weight (kg)</label>
      <input class="input" type="number" id="workout-log-weight" min="0" step="0.5" value="0">
    </div>
    <div class="field">
      <label for="workout-log-note">Note (optional)</label>
      <input class="input" type="text" id="workout-log-note" placeholder="e.g. felt strong">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="workout-log-add">Log Set</button>
  </div>
  <div class="error" id="workout-log-error"></div>
  <p class="note">For information only — train safely and consider professional guidance for programming.</p>
</div>

<div class="tool-card">
  <h3>History</h3>
  <div id="workout-log-list"></div>
</div>
