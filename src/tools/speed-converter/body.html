<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="speed-converter-ms">Meters per second (m/s)</label>
      <input type="number" step="any" class="input" id="speed-converter-ms" placeholder="0">
    </div>
    <div class="field">
      <label for="speed-converter-kmh">Kilometers per hour (km/h)</label>
      <input type="number" step="any" class="input" id="speed-converter-kmh" placeholder="0">
    </div>
    <div class="field">
      <label for="speed-converter-mph">Miles per hour (mph)</label>
      <input type="number" step="any" class="input" id="speed-converter-mph" placeholder="0">
    </div>
    <div class="field">
      <label for="speed-converter-fts">Feet per second (ft/s)</label>
      <input type="number" step="any" class="input" id="speed-converter-fts" placeholder="0">
    </div>
    <div class="field">
      <label for="speed-converter-knot">Knots (kn)</label>
      <input type="number" step="any" class="input" id="speed-converter-knot" placeholder="0">
    </div>
  </div>
  <div class="error" id="speed-converter-error"></div>
  <p class="note">Type in any field — the other four update instantly. Negative values are fine for headwinds or reverse motion.</p>
</div>
