<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="shoe-us">US size</label><input type="number" class="input" id="shoe-us" min="4" max="18" step="0.5" placeholder="9"></div>
    <div class="field"><label for="shoe-gender">Sizing</label>
      <select class="input" id="shoe-gender"><option value="men">Men's</option><option value="women">Women's</option></select>
    </div>
  </div>
  <div class="error" id="shoe-size-converter-error"></div>
  <div class="result" id="shoe-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="shoe-uk">–</div><div class="l">UK size</div></div>
      <div class="stat-card"><div class="v" id="shoe-eu">–</div><div class="l">EU size</div></div>
      <div class="stat-card"><div class="v" id="shoe-cm">–</div><div class="l">Foot length (cm)</div></div>
    </div>
    <p class="note">Based on standard size charts. Fit varies by brand — when between sizes, size up.</p>
  </div>
</div>
