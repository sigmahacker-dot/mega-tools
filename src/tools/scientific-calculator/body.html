<div class="tool-card">
  <div class="field">
    <label for="scientific-calculator-display">Expression</label>
    <input type="text" class="input" id="scientific-calculator-display" placeholder="e.g. sin(30)+2^3" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="scientific-calculator-mode">DEG</button>
    <button type="button" class="btn btn-outline btn-sm" id="scientific-calculator-back">&#9003;</button>
  </div>
  <div id="scientific-calculator-pad" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0;"></div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="scientific-calculator-equals">= Calculate</button>
  </div>
  <div class="error" id="scientific-calculator-error"></div>
  <div class="result" id="scientific-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="scientific-calculator-value">&ndash;</div><div class="l">Result</div></div>
    </div>
    <div class="field">
      <label>History</label>
      <ul id="scientific-calculator-history" class="muted"></ul>
    </div>
    <p class="note">% is percentage (divides by 100). n! needs a non-negative integer.</p>
  </div>
</div>
