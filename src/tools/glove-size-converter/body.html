<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="glove-size-converter-circ">Hand circumference</label>
      <input type="number" step="any" min="0" class="input" id="glove-size-converter-circ" placeholder="e.g. 9">
    </div>
    <div class="field">
      <label for="glove-size-converter-units">Measured in</label>
      <select class="select" id="glove-size-converter-units">
        <option value="in" selected>Inches</option>
        <option value="cm">Centimetres</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="glove-size-converter-fit">Fit</label>
    <select class="select" id="glove-size-converter-fit">
      <option value="men" selected>Men's</option>
      <option value="women">Women's</option>
    </select>
  </div>
  <div class="error" id="glove-size-converter-error"></div>
  <div class="result" id="glove-size-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="glove-size-converter-letter">–</div><div class="l">Glove size (letter)</div></div>
      <div class="stat-card"><div class="v" id="glove-size-converter-numeric">–</div><div class="l">Glove size (numeric)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Letter</th><th>Inches</th><th>CM</th><th>Fit</th></tr></thead>
      <tbody id="glove-size-converter-table"></tbody>
    </table>
    <p class="note">Measure around the widest part of your hand (knuckles), excluding the thumb. Between sizes: size up for comfort.</p>
  </div>
</div>
