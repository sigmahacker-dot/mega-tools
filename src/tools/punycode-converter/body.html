<div class="tool-card">
  <div class="field">
    <label for="punycode-converter-input">Domain or label</label>
    <input class="input" id="punycode-converter-input" value="münchen.de">
  </div>
  <div class="btn-row">
    <button class="btn" id="punycode-converter-encode">Encode → punycode</button>
    <button class="btn btn-outline" id="punycode-converter-decode">Decode → Unicode</button>
  </div>
  <div class="error" id="punycode-converter-error"></div>
  <div class="field">
    <label for="punycode-converter-output">Result</label>
    <textarea class="textarea" id="punycode-converter-output" rows="3" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="punycode-converter-copy">Copy result</button>
    <button class="btn btn-outline" id="punycode-converter-download">Download .txt</button>
  </div>
  <p class="note" id="punycode-converter-selftest">Self-test: running…</p>
</div>
