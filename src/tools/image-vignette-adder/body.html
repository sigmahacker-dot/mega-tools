<div class="tool-card">
  <div class="dropzone" id="image-vignette-adder-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-vignette-adder-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-vignette-adder-wrap" style="text-align:center">
    <canvas id="image-vignette-adder-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="field">
    <label for="image-vignette-adder-strength">Vignette strength: <span id="image-vignette-adder-strength-val">50</span>%</label>
    <input type="range" id="image-vignette-adder-strength" min="0" max="100" value="50">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-vignette-adder-download">Download PNG</button>
  </div>
  <div class="error" id="image-vignette-adder-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
