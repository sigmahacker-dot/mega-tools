<div class="tool-card">
  <div class="field"><label for="ua-input">User-agent string</label><textarea class="textarea" id="ua-input" rows="3"></textarea></div>
  <div class="error" id="user-agent-parser-error"></div>
  <div class="result" id="ua-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ua-browser">–</div><div class="l">Browser</div></div>
      <div class="stat-card"><div class="v" id="ua-os">–</div><div class="l">OS</div></div>
      <div class="stat-card"><div class="v" id="ua-device">–</div><div class="l">Device</div></div>
    </div>
    <table class="data"><tbody id="ua-body"></tbody></table>
    <div class="btn-row">
      <button class="btn btn-outline" id="ua-reset" type="button">Reset to my UA</button>
      <button class="btn btn-outline" id="ua-copy" type="button">Copy UA string</button>
    </div>
  </div>
</div>
