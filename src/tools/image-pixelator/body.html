<div class="tool-card">
  <h2>Image Pixelator</h2>
  <p class="muted">Pixelate photos with an adjustable block size — great for anonymizing faces or plates.</p>
  <div class="field">
    <label for="image-pixelator-file">Choose an image</label>
    <input type="file" class="input" id="image-pixelator-file" accept="image/*">
  </div>
  <div class="field">
    <label for="image-pixelator-size">Block size: <span id="image-pixelator-size-val">16</span> px</label>
    <input type="range" id="image-pixelator-size" min="4" max="64" value="16">
  </div>
  <div class="error" id="image-pixelator-error"></div>
  <div class="result" id="image-pixelator-result">
    <div class="field">
      <label>Pixelated preview</label>
      <canvas class="preview" id="image-pixelator-canvas" style="max-width:100%;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="image-pixelator-download">Download PNG</button>
      <button class="btn btn-outline" id="image-pixelator-clear">Clear</button>
    </div>
    <p class="note" id="image-pixelator-dims"></p>
  </div>
</div>
