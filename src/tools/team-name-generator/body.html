<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="tname-style">Style</label>
      <select class="select" id="tname-style">
        <option value="funny">Funny</option>
        <option value="pro">Professional</option>
        <option value="punny">Punny</option>
        <option value="animal">Animal</option>
        <option value="fantasy">Fantasy</option>
        <option value="tech">Tech</option>
      </select>
    </div>
    <div class="field"><label for="tname-kw">Keyword <span class="hint">(optional)</span></label><input type="text" class="input" id="tname-kw" placeholder="Thunder"></div>
  </div>
  <div class="error" id="team-name-generator-error"></div>
  <div class="result" id="tname-result">
    <div id="tname-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="tname-go" type="button">Generate names</button>
    </div>
    <p class="note">Click any name to copy it.</p>
  </div>
</div>
