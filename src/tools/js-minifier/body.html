<div class="tool-card">
  <div class="field">
    <label for="js-minifier-input">JavaScript input</label>
    <textarea class="textarea code" id="js-minifier-input" rows="10" placeholder="Paste your JavaScript here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="js-minifier-minify" type="button">Minify JS</button>
    <button class="btn btn-outline" id="js-minifier-clear" type="button">Clear</button>
  </div>
  <div class="error" id="js-minifier-error"></div>
  <div class="stat-cards hidden mt" id="js-minifier-stats">
    <div class="stat-card"><div class="v" id="js-minifier-orig">0 B</div><div class="l">Original</div></div>
    <div class="stat-card"><div class="v" id="js-minifier-min">0 B</div><div class="l">Minified</div></div>
    <div class="stat-card"><div class="v" id="js-minifier-saved">0%</div><div class="l">Saved</div></div>
  </div>
  <div class="result hidden" id="js-minifier-result">
    <pre id="js-minifier-output"></pre>
    <div class="btn-row mt">
      <button class="btn btn-sm" id="js-minifier-copy" type="button">Copy</button>
      <button class="btn btn-sm btn-outline" id="js-minifier-download" type="button">Download .min.js</button>
    </div>
  </div>
  <p class="note">Minified with the real Terser engine (compress + mangle) in your browser. Only the Terser library loads from a CDN; your code is never sent anywhere.</p>
</div>
