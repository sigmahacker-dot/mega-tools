<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="vector-calculator-dim">Dimension</label>
      <select class="select" id="vector-calculator-dim">
        <option value="2">2D (x, y)</option>
        <option value="3" selected>3D (x, y, z)</option>
      </select>
    </div>
    <div class="field">
      <label for="vector-calculator-op">Operation</label>
      <select class="select" id="vector-calculator-op">
        <option value="add">v + w (add)</option>
        <option value="sub">v − w (subtract)</option>
        <option value="dot" selected>v · w (dot product)</option>
        <option value="cross">v × w (cross product)</option>
        <option value="angle">Angle between v and w</option>
        <option value="mag">Magnitudes |v| and |w|</option>
      </select>
    </div>
    <div class="field">
      <label for="vector-calculator-x1">v — x</label>
      <input type="number" class="input" id="vector-calculator-x1" step="any" placeholder="e.g. 3">
    </div>
    <div class="field">
      <label for="vector-calculator-y1">v — y</label>
      <input type="number" class="input" id="vector-calculator-y1" step="any" placeholder="e.g. -2">
    </div>
    <div class="field" id="vector-calculator-z1w">
      <label for="vector-calculator-z1">v — z</label>
      <input type="number" class="input" id="vector-calculator-z1" step="any" placeholder="e.g. 5">
    </div>
    <div class="field">
      <label for="vector-calculator-x2">w — x</label>
      <input type="number" class="input" id="vector-calculator-x2" step="any" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="vector-calculator-y2">w — y</label>
      <input type="number" class="input" id="vector-calculator-y2" step="any" placeholder="e.g. 4">
    </div>
    <div class="field" id="vector-calculator-z2w">
      <label for="vector-calculator-z2">w — z</label>
      <input type="number" class="input" id="vector-calculator-z2" step="any" placeholder="e.g. -1">
    </div>
  </div>
  <div class="error" id="vector-calculator-error"></div>
  <div class="result" id="vector-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="vector-calculator-res">–</div><div class="l" id="vector-calculator-reslab">Result</div></div>
      <div class="stat-card"><div class="v" id="vector-calculator-m1">–</div><div class="l">|v|</div></div>
      <div class="stat-card"><div class="v" id="vector-calculator-m2">–</div><div class="l">|w|</div></div>
    </div>
    <p class="note" id="vector-calculator-steps">Enter both vectors to calculate.</p>
  </div>
</div>
