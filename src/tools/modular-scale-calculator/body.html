<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="modular-scale-calculator-base">Base size (px)</label>
      <input type="number" class="input" id="modular-scale-calculator-base" value="16" min="1" step="any">
    </div>
    <div class="field">
      <label for="modular-scale-calculator-ratio">Ratio</label>
      <select class="select" id="modular-scale-calculator-ratio">
        <option value="1.067">1.067 — Minor second</option>
        <option value="1.125">1.125 — Major second</option>
        <option value="1.2">1.200 — Minor third</option>
        <option value="1.25" selected>1.250 — Major third</option>
        <option value="1.333">1.333 — Perfect fourth</option>
        <option value="1.414">1.414 — Augmented fourth</option>
        <option value="1.5">1.500 — Perfect fifth</option>
        <option value="1.618">1.618 — Golden ratio</option>
      </select>
    </div>
  </div>
  <div class="error" id="modular-scale-calculator-error"></div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Step</th><th>Size</th><th>Preview</th><th></th></tr></thead>
      <tbody id="modular-scale-calculator-body"></tbody>
    </table>
  </div>
</div>
