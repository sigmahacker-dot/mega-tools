<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="concert-ticket-maker-event">Event name</label>
      <input type="text" id="concert-ticket-maker-event" class="input" value="SUMMER SOUND FEST" maxlength="40">
    </div>
    <div class="field">
      <label for="concert-ticket-maker-artist">Artist / headliner</label>
      <input type="text" id="concert-ticket-maker-artist" class="input" value="The Midnight Echoes" maxlength="40">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="concert-ticket-maker-venue">Venue</label>
      <input type="text" id="concert-ticket-maker-venue" class="input" value="Grand Arena" maxlength="30">
    </div>
    <div class="field">
      <label for="concert-ticket-maker-date">Date</label>
      <input type="text" id="concert-ticket-maker-date" class="input" value="SAT · AUG 15 · 8 PM" maxlength="30">
    </div>
    <div class="field">
      <label for="concert-ticket-maker-seat">Seat</label>
      <input type="text" id="concert-ticket-maker-seat" class="input" value="A-23" maxlength="12">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="concert-ticket-maker-price">Price</label>
      <input type="text" id="concert-ticket-maker-price" class="input" value="$49.99" maxlength="12">
    </div>
    <div class="field">
      <label for="concert-ticket-maker-color">Accent color</label>
      <input type="color" id="concert-ticket-maker-color" class="input" value="#e11d48" style="height:42px;padding:4px;">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="concert-ticket-maker-download">Download ticket</button>
  </div>
  <div class="result">
    <canvas id="concert-ticket-maker-canvas" style="width:100%;border-radius:10px;"></canvas>
  </div>
  <div class="error" id="concert-ticket-maker-error"></div>
  <p class="note">Novelty use only — this is a design mockup, not a real admission ticket. The barcode strip is decorative.</p>
</div>
