<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="ppi-diag">Diagonal size (inches)</label><input type="number" class="input" id="ppi-diag" min="0" step="any" placeholder="6.1"></div>
    <div class="field"><label for="ppi-w">Resolution width (px)</label><input type="number" class="input" id="ppi-w" min="1" step="1" placeholder="1170"></div>
    <div class="field"><label for="ppi-h">Resolution height (px)</label><input type="number" class="input" id="ppi-h" min="1" step="1" placeholder="2532"></div>
  </div>
  <div class="error" id="screen-ppi-calculator-error"></div>
  <div class="result" id="ppi-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ppi-value">–</div><div class="l">Pixels per inch</div></div>
      <div class="stat-card"><div class="v" id="ppi-mp">–</div><div class="l">Megapixels</div></div>
      <div class="stat-card"><div class="v" id="ppi-ratio">–</div><div class="l">Aspect ratio</div></div>
    </div>
    <p class="note">PPI = √(w² + h²) ÷ diagonal inches.</p>
  </div>
</div>
