<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="wedding-hashtag-generator-n1">Partner 1 name</label>
      <input class="input" id="wedding-hashtag-generator-n1" type="text" placeholder="e.g. Emma" maxlength="30">
    </div>
    <div class="field">
      <label for="wedding-hashtag-generator-n2">Partner 2 name</label>
      <input class="input" id="wedding-hashtag-generator-n2" type="text" placeholder="e.g. James" maxlength="30">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="wedding-hashtag-generator-date">Wedding date (optional)</label>
      <input class="input" id="wedding-hashtag-generator-date" type="date">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="wedding-hashtag-generator-go" type="button">Generate Hashtags</button>
      </div>
    </div>
  </div>
  <div class="error" id="wedding-hashtag-generator-error"></div>
  <div class="mt" id="wedding-hashtag-generator-list"></div>
</div>
