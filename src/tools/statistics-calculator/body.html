<div class="tool-card">
  <div class="field">
    <label for="statistics-calculator-input">Numbers (comma, space or newline separated)</label>
    <textarea class="textarea" id="statistics-calculator-input" rows="5" placeholder="e.g. 4, 8, 15, 16, 23, 42"></textarea>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="statistics-calculator-go">Calculate</button>
  </div>
  <div class="error" id="statistics-calculator-error"></div>
  <div class="result" id="statistics-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="statistics-calculator-n">&ndash;</div><div class="l">Count (n)</div></div>
      <div class="stat-card"><div class="v" id="statistics-calculator-mean">&ndash;</div><div class="l">Mean</div></div>
      <div class="stat-card"><div class="v" id="statistics-calculator-median">&ndash;</div><div class="l">Median</div></div>
      <div class="stat-card"><div class="v" id="statistics-calculator-stddev">&ndash;</div><div class="l">Std dev (pop.)</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Sum</th><td id="statistics-calculator-sum">&ndash;</td></tr>
        <tr><th scope="row">Min / Max</th><td id="statistics-calculator-minmax">&ndash;</td></tr>
        <tr><th scope="row">Range</th><td id="statistics-calculator-range">&ndash;</td></tr>
        <tr><th scope="row">Mode(s)</th><td id="statistics-calculator-mode">&ndash;</td></tr>
        <tr><th scope="row">Variance (population)</th><td id="statistics-calculator-varp">&ndash;</td></tr>
        <tr><th scope="row">Variance (sample)</th><td id="statistics-calculator-vars">&ndash;</td></tr>
        <tr><th scope="row">Std dev (sample)</th><td id="statistics-calculator-stddevs">&ndash;</td></tr>
        <tr><th scope="row">Q1 / Q3</th><td id="statistics-calculator-q">&ndash;</td></tr>
        <tr><th scope="row">IQR</th><td id="statistics-calculator-iqr">&ndash;</td></tr>
      </tbody>
    </table>
    <p class="note">Quartiles use linear interpolation (type-7 method).</p>
  </div>
</div>
