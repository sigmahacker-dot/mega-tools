<div class="tool-card">
  <div class="dropzone" id="image-posterize-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-posterize-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-posterize-wrap" style="text-align:center">
    <canvas id="image-posterize-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="field">
    <label for="image-posterize-levels">Color levels: <span id="image-posterize-levels-val">4</span></label>
    <input type="range" id="image-posterize-levels" min="2" max="8" value="4">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-posterize-download">Download PNG</button>
  </div>
  <div class="error" id="image-posterize-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
