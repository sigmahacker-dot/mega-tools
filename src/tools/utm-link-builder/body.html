<div class="tool-card">
  <h2>UTM Link Builder</h2>
  <p class="muted">Campaign-tagged URLs in seconds — validated and correctly encoded.</p>
  <div class="field">
    <label for="utm-link-builder-url">Base URL</label>
    <input type="text" class="input" id="utm-link-builder-url" placeholder="https://example.com/landing-page">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="utm-link-builder-source">utm_source *</label>
      <input type="text" class="input" id="utm-link-builder-source" placeholder="e.g. newsletter">
    </div>
    <div class="field">
      <label for="utm-link-builder-medium">utm_medium *</label>
      <input type="text" class="input" id="utm-link-builder-medium" placeholder="e.g. email">
    </div>
  </div>
  <div class="field">
    <label for="utm-link-builder-campaign">utm_campaign *</label>
    <input type="text" class="input" id="utm-link-builder-campaign" placeholder="e.g. summer_sale">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="utm-link-builder-term">utm_term (optional)</label>
      <input type="text" class="input" id="utm-link-builder-term" placeholder="e.g. running+shoes">
    </div>
    <div class="field">
      <label for="utm-link-builder-content">utm_content (optional)</label>
      <input type="text" class="input" id="utm-link-builder-content" placeholder="e.g. banner_ad">
    </div>
  </div>
  <div class="error" id="utm-link-builder-error"></div>
  <div class="result" id="utm-link-builder-result">
    <div class="field">
      <label for="utm-link-builder-output">Tagged URL</label>
      <textarea class="textarea" id="utm-link-builder-output" rows="3" readonly placeholder="Your campaign URL will appear here..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="utm-link-builder-copy">Copy URL</button>
      <a class="btn btn-outline" id="utm-link-builder-open" href="#" target="_blank" rel="noopener">Open link</a>
    </div>
  </div>
</div>
