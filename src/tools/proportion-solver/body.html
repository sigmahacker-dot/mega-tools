<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="proportion-solver-unknown">Unknown value (x)</label>
      <select class="select" id="proportion-solver-unknown">
        <option value="a">a is unknown</option>
        <option value="b">b is unknown</option>
        <option value="c">c is unknown</option>
        <option value="d" selected>d is unknown</option>
      </select>
    </div>
    <div class="field">
      <label for="proportion-solver-a">a</label>
      <input type="number" class="input" id="proportion-solver-a" step="any" placeholder="e.g. 3">
    </div>
    <div class="field">
      <label for="proportion-solver-b">b</label>
      <input type="number" class="input" id="proportion-solver-b" step="any" placeholder="e.g. 4">
    </div>
    <div class="field">
      <label for="proportion-solver-c">c</label>
      <input type="number" class="input" id="proportion-solver-c" step="any" placeholder="e.g. 9">
    </div>
    <div class="field">
      <label for="proportion-solver-d">d</label>
      <input type="number" class="input" id="proportion-solver-d" step="any" placeholder="leave empty if unknown">
    </div>
  </div>
  <div class="error" id="proportion-solver-error"></div>
  <div class="result" id="proportion-solver-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="proportion-solver-x">–</div><div class="l">Value of x</div></div>
      <div class="stat-card"><div class="v" id="proportion-solver-check">–</div><div class="l">Check: a/b</div></div>
      <div class="stat-card"><div class="v" id="proportion-solver-check2">–</div><div class="l">Check: c/d</div></div>
    </div>
    <p class="note" id="proportion-solver-steps">Choose the unknown and enter the other three values.</p>
  </div>
</div>
