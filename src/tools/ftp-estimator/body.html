<div class="tool-card">
  <div class="field">
    <label for="ftp-estimator-power">20-minute average power (watts)</label>
    <input type="number" class="input" id="ftp-estimator-power" min="0" step="any" placeholder="250">
  </div>
  <div class="error" id="ftp-estimator-error"></div>
  <div class="result" id="ftp-estimator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ftp-estimator-ftp">&ndash;</div><div class="l">Estimated FTP (W)</div></div>
      <div class="stat-card"><div class="v" id="ftp-estimator-wkg">&ndash;</div><div class="l">W/kg (enter weight below)</div></div>
    </div>
    <div class="field" style="max-width:240px">
      <label for="ftp-estimator-weight">Your weight (kg, optional)</label>
      <input type="number" class="input" id="ftp-estimator-weight" min="0" step="any" placeholder="75">
    </div>
    <div id="ftp-estimator-out"></div>
    <p class="note">For information only &mdash; not medical advice.</p>
  </div>
</div>
