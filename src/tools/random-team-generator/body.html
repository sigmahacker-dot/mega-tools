<div class="tool-card">
  <div class="field"><label for="rteam-names">Names <span class="hint">(one per line)</span></label><textarea class="textarea" id="rteam-names" rows="6" placeholder="Ayesha&#10;Bilal&#10;Chen&#10;Diana&#10;..."></textarea></div>
  <div class="grid2">
    <div class="field"><label for="rteam-mode">Split by</label>
      <select class="select" id="rteam-mode"><option value="count">Number of teams</option><option value="size">Team size</option></select>
    </div>
    <div class="field"><label for="rteam-n">Number</label><input type="number" class="input" id="rteam-n" min="2" max="50" value="2"></div>
  </div>
  <div class="error" id="random-team-generator-error"></div>
  <div class="result" id="rteam-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="rteam-players">–</div><div class="l">Players</div></div>
      <div class="stat-card"><div class="v" id="rteam-teams">–</div><div class="l">Teams</div></div>
    </div>
    <div id="rteam-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="rteam-go" type="button">Shuffle teams</button>
      <button class="btn btn-outline" id="rteam-copy" type="button">Copy result</button>
    </div>
  </div>
</div>
