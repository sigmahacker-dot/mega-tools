<div class="tool-card">
  <div class="error" id="screen-resolution-checker-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="screen-resolution-checker-screen">–</div><div class="l">Screen resolution</div></div>
    <div class="stat-card"><div class="v" id="screen-resolution-checker-viewport">–</div><div class="l">Viewport (live)</div></div>
    <div class="stat-card"><div class="v" id="screen-resolution-checker-dpr">–</div><div class="l">Pixel ratio</div></div>
    <div class="stat-card"><div class="v" id="screen-resolution-checker-depth">–</div><div class="l">Color depth</div></div>
    <div class="stat-card"><div class="v" id="screen-resolution-checker-orient">–</div><div class="l">Orientation</div></div>
  </div>
  <div class="btn-row mt">
    <button type="button" class="btn btn-outline" id="screen-resolution-checker-refresh">Refresh</button>
  </div>
  <p class="muted">Detected automatically on load. Resize the window or rotate your device to watch the viewport and orientation update live.</p>
</div>
