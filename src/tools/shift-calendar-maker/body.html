<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="shift-calendar-maker-pattern">Rotation pattern (D/N/O)</label>
      <input class="input" id="shift-calendar-maker-pattern" type="text" value="DDNNOOOO" style="font-family:monospace;text-transform:uppercase">
    </div>
    <div class="field">
      <label for="shift-calendar-maker-month">Month</label>
      <input class="input" id="shift-calendar-maker-month" type="month">
    </div>
    <div class="field">
      <label for="shift-calendar-maker-start">Cycle day-1 date</label>
      <input class="input" id="shift-calendar-maker-start" type="date">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="shift-calendar-maker-gen">Generate</button>
    <button type="button" class="btn btn-outline" id="shift-calendar-maker-print">Print</button>
  </div>
  <div class="error" id="shift-calendar-maker-error"></div>
  <div id="shift-calendar-maker-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="shift-calendar-maker-c-days">–</div><div class="l">Day shifts</div></div>
      <div class="stat-card"><div class="v" id="shift-calendar-maker-c-nights">–</div><div class="l">Night shifts</div></div>
      <div class="stat-card"><div class="v" id="shift-calendar-maker-c-off">–</div><div class="l">Days off</div></div>
    </div>
    <div id="shift-calendar-maker-cal" style="overflow-x:auto"></div>
    <p class="muted"><span style="color:#4ade80">■</span> Day &nbsp;<span style="color:#60a5fa">■</span> Night &nbsp;<span style="color:#94a3b8">■</span> Off</p>
  </div>
</div>
