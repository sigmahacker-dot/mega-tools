<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ovu-last">First day of last period</label>
      <input type="date" class="input" id="ovu-last">
    </div>
    <div class="field">
      <label for="ovu-cycle">Cycle length (days)</label>
      <input type="number" class="input" id="ovu-cycle" min="21" max="35" step="1" placeholder="28">
    </div>
  </div>
  <div class="error" id="ovulation-calculator-error"></div>
  <div class="result" id="ovu-result">
    <table class="data">
      <tbody>
        <tr><th scope="row">Fertile window</th><td id="ovu-fertile">–</td></tr>
        <tr><th scope="row">Estimated ovulation day</th><td id="ovu-ovulation">–</td></tr>
        <tr><th scope="row">Next period (predicted)</th><td id="ovu-next">–</td></tr>
      </tbody>
    </table>
    <p class="note">Estimate only — not for contraception and not a fertility diagnosis. Talk to a doctor for medical guidance.</p>
  </div>
</div>
