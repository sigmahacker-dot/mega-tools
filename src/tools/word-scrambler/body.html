<div class="tool-card">
  <div class="field">
    <label for="word-scrambler-input">Your text</label>
    <textarea class="textarea" id="word-scrambler-input" rows="6" placeholder="Paste text to scramble"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="word-scrambler-run">Scramble</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="word-scrambler-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="word-scrambler-copy">Copy output</button></div>
  </div>
  <p class="hint">Interior letters are jumbled; first and last letters stay put.</p>
  <div class="error" id="word-scrambler-error"></div>
</div>
