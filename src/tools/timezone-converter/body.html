<div class="tool-card">
  <div class="field">
    <label for="timezone-datetime">Date and time</label>
    <input type="datetime-local" class="input" id="timezone-datetime">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="timezone-from">From time zone</label>
      <select class="select" id="timezone-from"></select>
    </div>
    <div class="field">
      <label for="timezone-to">To time zone</label>
      <select class="select" id="timezone-to"></select>
    </div>
  </div>
  <div class="error" id="timezone-converter-error"></div>
  <div class="result" id="timezone-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="timezone-output">–</div><div class="l">Converted time</div></div>
    </div>
    <p class="muted" id="timezone-detail"></p>
  </div>
  <div class="mt">
    <h3 class="center">Current time around the world</h3>
    <table class="data">
      <thead><tr><th>Time zone</th><th>Local time</th></tr></thead>
      <tbody id="timezone-live"></tbody>
    </table>
  </div>
</div>
