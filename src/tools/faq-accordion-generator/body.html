<div class="tool-card">
  <div class="field">
    <label for="faq-accordion-generator-faqs">FAQs (question line, answer lines, blank line between)</label>
    <textarea class="textarea" id="faq-accordion-generator-faqs" rows="7">What is your refund policy?
We offer a 30-day money-back guarantee on all plans, no questions asked.

How do I cancel my subscription?
Go to Settings → Billing → Cancel. You keep access until the end of the billing period.

Do you offer discounts for teams?
Yes — teams of 5 or more get 20% off annual plans. Contact sales for a quote.</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="faq-accordion-generator-accent">Accent color</label>
      <input class="input" id="faq-accordion-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="faq-accordion-generator-theme">Theme</label>
      <select class="select" id="faq-accordion-generator-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="field">
      <label for="faq-accordion-generator-icon">Icon style</label>
      <select class="select" id="faq-accordion-generator-icon">
        <option value="plus">Plus / minus</option>
        <option value="chevron">Chevron</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Live preview (clickable)</label>
    <div id="faq-accordion-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:20px;background:#18181b"></div>
  </div>
  <div class="error" id="faq-accordion-generator-error"></div>
  <div class="field">
    <label for="faq-accordion-generator-output">HTML + CSS + JS</label>
    <textarea class="textarea" id="faq-accordion-generator-output" rows="16" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="faq-accordion-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="faq-accordion-generator-download">Download faq.html</button>
  </div>
</div>
