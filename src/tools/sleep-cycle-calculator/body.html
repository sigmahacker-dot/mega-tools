<div class="tool-card">
  <div class="field">
    <label for="sleep-mode">Mode</label>
    <select class="select" id="sleep-mode">
      <option value="wake">I want to wake up at…</option>
      <option value="sleepnow">I am going to sleep now</option>
    </select>
  </div>
  <div class="field" id="sleep-wake-wrap">
    <label for="sleep-waketime">Wake-up time</label>
    <input type="time" class="input" id="sleep-waketime" value="07:00">
  </div>
  <div class="error" id="sleep-cycle-calculator-error"></div>
  <div class="result" id="sleep-result">
    <table class="data">
      <thead><tr><th>Cycles</th><th id="sleep-col-label">Go to bed at</th></tr></thead>
      <tbody id="sleep-table-body">
        <tr><td colspan="2" class="muted">Set your wake-up time to see bedtime options.</td></tr>
      </tbody>
    </table>
    <p class="note">Based on average 90-minute cycles plus ~15 minutes to fall asleep. Real cycles vary — this is guidance, not precision.</p>
  </div>
</div>
