<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="school-timetable-maker-days">Days per week</label>
      <input class="input" id="school-timetable-maker-days" type="number" min="1" max="7" value="5">
    </div>
    <div class="field">
      <label for="school-timetable-maker-periods">Periods per day</label>
      <input class="input" id="school-timetable-maker-periods" type="number" min="1" max="12" value="6">
    </div>
    <div class="field" style="align-self:end">
      <div class="btn-row">
        <button type="button" class="btn" id="school-timetable-maker-build">Build grid</button>
        <button type="button" class="btn btn-outline" id="school-timetable-maker-print">Print</button>
      </div>
    </div>
  </div>
  <div class="error" id="school-timetable-maker-error"></div>
  <div id="school-timetable-maker-wrap" style="overflow-x:auto;margin-top:12px"></div>
  <p class="muted">Auto-saves as you type. Day names default to Mon–Sun.</p>
</div>
