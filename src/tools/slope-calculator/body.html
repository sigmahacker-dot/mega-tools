<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 12px;text-align:left">
    <div class="field"><label for="slope-calculator-x1">x\u2081</label><input class="input" id="slope-calculator-x1" type="number" value="1" step="any"></div>
    <div class="field"><label for="slope-calculator-y1">y\u2081</label><input class="input" id="slope-calculator-y1" type="number" value="2" step="any"></div>
    <div class="field"><label for="slope-calculator-x2">x\u2082</label><input class="input" id="slope-calculator-x2" type="number" value="5" step="any"></div>
    <div class="field"><label for="slope-calculator-y2">y\u2082</label><input class="input" id="slope-calculator-y2" type="number" value="8" step="any"></div>
  </div>
  <div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="slope-calculator-go">Calculate</button></div>
  <div class="stat-cards" style="max-width:560px;margin:12px auto">
    <div class="stat-card"><div class="v" id="slope-calculator-m">1.5</div><div class="l">Slope (m)</div></div>
    <div class="stat-card"><div class="v" id="slope-calculator-b">0.5</div><div class="l">Y-intercept (b)</div></div>
  </div>
  <p class="muted" id="slope-calculator-eq" style="font-family:monospace;font-size:1.1rem">y = 1.5x + 0.5</p>
  <svg id="slope-calculator-svg" width="320" height="240" viewBox="0 0 320 240" style="max-width:100%;background:#fff;border:1px solid #ddd;border-radius:8px" role="img" aria-label="Line graph"></svg>
  <div class="result" style="max-width:560px;margin:12px auto 0"><pre class="code" id="slope-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="slope-calculator-error"></div>
</div>
