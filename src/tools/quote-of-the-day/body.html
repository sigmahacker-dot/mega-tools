<div class="tool-card">
  <div class="field">
    <label for="quote-of-the-day-today">Today's quote</label>
    <div class="result" id="quote-of-the-day-today"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="quote-of-the-day-shuffle" type="button">Shuffle</button>
    <button class="btn btn-outline" id="quote-of-the-day-more" type="button">Show 10</button>
  </div>
  <div class="error" id="quote-of-the-day-error"></div>
  <div class="mt" id="quote-of-the-day-list"></div>
</div>
