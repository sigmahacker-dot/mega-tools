<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="trig-calculator-ang">Angle</label><input class="input" id="trig-calculator-ang" type="number" value="30"></div>
    <div class="field"><label for="trig-calculator-unit">Unit</label><select class="input" id="trig-calculator-unit"><option value="deg">Degrees</option><option value="rad">Radians</option></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="trig-calculator-go">Calculate</button></div>
  <div class="result"><div class="data" id="trig-calculator-table"></div></div>
  <h3 style="margin-top:16px">Inverse trig (from a value)</h3>
  <div class="grid2">
    <div class="field"><label for="trig-calculator-val">Value (\u22121 to 1 for sin/cos)</label><input class="input" id="trig-calculator-val" type="number" value="0.5" step="any"></div>
    <div class="field"><label for="trig-calculator-ifn">Function</label><select class="input" id="trig-calculator-ifn"><option value="asin">arcsin</option><option value="acos">arccos</option><option value="atan">arctan</option></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-outline" id="trig-calculator-goinv">Compute inverse</button></div>
  <div class="result"><pre class="code" id="trig-calculator-invout" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="trig-calculator-error"></div>
</div>
