<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="reading-list-manager-title">Title</label>
      <input class="input" type="text" id="reading-list-manager-title" placeholder="Book title">
    </div>
    <div class="field">
      <label for="reading-list-manager-author">Author (optional)</label>
      <input class="input" type="text" id="reading-list-manager-author" placeholder="Author">
    </div>
    <div class="field">
      <label for="reading-list-manager-status">Status</label>
      <select class="select" id="reading-list-manager-status">
        <option value="toread">To Read</option>
        <option value="reading">Reading</option>
        <option value="finished">Finished</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="reading-list-manager-add">Add Book</button>
  </div>
  <div class="error" id="reading-list-manager-error"></div>
</div>

<div class="tool-card">
  <div class="grid3">
    <div><h3>📚 To Read <span class="muted" id="reading-list-manager-c1"></span></h3><div id="reading-list-manager-l1"></div></div>
    <div><h3>📖 Reading <span class="muted" id="reading-list-manager-c2"></span></h3><div id="reading-list-manager-l2"></div></div>
    <div><h3>✅ Finished <span class="muted" id="reading-list-manager-c3"></span></h3><div id="reading-list-manager-l3"></div></div>
  </div>
</div>
