<div class="tool-card">
  <div class="field">
    <label for="case-converter-input">Your text</label>
    <textarea class="textarea" id="case-converter-input" rows="8" placeholder="Type or paste your text here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary btn-sm" id="case-converter-upper" type="button">UPPERCASE</button>
    <button class="btn btn-primary btn-sm" id="case-converter-lower" type="button">lowercase</button>
    <button class="btn btn-primary btn-sm" id="case-converter-title" type="button">Title Case</button>
    <button class="btn btn-primary btn-sm" id="case-converter-sentence" type="button">Sentence case</button>
    <button class="btn btn-primary btn-sm" id="case-converter-alt" type="button">aLtErNaTiNg cAsE</button>
    <button class="btn btn-primary btn-sm" id="case-converter-inv" type="button">iNVERSE cAsE</button>
  </div>
  <div class="error" id="case-converter-error"></div>
  <div class="field mt">
    <label>Result</label>
    <div class="result" id="case-converter-output">Your converted text will appear here...</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="case-converter-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="case-converter-download" type="button">Download .txt</button>
    <button class="btn btn-outline btn-sm" id="case-converter-clear" type="button">Clear</button>
  </div>
</div>
