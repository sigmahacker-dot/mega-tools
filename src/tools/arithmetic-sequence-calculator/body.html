<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="arithmetic-sequence-calculator-a1">First term (a\u2081)</label><input class="input" id="arithmetic-sequence-calculator-a1" type="number" value="3" step="any"></div>
    <div class="field"><label for="arithmetic-sequence-calculator-d">Common difference (d)</label><input class="input" id="arithmetic-sequence-calculator-d" type="number" value="4" step="any"></div>
    <div class="field"><label for="arithmetic-sequence-calculator-n">Term number (n)</label><input class="input" id="arithmetic-sequence-calculator-n" type="number" value="10" min="1" step="1"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="arithmetic-sequence-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="arithmetic-sequence-calculator-an">39</div><div class="l">nth term</div></div>
    <div class="stat-card"><div class="v" id="arithmetic-sequence-calculator-sn">210</div><div class="l">Sum of first n</div></div>
  </div>
  <div class="result"><pre class="code" id="arithmetic-sequence-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="arithmetic-sequence-calculator-error"></div>
</div>
