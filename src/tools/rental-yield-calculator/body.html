<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="rental-yield-calculator-price">Purchase price ($)</label><input class="input" id="rental-yield-calculator-price" type="number" min="0" step="any" value="250000"></div>
    <div class="field"><label for="rental-yield-calculator-rent">Monthly rent ($)</label><input class="input" id="rental-yield-calculator-rent" type="number" min="0" step="any" value="1800"></div>
    <div class="field"><label for="rental-yield-calculator-expenses">Annual expenses ($)</label><input class="input" id="rental-yield-calculator-expenses" type="number" min="0" step="any" value="6000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="rental-yield-calculator-calc">Calculate</button></div>
  <div class="error" id="rental-yield-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="rental-yield-calculator-gross">—</div><div class="l">Gross yield</div></div>
    <div class="stat-card"><div class="v" id="rental-yield-calculator-net">—</div><div class="l">Net yield</div></div>
    <div class="stat-card"><div class="v" id="rental-yield-calculator-income">—</div><div class="l">Annual net income</div></div>
    <div class="stat-card"><div class="v" id="rental-yield-calculator-monthly">—</div><div class="l">Monthly net income</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
