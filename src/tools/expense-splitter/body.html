<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="expense-splitter-payer">Paid by</label>
      <input class="input" type="text" id="expense-splitter-payer" placeholder="e.g. Ali">
    </div>
    <div class="field">
      <label for="expense-splitter-amount">Amount</label>
      <input class="input" type="number" id="expense-splitter-amount" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="field">
      <label for="expense-splitter-for">Shared by (comma-separated)</label>
      <input class="input" type="text" id="expense-splitter-for" placeholder="Ali, Sara, Omar">
    </div>
  </div>
  <div class="field">
    <label for="expense-splitter-desc">Description (optional)</label>
    <input class="input" type="text" id="expense-splitter-desc" placeholder="Dinner at…">
  </div>
  <div class="btn-row">
    <button class="btn" id="expense-splitter-add">Add Expense</button>
    <button class="btn btn-outline" id="expense-splitter-clear">Clear All</button>
  </div>
  <div class="error" id="expense-splitter-error"></div>
</div>

<div class="tool-card">
  <h3>Expenses</h3>
  <div id="expense-splitter-list"></div>
  <div class="btn-row">
    <button class="btn" id="expense-splitter-calc">Calculate Settle-Up</button>
  </div>
  <div class="result" id="expense-splitter-result" style="margin-top:12px"></div>
</div>
