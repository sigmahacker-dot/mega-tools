<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:560px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="pig-dice-game-youtotal">0</div><div class="l">Your total</div></div>
    <div class="stat-card"><div class="v" id="pig-dice-game-cputotal">0</div><div class="l">CPU total</div></div>
    <div class="stat-card"><div class="v" id="pig-dice-game-turntotal">0</div><div class="l">Turn total</div></div>
  </div>
  <div id="pig-dice-game-die" style="font-size:84px;margin:8px 0;min-height:100px">🎲</div>
  <p class="muted" id="pig-dice-game-msg" style="min-height:24px">Your turn — Roll or Hold! First to 100 wins.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="pig-dice-game-roll" style="font-size:17px">🎲 Roll</button>
    <button class="btn" id="pig-dice-game-hold" style="font-size:17px">✋ Hold</button>
    <button class="btn btn-outline" id="pig-dice-game-new">↻ New game</button>
  </div>
  <div id="pig-dice-game-log" class="note" style="max-width:480px;margin:12px auto 0;text-align:left;max-height:110px;overflow:auto"></div>
  <div class="error" id="pig-dice-game-error"></div>
</div>
