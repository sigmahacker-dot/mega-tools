<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="home-maintenance-calendar-start">Start month</label>
      <input class="input" id="home-maintenance-calendar-start" type="month">
    </div>
    <div class="field">
      <label>Extras</label>
      <div class="checkbox-row"><input type="checkbox" id="home-maintenance-calendar-pool"> <label for="home-maintenance-calendar-pool">Swimming pool</label></div>
      <div class="checkbox-row"><input type="checkbox" id="home-maintenance-calendar-fire"> <label for="home-maintenance-calendar-fire">Fireplace / chimney</label></div>
      <div class="checkbox-row"><input type="checkbox" id="home-maintenance-calendar-garden"> <label for="home-maintenance-calendar-garden">Garden / lawn</label></div>
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="home-maintenance-calendar-gen">Generate calendar</button>
    </div>
  </div>
  <div class="error" id="home-maintenance-calendar-error"></div>
  <div id="home-maintenance-calendar-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="home-maintenance-calendar-done">–</div><div class="l">Tasks done</div></div>
      <div class="stat-card"><div class="v" id="home-maintenance-calendar-total">–</div><div class="l">Total tasks</div></div>
    </div>
    <div id="home-maintenance-calendar-months"></div>
  </div>
  <p class="note">Ordered for northern-hemisphere seasons — southern-hemisphere users can read the schedule shifted by 6 months.</p>
</div>
