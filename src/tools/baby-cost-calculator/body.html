<div class="tool-card">
  <div class="field">
    <label>First-year cost items</label>
    <div id="baby-cost-calculator-items"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="baby-cost-calculator-add" type="button">+ Add item</button>
    </div>
    <p class="muted">Monthly items are multiplied by 12; one-time items are added once.</p>
  </div>
  <div class="error" id="baby-cost-calculator-error"></div>
  <div class="result" id="baby-cost-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="baby-cost-calculator-monthly">&ndash;</div><div class="l">Monthly recurring</div></div>
      <div class="stat-card"><div class="v" id="baby-cost-calculator-onetime">&ndash;</div><div class="l">One-time total</div></div>
      <div class="stat-card"><div class="v" id="baby-cost-calculator-total">&ndash;</div><div class="l">First-year total</div></div>
    </div>
    <div id="baby-cost-calculator-out"></div>
    <p class="note">For information only &mdash; not financial advice. Costs vary widely by location and choices.</p>
  </div>
</div>
