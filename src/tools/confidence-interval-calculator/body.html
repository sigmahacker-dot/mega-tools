<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="confidence-interval-calculator-mean">Sample mean (x\u0304)</label><input class="input" id="confidence-interval-calculator-mean" type="number" value="50" step="any"></div>
    <div class="field"><label for="confidence-interval-calculator-s">Sample std dev (s)</label><input class="input" id="confidence-interval-calculator-s" type="number" value="8" min="0" step="any"></div>
    <div class="field"><label for="confidence-interval-calculator-n">Sample size (n)</label><input class="input" id="confidence-interval-calculator-n" type="number" value="36" min="2" step="1"></div>
    <div class="field"><label for="confidence-interval-calculator-conf">Confidence level</label>
      <select class="input" id="confidence-interval-calculator-conf"><option value="90">90%</option><option value="95" selected>95%</option><option value="99">99%</option></select>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="confidence-interval-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="confidence-interval-calculator-lo" style="font-size:1rem">47.39</div><div class="l">Lower bound</div></div>
    <div class="stat-card"><div class="v" id="confidence-interval-calculator-hi" style="font-size:1rem">52.61</div><div class="l">Upper bound</div></div>
    <div class="stat-card"><div class="v" id="confidence-interval-calculator-me" style="font-size:1rem">2.61</div><div class="l">Margin of error</div></div>
  </div>
  <div class="result"><pre class="code" id="confidence-interval-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="confidence-interval-calculator-error"></div>
</div>
