<div class="tool-card">
  <div class="field">
    <label for="acrostic-poem-generator-input">Word (up to 12 letters)</label>
    <input class="input" type="text" id="acrostic-poem-generator-input" placeholder="e.g. DREAM" maxlength="12" autocomplete="off">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="acrostic-poem-generator-run">Generate poem</button>
  </div>
  <div class="field">
    <label>Your acrostic</label>
    <div class="result"><div class="data" id="acrostic-poem-generator-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="acrostic-poem-generator-copy">Copy poem</button></div>
  </div>
  <div class="error" id="acrostic-poem-generator-error"></div>
</div>
