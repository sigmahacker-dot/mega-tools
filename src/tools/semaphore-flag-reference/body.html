<div class="tool-card">
  <div class="field">
    <label for="semaphore-flag-reference-search">Search letters</label>
    <input class="input" id="semaphore-flag-reference-search" type="text" placeholder="Type a letter or NATO name, e.g. 'k' or 'kilo'…">
  </div>
  <div class="error" id="semaphore-flag-reference-error"></div>
  <div id="semaphore-flag-reference-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px"></div>
  <p class="note">Positions are shown from the observer's point of view (as you see the signaler facing you). Arm angles: 0° = up, clockwise.</p>
</div>
