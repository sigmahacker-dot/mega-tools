<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="paint-area">Paintable area (sq ft)</label><input type="number" class="input" id="paint-area" min="0" step="any" placeholder="400"></div>
    <div class="field"><label for="paint-coats">Coats of paint</label>
      <select class="input" id="paint-coats"><option value="1">1 coat</option><option value="2" selected>2 coats</option><option value="3">3 coats</option></select>
    </div>
    <div class="field"><label for="paint-coverage">Coverage (sq ft / gallon)</label><input type="number" class="input" id="paint-coverage" min="1" step="any" placeholder="350"></div>
    <div class="field"><label for="paint-primer">Include primer?</label>
      <select class="input" id="paint-primer"><option value="yes">Yes, one coat of primer</option><option value="no">No primer needed</option></select>
    </div>
  </div>
  <div class="error" id="paint-calculator-error"></div>
  <div class="result" id="paint-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="paint-gallons">–</div><div class="l">Gallons to buy</div></div>
      <div class="stat-card"><div class="v" id="paint-primerout">–</div><div class="l">Primer gallons</div></div>
      <div class="stat-card"><div class="v" id="paint-liters">–</div><div class="l">Paint in liters</div></div>
    </div>
    <p class="note">Based on 350 sq ft per gallon per coat (adjust for rough or porous surfaces). Gallons are rounded up to whole gallons.</p>
  </div>
</div>
