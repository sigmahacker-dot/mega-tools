<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="vacation-budget-planner-travelers">Travelers</label>
      <input type="number" class="input" id="vacation-budget-planner-travelers" min="1" step="1" placeholder="2">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-days">Trip days</label>
      <input type="number" class="input" id="vacation-budget-planner-days" min="1" step="1" placeholder="7">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-flights">Flights total ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-flights" min="0" step="any" placeholder="1200">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-hotel">Hotel per night ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-hotel" min="0" step="any" placeholder="150">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-food">Food per person / day ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-food" min="0" step="any" placeholder="60">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-activities">Activities per person / day ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-activities" min="0" step="any" placeholder="40">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-transport">Local transport per person / day ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-transport" min="0" step="any" placeholder="20">
    </div>
    <div class="field">
      <label for="vacation-budget-planner-other">Other lump-sum costs ($)</label>
      <input type="number" class="input" id="vacation-budget-planner-other" min="0" step="any" placeholder="300">
    </div>
  </div>
  <div class="error" id="vacation-budget-planner-error"></div>
  <div class="result" id="vacation-budget-planner-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="vacation-budget-planner-total">&ndash;</div><div class="l">Trip total</div></div>
      <div class="stat-card"><div class="v" id="vacation-budget-planner-perperson">&ndash;</div><div class="l">Per person</div></div>
      <div class="stat-card"><div class="v" id="vacation-budget-planner-perday">&ndash;</div><div class="l">Per person / day</div></div>
    </div>
    <div id="vacation-budget-planner-out"></div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
