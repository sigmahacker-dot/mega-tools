<div class="tool-card">
  <div class="field">
    <label for="video-merger-file">Add video clips (in merge order)</label>
    <input class="input" id="video-merger-file" type="file" accept="video/*" multiple>
  </div>
  <div id="video-merger-list" class="file-list"></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="video-merger-merge" type="button">Merge Videos</button>
    <button class="btn btn-outline" id="video-merger-clear" type="button">Clear All</button>
  </div>
  <div class="error" id="video-merger-error"></div>
  <div class="progress hidden" id="video-merger-progress"><div id="video-merger-bar" style="width:0%"></div></div>
  <p class="muted" id="video-merger-status"></p>
  <p class="note">Merges into WebM format — videos are re-encoded, so quality may change slightly. All processing happens on your device. The first clip sets the output size; other clips are letterboxed to fit.</p>
</div>
