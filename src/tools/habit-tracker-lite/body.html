<div class="tool-card">
  <div class="field"><label for="habit-name">New habit</label>
    <div style="display:flex;gap:8px"><input type="text" class="input" id="habit-name" placeholder="Read 20 pages">
    <button class="btn btn-primary btn-sm" id="habit-add" type="button">Add</button></div>
  </div>
  <div class="error" id="habit-tracker-lite-error"></div>
  <div class="result" id="habit-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="habit-count">0</div><div class="l">Habits</div></div>
      <div class="stat-card"><div class="v" id="habit-done-today">0</div><div class="l">Done today</div></div>
      <div class="stat-card"><div class="v" id="habit-best">0</div><div class="l">Best streak</div></div>
    </div>
    <div id="habit-list"></div>
    <p class="note">Streaks count consecutive days. Data is stored on this device only.</p>
  </div>
</div>
