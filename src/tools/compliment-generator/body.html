<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto;text-align:left">
    <label for="compliment-generator-cat">Category</label>
    <select class="input" id="compliment-generator-cat">
      <option value="all">🎲 Surprise me</option>
      <option value="kindness">💛 Kindness</option>
      <option value="creativity">🎨 Creativity</option>
      <option value="smart">🧠 Intelligence</option>
      <option value="looks">✨ Appearance</option>
      <option value="funny">😂 Funny</option>
    </select>
  </div>
  <div style="font-size:64px;margin:16px 0 8px">💛</div>
  <h3 id="compliment-generator-text" style="font-size:22px;line-height:1.5;min-height:100px;display:flex;align-items:center;justify-content:center;max-width:520px;margin:0 auto">Tap below for a compliment.</h3>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="compliment-generator-new">New compliment</button>
    <button class="btn btn-outline" id="compliment-generator-copy">Copy</button>
  </div>
  <div class="error" id="compliment-generator-error"></div>
</div>
