<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="break-even-calculator-fixed">Fixed costs ($)</label><input class="input" id="break-even-calculator-fixed" type="number" min="0" step="any" value="50000"></div>
    <div class="field"><label for="break-even-calculator-price">Price per unit ($)</label><input class="input" id="break-even-calculator-price" type="number" min="0" step="any" value="25"></div>
    <div class="field"><label for="break-even-calculator-variable">Variable cost per unit ($)</label><input class="input" id="break-even-calculator-variable" type="number" min="0" step="any" value="10"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="break-even-calculator-calc">Calculate</button></div>
  <div class="error" id="break-even-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="break-even-calculator-units">—</div><div class="l">Break-even units</div></div>
    <div class="stat-card"><div class="v" id="break-even-calculator-revenue">—</div><div class="l">Break-even revenue</div></div>
    <div class="stat-card"><div class="v" id="break-even-calculator-margin">—</div><div class="l">Contribution margin / unit</div></div>
    <div class="stat-card"><div class="v" id="break-even-calculator-ratio">—</div><div class="l">Contribution margin %</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
