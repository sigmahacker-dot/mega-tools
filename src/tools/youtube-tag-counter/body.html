<div class="tool-card">
  <div class="field">
    <label for="youtube-tag-counter-input">Your tags <span class="muted">(comma or line separated)</span></label>
    <textarea class="textarea" id="youtube-tag-counter-input" rows="6" placeholder="travel vlog, pakistan travel, hunza valley"></textarea>
  </div>
  <div class="error" id="youtube-tag-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="youtube-tag-counter-count">0</div><div class="l">Tags</div></div>
    <div class="stat-card"><div class="v" id="youtube-tag-counter-chars">0 / 500</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="youtube-tag-counter-dupes">0</div><div class="l">Duplicates</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Tag</th><th>Chars</th><th>Status</th></tr></thead>
      <tbody id="youtube-tag-counter-body"><tr><td colspan="3" class="muted">Your tags appear here.</td></tr></tbody>
    </table>
    <p class="note">YouTube allows 500 characters of tags per video. Character count excludes separator commas.</p>
  </div>
</div>
