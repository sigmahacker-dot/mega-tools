<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="hiit-work">Work (seconds)</label><input type="number" class="input" id="hiit-work" min="5" max="300" step="1" placeholder="30"></div>
    <div class="field"><label for="hiit-rest">Rest (seconds)</label><input type="number" class="input" id="hiit-rest" min="5" max="300" step="1" placeholder="15"></div>
    <div class="field"><label for="hiit-rounds">Rounds</label><input type="number" class="input" id="hiit-rounds" min="1" max="50" step="1" placeholder="8"></div>
    <div class="field"><label>&nbsp;</label>
      <div>
        <button class="btn" id="hiit-start">Start</button>
        <button class="btn" id="hiit-pause">Pause</button>
        <button class="btn" id="hiit-reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="error" id="hiit-timer-error"></div>
  <div class="result" id="hiit-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hiit-phase">Ready</div><div class="l">Phase</div></div>
      <div class="stat-card"><div class="v" id="hiit-time">–</div><div class="l">Time left</div></div>
      <div class="stat-card"><div class="v" id="hiit-round">–</div><div class="l">Round</div></div>
    </div>
    <div class="field"><label for="hiit-bar">Phase progress</label><progress class="input" id="hiit-bar" max="100" value="0" style="width:100%"></progress></div>
    <p class="muted" id="hiit-detail">Set your intervals and press Start.</p>
  </div>
</div>
