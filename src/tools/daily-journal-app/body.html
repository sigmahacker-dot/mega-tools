<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="daily-journal-app-date">Date</label>
      <input class="input" type="date" id="daily-journal-app-date">
    </div>
    <div class="field">
      <label for="daily-journal-app-title">Title</label>
      <input class="input" type="text" id="daily-journal-app-title" placeholder="A title for today…">
    </div>
  </div>
  <div class="field">
    <label for="daily-journal-app-body">Entry</label>
    <textarea class="textarea" id="daily-journal-app-body" rows="8" placeholder="Write about your day…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="daily-journal-app-save">Save Entry</button>
    <button class="btn btn-outline" id="daily-journal-app-clear">New Entry</button>
    <button class="btn btn-outline" id="daily-journal-app-delete">Delete</button>
  </div>
  <div class="error" id="daily-journal-app-error"></div>
</div>

<div class="tool-card">
  <div class="field">
    <label for="daily-journal-app-search">Search entries</label>
    <input class="input" type="text" id="daily-journal-app-search" placeholder="Search title or text…">
  </div>
  <div id="daily-journal-app-list"></div>
  <p class="muted" id="daily-journal-app-count"></p>
</div>
