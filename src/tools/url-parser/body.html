<div class="tool-card">
  <div class="field">
    <label for="url-parser-in">URL</label>
    <input type="text" class="input" id="url-parser-in" placeholder="https://user:pass@example.com:8080/path?q=1#hash" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="url-parser-sample">Load sample</button>
  </div>
  <div class="error" id="url-parser-error"></div>
  <div class="result" id="url-parser-result">
    <table class="data">
      <tbody id="url-parser-parts"></tbody>
    </table>
    <p class="note">Passwords are masked. Everything runs locally in your browser — nothing is sent anywhere.</p>
  </div>
  <style>
    #url-parser-parts td{white-space:pre-wrap;word-break:break-word}
  </style>
</div>
