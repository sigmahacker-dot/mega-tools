<div class="tool-card">
  <div class="field">
    <label for="tilt-shift-effect-file">Photo</label>
    <input type="file" id="tilt-shift-effect-file" accept="image/*" class="input">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="tilt-shift-effect-pos">Focus position: <span id="tilt-shift-effect-pos-val">50</span>%</label>
      <input type="range" id="tilt-shift-effect-pos" min="5" max="95" value="50">
    </div>
    <div class="field">
      <label for="tilt-shift-effect-band">Focus band: <span id="tilt-shift-effect-band-val">30</span>%</label>
      <input type="range" id="tilt-shift-effect-band" min="8" max="80" value="30">
    </div>
    <div class="field">
      <label for="tilt-shift-effect-blur">Blur strength: <span id="tilt-shift-effect-blur-val">12</span>px</label>
      <input type="range" id="tilt-shift-effect-blur" min="2" max="30" value="12">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="tilt-shift-effect-download">Download image</button>
  </div>
  <div class="result">
    <canvas id="tilt-shift-effect-canvas" style="width:100%;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="tilt-shift-effect-error"></div>
  <p class="note">Best on high-angle or aerial photos. Everything is processed locally in your browser.</p>
</div>
