<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="emoji-movie-guess-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="emoji-movie-guess-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="emoji-movie-guess-done">0</div><div class="l">Solved</div></div>
  </div>
  <div id="emoji-movie-guess-emoji" style="font-size:56px;margin:12px 0;min-height:76px">🎬🍿</div>
  <div id="emoji-movie-guess-letters" style="font-size:26px;letter-spacing:6px;font-weight:bold;margin-bottom:8px;min-height:36px"></div>
  <p class="muted" id="emoji-movie-guess-msg" style="min-height:24px">Press Start — guess the movie from the emojis!</p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="emoji-movie-guess-guess">Your guess</label>
      <input class="input" id="emoji-movie-guess-guess" placeholder="Movie title…" autocomplete="off" disabled>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="emoji-movie-guess-submit" style="width:100%" disabled>Guess</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="emoji-movie-guess-start">▶ Start</button>
    <button class="btn btn-outline" id="emoji-movie-guess-hint" disabled>💡 Hint</button>
    <button class="btn btn-outline" id="emoji-movie-guess-skip" disabled>Skip ↷</button>
  </div>
  <div class="error" id="emoji-movie-guess-error"></div>
</div>
