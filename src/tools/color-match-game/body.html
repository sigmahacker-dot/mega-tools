<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="color-match-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="color-match-game-time">45</div><div class="l">Seconds left</div></div>
    <div class="stat-card"><div class="v" id="color-match-game-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="color-match-game-stage" style="min-height:120px;display:flex;align-items:center;justify-content:center">
    <div id="color-match-game-word" style="font-size:56px;font-weight:800;letter-spacing:1px">READY?</div>
  </div>
  <div id="color-match-game-btns" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:12px auto"></div>
  <p class="muted" id="color-match-game-msg" style="min-height:24px">Match the INK color, not the word!</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="color-match-game-start">Start</button>
  </div>
  <div class="error" id="color-match-game-error"></div>
</div>
