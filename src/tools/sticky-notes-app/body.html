<div class="tool-card">
  <div class="btn-row" style="margin-bottom:12px">
    <button class="btn" id="sticky-notes-app-add">+ New note</button>
  </div>
  <div class="error" id="sticky-notes-app-error"></div>
  <div id="sticky-notes-app-board" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px"></div>
  <p class="muted" id="sticky-notes-app-empty">No notes yet — add one above. Notes save automatically.</p>
</div>
