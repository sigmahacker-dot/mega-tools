<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="album-name-generator-genre">Genre</label>
      <select class="select" id="album-name-generator-genre">
        <option value="rock">Rock</option>
        <option value="pop">Pop</option>
        <option value="hiphop">Hip-Hop</option>
        <option value="electronic">Electronic</option>
        <option value="jazz">Jazz</option>
        <option value="country">Country</option>
        <option value="metal">Metal</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="album-name-generator-go" type="button">Generate Album Names</button>
      </div>
    </div>
  </div>
  <div class="error" id="album-name-generator-error"></div>
  <div class="mt" id="album-name-generator-list"></div>
</div>
