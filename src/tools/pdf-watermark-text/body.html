<div class="tool-card">
  <h2>PDF Watermark Text</h2>
  <p class="muted">Stamp a text watermark diagonally across every page.</p>
  <div class="field">
    <label for="pdf-watermark-text-file">PDF file</label>
    <input type="file" class="input" id="pdf-watermark-text-file" accept=".pdf,application/pdf">
  </div>
  <div class="grid2">
    <div class="field" style="grid-column:1/-1">
      <label for="pdf-watermark-text-text">Watermark text</label>
      <input type="text" class="input" id="pdf-watermark-text-text" value="DRAFT">
    </div>
    <div class="field">
      <label for="pdf-watermark-text-opacity">Opacity: <span id="pdf-watermark-text-opacity-v">0.25</span></label>
      <input type="range" class="input" id="pdf-watermark-text-opacity" min="0.05" max="1" step="0.05" value="0.25">
    </div>
    <div class="field">
      <label for="pdf-watermark-text-rotation">Rotation: <span id="pdf-watermark-text-rotation-v">45°</span></label>
      <input type="range" class="input" id="pdf-watermark-text-rotation" min="0" max="90" step="1" value="45">
    </div>
    <div class="field">
      <label for="pdf-watermark-text-size">Font size: <span id="pdf-watermark-text-size-v">64</span></label>
      <input type="range" class="input" id="pdf-watermark-text-size" min="24" max="160" step="2" value="64">
    </div>
    <div class="field">
      <label for="pdf-watermark-text-color">Color</label>
      <input type="color" class="input" id="pdf-watermark-text-color" value="#dc2626" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="pdf-watermark-text-repeat">Repeat on page</label>
      <select class="input" id="pdf-watermark-text-repeat">
        <option value="1">Once (centered)</option>
        <option value="2">2× diagonal row</option>
        <option value="4">2×2 grid</option>
      </select>
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="pdf-watermark-text-go" disabled>Add Watermark &amp; Download</button>
  </div>
  <div class="error" id="pdf-watermark-text-error"></div>
  <div class="result hidden" id="pdf-watermark-text-result"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
