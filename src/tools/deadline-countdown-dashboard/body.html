<div class="tool-card">
  <div class="grid2" style="max-width:520px;margin:0 auto 12px">
    <div class="field">
      <label for="deadline-countdown-dashboard-name">Deadline name</label>
      <input class="input" type="text" id="deadline-countdown-dashboard-name" placeholder="e.g. Visa application" maxlength="80">
    </div>
    <div class="field">
      <label for="deadline-countdown-dashboard-when">Date &amp; time</label>
      <input class="input" type="datetime-local" id="deadline-countdown-dashboard-when">
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="deadline-countdown-dashboard-add">Add deadline</button>
  </div>
  <div id="deadline-countdown-dashboard-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px"></div>
  <div class="error" id="deadline-countdown-dashboard-error"></div>
</div>
