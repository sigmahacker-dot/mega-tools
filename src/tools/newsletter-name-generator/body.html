<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="newsletter-name-generator-niche">Newsletter niche</label>
      <input class="input" id="newsletter-name-generator-niche" type="text" placeholder="e.g. AI, cooking, personal finance" maxlength="60">
    </div>
    <div class="field">
      <label for="newsletter-name-generator-style">Style</label>
      <select class="select" id="newsletter-name-generator-style">
        <option value="classic">Classic</option>
        <option value="modern">Modern</option>
        <option value="playful">Playful</option>
        <option value="premium">Premium</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="newsletter-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="newsletter-name-generator-error"></div>
  <div class="mt" id="newsletter-name-generator-list"></div>
</div>
