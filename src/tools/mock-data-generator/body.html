<div class="tool-card">
  <div class="field">
    <label>Fields</label>
    <div id="mock-data-generator-fields"></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-outline" id="mock-data-generator-add">+ Add field</button></div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="mock-data-generator-rows">Rows (1–1000)</label>
      <input type="number" class="input" id="mock-data-generator-rows" min="1" max="1000" value="10">
    </div>
    <div class="field">
      <label for="mock-data-generator-format">Format</label>
      <select class="input" id="mock-data-generator-format">
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="mock-data-generator-generate">Generate</button>
  </div>
  <div class="error" id="mock-data-generator-error"></div>
  <div class="field">
    <label for="mock-data-generator-output">Output</label>
    <textarea class="textarea" id="mock-data-generator-output" rows="12" readonly placeholder="Generated data will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="mock-data-generator-copy">Copy</button>
    <button class="btn btn-outline" id="mock-data-generator-download">Download</button>
  </div>
</div>
