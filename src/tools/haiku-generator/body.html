<div class="tool-card">
  <div class="btn-row" style="justify-content:center;margin-bottom:12px">
    <button class="btn btn-primary" id="haiku-generator-run">Generate haiku</button>
  </div>
  <div class="field">
    <label>Your haiku (5-7-5)</label>
    <div class="result"><div class="data" id="haiku-generator-output" style="white-space:pre-wrap;font-size:1.15em;line-height:1.8;text-align:center"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="haiku-generator-copy">Copy haiku</button></div>
  </div>
  <div class="error" id="haiku-generator-error"></div>
</div>
