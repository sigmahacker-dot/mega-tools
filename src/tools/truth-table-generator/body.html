<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="truth-table-generator-vars">Variables</label>
      <select class="select" id="truth-table-generator-vars">
        <option value="2">2 variables (A, B)</option>
        <option value="3">3 variables (A, B, C)</option>
      </select>
    </div>
    <div class="field">
      <label for="truth-table-generator-expr">Logical expression</label>
      <select class="select" id="truth-table-generator-expr"></select>
    </div>
  </div>
  <div class="error" id="truth-table-generator-error"></div>
  <div class="result" id="truth-table-generator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="truth-table-generator-rows">–</div><div class="l">Rows</div></div>
      <div class="stat-card"><div class="v" id="truth-table-generator-true">–</div><div class="l">True outputs</div></div>
      <div class="stat-card"><div class="v" id="truth-table-generator-class">–</div><div class="l">Classification</div></div>
    </div>
    <table class="data">
      <thead id="truth-table-generator-head"></thead>
      <tbody id="truth-table-generator-body"></tbody>
    </table>
  </div>
</div>
