<div class="tool-card">
  <div class="field">
    <label for="polybius-square-tool-input">Input</label>
    <textarea class="textarea" id="polybius-square-tool-input" rows="5" placeholder="Type letters to encode, or digit pairs like 111213 to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="polybius-square-tool-mode">Mode</label>
      <select class="input" id="polybius-square-tool-mode">
        <option value="encode">Encode (letters → coordinates)</option>
        <option value="decode">Decode (coordinates → letters)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="polybius-square-tool-run">Run</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="polybius-square-tool-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="polybius-square-tool-copy">Copy output</button></div>
  </div>
  <p class="hint">I and J share cell 24. Coordinates read row-first, then column.</p>
  <div class="error" id="polybius-square-tool-error"></div>
</div>
