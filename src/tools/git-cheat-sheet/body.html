<div class="tool-card">
  <div class="field">
    <label for="git-cheat-sheet-search">Search commands</label>
    <input class="input" id="git-cheat-sheet-search" placeholder="e.g. branch, rebase, stash…">
    <p class="hint">Click any command to copy it.</p>
  </div>
  <div class="error" id="git-cheat-sheet-error"></div>
  <div id="git-cheat-sheet-list"></div>
  <p class="muted hidden" id="git-cheat-sheet-none">No commands match your search.</p>
</div>
