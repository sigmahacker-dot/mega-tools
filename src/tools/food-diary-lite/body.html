<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="food-diary-lite-date">Date</label>
      <input type="date" class="input" id="food-diary-lite-date">
    </div>
    <div class="field">
      <label for="food-diary-lite-meal">Meal</label>
      <select class="select" id="food-diary-lite-meal">
        <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option>
      </select>
    </div>
    <div class="field">
      <label for="food-diary-lite-filter">Search foods</label>
      <input type="text" class="input" id="food-diary-lite-filter" placeholder="Filter...">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="food-diary-lite-food">Food</label>
      <select class="select" id="food-diary-lite-food"></select>
    </div>
    <div class="field">
      <label for="food-diary-lite-grams">Grams</label>
      <div style="display:flex;gap:8px">
        <input type="number" class="input" id="food-diary-lite-grams" min="0" step="any" placeholder="100">
        <button class="btn" id="food-diary-lite-add" type="button">Add</button>
      </div>
    </div>
  </div>
  <div class="error" id="food-diary-lite-error"></div>
  <div class="result" id="food-diary-lite-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="food-diary-lite-kcal">0</div><div class="l">Kcal</div></div>
      <div class="stat-card"><div class="v" id="food-diary-lite-p">0g</div><div class="l">Protein</div></div>
      <div class="stat-card"><div class="v" id="food-diary-lite-c">0g</div><div class="l">Carbs</div></div>
      <div class="stat-card"><div class="v" id="food-diary-lite-f">0g</div><div class="l">Fat</div></div>
    </div>
    <div id="food-diary-lite-out"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="food-diary-lite-clear" type="button">Clear this day</button>
    </div>
    <p class="note">Saved in your browser only. For information only &mdash; not medical advice.</p>
  </div>
</div>
