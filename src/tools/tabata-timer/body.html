<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tabata-timer-rounds">Rounds</label>
      <input type="number" class="input" id="tabata-timer-rounds" min="1" max="50" step="1" value="8">
    </div>
    <div class="field">
      <label for="tabata-timer-work">Work (seconds)</label>
      <input type="number" class="input" id="tabata-timer-work" min="1" max="600" step="1" value="20">
    </div>
    <div class="field">
      <label for="tabata-timer-rest">Rest (seconds)</label>
      <input type="number" class="input" id="tabata-timer-rest" min="0" max="600" step="1" value="10">
    </div>
    <div class="field">
      <label for="tabata-timer-prep">Prep countdown (seconds)</label>
      <input type="number" class="input" id="tabata-timer-prep" min="0" max="120" step="1" value="10">
    </div>
  </div>
  <div style="text-align:center;margin:18px 0 6px;">
    <div class="muted" id="tabata-timer-phase" style="font-size:1rem;">Ready</div>
    <div id="tabata-timer-display" style="font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.05em;">0:10</div>
    <div class="muted" id="tabata-timer-round">Round 0 / 8</div>
  </div>
  <div class="btn-row" style="justify-content:center;">
    <button class="btn btn-primary" id="tabata-timer-start" type="button">Start</button>
    <button class="btn btn-outline" id="tabata-timer-reset" type="button">Reset</button>
  </div>
  <div class="error" id="tabata-timer-error"></div>
  <p class="note" style="text-align:center;">A chime sounds on every interval change. Timing uses wall-clock timestamps.</p>
</div>
