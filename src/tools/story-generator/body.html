<div class="tool-card">
  <div class="row">
    <div class="field">
      <label for="story-generator-genre">Genre</label>
      <select id="story-generator-genre" class="select">
        <option value="adventure">Adventure</option>
        <option value="horror">Horror</option>
        <option value="scifi">Sci-Fi</option>
        <option value="funny">Funny</option>
        <option value="fairytale">Fairy Tale</option>
      </select>
    </div>
    <div class="field">
      <label for="story-generator-hero">Hero's name (optional)</label>
      <input type="text" id="story-generator-hero" class="input" placeholder="e.g. Ayesha" maxlength="30">
    </div>
    <div class="field">
      <label for="story-generator-kw">Keyword (optional magic object)</label>
      <input type="text" id="story-generator-kw" class="input" placeholder="e.g. silver key" maxlength="40">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="story-generator-go">Generate Story</button>
    <button type="button" class="btn btn-outline" id="story-generator-regen">Regenerate</button>
  </div>
  <div class="error" id="story-generator-error"></div>
  <div id="story-generator-out" class="hidden">
    <h3 class="center mt" id="story-generator-title"></h3>
    <p class="muted center" id="story-generator-meta"></p>
    <div class="result" id="story-generator-story"></div>
    <div class="btn-row mt">
      <button type="button" class="btn btn-outline btn-sm" id="story-generator-copy">Copy Story</button>
      <button type="button" class="btn btn-outline btn-sm" id="story-generator-dl">Download .txt</button>
    </div>
    <div class="success" id="story-generator-copied"></div>
  </div>
</div>
