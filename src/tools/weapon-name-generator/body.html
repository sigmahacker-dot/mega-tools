<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="weapon-name-generator-type">Weapon type</label>
      <select class="select" id="weapon-name-generator-type">
        <option value="sword">Sword</option>
        <option value="axe">Axe</option>
        <option value="bow">Bow</option>
        <option value="dagger">Dagger</option>
        <option value="hammer">Hammer</option>
        <option value="staff">Staff</option>
        <option value="spear">Spear</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="weapon-name-generator-go" type="button">Forge Weapons</button>
      </div>
    </div>
  </div>
  <div class="error" id="weapon-name-generator-error"></div>
  <div class="mt" id="weapon-name-generator-list"></div>
</div>
