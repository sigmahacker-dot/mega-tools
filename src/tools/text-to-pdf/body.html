<div class="tool-card">
  <h2>Text to PDF</h2>
  <p class="muted">Type or paste text and get a clean, printable A4 PDF.</p>
  <div class="field">
    <label for="text-to-pdf-title">Document title (optional)</label>
    <input type="text" id="text-to-pdf-title" class="input" placeholder="My document">
  </div>
  <div class="field">
    <label for="text-to-pdf-size">Font size</label>
    <select id="text-to-pdf-size" class="select">
      <option value="10">10 pt</option>
      <option value="12" selected>12 pt</option>
      <option value="14">14 pt</option>
      <option value="16">16 pt</option>
      <option value="18">18 pt</option>
    </select>
  </div>
  <div class="field">
    <label for="text-to-pdf-text">Text</label>
    <textarea id="text-to-pdf-text" class="textarea" rows="12" placeholder="Type or paste your text here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="text-to-pdf-create">Create PDF</button>
    <button class="btn btn-outline" id="text-to-pdf-clear">Clear</button>
  </div>
  <div class="error" id="text-to-pdf-error"></div>
  <div class="result hidden" id="text-to-pdf-result"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
