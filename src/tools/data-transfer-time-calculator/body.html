<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="data-transfer-time-calculator-size">File size</label>
      <input type="number" class="input" id="data-transfer-time-calculator-size" step="any" min="0" placeholder="e.g. 4.7">
    </div>
    <div class="field">
      <label for="data-transfer-time-calculator-sizeu">Size unit</label>
      <select class="select" id="data-transfer-time-calculator-sizeu">
        <option value="1">Bytes (B)</option>
        <option value="1000">Kilobytes (KB)</option>
        <option value="1e6">Megabytes (MB)</option>
        <option value="1e9" selected>Gigabytes (GB)</option>
        <option value="1e12">Terabytes (TB)</option>
      </select>
    </div>
    <div class="field">
      <label for="data-transfer-time-calculator-speed">Transfer speed</label>
      <input type="number" class="input" id="data-transfer-time-calculator-speed" step="any" min="0" placeholder="e.g. 100">
    </div>
    <div class="field">
      <label for="data-transfer-time-calculator-speedu">Speed unit</label>
      <select class="select" id="data-transfer-time-calculator-speedu">
        <option value="1">Bits per second (bps)</option>
        <option value="1000">Kilobits per second (Kbps)</option>
        <option value="1e6" selected>Megabits per second (Mbps)</option>
        <option value="1e9">Gigabits per second (Gbps)</option>
      </select>
    </div>
  </div>
  <div class="error" id="data-transfer-time-calculator-error"></div>
  <div class="result" id="data-transfer-time-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="data-transfer-time-calculator-time">–</div><div class="l">Transfer time</div></div>
      <div class="stat-card"><div class="v" id="data-transfer-time-calculator-mins">–</div><div class="l">Total minutes</div></div>
      <div class="stat-card"><div class="v" id="data-transfer-time-calculator-hours">–</div><div class="l">Total hours</div></div>
    </div>
    <p class="note" id="data-transfer-time-calculator-steps">Enter a file size and a transfer speed.</p>
  </div>
</div>
