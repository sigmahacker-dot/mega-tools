<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="contrast-checker-fg">Text color</label>
      <input type="color" class="input" id="contrast-checker-fg" value="#111111" style="height:48px;padding:4px;">
    </div>
    <div class="field">
      <label for="contrast-checker-bg">Background color</label>
      <input type="color" class="input" id="contrast-checker-bg" value="#ffffff" style="height:48px;padding:4px;">
    </div>
  </div>
  <div class="error" id="contrast-checker-error"></div>
  <div class="result" id="contrast-checker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="contrast-checker-ratio">&ndash;</div><div class="l">Contrast ratio</div></div>
      <div class="stat-card"><div class="v" id="contrast-checker-grade">&ndash;</div><div class="l">Best grade</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">AA normal text (4.5:1)</th><td id="contrast-checker-aa-n">&ndash;</td></tr>
        <tr><th scope="row">AA large text (3:1)</th><td id="contrast-checker-aa-l">&ndash;</td></tr>
        <tr><th scope="row">AAA normal text (7:1)</th><td id="contrast-checker-aaa-n">&ndash;</td></tr>
        <tr><th scope="row">AAA large text (4.5:1)</th><td id="contrast-checker-aaa-l">&ndash;</td></tr>
      </tbody>
    </table>
    <div class="field">
      <label>Live preview</label>
      <div id="contrast-checker-preview" style="padding:24px;border-radius:8px;text-align:center;">
        <div id="contrast-checker-preview-big" style="font-size:28px;font-weight:bold;margin-bottom:8px;">The quick brown fox</div>
        <div id="contrast-checker-preview-small" style="font-size:14px;">The quick brown fox jumps over the lazy dog.</div>
      </div>
    </div>
  </div>
</div>
