<div class="tool-card">
  <div class="field">
    <label for="pet-cost-calculator-pet">Pet type</label>
    <select class="select" id="pet-cost-calculator-pet">
      <option value="dog">Dog</option>
      <option value="cat">Cat</option>
      <option value="bird">Bird</option>
      <option value="fish">Fish</option>
      <option value="rabbit">Rabbit</option>
      <option value="reptile">Reptile</option>
    </select>
  </div>
  <div class="field">
    <label>Annual cost items (editable)</label>
    <div id="pet-cost-calculator-items"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="pet-cost-calculator-add" type="button">+ Add item</button>
    </div>
  </div>
  <div class="error" id="pet-cost-calculator-error"></div>
  <div class="result" id="pet-cost-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pet-cost-calculator-annual">&ndash;</div><div class="l">Annual total</div></div>
      <div class="stat-card"><div class="v" id="pet-cost-calculator-monthly">&ndash;</div><div class="l">Monthly average</div></div>
    </div>
    <div id="pet-cost-calculator-out"></div>
    <p class="note">For information only &mdash; not financial advice. Presets are typical ranges; actual costs vary.</p>
  </div>
</div>
