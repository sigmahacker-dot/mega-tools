<div class="tool-card">
  <div class="field">
    <label for="wedding-budget-calculator-budget">Total budget ($)</label>
    <input type="number" class="input" id="wedding-budget-calculator-budget" min="0" step="any" placeholder="25000">
  </div>
  <div class="field">
    <label>Categories (% of budget)</label>
    <div id="wedding-budget-calculator-cats"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="wedding-budget-calculator-add" type="button">+ Add category</button>
    </div>
  </div>
  <div class="error" id="wedding-budget-calculator-error"></div>
  <div class="result" id="wedding-budget-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="wedding-budget-calculator-pct">&ndash;</div><div class="l">% allocated</div></div>
      <div class="stat-card"><div class="v" id="wedding-budget-calculator-alloc">&ndash;</div><div class="l">Allocated total</div></div>
      <div class="stat-card"><div class="v" id="wedding-budget-calculator-rem">&ndash;</div><div class="l">Remaining</div></div>
    </div>
    <div id="wedding-budget-calculator-out"></div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
