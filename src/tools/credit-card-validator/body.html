<div class="tool-card">
  <div class="field">
    <label for="card-number">Card number</label>
    <input type="text" class="input" id="card-number" placeholder="4111 1111 1111 1111" autocomplete="off" inputmode="numeric" spellcheck="false">
  </div>
  <div class="error" id="credit-card-validator-error"></div>
  <div class="result" id="card-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="card-status">–</div><div class="l">Luhn check</div></div>
      <div class="stat-card"><div class="v" id="card-brand">–</div><div class="l">Detected brand</div></div>
    </div>
    <p class="note">Format check only — a valid checksum does NOT mean the card is real, active or has funds. Nothing is stored or sent anywhere.</p>
  </div>
</div>
