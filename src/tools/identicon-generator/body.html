<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:420px;margin:0 auto">
    <label for="identicon-generator-text">Text to hash</label>
    <input class="input" id="identicon-generator-text" type="text" placeholder="e.g. alex@example.com" maxlength="80">
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="identicon-generator-go" type="button">Generate Identicon</button>
    <button class="btn btn-outline" id="identicon-generator-random" type="button">Random</button>
  </div>
  <div class="error" id="identicon-generator-error"></div>
  <div style="margin:14px auto">
    <canvas id="identicon-generator-canvas" width="250" height="250" style="width:200px;height:200px;image-rendering:pixelated;border-radius:12px;background:#0f172a"></canvas>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-outline btn-sm" id="identicon-generator-png" type="button">Download PNG</button>
  </div>
  <p class="note">Same text = same identicon, every time.</p>
</div>
