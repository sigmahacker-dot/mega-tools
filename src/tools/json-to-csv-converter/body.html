<div class="tool-card">
  <div class="field">
    <label for="json-to-csv-converter-in">JSON input (array of objects)</label>
    <textarea class="textarea" id="json-to-csv-converter-in" rows="6" placeholder='[{"name":"Ava","age":31},{"name":"Liam","age":28}]' spellcheck="false"></textarea>
  </div>
  <div class="error" id="json-to-csv-converter-error"></div>
  <div class="result" id="json-to-csv-converter-result">
    <p class="muted" id="json-to-csv-converter-stats">Waiting for valid JSON…</p>
    <div class="field">
      <label for="json-to-csv-converter-out">CSV preview</label>
      <textarea class="textarea" id="json-to-csv-converter-out" rows="6" readonly spellcheck="false"></textarea>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary btn-sm" id="json-to-csv-converter-download">Download .csv</button>
      <button type="button" class="btn btn-outline btn-sm" id="json-to-csv-converter-copy">Copy CSV</button>
    </div>
    <p class="note">Quoting follows RFC-4180: fields with commas, quotes or line breaks are quoted, and embedded quotes are doubled.</p>
  </div>
</div>
