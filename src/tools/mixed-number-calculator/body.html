<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="mixed-number-calculator-w1">First mixed number (e.g. 2 1/3)</label><input class="input" id="mixed-number-calculator-w1" type="text" value="2 1/3"></div>
    <div class="field"><label for="mixed-number-calculator-w2">Second mixed number (e.g. 1 3/4)</label><input class="input" id="mixed-number-calculator-w2" type="text" value="1 3/4"></div>
  </div>
  <div class="grid2">
    <div class="field"><label for="mixed-number-calculator-op">Operation</label><select class="input" id="mixed-number-calculator-op"><option value="+">Add (+)</option><option value="-">Subtract (−)</option></select></div>
    <div></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="mixed-number-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="mixed-number-calculator-res">4 1/12</div><div class="l">Result (mixed)</div></div>
    <div class="stat-card"><div class="v" id="mixed-number-calculator-improper">49/12</div><div class="l">Improper fraction</div></div>
  </div>
  <div class="result"><pre class="code" id="mixed-number-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="mixed-number-calculator-error"></div>
</div>
