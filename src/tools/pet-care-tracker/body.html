<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pet-care-tracker-petname">New pet name</label>
      <input class="input" type="text" id="pet-care-tracker-petname" placeholder="e.g. Max">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-outline" id="pet-care-tracker-addpet">Add Pet</button></div>
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="pet-care-tracker-pet">Pet</label>
      <select class="select" id="pet-care-tracker-pet"></select>
    </div>
    <div class="field">
      <label for="pet-care-tracker-type">Activity</label>
      <select class="select" id="pet-care-tracker-type">
        <option value="feeding">🍽️ Feeding</option>
        <option value="walk">🦮 Walk</option>
        <option value="vet">🏥 Vet visit</option>
        <option value="medication">💊 Medication</option>
      </select>
    </div>
    <div class="field">
      <label for="pet-care-tracker-note">Details</label>
      <input class="input" type="text" id="pet-care-tracker-note" placeholder="e.g. 1 cup kibble, 20 min">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="pet-care-tracker-log">Log Activity</button>
  </div>
  <div class="error" id="pet-care-tracker-error"></div>
</div>

<div class="tool-card">
  <h3>Latest per pet</h3>
  <div id="pet-care-tracker-summary"></div>
</div>

<div class="tool-card">
  <h3>Activity log</h3>
  <div id="pet-care-tracker-list"></div>
</div>
