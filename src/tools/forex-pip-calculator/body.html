<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="forex-pip-calculator-pair">Currency pair</label><select class="input select" id="forex-pip-calculator-pair">
      <option value="EURUSD" selected>EUR/USD</option><option value="GBPUSD">GBP/USD</option>
      <option value="AUDUSD">AUD/USD</option><option value="NZDUSD">NZD/USD</option>
      <option value="USDJPY">USD/JPY</option><option value="USDCAD">USD/CAD</option>
      <option value="USDCHF">USD/CHF</option>
    </select></div>
    <div class="field"><label for="forex-pip-calculator-lots">Lot size (standard lots)</label><input class="input" id="forex-pip-calculator-lots" type="number" min="0" step="any" value="1"></div>
    <div class="field"><label for="forex-pip-calculator-direction">Direction</label><select class="input select" id="forex-pip-calculator-direction"><option value="long">Long</option><option value="short">Short</option></select></div>
    <div class="field"><label for="forex-pip-calculator-entry">Entry price</label><input class="input" id="forex-pip-calculator-entry" type="number" min="0" step="any" value="1.0850"></div>
    <div class="field"><label for="forex-pip-calculator-exit">Exit price</label><input class="input" id="forex-pip-calculator-exit" type="number" min="0" step="any" value="1.0950"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="forex-pip-calculator-calc">Calculate</button></div>
  <div class="error" id="forex-pip-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="forex-pip-calculator-pips">—</div><div class="l">Pips moved</div></div>
    <div class="stat-card"><div class="v" id="forex-pip-calculator-pipval">—</div><div class="l">Pip value (USD)</div></div>
    <div class="stat-card"><div class="v" id="forex-pip-calculator-pl">—</div><div class="l">Profit / loss (USD)</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
