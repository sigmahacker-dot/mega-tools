<div class="tool-card">
  <h2>SVG Wave Generator</h2>
  <p class="muted">Decorative wave divider SVGs — crisp, responsive, copy-paste ready.</p>
  <div class="grid2">
    <div class="field">
      <label for="svg-wave-generator-amp">Amplitude: <span id="svg-wave-generator-amp-v">40</span></label>
      <input type="range" class="input" id="svg-wave-generator-amp" min="5" max="120" step="1" value="40">
    </div>
    <div class="field">
      <label for="svg-wave-generator-waves">Waves: <span id="svg-wave-generator-waves-v">2</span></label>
      <input type="range" class="input" id="svg-wave-generator-waves" min="1" max="6" step="1" value="2">
    </div>
    <div class="field">
      <label for="svg-wave-generator-height">Height: <span id="svg-wave-generator-height-v">120px</span></label>
      <input type="range" class="input" id="svg-wave-generator-height" min="40" max="300" step="2" value="120">
    </div>
    <div class="field">
      <label for="svg-wave-generator-color">Wave color</label>
      <input type="color" class="input" id="svg-wave-generator-color" value="#7c3aed" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="svg-wave-generator-flip">Flip vertically</label>
      <select class="input" id="svg-wave-generator-flip">
        <option value="no">No (bottom edge)</option>
        <option value="yes">Yes (top edge)</option>
      </select>
    </div>
    <div class="field">
      <label for="svg-wave-generator-smooth">Smoothness: <span id="svg-wave-generator-smooth-v">64</span></label>
      <input type="range" class="input" id="svg-wave-generator-smooth" min="16" max="128" step="4" value="64">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="svg-wave-generator-stage" style="padding:0;overflow:hidden;line-height:0"></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="svg-wave-generator-copy">Copy SVG</button>
  </div>
  <h3 class="mt">Generated SVG</h3>
  <pre class="code" id="svg-wave-generator-code" style="max-height:300px;overflow:auto"></pre>
  <div class="error" id="svg-wave-generator-error"></div>
</div>
