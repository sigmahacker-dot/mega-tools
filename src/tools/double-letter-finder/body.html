<div class="tool-card">
  <div class="field">
    <label for="double-letter-finder-input">Your text</label>
    <textarea class="textarea" id="double-letter-finder-input" rows="4" placeholder="e.g. The bookkeeper looked at the balloon…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="double-letter-finder-go" type="button">Find Double Letters</button>
  </div>
  <div class="error" id="double-letter-finder-error"></div>
  <div class="stat-cards" style="margin-top:12px">
    <div class="stat-card"><div class="v" id="double-letter-finder-total">0</div><div class="l">Doubles found</div></div>
    <div class="stat-card"><div class="v" id="double-letter-finder-words">0</div><div class="l">Words affected</div></div>
  </div>
  <div class="result" id="double-letter-finder-output" style="margin-top:12px;overflow-x:auto">Results will appear here.</div>
</div>
