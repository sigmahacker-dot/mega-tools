<div class="tool-card">
  <div class="field"><label for="mime-q">Search extension or MIME type</label><input type="text" class="input" id="mime-q" placeholder="e.g. mp4  or  video/mp4"></div>
  <div class="error" id="mime-type-lookup-error"></div>
  <div class="result" id="mime-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="mime-count">–</div><div class="l">Types shown</div></div>
    </div>
    <div style="max-height:420px;overflow-y:auto">
      <table class="data"><thead><tr><th>Extension</th><th>MIME type</th><th></th></tr></thead><tbody id="mime-body"></tbody></table>
    </div>
    <p class="note">Click Copy on any row to copy its MIME type.</p>
  </div>
</div>
