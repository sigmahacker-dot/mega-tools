<div class="tool-card">
  <div class="field">
    <label for="zigzag-text-generator-input">Your text</label>
    <input type="text" class="input" id="zigzag-text-generator-input" placeholder="e.g. ZIGZAG" maxlength="60" value="ZIGZAG">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="zigzag-text-generator-rows">Rows: <span id="zigzag-text-generator-rows-v">3</span></label>
      <input type="range" id="zigzag-text-generator-rows" min="2" max="6" value="3">
    </div>
    <div class="field">
      <label for="zigzag-text-generator-gap">Letter spacing: <span id="zigzag-text-generator-gap-v">1</span></label>
      <input type="range" id="zigzag-text-generator-gap" min="0" max="4" value="1">
    </div>
  </div>
  <div class="error" id="zigzag-text-generator-error"></div>
  <div class="result mt">
    <pre id="zigzag-text-generator-out" style="font-family:ui-monospace,monospace;line-height:1.5;overflow-x:auto;background:rgba(0,0,0,.35);border-radius:10px;padding:14px;"></pre>
    <div class="btn-row mt">
      <button class="btn btn-outline btn-sm" id="zigzag-text-generator-copy" type="button">Copy art</button>
    </div>
  </div>
</div>
