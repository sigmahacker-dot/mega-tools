<div class="tool-card">
  <p class="muted">Matrix A = [[a, b], [c, d]]</p>
  <div class="grid3" style="max-width:520px">
    <div class="field"><label for="eigenvalue-2x2-calculator-a">a</label><input class="input" id="eigenvalue-2x2-calculator-a" type="number" step="any" value="4"></div>
    <div class="field"><label for="eigenvalue-2x2-calculator-b">b</label><input class="input" id="eigenvalue-2x2-calculator-b" type="number" step="any" value="2"></div>
    <div class="field"><label for="eigenvalue-2x2-calculator-c">c</label><input class="input" id="eigenvalue-2x2-calculator-c" type="number" step="any" value="1"></div>
    <div class="field"><label for="eigenvalue-2x2-calculator-d">d</label><input class="input" id="eigenvalue-2x2-calculator-d" type="number" step="any" value="3"></div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="eigenvalue-2x2-calculator-calc">Calculate</button>
    <button type="button" class="btn btn-outline btn-sm" id="eigenvalue-2x2-calculator-copy">Copy results</button>
  </div>
  <div class="error" id="eigenvalue-2x2-calculator-error"></div>
  <div id="eigenvalue-2x2-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="eigenvalue-2x2-calculator-l1" style="font-size:1.05em">–</div><div class="l">λ₁</div></div>
      <div class="stat-card"><div class="v" id="eigenvalue-2x2-calculator-l2" style="font-size:1.05em">–</div><div class="l">λ₂</div></div>
      <div class="stat-card"><div class="v" id="eigenvalue-2x2-calculator-tr">–</div><div class="l">Trace</div></div>
      <div class="stat-card"><div class="v" id="eigenvalue-2x2-calculator-det">–</div><div class="l">Determinant</div></div>
    </div>
    <div class="result">
      <h3>Derivation</h3>
      <div id="eigenvalue-2x2-calculator-steps"></div>
    </div>
  </div>
</div>
