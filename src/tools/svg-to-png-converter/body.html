<div class="tool-card">
  <div class="field">
    <label for="svg-to-png-converter-code">SVG code</label>
    <textarea id="svg-to-png-converter-code" class="textarea" rows="8" placeholder="&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;&gt;…&lt;/svg&gt;"></textarea>
  </div>
  <div class="dropzone" id="svg-to-png-converter-drop">
    <span class="dz-icon">📄</span>
    <strong>Or drop an .svg file here</strong> or click to browse
    <input type="file" id="svg-to-png-converter-file" accept=".svg,image/svg+xml" class="hidden">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="svg-to-png-converter-w">Output width (px)</label>
      <input type="number" id="svg-to-png-converter-w" class="input" min="16" max="8192" value="1024">
    </div>
    <div class="field">
      <label for="svg-to-png-converter-h">Output height (px)</label>
      <input type="number" id="svg-to-png-converter-h" class="input" min="16" max="8192" value="1024">
    </div>
  </div>
  <div class="preview hidden" id="svg-to-png-converter-wrap" style="text-align:center">
    <canvas id="svg-to-png-converter-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="svg-to-png-converter-render">Render preview</button>
    <button class="btn btn-outline hidden" id="svg-to-png-converter-download">Download PNG</button>
  </div>
  <div class="error" id="svg-to-png-converter-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
