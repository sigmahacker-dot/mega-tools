<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="sp-buy">Buy price per share ($)</label><input type="number" class="input" id="sp-buy" min="0" step="any" placeholder="150"></div>
    <div class="field"><label for="sp-shares">Shares</label><input type="number" class="input" id="sp-shares" min="0" step="any" placeholder="20"></div>
    <div class="field"><label for="sp-buycomm">Buy commission ($)</label><input type="number" class="input" id="sp-buycomm" min="0" step="any" placeholder="5"></div>
    <div class="field"><label for="sp-sell">Sell price per share ($)</label><input type="number" class="input" id="sp-sell" min="0" step="any" placeholder="175"></div>
    <div class="field"><label for="sp-sellcomm">Sell commission ($)</label><input type="number" class="input" id="sp-sellcomm" min="0" step="any" placeholder="5"></div>
  </div>
  <div class="error" id="stock-profit-calculator-error"></div>
  <div class="result" id="sp-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="sp-profit">–</div><div class="l">Net profit / loss</div></div>
      <div class="stat-card"><div class="v" id="sp-ret">–</div><div class="l">Return</div></div>
      <div class="stat-card"><div class="v" id="sp-breakeven">–</div><div class="l">Breakeven price</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Item</th><th>Amount</th></tr></thead>
      <tbody id="sp-body"><tr><td colspan="2" class="muted">Enter trade details.</td></tr></tbody>
    </table>
  </div>
</div>
