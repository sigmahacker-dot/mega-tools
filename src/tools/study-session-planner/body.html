<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="study-session-planner-total">Total study hours needed</label>
      <input class="input" type="number" id="study-session-planner-total" value="20" min="0.5" max="1000" step="0.5">
    </div>
    <div class="field">
      <label for="study-session-planner-days">Days until exam</label>
      <input class="input" type="number" id="study-session-planner-days" value="7" min="1" max="365">
    </div>
  </div>
  <div class="field" style="max-width:260px">
    <label for="study-session-planner-maxday">Max hours per day</label>
    <input class="input" type="number" id="study-session-planner-maxday" value="4" min="0.5" max="24" step="0.5">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="study-session-planner-build">Build plan</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="study-session-planner-perday">—</div><div class="l">Hours / day</div></div>
    <div class="stat-card"><div class="v" id="study-session-planner-cap">—</div><div class="l">Max possible</div></div>
    <div class="stat-card"><div class="v" id="study-session-planner-status">—</div><div class="l">Plan status</div></div>
  </div>
  <div class="result" id="study-session-planner-table"></div>
  <div class="error" id="study-session-planner-error"></div>
</div>
