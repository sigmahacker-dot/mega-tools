<div class="tool-card">

    <div class="field">
      <label for="instagram-caption-templates-cat">Category</label>
      <select class="select" id="instagram-caption-templates-cat"></select>
    </div>
    <div class="field">
      <label for="instagram-caption-templates-tpl">Template</label>
      <select class="select" id="instagram-caption-templates-tpl"></select>
    </div>
  </div>
  <div id="instagram-caption-templates-blanks"></div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn" id="instagram-caption-templates-fill">Fill Caption</button>

    <button class="btn btn-outline" id="instagram-caption-templates-rand">Surprise Me</button>
  </div>
  <div class="error" id="instagram-caption-templates-error"></div>
</div>

<div class="tool-card">
  <h3>Your caption</h3>
  <p id="instagram-caption-templates-out" style="white-space:pre-wrap"></p>
