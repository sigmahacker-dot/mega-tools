<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="gpa-calculator-course">Course</label>
      <input class="input" type="text" id="gpa-calculator-course" placeholder="e.g. Math 101">
    </div>
    <div class="field">
      <label for="gpa-calculator-grade">Grade</label>
      <select class="select" id="gpa-calculator-grade">
        <option value="4.0">A+</option>
        <option value="4.0">A</option>
        <option value="3.7">A-</option>
        <option value="3.3">B+</option>
        <option value="3.0">B</option>
        <option value="2.7">B-</option>
        <option value="2.3">C+</option>
        <option value="2.0">C</option>
        <option value="1.7">C-</option>
        <option value="1.3">D+</option>
        <option value="1.0">D</option>
        <option value="0.7">D-</option>
        <option value="0.0">F</option>
      </select>
    </div>
    <div class="field">
      <label for="gpa-calculator-credits">Credits</label>
      <input class="input" type="number" id="gpa-calculator-credits" min="0" step="0.5" value="3">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="gpa-calculator-add">Add Course</button>
    <button class="btn btn-outline" id="gpa-calculator-clear">Clear All</button>
  </div>
  <div class="error" id="gpa-calculator-error"></div>
</div>

<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="gpa-calculator-gpa">—</div><div class="l">GPA (4.0 scale)</div></div>
    <div class="stat-card"><div class="v" id="gpa-calculator-creditsum">0</div><div class="l">Total credits</div></div>
    <div class="stat-card"><div class="v" id="gpa-calculator-qp">0</div><div class="l">Quality points</div></div>
  </div>
  <div id="gpa-calculator-list"></div>
</div>
