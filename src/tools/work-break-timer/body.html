<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="work-break-timer-work">Work (minutes)</label>
      <input type="number" class="input" id="work-break-timer-work" min="1" max="480" step="1" value="90">
    </div>
    <div class="field">
      <label for="work-break-timer-break">Break (minutes)</label>
      <input type="number" class="input" id="work-break-timer-break" min="1" max="180" step="1" value="20">
    </div>
  </div>
  <div style="text-align:center;margin:18px 0 6px;">
    <div class="muted" id="work-break-timer-phase" style="font-size:1rem;">Ready</div>
    <div id="work-break-timer-display" style="font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.05em;">90:00</div>
    <div class="muted" id="work-break-timer-cycles">Completed cycles: 0</div>
  </div>
  <div class="btn-row" style="justify-content:center;">
    <button class="btn btn-primary" id="work-break-timer-start" type="button">Start</button>
    <button class="btn btn-outline" id="work-break-timer-reset" type="button">Reset</button>
  </div>
  <div class="error" id="work-break-timer-error"></div>
  <p class="note" style="text-align:center;">Cycles Work → Break automatically with a chime on every switch.</p>
</div>
