<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:460px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="interval-repeater-timer-work">Work (seconds)</label>
      <input class="input" type="number" id="interval-repeater-timer-work" value="30" min="1" max="3600">
    </div>
    <div class="field" style="text-align:left">
      <label for="interval-repeater-timer-rest">Rest (seconds)</label>
      <input class="input" type="number" id="interval-repeater-timer-rest" value="10" min="1" max="3600">
    </div>
  </div>
  <div class="field" style="max-width:220px;margin:0 auto 12px;text-align:left">
    <label for="interval-repeater-timer-rounds">Rounds</label>
    <input class="input" type="number" id="interval-repeater-timer-rounds" value="5" min="1" max="99">
  </div>
  <div id="interval-repeater-timer-phase" style="font-size:28px;font-weight:700;margin:8px 0">Ready</div>
  <div class="countdown-digits" style="margin-bottom:8px"><div class="cd-cell"><span id="interval-repeater-timer-clock">0:00</span></div></div>
  <p class="muted" id="interval-repeater-timer-round">Round — of —</p>
  <div style="max-width:440px;margin:10px auto;background:#e0e0e0;border-radius:6px;height:12px;overflow:hidden">
    <div id="interval-repeater-timer-bar" style="height:100%;width:0%;background:#2e7d32;border-radius:6px"></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="interval-repeater-timer-start">Start</button>
    <button class="btn btn-outline" id="interval-repeater-timer-stop">Stop</button>
  </div>
  <div class="error" id="interval-repeater-timer-error"></div>
</div>
