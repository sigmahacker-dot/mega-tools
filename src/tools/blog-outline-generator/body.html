<div class="tool-card">
  <div class="field">
    <label for="blog-outline-generator-topic">Blog topic</label>
    <input class="input" id="blog-outline-generator-topic" type="text" placeholder="e.g. indoor plants for beginners" maxlength="80">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="blog-outline-generator-generate" type="button">Generate Outline</button>
  </div>
  <div class="error" id="blog-outline-generator-error"></div>
  <div class="mt" id="blog-outline-generator-titles"></div>
  <div class="mt" id="blog-outline-generator-outline"></div>
</div>
