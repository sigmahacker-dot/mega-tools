<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="readme-generator-name">Project name</label>
      <input class="input" id="readme-generator-name" placeholder="my-awesome-app">
    </div>
    <div class="field">
      <label for="readme-generator-tagline">Tagline / description</label>
      <input class="input" id="readme-generator-tagline" placeholder="One-line description of what it does">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="readme-generator-repo">Repository URL (optional)</label>
      <input class="input" id="readme-generator-repo" placeholder="https://github.com/user/repo">
    </div>
    <div class="field">
      <label for="readme-generator-author">Author</label>
      <input class="input" id="readme-generator-author" placeholder="Jane Doe">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="readme-generator-install">Install command</label>
      <input class="input" id="readme-generator-install" value="npm install">
    </div>
    <div class="field">
      <label for="readme-generator-license">License</label>
      <select class="input" id="readme-generator-license">
        <option>MIT</option><option>ISC</option><option>Apache-2.0</option><option>GPL-3.0</option><option>Unlicense</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="readme-generator-usage">Usage example</label>
    <textarea class="textarea" id="readme-generator-usage" rows="3" placeholder="npm start"></textarea>
  </div>
  <div class="field">
    <label for="readme-generator-features">Features (one per line)</label>
    <textarea class="textarea" id="readme-generator-features" rows="3" placeholder="Fast and lightweight&#10;Zero dependencies&#10;TypeScript support"></textarea>
  </div>
  <div class="field">
    <label>Sections to include</label>
    <div class="grid2" id="readme-generator-sections" style="gap:6px"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="readme-generator-generate">Generate README</button>
  </div>
  <div class="error" id="readme-generator-error"></div>
  <div class="field">
    <label for="readme-generator-output">README.md</label>
    <textarea class="textarea" id="readme-generator-output" rows="16" readonly placeholder="Your README will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="readme-generator-copy">Copy</button>
    <button class="btn btn-outline" id="readme-generator-download">Download README.md</button>
  </div>
</div>
