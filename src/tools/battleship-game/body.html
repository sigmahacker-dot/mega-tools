<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:520px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="battleship-game-youships">5</div><div class="l">Your ships</div></div>
    <div class="stat-card"><div class="v" id="battleship-game-foeships">5</div><div class="l">Enemy ships</div></div>
    <div class="stat-card"><div class="v" id="battleship-game-shots">0</div><div class="l">Your shots</div></div>
    <div class="stat-card"><div class="v" id="battleship-game-hits">0</div><div class="l">Your hits</div></div>
  </div>
  <p class="muted" id="battleship-game-msg" style="min-height:24px">Place your ships, then start the battle!</p>
  <div id="battleship-game-setup" style="margin-bottom:12px">
    <div class="btn-row" style="justify-content:center;flex-wrap:wrap" id="battleship-game-shiplist"></div>
    <div class="btn-row" style="justify-content:center;margin-top:8px">
      <button class="btn btn-outline" id="battleship-game-orient">Orientation: Horizontal →</button>
      <button class="btn btn-outline" id="battleship-game-auto">🎲 Auto-place</button>
      <button class="btn btn-primary" id="battleship-game-start" disabled>⚔ Start Battle</button>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center">
    <div>
      <p class="muted" style="margin:4px 0">Your waters</p>
      <div id="battleship-game-own" style="display:inline-grid;grid-template-columns:repeat(10,26px);gap:2px;background:#90a4ae;padding:5px;border-radius:6px"></div>
    </div>
    <div>
      <p class="muted" style="margin:4px 0">Enemy waters — tap to fire</p>
      <div id="battleship-game-foe" style="display:inline-grid;grid-template-columns:repeat(10,26px);gap:2px;background:#90a4ae;padding:5px;border-radius:6px"></div>
    </div>
  </div>
  <div id="battleship-game-log" class="note" style="max-width:560px;margin:12px auto 0;text-align:left;max-height:110px;overflow:auto"></div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="battleship-game-new">New game</button>
  </div>
  <div class="error" id="battleship-game-error"></div>
</div>
