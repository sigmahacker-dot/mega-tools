<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="kettlebell-workout-generator-goal">Goal</label>
      <select class="select" id="kettlebell-workout-generator-goal">
        <option value="strength">Strength</option>
        <option value="conditioning">Conditioning</option>
      </select>
    </div>
    <div class="field">
      <label for="kettlebell-workout-generator-level">Level</label>
      <select class="select" id="kettlebell-workout-generator-level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="kettlebell-workout-generator-go" type="button">Generate workout</button>
    <button class="btn btn-outline" id="kettlebell-workout-generator-copy" type="button">Copy workout</button>
  </div>
  <div class="error" id="kettlebell-workout-generator-error"></div>
  <div class="result" id="kettlebell-workout-generator-result">
    <div id="kettlebell-workout-generator-out"></div>
    <p class="note">Learn each movement with light weight first. Stop if you feel pain. For information only &mdash; not medical advice.</p>
  </div>
</div>
