<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="gradient-border-generator-width">Border width (px)</label>
      <input class="input" id="gradient-border-generator-width" type="number" value="4" min="1" max="30">
    </div>
    <div class="field">
      <label for="gradient-border-generator-radius">Corner radius (px)</label>
      <input class="input" id="gradient-border-generator-radius" type="number" value="16" min="0" max="60">
    </div>
    <div class="field">
      <label for="gradient-border-generator-angle">Angle (deg)</label>
      <input class="input" id="gradient-border-generator-angle" type="number" value="135" min="0" max="360">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="gradient-border-generator-colors">Gradient colors (one hex per line)</label>
      <textarea class="textarea" id="gradient-border-generator-colors" rows="3">#ff0080
#7928ca
#4d7c0f</textarea>
    </div>
    <div class="field">
      <label for="gradient-border-generator-inner">Inner background</label>
      <input class="input" id="gradient-border-generator-inner" type="color" value="#18181b">
      <label for="gradient-border-generator-text" style="margin-top:12px;display:block">Preview text</label>
      <input class="input" id="gradient-border-generator-text" value="Gradient border">
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="gradient-border-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:48px 24px;background:#0e0e10;display:flex;justify-content:center"></div>
  </div>
  <div class="error" id="gradient-border-generator-error"></div>
  <div class="field">
    <label for="gradient-border-generator-output">CSS</label>
    <textarea class="textarea" id="gradient-border-generator-output" rows="12" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="gradient-border-generator-copy">Copy CSS</button>
    <button class="btn btn-outline" id="gradient-border-generator-download">Download .css</button>
  </div>
</div>
