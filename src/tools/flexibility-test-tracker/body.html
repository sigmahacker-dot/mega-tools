<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="flexibility-test-tracker-gender">Gender</label>
      <select class="select" id="flexibility-test-tracker-gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="flexibility-test-tracker-age">Age</label>
      <input type="number" class="input" id="flexibility-test-tracker-age" min="10" max="110" step="1" placeholder="35">
    </div>
    <div class="field">
      <label for="flexibility-test-tracker-result-input">Sit-and-reach (cm past toes)</label>
      <input type="number" class="input" id="flexibility-test-tracker-result-input" step="any" placeholder="28">
    </div>
  </div>
  <div class="btn-row"><button class="btn" id="flexibility-test-tracker-add" type="button">Log result</button></div>
  <div class="error" id="flexibility-test-tracker-error"></div>
  <div class="result" id="flexibility-test-tracker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="flexibility-test-tracker-range">&ndash;</div><div class="l">Reference range</div></div>
      <div class="stat-card"><div class="v" id="flexibility-test-tracker-verdict">&ndash;</div><div class="l">Latest vs range</div></div>
      <div class="stat-card"><div class="v" id="flexibility-test-tracker-best">&ndash;</div><div class="l">Personal best</div></div>
    </div>
    <div id="flexibility-test-tracker-out"></div>
    <p class="note">Approximate reference ranges for illustration. For information only &mdash; not medical advice.</p>
  </div>
</div>
