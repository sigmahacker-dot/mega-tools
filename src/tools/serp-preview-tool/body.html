<div class="tool-card">
  <h2>Google SERP Preview</h2>
  <p class="muted">Pixel-aware preview of your search result on desktop and mobile.</p>
  <div class="field">
    <label for="serp-preview-tool-title">Page title</label>
    <input type="text" class="input" id="serp-preview-tool-title" placeholder="Your page title...">
  </div>
  <div class="field">
    <label for="serp-preview-tool-url">URL</label>
    <input type="text" class="input" id="serp-preview-tool-url" placeholder="https://example.com/page">
  </div>
  <div class="field">
    <label for="serp-preview-tool-desc">Meta description</label>
    <textarea class="textarea" id="serp-preview-tool-desc" rows="3" placeholder="Your meta description..."></textarea>
  </div>
  <div class="error" id="serp-preview-tool-error"></div>
  <div class="result" id="serp-preview-tool-result">
    <div class="field">
      <label>Desktop preview (600 px)</label>
      <div id="serp-preview-tool-desktop" style="max-width:600px;border:1px solid #e5e7eb;border-radius:8px;padding:14px;background:#fff;"></div>
    </div>
    <div class="field">
      <label>Mobile preview (360 px)</label>
      <div id="serp-preview-tool-mobile" style="max-width:360px;border:1px solid #e5e7eb;border-radius:8px;padding:14px;background:#fff;"></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Title</th><td id="serp-preview-tool-title-stat">–</td></tr>
        <tr><th scope="row">Description</th><td id="serp-preview-tool-desc-stat">–</td></tr>
      </tbody>
    </table>
    <p class="note">Pixel widths are approximated with canvas measurement (Arial) — Google's exact rendering may differ slightly.</p>
  </div>
</div>
