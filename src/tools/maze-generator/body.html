<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="maze-generator-size">Maze size</label>
      <select class="input" id="maze-generator-size">
        <option value="11">Small — 11 × 11</option>
        <option value="21" selected>Medium — 21 × 21</option>
        <option value="31">Large — 31 × 31</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="maze-generator-new" style="width:100%">New maze</button>
    </div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="maze-generator-moves">0</div><div class="l">Moves</div></div>
  </div>
  <p class="muted" id="maze-generator-msg" style="min-height:24px">Guide the red dot to the green goal!</p>
  <canvas id="maze-generator-canvas" width="440" height="440" style="max-width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);touch-action:none"></canvas>
  <div style="display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px">
    <span></span>
    <button class="btn btn-outline" id="maze-generator-up" style="height:48px;font-size:20px">▲</button>
    <span></span>
    <button class="btn btn-outline" id="maze-generator-left" style="height:48px;font-size:20px">◀</button>
    <button class="btn btn-outline" id="maze-generator-down" style="height:48px;font-size:20px">▼</button>
    <button class="btn btn-outline" id="maze-generator-right" style="height:48px;font-size:20px">▶</button>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-outline" id="maze-generator-solve">🗺 Show Solution</button>
  </div>
  <div class="error" id="maze-generator-error"></div>
</div>
