<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="trading-card-maker-file">Card artwork</label>
      <input type="file" id="trading-card-maker-file" accept="image/*" class="input">
    </div>
    <div class="field">
      <label for="trading-card-maker-name">Card name</label>
      <input type="text" id="trading-card-maker-name" class="input" value="Ember Drake" maxlength="30">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="trading-card-maker-element">Element</label>
      <select class="select" id="trading-card-maker-element">
        <option value="fire">🔥 Fire</option>
        <option value="water">💧 Water</option>
        <option value="earth">🌍 Earth</option>
        <option value="air">🌪️ Air</option>
        <option value="shadow">🌑 Shadow</option>
        <option value="light">✨ Light</option>
      </select>
    </div>
    <div class="field">
      <label for="trading-card-maker-rarity">Rarity</label>
      <select class="select" id="trading-card-maker-rarity">
        <option value="common">Common</option>
        <option value="rare">Rare</option>
        <option value="epic">Epic</option>
        <option value="legendary">Legendary</option>
      </select>
    </div>
    <div class="field">
      <label for="trading-card-maker-hp">HP: <span id="trading-card-maker-hp-val">120</span></label>
      <input type="range" id="trading-card-maker-hp" min="10" max="300" value="120" step="10">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="trading-card-maker-atk">Attack: <span id="trading-card-maker-atk-val">80</span></label>
      <input type="range" id="trading-card-maker-atk" min="0" max="200" value="80" step="5">
    </div>
    <div class="field">
      <label for="trading-card-maker-def">Defense: <span id="trading-card-maker-def-val">60</span></label>
      <input type="range" id="trading-card-maker-def" min="0" max="200" value="60" step="5">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="trading-card-maker-download">Download card</button>
  </div>
  <div class="result">
    <canvas id="trading-card-maker-canvas" style="width:100%;max-width:340px;border-radius:12px;"></canvas>
  </div>
  <div class="error" id="trading-card-maker-error"></div>
  <p class="note">Your artwork stays on your device — the card is rendered locally in your browser.</p>
</div>
