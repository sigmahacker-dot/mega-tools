<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="business-name-generator-industry">Industry</label>
      <select class="select" id="business-name-generator-industry">
        <option value="tech">Tech</option>
        <option value="food">Food</option>
        <option value="fashion">Fashion</option>
        <option value="fitness">Fitness</option>
        <option value="travel">Travel</option>
        <option value="finance">Finance</option>
        <option value="beauty">Beauty</option>
        <option value="pets">Pets</option>
      </select>
    </div>
    <div class="field">
      <label for="business-name-generator-count">How many</label>
      <select class="select" id="business-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="business-name-generator-domain"><input type="checkbox" id="business-name-generator-domain"> Show domain-style version (e.g. novacloud.io)</label>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="business-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="business-name-generator-error"></div>
  <div class="mt" id="business-name-generator-list"></div>
</div>
