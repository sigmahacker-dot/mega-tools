<div class="tool-card">
  <div class="field">
    <label for="percentage-mode">Calculation type</label>
    <select class="select" id="percentage-mode">
      <option value="of" selected>X% of Y</option>
      <option value="what">X is what % of Y</option>
      <option value="change">% increase / decrease from X to Y</option>
    </select>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="percentage-x" id="percentage-x-label">X</label>
      <input type="number" class="input" id="percentage-x" step="any" placeholder="e.g. 20">
    </div>
    <div class="field">
      <label for="percentage-y" id="percentage-y-label">Y</label>
      <input type="number" class="input" id="percentage-y" step="any" placeholder="e.g. 150">
    </div>
  </div>
  <div class="error" id="percentage-calculator-error"></div>
  <div class="result" id="percentage-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="percentage-value">–</div><div class="l" id="percentage-value-label">Result</div></div>
    </div>
    <p class="muted" id="percentage-explain"></p>
  </div>
</div>
