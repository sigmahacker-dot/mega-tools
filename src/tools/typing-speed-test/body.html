<div class="tool-card">
  <p class="note">Type the paragraph below as fast and accurately as you can. The 60-second timer starts on your first keystroke. Pasting is disabled — every score is genuinely typed.</p>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="typing-speed-test-new">New Test</button>
    <button type="button" class="btn btn-outline" id="typing-speed-test-restart">Restart</button>
  </div>
  <div class="error" id="typing-speed-test-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="typing-speed-test-time">60</div><div class="l">Seconds left</div></div>
    <div class="stat-card"><div class="v" id="typing-speed-test-wpm">0</div><div class="l">WPM (live)</div></div>
    <div class="stat-card"><div class="v" id="typing-speed-test-acc">100%</div><div class="l">Accuracy</div></div>
  </div>
  <div class="progress"><div id="typing-speed-test-bar" style="width:100%"></div></div>
  <div id="typing-speed-test-text" class="type-text mt"></div>
  <div class="field mt">
    <label for="typing-speed-test-input">Type here</label>
    <textarea id="typing-speed-test-input" class="textarea" rows="4" placeholder="Click here and start typing…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  </div>
  <div class="result hidden" id="typing-speed-test-result"></div>
  <style>
    .type-text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.02rem;line-height:1.9;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 16px;user-select:none}
    .type-text span{border-radius:3px;padding:1px 0}
    .type-text span.ok{background:#dcfce7;color:#15803d}
    .type-text span.bad{background:#fee2e2;color:#b91c1c}
    .type-text span.cur{border-bottom:3px solid #4f46e5}
  </style>
</div>
