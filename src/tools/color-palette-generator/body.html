<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="color-palette-generator-base">Base color</label>
      <input type="color" class="input" id="color-palette-generator-base" value="#4D7C0F" style="height:48px;padding:4px;">
    </div>
    <div class="field">
      <label for="color-palette-generator-hex">Hex code</label>
      <input type="text" class="input" id="color-palette-generator-hex" value="#4D7C0F" maxlength="7" spellcheck="false">
    </div>
  </div>
  <div class="error" id="color-palette-generator-error"></div>
  <div class="result" id="color-palette-generator-result">
    <div id="color-palette-generator-rows"></div>
    <p class="muted" id="color-palette-generator-status">Click any swatch to copy its hex code.</p>
  </div>
</div>
