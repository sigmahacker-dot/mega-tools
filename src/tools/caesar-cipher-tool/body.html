<div class="tool-card">
  <div class="field">
    <label for="caesar-cipher-tool-input">Input text</label>
    <textarea class="textarea" id="caesar-cipher-tool-input" rows="5" placeholder="Type text to encode, decode or crack"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="caesar-cipher-tool-shift">Shift (1–25)</label>
      <input class="input" type="number" id="caesar-cipher-tool-shift" min="1" max="25" value="3">
    </div>
    <div class="field">
      <label for="caesar-cipher-tool-mode">Mode</label>
      <select class="input" id="caesar-cipher-tool-mode">
        <option value="encode">Encode</option>
        <option value="decode">Decode</option>
        <option value="crack">Crack (show all 25 shifts)</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="caesar-cipher-tool-run">Run</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="caesar-cipher-tool-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="caesar-cipher-tool-copy">Copy output</button></div>
  </div>
  <div class="error" id="caesar-cipher-tool-error"></div>
</div>
