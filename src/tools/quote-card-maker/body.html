<div class="tool-card">
  <h2>Quote Card Maker</h2>
  <p class="muted">1080×1080 quote cards for social media — live preview, one-click PNG download.</p>
  <div class="grid2">
    <div class="field" style="grid-column:1/-1">
      <label for="quote-card-maker-quote">Quote</label>
      <textarea class="textarea" id="quote-card-maker-quote" rows="3">The best way to predict the future is to create it.</textarea>
    </div>
    <div class="field">
      <label for="quote-card-maker-author">Author</label>
      <input type="text" class="input" id="quote-card-maker-author" value="Peter Drucker">
    </div>
    <div class="field">
      <label for="quote-card-maker-theme">Theme</label>
      <select class="input" id="quote-card-maker-theme">
        <option value="midnight">Midnight</option>
        <option value="sunset">Sunset</option>
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="paper">Paper (light)</option>
        <option value="royal">Royal</option>
      </select>
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" style="display:flex;justify-content:center">
    <canvas id="quote-card-maker-canvas" width="1080" height="1080" style="max-width:420px;width:100%;height:auto;border-radius:12px"></canvas>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="quote-card-maker-download">⬇ Download PNG</button>
  </div>
  <div class="error" id="quote-card-maker-error"></div>
</div>
