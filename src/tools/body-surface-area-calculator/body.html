<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="body-surface-area-calculator-units">Units</label>
      <select class="select" id="body-surface-area-calculator-units">
        <option value="metric">Metric (kg / cm)</option>
        <option value="imperial">Imperial (lb / in)</option>
      </select>
    </div>
    <div class="field">
      <label for="body-surface-area-calculator-weight">Weight</label>
      <input type="number" class="input" id="body-surface-area-calculator-weight" min="0" step="any" placeholder="70">
    </div>
    <div class="field">
      <label for="body-surface-area-calculator-height">Height</label>
      <input type="number" class="input" id="body-surface-area-calculator-height" min="0" step="any" placeholder="175">
    </div>
  </div>
  <div class="error" id="body-surface-area-calculator-error"></div>
  <div class="result" id="body-surface-area-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="body-surface-area-calculator-dubois">&ndash;</div><div class="l">BSA (DuBois)</div></div>
      <div class="stat-card"><div class="v" id="body-surface-area-calculator-mosteller">&ndash;</div><div class="l">BSA (Mosteller)</div></div>
    </div>
    <p class="note">BSA in m&sup2;. For information only &mdash; not medical advice.</p>
  </div>
</div>
