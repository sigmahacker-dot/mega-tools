<div class="tool-card">
  <div class="field">
    <label for="css-minifier-input">CSS input</label>
    <textarea class="textarea code" id="css-minifier-input" rows="10" placeholder="Paste your CSS here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="css-minifier-minify" type="button">Minify CSS</button>
    <button class="btn btn-outline" id="css-minifier-clear" type="button">Clear</button>
  </div>
  <div class="error" id="css-minifier-error"></div>
  <div class="stat-cards hidden mt" id="css-minifier-stats">
    <div class="stat-card"><div class="v" id="css-minifier-orig">0 B</div><div class="l">Original</div></div>
    <div class="stat-card"><div class="v" id="css-minifier-min">0 B</div><div class="l">Minified</div></div>
    <div class="stat-card"><div class="v" id="css-minifier-saved">0%</div><div class="l">Saved</div></div>
  </div>
  <div class="result hidden" id="css-minifier-result">
    <pre id="css-minifier-output"></pre>
    <div class="btn-row mt">
      <button class="btn btn-sm" id="css-minifier-copy" type="button">Copy</button>
      <button class="btn btn-sm btn-outline" id="css-minifier-download" type="button">Download .css</button>
    </div>
  </div>
  <p class="note">Regex-based minifier, safe for normal CSS. Runs entirely in your browser — nothing is uploaded.</p>
</div>
