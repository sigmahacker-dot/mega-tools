<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="roth-vs-traditional-calculator-contrib">Annual contribution ($)</label>
      <input type="number" class="input" id="roth-vs-traditional-calculator-contrib" min="0" step="any" placeholder="7000">
    </div>
    <div class="field">
      <label for="roth-vs-traditional-calculator-years">Years invested</label>
      <input type="number" class="input" id="roth-vs-traditional-calculator-years" min="1" max="70" step="1" placeholder="30">
    </div>
    <div class="field">
      <label for="roth-vs-traditional-calculator-return">Expected annual return (%)</label>
      <input type="number" class="input" id="roth-vs-traditional-calculator-return" min="0" max="30" step="any" placeholder="7">
    </div>
    <div class="field">
      <label for="roth-vs-traditional-calculator-curtax">Current tax rate (%)</label>
      <input type="number" class="input" id="roth-vs-traditional-calculator-curtax" min="0" max="100" step="any" placeholder="24">
    </div>
    <div class="field">
      <label for="roth-vs-traditional-calculator-rettax">Retirement tax rate (%)</label>
      <input type="number" class="input" id="roth-vs-traditional-calculator-rettax" min="0" max="100" step="any" placeholder="22">
    </div>
  </div>
  <div class="error" id="roth-vs-traditional-calculator-error"></div>
  <div class="result" id="roth-vs-traditional-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="roth-vs-traditional-calculator-roth">&ndash;</div><div class="l">Roth after-tax value</div></div>
      <div class="stat-card"><div class="v" id="roth-vs-traditional-calculator-trad">&ndash;</div><div class="l">Traditional after-tax value</div></div>
      <div class="stat-card"><div class="v" id="roth-vs-traditional-calculator-diff">&ndash;</div><div class="l">Difference</div></div>
    </div>
    <p class="note" id="roth-vs-traditional-calculator-verdict"></p>
    <p class="note">For information only &mdash; not financial advice. Simplified model; ignores limits, RMDs, and state taxes.</p>
  </div>
</div>
