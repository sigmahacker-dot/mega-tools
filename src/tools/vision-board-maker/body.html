<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="vision-board-maker-files">Upload images</label>
      <input class="input" type="file" id="vision-board-maker-files" accept="image/*" multiple>
    </div>
    <div class="field">
      <label for="vision-board-maker-theme">Background theme</label>
      <select class="select" id="vision-board-maker-theme">
        <option value="dark">Midnight</option>
        <option value="light">Paper</option>
        <option value="green">Forest</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="vision-board-maker-text">Affirmations (one per line)</label>
    <textarea class="textarea" id="vision-board-maker-text" rows="4" placeholder="I am calm and focused&#10;I attract good opportunities"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="vision-board-maker-build">Build Board</button>
    <button class="btn btn-outline" id="vision-board-maker-shuffle">Shuffle</button>
    <button class="btn btn-outline" id="vision-board-maker-dl">Download PNG</button>
  </div>
  <div class="error" id="vision-board-maker-error"></div>
</div>

<div class="tool-card">
  <canvas id="vision-board-maker-canvas" width="1200" height="900" style="width:100%;height:auto;border-radius:12px"></canvas>
  <p class="muted" id="vision-board-maker-status">Add images and affirmations, then click Build Board.</p>
</div>
