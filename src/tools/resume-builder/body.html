<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="resume-builder-name">Full name</label>
      <input class="input" id="resume-builder-name" type="text" placeholder="Jane Doe">
    </div>
    <div class="field">
      <label for="resume-builder-title">Professional title</label>
      <input class="input" id="resume-builder-title" type="text" placeholder="Software Engineer">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="resume-builder-email">Email</label>
      <input class="input" id="resume-builder-email" type="email" placeholder="jane@example.com">
    </div>
    <div class="field">
      <label for="resume-builder-phone">Phone</label>
      <input class="input" id="resume-builder-phone" type="text" placeholder="+92 300 0000000">
    </div>
  </div>
  <div class="field">
    <label for="resume-builder-location">Location</label>
    <input class="input" id="resume-builder-location" type="text" placeholder="Lahore, Pakistan">
  </div>
  <div class="field">
    <label for="resume-builder-summary">Summary</label>
    <textarea class="textarea" id="resume-builder-summary" rows="3" placeholder="2-3 sentences about yourself..."></textarea>
  </div>
  <div class="field">
    <label for="resume-builder-experience">Experience (one per line: Role @ Company (years))</label>
    <textarea class="textarea" id="resume-builder-experience" rows="4" placeholder="Software Engineer @ Acme (2022–2025)"></textarea>
  </div>
  <div class="field">
    <label for="resume-builder-education">Education (one per line)</label>
    <textarea class="textarea" id="resume-builder-education" rows="2" placeholder="BS Computer Science, University of Punjab (2021)"></textarea>
  </div>
  <div class="field">
    <label for="resume-builder-skills">Skills (comma separated)</label>
    <input class="input" id="resume-builder-skills" type="text" placeholder="JavaScript, Python, Project Management">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="resume-builder-print">Print / Save as PDF</button>
  </div>
  <div class="error" id="resume-builder-error"></div>
  <div class="mt" id="resume-builder-preview"></div>
  <p class="note">Use your browser's Print → Save as PDF. Only the resume prints — the form is hidden.</p>
</div>
