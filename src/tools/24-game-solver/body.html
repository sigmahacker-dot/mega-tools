<div class="tool-card">
  <div class="grid2" style="max-width:440px">
    <div class="field"><label for="24-game-solver-n0">Number 1</label><input class="input" id="24-game-solver-n0" type="number" step="any" value="3"></div>
    <div class="field"><label for="24-game-solver-n1">Number 2</label><input class="input" id="24-game-solver-n1" type="number" step="any" value="3"></div>
    <div class="field"><label for="24-game-solver-n2">Number 3</label><input class="input" id="24-game-solver-n2" type="number" step="any" value="8"></div>
    <div class="field"><label for="24-game-solver-n3">Number 4</label><input class="input" id="24-game-solver-n3" type="number" step="any" value="8"></div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="24-game-solver-solve">Solve</button>
    <button type="button" class="btn btn-outline" id="24-game-solver-random">Random puzzle</button>
  </div>
  <div class="error" id="24-game-solver-error"></div>
  <div id="24-game-solver-out" class="hidden">
    <div class="result">
      <h3 id="24-game-solver-title">Solutions</h3>
      <ol id="24-game-solver-list" style="font-family:monospace;font-size:1.1em"></ol>
      <p class="muted" id="24-game-solver-stats"></p>
    </div>
  </div>
</div>
