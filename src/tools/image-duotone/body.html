<div class="tool-card">
  <div class="dropzone" id="image-duotone-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-duotone-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-duotone-wrap" style="text-align:center">
    <canvas id="image-duotone-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="image-duotone-dark">Shadow color</label>
      <input type="color" id="image-duotone-dark" class="input" value="#1a1a2e">
    </div>
    <div class="field">
      <label for="image-duotone-light">Highlight color</label>
      <input type="color" id="image-duotone-light" class="input" value="#e94560">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-duotone-download">Download PNG</button>
  </div>
  <div class="error" id="image-duotone-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
