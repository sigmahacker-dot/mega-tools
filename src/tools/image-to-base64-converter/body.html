<div class="tool-card">
  <div class="field"><label for="b64-file">Choose an image</label><input type="file" class="input" id="b64-file" accept="image/*"></div>
  <div class="error" id="image-to-base64-converter-error"></div>
  <div class="result" id="b64-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="b64-orig">–</div><div class="l">Original size</div></div>
      <div class="stat-card"><div class="v" id="b64-out">–</div><div class="l">Base64 size</div></div>
      <div class="stat-card"><div class="v" id="b64-growth">–</div><div class="l">Growth</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Preview</label><img id="b64-img" alt="preview" style="max-width:100%;border-radius:12px;display:none"></div>
      <div class="field"><label for="b64-text">Data URL</label><textarea class="textarea" id="b64-text" rows="8" readonly placeholder="The base64 data URL appears here..."></textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="b64-copy" type="button">Copy data URL</button>
      <button class="btn btn-outline" id="b64-dl" type="button">Download .txt</button>
    </div>
  </div>
</div>
