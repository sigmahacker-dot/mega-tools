<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="spelling-bee-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="spelling-bee-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="spelling-bee-game-done">0/60</div><div class="l">Words</div></div>
  </div>
  <button class="btn btn-outline" id="spelling-bee-game-hear" disabled style="font-size:40px;padding:10px 26px;margin:8px 0">🔊</button>
  <div id="spelling-bee-game-def" style="font-size:18px;max-width:520px;margin:8px auto;min-height:52px;line-height:1.5;font-style:italic">Press Start, then listen and spell the word!</div>
  <p class="muted" id="spelling-bee-game-msg" style="min-height:24px"></p>
  <div class="grid2" style="max-width:420px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="spelling-bee-game-guess">Spell the word</label>
      <input class="input" id="spelling-bee-game-guess" placeholder="Type the spelling…" autocomplete="off" autocapitalize="off" disabled>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="spelling-bee-game-submit" style="width:100%" disabled>Check</button>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="spelling-bee-game-start">▶ Start</button>
    <button class="btn btn-outline" id="spelling-bee-game-skip" disabled>Skip ↷</button>
  </div>
  <div class="error" id="spelling-bee-game-error"></div>
</div>
