<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="attendance-tracker-name">Student name</label>
      <input class="input" type="text" id="attendance-tracker-name" placeholder="e.g. Ayesha Khan">
    </div>
    <div class="field">
      <label for="attendance-tracker-date">Date</label>
      <input class="input" type="date" id="attendance-tracker-date">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="attendance-tracker-add">Add Student</button>
    <button class="btn btn-outline" id="attendance-tracker-markall">Mark All Present</button>
  </div>
  <div class="error" id="attendance-tracker-error"></div>
</div>

<div class="tool-card">
  <h3>Roster — <span id="attendance-tracker-datelabel"></span></h3>
  <div id="attendance-tracker-roster"></div>
</div>

<div class="tool-card">
  <h3>Attendance summary</h3>
  <div id="attendance-tracker-summary"></div>
</div>
