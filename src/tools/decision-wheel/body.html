<div class="tool-card">
  <div class="field">
    <label for="decision-wheel-options">Options (one per line, 2–12)</label>
    <textarea class="textarea" id="decision-wheel-options" rows="5" placeholder="Pizza&#10;Burgers&#10;Sushi" spellcheck="false"></textarea>
  </div>
  <div class="center">
    <canvas id="decision-wheel-canvas" width="340" height="340" class="dw-canvas" aria-label="Decision wheel"></canvas>
  </div>
  <div class="btn-row center">
    <button type="button" class="btn btn-primary" id="decision-wheel-spin">SPIN</button>
  </div>
  <div class="error" id="decision-wheel-error"></div>
  <div class="result center" id="decision-wheel-result">
    <p class="muted">Add your options, then spin.</p>
  </div>
  <style>
    .dw-canvas{max-width:100%;height:auto}
    .dw-win{font-size:1.25rem;margin:8px 0}
    .dw-win strong{color:#15803d}
  </style>
</div>
