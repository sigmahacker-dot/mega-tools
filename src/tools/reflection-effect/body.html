<div class="tool-card">
  <div class="field">
    <label for="reflection-effect-file">Photo</label>
    <input type="file" id="reflection-effect-file" accept="image/*" class="input">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="reflection-effect-height">Reflection height: <span id="reflection-effect-height-val">45</span>%</label>
      <input type="range" id="reflection-effect-height" min="10" max="100" value="45">
    </div>
    <div class="field">
      <label for="reflection-effect-gap">Gap: <span id="reflection-effect-gap-val">8</span>px</label>
      <input type="range" id="reflection-effect-gap" min="0" max="60" value="8">
    </div>
    <div class="field">
      <label for="reflection-effect-fade">Start opacity: <span id="reflection-effect-fade-val">55</span>%</label>
      <input type="range" id="reflection-effect-fade" min="10" max="100" value="55">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="reflection-effect-download">Download image</button>
  </div>
  <div class="result">
    <canvas id="reflection-effect-canvas" style="width:100%;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="reflection-effect-error"></div>
  <p class="note">The reflection is flipped artwork with a gradient fade — rendered locally in your browser.</p>
</div>
