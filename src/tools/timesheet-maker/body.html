<div class="tool-card">
  <div style="overflow-x:auto">
  <table class="data">
    <thead><tr><th>Day</th><th>Start</th><th>End</th><th>Unpaid break (min)</th><th>Hours</th></tr></thead>
    <tbody id="timesheet-maker-rows"></tbody>
  </table>
  </div>
  <div class="btn-row" style="margin-top:10px">
    <button type="button" class="btn" id="timesheet-maker-calc">Calculate</button>
    <button type="button" class="btn btn-outline btn-sm" id="timesheet-maker-copy">Copy summary</button>
    <button type="button" class="btn btn-outline btn-sm" id="timesheet-maker-clear">Clear</button>
  </div>
  <div class="error" id="timesheet-maker-error"></div>
  <div id="timesheet-maker-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="timesheet-maker-total">–</div><div class="l">Total hours</div></div>
      <div class="stat-card"><div class="v" id="timesheet-maker-reg">–</div><div class="l">Regular (≤40)</div></div>
      <div class="stat-card"><div class="v" id="timesheet-maker-ot">–</div><div class="l">Overtime (&gt;40)</div></div>
    </div>
  </div>
</div>
