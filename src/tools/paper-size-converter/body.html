<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="paper-size-converter-size">Paper size</label>
      <select class="select" id="paper-size-converter-size"></select>
    </div>
    <div class="field">
      <label for="paper-size-converter-dpi">DPI (for pixel size)</label>
      <input type="number" class="input" id="paper-size-converter-dpi" min="1" max="2400" step="1" value="300">
    </div>
  </div>
  <div class="error" id="paper-size-converter-error"></div>
  <div class="result" id="paper-size-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="paper-size-converter-mm">–</div><div class="l">Millimetres (W × H)</div></div>
      <div class="stat-card"><div class="v" id="paper-size-converter-in">–</div><div class="l">Inches (W × H)</div></div>
      <div class="stat-card"><div class="v" id="paper-size-converter-px">–</div><div class="l">Pixels at DPI</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Property</th><th>Value</th></tr></thead>
      <tbody id="paper-size-converter-body"></tbody>
    </table>
  </div>
</div>
