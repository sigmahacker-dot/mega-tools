<div class="tool-card">
  <div class="field">
    <label for="karaoke-voice-reducer-file">Stereo audio file</label>
    <input type="file" id="karaoke-voice-reducer-file" accept="audio/*" class="input">
    <span class="hint">Needs a real stereo file — mono files can't be processed.</span>
  </div>
  <div class="field">
    <label for="karaoke-voice-reducer-level">Reduction strength: <span id="karaoke-voice-reducer-level-val">100</span>%</label>
    <input type="range" id="karaoke-voice-reducer-level" min="0" max="100" value="100">
  </div>
  <p class="muted" id="karaoke-voice-reducer-info"></p>
  <div class="btn-row">
    <button class="btn btn-primary" id="karaoke-voice-reducer-go">Reduce vocals</button>
    <button class="btn btn-outline hidden" id="karaoke-voice-reducer-play">Preview</button>
    <button class="btn btn-outline hidden" id="karaoke-voice-reducer-download">Download WAV</button>
  </div>
  <div class="error" id="karaoke-voice-reducer-error"></div>
  <p class="note"><strong>Honest limits:</strong> L−R cancels everything panned center — lead vocals, but also kick, bass and snare. Stereo/off-center vocals and effects survive. Results vary per track.</p>
</div>
