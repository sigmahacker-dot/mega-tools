<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="complex-number-calculator-a">First number — real part (a)</label>
      <input type="number" class="input" id="complex-number-calculator-a" step="any" placeholder="e.g. 3">
    </div>
    <div class="field">
      <label for="complex-number-calculator-b">First number — imaginary part (b)</label>
      <input type="number" class="input" id="complex-number-calculator-b" step="any" placeholder="e.g. 4">
    </div>
    <div class="field">
      <label for="complex-number-calculator-op">Operation</label>
      <select class="select" id="complex-number-calculator-op">
        <option value="add">+ &nbsp;Add</option>
        <option value="sub">− &nbsp;Subtract</option>
        <option value="mul" selected>× &nbsp;Multiply</option>
        <option value="div">÷ &nbsp;Divide</option>
      </select>
    </div>
    <div class="field">
      <label for="complex-number-calculator-c">Second number — real part (c)</label>
      <input type="number" class="input" id="complex-number-calculator-c" step="any" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="complex-number-calculator-d">Second number — imaginary part (d)</label>
      <input type="number" class="input" id="complex-number-calculator-d" step="any" placeholder="e.g. -2">
    </div>
  </div>
  <div class="error" id="complex-number-calculator-error"></div>
  <div class="result" id="complex-number-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="complex-number-calculator-res">–</div><div class="l">Result</div></div>
      <div class="stat-card"><div class="v" id="complex-number-calculator-mod">–</div><div class="l">|Result| (modulus)</div></div>
      <div class="stat-card"><div class="v" id="complex-number-calculator-arg">–</div><div class="l">Argument (degrees)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Value</th><th>a+bi form</th><th>Modulus</th><th>Conjugate</th></tr></thead>
      <tbody id="complex-number-calculator-body">
        <tr><td colspan="4" class="muted">Enter both complex numbers to calculate.</td></tr>
      </tbody>
    </table>
  </div>
</div>
