<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="gratitude-journal-streak">0</div><div class="l">Day streak</div></div>
    <div class="stat-card"><div class="v" id="gratitude-journal-total">0</div><div class="l">Days completed</div></div>
  </div>
  <div class="field">
    <label for="gratitude-journal-g1">1.</label>
    <input class="input" type="text" id="gratitude-journal-g1" placeholder="Something you're grateful for…">
  </div>
  <div class="field">
    <label for="gratitude-journal-g2">2.</label>
    <input class="input" type="text" id="gratitude-journal-g2" placeholder="Something else…">
  </div>
  <div class="field">
    <label for="gratitude-journal-g3">3.</label>
    <input class="input" type="text" id="gratitude-journal-g3" placeholder="One more…">
  </div>
  <div class="btn-row">
    <button class="btn" id="gratitude-journal-save">Save Today's Gratitudes</button>
  </div>
  <div class="error" id="gratitude-journal-error"></div>
</div>

<div class="tool-card">
  <h3>History</h3>
  <div id="gratitude-journal-list"></div>
</div>
