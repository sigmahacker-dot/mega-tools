<div class="tool-card">
  <div class="field">
    <label for="morse-code-translator-input">Input text</label>
    <textarea class="textarea" id="morse-code-translator-input" rows="5" placeholder="Type text to encode, or Morse like .... . .-.. .-.. --- to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="morse-code-translator-mode">Mode</label>
      <select class="input" id="morse-code-translator-mode">
        <option value="encode">Encode (text → Morse)</option>
        <option value="decode">Decode (Morse → text)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="morse-code-translator-run">Convert</button>
        <button class="btn btn-outline" id="morse-code-translator-play">▶ Play</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="morse-code-translator-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="morse-code-translator-copy">Copy output</button></div>
  </div>
  <p class="hint">Letters are separated by spaces, words by <span class="code">/</span>.</p>
  <div class="error" id="morse-code-translator-error"></div>
</div>
