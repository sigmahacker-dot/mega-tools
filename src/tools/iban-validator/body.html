<div class="tool-card">
  <div class="field">
    <label for="iban-value">IBAN</label>
    <input type="text" class="input" id="iban-value" placeholder="DE89 3704 0044 0532 0130 00" autocomplete="off" spellcheck="false">
  </div>
  <div class="error" id="iban-validator-error"></div>
  <div class="result" id="iban-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="iban-status">–</div><div class="l">Checksum</div></div>
      <div class="stat-card"><div class="v" id="iban-country">–</div><div class="l">Country code</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Formatted IBAN</th><td id="iban-formatted">–</td></tr>
      </tbody>
    </table>
    <p class="note">Checks the ISO 13616 structure and mod-97 checksum. It cannot verify that the account exists.</p>
  </div>
</div>
