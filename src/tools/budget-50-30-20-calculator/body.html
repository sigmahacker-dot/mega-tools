<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="b50-income">Monthly take-home pay ($)</label><input type="number" class="input" id="b50-income" min="0" step="any" placeholder="4000"></div>
    <div class="field"><label for="b50-aneeds">Actual needs spending ($) — optional</label><input type="number" class="input" id="b50-aneeds" min="0" step="any" placeholder=""></div>
    <div class="field"><label for="b50-awants">Actual wants spending ($) — optional</label><input type="number" class="input" id="b50-awants" min="0" step="any" placeholder=""></div>
    <div class="field"><label for="b50-asave">Actual savings ($) — optional</label><input type="number" class="input" id="b50-asave" min="0" step="any" placeholder=""></div>
  </div>
  <div class="error" id="budget-50-30-20-calculator-error"></div>
  <div class="result" id="b50-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="b50-needs">–</div><div class="l">Needs (50%)</div></div>
      <div class="stat-card"><div class="v" id="b50-wants">–</div><div class="l">Wants (30%)</div></div>
      <div class="stat-card"><div class="v" id="b50-save">–</div><div class="l">Savings (20%)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Bucket</th><th>Target</th><th>Actual</th><th>Difference</th></tr></thead>
      <tbody id="b50-body"><tr><td colspan="4" class="muted">Enter your take-home pay.</td></tr></tbody>
    </table>
    <p class="note">Actuals are optional — leave blank to see targets only.</p>
  </div>
</div>
