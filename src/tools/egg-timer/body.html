<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="justify-content:center;margin-bottom:12px">
    <button class="btn btn-outline" data-egg="6">🥚 Soft · 6 min</button>
    <button class="btn btn-outline" data-egg="8">🍳 Medium · 8 min</button>
    <button class="btn btn-outline" data-egg="10">🥚 Hard · 10 min</button>
  </div>
  <div class="field" style="max-width:220px;margin:0 auto 12px;text-align:left">
    <label for="egg-timer-custom">Custom (minutes)</label>
    <input class="input" type="number" id="egg-timer-custom" min="1" max="60" placeholder="e.g. 7">
  </div>
  <div class="countdown-digits" style="margin-bottom:8px"><div class="cd-cell"><span id="egg-timer-clock">0:00</span></div></div>
  <p class="muted" id="egg-timer-status" style="min-height:24px">Times assume eggs go into already-boiling water.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="egg-timer-start">Start</button>
    <button class="btn btn-outline" id="egg-timer-stop">Stop</button>
  </div>
  <div class="error" id="egg-timer-error"></div>
</div>
