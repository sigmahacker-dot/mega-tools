<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="photo-print-size-calculator-pw">Pixel width</label>
      <input type="number" step="1" min="0" class="input" id="photo-print-size-calculator-pw" placeholder="e.g. 6000">
    </div>
    <div class="field">
      <label for="photo-print-size-calculator-ph">Pixel height</label>
      <input type="number" step="1" min="0" class="input" id="photo-print-size-calculator-ph" placeholder="e.g. 4000">
    </div>
  </div>
  <div class="field">
    <label for="photo-print-size-calculator-dpi">Print resolution (DPI)</label>
    <input type="number" step="any" min="0" class="input" id="photo-print-size-calculator-dpi" placeholder="e.g. 300" value="300">
  </div>
  <div class="error" id="photo-print-size-calculator-error"></div>
  <div class="result" id="photo-print-size-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="photo-print-size-calculator-inches">–</div><div class="l">Print size (inches)</div></div>
      <div class="stat-card"><div class="v" id="photo-print-size-calculator-cm">–</div><div class="l">Print size (cm)</div></div>
      <div class="stat-card"><div class="v" id="photo-print-size-calculator-quality">–</div><div class="l">Print quality</div></div>
    </div>
    <p class="note" id="photo-print-size-calculator-note">Enter pixel dimensions and DPI to see the print size.</p>
  </div>
</div>
