<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="projector-throw-calculator-mode">Screen input</label>
      <select class="select" id="projector-throw-calculator-mode">
        <option value="diag" selected>16:9 diagonal</option>
        <option value="width">Screen width</option>
      </select>
    </div>
    <div class="field">
      <label for="projector-throw-calculator-size">Size (inches)</label>
      <input type="number" step="any" min="0" class="input" id="projector-throw-calculator-size" placeholder="e.g. 120">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="projector-throw-calculator-trmin">Throw ratio (min / single)</label>
      <input type="number" step="any" min="0" class="input" id="projector-throw-calculator-trmin" placeholder="e.g. 1.3" value="1.3">
    </div>
    <div class="field">
      <label for="projector-throw-calculator-trmax">Throw ratio (max, for zoom)</label>
      <input type="number" step="any" min="0" class="input" id="projector-throw-calculator-trmax" placeholder="e.g. 2.1">
    </div>
  </div>
  <div class="error" id="projector-throw-calculator-error"></div>
  <div class="result" id="projector-throw-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="projector-throw-calculator-mind">–</div><div class="l">Closest throw distance</div></div>
      <div class="stat-card"><div class="v" id="projector-throw-calculator-maxd">–</div><div class="l">Farthest throw distance</div></div>
      <div class="stat-card"><div class="v" id="projector-throw-calculator-width">–</div><div class="l">Screen width</div></div>
    </div>
    <p class="note" id="projector-throw-calculator-note">Throw distance = throw ratio × screen width. Leave the max ratio blank for a fixed-lens (single-ratio) projector.</p>
  </div>
</div>
