<div class="tool-card">
  <div class="field">
    <label for="smog-index-calculator-input">Your text</label>
    <textarea class="textarea" id="smog-index-calculator-input" rows="8" placeholder="Paste 10–30+ sentences for a meaningful SMOG score..."></textarea>
  </div>
  <div class="error" id="smog-index-calculator-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="smog-index-calculator-index">–</div><div class="l">SMOG Grade</div></div>
    <div class="stat-card"><div class="v" id="smog-index-calculator-poly">0</div><div class="l">Polysyllables</div></div>
    <div class="stat-card"><div class="v" id="smog-index-calculator-sentences">0</div><div class="l">Sentences</div></div>
  </div>
  <div class="result mt">
    <p class="note" id="smog-index-calculator-note">Formula: 1.043 × √(polysyllables × 30 / sentences) + 3.1291. Polysyllable = word of 3+ syllables.</p>
  </div>
</div>
