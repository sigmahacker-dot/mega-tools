<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="triathlon-pace-calculator-swimdist">Swim distance (m)</label>
      <input type="number" class="input" id="triathlon-pace-calculator-swimdist" min="0" step="any" placeholder="1500">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-swimtime">Swim time (mm:ss)</label>
      <input type="text" class="input" id="triathlon-pace-calculator-swimtime" placeholder="28:00">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-t1">T1 (mm:ss)</label>
      <input type="text" class="input" id="triathlon-pace-calculator-t1" placeholder="3:00">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-bikedist">Bike distance (km)</label>
      <input type="number" class="input" id="triathlon-pace-calculator-bikedist" min="0" step="any" placeholder="40">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-biketime">Bike time (h:mm:ss)</label>
      <input type="text" class="input" id="triathlon-pace-calculator-biketime" placeholder="1:10:00">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-t2">T2 (mm:ss)</label>
      <input type="text" class="input" id="triathlon-pace-calculator-t2" placeholder="2:00">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-rundist">Run distance (km)</label>
      <input type="number" class="input" id="triathlon-pace-calculator-rundist" min="0" step="any" placeholder="10">
    </div>
    <div class="field">
      <label for="triathlon-pace-calculator-runtime">Run time (mm:ss)</label>
      <input type="text" class="input" id="triathlon-pace-calculator-runtime" placeholder="48:00">
    </div>
  </div>
  <div class="error" id="triathlon-pace-calculator-error"></div>
  <div class="result" id="triathlon-pace-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="triathlon-pace-calculator-total">&ndash;</div><div class="l">Total finish time</div></div>
      <div class="stat-card"><div class="v" id="triathlon-pace-calculator-swimpace">&ndash;</div><div class="l">Swim /100m</div></div>
      <div class="stat-card"><div class="v" id="triathlon-pace-calculator-bikespeed">&ndash;</div><div class="l">Bike speed</div></div>
      <div class="stat-card"><div class="v" id="triathlon-pace-calculator-runpace">&ndash;</div><div class="l">Run /km</div></div>
    </div>
    <div id="triathlon-pace-calculator-out"></div>
    <p class="note">For information only &mdash; not medical advice.</p>
  </div>
</div>
