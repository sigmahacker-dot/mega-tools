<div class="tool-card">
  <div class="field">
    <label for="password-strength-meter-input">Password</label>
    <input type="password" class="input" id="password-strength-meter-input" placeholder="Type a password…" autocomplete="off">
    <p class="hint">Checked locally in your browser — nothing is sent anywhere.</p>
  </div>
  <div class="error" id="password-strength-meter-error"></div>
  <div class="result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="password-strength-meter-bits">0</div><div class="l">Entropy (bits)</div></div>
      <div class="stat-card"><div class="v" id="password-strength-meter-time">—</div><div class="l">Est. crack time</div></div>
      <div class="stat-card"><div class="v" id="password-strength-meter-score">—</div><div class="l">Strength</div></div>
    </div>
    <div style="background:#e0e0e0;border-radius:4px;height:10px;overflow:hidden;margin-bottom:12px">
      <div id="password-strength-meter-bar" style="height:100%;width:0%;background:#c62828;transition:width .2s"></div>
    </div>
    <div class="field">
      <label>Feedback</label>
      <ul id="password-strength-meter-feedback" style="margin:0;padding-left:20px"></ul>
    </div>
  </div>
</div>
