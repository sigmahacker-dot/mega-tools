<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="business-profit-margin-calculator-revenue">Revenue ($)</label><input class="input" id="business-profit-margin-calculator-revenue" type="number" min="0" step="any" value="500000"></div>
    <div class="field"><label for="business-profit-margin-calculator-cogs">Cost of goods sold ($)</label><input class="input" id="business-profit-margin-calculator-cogs" type="number" min="0" step="any" value="200000"></div>
    <div class="field"><label for="business-profit-margin-calculator-opex">Operating expenses ($)</label><input class="input" id="business-profit-margin-calculator-opex" type="number" min="0" step="any" value="150000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="business-profit-margin-calculator-calc">Calculate</button></div>
  <div class="error" id="business-profit-margin-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="business-profit-margin-calculator-gross">—</div><div class="l">Gross profit</div></div>
    <div class="stat-card"><div class="v" id="business-profit-margin-calculator-grossm">—</div><div class="l">Gross margin</div></div>
    <div class="stat-card"><div class="v" id="business-profit-margin-calculator-oper">—</div><div class="l">Operating profit</div></div>
    <div class="stat-card"><div class="v" id="business-profit-margin-calculator-operm">—</div><div class="l">Operating margin</div></div>
    <div class="stat-card"><div class="v" id="business-profit-margin-calculator-netm">—</div><div class="l">Net margin</div></div>
  </div>
  <p class="hint">Net margin here equals operating margin (income taxes not modeled).</p>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
