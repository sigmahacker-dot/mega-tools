<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="stock-option-calculator-shares">Vested shares</label>
      <input type="number" class="input" id="stock-option-calculator-shares" min="0" step="1" placeholder="1000">
    </div>
    <div class="field">
      <label for="stock-option-calculator-strike">Strike price ($/share)</label>
      <input type="number" class="input" id="stock-option-calculator-strike" min="0" step="any" placeholder="10">
    </div>
    <div class="field">
      <label for="stock-option-calculator-fmv">Current fair market value ($/share)</label>
      <input type="number" class="input" id="stock-option-calculator-fmv" min="0" step="any" placeholder="35">
    </div>
    <div class="field">
      <label for="stock-option-calculator-type">Option type</label>
      <select class="select" id="stock-option-calculator-type">
        <option value="nso">NSO (non-qualified)</option>
        <option value="iso">ISO (incentive)</option>
      </select>
    </div>
  </div>
  <div class="error" id="stock-option-calculator-error"></div>
  <div class="result" id="stock-option-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="stock-option-calculator-cost">&ndash;</div><div class="l">Cost to exercise</div></div>
      <div class="stat-card"><div class="v" id="stock-option-calculator-spread">&ndash;</div><div class="l">Spread value</div></div>
      <div class="stat-card"><div class="v" id="stock-option-calculator-pershare">&ndash;</div><div class="l">Spread / share</div></div>
      <div class="stat-card"><div class="v" id="stock-option-calculator-breakeven">&ndash;</div><div class="l">Break-even FMV</div></div>
    </div>
    <p class="note" id="stock-option-calculator-taxnote"></p>
    <p class="note">For information only &mdash; not financial advice. Option taxation is complex; confirm with a tax professional.</p>
  </div>
</div>
