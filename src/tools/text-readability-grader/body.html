<div class="tool-card">
  <div class="field">
    <label for="text-readability-grader-input">Your text</label>
    <textarea class="textarea" id="text-readability-grader-input" rows="8" placeholder="Paste a few sentences here"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="text-readability-grader-fre">–</div><div class="l">Flesch Reading Ease</div></div>
    <div class="stat-card"><div class="v" id="text-readability-grader-fk">–</div><div class="l">Flesch-Kincaid Grade</div></div>
  </div>
  <div class="field">
    <label>Interpretation</label>
    <div class="result"><div class="data" id="text-readability-grader-interp" style="white-space:pre-wrap"></div></div>
  </div>
  <p class="hint">90–100 very easy · 80–89 easy · 70–79 fairly easy · 60–69 standard · 50–59 fairly difficult · 30–49 difficult · 0–29 very hard.</p>
  <div class="error" id="text-readability-grader-error"></div>
</div>
