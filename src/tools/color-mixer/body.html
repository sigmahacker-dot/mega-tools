<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="color-mixer-a">Color A</label>
      <input type="color" class="input" id="color-mixer-a" value="#ff0000" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label for="color-mixer-b">Color B</label>
      <input type="color" class="input" id="color-mixer-b" value="#0000ff" style="height:44px;padding:4px;">
    </div>
  </div>
  <div class="field">
    <label for="color-mixer-ratio">Mix ratio — <span id="color-mixer-ratio-v">50</span>% A / <span id="color-mixer-ratio-w">50</span>% B</label>
    <input type="range" id="color-mixer-ratio" min="0" max="100" value="50">
  </div>
  <div class="error" id="color-mixer-error"></div>
  <div class="result mt">
    <div id="color-mixer-preview" style="height:120px;border-radius:12px;border:1px solid var(--line);"></div>
    <div class="stat-cards mt">
      <div class="stat-card"><div class="v" id="color-mixer-hex" style="font-family:ui-monospace,monospace;">–</div><div class="l">HEX result</div></div>
      <div class="stat-card"><div class="v" id="color-mixer-rgb" style="font-family:ui-monospace,monospace;font-size:.95rem;">–</div><div class="l">RGB result</div></div>
    </div>
    <div class="btn-row mt">
      <button class="btn btn-outline btn-sm" id="color-mixer-copy" type="button">Copy HEX</button>
    </div>
  </div>
</div>
