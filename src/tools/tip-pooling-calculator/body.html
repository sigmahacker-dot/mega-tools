<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tip-pooling-calculator-total">Total tips collected ($)</label>
      <input type="number" class="input" id="tip-pooling-calculator-total" min="0" step="any" placeholder="240.00">
    </div>
    <div class="field">
      <label for="tip-pooling-calculator-method">Split method</label>
      <select class="select" id="tip-pooling-calculator-method">
        <option value="hours">By hours worked</option>
        <option value="weighted">By hours &times; role weight</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Staff members</label>
    <div id="tip-pooling-calculator-staff"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="tip-pooling-calculator-add" type="button">+ Add staff member</button>
    </div>
  </div>
  <div class="error" id="tip-pooling-calculator-error"></div>
  <div class="result" id="tip-pooling-calculator-result">
    <div id="tip-pooling-calculator-out"></div>
    <p class="note">Shares are rounded to the cent; leftover pennies go to the largest fractional remainders so payouts always sum to the exact total.</p>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
