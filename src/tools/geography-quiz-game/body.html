<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="geography-quiz-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="geography-quiz-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="geography-quiz-game-qnum">0/85</div><div class="l">Question</div></div>
  </div>
  <div id="geography-quiz-game-q" style="font-size:26px;font-weight:bold;margin:16px 0;min-height:40px">Press Start to play!</div>
  <p class="muted" id="geography-quiz-game-msg" style="min-height:24px">What is the capital of…?</p>
  <div id="geography-quiz-game-opts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:12px auto"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="geography-quiz-game-start">▶ Start</button>
    <button class="btn btn-outline" id="geography-quiz-game-next" disabled>Next →</button>
  </div>
  <div class="error" id="geography-quiz-game-error"></div>
</div>
