<div class="tool-card">
  <div class="field">
    <label for="yaml-to-json-converter-input">YAML input</label>
    <textarea class="textarea" id="yaml-to-json-converter-input" rows="10" placeholder="Paste YAML here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="yaml-to-json-converter-convert">Convert to JSON</button>
    <button class="btn btn-outline" id="yaml-to-json-converter-sample">Load sample</button>
  </div>
  <div class="error" id="yaml-to-json-converter-error"></div>
  <p class="note">Practical YAML subset: maps, lists, nesting by indentation, scalars, quoted strings, comments, and simple inline <span class="code">[arrays]</span> / <span class="code">{maps}</span>. Not supported: anchors &amp; aliases, multi-line <span class="code">|</span> / <span class="code">&gt;</span> blocks, custom tags.</p>
  <div class="field">
    <label for="yaml-to-json-converter-output">JSON output</label>
    <textarea class="textarea" id="yaml-to-json-converter-output" rows="10" readonly placeholder="JSON will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="yaml-to-json-converter-copy">Copy JSON</button>
    <button class="btn btn-outline" id="yaml-to-json-converter-download">Download .json</button>
  </div>
</div>
