<div class="tool-card">
  <div class="field">
    <label for="text-shadow-generator-text">Sample text</label>
    <input type="text" class="input" id="text-shadow-generator-text" value="Shadow Text" maxlength="40">
  </div>
  <div class="grid2">
    <div class="field"><label for="text-shadow-generator-x">X offset: <span id="text-shadow-generator-x-v">2</span>px</label><input type="range" id="text-shadow-generator-x" min="-50" max="50" value="2"></div>
    <div class="field"><label for="text-shadow-generator-y">Y offset: <span id="text-shadow-generator-y-v">2</span>px</label><input type="range" id="text-shadow-generator-y" min="-50" max="50" value="2"></div>
    <div class="field"><label for="text-shadow-generator-blur">Blur: <span id="text-shadow-generator-blur-v">4</span>px</label><input type="range" id="text-shadow-generator-blur" min="0" max="50" value="4"></div>
    <div class="field"><label for="text-shadow-generator-opacity">Opacity: <span id="text-shadow-generator-opacity-v">50</span>%</label><input type="range" id="text-shadow-generator-opacity" min="0" max="100" value="50"></div>
    <div class="field"><label for="text-shadow-generator-color">Shadow color</label><input type="color" class="input" id="text-shadow-generator-color" value="#000000" style="height:40px;padding:4px;"></div>
    <div class="checkbox-row" style="align-self:end;"><input type="checkbox" id="text-shadow-generator-dark"> <label for="text-shadow-generator-dark">Dark preview background</label></div>
  </div>
  <div class="error" id="text-shadow-generator-error"></div>
  <div class="result mt">
    <div id="text-shadow-generator-preview" style="border:1px solid var(--line);border-radius:12px;padding:32px 16px;text-align:center;font-size:3rem;font-weight:800;">Shadow Text</div>
    <div class="field mt">
      <label for="text-shadow-generator-css">CSS</label>
      <input type="text" class="input" id="text-shadow-generator-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="text-shadow-generator-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
