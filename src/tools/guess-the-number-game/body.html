<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:420px;margin:0 auto 12px;text-align:left">
    <div class="field">
      <label for="guess-the-number-game-diff">Difficulty</label>
      <select class="input" id="guess-the-number-game-diff">
        <option value="50">Easy — 1 to 50</option>
        <option value="100" selected>Classic — 1 to 100</option>
        <option value="1000">Hard — 1 to 1000</option>
      </select>
    </div>
    <div class="field">
      <label for="guess-the-number-game-guess">Your guess</label>
      <input type="number" class="input" id="guess-the-number-game-guess" min="1" step="1" placeholder="50">
    </div>
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="guess-the-number-game-tries">0</div><div class="l">Attempts</div></div>
    <div class="stat-card"><div class="v" id="guess-the-number-game-best">–</div><div class="l">Best</div></div>
  </div>
  <div style="font-size:56px;margin:8px 0" id="guess-the-number-game-face">🤔</div>
  <p class="muted" id="guess-the-number-game-msg" style="min-height:24px">I'm thinking of a number…</p>
  <div id="guess-the-number-game-hist" style="max-width:420px;margin:0 auto;max-height:120px;overflow:auto;font-size:14px" class="muted"></div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="guess-the-number-game-go">Guess</button>
    <button class="btn btn-outline" id="guess-the-number-game-new">New game</button>
  </div>
  <div class="error" id="guess-the-number-game-error"></div>
</div>
