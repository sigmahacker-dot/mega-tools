<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="tg-user">Username / channel / bot</label><input type="text" class="input" id="tg-user" placeholder="telegram"></div>
    <div class="field"><label for="tg-msg">Share message <span class="hint">(optional)</span></label><input type="text" class="input" id="tg-msg" placeholder="Check this out!"></div>
  </div>
  <div class="error" id="telegram-link-generator-error"></div>
  <div class="result" id="tg-result">
    <div class="field"><label for="tg-profile">Profile / channel link</label><input type="text" class="input" id="tg-profile" readonly></div>
    <div class="field"><label for="tg-share">Share link <span class="hint">(opens Telegram share sheet with your text)</span></label><input type="text" class="input" id="tg-share" readonly></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="tg-copy-profile" type="button">Copy profile link</button>
      <button class="btn btn-outline" id="tg-copy-share" type="button">Copy share link</button>
    </div>
  </div>
</div>
