<div class="tool-card">
  <div class="field">
    <label for="image-color-picker-file">Upload image</label>
    <input type="file" class="input" id="image-color-picker-file" accept="image/*">
  </div>
  <div class="error" id="image-color-picker-error"></div>
  <div class="result" id="image-color-picker-result">
    <div class="field">
      <label>Live readout (move mouse, click to pin)</label>
      <div class="stat-cards">
        <div class="stat-card"><div class="v" id="image-color-picker-hex">&ndash;</div><div class="l">HEX</div></div>
        <div class="stat-card"><div class="v" id="image-color-picker-rgb">&ndash;</div><div class="l">RGB</div></div>
        <div class="stat-card"><div class="v" id="image-color-picker-hsl">&ndash;</div><div class="l">HSL</div></div>
      </div>
    </div>
    <div class="field">
      <canvas class="preview" id="image-color-picker-canvas" style="max-width:100%;border-radius:8px;cursor:crosshair;"></canvas>
    </div>
    <div class="field">
      <label>Picked colors</label>
      <div id="image-color-picker-picked"></div>
    </div>
  </div>
</div>
