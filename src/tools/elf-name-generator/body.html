<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="elf-name-generator-style">Style</label>
      <select class="select" id="elf-name-generator-style">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="epithet">With epithet</option>
      </select>
    </div>
    <div class="field">
      <label for="elf-name-generator-count">How many</label>
      <select class="select" id="elf-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="elf-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="elf-name-generator-error"></div>
  <div class="mt" id="elf-name-generator-list"></div>
</div>
