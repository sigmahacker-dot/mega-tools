<div class="tool-card" style="text-align:center">
  <div class="field" style="text-align:left">
    <label for="favicon-preview-tester-file">Upload image (PNG recommended, square)</label>
    <input type="file" class="input" id="favicon-preview-tester-file" accept="image/*">
  </div>
  <div class="error" id="favicon-preview-tester-error"></div>
  <div class="result hidden" id="favicon-preview-tester-result">
    <div class="field" style="text-align:left"><label>Previews</label></div>
    <div style="display:flex;gap:24px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px">
      <div><img id="favicon-preview-tester-p16" alt="16px preview" style="width:16px;height:16px;image-rendering:pixelated;border:1px solid #ccc"><p class="muted">16px</p></div>
      <div><img id="favicon-preview-tester-p32" alt="32px preview" style="width:32px;height:32px;border:1px solid #ccc"><p class="muted">32px</p></div>
      <div><img id="favicon-preview-tester-p48" alt="48px preview" style="width:48px;height:48px;border:1px solid #ccc"><p class="muted">48px</p></div>
      <div><img id="favicon-preview-tester-p180" alt="180px preview" style="width:180px;height:180px;border:1px solid #ccc"><p class="muted">180px</p></div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="favicon-preview-tester-ico">Download favicon.ico</button>
      <button class="btn btn-outline" id="favicon-preview-tester-png180">Download 180px PNG</button>
    </div>
    <p class="hint">The .ico contains PNG-compressed 16, 32, and 48px entries — valid for all modern browsers.</p>
  </div>
</div>
