<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="vat-calculator-amount">Amount</label>
      <input type="number" class="input" id="vat-calculator-amount" min="0" step="any" placeholder="100">
    </div>
    <div class="field">
      <label for="vat-calculator-rate">VAT rate (%)</label>
      <input type="number" class="input" id="vat-calculator-rate" min="0" max="100" step="any" placeholder="20">
    </div>
  </div>
  <div class="field">
    <label for="vat-calculator-mode">Calculation</label>
    <select class="select" id="vat-calculator-mode">
      <option value="add">Add VAT to net price</option>
      <option value="remove">Remove VAT from gross price</option>
      <option value="portion">VAT portion inside gross price</option>
    </select>
  </div>
  <div class="error" id="vat-calculator-error"></div>
  <div class="result" id="vat-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="vat-calculator-net">&ndash;</div><div class="l">Net (excl. VAT)</div></div>
      <div class="stat-card"><div class="v" id="vat-calculator-vat">&ndash;</div><div class="l">VAT amount</div></div>
      <div class="stat-card"><div class="v" id="vat-calculator-gross">&ndash;</div><div class="l">Gross (incl. VAT)</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
