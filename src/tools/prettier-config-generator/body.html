<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="prettier-config-generator-printwidth">printWidth</label>
      <input class="input" id="prettier-config-generator-printwidth" type="number" value="100" min="40" max="200">
    </div>
    <div class="field">
      <label for="prettier-config-generator-tabwidth">tabWidth</label>
      <input class="input" id="prettier-config-generator-tabwidth" type="number" value="2" min="1" max="8">
    </div>
    <div class="field">
      <label for="prettier-config-generator-trailing">trailingComma</label>
      <select class="select" id="prettier-config-generator-trailing">
        <option value="all">all</option>
        <option value="es5">es5</option>
        <option value="none">none</option>
      </select>
    </div>
  </div>
  <div class="grid3">
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-semi" checked><label for="prettier-config-generator-semi">semi</label></div>
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-single" checked><label for="prettier-config-generator-single">singleQuote</label></div>
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-usestabs"><label for="prettier-config-generator-usestabs">useTabs</label></div>
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-bracketspace" checked><label for="prettier-config-generator-bracketspace">bracketSpacing</label></div>
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-jsxsingle"><label for="prettier-config-generator-jsxsingle">jsxSingleQuote</label></div>
    <div class="field checkline"><input type="checkbox" id="prettier-config-generator-jsxbracket"><label for="prettier-config-generator-jsxbracket">jsxBracketSameLine (deprecated)</label></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="prettier-config-generator-arrow">arrowParens</label>
      <select class="select" id="prettier-config-generator-arrow">
        <option value="always">always</option>
        <option value="avoid">avoid</option>
      </select>
    </div>
    <div class="field">
      <label for="prettier-config-generator-quoteprops">quoteProps</label>
      <select class="select" id="prettier-config-generator-quoteprops">
        <option value="as-needed">as-needed</option>
        <option value="consistent">consistent</option>
        <option value="preserve">preserve</option>
      </select>
    </div>
    <div class="field">
      <label for="prettier-config-generator-eol">endOfLine</label>
      <select class="select" id="prettier-config-generator-eol">
        <option value="lf">lf</option>
        <option value="crlf">crlf</option>
        <option value="auto">auto</option>
      </select>
    </div>
  </div>
  <div class="error" id="prettier-config-generator-error"></div>
  <div class="field">
    <label for="prettier-config-generator-output">.prettierrc</label>
    <textarea class="textarea" id="prettier-config-generator-output" rows="14" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="prettier-config-generator-copy">Copy config</button>
    <button class="btn btn-outline" id="prettier-config-generator-download">Download .prettierrc</button>
  </div>
</div>
