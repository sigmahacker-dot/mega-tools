<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="college-savings-calculator-current">Current savings ($)</label><input class="input" id="college-savings-calculator-current" type="number" min="0" step="any" value="10000"></div>
    <div class="field"><label for="college-savings-calculator-monthly">Monthly contribution ($)</label><input class="input" id="college-savings-calculator-monthly" type="number" min="0" step="any" value="300"></div>
    <div class="field"><label for="college-savings-calculator-years">Years until college</label><input class="input" id="college-savings-calculator-years" type="number" min="0" step="any" value="12"></div>
    <div class="field"><label for="college-savings-calculator-return">Annual return (%)</label><input class="input" id="college-savings-calculator-return" type="number" min="0" step="any" value="6"></div>
    <div class="field"><label for="college-savings-calculator-target">Target college cost ($)</label><input class="input" id="college-savings-calculator-target" type="number" min="0" step="any" value="120000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="college-savings-calculator-calc">Calculate</button></div>
  <div class="error" id="college-savings-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="college-savings-calculator-fv">—</div><div class="l">Projected value</div></div>
    <div class="stat-card"><div class="v" id="college-savings-calculator-contrib">—</div><div class="l">Total contributions</div></div>
    <div class="stat-card"><div class="v" id="college-savings-calculator-growth">—</div><div class="l">Growth from returns</div></div>
    <div class="stat-card"><div class="v" id="college-savings-calculator-shortfall">—</div><div class="l">Shortfall vs target</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
