<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="alliteration-generator-letter">Letter</label>
      <select class="input" id="alliteration-generator-letter"></select>
    </div>
    <div class="field">
      <label for="alliteration-generator-theme">Theme</label>
      <select class="input" id="alliteration-generator-theme">
        <option value="nature">Nature</option>
        <option value="animals">Animals</option>
        <option value="food">Food</option>
        <option value="space">Space</option>
        <option value="adventure">Adventure</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="alliteration-generator-run">Generate phrases</button>
  </div>
  <div class="field">
    <label>Phrases — click one to copy</label>
    <div class="result"><div class="data" id="alliteration-generator-output" style="white-space:pre-wrap"></div></div>
  </div>
  <div class="error" id="alliteration-generator-error"></div>
</div>
