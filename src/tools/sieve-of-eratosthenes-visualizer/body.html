<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 12px;text-align:left">
    <div class="field"><label for="sieve-of-eratosthenes-visualizer-n">Find primes up to N (10\u2013400)</label><input class="input" id="sieve-of-eratosthenes-visualizer-n" type="number" value="100" min="10" max="400" step="1"></div>
    <div class="field"><label for="sieve-of-eratosthenes-visualizer-speed">Animation speed</label>
      <select class="input" id="sieve-of-eratosthenes-visualizer-speed"><option value="450">Slow</option><option value="200" selected>Medium</option><option value="70">Fast</option></select>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="sieve-of-eratosthenes-visualizer-play">\u25B6 Run sieve</button>
    <button class="btn btn-outline" id="sieve-of-eratosthenes-visualizer-step">Step</button>
  </div>
  <p class="muted" id="sieve-of-eratosthenes-visualizer-msg" style="min-height:24px">Press Run to animate the sieve.</p>
  <div id="sieve-of-eratosthenes-visualizer-grid" style="display:inline-grid;gap:3px;margin-top:8px"></div>
  <p class="muted" id="sieve-of-eratosthenes-visualizer-primes" style="max-width:640px;margin:10px auto 0;text-align:left"></p>
  <div class="error" id="sieve-of-eratosthenes-visualizer-error"></div>
</div>
