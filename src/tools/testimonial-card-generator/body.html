<div class="tool-card">
  <div class="field">
    <label for="testimonial-card-generator-quote">Quote</label>
    <textarea class="textarea" id="testimonial-card-generator-quote" rows="3">This product completely changed how our team works. Setup took minutes and the support is outstanding.</textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="testimonial-card-generator-name">Author name</label>
      <input class="input" id="testimonial-card-generator-name" value="Sarah Ahmed">
    </div>
    <div class="field">
      <label for="testimonial-card-generator-role">Role / Company</label>
      <input class="input" id="testimonial-card-generator-role" value="CTO, Acme Inc">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="testimonial-card-generator-rating">Rating</label>
      <select class="select" id="testimonial-card-generator-rating">
        <option value="5" selected>5 stars</option>
        <option value="4">4 stars</option>
        <option value="3">3 stars</option>
        <option value="2">2 stars</option>
        <option value="1">1 star</option>
      </select>
    </div>
    <div class="field">
      <label for="testimonial-card-generator-accent">Accent color</label>
      <input class="input" id="testimonial-card-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="testimonial-card-generator-style">Style</label>
      <select class="select" id="testimonial-card-generator-style">
        <option value="card">Card</option>
        <option value="border">Accent border</option>
        <option value="minimal">Minimal</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="testimonial-card-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:24px;background:#18181b"></div>
  </div>
  <div class="error" id="testimonial-card-generator-error"></div>
  <div class="field">
    <label for="testimonial-card-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="testimonial-card-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="testimonial-card-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="testimonial-card-generator-download">Download testimonial.html</button>
  </div>
</div>
