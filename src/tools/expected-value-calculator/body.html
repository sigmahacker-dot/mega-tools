<div class="tool-card">
  <div style="overflow-x:auto">
  <table class="data">
    <thead><tr><th>#</th><th>Outcome value x</th><th>Probability p</th><th></th></tr></thead>
    <tbody id="expected-value-calculator-rows"></tbody>
  </table>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="expected-value-calculator-add">+ Add row</button>
    <button type="button" class="btn" id="expected-value-calculator-calc">Calculate</button>
  </div>
  <div class="error" id="expected-value-calculator-error"></div>
  <div id="expected-value-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="expected-value-calculator-ev">–</div><div class="l">E(X)</div></div>
      <div class="stat-card"><div class="v" id="expected-value-calculator-var">–</div><div class="l">Var(X)</div></div>
      <div class="stat-card"><div class="v" id="expected-value-calculator-sd">–</div><div class="l">σ (std dev)</div></div>
    </div>
    <div class="result">
      <h3>Term-by-term</h3>
      <div id="expected-value-calculator-steps"></div>
    </div>
  </div>
</div>
