<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="floor-length">Room length (ft)</label><input type="number" class="input" id="floor-length" min="0" step="any" placeholder="14"></div>
    <div class="field"><label for="floor-width">Room width (ft)</label><input type="number" class="input" id="floor-width" min="0" step="any" placeholder="12"></div>
    <div class="field"><label for="floor-waste">Waste allowance (%)</label><input type="number" class="input" id="floor-waste" min="0" max="50" step="any" placeholder="10"></div>
    <div class="field"><label for="floor-box">Coverage per box (sq ft)</label><input type="number" class="input" id="floor-box" min="0" step="any" placeholder="20"></div>
    <div class="field"><label for="floor-price">Price per box ($) — optional</label><input type="number" class="input" id="floor-price" min="0" step="any" placeholder="45"></div>
  </div>
  <div class="error" id="flooring-calculator-error"></div>
  <div class="result" id="floor-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="floor-boxes">–</div><div class="l">Boxes to buy</div></div>
      <div class="stat-card"><div class="v" id="floor-area">–</div><div class="l">Area incl. waste</div></div>
      <div class="stat-card"><div class="v" id="floor-cost">–</div><div class="l">Est. material cost</div></div>
    </div>
    <p class="note">Boxes are rounded up. Buy whole boxes only — stores do not split them.</p>
  </div>
</div>
