<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="smoking-savings-calculator-cigs">Cigarettes per day</label>
      <input class="input" id="smoking-savings-calculator-cigs" type="number" min="1" max="200" step="1" placeholder="e.g. 20">
    </div>
    <div class="field">
      <label for="smoking-savings-calculator-price">Price per pack of 20</label>
      <input class="input" id="smoking-savings-calculator-price" type="number" min="0.1" step="0.01" placeholder="e.g. 8.50">
    </div>
    <div class="field">
      <label for="smoking-savings-calculator-currency">Currency symbol</label>
      <input class="input" id="smoking-savings-calculator-currency" type="text" value="$" maxlength="3">
    </div>
    <div class="field">
      <label for="smoking-savings-calculator-quit">Quit date</label>
      <input class="input" id="smoking-savings-calculator-quit" type="date">
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="smoking-savings-calculator-calc">Calculate savings</button></div>
  <div class="stat-cards hidden" id="smoking-savings-calculator-out">
    <div class="stat-card"><div class="v" id="smoking-savings-calculator-saved">–</div><div class="l">Saved to date</div></div>
    <div class="stat-card"><div class="v" id="smoking-savings-calculator-cigsaved">–</div><div class="l">Cigarettes not smoked</div></div>
    <div class="stat-card"><div class="v" id="smoking-savings-calculator-yr1">–</div><div class="l">Projected 1 year</div></div>
    <div class="stat-card"><div class="v" id="smoking-savings-calculator-yr5">–</div><div class="l">Projected 5 years</div></div>
  </div>
  <p class="hint" id="smoking-savings-calculator-note"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance.</p>
  <div class="error" id="smoking-savings-calculator-error"></div>
</div>
