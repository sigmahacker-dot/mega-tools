<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="swimming-pace-calculator-dist">Distance (meters)</label>
      <input class="input" id="swimming-pace-calculator-dist" type="number" min="1" step="1" placeholder="e.g. 1500">
    </div>
    <div class="field">
      <label>Time</label>
      <div class="btn-row" style="justify-content:flex-start">
        <input class="input" id="swimming-pace-calculator-min" type="number" min="0" step="1" placeholder="min" style="flex:1">
        <input class="input" id="swimming-pace-calculator-sec" type="number" min="0" max="59" step="1" placeholder="sec" style="flex:1">
      </div>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="swimming-pace-calculator-calc">Calculate</button></div>
  <div class="stat-cards hidden" id="swimming-pace-calculator-out">
    <div class="stat-card"><div class="v" id="swimming-pace-calculator-p100m">–</div><div class="l">Pace / 100m</div></div>
    <div class="stat-card"><div class="v" id="swimming-pace-calculator-p100yd">–</div><div class="l">Pace / 100yd</div></div>
    <div class="stat-card"><div class="v" id="swimming-pace-calculator-speed">–</div><div class="l">Speed (m/s)</div></div>
  </div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance.</p>
  <div class="error" id="swimming-pace-calculator-error"></div>
</div>
