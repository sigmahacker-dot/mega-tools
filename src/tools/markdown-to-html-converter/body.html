<div class="tool-card">
  <div class="field">
    <label for="markdown-to-html-converter-input">Markdown input</label>
    <textarea class="textarea" id="markdown-to-html-converter-input" rows="10" placeholder="Type Markdown here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="markdown-to-html-converter-render">Render</button>
    <button class="btn btn-outline" id="markdown-to-html-converter-sample">Load sample</button>
    <label style="display:inline-flex;align-items:center;gap:6px;">
      <input type="checkbox" id="markdown-to-html-converter-source"> Show HTML source
    </label>
  </div>
  <div class="error" id="markdown-to-html-converter-error"></div>
  <div class="field">
    <label>Preview</label>
    <div class="result" id="markdown-to-html-converter-preview" style="min-height:80px"></div>
    <textarea class="textarea hidden" id="markdown-to-html-converter-html" rows="10" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="markdown-to-html-converter-copy">Copy HTML</button>
  </div>
</div>
