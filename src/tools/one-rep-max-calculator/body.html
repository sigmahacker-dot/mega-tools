<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="orm-weight">Weight lifted (kg)</label>
      <input type="number" class="input" id="orm-weight" min="0.5" step="any" placeholder="100">
    </div>
    <div class="field">
      <label for="orm-reps">Reps completed</label>
      <input type="number" class="input" id="orm-reps" min="1" max="12" step="1" placeholder="5">
    </div>
  </div>
  <div class="error" id="one-rep-max-calculator-error"></div>
  <div class="result" id="orm-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="orm-epley">–</div><div class="l">Epley 1RM (kg)</div></div>
      <div class="stat-card"><div class="v" id="orm-brzycki">–</div><div class="l">Brzycki 1RM (kg)</div></div>
      <div class="stat-card"><div class="v" id="orm-avg">–</div><div class="l">Average 1RM (kg)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>% of 1RM</th><th>Weight (kg)</th></tr></thead>
      <tbody id="orm-table-body">
        <tr><td colspan="2" class="muted">Enter a weight and rep count to see your percentages.</td></tr>
      </tbody>
    </table>
    <p class="note">Estimates only — most accurate for 1–10 clean reps with good form.</p>
  </div>
</div>
