<div class="tool-card">
  <div class="dropzone" id="audio-fade-in-out-drop">
    <span class="dz-icon">🎚️</span>
    <strong>Drop an audio file here</strong> or click to browse
    <input type="file" id="audio-fade-in-out-file" accept="audio/*" class="hidden">
  </div>
  <div class="stat-cards hidden" id="audio-fade-in-out-stats">
    <div class="stat-card"><div class="v" id="audio-fade-in-out-duration">0:00</div><div class="l">Duration</div></div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="audio-fade-in-out-in">Fade in (seconds)</label>
      <input type="number" id="audio-fade-in-out-in" class="input" min="0" max="600" step="0.1" value="2">
    </div>
    <div class="field">
      <label for="audio-fade-in-out-out">Fade out (seconds)</label>
      <input type="number" id="audio-fade-in-out-out" class="input" min="0" max="600" step="0.1" value="2">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="audio-fade-in-out-preview">Preview</button>
    <button class="btn btn-primary" id="audio-fade-in-out-go">Apply &amp; download WAV</button>
  </div>
  <div class="error" id="audio-fade-in-out-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
