<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="linkedin-summary-generator-role">Current role</label>
      <input class="input" type="text" id="linkedin-summary-generator-role" placeholder="e.g. Product Designer">
    </div>
    <div class="field">
      <label for="linkedin-summary-generator-industry">Industry</label>
      <input class="input" type="text" id="linkedin-summary-generator-industry" placeholder="e.g. Fintech">
    </div>
    <div class="field">
      <label for="linkedin-summary-generator-years">Years of experience</label>
      <input class="input" type="number" id="linkedin-summary-generator-years" min="0" max="60" placeholder="5">
    </div>
    <div class="field">
      <label for="linkedin-summary-generator-tone">Tone</label>
      <select class="select" id="linkedin-summary-generator-tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="bold">Bold</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="linkedin-summary-generator-skills">Top skills (comma-separated)</label>
    <input class="input" type="text" id="linkedin-summary-generator-skills" placeholder="UX research, Figma, design systems">
  </div>
  <div class="field">
    <label for="linkedin-summary-generator-wins">Key achievements (one per line)</label>
    <textarea class="textarea" id="linkedin-summary-generator-wins" rows="3" placeholder="Grew activation 40% in 6 months&#10;Led a team of 4 designers"></textarea>
  </div>
  <div class="field">
    <label for="linkedin-summary-generator-passion">What drives you (optional)</label>
    <input class="input" type="text" id="linkedin-summary-generator-passion" placeholder="e.g. building products people love">
  </div>
  <div class="btn-row">
    <button class="btn" id="linkedin-summary-generator-gen">Generate Summary</button>
    <button class="btn btn-outline" id="linkedin-summary-generator-copy">Copy Summary</button>
  </div>
  <div class="error" id="linkedin-summary-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Your About section</h3>
  <p id="linkedin-summary-generator-out" style="white-space:pre-wrap"></p>
  <p class="muted" id="linkedin-summary-generator-count"></p>
</div>
