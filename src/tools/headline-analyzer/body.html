<div class="tool-card">
  <div class="field">
    <label for="headline-analyzer-input">Your headline</label>
    <input type="text" class="input" id="headline-analyzer-input" placeholder="e.g. 7 Proven Ways to Double Your Hunza Tour Bookings" maxlength="140">
  </div>
  <div class="error" id="headline-analyzer-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="headline-analyzer-score">–</div><div class="l">Score / Grade</div></div>
    <div class="stat-card"><div class="v" id="headline-analyzer-chars">0</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="headline-analyzer-words">0</div><div class="l">Words</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <tbody id="headline-analyzer-body"></tbody>
    </table>
    <p class="note">Scored with built-in banks: 60+ power words, 40+ emotional words. Length targets: 55–70 characters, 6–9 words.</p>
  </div>
</div>
