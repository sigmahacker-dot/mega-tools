<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cost-of-goods-calculator-begin">Beginning inventory ($)</label><input class="input" id="cost-of-goods-calculator-begin" type="number" min="0" step="any" value="20000"></div>
