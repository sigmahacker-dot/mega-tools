<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="number-to-words-num">Whole number</label>
      <input type="number" class="input" id="number-to-words-num" step="1" placeholder="e.g. 1234567" autocomplete="off">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn btn-outline btn-sm" id="number-to-words-copy" type="button">Copy words</button>
      </div>
    </div>
  </div>
  <div class="error" id="number-to-words-error"></div>
  <div class="result" id="number-to-words-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="number-to-words-words" style="font-size:1.05rem;">–</div><div class="l">In words</div></div>
      <div class="stat-card"><div class="v" id="number-to-words-digits">–</div><div class="l">Digits</div></div>
    </div>
    <p class="note">Converts whole numbers from −9,007,199,254,740,991 to +9,007,199,254,740,991.</p>
  </div>
</div>
