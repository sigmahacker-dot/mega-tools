<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="triangle-solver-mode">Given</label>
      <select class="select" id="triangle-solver-mode">
        <option value="sss">SSS — three sides</option>
        <option value="sas">SAS — two sides + included angle</option>
      </select>
    </div>
    <div class="field" id="triangle-solver-wa">
      <label for="triangle-solver-a">Side a</label>
      <input type="number" class="input" id="triangle-solver-a" step="any" min="0" placeholder="e.g. 7">
    </div>
    <div class="field">
      <label for="triangle-solver-b">Side b</label>
      <input type="number" class="input" id="triangle-solver-b" step="any" min="0" placeholder="e.g. 8">
    </div>
    <div class="field" id="triangle-solver-wc">
      <label for="triangle-solver-c">Side c</label>
      <input type="number" class="input" id="triangle-solver-c" step="any" min="0" placeholder="e.g. 9">
    </div>
    <div class="field" id="triangle-solver-wang" style="display:none;">
      <label for="triangle-solver-ang">Included angle C (degrees)</label>
      <input type="number" class="input" id="triangle-solver-ang" step="any" min="0" max="180" placeholder="e.g. 60">
    </div>
  </div>
  <div class="error" id="triangle-solver-error"></div>
  <div class="result" id="triangle-solver-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="triangle-solver-area">–</div><div class="l">Area</div></div>
      <div class="stat-card"><div class="v" id="triangle-solver-perim">–</div><div class="l">Perimeter</div></div>
      <div class="stat-card"><div class="v" id="triangle-solver-type">–</div><div class="l">Triangle type</div></div>
    </div>
    <table class="data">
      <thead><tr><th></th><th>Side</th><th>Opposite angle</th></tr></thead>
      <tbody id="triangle-solver-body">
        <tr><td colspan="3" class="muted">Enter the known values to solve the triangle.</td></tr>
      </tbody>
    </table>
    <p class="note" id="triangle-solver-steps">Angles are shown in degrees.</p>
  </div>
</div>
