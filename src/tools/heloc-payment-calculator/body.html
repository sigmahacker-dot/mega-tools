<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="heloc-payment-calculator-line">Credit line limit ($)</label><input class="input" id="heloc-payment-calculator-line" type="number" min="0" step="any" value="100000"></div>
    <div class="field"><label for="heloc-payment-calculator-drawn">Amount drawn ($)</label><input class="input" id="heloc-payment-calculator-drawn" type="number" min="0" step="any" value="50000"></div>
    <div class="field"><label for="heloc-payment-calculator-rate">Interest rate (% APR)</label><input class="input" id="heloc-payment-calculator-rate" type="number" min="0" step="any" value="8.5"></div>
    <div class="field"><label for="heloc-payment-calculator-drawyrs">Draw period (years)</label><input class="input" id="heloc-payment-calculator-drawyrs" type="number" min="1" step="any" value="10"></div>
    <div class="field"><label for="heloc-payment-calculator-repayyrs">Repayment period (years)</label><input class="input" id="heloc-payment-calculator-repayyrs" type="number" min="1" step="any" value="20"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="heloc-payment-calculator-calc">Calculate</button></div>
  <div class="error" id="heloc-payment-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="heloc-payment-calculator-drawpmt">—</div><div class="l">Draw-phase payment / mo</div></div>
    <div class="stat-card"><div class="v" id="heloc-payment-calculator-repaypmt">—</div><div class="l">Repayment-phase / mo</div></div>
    <div class="stat-card"><div class="v" id="heloc-payment-calculator-drawtot">—</div><div class="l">Total interest (draw phase)</div></div>
    <div class="stat-card"><div class="v" id="heloc-payment-calculator-repaytot">—</div><div class="l">Total interest (repay phase)</div></div>
  </div>
  <p class="hint">Draw phase is interest-only; the full drawn balance still amortizes during repayment.</p>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
