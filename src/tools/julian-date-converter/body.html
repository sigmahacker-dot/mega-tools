<div class="tool-card">
  <h3 style="margin:0 0 8px">Gregorian date → Julian Day Number</h3>
  <div class="field" style="max-width:260px">
    <label for="julian-date-converter-date">Calendar date</label>
    <input class="input" type="date" id="julian-date-converter-date">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="julian-date-converter-tojdn">Convert to JDN</button>
  </div>
  <div class="result" id="julian-date-converter-tojdnout"></div>
  <hr style="border:none;border-top:1px solid #eee;margin:16px 0">
  <h3 style="margin:0 0 8px">Julian Day Number → date</h3>
  <div class="field" style="max-width:260px">
    <label for="julian-date-converter-jdn">Julian Day Number</label>
    <input class="input" type="number" id="julian-date-converter-jdn" min="0" max="9999999" step="1" placeholder="e.g. 2460948">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="julian-date-converter-todate">Convert to date</button>
  </div>
  <div class="result" id="julian-date-converter-todateout"></div>
  <div class="error" id="julian-date-converter-error"></div>
</div>
