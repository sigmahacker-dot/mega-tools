<div class="tool-card">
  <div class="btn-row">
    <button class="btn btn-sm" id="wedding-planner-lite-tab-check">Checklist</button>
    <button class="btn btn-sm btn-outline" id="wedding-planner-lite-tab-budget">Budget</button>
  </div>
  <div class="error" id="wedding-planner-lite-error"></div>
</div>

<div class="tool-card" id="wedding-planner-lite-check-pane">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="wedding-planner-lite-tdone">0/0</div><div class="l">Tasks done</div></div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="wedding-planner-lite-task">Task</label>
      <input class="input" type="text" id="wedding-planner-lite-task" placeholder="e.g. Book venue">
    </div>
    <div class="field">
      <label for="wedding-planner-lite-due">Due date</label>
      <input class="input" type="date" id="wedding-planner-lite-due">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="wedding-planner-lite-addtask">Add Task</button>
  </div>
  <div id="wedding-planner-lite-tasks" style="margin-top:10px"></div>
</div>

<div class="tool-card hidden" id="wedding-planner-lite-budget-pane">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="wedding-planner-lite-est">0</div><div class="l">Estimated total</div></div>
    <div class="stat-card"><div class="v" id="wedding-planner-lite-spent">0</div><div class="l">Actual spent</div></div>
    <div class="stat-card"><div class="v" id="wedding-planner-lite-left">0</div><div class="l">Remaining</div></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="wedding-planner-lite-item">Item</label>
      <input class="input" type="text" id="wedding-planner-lite-item" placeholder="e.g. Venue">
    </div>
    <div class="field">
      <label for="wedding-planner-lite-ecost">Estimated cost</label>
      <input class="input" type="number" id="wedding-planner-lite-ecost" min="0" step="0.01">
    </div>
    <div class="field">
      <label for="wedding-planner-lite-acost">Actual cost</label>
      <input class="input" type="number" id="wedding-planner-lite-acost" min="0" step="0.01">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="wedding-planner-lite-additem">Add Budget Item</button>
    <button class="btn btn-outline" id="wedding-planner-lite-export">Export JSON</button>
  </div>
  <div id="wedding-planner-lite-items" style="margin-top:10px"></div>
</div>
