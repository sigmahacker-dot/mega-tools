<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="invoice-generator-business">Your business name</label>
      <input class="input" id="invoice-generator-business" type="text" placeholder="Acme Studio">
    </div>
    <div class="field">
      <label for="invoice-generator-client">Client name</label>
      <input class="input" id="invoice-generator-client" type="text" placeholder="Client Ltd.">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="invoice-generator-number">Invoice #</label>
      <input class="input" id="invoice-generator-number" type="text" value="INV-001">
    </div>
    <div class="field">
      <label for="invoice-generator-date">Date</label>
      <input class="input" id="invoice-generator-date" type="date">
    </div>
  </div>
  <div class="field">
    <label>Items</label>
    <div id="invoice-generator-items"></div>
    <button class="btn btn-outline btn-sm mt" id="invoice-generator-add">+ Add item</button>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="invoice-generator-tax">Tax (%)</label>
      <input class="input" id="invoice-generator-tax" type="number" value="0" min="0" max="100" step="0.1">
    </div>
    <div class="field">
      <label for="invoice-generator-currency">Currency</label>
      <input class="input" id="invoice-generator-currency" type="text" value="PKR" maxlength="5">
    </div>
  </div>
  <div class="field">
    <label for="invoice-generator-notes">Notes</label>
    <textarea class="textarea" id="invoice-generator-notes" rows="2" placeholder="Payment due within 14 days."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="invoice-generator-print">Print / Save as PDF</button>
  </div>
  <div class="error" id="invoice-generator-error"></div>
  <div class="mt" id="invoice-generator-preview"></div>
  <p class="note">Use your browser's print dialog and choose "Save as PDF" as the destination. Only the invoice prints — the form is hidden.</p>
</div>
