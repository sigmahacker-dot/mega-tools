<div class="tool-card">
  <h3 style="margin:0 0 8px">Date → ISO week</h3>
  <div class="field" style="max-width:260px">
    <label for="iso-week-date-converter-date">Calendar date</label>
    <input class="input" type="date" id="iso-week-date-converter-date">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="iso-week-date-converter-fwd">Convert to ISO week</button>
  </div>
  <div class="result" id="iso-week-date-converter-fwdout"></div>
  <hr style="border:none;border-top:1px solid #eee;margin:16px 0">
  <h3 style="margin:0 0 8px">ISO week → date</h3>
  <div class="grid2" style="max-width:520px">
    <div class="field">
      <label for="iso-week-date-converter-year">ISO year</label>
      <input class="input" type="number" id="iso-week-date-converter-year" min="1" max="9999" value="2026">
    </div>
    <div class="field">
      <label for="iso-week-date-converter-week">Week (1–53)</label>
      <input class="input" type="number" id="iso-week-date-converter-week" min="1" max="53" value="40">
    </div>
  </div>
  <div class="field" style="max-width:260px">
    <label for="iso-week-date-converter-day">Day of week</label>
    <select class="input" id="iso-week-date-converter-day">
      <option value="1">1 — Monday</option>
      <option value="2">2 — Tuesday</option>
      <option value="3">3 — Wednesday</option>
      <option value="4">4 — Thursday</option>
      <option value="5">5 — Friday</option>
      <option value="6">6 — Saturday</option>
      <option value="7">7 — Sunday</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="iso-week-date-converter-rev">Convert to date</button>
  </div>
  <div class="result" id="iso-week-date-converter-revout"></div>
  <div class="error" id="iso-week-date-converter-error"></div>
</div>
