<div class="tool-card">
  <div class="field">
    <label for="wanted-poster-maker-file">Portrait photo</label>
    <input type="file" id="wanted-poster-maker-file" accept="image/*" class="input">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="wanted-poster-maker-name">Outlaw name</label>
      <input type="text" id="wanted-poster-maker-name" class="input" value="BLACK JAKE RIVERS" maxlength="40">
    </div>
    <div class="field">
      <label for="wanted-poster-maker-status">Wanted</label>
      <select class="select" id="wanted-poster-maker-status">
        <option value="DEAD OR ALIVE">Dead or alive</option>
        <option value="ALIVE">Alive</option>
        <option value="DEAD">Dead</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="wanted-poster-maker-crime">Crime</label>
      <input type="text" id="wanted-poster-maker-crime" class="input" value="Train robbery & bank heists" maxlength="60">
    </div>
    <div class="field">
      <label for="wanted-poster-maker-reward">Reward</label>
      <input type="text" id="wanted-poster-maker-reward" class="input" value="$5,000" maxlength="20">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="wanted-poster-maker-download">Download poster</button>
  </div>
  <div class="result">
    <canvas id="wanted-poster-maker-canvas" style="width:100%;max-width:400px;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="wanted-poster-maker-error"></div>
  <p class="note">For fun and personal use only — don't use it to impersonate or defame a real person. Everything runs in your browser.</p>
</div>
