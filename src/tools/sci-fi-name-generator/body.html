<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="sci-fi-name-generator-style">Style</label>
      <select class="select" id="sci-fi-name-generator-style">
        <option value="alien">Alien character</option>
        <option value="human">Human colonist</option>
        <option value="planet">Planet</option>
        <option value="ship">Starship</option>
      </select>
    </div>
    <div class="field">
      <label for="sci-fi-name-generator-count">How many</label>
      <select class="select" id="sci-fi-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="sci-fi-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="sci-fi-name-generator-error"></div>
  <div class="mt" id="sci-fi-name-generator-list"></div>
</div>
