<div class="tool-card">
  <div class="field">
    <label for="cliche-finder-input">Your text</label>
    <textarea class="textarea" id="cliche-finder-input" rows="8" placeholder="Paste your writing here..."></textarea>
  </div>
  <div class="error" id="cliche-finder-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="cliche-finder-count">0</div><div class="l">Clichés found</div></div>
    <div class="stat-card"><div class="v" id="cliche-finder-unique">0</div><div class="l">Unique clichés</div></div>
  </div>
  <div class="result mt">
    <div id="cliche-finder-out" class="muted" style="white-space:pre-wrap;line-height:1.8;">Highlights appear here as you type.</div>
    <table class="data mt">
      <thead><tr><th>Cliché</th><th>Times used</th></tr></thead>
      <tbody id="cliche-finder-body"><tr><td colspan="2" class="muted">No clichés found yet.</td></tr></tbody>
    </table>
    <p class="note">Checks against a built-in list of 90+ common clichés. Matching is case-insensitive on whole phrases.</p>
  </div>
</div>
