<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="swim-css-calculator-t400">400 m time trial (mm:ss)</label>
      <input type="text" class="input" id="swim-css-calculator-t400" placeholder="7:20">
    </div>
    <div class="field">
      <label for="swim-css-calculator-t200">200 m time trial (mm:ss)</label>
      <input type="text" class="input" id="swim-css-calculator-t200" placeholder="3:25">
    </div>
  </div>
  <div class="error" id="swim-css-calculator-error"></div>
  <div class="result" id="swim-css-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="swim-css-calculator-css">&ndash;</div><div class="l">CSS / 100 m</div></div>
    </div>
    <div id="swim-css-calculator-out"></div>
    <p class="note">For information only &mdash; not medical advice.</p>
  </div>
</div>
