<div class="tool-card">
  <div class="field">
    <label for="braille-translator-input">Input</label>
    <textarea class="textarea" id="braille-translator-input" rows="5" placeholder="Type text to encode, or braille characters to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="braille-translator-mode">Mode</label>
      <select class="input" id="braille-translator-mode">
        <option value="encode">Encode (text → braille)</option>
        <option value="decode">Decode (braille → text)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="braille-translator-run">Run</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="braille-translator-output" style="white-space:pre-wrap;font-size:1.3em"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="braille-translator-copy">Copy output</button></div>
  </div>
  <p class="hint">Grade 1 · <span class="code">⠠</span> = capital follows · <span class="code">⠼</span> = number follows (a–j = 1–0).</p>
  <div class="error" id="braille-translator-error"></div>
</div>
