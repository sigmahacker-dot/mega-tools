<div class="tool-card">
  <div class="field">
    <label for="comic-strip-maker-count">Panels</label>
    <select class="select" id="comic-strip-maker-count">
      <option value="3">3 panels</option>
      <option value="4" selected>4 panels</option>
    </select>
  </div>
  <div class="grid2" id="comic-strip-maker-panels"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="comic-strip-maker-download">Download strip</button>
  </div>
  <div class="result">
    <canvas id="comic-strip-maker-canvas" style="width:100%;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="comic-strip-maker-error"></div>
  <p class="note">Everything is rendered in your browser — your photos are never uploaded.</p>
</div>
