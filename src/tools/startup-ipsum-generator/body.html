<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="startup-ipsum-generator-paras">Paragraphs</label>
      <select class="select" id="startup-ipsum-generator-paras">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="startup-ipsum-generator-go" type="button">Generate Startup Ipsum</button>
      </div>
    </div>
  </div>
  <div class="error" id="startup-ipsum-generator-error"></div>
  <div class="result" id="startup-ipsum-generator-output" style="white-space:pre-wrap">Your buzzword-filled paragraphs will appear here.</div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn btn-outline btn-sm" id="startup-ipsum-generator-copy" type="button">Copy Text</button>
  </div>
</div>
