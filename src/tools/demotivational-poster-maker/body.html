<div class="tool-card">
  <div class="field">
    <label for="demotivational-poster-maker-file">Photo</label>
    <input type="file" id="demotivational-poster-maker-file" accept="image/*" class="input">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="demotivational-poster-maker-title">Title</label>
      <input type="text" id="demotivational-poster-maker-title" class="input" value="PROCRASTINATION" maxlength="60">
    </div>
    <div class="field">
      <label for="demotivational-poster-maker-size">Title size: <span id="demotivational-poster-maker-size-val">72</span>px</label>
      <input type="range" id="demotivational-poster-maker-size" min="36" max="110" value="72">
    </div>
  </div>
  <div class="field">
    <label for="demotivational-poster-maker-caption">Caption</label>
    <input type="text" id="demotivational-poster-maker-caption" class="input" value="Hard work pays off eventually — but laziness pays off right now." maxlength="160">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="demotivational-poster-maker-download">Download poster</button>
  </div>
  <div class="result" id="demotivational-poster-maker-preview-wrap">
    <canvas id="demotivational-poster-maker-canvas" style="width:100%;max-width:450px;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="demotivational-poster-maker-error"></div>
  <p class="note">Classic demotivator style: black background, white-bordered photo, serif title in caps, italic caption. Everything is processed in your browser.</p>
</div>
