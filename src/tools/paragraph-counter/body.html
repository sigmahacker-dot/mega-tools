<div class="tool-card">
  <div class="field">
    <label for="paragraph-counter-input">Your text</label>
    <textarea class="textarea" id="paragraph-counter-input" rows="8" placeholder="Paste your text here"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="paragraph-counter-paras">0</div><div class="l">Paragraphs</div></div>
    <div class="stat-card"><div class="v" id="paragraph-counter-sents">0</div><div class="l">Sentences</div></div>
    <div class="stat-card"><div class="v" id="paragraph-counter-words">0</div><div class="l">Words</div></div>
    <div class="stat-card"><div class="v" id="paragraph-counter-blanks">0</div><div class="l">Blank lines</div></div>
  </div>
  <div class="error" id="paragraph-counter-error"></div>
</div>
