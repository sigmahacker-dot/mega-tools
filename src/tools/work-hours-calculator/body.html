<div class="tool-card">
  <div id="work-hours-calculator-rows"></div>
  <div class="grid2">
    <div class="field">
      <label for="work-hours-calculator-rate">Hourly rate (optional)</label>
      <input type="number" class="input" id="work-hours-calculator-rate" step="any" min="0" placeholder="e.g. 15">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" id="work-hours-calculator-go">Calculate</button>
    </div>
  </div>
  <div class="error" id="work-hours-calculator-error"></div>
  <div class="result" id="work-hours-calculator-result">
    <table class="data">
      <thead><tr><th>Day</th><th>Hours</th></tr></thead>
      <tbody id="work-hours-calculator-body"></tbody>
    </table>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="work-hours-calculator-total">&ndash;</div><div class="l">Week total</div></div>
      <div class="stat-card"><div class="v" id="work-hours-calculator-ot">&ndash;</div><div class="l">Overtime (&gt;40h)</div></div>
      <div class="stat-card"><div class="v" id="work-hours-calculator-pay">&ndash;</div><div class="l">Pay estimate</div></div>
    </div>
    <p class="note">Overnight shifts (clock-out before clock-in) count as next-day. Breaks are unpaid.</p>
  </div>
</div>
