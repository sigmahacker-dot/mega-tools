<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="exponent-calculator-base">Base</label>
      <input type="number" class="input" id="exponent-calculator-base" step="any" placeholder="e.g. 2">
    </div>
    <div class="field">
      <label for="exponent-calculator-exp">Exponent</label>
      <input type="number" class="input" id="exponent-calculator-exp" step="any" placeholder="e.g. 10">
    </div>
  </div>
  <div class="error" id="exponent-calculator-error"></div>
  <div class="result" id="exponent-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="exponent-calculator-value">–</div><div class="l">Result</div></div>
      <div class="stat-card"><div class="v" id="exponent-calculator-sci">–</div><div class="l">Scientific notation</div></div>
      <div class="stat-card"><div class="v" id="exponent-calculator-recip">–</div><div class="l">Reciprocal (1 ÷ result)</div></div>
    </div>
    <p class="note" id="exponent-calculator-steps">Enter a base and an exponent to see the calculation.</p>
  </div>
</div>
