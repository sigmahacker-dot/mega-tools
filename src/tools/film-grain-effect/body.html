<div class="tool-card">
  <div class="field">
    <label for="film-grain-effect-file">Photo</label>
    <input type="file" id="film-grain-effect-file" accept="image/*" class="input">
  </div>
  <div class="field">
    <label for="film-grain-effect-intensity">Grain intensity: <span id="film-grain-effect-intensity-val">30</span></label>
    <input type="range" id="film-grain-effect-intensity" min="0" max="100" value="30">
    <span class="hint">10–25 subtle · 30–60 classic 35mm · 70+ gritty.</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="film-grain-effect-download">Download image</button>
  </div>
  <div class="result">
    <canvas id="film-grain-effect-canvas" style="width:100%;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="film-grain-effect-error"></div>
  <p class="note">Monochromatic luminance grain, regenerated fresh on every adjustment. Processed locally in your browser.</p>
</div>
