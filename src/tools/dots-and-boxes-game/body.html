<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 10px">
    <div class="field" style="text-align:left">
      <label for="dots-and-boxes-game-mode">Mode</label>
      <select class="input" id="dots-and-boxes-game-mode">
        <option value="ai" selected>Vs Computer</option>
        <option value="2p">Two players</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="dots-and-boxes-game-new" style="width:100%">New game</button>
    </div>
  </div>
  <p class="muted" id="dots-and-boxes-game-status" style="min-height:24px;font-weight:600"></p>
  <div style="display:inline-block;max-width:100%;overflow:auto">
    <div id="dots-and-boxes-game-board" style="display:inline-block;background:#1c1917;padding:10px;border-radius:10px"></div>
  </div>
  <div class="stat-cards" style="max-width:440px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="dots-and-boxes-game-s1">0</div><div class="l" id="dots-and-boxes-game-l1">You</div></div>
    <div class="stat-card"><div class="v" id="dots-and-boxes-game-s2">0</div><div class="l" id="dots-and-boxes-game-l2">Computer</div></div>
    <div class="stat-card"><div class="v">16</div><div class="l">Boxes total</div></div>
  </div>
  <div class="error" id="dots-and-boxes-game-error"></div>
</div>
