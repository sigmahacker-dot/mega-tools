<div class="tool-card">
  <div class="dropzone" id="image-polaroid-frame-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-polaroid-frame-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-polaroid-frame-wrap" style="text-align:center">
    <canvas id="image-polaroid-frame-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="field">
    <label for="image-polaroid-frame-caption">Caption</label>
    <input type="text" id="image-polaroid-frame-caption" class="input" maxlength="60" placeholder="Write a caption for your polaroid…">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-polaroid-frame-download">Download PNG</button>
  </div>
  <div class="error" id="image-polaroid-frame-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
