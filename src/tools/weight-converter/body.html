<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="weight-converter-value">Value</label>
      <input type="number" step="any" class="input" id="weight-converter-value" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="weight-converter-from">From</label>
      <select class="select" id="weight-converter-from">
        <option value="mg">Milligrams (mg)</option>
        <option value="g">Grams (g)</option>
        <option value="kg" selected>Kilograms (kg)</option>
        <option value="oz">Ounces (oz)</option>
        <option value="lb">Pounds (lb)</option>
        <option value="st">Stones (st)</option>
        <option value="tonne">Tonnes (t)</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="weight-converter-to">To</label>
      <select class="select" id="weight-converter-to">
        <option value="mg">Milligrams (mg)</option>
        <option value="g">Grams (g)</option>
        <option value="kg">Kilograms (kg)</option>
        <option value="oz">Ounces (oz)</option>
        <option value="lb" selected>Pounds (lb)</option>
        <option value="st">Stones (st)</option>
        <option value="tonne">Tonnes (t)</option>
      </select>
    </div>
    <div class="field">
      <label aria-hidden="true">&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-outline" id="weight-converter-swap" type="button">⇄ Swap units</button>
      </div>
    </div>
  </div>
  <div class="error" id="weight-converter-error"></div>
  <div class="result" id="weight-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="weight-converter-result-value">–</div><div class="l">Result</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="weight-converter-table"></tbody>
    </table>
  </div>
</div>
