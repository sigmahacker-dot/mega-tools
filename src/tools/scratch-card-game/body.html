<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="scratch-card-game-won">0</div><div class="l">Cards won</div></div>
    <div class="stat-card"><div class="v" id="scratch-card-game-played">0</div><div class="l">Cards played</div></div>
  </div>
  <p class="muted" id="scratch-card-game-msg" style="min-height:24px">Rub the foil to reveal your prize!</p>
  <div style="display:inline-block;position:relative;max-width:100%">
    <canvas id="scratch-card-game-canvas" width="340" height="170" style="max-width:100%;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);touch-action:none;cursor:crosshair"></canvas>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="scratch-card-game-new">🎫 New Card</button>
  </div>
  <div class="note" style="max-width:440px;margin:12px auto 0;text-align:left;font-size:13px">
    <strong>Prize odds:</strong> 🎰 Jackpot 1% · 💰 Big 4% · 🎁 Medium 10% · 🍬 Small 25%
  </div>
  <div class="error" id="scratch-card-game-error"></div>
</div>
