<div class="tool-card">
  <div class="field">
    <label for="gradient-text-generator-text">Your text</label>
    <input type="text" class="input" id="gradient-text-generator-text" value="Gradient Text" maxlength="60">
  </div>
  <div class="grid2">
    <div class="field"><label for="gradient-text-generator-c1">Color 1</label><input type="color" class="input" id="gradient-text-generator-c1" value="#f59e0b" style="height:40px;padding:4px;"></div>
    <div class="field"><label for="gradient-text-generator-c2">Color 2</label><input type="color" class="input" id="gradient-text-generator-c2" value="#ef4444" style="height:40px;padding:4px;"></div>
    <div class="field"><label for="gradient-text-generator-c3">Color 3</label><input type="color" class="input" id="gradient-text-generator-c3" value="#8b5cf6" style="height:40px;padding:4px;"></div>
    <div class="field"><label for="gradient-text-generator-angle">Angle: <span id="gradient-text-generator-angle-v">90</span>°</label><input type="range" id="gradient-text-generator-angle" min="0" max="360" value="90"></div>
  </div>
  <div class="error" id="gradient-text-generator-error"></div>
  <div class="result mt">
    <div id="gradient-text-generator-preview" style="text-align:center;font-size:3rem;font-weight:900;padding:24px 8px;">Gradient Text</div>
    <div class="field">
      <label for="gradient-text-generator-css">CSS</label>
      <textarea class="textarea" id="gradient-text-generator-css" rows="6" readonly style="font-family:ui-monospace,monospace;font-size:.85rem;"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="gradient-text-generator-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
