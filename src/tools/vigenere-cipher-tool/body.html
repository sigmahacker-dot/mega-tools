<div class="tool-card">
  <div class="field">
    <label for="vigenere-cipher-tool-input">Message</label>
    <textarea class="textarea" id="vigenere-cipher-tool-input" rows="5" placeholder="Type your message"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="vigenere-cipher-tool-key">Keyword (letters only)</label>
      <input class="input" type="text" id="vigenere-cipher-tool-key" placeholder="e.g. SECRET" autocomplete="off">
    </div>
    <div class="field">
      <label for="vigenere-cipher-tool-mode">Mode</label>
      <select class="input" id="vigenere-cipher-tool-mode">
        <option value="encode">Encode</option>
        <option value="decode">Decode</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="vigenere-cipher-tool-run">Run</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="vigenere-cipher-tool-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="vigenere-cipher-tool-copy">Copy output</button></div>
  </div>
  <div class="error" id="vigenere-cipher-tool-error"></div>
</div>
