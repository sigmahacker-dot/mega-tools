<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="macro-meal-planner-protein">Protein target (g)</label>
      <input type="number" class="input" id="macro-meal-planner-protein" min="0" step="any" placeholder="150">
    </div>
    <div class="field">
      <label for="macro-meal-planner-carbs">Carbs target (g)</label>
      <input type="number" class="input" id="macro-meal-planner-carbs" min="0" step="any" placeholder="200">
    </div>
    <div class="field">
      <label for="macro-meal-planner-fat">Fat target (g)</label>
      <input type="number" class="input" id="macro-meal-planner-fat" min="0" step="any" placeholder="65">
    </div>
  </div>
  <div class="field">
    <label for="macro-meal-planner-filter">Search foods</label>
    <input type="text" class="input" id="macro-meal-planner-filter" placeholder="Type to filter the food list...">
  </div>
  <div class="field">
    <label>Meal foods</label>
    <div id="macro-meal-planner-rows"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-outline" id="macro-meal-planner-add" type="button">+ Add food</button>
    </div>
  </div>
  <div class="error" id="macro-meal-planner-error"></div>
  <div class="result" id="macro-meal-planner-result">
    <div id="macro-meal-planner-out"></div>
    <p class="note">Nutrition values are typical per-100g estimates. For information only &mdash; not medical advice.</p>
  </div>
</div>
