<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="decimal-time-converter-dec">Decimal hours</label>
      <input type="number" class="input" id="decimal-time-converter-dec" step="any" min="0" placeholder="e.g. 8.75" autocomplete="off">
    </div>
    <div class="field">
      <label for="decimal-time-converter-hms">Hours : minutes [: seconds]</label>
      <input type="text" class="input" id="decimal-time-converter-hms" placeholder="e.g. 8:45" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="error" id="decimal-time-converter-error"></div>
  <div class="result" id="decimal-time-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="decimal-time-converter-mins">–</div><div class="l">Total minutes</div></div>
      <div class="stat-card"><div class="v" id="decimal-time-converter-secs">–</div><div class="l">Total seconds</div></div>
      <div class="stat-card"><div class="v" id="decimal-time-converter-day">–</div><div class="l">Fraction of a day</div></div>
    </div>
    <p class="note">Payroll style: 0.25 h = 15 min, 0.5 h = 30 min, 0.75 h = 45 min.</p>
  </div>
</div>
