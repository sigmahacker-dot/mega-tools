<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label>Before photo</label>
      <div class="dropzone" id="before-after-slider-maker-drop1">
        <span class="dz-icon">⬅️</span>
        <strong>Drop before image</strong> or click to browse
        <input type="file" id="before-after-slider-maker-file1" accept="image/*" class="hidden">
      </div>
      <div class="preview hidden" id="before-after-slider-maker-wrap1" style="text-align:center;margin-top:8px">
        <img id="before-after-slider-maker-img1" class="preview-img" style="max-width:100%;border-radius:8px" alt="Before">
      </div>
    </div>
    <div class="field">
      <label>After photo</label>
      <div class="dropzone" id="before-after-slider-maker-drop2">
        <span class="dz-icon">➡️</span>
        <strong>Drop after image</strong> or click to browse
        <input type="file" id="before-after-slider-maker-file2" accept="image/*" class="hidden">
      </div>
      <div class="preview hidden" id="before-after-slider-maker-wrap2" style="text-align:center;margin-top:8px">
        <img id="before-after-slider-maker-img2" class="preview-img" style="max-width:100%;border-radius:8px" alt="After">
      </div>
    </div>
  </div>
  <div class="field">
    <label for="before-after-slider-maker-title">Slider page title</label>
    <input type="text" id="before-after-slider-maker-title" class="input" maxlength="80" value="Before / After" placeholder="Page title…">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="before-after-slider-maker-download">Download HTML</button>
  </div>
  <div class="error" id="before-after-slider-maker-error"></div>
  <p class="note">The generated HTML is a single self-contained file — both images are embedded inside it, so it works offline. Files never leave your device — everything is processed in your browser.</p>
</div>
