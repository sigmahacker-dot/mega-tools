<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tv-viewing-distance-calculator-diag">Screen diagonal</label>
      <input type="number" step="any" min="0" class="input" id="tv-viewing-distance-calculator-diag" placeholder="e.g. 65">
    </div>
    <div class="field">
      <label for="tv-viewing-distance-calculator-units">Diagonal unit</label>
      <select class="select" id="tv-viewing-distance-calculator-units">
        <option value="in" selected>Inches</option>
        <option value="cm">Centimetres</option>
      </select>
    </div>
  </div>
  <div class="error" id="tv-viewing-distance-calculator-error"></div>
  <div class="result" id="tv-viewing-distance-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="tv-viewing-distance-calculator-ideal">–</div><div class="l">THX 36° ideal distance</div></div>
      <div class="stat-card"><div class="v" id="tv-viewing-distance-calculator-close">–</div><div class="l">Closest (40° immersive)</div></div>
      <div class="stat-card"><div class="v" id="tv-viewing-distance-calculator-far">–</div><div class="l">Farthest (SMPTE 30°)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Screen detail</th><th>Value</th></tr></thead>
      <tbody id="tv-viewing-distance-calculator-table"></tbody>
    </table>
    <p class="note">d = (width/2) ÷ tan(angle/2). For 4K content, full detail is visible up to about 1.5× the diagonal — sitting between the THX ideal and the 40° line is a sweet spot for 4K.</p>
  </div>
</div>
