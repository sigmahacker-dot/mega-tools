<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="weight-loss-timeline-calculator-now">Current weight (kg)</label>
      <input class="input" id="weight-loss-timeline-calculator-now" type="number" min="20" max="400" step="0.1" placeholder="e.g. 90">
    </div>
    <div class="field">
      <label for="weight-loss-timeline-calculator-goal">Goal weight (kg)</label>
      <input class="input" id="weight-loss-timeline-calculator-goal" type="number" min="20" max="400" step="0.1" placeholder="e.g. 75">
    </div>
    <div class="field">
      <label for="weight-loss-timeline-calculator-deficit">Daily calorie deficit (kcal)</label>
      <input class="input" id="weight-loss-timeline-calculator-deficit" type="number" min="50" max="2000" step="10" placeholder="e.g. 500">
    </div>
    <div class="field" style="align-self:end">
      <button class="btn btn-primary" id="weight-loss-timeline-calculator-calc">Calculate</button>
    </div>
  </div>
  <div class="stat-cards hidden" id="weight-loss-timeline-calculator-out">
    <div class="stat-card"><div class="v" id="weight-loss-timeline-calculator-rate">–</div><div class="l">kg per week</div></div>
    <div class="stat-card"><div class="v" id="weight-loss-timeline-calculator-weeks">–</div><div class="l">Weeks to goal</div></div>
    <div class="stat-card"><div class="v" id="weight-loss-timeline-calculator-date">–</div><div class="l">Projected goal date</div></div>
  </div>
  <div class="result hidden" id="weight-loss-timeline-calculator-table"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Aim for 0.5–1 kg/week; larger deficits need supervision.</p>
  <div class="error" id="weight-loss-timeline-calculator-error"></div>
</div>
