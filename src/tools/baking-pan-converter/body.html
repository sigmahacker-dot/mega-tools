<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="baking-pan-converter-shapeA">Original pan (A) shape</label>
      <select class="select" id="baking-pan-converter-shapeA">
        <option value="round" selected>Round</option>
        <option value="rect">Square / rectangular</option>
      </select>
    </div>
    <div class="field">
      <label for="baking-pan-converter-shapeB">New pan (B) shape</label>
      <select class="select" id="baking-pan-converter-shapeB">
        <option value="round" selected>Round</option>
        <option value="rect">Square / rectangular</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="baking-pan-converter-a1">Pan A: diameter or length</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-a1" placeholder="e.g. 8">
    </div>
    <div class="field">
      <label for="baking-pan-converter-depthA">Pan A: depth (height)</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-depthA" placeholder="e.g. 2" value="2">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="baking-pan-converter-b1">Pan B: diameter or length</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-b1" placeholder="e.g. 9">
    </div>
    <div class="field">
      <label for="baking-pan-converter-depthB">Pan B: depth (height)</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-depthB" placeholder="e.g. 3" value="3">
    </div>
  </div>
  <div class="grid2">
    <div class="field hidden" id="baking-pan-converter-a2-wrap">
      <label for="baking-pan-converter-a2">Pan A: width (rectangular only)</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-a2" placeholder="e.g. 8">
    </div>
    <div class="field hidden" id="baking-pan-converter-b2-wrap">
      <label for="baking-pan-converter-b2">Pan B: width (rectangular only)</label>
      <input type="number" step="any" min="0" class="input" id="baking-pan-converter-b2" placeholder="e.g. 13">
    </div>
  </div>
  <div class="field">
    <label for="baking-pan-converter-units">Units</label>
    <select class="select" id="baking-pan-converter-units">
      <option value="in" selected>Inches</option>
      <option value="cm">Centimetres</option>
    </select>
  </div>
  <div class="error" id="baking-pan-converter-error"></div>
  <div class="result" id="baking-pan-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="baking-pan-converter-factor">–</div><div class="l">Scale factor (× recipe)</div></div>
      <div class="stat-card"><div class="v" id="baking-pan-converter-volA">–</div><div class="l">Pan A volume</div></div>
      <div class="stat-card"><div class="v" id="baking-pan-converter-volB">–</div><div class="l">Pan B volume</div></div>
    </div>
    <p class="note" id="baking-pan-converter-note">Enter both pans' dimensions to compare.</p>
  </div>
</div>
