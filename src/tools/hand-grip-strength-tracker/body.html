<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="hand-grip-strength-tracker-gender">Gender</label>
      <select class="select" id="hand-grip-strength-tracker-gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="hand-grip-strength-tracker-age">Age</label>
      <input type="number" class="input" id="hand-grip-strength-tracker-age" min="10" max="110" step="1" placeholder="35">
    </div>
    <div class="field">
      <label for="hand-grip-strength-tracker-reading">Reading (kg)</label>
      <input type="number" class="input" id="hand-grip-strength-tracker-reading" min="0" step="any" placeholder="42">
    </div>
    <div class="field">
      <label for="hand-grip-strength-tracker-hand">Hand</label>
      <select class="select" id="hand-grip-strength-tracker-hand">
        <option>Dominant</option><option>Non-dominant</option>
      </select>
    </div>
  </div>
  <div class="btn-row"><button class="btn" id="hand-grip-strength-tracker-add" type="button">Log reading</button></div>
  <div class="error" id="hand-grip-strength-tracker-error"></div>
  <div class="result" id="hand-grip-strength-tracker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hand-grip-strength-tracker-range">&ndash;</div><div class="l">Reference range</div></div>
      <div class="stat-card"><div class="v" id="hand-grip-strength-tracker-verdict">&ndash;</div><div class="l">Latest vs range</div></div>
    </div>
    <div id="hand-grip-strength-tracker-out"></div>
    <p class="note">Approximate reference ranges for illustration, not clinical cut-offs. For information only &mdash; not medical advice.</p>
  </div>
</div>
