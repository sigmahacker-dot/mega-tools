<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cook-orig">Original servings</label><input type="number" class="input" id="cook-orig" min="0" step="any" placeholder="4"></div>
    <div class="field"><label for="cook-want">Desired servings</label><input type="number" class="input" id="cook-want" min="0" step="any" placeholder="6"></div>
  </div>
  <table class="data">
    <thead><tr><th>Amount</th><th>Unit</th><th>Ingredient</th></tr></thead>
    <tbody id="cook-rows"></tbody>
  </table>
  <div class="error" id="cooking-measurement-scaler-error"></div>
  <div class="result" id="cook-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cook-factor">–</div><div class="l">Scale factor</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Ingredient</th><th>Scaled amount</th><th>Metric equiv.</th></tr></thead>
      <tbody id="cook-body"><tr><td colspan="3" class="muted">Enter servings and at least one ingredient.</td></tr></tbody>
    </table>
    <p class="note">Seasonings, leavening and cooking time do not scale perfectly — adjust to taste.</p>
  </div>
</div>
