<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <label for="yoga-pose-timer-seq">Sequence</label>
    <select class="input" id="yoga-pose-timer-seq">
      <option value="sun">Sun Salutation A</option>
      <option value="moon">Moon Salutation</option>
    </select>
  </div>
  <div class="stat-cards" style="max-width:520px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="yoga-pose-timer-count" style="font-size:2.2em">–</div><div class="l">Seconds left</div></div>
    <div class="stat-card"><div class="v" id="yoga-pose-timer-pose" style="font-size:1.1em">Ready</div><div class="l">Current pose</div></div>
  </div>
  <p class="muted" id="yoga-pose-timer-next" style="min-height:24px">Next: –</p>
  <p class="hint" id="yoga-pose-timer-tip"></p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="yoga-pose-timer-start">Start</button>
    <button class="btn btn-outline" id="yoga-pose-timer-stop">Stop</button>
  </div>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance. Skip any pose that causes pain.</p>
  <div class="error" id="yoga-pose-timer-error"></div>
</div>
