<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="spaceship-name-generator-class">Ship class</label>
      <select class="select" id="spaceship-name-generator-class">
        <option value="frigate">Frigate</option>
        <option value="cruiser">Cruiser</option>
        <option value="dreadnought">Dreadnought</option>
        <option value="shuttle">Shuttle</option>
        <option value="carrier">Carrier</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="spaceship-name-generator-go" type="button">Generate Ship Names</button>
      </div>
    </div>
  </div>
  <div class="error" id="spaceship-name-generator-error"></div>
  <div class="mt" id="spaceship-name-generator-list"></div>
</div>
