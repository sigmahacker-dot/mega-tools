<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tip-bill">Bill amount ($)</label>
      <input type="number" class="input" id="tip-bill" min="0" step="any" placeholder="85.50">
    </div>
    <div class="field">
      <label for="tip-people">Number of people</label>
      <input type="number" class="input" id="tip-people" min="1" step="1" placeholder="2">
    </div>
  </div>
  <div class="field">
    <label for="tip-percent">Tip (%)</label>
    <input type="number" class="input" id="tip-percent" min="0" max="100" step="any" placeholder="18">
  </div>
  <div class="btn-row">
    <button class="btn btn-sm btn-outline" data-tip="10">10%</button>
    <button class="btn btn-sm btn-outline" data-tip="15">15%</button>
    <button class="btn btn-sm btn-outline" data-tip="18">18%</button>
    <button class="btn btn-sm btn-outline" data-tip="20">20%</button>
    <button class="btn btn-sm btn-outline" data-tip="25">25%</button>
  </div>
  <div class="error" id="tip-calculator-error"></div>
  <div class="result" id="tip-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="tip-tip-amount">–</div><div class="l">Tip amount</div></div>
      <div class="stat-card"><div class="v" id="tip-total">–</div><div class="l">Total with tip</div></div>
      <div class="stat-card"><div class="v" id="tip-per-person">–</div><div class="l">Per person</div></div>
    </div>
    <p class="note">The total is split evenly among everyone.</p>
  </div>
</div>
