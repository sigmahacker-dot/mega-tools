<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="hero-section-generator-eyebrow">Eyebrow text</label>
      <input class="input" id="hero-section-generator-eyebrow" value="NEW — VERSION 3.0 IS LIVE">
    </div>
    <div class="field">
      <label for="hero-section-generator-headline">Headline</label>
      <input class="input" id="hero-section-generator-headline" value="Build faster. Ship sooner.">
    </div>
  </div>
  <div class="field">
    <label for="hero-section-generator-sub">Subheadline</label>
    <textarea class="textarea" id="hero-section-generator-sub" rows="2">The all-in-one toolkit your team needs to design, prototype and launch products in record time.</textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="hero-section-generator-cta1">Primary CTA ("Text|/link")</label>
      <input class="input" id="hero-section-generator-cta1" value="Start free trial|/signup">
    </div>
    <div class="field">
      <label for="hero-section-generator-cta2">Secondary CTA ("Text|/link")</label>
      <input class="input" id="hero-section-generator-cta2" value="Watch demo|/demo">
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="hero-section-generator-c1">Gradient color 1</label>
      <input class="input" id="hero-section-generator-c1" type="color" value="#14532d">
    </div>
    <div class="field">
      <label for="hero-section-generator-c2">Gradient color 2</label>
      <input class="input" id="hero-section-generator-c2" type="color" value="#052e16">
    </div>
    <div class="field">
      <label for="hero-section-generator-text">Text color</label>
      <input class="input" id="hero-section-generator-text" type="color" value="#ffffff">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="hero-section-generator-align">Text alignment</label>
      <select class="select" id="hero-section-generator-align">
        <option value="center" selected>Center</option>
        <option value="left">Left</option>
      </select>
    </div>
    <div class="field">
      <label for="hero-section-generator-angle">Gradient angle (deg)</label>
      <input class="input" id="hero-section-generator-angle" type="number" value="135" min="0" max="360">
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="hero-section-generator-preview" style="border:1px solid #27272a;border-radius:12px;overflow:hidden"></div>
  </div>
  <div class="error" id="hero-section-generator-error"></div>
  <div class="field">
    <label for="hero-section-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="hero-section-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="hero-section-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="hero-section-generator-download">Download hero.html</button>
  </div>
</div>
