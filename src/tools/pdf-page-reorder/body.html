<div class="tool-card">
  <div class="field">
    <label for="pdf-page-reorder-file">Upload PDF</label>
    <input type="file" class="input" id="pdf-page-reorder-file" accept="application/pdf,.pdf">
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="pdf-page-reorder-go" disabled>Save reordered PDF</button>
  </div>
  <div class="error" id="pdf-page-reorder-error"></div>
  <div class="result" id="pdf-page-reorder-result" hidden>
    <p class="muted">Click a page to select it, then move it with the buttons.</p>
    <p><b>New order:</b> <span id="pdf-page-reorder-seq" class="muted"></span></p>
    <div class="btn-row" id="pdf-page-reorder-controls" style="margin-bottom:8px">
      <button class="btn btn-sm btn-outline" id="pdf-page-reorder-up">↑ Move up</button>
      <button class="btn btn-sm btn-outline" id="pdf-page-reorder-down">↓ Move down</button>
      <button class="btn btn-sm btn-outline" id="pdf-page-reorder-top">⇤ To top</button>
      <button class="btn btn-sm btn-outline" id="pdf-page-reorder-bottom">⇥ To bottom</button>
    </div>
    <ul id="pdf-page-reorder-list" style="list-style:none;padding:0;max-height:320px;overflow:auto"></ul>
  </div>
</div>
