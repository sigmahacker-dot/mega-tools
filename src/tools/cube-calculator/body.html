<div class="tool-card">
  <div class="field"><label for="cube-calculator-s">Side length (s)</label><input class="input" id="cube-calculator-s" type="number" value="5" min="0" step="any"></div>
  <div class="btn-row"><button class="btn btn-primary" id="cube-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="cube-calculator-v">125</div><div class="l">Volume</div></div>
    <div class="stat-card"><div class="v" id="cube-calculator-sa">150</div><div class="l">Surface area</div></div>
    <div class="stat-card"><div class="v" id="cube-calculator-dg">8.660</div><div class="l">Space diagonal</div></div>
  </div>
  <div class="result"><pre class="code" id="cube-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="cube-calculator-error"></div>
