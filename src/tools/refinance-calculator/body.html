<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="refinance-calculator-balance">Current loan balance ($)</label><input class="input" id="refinance-calculator-balance" type="number" min="0" step="any" value="300000"></div>
    <div class="field"><label for="refinance-calculator-rate">Current rate (% APR)</label><input class="input" id="refinance-calculator-rate" type="number" min="0" step="any" value="7"></div>
    <div class="field"><label for="refinance-calculator-left">Years remaining</label><input class="input" id="refinance-calculator-left" type="number" min="1" step="any" value="25"></div>
    <div class="field"><label for="refinance-calculator-newrate">New rate (% APR)</label><input class="input" id="refinance-calculator-newrate" type="number" min="0" step="any" value="6"></div>
    <div class="field"><label for="refinance-calculator-newterm">New loan term (years)</label><input class="input" id="refinance-calculator-newterm" type="number" min="1" step="any" value="30"></div>
    <div class="field"><label for="refinance-calculator-costs">Closing costs ($)</label><input class="input" id="refinance-calculator-costs" type="number" min="0" step="any" value="6000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="refinance-calculator-calc">Calculate</button></div>
  <div class="error" id="refinance-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="refinance-calculator-cur">—</div><div class="l">Current monthly</div></div>
    <div class="stat-card"><div class="v" id="refinance-calculator-new">—</div><div class="l">New monthly</div></div>
    <div class="stat-card"><div class="v" id="refinance-calculator-save">—</div><div class="l">Monthly savings</div></div>
    <div class="stat-card"><div class="v" id="refinance-calculator-breakeven">—</div><div class="l">Break-even (months)</div></div>
  </div>
  <table class="data" id="refinance-calculator-table"></table>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
