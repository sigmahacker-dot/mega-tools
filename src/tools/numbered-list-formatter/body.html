<div class="tool-card">
  <div class="field">
    <label for="numbered-list-formatter-input">Items (one per line)</label>
    <textarea class="textarea" id="numbered-list-formatter-input" rows="6" placeholder="Apples&#10;Bananas&#10;Cherries"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="numbered-list-formatter-style">Number style</label>
      <select class="input" id="numbered-list-formatter-style">
        <option value="1.">1. — 1. 2. 3.</option>
        <option value="1)">1) — 1) 2) 3)</option>
        <option value="a.">a. — a. b. c.</option>
        <option value="A.">A. — A. B. C.</option>
        <option value="i.">i. — i. ii. iii.</option>
        <option value="I.">I. — I. II. III.</option>
      </select>
    </div>
    <div class="field">
      <label for="numbered-list-formatter-start">Start at</label>
      <input class="input" type="number" id="numbered-list-formatter-start" min="1" max="999" value="1">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="numbered-list-formatter-run">Format</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="numbered-list-formatter-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="numbered-list-formatter-copy">Copy list</button></div>
  </div>
  <div class="error" id="numbered-list-formatter-error"></div>
</div>
