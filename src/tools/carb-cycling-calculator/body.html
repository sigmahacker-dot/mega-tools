<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cc-weight">Weight (lb)</label><input type="number" class="input" id="cc-weight" min="0" step="any" placeholder="170"></div>
    <div class="field"><label for="cc-height">Height (inches)</label><input type="number" class="input" id="cc-height" min="0" step="any" placeholder="70"></div>
    <div class="field"><label for="cc-age">Age (years)</label><input type="number" class="input" id="cc-age" min="10" max="100" step="1" placeholder="30"></div>
    <div class="field"><label for="cc-sex">Sex</label>
      <select class="input" id="cc-sex"><option value="m">Male</option><option value="f">Female</option></select>
    </div>
    <div class="field"><label for="cc-activity">Activity level</label>
      <select class="input" id="cc-activity">
        <option value="1.2">Sedentary</option>
        <option value="1.375" selected>Lightly active</option>
        <option value="1.55">Moderately active</option>
        <option value="1.725">Very active</option>
        <option value="1.9">Extremely active</option>
      </select>
    </div>
    <div class="field"><label for="cc-goal">Goal</label>
      <select class="input" id="cc-goal"><option value="0.8">Cut (−20%)</option><option value="1" selected>Maintain</option><option value="1.1">Lean gain (+10%)</option></select>
    </div>
  </div>
  <div class="error" id="carb-cycling-calculator-error"></div>
  <div class="result" id="cc-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cc-tdee">–</div><div class="l">Daily target cal</div></div>
      <div class="stat-card"><div class="v" id="cc-protein">–</div><div class="l">Protein (daily)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Day type</th><th>Carbs</th><th>Fat</th><th>Calories</th></tr></thead>
      <tbody id="cc-body"><tr><td colspan="4" class="muted">Enter your stats to build the plan.</td></tr></tbody>
    </table>
    <p class="note">Protein fixed at 1 g/lb. General fitness guidance, not medical advice.</p>
  </div>
</div>
