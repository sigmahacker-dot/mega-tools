<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="open-graph-preview-title">Title</label><input type="text" class="input" id="open-graph-preview-title" value="Travel With Rawi — Hunza Valley Tours" maxlength="120"></div>
    <div class="field"><label for="open-graph-preview-site">Site name</label><input type="text" class="input" id="open-graph-preview-site" value="Travel With Rawi" maxlength="60"></div>
  </div>
  <div class="field"><label for="open-graph-preview-desc">Description</label><textarea class="textarea" id="open-graph-preview-desc" rows="2" maxlength="300">8-day Hunza Valley tour from Islamabad — Attabad Lake, Baltit Fort, Khunjerab Pass. Small groups, expert local guides.</textarea></div>
  <div class="field"><label for="open-graph-preview-img">Image URL (absolute https://)</label><input type="text" class="input" id="open-graph-preview-img" placeholder="https://example.com/og-image.jpg"></div>
  <div class="error" id="open-graph-preview-error"></div>
  <div class="result mt">
    <div class="grid2">
      <div class="field">
        <label>Facebook / LinkedIn card</label>
        <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;">
          <div id="open-graph-preview-fbimg" style="height:150px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.85rem;">No image</div>
          <div style="padding:10px 12px;"><div style="font-size:.72rem;color:#65676b;text-transform:uppercase;" id="open-graph-preview-fbsite">—</div><div style="font-weight:700;color:#050505;font-size:.95rem;" id="open-graph-preview-fbtitle">—</div><div style="color:#65676b;font-size:.85rem;" id="open-graph-preview-fbdesc">—</div></div>
        </div>
      </div>
      <div class="field">
        <label>X (Twitter) card</label>
        <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;">
          <div id="open-graph-preview-ximg" style="height:150px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.85rem;">No image</div>
          <div style="padding:10px 12px;"><div style="font-weight:700;color:#0f1419;font-size:.95rem;" id="open-graph-preview-xtitle">—</div><div style="color:#536471;font-size:.85rem;" id="open-graph-preview-xdesc">—</div></div>
        </div>
      </div>
    </div>
    <div class="field mt">
      <label for="open-graph-preview-tags">Meta tags (paste into &lt;head&gt;)</label>
      <textarea class="textarea" id="open-graph-preview-tags" rows="9" readonly style="font-family:ui-monospace,monospace;font-size:.8rem;"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="open-graph-preview-copy" type="button">Copy tags</button>
    </div>
  </div>
</div>
