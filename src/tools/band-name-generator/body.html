<div class="tool-card">
  <div class="field"><label for="bname-genre">Genre</label>
    <select class="select" id="bname-genre">
      <option value="rock">Rock</option>
      <option value="metal">Metal</option>
      <option value="pop">Pop</option>
      <option value="hiphop">Hip-Hop</option>
      <option value="electronic">Electronic</option>
      <option value="jazz">Jazz</option>
      <option value="punk">Punk</option>
      <option value="indie">Indie</option>
    </select>
  </div>
  <div class="error" id="band-name-generator-error"></div>
  <div class="result" id="bname-result">
    <div id="bname-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="bname-go" type="button">Generate band names</button>
    </div>
    <p class="note">Click any name to copy it. Original combinations — check trademarks before commercial use.</p>
  </div>
</div>
