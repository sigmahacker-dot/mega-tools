<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="toggle-switch-generator-width">Switch width (px)</label>
      <input class="input" id="toggle-switch-generator-width" type="number" value="56" min="32" max="120">
    </div>
    <div class="field">
      <label for="toggle-switch-generator-on">ON color</label>
      <input class="input" id="toggle-switch-generator-on" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="toggle-switch-generator-off">OFF color</label>
      <input class="input" id="toggle-switch-generator-off" type="color" value="#52525b">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="toggle-switch-generator-knob">Knob color</label>
      <input class="input" id="toggle-switch-generator-knob" type="color" value="#ffffff">
    </div>
    <div class="field">
      <label for="toggle-switch-generator-label">Label text</label>
      <input class="input" id="toggle-switch-generator-label" value="Enable notifications">
    </div>
  </div>
  <div class="field">
    <label>Live preview (clickable)</label>
    <div id="toggle-switch-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:32px;background:#18181b;display:flex;justify-content:center;align-items:center;gap:16px"></div>
  </div>
  <div class="error" id="toggle-switch-generator-error"></div>
  <div class="field">
    <label for="toggle-switch-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="toggle-switch-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="toggle-switch-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="toggle-switch-generator-download">Download toggle.html</button>
  </div>
</div>
