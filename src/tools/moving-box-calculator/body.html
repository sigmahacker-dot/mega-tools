<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="move-bedrooms">Bedrooms</label><input type="number" class="input" id="move-bedrooms" min="0" max="10" step="1" placeholder="2"></div>
    <div class="field"><label for="move-living">Living / family rooms</label><input type="number" class="input" id="move-living" min="0" max="6" step="1" placeholder="1"></div>
    <div class="field"><label for="move-kitchen">Kitchens</label><input type="number" class="input" id="move-kitchen" min="0" max="3" step="1" placeholder="1"></div>
    <div class="field"><label for="move-dining">Dining rooms / offices</label><input type="number" class="input" id="move-dining" min="0" max="6" step="1" placeholder="1"></div>
  </div>
  <div class="error" id="moving-box-calculator-error"></div>
  <div class="result" id="move-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="move-total">–</div><div class="l">Total boxes</div></div>
      <div class="stat-card"><div class="v" id="move-tape">–</div><div class="l">Tape rolls</div></div>
      <div class="stat-card"><div class="v" id="move-wardrobe">–</div><div class="l">Wardrobe boxes</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Box size</th><th>Count</th></tr></thead>
      <tbody id="move-body"><tr><td colspan="2" class="muted">Enter your rooms to estimate boxes.</td></tr></tbody>
    </table>
    <p class="note">Estimates from standard moving guides. Pack a few extra boxes of each size.</p>
  </div>
</div>
