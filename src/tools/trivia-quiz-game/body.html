<div class="tool-card">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="trivia-quiz-game-q">–</div><div class="l">Question</div></div>
    <div class="stat-card"><div class="v" id="trivia-quiz-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="trivia-quiz-game-best">0</div><div class="l">Best /10</div></div>
  </div>
  <div id="trivia-quiz-game-play" hidden>
    <p id="trivia-quiz-game-cat" class="muted"></p>
    <h3 id="trivia-quiz-game-text" style="margin:8px 0 16px"></h3>
    <div id="trivia-quiz-game-opts" style="display:grid;gap:8px"></div>
    <p class="muted" id="trivia-quiz-game-feedback" style="min-height:24px;margin-top:12px"></p>
  </div>
  <div id="trivia-quiz-game-done" hidden style="text-align:center">
    <h3 id="trivia-quiz-game-final"></h3>
    <p class="muted" id="trivia-quiz-game-verdict"></p>
  </div>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn" id="trivia-quiz-game-start">Start quiz</button>
  </div>
  <div class="error" id="trivia-quiz-game-error"></div>
</div>
