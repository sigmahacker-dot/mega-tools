<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="meeting-minutes-maker-title">Meeting title</label>
      <input class="input" id="meeting-minutes-maker-title" type="text" placeholder="e.g. Weekly Team Sync" maxlength="80">
    </div>
    <div class="field">
      <label for="meeting-minutes-maker-date">Date</label>
      <input class="input" id="meeting-minutes-maker-date" type="date">
    </div>
  </div>
  <div class="field">
    <label for="meeting-minutes-maker-attendees">Attendees (comma separated)</label>
    <input class="input" id="meeting-minutes-maker-attendees" type="text" placeholder="e.g. Alex, Sarah, Dan" maxlength="200">
  </div>
  <div class="grid2">
    <div class="field">
      <label>Add decision</label>
      <div style="display:flex;gap:8px">
        <input class="input" id="meeting-minutes-maker-decision" type="text" placeholder="Decision made" maxlength="160">
        <button class="btn btn-outline btn-sm" id="meeting-minutes-maker-add-decision" type="button" style="white-space:nowrap">+ Add</button>
      </div>
    </div>
    <div class="field">
      <label>Add discussion point</label>
      <div style="display:flex;gap:8px">
        <input class="input" id="meeting-minutes-maker-point" type="text" placeholder="Key point discussed" maxlength="160">
        <button class="btn btn-outline btn-sm" id="meeting-minutes-maker-add-point" type="button" style="white-space:nowrap">+ Add</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Add action item</label>
    <div class="grid3">
      <input class="input" id="meeting-minutes-maker-action" type="text" placeholder="Action item" maxlength="160">
      <input class="input" id="meeting-minutes-maker-owner" type="text" placeholder="Owner" maxlength="40">
      <div style="display:flex;gap:8px">
        <input class="input" id="meeting-minutes-maker-due" type="date" style="flex:1">
        <button class="btn btn-outline btn-sm" id="meeting-minutes-maker-add-action" type="button" style="white-space:nowrap">+ Add</button>
      </div>
    </div>
  </div>
  <div class="error" id="meeting-minutes-maker-error"></div>
  <div id="meeting-minutes-maker-list" style="margin-top:8px"></div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-primary btn-sm" id="meeting-minutes-maker-copy" type="button">Copy Minutes</button>
    <button class="btn btn-outline btn-sm" id="meeting-minutes-maker-download" type="button">Download .txt</button>
  </div>
</div>
