<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="uuid-generator-count">How many? (1–500)</label>
      <input type="number" class="input" id="uuid-generator-count" min="1" max="500" value="10">
    </div>
    <div class="field">
      <label>Formatting</label>
      <div class="btn-row">
        <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;">
          <input type="checkbox" id="uuid-generator-uppercase"> Uppercase
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;">
          <input type="checkbox" id="uuid-generator-braces"> {Braces}
        </label>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="uuid-generator-generate">Generate UUIDs</button>
    <button class="btn btn-outline" id="uuid-generator-copy">Copy all</button>
    <button class="btn btn-outline" id="uuid-generator-download">Download .txt</button>
  </div>
  <div class="error" id="uuid-generator-error"></div>
  <div class="result" id="uuid-generator-result">
    <div class="field">
      <label for="uuid-generator-output">Generated UUIDs</label>
      <textarea class="textarea" id="uuid-generator-output" rows="10" readonly placeholder="Your UUIDs will appear here…"></textarea>
    </div>
    <p class="muted" id="uuid-generator-status"></p>
  </div>
</div>
