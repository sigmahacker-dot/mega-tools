<div class="tool-card">
  <div class="dropzone" id="audio-speed-changer-drop">
    <span class="dz-icon">⏩</span>
    <strong>Drop an audio file here</strong> or click to browse
    <input type="file" id="audio-speed-changer-file" accept="audio/*" class="hidden">
  </div>
  <div class="field">
    <label for="audio-speed-changer-speed">Speed: <span id="audio-speed-changer-speed-val">1.00</span>×</label>
    <input type="range" id="audio-speed-changer-speed" min="0.5" max="2" step="0.05" value="1">
    <span class="hint">Pitch shifts naturally with speed, like a tape machine. New duration: <strong id="audio-speed-changer-newdur">—</strong></span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="audio-speed-changer-go">Change speed &amp; download WAV</button>
  </div>
  <div class="error" id="audio-speed-changer-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
