<div class="tool-card">
  <h2>Line Sorter</h2>
  <p class="muted">Sort, reverse or shuffle the lines of any list.</p>
  <div class="field">
    <label for="line-sorter-input">Your lines</label>
    <textarea class="textarea" id="line-sorter-input" rows="8" placeholder="Paste your lines here..."></textarea>
  </div>
  <div class="field">
    <label for="line-sorter-mode">Sort mode</label>
    <select class="select" id="line-sorter-mode">
      <option value="az">A-Z (alphabetical)</option>
      <option value="za">Z-A (reverse alphabetical)</option>
      <option value="numeric">Numeric (by first number in line)</option>
      <option value="length">By length (shortest first)</option>
      <option value="reverse">Reverse order</option>
      <option value="shuffle">Shuffle (random)</option>
    </select>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="line-sorter-run">Sort lines</button>
    <button class="btn btn-outline" id="line-sorter-clear">Clear</button>
  </div>
  <div class="error" id="line-sorter-error"></div>
  <div class="result" id="line-sorter-result">
    <div class="field">
      <label for="line-sorter-output">Result</label>
      <textarea class="textarea" id="line-sorter-output" rows="8" readonly placeholder="Sorted lines will appear here..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="line-sorter-copy">Copy result</button>
      <button class="btn btn-outline" id="line-sorter-download">Download .txt</button>
    </div>
  </div>
</div>
