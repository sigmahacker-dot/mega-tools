<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="shades-tints-generator-base">Base color</label>
      <input type="color" class="input" id="shades-tints-generator-base" value="#4d7c0f" style="height:48px;padding:4px;">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-outline" id="shades-tints-generator-copy">Copy all HEX</button>
    </div>
  </div>
  <div class="error" id="shades-tints-generator-error"></div>
  <div class="result" id="shades-tints-generator-result">
    <div class="field">
      <label>Tints &rarr; base &rarr; shades (click to copy)</label>
      <div id="shades-tints-generator-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;"></div>
    </div>
  </div>
</div>
