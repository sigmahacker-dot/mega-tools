<div class="tool-card">
  <div class="field">
    <label for="character-counter-input">Your text</label>
    <textarea class="textarea" id="character-counter-input" rows="8" placeholder="Type or paste your text here..."></textarea>
  </div>
  <div class="error" id="character-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="character-counter-chars">0</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="character-counter-charsns">0</div><div class="l">Without spaces</div></div>
    <div class="stat-card"><div class="v" id="character-counter-words">0</div><div class="l">Words</div></div>
    <div class="stat-card"><div class="v" id="character-counter-lines">0</div><div class="l">Lines</div></div>
  </div>
  <div class="grid2 mt">
    <div class="stat-card">
      <div class="v" id="character-counter-twitter">280 left</div>
      <div class="l">X / Twitter (280 limit)</div>
      <div class="progress mt"><div id="character-counter-twitterbar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="v" id="character-counter-sms">0 segments</div>
      <div class="l">SMS segments</div>
      <p class="muted mt" id="character-counter-smsdetail" style="font-size:.85rem">0 / 160 chars in current segment</p>
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-outline btn-sm" id="character-counter-clear" type="button">Clear</button>
  </div>
</div>
