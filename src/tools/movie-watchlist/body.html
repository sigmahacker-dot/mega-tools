<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="movie-watchlist-avg">—</div><div class="l">Average rating</div></div>
    <div class="stat-card"><div class="v" id="movie-watchlist-count">0</div><div class="l">Movies</div></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="movie-watchlist-title">Movie title</label>
      <input class="input" type="text" id="movie-watchlist-title" placeholder="Movie title">
    </div>
    <div class="field">
      <label for="movie-watchlist-year">Year</label>
      <input class="input" type="number" id="movie-watchlist-year" placeholder="2024" min="1888" max="2100">
    </div>
    <div class="field">
      <label>Your rating</label>
      <div class="btn-row" id="movie-watchlist-stars">
        <button class="btn btn-outline btn-sm" data-r="1">★</button>
        <button class="btn btn-outline btn-sm" data-r="2">★</button>
        <button class="btn btn-outline btn-sm" data-r="3">★</button>
        <button class="btn btn-outline btn-sm" data-r="4">★</button>
        <button class="btn btn-outline btn-sm" data-r="5">★</button>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="movie-watchlist-add">Add Movie</button>
  </div>
  <div class="error" id="movie-watchlist-error"></div>
</div>

<div class="tool-card">
  <div class="btn-row">
    <button class="btn btn-sm" data-filter="all">All</button>
    <button class="btn btn-sm btn-outline" data-filter="towatch">To Watch</button>
    <button class="btn btn-sm btn-outline" data-filter="watched">Watched</button>
  </div>
  <div id="movie-watchlist-list"></div>
</div>
