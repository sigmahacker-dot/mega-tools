<div class="tool-card">
  <div class="field">
    <label for="timeline-css-generator-events">Events (one per line: "date — event")</label>
    <textarea class="textarea" id="timeline-css-generator-events" rows="5">2019 — Founded the company
2021 — Reached 10,000 customers
2023 — Launched mobile app
2025 — Opened second office
2026 — 1 million users milestone</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="timeline-css-generator-accent">Accent color</label>
      <input class="input" id="timeline-css-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="timeline-css-generator-theme">Card theme</label>
      <select class="select" id="timeline-css-generator-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="field">
      <label for="timeline-css-generator-radius">Corner radius (px)</label>
      <input class="input" id="timeline-css-generator-radius" type="number" value="12" min="0" max="30">
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="timeline-css-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:20px;background:#18181b;max-height:420px;overflow:auto"></div>
  </div>
  <div class="error" id="timeline-css-generator-error"></div>
  <div class="field">
    <label for="timeline-css-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="timeline-css-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="timeline-css-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="timeline-css-generator-download">Download timeline.html</button>
  </div>
</div>
