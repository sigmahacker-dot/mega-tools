<div class="tool-card">
  <div class="field"><label for="pc-topic">Decision</label><input type="text" class="input" id="pc-topic" placeholder="Should I adopt a dog?"></div>
  <div class="grid2">
    <div class="field"><label>Pros</label><div id="pc-pros"></div>
      <div class="btn-row"><button class="btn btn-outline btn-sm" id="pc-add-pro" type="button">+ Add pro</button></div>
    </div>
    <div class="field"><label>Cons</label><div id="pc-cons"></div>
      <div class="btn-row"><button class="btn btn-outline btn-sm" id="pc-add-con" type="button">+ Add con</button></div>
    </div>
  </div>
  <div class="error" id="pros-cons-decider-error"></div>
  <div class="result" id="pc-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pc-verdict" style="font-size:1.1rem">–</div><div class="l">Verdict</div></div>
      <div class="stat-card"><div class="v" id="pc-pro-score" style="color:#4ade80">0</div><div class="l">Pros score</div></div>
      <div class="stat-card"><div class="v" id="pc-con-score" style="color:#f87171">0</div><div class="l">Cons score</div></div>
    </div>
    <div style="height:14px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;display:flex">
      <div id="pc-bar-pro" style="height:100%;background:#4ade80;width:50%"></div>
      <div id="pc-bar-con" style="height:100%;background:#f87171;width:50%"></div>
    </div>
    <p class="note" id="pc-note">Add pros and cons with weights to get a verdict.</p>
  </div>
</div>
