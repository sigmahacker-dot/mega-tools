<div class="tool-card">
  <div class="field">
    <label for="mad-libs-generator-story">Story template</label>
    <select class="input" id="mad-libs-generator-story">
      <option value="0">🚀 Space Adventure</option>
      <option value="1">🏚️ Haunted House</option>
      <option value="2">🍳 Cooking Disaster</option>
      <option value="3">⚽ Championship Final</option>
      <option value="4">🏴‍☠️ Pirate Voyage</option>
    </select>
  </div>
  <div id="mad-libs-generator-fields" class="grid2"></div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="mad-libs-generator-go">Generate story</button>
    <button class="btn btn-outline" id="mad-libs-generator-copy" disabled>Copy story</button>
  </div>
  <div class="error" id="mad-libs-generator-error"></div>
  <div class="result" id="mad-libs-generator-result" hidden>
    <h3 id="mad-libs-generator-title"></h3>
    <p id="mad-libs-generator-out" style="font-size:17px;line-height:1.7"></p>
  </div>
</div>
