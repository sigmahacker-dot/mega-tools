<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="emoji-flag-guess-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="emoji-flag-guess-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="emoji-flag-guess-qnum">0/65</div><div class="l">Question</div></div>
  </div>
  <div id="emoji-flag-guess-flag" style="font-size:92px;margin:8px 0;min-height:120px">🏳️</div>
  <p class="muted" id="emoji-flag-guess-msg" style="min-height:24px">Which country's flag is this?</p>
  <div id="emoji-flag-guess-opts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:12px auto"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="emoji-flag-guess-start">▶ Start</button>
    <button class="btn btn-outline" id="emoji-flag-guess-next" disabled>Next →</button>
  </div>
  <div class="error" id="emoji-flag-guess-error"></div>
</div>
