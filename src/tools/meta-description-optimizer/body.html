<div class="tool-card">
  <div class="field">
    <label for="meta-description-optimizer-input">Meta description</label>
    <textarea class="textarea" id="meta-description-optimizer-input" rows="3" maxlength="320" placeholder="Summarize the page in one compelling sentence..."></textarea>
  </div>
  <div class="error" id="meta-description-optimizer-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="meta-description-optimizer-chars">0</div><div class="l">Characters (120–160)</div></div>
    <div class="stat-card"><div class="v" id="meta-description-optimizer-px">0px</div><div class="l">Est. width (~920px max)</div></div>
    <div class="stat-card"><div class="v" id="meta-description-optimizer-score">–</div><div class="l">Score</div></div>
  </div>
  <div class="result mt">
    <div class="field">
      <label>Google SERP preview</label>
      <div style="border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;max-width:640px;">
        <div style="color:#1a0dab;font-size:1.05rem;line-height:1.3;" id="meta-description-optimizer-ptitle">Your Page Title — shown here</div>
        <div style="color:#006621;font-size:.85rem;">https://example.com › your-page</div>
        <div style="color:#545454;font-size:.9rem;line-height:1.45;" id="meta-description-optimizer-pdesc">Your meta description preview appears here…</div>
      </div>
    </div>
    <p class="note" id="meta-description-optimizer-tips">Tips appear here as you type.</p>
  </div>
</div>
