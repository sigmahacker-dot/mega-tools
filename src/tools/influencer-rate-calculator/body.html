<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="influencer-rate-calculator-followers">Followers</label>
      <input class="input" type="number" id="influencer-rate-calculator-followers" min="0" placeholder="50000">
    </div>
    <div class="field">
      <label for="influencer-rate-calculator-er">Engagement rate %</label>
      <input class="input" type="number" id="influencer-rate-calculator-er" min="0" max="100" step="0.1" placeholder="3.5">
    </div>
    <div class="field">
      <label for="influencer-rate-calculator-niche">Niche</label>
      <select class="select" id="influencer-rate-calculator-niche">
        <option value="1.0">Lifestyle / general</option>
        <option value="1.2">Fashion / beauty</option>
        <option value="1.3">Food / travel</option>
        <option value="1.4">Fitness / health</option>
        <option value="1.6">Tech / gaming</option>
        <option value="1.8">Finance / business</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="influencer-rate-calculator-calc">Calculate Rate</button>
  </div>
  <div class="error" id="influencer-rate-calculator-error"></div>
  <p class="note">Estimate for negotiation — not financial advice. Real rates vary by audience and deliverables.</p>
</div>

<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="influencer-rate-calculator-post">—</div><div class="l">Per sponsored post</div></div>
    <div class="stat-card"><div class="v" id="influencer-rate-calculator-story">—</div><div class="l">Per story set</div></div>
    <div class="stat-card"><div class="v" id="influencer-rate-calculator-reel">—</div><div class="l">Per reel / video</div></div>
  </div>
  <div class="result" id="influencer-rate-calculator-detail"></div>
</div>
