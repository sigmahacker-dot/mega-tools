<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="car-price">Vehicle price ($)</label><input type="number" class="input" id="car-price" min="0" step="any" placeholder="28000"></div>
    <div class="field"><label for="car-down">Down payment ($)</label><input type="number" class="input" id="car-down" min="0" step="any" placeholder="3000"></div>
    <div class="field"><label for="car-trade">Trade-in value ($)</label><input type="number" class="input" id="car-trade" min="0" step="any" placeholder="5000"></div>
    <div class="field"><label for="car-rate">APR (%)</label><input type="number" class="input" id="car-rate" min="0" max="30" step="any" placeholder="6.9"></div>
    <div class="field"><label for="car-term">Term (months)</label><input type="number" class="input" id="car-term" min="1" max="120" step="1" placeholder="60"></div>
  </div>
  <div class="error" id="car-loan-calculator-error"></div>
  <div class="result" id="car-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="car-payment">–</div><div class="l">Monthly payment</div></div>
      <div class="stat-card"><div class="v" id="car-interest">–</div><div class="l">Total interest</div></div>
      <div class="stat-card"><div class="v" id="car-total">–</div><div class="l">Total cost</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Item</th><th>Amount</th></tr></thead>
      <tbody id="car-body"><tr><td colspan="2" class="muted">Enter loan details to calculate.</td></tr></tbody>
    </table>
    <p class="note">Taxes, title and dealer fees are not included — add them to the price first.</p>
  </div>
</div>
