<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="game-title-generator-genre">Genre</label>
      <select class="select" id="game-title-generator-genre">
        <option value="fantasy">Fantasy</option>
        <option value="scifi">Sci-Fi</option>
        <option value="horror">Horror</option>
        <option value="racing">Racing</option>
        <option value="rpg">RPG / Adventure</option>
        <option value="puzzle">Puzzle</option>
        <option value="sports">Sports</option>
        <option value="mystery">Mystery / Detective</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="game-title-generator-go" type="button">Generate Titles</button>
      </div>
    </div>
  </div>
  <div class="error" id="game-title-generator-error"></div>
  <div class="mt" id="game-title-generator-list"></div>
</div>
