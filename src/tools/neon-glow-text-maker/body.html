<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="neon-glow-text-maker-text">Sign text</label>
      <input type="text" id="neon-glow-text-maker-text" class="input" maxlength="40" value="NEON" placeholder="Your text here…">
    </div>
    <div class="field">
      <label for="neon-glow-text-maker-color">Neon color</label>
      <input type="color" id="neon-glow-text-maker-color" class="input" value="#ff2d78">
    </div>
  </div>
  <div class="preview" id="neon-glow-text-maker-wrap" style="text-align:center">
    <canvas id="neon-glow-text-maker-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="neon-glow-text-maker-download">Download PNG</button>
  </div>
  <div class="error" id="neon-glow-text-maker-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
