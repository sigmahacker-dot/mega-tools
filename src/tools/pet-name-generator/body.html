<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pet-name-generator-theme">Theme</label>
      <select class="select" id="pet-name-generator-theme">
        <option value="cute">Cute</option>
        <option value="food">Food</option>
        <option value="nature">Nature</option>
      </select>
    </div>
    <div class="field">
      <label for="pet-name-generator-species">Species</label>
      <select class="select" id="pet-name-generator-species">
        <option value="any">Any 🐾</option>
        <option value="dog">Dog 🐶</option>
        <option value="cat">Cat 🐱</option>
        <option value="bird">Bird 🐦</option>
        <option value="rabbit">Rabbit 🐰</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="pet-name-generator-count">How many</label>
    <select class="select" id="pet-name-generator-count">
      <option value="1">1 name</option>
      <option value="10" selected>10 names</option>
      <option value="25">25 names</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pet-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="pet-name-generator-error"></div>
  <div class="mt" id="pet-name-generator-list"></div>
</div>
