<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="stretch-routine-generator-focus">Focus area</label>
      <select class="input" id="stretch-routine-generator-focus">
        <option value="neck">Neck & shoulders</option>
        <option value="back">Back & hips</option>
        <option value="legs">Legs</option>
        <option value="full">Full body</option>
      </select>
    </div>
    <div class="field">
      <label for="stretch-routine-generator-dur">Duration</label>
      <select class="input" id="stretch-routine-generator-dur">
        <option value="5">5 minutes</option>
        <option value="10" selected>10 minutes</option>
        <option value="15">15 minutes</option>
      </select>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="stretch-routine-generator-gen">Generate routine</button></div>
  <div class="result hidden" id="stretch-routine-generator-out"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Stretch to mild tension only, never through sharp pain.</p>
  <div class="error" id="stretch-routine-generator-error"></div>
</div>
