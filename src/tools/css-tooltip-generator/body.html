<div class="tool-card">
  <h2>CSS Tooltip Generator</h2>
  <p class="muted">Create a pure-CSS tooltip (no JavaScript) with live hover preview.</p>
  <div class="grid2">
    <div class="field">
      <label for="css-tooltip-generator-text">Tooltip text</label>
      <input type="text" class="input" id="css-tooltip-generator-text" value="This is a tooltip!">
    </div>
    <div class="field">
      <label for="css-tooltip-generator-position">Position</label>
      <select class="input" id="css-tooltip-generator-position">
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </div>
    <div class="field">
      <label for="css-tooltip-generator-bg">Background color</label>
      <input type="color" class="input" id="css-tooltip-generator-bg" value="#111827" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-tooltip-generator-fg">Text color</label>
      <input type="color" class="input" id="css-tooltip-generator-fg" value="#ffffff" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-tooltip-generator-radius">Corner radius: <span id="css-tooltip-generator-radius-v">8px</span></label>
      <input type="range" class="input" id="css-tooltip-generator-radius" min="0" max="20" step="1" value="8">
    </div>
    <div class="field">
      <label for="css-tooltip-generator-fsize">Font size: <span id="css-tooltip-generator-fsize-v">14px</span></label>
      <input type="range" class="input" id="css-tooltip-generator-fsize" min="10" max="22" step="1" value="14">
    </div>
  </div>
  <h3>Live preview <span class="muted" style="font-weight:normal;font-size:13px">(hover the button)</span></h3>
  <div class="preview" id="css-tooltip-generator-stage" style="min-height:170px;display:flex;align-items:center;justify-content:center">
    <button class="btn btn-primary" id="css-tooltip-generator-demo">Hover me</button>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="css-tooltip-generator-copy">Copy HTML + CSS</button>
  </div>
  <h3 class="mt">Generated code</h3>
  <pre class="code" id="css-tooltip-generator-code" style="max-height:380px;overflow:auto"></pre>
  <div class="error" id="css-tooltip-generator-error"></div>
</div>
