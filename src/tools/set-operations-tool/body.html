<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="set-operations-tool-a">Set A (comma or line separated)</label>
      <textarea class="input textarea" id="set-operations-tool-a" rows="3" placeholder="e.g. 1, 2, 3, 4" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label for="set-operations-tool-b">Set B (comma or line separated)</label>
      <textarea class="input textarea" id="set-operations-tool-b" rows="3" placeholder="e.g. 3, 4, 5, 6" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="error" id="set-operations-tool-error"></div>
  <div class="result" id="set-operations-tool-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="set-operations-tool-ca">–</div><div class="l">|A|</div></div>
      <div class="stat-card"><div class="v" id="set-operations-tool-cb">–</div><div class="l">|B|</div></div>
      <div class="stat-card"><div class="v" id="set-operations-tool-sub">–</div><div class="l">Subset / equality</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Operation</th><th>Result</th><th>Count</th></tr></thead>
      <tbody id="set-operations-tool-body">
        <tr><td colspan="3" class="muted">Enter both sets to see all operations.</td></tr>
      </tbody>
    </table>
  </div>
</div>
