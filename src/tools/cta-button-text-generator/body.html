<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cta-button-text-generator-action">Action</label>
      <select class="select" id="cta-button-text-generator-action">
        <option value="sign up">Sign up</option>
        <option value="buy">Buy</option>
        <option value="download">Download</option>
        <option value="subscribe">Subscribe</option>
        <option value="learn more">Learn more</option>
        <option value="book now">Book now</option>
        <option value="start trial">Start trial</option>
        <option value="contact us">Contact us</option>
      </select>
    </div>
    <div class="field">
      <label for="cta-button-text-generator-tone">Tone</label>
      <select class="select" id="cta-button-text-generator-tone">
        <option value="bold">Bold</option>
        <option value="friendly">Friendly</option>
        <option value="urgent">Urgent</option>
        <option value="playful">Playful</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="cta-button-text-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="cta-button-text-generator-error"></div>
  <div class="mt" id="cta-button-text-generator-list"></div>
</div>
