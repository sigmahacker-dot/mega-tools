<div class="tool-card">
  <div class="field">
    <label for="faq-schema-generator-q">Question</label>
    <input class="input" type="text" id="faq-schema-generator-q" placeholder="What is…?">
  </div>
  <div class="field">
    <label for="faq-schema-generator-a">Answer</label>
    <textarea class="textarea" id="faq-schema-generator-a" rows="3" placeholder="The answer…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="faq-schema-generator-add">Add Q&A</button>
    <button class="btn btn-outline" id="faq-schema-generator-clear">Clear All</button>
  </div>
  <div class="error" id="faq-schema-generator-error"></div>
  <div id="faq-schema-generator-pairs" style="margin-top:10px"></div>
</div>

<div class="tool-card">
  <div class="btn-row">
    <button class="btn" id="faq-schema-generator-gen">Generate Schema</button>
    <button class="btn btn-outline" id="faq-schema-generator-copy">Copy JSON-LD</button>
    <button class="btn btn-outline" id="faq-schema-generator-dl">Download .json</button>
  </div>
  <pre id="faq-schema-generator-out" style="white-space:pre-wrap;font-family:monospace;font-size:13px;margin-top:10px"></pre>
</div>
