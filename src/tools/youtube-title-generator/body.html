<div class="tool-card">
  <div class="field">
    <label for="youtube-title-generator-input">Video keyword / topic</label>
    <input class="input" id="youtube-title-generator-input" type="text" placeholder="e.g. budget travel" maxlength="80">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="youtube-title-generator-generate" type="button">Generate Titles</button>
  </div>
  <div class="error" id="youtube-title-generator-error"></div>
  <div class="mt" id="youtube-title-generator-list"></div>
  <p class="note">Template-based ideas to spark your own titles — make sure the title matches your actual video.</p>
</div>
