<div class="tool-card">
  <div class="field">
    <label for="sprint-retro-ideas-format">Retro format</label>
    <select class="select" id="sprint-retro-ideas-format">
      <option value="ssc">Start / Stop / Continue</option>
      <option value="fourls">The 4Ls — Liked, Learned, Lacked, Longed for</option>
      <option value="sailboat">Sailboat</option>
      <option value="msg">Mad / Sad / Glad</option>
      <option value="starfish">Starfish</option>
    </select>
  </div>
  <div class="error" id="sprint-retro-ideas-error"></div>
  <div class="result" id="sprint-retro-ideas-output" style="margin-top:12px;white-space:pre-wrap"></div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn btn-outline btn-sm" id="sprint-retro-ideas-copy" type="button">Copy Prompts</button>
    <button class="btn btn-outline btn-sm" id="sprint-retro-ideas-random" type="button">Surprise Me (random format)</button>
  </div>
  <p class="note">Tip: timebox each column to 10 minutes and end with 1–3 concrete action items.</p>
</div>
