<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="freelance-project-pricer-hours">Estimated hours</label>
      <input type="number" class="input" id="freelance-project-pricer-hours" min="0" step="any" placeholder="40">
    </div>
    <div class="field">
      <label for="freelance-project-pricer-rate">Hourly rate ($)</label>
      <input type="number" class="input" id="freelance-project-pricer-rate" min="0" step="any" placeholder="75">
    </div>
    <div class="field">
      <label for="freelance-project-pricer-expenses">Expenses ($)</label>
      <input type="number" class="input" id="freelance-project-pricer-expenses" min="0" step="any" placeholder="200">
    </div>
    <div class="field">
      <label for="freelance-project-pricer-margin">Profit margin (%)</label>
      <input type="number" class="input" id="freelance-project-pricer-margin" min="0" max="500" step="any" placeholder="20">
    </div>
  </div>
  <div class="error" id="freelance-project-pricer-error"></div>
  <div class="result" id="freelance-project-pricer-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="freelance-project-pricer-labor">&ndash;</div><div class="l">Labor cost</div></div>
      <div class="stat-card"><div class="v" id="freelance-project-pricer-cost">&ndash;</div><div class="l">Total cost</div></div>
      <div class="stat-card"><div class="v" id="freelance-project-pricer-profit">&ndash;</div><div class="l">Profit</div></div>
      <div class="stat-card"><div class="v" id="freelance-project-pricer-quote">&ndash;</div><div class="l">Recommended quote</div></div>
      <div class="stat-card"><div class="v" id="freelance-project-pricer-effrate">&ndash;</div><div class="l">Effective hourly rate</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice.</p>
  </div>
</div>
