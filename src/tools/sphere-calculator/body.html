<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="sphere-calculator-known">Known value</label>
      <select class="input" id="sphere-calculator-known">
        <option value="r">Radius</option><option value="v">Volume</option><option value="sa">Surface area</option>
      </select>
    </div>
    <div class="field"><label for="sphere-calculator-val">Value</label><input class="input" id="sphere-calculator-val" type="number" value="3" min="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="sphere-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="sphere-calculator-r">3</div><div class="l">Radius</div></div>
    <div class="stat-card"><div class="v" id="sphere-calculator-v">113.097</div><div class="l">Volume</div></div>
    <div class="stat-card"><div class="v" id="sphere-calculator-sa">113.097</div><div class="l">Surface area</div></div>
  </div>
  <div class="result"><pre class="code" id="sphere-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="sphere-calculator-error"></div>
</div>
