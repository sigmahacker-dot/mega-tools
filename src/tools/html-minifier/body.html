<div class="tool-card">
  <div class="field">
    <label for="html-minifier-input">HTML input</label>
    <textarea class="textarea code" id="html-minifier-input" rows="10" placeholder="Paste your HTML here..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="html-minifier-minify" type="button">Minify HTML</button>
    <button class="btn btn-outline" id="html-minifier-clear" type="button">Clear</button>
  </div>
  <div class="error" id="html-minifier-error"></div>
  <div class="stat-cards hidden mt" id="html-minifier-stats">
    <div class="stat-card"><div class="v" id="html-minifier-orig">0 B</div><div class="l">Original</div></div>
    <div class="stat-card"><div class="v" id="html-minifier-min">0 B</div><div class="l">Minified</div></div>
    <div class="stat-card"><div class="v" id="html-minifier-saved">0%</div><div class="l">Saved</div></div>
  </div>
  <div class="result hidden" id="html-minifier-result">
    <pre id="html-minifier-output"></pre>
    <div class="btn-row mt">
      <button class="btn btn-sm" id="html-minifier-copy" type="button">Copy</button>
      <button class="btn btn-sm btn-outline" id="html-minifier-download" type="button">Download .html</button>
    </div>
  </div>
  <p class="note">Whitespace inside &lt;pre&gt;, &lt;textarea&gt;, &lt;script&gt; and &lt;style&gt; blocks is preserved. Runs entirely in your browser.</p>
</div>
