<div class="tool-card">
  <div class="dropzone" id="halftone-effect-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="halftone-effect-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="halftone-effect-wrap" style="text-align:center">
    <canvas id="halftone-effect-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="field">
    <label for="halftone-effect-size">Dot size: <span id="halftone-effect-size-val">8</span>px</label>
    <input type="range" id="halftone-effect-size" min="4" max="24" value="8">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="halftone-effect-download">Download PNG</button>
  </div>
  <div class="error" id="halftone-effect-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
