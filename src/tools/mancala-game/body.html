<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="max-width:440px;margin:0 auto 10px">
    <button class="btn btn-primary" id="mancala-game-new">New game</button>
  </div>
  <p class="muted" id="mancala-game-status" style="min-height:24px;font-weight:600"></p>
  <div style="display:inline-block;max-width:100%;overflow:auto">
    <div style="display:grid;grid-template-columns:64px repeat(6,minmax(44px,58px)) 64px;gap:6px;align-items:stretch;background:#78350f;padding:12px;border-radius:12px">
      <div id="mancala-game-store-ai" style="grid-row:1/3;background:#451a03;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fde68a;font-weight:800;font-size:20px;min-height:120px"></div>
      <div id="mancala-game-row-ai" style="grid-column:2/8;display:grid;grid-template-columns:repeat(6,minmax(44px,58px));gap:6px"></div>
      <div id="mancala-game-row-you" style="grid-column:2/8;display:grid;grid-template-columns:repeat(6,minmax(44px,58px));gap:6px"></div>
      <div id="mancala-game-store-you" style="grid-row:1/3;background:#451a03;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fde68a;font-weight:800;font-size:20px;min-height:120px"></div>
    </div>
  </div>
  <div class="stat-cards" style="max-width:440px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="mancala-game-sy">0</div><div class="l">Your store</div></div>
    <div class="stat-card"><div class="v" id="mancala-game-sa">0</div><div class="l">Computer store</div></div>
  </div>
  <p class="note" style="max-width:460px;margin:10px auto 0">Kalah rules: 6 pits a side, 4 stones each. Last stone in your store = free turn. Last stone in an empty pit on your side captures the opposite pit.</p>
  <div class="error" id="mancala-game-error"></div>
</div>
