<div class="tool-card">
  <div class="field">
    <label for="html-to-markdown-converter-input">HTML input</label>
    <textarea class="textarea" id="html-to-markdown-converter-input" rows="10" placeholder="Paste HTML here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="html-to-markdown-converter-convert">Convert to Markdown</button>
    <button class="btn btn-outline" id="html-to-markdown-converter-sample">Load sample</button>
  </div>
  <div class="error" id="html-to-markdown-converter-error"></div>
  <div class="field">
    <label for="html-to-markdown-converter-output">Markdown output</label>
    <textarea class="textarea" id="html-to-markdown-converter-output" rows="10" readonly placeholder="Markdown will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="html-to-markdown-converter-copy">Copy Markdown</button>
    <button class="btn btn-outline" id="html-to-markdown-converter-download">Download .md</button>
  </div>
</div>
