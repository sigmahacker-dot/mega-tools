<div class="tool-card">
  <p class="muted">In the <strong>last month</strong>, how often have you...</p>
  <div id="stress-level-checker-qs"></div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="stress-level-checker-go" type="button">Calculate score</button>
  </div>
  <div class="error" id="stress-level-checker-error"></div>
  <div class="result" id="stress-level-checker-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="stress-level-checker-score">&ndash;</div><div class="l">Score / 40</div></div>
      <div class="stat-card"><div class="v" id="stress-level-checker-band">&ndash;</div><div class="l">Stress level</div></div>
    </div>
    <p class="note">Screening tool, not a diagnosis. If stress is affecting your life, consider talking to a professional. For information only &mdash; not medical advice.</p>
  </div>
</div>
