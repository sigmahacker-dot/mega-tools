<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="apr-calculator-amount">Loan amount ($)</label><input class="input" id="apr-calculator-amount" type="number" min="0" step="any" value="200000"></div>
    <div class="field"><label for="apr-calculator-fees">Upfront fees ($)</label><input class="input" id="apr-calculator-fees" type="number" min="0" step="any" value="4000"></div>
    <div class="field"><label for="apr-calculator-rate">Nominal rate (% APR)</label><input class="input" id="apr-calculator-rate" type="number" min="0" step="any" value="6.5"></div>
    <div class="field"><label for="apr-calculator-term">Term (months)</label><input class="input" id="apr-calculator-term" type="number" min="1" step="1" value="360"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="apr-calculator-calc">Calculate</button></div>
  <div class="error" id="apr-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="apr-calculator-apr">—</div><div class="l">True APR</div></div>
    <div class="stat-card"><div class="v" id="apr-calculator-nominal">—</div><div class="l">Nominal rate</div></div>
    <div class="stat-card"><div class="v" id="apr-calculator-pmt">—</div><div class="l">Monthly payment</div></div>
    <div class="stat-card"><div class="v" id="apr-calculator-extra">—</div><div class="l">APR premium from fees</div></div>
  </div>
  <p class="hint" id="apr-calculator-note"></p>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
