<div class="tool-card" style="text-align:center;max-width:520px;margin:0 auto">
  <div class="grid3" style="margin-bottom:10px">
    <div class="field" style="text-align:left">
      <label for="click-speed-test-dur">Duration</label>
      <select class="input" id="click-speed-test-dur">
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="click-speed-test-start" style="width:100%">Start</button>
    </div>
    <div class="field" style="text-align:left">
      <label>Best (this duration)</label>
      <div class="input" id="click-speed-test-best" style="font-weight:800">—</div>
    </div>
  </div>
  <div id="click-speed-test-arena" style="height:260px;border-radius:12px;background:#292524;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none;touch-action:manipulation">
    <div id="click-speed-test-big" style="font-size:52px;font-weight:800">Click Start</div>
    <div id="click-speed-test-sub" class="muted">then click here as fast as you can</div>
  </div>
  <div class="stat-cards" style="margin-top:10px">
    <div class="stat-card"><div class="v" id="click-speed-test-clicks">0</div><div class="l">Clicks</div></div>
    <div class="stat-card"><div class="v" id="click-speed-test-time">0.0s</div><div class="l">Time left</div></div>
    <div class="stat-card"><div class="v" id="click-speed-test-cps">0.0</div><div class="l">Clicks/sec</div></div>
  </div>
  <div class="error" id="click-speed-test-error"></div>
</div>
