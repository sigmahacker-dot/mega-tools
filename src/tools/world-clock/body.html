<div class="tool-card">
  <div class="field">
    <label id="world-clock-local-label">Your local time</label>
    <div class="center" style="font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;" id="world-clock-local-time"></div>
    <p class="muted center" id="world-clock-local-date"></p>
  </div>
  <div class="row mt">
    <div class="field" style="flex:1;">
      <label for="world-clock-tz">Add your own time zone (e.g. America/Chicago)</label>
      <input class="input" id="world-clock-tz" type="text" placeholder="Continent/City" autocomplete="off" maxlength="60">
    </div>
    <div class="field" style="align-self:end;">
      <button class="btn btn-primary" id="world-clock-add" type="button">Add</button>
    </div>
  </div>
  <div class="error" id="world-clock-error"></div>
  <div class="stat-cards mt" id="world-clock-grid"></div>
  <p class="note">Clocks update every second and handle daylight saving automatically.</p>
</div>
