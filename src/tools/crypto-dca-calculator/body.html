<div class="tool-card">
  <table class="data" id="crypto-dca-calculator-table">
    <tr><th>Date</th><th>Amount invested ($)</th><th>Price ($)</th><th>Coins bought</th><th></th></tr>
  </table>
  <div class="btn-row" style="margin-bottom:12px">
    <button class="btn btn-outline" id="crypto-dca-calculator-add">+ Add buy</button>
  </div>
  <div class="grid2">
    <div class="field"><label for="crypto-dca-calculator-current">Current price ($)</label><input class="input" id="crypto-dca-calculator-current" type="number" min="0" step="any" value="60000"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="crypto-dca-calculator-calc">Calculate</button></div>
  <div class="error" id="crypto-dca-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-invested">—</div><div class="l">Total invested</div></div>
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-coins">—</div><div class="l">Total coins</div></div>
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-avg">—</div><div class="l">Average cost</div></div>
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-value">—</div><div class="l">Current value</div></div>
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-pl">—</div><div class="l">Profit / loss</div></div>
    <div class="stat-card"><div class="v" id="crypto-dca-calculator-plpct">—</div><div class="l">P/L %</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
