<div class="tool-card">
  <div class="field">
    <label for="color-code-converter-input">Color (HEX, RGB or HSL)</label>
    <input class="input" id="color-code-converter-input" type="text" placeholder="e.g. #ff0000, rgb(255, 0, 0), hsl(0, 100%, 50%)" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="color-code-converter-convert" type="button">Convert</button>
  </div>
  <div class="error" id="color-code-converter-error"></div>
  <div class="result hidden" id="color-code-converter-result">
    <div class="row">
      <div id="color-code-converter-swatch" style="width:64px;height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.15);flex:0 0 auto;"></div>
      <div style="flex:1;min-width:0;">
        <div class="copy-row"><code id="color-code-converter-hex"></code><button class="btn btn-sm btn-outline" id="color-code-converter-copy-hex" type="button">Copy HEX</button></div>
        <div class="copy-row mt"><code id="color-code-converter-rgb"></code><button class="btn btn-sm btn-outline" id="color-code-converter-copy-rgb" type="button">Copy RGB</button></div>
        <div class="copy-row mt"><code id="color-code-converter-hsl"></code><button class="btn btn-sm btn-outline" id="color-code-converter-copy-hsl" type="button">Copy HSL</button></div>
      </div>
    </div>
  </div>
  <p class="note">Accepts 3/6/8-digit hex, rgb()/rgba() and hsl()/hsla(). Alpha is preserved where possible.</p>
</div>
