<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="color-blindness-simulator-color">Test a color</label>
      <input type="color" class="input" id="color-blindness-simulator-color" value="#e63946" style="height:48px;padding:4px;">
    </div>
    <div class="field">
      <label for="color-blindness-simulator-file">Or upload an image</label>
      <input type="file" class="input" id="color-blindness-simulator-file" accept="image/*">
    </div>
  </div>
  <div class="error" id="color-blindness-simulator-error"></div>
  <div class="result" id="color-blindness-simulator-result">
    <div class="grid2">
      <div class="field"><label>Original</label><canvas class="preview" id="color-blindness-simulator-orig" width="320" height="200" style="max-width:100%;border-radius:8px;"></canvas></div>
      <div class="field"><label>Protanopia (red-blind)</label><canvas class="preview" id="color-blindness-simulator-prot" width="320" height="200" style="max-width:100%;border-radius:8px;"></canvas></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Deuteranopia (green-blind)</label><canvas class="preview" id="color-blindness-simulator-deut" width="320" height="200" style="max-width:100%;border-radius:8px;"></canvas></div>
      <div class="field"><label>Tritanopia (blue-blind)</label><canvas class="preview" id="color-blindness-simulator-trit" width="320" height="200" style="max-width:100%;border-radius:8px;"></canvas></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Achromatopsia (no color)</label><canvas class="preview" id="color-blindness-simulator-achr" width="320" height="200" style="max-width:100%;border-radius:8px;"></canvas></div>
      <div class="field"><label>&nbsp;</label><p class="muted">Machado et al. (2009) matrices, full severity.</p></div>
    </div>
  </div>
</div>
