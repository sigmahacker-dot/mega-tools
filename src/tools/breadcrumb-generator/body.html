<div class="tool-card">
  <div class="field">
    <label for="breadcrumb-generator-path">Path segments (one per line, or a /path)</label>
    <textarea class="textarea" id="breadcrumb-generator-path" rows="4">Home
Products
Running shoes
Air Zoom Pegasus</textarea>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="breadcrumb-generator-sep">Separator</label>
      <select class="select" id="breadcrumb-generator-sep">
        <option value="›">› (chevron)</option>
        <option value="/">/ (slash)</option>
        <option value="»">» (double)</option>
        <option value="→">→ (arrow)</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div class="field">
      <label for="breadcrumb-generator-custom">Custom separator</label>
      <input class="input" id="breadcrumb-generator-custom" value="•" maxlength="4">
    </div>
    <div class="field">
      <label for="breadcrumb-generator-style">Style</label>
      <select class="select" id="breadcrumb-generator-style">
        <option value="plain">Plain</option>
        <option value="pill">Pills</option>
        <option value="underline">Underline links</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="breadcrumb-generator-accent">Accent (links)</label>
      <input class="input" id="breadcrumb-generator-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="breadcrumb-generator-theme">Theme</label>
      <select class="select" id="breadcrumb-generator-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="breadcrumb-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:20px;background:#18181b"></div>
  </div>
  <div class="error" id="breadcrumb-generator-error"></div>
  <div class="field">
    <label for="breadcrumb-generator-output">HTML + CSS</label>
    <textarea class="textarea" id="breadcrumb-generator-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="breadcrumb-generator-copy">Copy code</button>
    <button class="btn btn-outline" id="breadcrumb-generator-download">Download breadcrumb.html</button>
  </div>
</div>
