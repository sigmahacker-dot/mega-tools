<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="css-shape-generator-shape">Shape</label>
      <select class="select" id="css-shape-generator-shape">
        <option value="triangle-up">Triangle ▲ up</option>
        <option value="triangle-down">Triangle ▼ down</option>
        <option value="triangle-left">Triangle ◀ left</option>
        <option value="triangle-right">Triangle ▶ right</option>
        <option value="circle">Circle</option>
        <option value="oval">Oval</option>
        <option value="square">Square</option>
        <option value="diamond">Diamond</option>
        <option value="pentagon">Pentagon</option>
        <option value="hexagon">Hexagon</option>
        <option value="star">Star</option>
        <option value="cross">Cross / Plus</option>
        <option value="arrow-right">Arrow →</option>
        <option value="chevron">Chevron »</option>
        <option value="parallelogram">Parallelogram</option>
        <option value="trapezoid">Trapezoid</option>
      </select>
    </div>
    <div class="field">
      <label for="css-shape-generator-size">Size (px)</label>
      <input class="input" id="css-shape-generator-size" type="number" value="120" min="10" max="600">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="css-shape-generator-color">Color</label>
      <input class="input" id="css-shape-generator-color" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="css-shape-generator-bg">Preview background</label>
      <select class="select" id="css-shape-generator-bg">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="css-shape-generator-preview" style="display:flex;align-items:center;justify-content:center;min-height:230px;border:1px dashed #3f3f46;border-radius:12px;background:#18181b;overflow:hidden"></div>
  </div>
  <div class="error" id="css-shape-generator-error"></div>
  <div class="field">
    <label for="css-shape-generator-output">CSS</label>
    <textarea class="textarea" id="css-shape-generator-output" rows="12" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="css-shape-generator-copy">Copy CSS</button>
    <button class="btn btn-outline" id="css-shape-generator-download">Download .css</button>
  </div>
</div>
