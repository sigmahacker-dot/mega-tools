<div class="tool-card">
  <div class="field">
    <label for="vinyl-crackle-adder-file">Audio file</label>
    <input type="file" id="vinyl-crackle-adder-file" accept="audio/*" class="input">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="vinyl-crackle-adder-crackle">Crackle: <span id="vinyl-crackle-adder-crackle-val">50</span>%</label>
      <input type="range" id="vinyl-crackle-adder-crackle" min="0" max="100" value="50">
    </div>
    <div class="field">
      <label for="vinyl-crackle-adder-pops">Pop density: <span id="vinyl-crackle-adder-pops-val">50</span>%</label>
      <input type="range" id="vinyl-crackle-adder-pops" min="0" max="100" value="50">
    </div>
    <div class="field">
      <label for="vinyl-crackle-adder-hiss">Surface hiss: <span id="vinyl-crackle-adder-hiss-val">30</span>%</label>
      <input type="range" id="vinyl-crackle-adder-hiss" min="0" max="100" value="30">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="vinyl-crackle-adder-go">Add vinyl crackle</button>
    <button class="btn btn-outline hidden" id="vinyl-crackle-adder-play">Preview</button>
    <button class="btn btn-outline hidden" id="vinyl-crackle-adder-download">Download WAV</button>
  </div>
  <div class="error" id="vinyl-crackle-adder-error"></div>
  <p class="note">Crackle is synthesized procedurally — random decaying pops plus filtered hiss. No samples used. Runs in your browser.</p>
</div>
