<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="google-ads-headline-generator-kw">Keywords / product (comma-separated)</label>
      <input class="input" type="text" id="google-ads-headline-generator-kw" placeholder="running shoes, free shipping">
    </div>
    <div class="field">
      <label for="google-ads-headline-generator-tone">Tone</label>
      <select class="select" id="google-ads-headline-generator-tone">
        <option value="benefit">Benefit-focused</option>
        <option value="urgency">Urgency</option>
        <option value="feature">Feature-focused</option>
        <option value="trust">Trust / social proof</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="google-ads-headline-generator-gen">Generate Headlines</button>
    <button class="btn btn-outline" id="google-ads-headline-generator-copy">Copy All</button>
  </div>
  <div class="error" id="google-ads-headline-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Headlines <span class="muted">(max 30 chars each)</span></h3>
  <div id="google-ads-headline-generator-out"></div>
</div>
