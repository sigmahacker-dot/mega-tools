<div class="tool-card">
  <div class="field" style="max-width:320px">
    <label for="period-tracker-lite-date">Period start date</label>
    <div class="btn-row" style="justify-content:flex-start">
      <input class="input" id="period-tracker-lite-date" type="date" style="flex:1">
      <button class="btn btn-primary" id="period-tracker-lite-add">Log</button>
    </div>
  </div>
  <div class="stat-cards hidden" id="period-tracker-lite-out">
    <div class="stat-card"><div class="v" id="period-tracker-lite-avg">–</div><div class="l">Avg cycle (days)</div></div>
    <div class="stat-card"><div class="v" id="period-tracker-lite-next" style="font-size:1em">–</div><div class="l">Predicted next period</div></div>
    <div class="stat-card"><div class="v" id="period-tracker-lite-fertile" style="font-size:1em">–</div><div class="l">Est. fertile window</div></div>
  </div>
  <div class="result" id="period-tracker-lite-list"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Predictions are rough estimates, not reliable for contraception or conception planning.</p>
  <div class="error" id="period-tracker-lite-error"></div>
</div>
