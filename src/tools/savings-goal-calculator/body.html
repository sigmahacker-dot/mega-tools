<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="goal-amount">Savings goal ($)</label>
      <input type="number" class="input" id="goal-amount" min="1" step="any" placeholder="50000">
    </div>
    <div class="field">
      <label for="goal-current">Current savings ($)</label>
      <input type="number" class="input" id="goal-current" min="0" step="any" placeholder="5000">
    </div>
    <div class="field">
      <label for="goal-rate">Annual interest rate (%)</label>
      <input type="number" class="input" id="goal-rate" min="0" max="30" step="any" placeholder="5">
    </div>
    <div class="field">
      <label for="goal-years">Timeframe (years)</label>
      <input type="number" class="input" id="goal-years" min="0.1" max="60" step="any" placeholder="5">
    </div>
  </div>
  <div class="error" id="savings-goal-calculator-error"></div>
  <div class="result" id="goal-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="goal-monthly">–</div><div class="l">Monthly deposit needed</div></div>
      <div class="stat-card"><div class="v" id="goal-deposits">–</div><div class="l">Total deposits</div></div>
      <div class="stat-card"><div class="v" id="goal-interest">–</div><div class="l">Interest earned</div></div>
    </div>
    <p class="note">Deposits are assumed at the end of each month, earning interest from the next month on.</p>
  </div>
</div>
