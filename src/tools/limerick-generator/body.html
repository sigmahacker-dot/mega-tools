<div class="tool-card">
  <div class="btn-row" style="justify-content:center;margin-bottom:12px">
    <button class="btn btn-primary" id="limerick-generator-run">Generate limerick</button>
  </div>
  <div class="field">
    <label>Your limerick (AABBA)</label>
    <div class="result"><div class="data" id="limerick-generator-output" style="white-space:pre-wrap;font-size:1.1em;line-height:1.8"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="limerick-generator-copy">Copy limerick</button></div>
  </div>
  <div class="error" id="limerick-generator-error"></div>
</div>
