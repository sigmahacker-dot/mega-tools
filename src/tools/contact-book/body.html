<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="contact-book-name">Name</label>
      <input class="input" type="text" id="contact-book-name" placeholder="Full name">
    </div>
    <div class="field">
      <label for="contact-book-phone">Phone</label>
      <input class="input" type="tel" id="contact-book-phone" placeholder="+92…">
    </div>
    <div class="field">
      <label for="contact-book-email">Email</label>
      <input class="input" type="email" id="contact-book-email" placeholder="name@example.com">
    </div>
    <div class="field">
      <label for="contact-book-notes">Notes</label>
      <input class="input" type="text" id="contact-book-notes" placeholder="Notes…">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="contact-book-add">Add Contact</button>
    <button class="btn btn-outline" id="contact-book-export">Export JSON</button>
  </div>
  <div class="error" id="contact-book-error"></div>
</div>

<div class="tool-card">
  <div class="field">
    <label for="contact-book-search">Search contacts</label>
    <input class="input" type="text" id="contact-book-search" placeholder="Search name, phone, email, notes…">
  </div>
  <div id="contact-book-list"></div>
  <p class="muted" id="contact-book-count"></p>
</div>
