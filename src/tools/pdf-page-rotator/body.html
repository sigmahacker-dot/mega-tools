<div class="tool-card">
  <div class="field">
    <label for="pdf-page-rotator-file">Upload PDF</label>
    <input type="file" class="input" id="pdf-page-rotator-file" accept="application/pdf,.pdf">
  </div>
  <div id="pdf-page-rotator-form" hidden>
    <div class="grid2">
      <div class="field">
        <label for="pdf-page-rotator-scope">Pages</label>
        <select class="input" id="pdf-page-rotator-scope">
          <option value="all">All pages</option>
          <option value="some">Selected pages…</option>
        </select>
      </div>
      <div class="field">
        <label for="pdf-page-rotator-deg">Rotate</label>
        <select class="input" id="pdf-page-rotator-deg">
          <option value="90">90° clockwise</option>
          <option value="180">180°</option>
          <option value="270">270° clockwise (90° counter-clockwise)</option>
        </select>
      </div>
    </div>
    <div class="field" id="pdf-page-rotator-pages-wrap" hidden>
      <label for="pdf-page-rotator-pages">Page numbers / ranges (e.g. 1, 4-6)</label>
      <input type="text" class="input" id="pdf-page-rotator-pages" placeholder="1, 4-6">
    </div>
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="pdf-page-rotator-go" disabled>Rotate &amp; download</button>
  </div>
  <div class="error" id="pdf-page-rotator-error"></div>
  <div class="result" id="pdf-page-rotator-result" hidden>
    <p class="muted" id="pdf-page-rotator-info"></p>
  </div>
</div>
