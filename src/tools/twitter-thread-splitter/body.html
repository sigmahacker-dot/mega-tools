<div class="tool-card">
  <h2>Twitter Thread Splitter</h2>
  <p class="muted">Split long text into numbered tweets of 280 characters or fewer.</p>
  <div class="field">
    <label for="twitter-thread-splitter-input">Your text</label>
    <textarea class="textarea" id="twitter-thread-splitter-input" rows="8" placeholder="Paste the text you want to turn into a thread..."></textarea>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="twitter-thread-splitter-run">Split into tweets</button>
    <button class="btn btn-outline" id="twitter-thread-splitter-clear">Clear</button>
  </div>
  <div class="error" id="twitter-thread-splitter-error"></div>
  <div class="result" id="twitter-thread-splitter-result">
    <p class="muted" id="twitter-thread-splitter-count"></p>
    <div id="twitter-thread-splitter-list"></div>
    <div class="btn-row mt">
      <button class="btn btn-primary" id="twitter-thread-splitter-copyall">Copy all tweets</button>
    </div>
  </div>
</div>
