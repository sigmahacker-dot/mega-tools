<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="print-cost-calculator-blackprice">Black cartridge price ($)</label>
      <input type="number" class="input" id="print-cost-calculator-blackprice" min="0" step="any" placeholder="45">
    </div>
    <div class="field">
      <label for="print-cost-calculator-blackyield">Black cartridge yield (pages)</label>
      <input type="number" class="input" id="print-cost-calculator-blackyield" min="0" step="any" placeholder="2500">
    </div>
    <div class="field">
      <label for="print-cost-calculator-colorprice">Color cartridge price ($, 0 = mono only)</label>
      <input type="number" class="input" id="print-cost-calculator-colorprice" min="0" step="any" placeholder="60">
    </div>
    <div class="field">
      <label for="print-cost-calculator-coloryield">Color cartridge yield (pages)</label>
      <input type="number" class="input" id="print-cost-calculator-coloryield" min="0" step="any" placeholder="1800">
    </div>
    <div class="field">
      <label for="print-cost-calculator-ream">Paper ream price ($)</label>
      <input type="number" class="input" id="print-cost-calculator-ream" min="0" step="any" placeholder="7">
    </div>
    <div class="field">
      <label for="print-cost-calculator-sheets">Sheets per ream</label>
      <input type="number" class="input" id="print-cost-calculator-sheets" min="1" step="1" placeholder="500">
    </div>
    <div class="field">
      <label for="print-cost-calculator-monopages">Mono pages to print</label>
      <input type="number" class="input" id="print-cost-calculator-monopages" min="0" step="1" placeholder="1000">
    </div>
    <div class="field">
      <label for="print-cost-calculator-colorpages">Color pages to print</label>
      <input type="number" class="input" id="print-cost-calculator-colorpages" min="0" step="1" placeholder="200">
    </div>
  </div>
  <div class="error" id="print-cost-calculator-error"></div>
  <div class="result" id="print-cost-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="print-cost-calculator-mono">&ndash;</div><div class="l">Cost / mono page</div></div>
      <div class="stat-card"><div class="v" id="print-cost-calculator-color">&ndash;</div><div class="l">Cost / color page</div></div>
      <div class="stat-card"><div class="v" id="print-cost-calculator-total">&ndash;</div><div class="l">Total print cost</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice. Yields assume rated coverage; heavy graphics cost more.</p>
  </div>
</div>
