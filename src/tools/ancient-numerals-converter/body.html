<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ancient-numerals-converter-mode">Mode</label>
      <select class="select" id="ancient-numerals-converter-mode">
        <option value="dec">Decimal → all ancient systems</option>
        <option value="roman">Roman → decimal</option>
      </select>
    </div>
    <div class="field">
      <label for="ancient-numerals-converter-in">Input</label>
      <input class="input" id="ancient-numerals-converter-in" type="text" value="2026" style="font-family:monospace">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="ancient-numerals-converter-convert">Convert</button>
  </div>
  <div class="error" id="ancient-numerals-converter-error"></div>
  <div id="ancient-numerals-converter-out" class="hidden">
    <div class="result" id="ancient-numerals-converter-results"></div>
  </div>
</div>
