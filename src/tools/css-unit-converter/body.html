<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="cu-val">Value</label><input type="number" class="input" id="cu-val" step="any" placeholder="16"></div>
    <div class="field"><label for="cu-from">From</label><select class="select" id="cu-from"></select></div>
    <div class="field"><label for="cu-to">To</label><select class="select" id="cu-to"></select></div>
    <div class="field"><label for="cu-root">Root font size (px)</label><input type="number" class="input" id="cu-root" min="1" step="any" value="16"></div>
    <div class="field"><label for="cu-parent">Parent font size (px) <span class="hint">for em/%</span></label><input type="number" class="input" id="cu-parent" min="1" step="any" value="16"></div>
  </div>
  <div class="error" id="css-unit-converter-error"></div>
  <div class="result" id="cu-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cu-out">–</div><div class="l">Converted value</div></div>
      <div class="stat-card"><div class="v" id="cu-px">–</div><div class="l">In pixels</div></div>
    </div>
    <p class="note">Viewport: <span id="cu-vp" class="muted">–</span> · ex/ch use the approximations 0.5em.</p>
  </div>
</div>
