<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="twitter-card-generator-type">Card type</label>
      <select class="select" id="twitter-card-generator-type">
        <option value="summary">Summary</option>
        <option value="summary_large_image">Summary Large Image</option>
      </select>
    </div>
    <div class="field">
      <label for="twitter-card-generator-site">Site handle (optional)</label>
      <input class="input" type="text" id="twitter-card-generator-site" placeholder="@yourhandle">
    </div>
    <div class="field">
      <label for="twitter-card-generator-title">Title (≤70 chars)</label>
      <input class="input" type="text" id="twitter-card-generator-title" maxlength="70" placeholder="Card title">
    </div>
    <div class="field">
      <label for="twitter-card-generator-img">Image URL</label>
      <input class="input" type="url" id="twitter-card-generator-img" placeholder="https://example.com/card.png">
    </div>
  </div>
  <div class="field">
    <label for="twitter-card-generator-desc">Description (≤200 chars)</label>
    <textarea class="textarea" id="twitter-card-generator-desc" rows="2" maxlength="200" placeholder="Card description"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="twitter-card-generator-gen">Generate + Preview</button>
    <button class="btn btn-outline" id="twitter-card-generator-copy">Copy Meta Tags</button>
  </div>
  <div class="error" id="twitter-card-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Preview</h3>
  <div id="twitter-card-generator-preview" style="max-width:560px"></div>
</div>

<div class="tool-card">
  <h3>Meta tags</h3>
  <pre id="twitter-card-generator-out" style="white-space:pre-wrap;font-family:monospace;font-size:13px"></pre>
</div>
