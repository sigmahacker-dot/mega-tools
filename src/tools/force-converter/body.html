<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="force-converter-value">Value</label>
      <input type="number" step="any" class="input" id="force-converter-value" placeholder="e.g. 100">
    </div>
    <div class="field">
      <label for="force-converter-from">From unit</label>
      <select class="select" id="force-converter-from">
        <option value="N" selected>Newtons (N)</option>
        <option value="kN">Kilonewtons (kN)</option>
        <option value="lbf">Pounds-force (lbf)</option>
        <option value="kgf">Kilograms-force (kgf)</option>
        <option value="dyn">Dynes (dyn)</option>
        <option value="ozf">Ounces-force (ozf)</option>
      </select>
    </div>
  </div>
  <div class="error" id="force-converter-error"></div>
  <div class="result" id="force-converter-result">
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="force-converter-table"></tbody>
    </table>
    <p class="note">Factors: 1 lbf = 4.4482216152605 N, 1 kgf = 9.80665 N, 1 dyn = 10<sup>−5</sup> N, 1 ozf = lbf/16.</p>
  </div>
</div>
