<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="css-grid-generator-rows">Rows: <span id="css-grid-generator-rows-val">2</span></label>
      <input type="range" id="css-grid-generator-rows" min="1" max="6" value="2">
    </div>
    <div class="field">
      <label for="css-grid-generator-cols">Columns: <span id="css-grid-generator-cols-val">3</span></label>
      <input type="range" id="css-grid-generator-cols" min="1" max="6" value="3">
    </div>
    <div class="field">
      <label for="css-grid-generator-gap">Gap: <span id="css-grid-generator-gap-val">12</span>px</label>
      <input type="range" id="css-grid-generator-gap" min="0" max="40" value="12">
    </div>
    <div class="field">
      <label for="css-grid-generator-items">Items: <span id="css-grid-generator-items-val">6</span></label>
      <input type="range" id="css-grid-generator-items" min="1" max="36" value="6">
    </div>
  </div>
  <div class="field">
    <label>Live demo</label>
    <div id="css-grid-generator-demo" style="background:#f3f4f6;border-radius:12px;padding:16px;min-height:220px;"></div>
  </div>
  <div class="error" id="css-grid-generator-error"></div>
  <div class="result" id="css-grid-generator-result">
    <div class="field">
      <label for="css-grid-generator-css">Generated CSS</label>
      <pre id="css-grid-generator-css" style="background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;"></pre>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="css-grid-generator-copy">Copy CSS</button>
    </div>
  </div>
</div>
