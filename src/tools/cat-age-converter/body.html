<div class="tool-card">
  <div class="field">
    <label for="cat-age-converter-age">Cat's age (years)</label>
    <input type="number" step="any" min="0" class="input" id="cat-age-converter-age" placeholder="e.g. 7">
  </div>
  <div class="error" id="cat-age-converter-error"></div>
  <div class="result" id="cat-age-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cat-age-converter-human">–</div><div class="l">Human-year equivalent</div></div>
      <div class="stat-card"><div class="v" id="cat-age-converter-stage">–</div><div class="l">Life stage</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Cat age</th><th>Human years</th><th>Life stage</th></tr></thead>
      <tbody id="cat-age-converter-table"></tbody>
    </table>
    <p class="note">For information only — not veterinary advice. Individual cats vary by breed, health and lifestyle.</p>
  </div>
</div>
