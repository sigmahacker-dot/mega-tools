<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="birthday-reminder-list-name">Name</label>
      <input class="input" id="birthday-reminder-list-name" type="text" placeholder="e.g. Ayesha">
    </div>
    <div class="field">
      <label for="birthday-reminder-list-date">Birth date</label>
      <input class="input" id="birthday-reminder-list-date" type="date">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="birthday-reminder-list-add">Add birthday</button>
    </div>
  </div>
  <div class="error" id="birthday-reminder-list-error"></div>
  <div id="birthday-reminder-list-next" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="birthday-reminder-list-who">–</div><div class="l">Next birthday</div></div>
      <div class="stat-card"><div class="v" id="birthday-reminder-list-when">–</div><div class="l">Date</div></div>
      <div class="stat-card"><div class="v" id="birthday-reminder-list-count">–</div><div class="l">Days away</div></div>
    </div>
  </div>
  <div class="result">
    <h3>All birthdays</h3>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>Name</th><th>Birthday</th><th>Turning</th><th>In</th><th></th></tr></thead><tbody id="birthday-reminder-list-list"></tbody></table></div>
  </div>
</div>
