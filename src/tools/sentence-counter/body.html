<div class="tool-card">
  <div class="field">
    <label for="sentence-counter-input">Your text</label>
    <textarea class="textarea" id="sentence-counter-input" rows="8" placeholder="Paste your text here"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="sentence-counter-count">0</div><div class="l">Sentences</div></div>
    <div class="stat-card"><div class="v" id="sentence-counter-avg">0</div><div class="l">Avg words / sentence</div></div>
    <div class="stat-card"><div class="v" id="sentence-counter-longest">0</div><div class="l">Longest (words)</div></div>
  </div>
  <div class="field">
    <label>Longest sentence</label>
    <div class="result"><div class="data" id="sentence-counter-longesttext" style="white-space:pre-wrap"></div></div>
  </div>
  <div class="error" id="sentence-counter-error"></div>
</div>
