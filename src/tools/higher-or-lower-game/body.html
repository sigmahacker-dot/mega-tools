<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="higher-or-lower-game-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="v" id="higher-or-lower-game-best">0</div><div class="l">Best</div></div>
    <div class="stat-card"><div class="v" id="higher-or-lower-game-left">52</div><div class="l">Cards left</div></div>
  </div>
  <p class="muted">Current card</p>
  <div id="higher-or-lower-game-card" style="width:110px;height:150px;margin:0 auto;border:2px solid #9e9e9e;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.15)">?</div>
  <p class="muted" id="higher-or-lower-game-msg" style="min-height:24px;margin-top:12px">Will the next card be higher or lower? (Aces high, ties lose)</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="higher-or-lower-game-higher" style="font-size:18px">⬆ Higher</button>
    <button class="btn btn-primary" id="higher-or-lower-game-lower" style="font-size:18px">⬇ Lower</button>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:8px">
    <button class="btn btn-outline" id="higher-or-lower-game-new">↻ New round</button>
  </div>
  <div class="error" id="higher-or-lower-game-error"></div>
</div>
