<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="daylight-hours-calculator-date">Date</label>
      <input class="input" type="date" id="daylight-hours-calculator-date">
    </div>
    <div class="field">
      <label for="daylight-hours-calculator-lat">Latitude (−90 to 90)</label>
      <input class="input" type="number" id="daylight-hours-calculator-lat" step="0.0001" min="-90" max="90" placeholder="e.g. 33.6844 (Islamabad)">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="daylight-hours-calculator-lon">Longitude <span class="muted">(optional, for clock times)</span></label>
      <input class="input" type="number" id="daylight-hours-calculator-lon" step="0.0001" min="-180" max="180" placeholder="e.g. 73.0479">
    </div>
    <div class="field">
      <label for="daylight-hours-calculator-tz">UTC offset <span class="muted">(optional)</span></label>
      <input class="input" type="number" id="daylight-hours-calculator-tz" step="0.25" min="-12" max="14" placeholder="e.g. 5">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="daylight-hours-calculator-calc">Calculate</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="daylight-hours-calculator-rise">—</div><div class="l">Sunrise</div></div>
    <div class="stat-card"><div class="v" id="daylight-hours-calculator-noon">—</div><div class="l">Solar noon</div></div>
    <div class="stat-card"><div class="v" id="daylight-hours-calculator-set">—</div><div class="l">Sunset</div></div>
    <div class="stat-card"><div class="v" id="daylight-hours-calculator-len">—</div><div class="l">Day length</div></div>
  </div>
  <div class="result" id="daylight-hours-calculator-out"></div>
  <div class="error" id="daylight-hours-calculator-error"></div>
</div>
