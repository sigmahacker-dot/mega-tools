<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 10px">
    <div class="field" style="text-align:left">
      <label for="reversi-game-mode">Mode</label>
      <select class="input" id="reversi-game-mode">
        <option value="ai" selected>Vs Computer (you are black)</option>
        <option value="2p">Two players</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="reversi-game-new" style="width:100%">New game</button>
    </div>
  </div>
  <p class="muted" id="reversi-game-status" style="min-height:24px;font-weight:600"></p>
  <div style="display:inline-block;max-width:100%;overflow:auto">
    <div id="reversi-game-board" style="display:inline-grid;grid-template-columns:repeat(8,minmax(34px,50px));gap:2px;background:#166534;padding:6px;border-radius:8px"></div>
  </div>
  <div class="stat-cards" style="max-width:440px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="reversi-game-sb">2</div><div class="l">Black</div></div>
    <div class="stat-card"><div class="v" id="reversi-game-sw">2</div><div class="l">White</div></div>
    <div class="stat-card"><div class="v" id="reversi-game-moves">0</div><div class="l">Moves</div></div>
  </div>
  <div class="error" id="reversi-game-error"></div>
</div>
