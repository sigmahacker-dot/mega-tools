<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="dummy-data-generator-count">Rows</label>
      <select class="select" id="dummy-data-generator-count">
        <option value="5">5 rows</option>
        <option value="10" selected>10 rows</option>
        <option value="25">25 rows</option>
        <option value="50">50 rows</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="dummy-data-generator-go" type="button">Generate Data</button>
      </div>
    </div>
  </div>
  <div class="error" id="dummy-data-generator-error"></div>
  <div class="result" id="dummy-data-generator-output" style="overflow-x:auto">Press Generate Data to create realistic test rows.</div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn btn-outline btn-sm" id="dummy-data-generator-copy" type="button">Copy CSV</button>
    <button class="btn btn-outline btn-sm" id="dummy-data-generator-download" type="button">Download CSV</button>
  </div>
  <p class="note">All data is randomly generated and fictional — any resemblance to real people is coincidental.</p>
</div>
