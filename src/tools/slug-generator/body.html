<div class="tool-card">
  <h2>URL Slug Generator</h2>
  <p class="muted">Clean, URL-safe slugs from any headline — live as you type.</p>
  <div class="field">
    <label for="slug-generator-input">Headline</label>
    <input type="text" class="input" id="slug-generator-input" placeholder="Type your headline here...">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="slug-generator-sep">Separator</label>
      <select class="select" id="slug-generator-sep">
        <option value="-">Hyphen (-)</option>
        <option value="_">Underscore (_)</option>
      </select>
    </div>
    <div class="field">
      <label for="slug-generator-maxlen">Max length (0 = no limit)</label>
      <input type="number" class="input" id="slug-generator-maxlen" min="0" max="200" value="0">
    </div>
  </div>
  <div class="error" id="slug-generator-error"></div>
  <div class="result" id="slug-generator-result">
    <div class="field">
      <label for="slug-generator-output">Slug</label>
      <input type="text" class="input" id="slug-generator-output" readonly placeholder="your-slug-appears-here">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="slug-generator-copy">Copy slug</button>
      <button class="btn btn-outline" id="slug-generator-clear">Clear</button>
    </div>
    <p class="note">Example: <code>https://example.com/blog/<span id="slug-generator-example">your-slug</span></code></p>
  </div>
</div>
