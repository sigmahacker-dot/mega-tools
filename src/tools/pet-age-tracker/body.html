<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pet-age-tracker-name">Pet's name</label>
      <input class="input" type="text" id="pet-age-tracker-name" placeholder="e.g. Bruno" maxlength="40">
    </div>
    <div class="field">
      <label for="pet-age-tracker-birth">Birthdate</label>
      <input class="input" type="date" id="pet-age-tracker-birth">
    </div>
  </div>
  <div class="field" style="max-width:260px">
    <label for="pet-age-tracker-species">Species</label>
    <select class="input" id="pet-age-tracker-species">
      <option value="dog">🐶 Dog</option>
      <option value="cat">🐱 Cat</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pet-age-tracker-calc">Calculate</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="pet-age-tracker-years" style="font-size:22px">—</div><div class="l">Years old</div></div>
    <div class="stat-card"><div class="v" id="pet-age-tracker-exact" style="font-size:22px">—</div><div class="l">Exact age</div></div>
    <div class="stat-card"><div class="v" id="pet-age-tracker-human" style="font-size:22px">—</div><div class="l">Human-equivalent</div></div>
  </div>
  <div class="result" id="pet-age-tracker-out"></div>
  <div class="error" id="pet-age-tracker-error"></div>
</div>
