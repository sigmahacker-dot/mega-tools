<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="macro-calories">Daily calories (kcal)</label>
      <input type="number" class="input" id="macro-calories" min="800" max="10000" step="any" placeholder="2500">
    </div>
    <div class="field">
      <label for="macro-weight">Body weight (kg)</label>
      <input type="number" class="input" id="macro-weight" min="25" max="400" step="any" placeholder="75">
    </div>
  </div>
  <div class="field">
    <label for="macro-goal">Goal</label>
    <select class="select" id="macro-goal">
      <option value="cut">Cut (lose fat)</option>
      <option value="maintain">Maintain</option>
      <option value="bulk">Bulk (gain muscle)</option>
    </select>
  </div>
  <div class="error" id="macro-calculator-error"></div>
  <div class="result" id="macro-result">
    <table class="data">
      <thead><tr><th>Macro</th><th>Grams</th><th>Calories</th><th>% of calories</th></tr></thead>
      <tbody>
        <tr><th scope="row">Protein</th><td id="macro-p-g">–</td><td id="macro-p-kcal">–</td><td id="macro-p-pct">–</td></tr>
        <tr><th scope="row">Fat</th><td id="macro-f-g">–</td><td id="macro-f-kcal">–</td><td id="macro-f-pct">–</td></tr>
        <tr><th scope="row">Carbs</th><td id="macro-c-g">–</td><td id="macro-c-kcal">–</td><td id="macro-c-pct">–</td></tr>
      </tbody>
    </table>
    <p class="note">Guideline only — protein 2.0–2.2 g/kg, fat 25% of calories, carbs fill the remainder. Not medical advice.</p>
  </div>
</div>
