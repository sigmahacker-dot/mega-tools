<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="raffle-names">Entries <span class="hint">(one per line)</span></label><textarea class="textarea" id="raffle-names" rows="6" placeholder="Ticket 001&#10;Ticket 002&#10;..."></textarea></div>
    <div class="field"><label for="raffle-count">Number of winners</label><input type="number" class="input" id="raffle-count" min="1" max="100" value="1">
      <p class="note" style="margin-top:12px">Each entry wins at most once.</p>
    </div>
  </div>
  <div class="error" id="raffle-picker-error"></div>
  <div class="result" id="raffle-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="raffle-entries">–</div><div class="l">Entries</div></div>
      <div class="stat-card"><div class="v" id="raffle-winners-n">–</div><div class="l">Winners drawn</div></div>
    </div>
    <div id="raffle-winners"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="raffle-go" type="button">Draw winners</button>
      <button class="btn btn-outline" id="raffle-reveal" type="button">Reveal one by one</button>
      <button class="btn btn-outline" id="raffle-dl" type="button">Download .txt</button>
    </div>
  </div>
</div>
