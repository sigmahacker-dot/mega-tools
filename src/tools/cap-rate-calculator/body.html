<div class="tool-card">
  <div class="tabs" style="margin-bottom:12px">
    <button class="tab-btn" id="cap-rate-calculator-tab1" type="button">NOI + Value → Cap rate</button>
    <button class="tab-btn" id="cap-rate-calculator-tab2" type="button">NOI + Cap rate → Value</button>
  </div>
  <div id="cap-rate-calculator-mode1">
    <div class="grid2">
      <div class="field"><label for="cap-rate-calculator-noi1">Annual NOI ($)</label><input class="input" id="cap-rate-calculator-noi1" type="number" min="0" step="any" value="24000"></div>
      <div class="field"><label for="cap-rate-calculator-value1">Property value ($)</label><input class="input" id="cap-rate-calculator-value1" type="number" min="0" step="any" value="400000"></div>
    </div>
  </div>
  <div id="cap-rate-calculator-mode2" class="hidden">
    <div class="grid2">
      <div class="field"><label for="cap-rate-calculator-noi2">Annual NOI ($)</label><input class="input" id="cap-rate-calculator-noi2" type="number" min="0" step="any" value="24000"></div>
      <div class="field"><label for="cap-rate-calculator-cap2">Cap rate (%)</label><input class="input" id="cap-rate-calculator-cap2" type="number" min="0" step="any" value="6"></div>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="cap-rate-calculator-calc">Calculate</button></div>
  <div class="error" id="cap-rate-calculator-error"></div>
  <div class="result" id="cap-rate-calculator-result">—</div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
