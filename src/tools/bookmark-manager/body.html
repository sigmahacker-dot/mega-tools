<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="bookmark-manager-title">Title</label>
      <input class="input" type="text" id="bookmark-manager-title" placeholder="Page title">
    </div>
    <div class="field">
      <label for="bookmark-manager-url">URL</label>
      <input class="input" type="url" id="bookmark-manager-url" placeholder="https://example.com">
    </div>
  </div>
  <div class="field">
    <label for="bookmark-manager-tags">Tags (comma-separated)</label>
    <input class="input" type="text" id="bookmark-manager-tags" placeholder="work, research">
  </div>
  <div class="btn-row">
    <button class="btn" id="bookmark-manager-add">Save Bookmark</button>
    <button class="btn btn-outline" id="bookmark-manager-export">Export JSON</button>
  </div>
  <div class="error" id="bookmark-manager-error"></div>
</div>

<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="bookmark-manager-search">Search</label>
      <input class="input" type="text" id="bookmark-manager-search" placeholder="Search title, URL, tags…">
    </div>
    <div class="field">
      <label for="bookmark-manager-filter">Filter by tag</label>
      <select class="select" id="bookmark-manager-filter"><option value="">All tags</option></select>
    </div>
  </div>
  <div id="bookmark-manager-list"></div>
  <p class="muted" id="bookmark-manager-count"></p>
</div>
