<div class="tool-card">
  <div class="field">
    <label for="secure-note-vault-pass">Vault password</label>
    <input class="input" type="password" id="secure-note-vault-pass" placeholder="Your vault password" autocomplete="current-password">
  </div>
  <p class="note">Your password is never stored — only the encrypted ciphertext is kept in this browser.</p>
  <div class="field">
    <label for="secure-note-vault-title">Note title</label>
    <input class="input" type="text" id="secure-note-vault-title" placeholder="Note title">
  </div>
  <div class="field">
    <label for="secure-note-vault-body">Note content</label>
    <textarea class="textarea" id="secure-note-vault-body" rows="5" placeholder="Secret content…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="secure-note-vault-save">Save Encrypted Note</button>
    <button class="btn btn-outline" id="secure-note-vault-unlock">Unlock Vault</button>
    <button class="btn btn-outline" id="secure-note-vault-lock">Lock</button>
  </div>
  <div class="error" id="secure-note-vault-error"></div>
</div>

<div class="tool-card">
  <h3>Vault <span class="muted" id="secure-note-vault-state"></span></h3>
  <div id="secure-note-vault-list"></div>
</div>
