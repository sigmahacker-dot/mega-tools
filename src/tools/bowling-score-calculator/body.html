<div class="tool-card" style="max-width:860px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="bowling-score-calculator-new">New game</button>
    <button class="btn btn-outline" id="bowling-score-calculator-perfect">Perfect game</button>
    <button class="btn btn-outline" id="bowling-score-calculator-gutter">All gutters</button>
  </div>
  <p class="muted" id="bowling-score-calculator-status" style="min-height:24px;font-weight:600;text-align:center"></p>
  <div style="overflow:auto">
    <div id="bowling-score-calculator-frames" style="display:grid;grid-template-columns:repeat(9,minmax(74px,1fr)) minmax(108px,1.4fr);gap:6px;min-width:760px"></div>
  </div>
  <div class="stat-cards" style="max-width:320px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="bowling-score-calculator-total">0</div><div class="l">Total score</div></div>
  </div>
  <p class="note">Real scoring: strikes and spares earn bonus balls; the 10th frame allows up to 3 balls. Pin menus enforce legal values.</p>
  <div class="error" id="bowling-score-calculator-error"></div>
</div>
