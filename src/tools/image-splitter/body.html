<div class="tool-card">
  <div class="field">
    <label for="image-splitter-file">Upload image</label>
    <input type="file" class="input" id="image-splitter-file" accept="image/*">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="image-splitter-rows">Rows (1–10)</label>
      <input type="number" class="input" id="image-splitter-rows" min="1" max="10" step="1" value="2">
    </div>
    <div class="field">
      <label for="image-splitter-cols">Columns (1–10)</label>
      <input type="number" class="input" id="image-splitter-cols" min="1" max="10" step="1" value="2">
    </div>
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="image-splitter-split">Split image</button>
    <button class="btn btn-outline" id="image-splitter-all" disabled>Download all tiles</button>
  </div>
  <div class="error" id="image-splitter-error"></div>
  <div class="result" id="image-splitter-result" hidden>
    <p class="muted" id="image-splitter-info"></p>
    <div id="image-splitter-grid" style="display:grid;gap:8px"></div>
  </div>
</div>
