<div class="tool-card">
  <div class="field">
    <label for="json-to-go-struct-root">Root struct name</label>
    <input class="input" id="json-to-go-struct-root" value="Root" style="max-width:280px">
  </div>
  <div class="field">
    <label for="json-to-go-struct-input">JSON</label>
    <textarea class="textarea" id="json-to-go-struct-input" rows="8" style="font-family:monospace">{
  "id": 42,
  "name": "Ada Lovelace",
  "active": true,
  "score": 98.6,
  "tags": ["admin", "beta"],
  "address": { "city": "Lahore", "zip": "54000" },
  "manager": null
}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="json-to-go-struct-generate">Generate struct</button>
  </div>
  <div class="error" id="json-to-go-struct-error"></div>
  <div class="field">
    <label for="json-to-go-struct-output">Go</label>
    <textarea class="textarea" id="json-to-go-struct-output" rows="16" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="json-to-go-struct-copy">Copy code</button>
    <button class="btn btn-outline" id="json-to-go-struct-download">Download types.go</button>
  </div>
</div>
