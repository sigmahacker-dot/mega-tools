<div class="tool-card">
  <h2>Business Card Maker</h2>
  <p class="muted">1050×600 card front — live preview, PNG download.</p>
  <div class="grid2">
    <div class="field">
      <label for="business-card-maker-name">Full name</label>
      <input type="text" class="input" id="business-card-maker-name" value="Jordan Lee">
    </div>
    <div class="field">
      <label for="business-card-maker-role">Role / title</label>
      <input type="text" class="input" id="business-card-maker-role" value="Creative Director">
    </div>
    <div class="field">
      <label for="business-card-maker-company">Company</label>
      <input type="text" class="input" id="business-card-maker-company" value="Pixel Studio">
    </div>
    <div class="field">
      <label for="business-card-maker-phone">Phone</label>
      <input type="text" class="input" id="business-card-maker-phone" value="+92 300 1234567">
    </div>
    <div class="field">
      <label for="business-card-maker-email">Email</label>
      <input type="text" class="input" id="business-card-maker-email" value="jordan@pixelstudio.com">
    </div>
    <div class="field">
      <label for="business-card-maker-web">Website</label>
      <input type="text" class="input" id="business-card-maker-web" value="pixelstudio.com">
    </div>
    <div class="field">
      <label for="business-card-maker-theme">Theme</label>
      <select class="input" id="business-card-maker-theme">
        <option value="slate">Slate dark</option>
        <option value="crimson">Crimson</option>
        <option value="teal">Teal</option>
        <option value="light">Light minimal</option>
      </select>
    </div>
    <div class="field">
      <label for="business-card-maker-layout">Layout</label>
      <select class="input" id="business-card-maker-layout">
        <option value="split">Split accent bar</option>
        <option value="band">Top color band</option>
      </select>
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" style="display:flex;justify-content:center">
    <canvas id="business-card-maker-canvas" width="1050" height="600" style="max-width:560px;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)"></canvas>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="business-card-maker-download">⬇ Download PNG</button>
  </div>
  <div class="error" id="business-card-maker-error"></div>
</div>
