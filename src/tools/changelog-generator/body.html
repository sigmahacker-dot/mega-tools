<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="changelog-generator-version">Version</label>
      <input class="input" id="changelog-generator-version" value="1.0.0" placeholder="1.0.0">
    </div>
    <div class="field">
      <label for="changelog-generator-date">Date</label>
      <input type="date" class="input" id="changelog-generator-date">
    </div>
  </div>
  <div class="field">
    <label>Change entries</label>
    <div id="changelog-generator-rows"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-outline" id="changelog-generator-add">+ Add entry</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="changelog-generator-generate">Generate changelog</button>
  </div>
  <div class="error" id="changelog-generator-error"></div>
  <div class="field">
    <label for="changelog-generator-output">CHANGELOG.md</label>
    <textarea class="textarea" id="changelog-generator-output" rows="14" readonly placeholder="Your changelog will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="changelog-generator-copy">Copy</button>
    <button class="btn btn-outline" id="changelog-generator-download">Download CHANGELOG.md</button>
  </div>
</div>
