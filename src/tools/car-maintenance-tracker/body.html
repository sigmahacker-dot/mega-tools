<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="car-maintenance-tracker-cur">Current mileage</label>
      <input class="input" id="car-maintenance-tracker-cur" type="number" min="0" step="1" placeholder="e.g. 45200">
    </div>
    <div class="field">
      <label for="car-maintenance-tracker-name">Service</label>
      <input class="input" id="car-maintenance-tracker-name" type="text" placeholder="e.g. Oil change">
    </div>
    <div class="field">
      <label for="car-maintenance-tracker-lastd">Last done (date)</label>
      <input class="input" id="car-maintenance-tracker-lastd" type="date">
    </div>
    <div class="field">
      <label for="car-maintenance-tracker-lastm">Last done (mileage)</label>
      <input class="input" id="car-maintenance-tracker-lastm" type="number" min="0" step="1" placeholder="e.g. 40000">
    </div>
    <div class="field">
      <label for="car-maintenance-tracker-intm">Interval (months)</label>
      <input class="input" id="car-maintenance-tracker-intm" type="number" min="1" max="60" value="6">
    </div>
    <div class="field">
      <label for="car-maintenance-tracker-intmi">Interval (miles)</label>
      <input class="input" id="car-maintenance-tracker-intmi" type="number" min="100" step="100" value="5000">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="car-maintenance-tracker-add">Add service</button>
    <button type="button" class="btn btn-outline btn-sm" id="car-maintenance-tracker-savem">Save mileage</button>
  </div>
  <div class="error" id="car-maintenance-tracker-error"></div>
  <div class="result">
    <h3>Services</h3>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>Service</th><th>Due by date</th><th>Due by mileage</th><th>Status</th><th></th></tr></thead><tbody id="car-maintenance-tracker-list"></tbody></table></div>
  </div>
</div>
