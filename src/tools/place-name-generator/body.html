<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="place-name-generator-mode">Mode</label>
      <select class="select" id="place-name-generator-mode">
        <option value="town">Town</option>
        <option value="kingdom">Kingdom</option>
        <option value="tavern">Tavern</option>
      </select>
    </div>
    <div class="field">
      <label for="place-name-generator-count">How many</label>
      <select class="select" id="place-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="place-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="place-name-generator-error"></div>
  <div class="mt" id="place-name-generator-list"></div>
</div>
