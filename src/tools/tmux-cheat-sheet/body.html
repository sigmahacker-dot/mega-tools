<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tmux-cheat-sheet-q">Search bindings</label>
      <input class="input" id="tmux-cheat-sheet-q" placeholder="e.g. split, pane, session…">
    </div>
    <div class="field">
      <label for="tmux-cheat-sheet-sec">Section</label>
      <select class="select" id="tmux-cheat-sheet-sec"><option value="">All sections</option></select>
    </div>
  </div>
  <p class="muted" id="tmux-cheat-sheet-count"></p>
  <div style="overflow:auto">
    <table style="width:100%;border-collapse:collapse;font-size:14px" id="tmux-cheat-sheet-table">
      <thead><tr style="text-align:left;border-bottom:1px solid #3f3f46">
        <th style="padding:8px">Keys / Command</th><th style="padding:8px">Section</th><th style="padding:8px">Description</th>
      </tr></thead>
      <tbody id="tmux-cheat-sheet-body"></tbody>
    </table>
  </div>
  <div class="error" id="tmux-cheat-sheet-error"></div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-outline" id="tmux-cheat-sheet-download">Download as Markdown</button>
  </div>
  <p class="note">C-b = Ctrl+b, the default tmux prefix. Bindings are tmux 3.x defaults.</p>
</div>
