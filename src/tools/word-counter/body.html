<div class="tool-card">
  <div class="field">
    <label for="word-counter-input">Your text</label>
    <textarea class="textarea" id="word-counter-input" rows="10" placeholder="Type or paste your text here..."></textarea>
  </div>
  <div class="error" id="word-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="word-counter-words">0</div><div class="l">Words</div></div>
    <div class="stat-card"><div class="v" id="word-counter-chars">0</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="word-counter-charsns">0</div><div class="l">Characters (no spaces)</div></div>
    <div class="stat-card"><div class="v" id="word-counter-sentences">0</div><div class="l">Sentences</div></div>
    <div class="stat-card"><div class="v" id="word-counter-paras">0</div><div class="l">Paragraphs</div></div>
    <div class="stat-card"><div class="v" id="word-counter-read">0 min</div><div class="l">Reading time</div></div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-outline btn-sm" id="word-counter-copy" type="button">Copy text</button>
    <button class="btn btn-outline btn-sm" id="word-counter-clear" type="button">Clear</button>
  </div>
  <p class="note">All counting happens in your browser — your text is never uploaded.</p>
</div>
