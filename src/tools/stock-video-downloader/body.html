<div class="tool-card">
  <div class="field">
    <label for="stock-video-downloader-q">Search stock videos</label>
    <input class="input" id="stock-video-downloader-q" type="text" placeholder="e.g. ocean waves" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="stock-video-downloader-search" type="button">Search</button>
  </div>
  <div class="error" id="stock-video-downloader-error"></div>
  <p class="note hidden" id="stock-video-downloader-setup">Stock video search is being set up — please check back soon.</p>
  <p class="muted" id="stock-video-downloader-status"></p>
  <div id="stock-video-downloader-grid" class="grid2 mt"></div>
  <p class="note">All videos are Pexels License — free for commercial use, no attribution required.</p>
</div>
