<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="event-countdown-name">Event name</label>
      <input type="text" class="input" id="event-countdown-name" placeholder="e.g. New Year" autocomplete="off">
    </div>
    <div class="field">
      <label for="event-countdown-dt">Date and time</label>
      <input type="datetime-local" class="input" id="event-countdown-dt">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="event-countdown-start">Start countdown</button>
    <button type="button" class="btn btn-outline" id="event-countdown-stop">Stop</button>
  </div>
  <div class="error" id="event-countdown-error"></div>
  <div class="result" id="event-countdown-result">
    <p class="note" id="event-countdown-title" style="text-align:center;font-weight:bold;"></p>
    <div class="stat-cards" id="event-countdown-digits">
      <div class="stat-card"><div class="v" id="event-countdown-d" style="font-size:2.2em;">&ndash;</div><div class="l">Days</div></div>
      <div class="stat-card"><div class="v" id="event-countdown-h" style="font-size:2.2em;">&ndash;</div><div class="l">Hours</div></div>
      <div class="stat-card"><div class="v" id="event-countdown-m" style="font-size:2.2em;">&ndash;</div><div class="l">Minutes</div></div>
      <div class="stat-card"><div class="v" id="event-countdown-s" style="font-size:2.2em;">&ndash;</div><div class="l">Seconds</div></div>
    </div>
    <p class="note" id="event-countdown-msg" style="text-align:center;"></p>
  </div>
</div>
