<div class="tool-card">
  <div class="dropzone" id="audio-trim-silence-drop">
    <span class="dz-icon">✂️</span>
    <strong>Drop an audio file here</strong> or click to browse
    <input type="file" id="audio-trim-silence-file" accept="audio/*" class="hidden">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="audio-trim-silence-threshold">Silence threshold (dB): <span id="audio-trim-silence-threshold-val">-40</span></label>
      <input type="range" id="audio-trim-silence-threshold" min="-80" max="-10" value="-40">
      <span class="hint">Anything quieter than this counts as silence.</span>
    </div>
    <div class="field">
      <label for="audio-trim-silence-minlen">Min silence length (s): <span id="audio-trim-silence-minlen-val">0.5</span></label>
      <input type="range" id="audio-trim-silence-minlen" min="0.1" max="5" step="0.1" value="0.5">
      <span class="hint">Shorter quiet bits are kept.</span>
    </div>
  </div>
  <div class="result hidden" id="audio-trim-silence-result">
    <table class="data"><tbody id="audio-trim-silence-rows"></tbody></table>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="audio-trim-silence-detect">Detect silence</button>
    <button class="btn btn-primary hidden" id="audio-trim-silence-go">Trim &amp; download WAV</button>
  </div>
  <div class="error" id="audio-trim-silence-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
