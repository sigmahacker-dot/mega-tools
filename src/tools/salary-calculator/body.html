<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="salary-annual">Annual salary ($)</label>
      <input type="number" class="input" id="salary-annual" min="1" step="any" placeholder="75000">
    </div>
    <div class="field">
      <label for="salary-hours">Hours per week</label>
      <input type="number" class="input" id="salary-hours" min="1" max="168" step="any" placeholder="40">
    </div>
    <div class="field">
      <label for="salary-days">Days per week</label>
      <input type="number" class="input" id="salary-days" min="1" max="7" step="1" placeholder="5">
    </div>
  </div>
  <div class="error" id="salary-calculator-error"></div>
  <div class="result" id="salary-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="salary-hourly">–</div><div class="l">Hourly</div></div>
      <div class="stat-card"><div class="v" id="salary-daily">–</div><div class="l">Daily</div></div>
      <div class="stat-card"><div class="v" id="salary-weekly">–</div><div class="l">Weekly</div></div>
      <div class="stat-card"><div class="v" id="salary-biweekly">–</div><div class="l">Biweekly</div></div>
      <div class="stat-card"><div class="v" id="salary-monthly">–</div><div class="l">Monthly</div></div>
    </div>
    <p class="note">Gross pay before taxes and deductions, assuming 52 identical working weeks.</p>
  </div>
</div>
