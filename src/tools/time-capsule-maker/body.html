<div class="tool-card">
  <div class="field">
    <label for="time-capsule-maker-title">Capsule title</label>
    <input class="input" type="text" id="time-capsule-maker-title" placeholder="e.g. Letter to future me" maxlength="80">
  </div>
  <div class="field">
    <label for="time-capsule-maker-msg">Your message</label>
    <textarea class="textarea" id="time-capsule-maker-msg" rows="4" placeholder="Write something for the future…" maxlength="5000"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="time-capsule-maker-date">Open date</label>
      <input class="input" type="date" id="time-capsule-maker-date">
    </div>
    <div class="field" style="display:flex;align-items:flex-end">
      <button class="btn btn-primary" id="time-capsule-maker-seal" style="width:100%">🔒 Seal capsule</button>
    </div>
  </div>
  <hr style="border:none;border-top:1px solid #eee;margin:16px 0">
  <h3 style="margin:0 0 8px">Your capsules</h3>
  <div id="time-capsule-maker-list"></div>
  <div class="error" id="time-capsule-maker-error"></div>
</div>
