<div class="tool-card">
  <div id="debt-rows"></div>
  <div class="btn-row">
    <button class="btn btn-outline" id="debt-add">Add debt</button>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="debt-extra">Extra monthly payment ($)</label>
      <input type="number" class="input" id="debt-extra" min="0" step="any" placeholder="200">
    </div>
  </div>
  <div class="error" id="debt-payoff-calculator-error"></div>
  <div class="result" id="debt-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="debt-months">–</div><div class="l">Months to debt-free</div></div>
      <div class="stat-card"><div class="v" id="debt-interest">–</div><div class="l">Total interest</div></div>
      <div class="stat-card"><div class="v" id="debt-first">–</div><div class="l">Pay off first</div></div>
    </div>
    <table class="data">
      <thead>
        <tr><th>#</th><th>Debt</th><th>Balance</th><th>APR</th><th>Payoff month</th></tr>
      </thead>
      <tbody id="debt-table-body">
        <tr><td colspan="5" class="muted">Enter your debts above to build the payoff plan.</td></tr>
      </tbody>
    </table>
    <p class="note">Avalanche method: minimums on every debt, extra money attacks the highest APR first.</p>
  </div>
</div>
