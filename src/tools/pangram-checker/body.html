<div class="tool-card">
  <div class="field">
    <label for="pangram-checker-input">Your text</label>
    <textarea class="textarea" id="pangram-checker-input" rows="4" placeholder="Type a sentence"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="pangram-checker-verdict">–</div><div class="l">Verdict</div></div>
    <div class="stat-card"><div class="v" id="pangram-checker-found">0/26</div><div class="l">Letters found</div></div>
  </div>
  <div class="field">
    <label>Missing letters</label>
    <div class="result"><div class="data" id="pangram-checker-missing" style="white-space:pre-wrap"></div></div>
  </div>
  <div class="error" id="pangram-checker-error"></div>
</div>
