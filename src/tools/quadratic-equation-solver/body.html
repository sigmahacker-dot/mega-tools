<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="quadratic-equation-solver-a">a (x&sup2; coefficient)</label>
      <input type="number" class="input" id="quadratic-equation-solver-a" step="any" value="1">
    </div>
    <div class="field">
      <label for="quadratic-equation-solver-b">b (x coefficient)</label>
      <input type="number" class="input" id="quadratic-equation-solver-b" step="any" value="-3">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="quadratic-equation-solver-c">c (constant)</label>
      <input type="number" class="input" id="quadratic-equation-solver-c" step="any" value="2">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" id="quadratic-equation-solver-go">Solve</button>
    </div>
  </div>
  <div class="error" id="quadratic-equation-solver-error"></div>
  <div class="result" id="quadratic-equation-solver-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="quadratic-equation-solver-root1">&ndash;</div><div class="l">Root 1</div></div>
      <div class="stat-card"><div class="v" id="quadratic-equation-solver-root2">&ndash;</div><div class="l">Root 2</div></div>
      <div class="stat-card"><div class="v" id="quadratic-equation-solver-disc">&ndash;</div><div class="l">Discriminant</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Root nature</th><td id="quadratic-equation-solver-nature">&ndash;</td></tr>
        <tr><th scope="row">Vertex (h, k)</th><td id="quadratic-equation-solver-vertex">&ndash;</td></tr>
        <tr><th scope="row">Axis of symmetry</th><td id="quadratic-equation-solver-axis">&ndash;</td></tr>
        <tr><th scope="row">Factored form</th><td id="quadratic-equation-solver-factored">&ndash;</td></tr>
      </tbody>
    </table>
  </div>
</div>
