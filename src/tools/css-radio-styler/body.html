<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="css-radio-styler-accent">Accent color</label>
      <input class="input" id="css-radio-styler-accent" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="css-radio-styler-size">Circle size (px)</label>
      <input class="input" id="css-radio-styler-size" type="number" value="22" min="14" max="48">
    </div>
    <div class="field">
      <label for="css-radio-styler-style">Inner style</label>
      <select class="select" id="css-radio-styler-style">
        <option value="dot">Filled dot</option>
        <option value="ring">Ring</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="css-radio-styler-labels">Option labels (one per line)</label>
    <textarea class="textarea" id="css-radio-styler-labels" rows="3">Option one
Option two
Option three</textarea>
  </div>
  <div class="field">
    <label>Live preview (clickable)</label>
    <div id="css-radio-styler-preview" style="border:1px solid #27272a;border-radius:12px;padding:32px;background:#18181b;display:flex;justify-content:center"></div>
  </div>
  <div class="error" id="css-radio-styler-error"></div>
  <div class="field">
    <label for="css-radio-styler-output">HTML + CSS</label>
    <textarea class="textarea" id="css-radio-styler-output" rows="14" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="css-radio-styler-copy">Copy code</button>
    <button class="btn btn-outline" id="css-radio-styler-download">Download radio.html</button>
  </div>
</div>
