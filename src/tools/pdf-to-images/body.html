<div class="tool-card">
  <h2>PDF to Images</h2>
  <p class="muted">Render every PDF page as a PNG — download pages one by one or all together as a ZIP.</p>
  <div class="field">
    <label for="pdf-to-images-file">Choose a PDF</label>
    <input type="file" class="input" id="pdf-to-images-file" accept=".pdf,application/pdf">
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="pdf-to-images-convert">Convert to images</button>
    <button class="btn btn-outline" id="pdf-to-images-clear">Clear</button>
  </div>
  <div class="progress mt hidden" id="pdf-to-images-progress"><div style="width:0%"></div></div>
  <div class="error" id="pdf-to-images-error"></div>
  <div class="result hidden" id="pdf-to-images-result">
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn btn-primary" id="pdf-to-images-zip">Download all as ZIP</button>
    </div>
    <div id="pdf-to-images-thumbs" class="grid2"></div>
  </div>
  <p class="note">Pages render at 2× scale. Everything happens locally in your browser.</p>
</div>
