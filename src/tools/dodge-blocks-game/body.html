<div class="tool-card" style="text-align:center;max-width:480px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn btn-primary" id="dodge-blocks-game-start">Start</button>
  </div>
  <div class="stat-cards" style="margin-bottom:8px">
    <div class="stat-card"><div class="v" id="dodge-blocks-game-score">0.0s</div><div class="l">Time</div></div>
    <div class="stat-card"><div class="v" id="dodge-blocks-game-best">0.0s</div><div class="l">Best</div></div>
  </div>
  <canvas id="dodge-blocks-game-canvas" width="400" height="520" style="width:100%;max-width:400px;border-radius:12px;background:#1c1917;touch-action:none;cursor:crosshair"></canvas>
  <p class="note">←/→ or A/D to move · drag on touch</p>
  <div class="error" id="dodge-blocks-game-error"></div>
</div>
