<div class="tool-card">
  <h2>Certificate Maker</h2>
  <p class="muted">Elegant 1600×1200 certificates — live preview, PNG download.</p>
  <div class="grid2">
    <div class="field">
      <label for="certificate-maker-recipient">Recipient name</label>
      <input type="text" class="input" id="certificate-maker-recipient" value="Alex Morgan">
    </div>
    <div class="field">
      <label for="certificate-maker-title">Certificate title</label>
      <input type="text" class="input" id="certificate-maker-title" value="Outstanding Achievement">
    </div>
    <div class="field">
      <label for="certificate-maker-subtitle">Awarded for</label>
      <input type="text" class="input" id="certificate-maker-subtitle" value="Completing the Advanced Design Course with distinction">
    </div>
    <div class="field">
      <label for="certificate-maker-issuer">Issued by</label>
      <input type="text" class="input" id="certificate-maker-issuer" value="ToolNest Academy">
    </div>
    <div class="field">
      <label for="certificate-maker-date">Date</label>
      <input type="text" class="input" id="certificate-maker-date" value="October 1, 2026">
    </div>
    <div class="field">
      <label for="certificate-maker-signature">Signature name</label>
      <input type="text" class="input" id="certificate-maker-signature" value="Director">
    </div>
    <div class="field" style="grid-column:1/-1">
      <label for="certificate-maker-theme">Border theme</label>
      <select class="input" id="certificate-maker-theme">
        <option value="gold">Gold classic</option>
        <option value="navy">Navy & silver</option>
        <option value="emerald">Emerald</option>
        <option value="crimson">Crimson</option>
      </select>
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" style="display:flex;justify-content:center">
    <canvas id="certificate-maker-canvas" width="1600" height="1200" style="max-width:640px;width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="certificate-maker-download">⬇ Download PNG</button>
  </div>
  <div class="error" id="certificate-maker-error"></div>
</div>
