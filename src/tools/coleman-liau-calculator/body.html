<div class="tool-card">
  <div class="field">
    <label for="coleman-liau-calculator-input">Your text</label>
    <textarea class="textarea" id="coleman-liau-calculator-input" rows="8" placeholder="Paste at least a few sentences for a meaningful score..."></textarea>
  </div>
  <div class="error" id="coleman-liau-calculator-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="coleman-liau-calculator-index">–</div><div class="l">Coleman-Liau Index</div></div>
    <div class="stat-card"><div class="v" id="coleman-liau-calculator-l">0</div><div class="l">Letters / 100 words</div></div>
    <div class="stat-card"><div class="v" id="coleman-liau-calculator-s">0</div><div class="l">Sentences / 100 words</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <tbody>
        <tr><td>Letters</td><td id="coleman-liau-calculator-letters">0</td></tr>
        <tr><td>Words</td><td id="coleman-liau-calculator-words">0</td></tr>
        <tr><td>Sentences</td><td id="coleman-liau-calculator-sentences">0</td></tr>
      </tbody>
    </table>
    <p class="note">Formula: CLI = 0.0588·L − 0.296·S − 15.8, where L = letters per 100 words and S = sentences per 100 words.</p>
  </div>
</div>
