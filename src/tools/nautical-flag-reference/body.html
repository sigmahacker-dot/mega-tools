<div class="tool-card">
  <div class="field">
    <label for="nautical-flag-reference-search">Search flags</label>
    <input class="input" id="nautical-flag-reference-search" type="text" placeholder="Letter, NATO name, or meaning — e.g. 'pilot'…">
  </div>
  <div class="error" id="nautical-flag-reference-error"></div>
  <div id="nautical-flag-reference-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px"></div>
  <p class="note">Meanings follow the International Code of Signals (single-flag hoists). Tap a card to copy its letter and meaning.</p>
</div>
