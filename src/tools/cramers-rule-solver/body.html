<div class="tool-card">
  <div class="field" style="max-width:260px">
    <label for="cramers-rule-solver-size">System size</label>
    <select class="select" id="cramers-rule-solver-size">
      <option value="2">2×2</option>
      <option value="3" selected>3×3</option>
    </select>
  </div>
  <div id="cramers-rule-solver-grid"></div>
  <div class="btn-row">
    <button type="button" class="btn" id="cramers-rule-solver-solve">Solve</button>
    <button type="button" class="btn btn-outline" id="cramers-rule-solver-sample">Load sample</button>
  </div>
  <div class="error" id="cramers-rule-solver-error"></div>
  <div id="cramers-rule-solver-out" class="hidden">
    <div class="stat-cards" id="cramers-rule-solver-cards"></div>
    <div class="result">
      <h3>Determinant steps</h3>
      <div id="cramers-rule-solver-steps"></div>
    </div>
  </div>
</div>
