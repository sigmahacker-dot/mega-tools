<div class="tool-card">
  <div class="field">
    <label for="social-character-counter-platform">Platform</label>
    <select class="select" id="social-character-counter-platform">
      <option value="280">X / Twitter post — 280</option>
      <option value="500">Threads — 500</option>
      <option value="800">Pinterest pin description — 800</option>
      <option value="2200">Instagram caption — 2,200</option>
      <option value="3000">LinkedIn post — 3,000</option>
      <option value="4000">TikTok caption — 4,000</option>
      <option value="5000">YouTube description — 5,000</option>
      <option value="100">YouTube title — 100</option>
      <option value="63206">Facebook post — 63,206</option>
    </select>
  </div>
  <div class="field">
    <label for="social-character-counter-input">Your post</label>
    <textarea class="textarea" id="social-character-counter-input" rows="6" placeholder="Write your post here..."></textarea>
  </div>
  <div class="error" id="social-character-counter-error"></div>
  <div class="result mt">
    <div class="field">
      <label>Limit usage</label>
      <div style="background:rgba(0,0,0,.12);border-radius:8px;height:14px;overflow:hidden;"><div id="social-character-counter-bar" style="height:100%;width:0%;background:#4D7C0F;transition:width .15s;"></div></div>
    </div>
    <div class="stat-cards mt">
      <div class="stat-card"><div class="v" id="social-character-counter-chars">0</div><div class="l">Characters</div></div>
      <div class="stat-card"><div class="v" id="social-character-counter-words">0</div><div class="l">Words</div></div>
      <div class="stat-card"><div class="v" id="social-character-counter-left">280</div><div class="l">Remaining</div></div>
    </div>
  </div>
</div>
