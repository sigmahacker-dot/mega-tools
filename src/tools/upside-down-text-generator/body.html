<div class="tool-card">
  <div class="field">
    <label for="upside-down-text-generator-input">Your text</label>
    <input type="text" class="input" id="upside-down-text-generator-input" placeholder="type something fun" maxlength="140" value="hello world">
  </div>
  <div class="error" id="upside-down-text-generator-error"></div>
  <div class="field mt">
    <label for="upside-down-text-generator-output">Flipped result</label>
    <textarea class="textarea" id="upside-down-text-generator-output" rows="3" readonly style="font-size:1.3rem;"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="upside-down-text-generator-copy" type="button">Copy result</button>
    <button class="btn btn-outline btn-sm" id="upside-down-text-generator-clear" type="button">Clear</button>
  </div>
</div>
