<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="facebook-ad-copy-generator-product">Product / service</label>
      <input class="input" type="text" id="facebook-ad-copy-generator-product" placeholder="e.g. handmade candles">
    </div>
    <div class="field">
      <label for="facebook-ad-copy-generator-aud">Target audience</label>
      <input class="input" type="text" id="facebook-ad-copy-generator-aud" placeholder="e.g. busy moms">
    </div>
    <div class="field">
      <label for="facebook-ad-copy-generator-offer">Offer / hook</label>
      <input class="input" type="text" id="facebook-ad-copy-generator-offer" placeholder="e.g. 20% off this week">
    </div>
    <div class="field">
      <label for="facebook-ad-copy-generator-tone">Tone</label>
      <select class="select" id="facebook-ad-copy-generator-tone">
        <option value="conversational">Conversational</option>
        <option value="urgent">Urgent</option>
        <option value="premium">Premium</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="facebook-ad-copy-generator-gen">Generate Ad Copy</button>
  </div>
  <div class="error" id="facebook-ad-copy-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Ad combinations</h3>
  <div id="facebook-ad-copy-generator-out"></div>
</div>
