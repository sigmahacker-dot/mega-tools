<div class="tool-card">
  <div id="workout-volume-calculator-rows"></div>
  <div class="btn-row">
    <button class="btn" id="workout-volume-calculator-add">+ Add exercise</button>
    <button class="btn btn-primary" id="workout-volume-calculator-calc">Calculate volume</button>
  </div>
  <div class="stat-cards hidden" id="workout-volume-calculator-out">
    <div class="stat-card"><div class="v" id="workout-volume-calculator-total">0</div><div class="l">Total volume (kg)</div></div>
    <div class="stat-card"><div class="v" id="workout-volume-calculator-ex">0</div><div class="l">Exercises</div></div>
  </div>
  <div class="result hidden" id="workout-volume-calculator-table"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Increase volume gradually (≤10%/week).</p>
  <div class="error" id="workout-volume-calculator-error"></div>
</div>
