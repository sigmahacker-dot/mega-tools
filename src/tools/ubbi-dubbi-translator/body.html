<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="ubbi-dubbi-translator-mode">Mode</label>
      <select class="select" id="ubbi-dubbi-translator-mode">
        <option value="encode">Encode to Ubbi Dubbi</option>
        <option value="decode">Decode Ubbi Dubbi</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="ubbi-dubbi-translator-go" type="button">Translate</button>
        <button class="btn btn-outline" id="ubbi-dubbi-translator-sample" type="button">Sample</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label for="ubbi-dubbi-translator-input">Your text</label>
    <textarea class="textarea" id="ubbi-dubbi-translator-input" rows="4" placeholder="Type something to translate…"></textarea>
  </div>
  <div class="error" id="ubbi-dubbi-translator-error"></div>
  <div class="field">
    <label>Result</label>
    <div class="result" id="ubbi-dubbi-translator-output">Your translation will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="ubbi-dubbi-translator-copy" type="button">Copy Result</button>
  </div>
</div>
