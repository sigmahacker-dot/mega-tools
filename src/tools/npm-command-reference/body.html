<div class="tool-card">
  <div class="field">
    <label for="npm-command-reference-search">Search commands</label>
    <input class="input" id="npm-command-reference-search" placeholder="e.g. install, audit, publish…">
    <p class="hint">Click any command to copy it.</p>
  </div>
  <div class="error" id="npm-command-reference-error"></div>
  <div id="npm-command-reference-list"></div>
  <p class="muted hidden" id="npm-command-reference-none">No commands match your search.</p>
</div>
