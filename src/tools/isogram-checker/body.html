<div class="tool-card">
  <div class="field">
    <label for="isogram-checker-input">Your text</label>
    <textarea class="textarea" id="isogram-checker-input" rows="4" placeholder="Type a word or phrase"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="isogram-checker-verdict">–</div><div class="l">Verdict</div></div>
    <div class="stat-card"><div class="v" id="isogram-checker-letters">0</div><div class="l">Unique letters</div></div>
  </div>
  <div class="field">
    <label>Duplicate letters</label>
    <div class="result"><div class="data" id="isogram-checker-dups" style="white-space:pre-wrap"></div></div>
  </div>
  <div class="error" id="isogram-checker-error"></div>
</div>
