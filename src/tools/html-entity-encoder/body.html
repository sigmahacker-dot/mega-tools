<div class="tool-card">
  <div class="btn-row">
    <button type="button" class="btn btn-primary btn-sm" id="html-entity-encoder-m-encode">Encode</button>
    <button type="button" class="btn btn-outline btn-sm" id="html-entity-encoder-m-decode">Decode</button>
  </div>
  <div class="field">
    <label for="html-entity-encoder-in" id="html-entity-encoder-inlabel">Text to encode</label>
    <textarea class="textarea" id="html-entity-encoder-in" rows="5" placeholder="Type or paste here…" spellcheck="false"></textarea>
  </div>
  <div class="error" id="html-entity-encoder-error"></div>
  <div class="result" id="html-entity-encoder-result">
  <div class="field">
    <label for="html-entity-encoder-out">Result</label>
    <textarea class="textarea" id="html-entity-encoder-out" rows="5" readonly spellcheck="false"></textarea>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-outline btn-sm" id="html-entity-encoder-copy">Copy result</button>
  </div>
  </div>
  <p class="note">Encoding escapes &amp; &lt; &gt; " ' and maps common Latin-1 characters to named entities. Decoding uses the browser's HTML parser, so every entity type is handled.</p>
</div>
