<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="vo2-method">Method</label>
      <select class="input" id="vo2-method">
        <option value="cooper">Cooper 12-min run (distance)</option>
        <option value="hr">Resting heart rate</option>
      </select>
    </div>
    <div class="field"><label for="vo2-dist">Distance in 12 min (meters)</label><input type="number" class="input" id="vo2-dist" min="0" step="any" placeholder="2400"></div>
    <div class="field"><label for="vo2-age">Age (years)</label><input type="number" class="input" id="vo2-age" min="10" max="100" step="1" placeholder="35"></div>
    <div class="field"><label for="vo2-rest">Resting heart rate (bpm)</label><input type="number" class="input" id="vo2-rest" min="30" max="120" step="1" placeholder="60"></div>
  </div>
  <div class="error" id="vo2max-estimator-error"></div>
  <div class="result" id="vo2-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="vo2-score">–</div><div class="l">VO2 max (ml/kg/min)</div></div>
      <div class="stat-card"><div class="v" id="vo2-rating">–</div><div class="l">Fitness rating</div></div>
    </div>
    <p class="note">Estimates only, not a lab measurement. The Cooper test needs a true maximal 12-minute effort.</p>
  </div>
</div>
