<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <div class="field"><label for="clock-angle-calculator-h">Hour (1\u201312)</label><input class="input" id="clock-angle-calculator-h" type="number" value="3" min="1" max="12" step="1"></div>
    <div class="field"><label for="clock-angle-calculator-m">Minute (0\u201359)</label><input class="input" id="clock-angle-calculator-m" type="number" value="15" min="0" max="59" step="1"></div>
  </div>
  <div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="clock-angle-calculator-go">Calculate</button></div>
  <div class="stat-cards" style="max-width:440px;margin:12px auto">
    <div class="stat-card"><div class="v" id="clock-angle-calculator-ang">7.5\u00B0</div><div class="l">Smaller angle</div></div>
    <div class="stat-card"><div class="v" id="clock-angle-calculator-big">352.5\u00B0</div><div class="l">Larger (reflex) angle</div></div>
  </div>
  <svg id="clock-angle-calculator-svg" width="220" height="220" viewBox="0 0 220 220" style="background:#fff;border:1px solid #ddd;border-radius:50%" role="img" aria-label="Clock face"></svg>
  <div class="result" style="max-width:560px;margin:12px auto 0"><pre class="code" id="clock-angle-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="clock-angle-calculator-error"></div>
</div>
