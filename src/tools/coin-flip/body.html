<div class="tool-card">
  <div class="center">
    <div id="coin-flip-coin" style="display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;background:#f4b942;color:#5a3c00;font-size:2.5rem;font-weight:700;border:4px solid #d89a1e;box-shadow:0 4px 12px rgba(0,0,0,.2);user-select:none;">?</div>
  </div>
  <div class="btn-row mt center" style="justify-content:center;">
    <button class="btn btn-primary" id="coin-flip-flip" type="button">Flip Coin</button>
    <button class="btn btn-outline" id="coin-flip-reset" type="button">Reset Tally</button>
  </div>
  <div class="error" id="coin-flip-error"></div>
  <div class="result hidden" id="coin-flip-result">
    <p class="center" id="coin-flip-outcome" style="font-size:1.5rem;font-weight:700;"></p>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="coin-flip-heads">0</div><div class="l">Heads</div></div>
      <div class="stat-card"><div class="v" id="coin-flip-tails">0</div><div class="l">Tails</div></div>
      <div class="stat-card"><div class="v" id="coin-flip-flips">0</div><div class="l">Total flips</div></div>
    </div>
  </div>
  <p class="note">Each flip is independent and random &mdash; streaks are normal, no result is ever &ldquo;due&rdquo;.</p>
</div>
