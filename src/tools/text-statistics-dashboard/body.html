<div class="tool-card">
  <div class="field">
    <label for="text-statistics-dashboard-input">Your text</label>
    <textarea class="textarea" id="text-statistics-dashboard-input" rows="8" placeholder="Paste your text here"></textarea>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-words">0</div><div class="l">Words</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-chars">0</div><div class="l">Characters</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-charsnospace">0</div><div class="l">Chars (no spaces)</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-sents">0</div><div class="l">Sentences</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-paras">0</div><div class="l">Paragraphs</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-read">0s</div><div class="l">Reading time</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-speak">0s</div><div class="l">Speaking time</div></div>
    <div class="stat-card"><div class="v" id="text-statistics-dashboard-avglen">0</div><div class="l">Avg word length</div></div>
  </div>
  <div class="field">
    <label>Top 10 words</label>
    <div class="result"><div class="data" id="text-statistics-dashboard-top10"></div></div>
  </div>
  <div class="error" id="text-statistics-dashboard-error"></div>
</div>
