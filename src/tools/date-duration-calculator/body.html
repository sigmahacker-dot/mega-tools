<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="date-duration-calculator-from">Start date</label>
      <input type="date" class="input" id="date-duration-calculator-from">
    </div>
    <div class="field">
      <label for="date-duration-calculator-to">End date</label>
      <input type="date" class="input" id="date-duration-calculator-to">
    </div>
  </div>
  <div class="field">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input type="checkbox" id="date-duration-calculator-business" checked> Count business days (Mon&ndash;Fri)
    </label>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="date-duration-calculator-go">Calculate</button>
  </div>
  <div class="error" id="date-duration-calculator-error"></div>
  <div class="result" id="date-duration-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="date-duration-calculator-ymd">&ndash;</div><div class="l">Duration</div></div>
      <div class="stat-card"><div class="v" id="date-duration-calculator-days">&ndash;</div><div class="l">Total days</div></div>
      <div class="stat-card"><div class="v" id="date-duration-calculator-bdays">&ndash;</div><div class="l">Business days</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Total weeks</th><td id="date-duration-calculator-weeks">&ndash;</td></tr>
        <tr><th scope="row">Total hours</th><td id="date-duration-calculator-hours">&ndash;</td></tr>
        <tr><th scope="row">Total minutes</th><td id="date-duration-calculator-minutes">&ndash;</td></tr>
      </tbody>
    </table>
  </div>
</div>
