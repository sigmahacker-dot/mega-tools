<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="lights-out-game-moves">0</div><div class="l">Moves</div></div>
  </div>
  <p class="muted" id="lights-out-game-msg" style="min-height:24px">Turn off all the lights!</p>
  <div style="overflow:auto;display:inline-block;max-width:100%">
    <div id="lights-out-game-board" style="display:inline-grid;grid-template-columns:repeat(5,58px);gap:6px;background:#37474f;padding:10px;border-radius:12px"></div>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn btn-primary" id="lights-out-game-new">New game</button>
  </div>
  <div class="error" id="lights-out-game-error"></div>
</div>
