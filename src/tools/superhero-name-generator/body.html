<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="superhero-name-generator-lean">Leaning</label>
      <select class="select" id="superhero-name-generator-lean">
        <option value="hero" selected>Hero</option>
        <option value="villain">Villain</option>
      </select>
    </div>
    <div class="field">
      <label for="superhero-name-generator-count">How many</label>
      <select class="select" id="superhero-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="superhero-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="superhero-name-generator-error"></div>
  <div class="mt" id="superhero-name-generator-list"></div>
</div>
