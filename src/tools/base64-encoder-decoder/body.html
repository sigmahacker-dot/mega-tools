<div class="tool-card">
  <div class="btn-row" role="group" aria-label="Mode">
    <button class="btn btn-primary btn-sm" id="base64-encoder-decoder-encode-mode" type="button">Encode</button>
    <button class="btn btn-outline btn-sm" id="base64-encoder-decoder-decode-mode" type="button">Decode</button>
  </div>
  <div class="field mt">
    <label for="base64-encoder-decoder-input">Text</label>
    <textarea class="textarea code" id="base64-encoder-decoder-input" rows="6" placeholder="Text to encode, or Base64 to decode..."></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="base64-encoder-decoder-run" type="button">Convert</button>
    <button class="btn btn-outline" id="base64-encoder-decoder-copy" type="button">Copy result</button>
  </div>
  <div class="error" id="base64-encoder-decoder-error"></div>
  <div class="result hidden" id="base64-encoder-decoder-result">
    <pre id="base64-encoder-decoder-output"></pre>
  </div>
  <div class="field mt">
    <label for="base64-encoder-decoder-file">Or encode a file to a Base64 data URL</label>
    <input class="input" type="file" id="base64-encoder-decoder-file">
  </div>
  <p class="muted" id="base64-encoder-decoder-fileinfo"></p>
  <p class="note">Encoding handles full UTF-8 text (emoji included). Files are converted to data URLs in your browser — nothing is uploaded.</p>
</div>
