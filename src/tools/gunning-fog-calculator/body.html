<div class="tool-card">
  <div class="field">
    <label for="gunning-fog-calculator-input">Your text</label>
    <textarea class="textarea" id="gunning-fog-calculator-input" rows="8" placeholder="Paste at least a few sentences for a meaningful score..."></textarea>
  </div>
  <div class="error" id="gunning-fog-calculator-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="gunning-fog-calculator-index">–</div><div class="l">Fog Index</div></div>
    <div class="stat-card"><div class="v" id="gunning-fog-calculator-complex">0</div><div class="l">Complex words</div></div>
    <div class="stat-card"><div class="v" id="gunning-fog-calculator-level">–</div><div class="l">Reading level</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <tbody>
        <tr><td>Words</td><td id="gunning-fog-calculator-words">0</td></tr>
        <tr><td>Sentences</td><td id="gunning-fog-calculator-sentences">0</td></tr>
        <tr><td>Complex-word ratio</td><td id="gunning-fog-calculator-ratio">0%</td></tr>
      </tbody>
    </table>
    <p class="note">Complex = 3+ syllables, excluding capitalized (proper) nouns and words lengthened only by -es/-ed/-ing. Formula: 0.4 × (W/S + 100·complex/W). Approximate for informal text.</p>
  </div>
</div>
