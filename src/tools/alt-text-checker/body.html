<div class="tool-card">
  <div class="field">
    <label for="alt-text-checker-input">HTML to audit</label>
    <textarea class="textarea" id="alt-text-checker-input" rows="6" placeholder='Paste HTML containing <img> tags...'></textarea>
  </div>
  <div class="error" id="alt-text-checker-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="alt-text-checker-total">0</div><div class="l">Images found</div></div>
    <div class="stat-card"><div class="v" id="alt-text-checker-ok">0</div><div class="l">Good alt text</div></div>
    <div class="stat-card"><div class="v" id="alt-text-checker-bad">0</div><div class="l">Issues</div></div>
  </div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>#</th><th>Image (src)</th><th>Alt text</th><th>Status</th></tr></thead>
      <tbody id="alt-text-checker-body"><tr><td colspan="4" class="muted">Paste HTML above to audit its images.</td></tr></tbody>
    </table>
  </div>
</div>
