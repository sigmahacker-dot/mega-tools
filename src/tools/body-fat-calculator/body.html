<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="bf-sex">Sex</label>
      <select class="select" id="bf-sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="bf-height">Height (cm)</label>
      <input type="number" class="input" id="bf-height" min="100" max="250" step="any" placeholder="175">
    </div>
    <div class="field">
      <label for="bf-neck">Neck (cm)</label>
      <input type="number" class="input" id="bf-neck" min="20" max="80" step="any" placeholder="38">
    </div>
    <div class="field">
      <label for="bf-waist">Waist at navel (cm)</label>
      <input type="number" class="input" id="bf-waist" min="40" max="250" step="any" placeholder="85">
    </div>
  </div>
  <div class="field" id="bf-hip-wrap" style="display:none">
    <label for="bf-hip">Hip at widest (cm)</label>
    <input type="number" class="input" id="bf-hip" min="40" max="250" step="any" placeholder="95">
  </div>
  <div class="error" id="body-fat-calculator-error"></div>
  <div class="result" id="bf-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="bf-pct">–</div><div class="l">Body fat %</div></div>
      <div class="stat-card"><div class="v" id="bf-category">–</div><div class="l">Category</div></div>
    </div>
    <p class="note">Estimate only — tape measurements vary with placement and time of day. Measure consistently for trends.</p>
  </div>
</div>
