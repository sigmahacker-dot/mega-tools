<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="hiking-grade-calculator-gain">Elevation gain</label>
      <input type="number" class="input" id="hiking-grade-calculator-gain" min="0" step="any" placeholder="800">
    </div>
    <div class="field">
      <label for="hiking-grade-calculator-gainunit">Gain unit</label>
      <select class="select" id="hiking-grade-calculator-gainunit">
        <option value="m">meters</option>
        <option value="ft">feet</option>
      </select>
    </div>
    <div class="field">
      <label for="hiking-grade-calculator-dist">Trail distance</label>
      <input type="number" class="input" id="hiking-grade-calculator-dist" min="0" step="any" placeholder="12">
    </div>
    <div class="field">
      <label for="hiking-grade-calculator-distunit">Distance unit</label>
      <select class="select" id="hiking-grade-calculator-distunit">
        <option value="km">kilometers</option>
        <option value="mi">miles</option>
      </select>
    </div>
  </div>
  <div class="error" id="hiking-grade-calculator-error"></div>
  <div class="result" id="hiking-grade-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hiking-grade-calculator-grade">&ndash;</div><div class="l">Average grade</div></div>
      <div class="stat-card"><div class="v" id="hiking-grade-calculator-rating">&ndash;</div><div class="l">Difficulty</div></div>
      <div class="stat-card"><div class="v" id="hiking-grade-calculator-time">&ndash;</div><div class="l">Naismith estimate</div></div>
    </div>
    <p class="note">For information only &mdash; not medical advice. Terrain and fitness change real times.</p>
  </div>
</div>
