<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="frequency-converter-value">Frequency</label>
      <input type="number" step="any" class="input" id="frequency-converter-value" placeholder="e.g. 440">
    </div>
    <div class="field">
      <label for="frequency-converter-from">From unit</label>
      <select class="select" id="frequency-converter-from">
        <option value="Hz" selected>Hertz (Hz)</option>
        <option value="kHz">Kilohertz (kHz)</option>
        <option value="MHz">Megahertz (MHz)</option>
        <option value="GHz">Gigahertz (GHz)</option>
        <option value="THz">Terahertz (THz)</option>
      </select>
    </div>
  </div>
  <div class="error" id="frequency-converter-error"></div>
  <div class="result" id="frequency-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="frequency-converter-period">–</div><div class="l">Period (T = 1/f)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="frequency-converter-table"></tbody>
    </table>
    <p class="note">Period units: s = seconds, ms = milliseconds, µs = microseconds, ns = nanoseconds.</p>
  </div>
</div>
