<div class="tool-card">
  <div id="poll-setup">
    <div class="field"><label for="poll-q">Question</label><input type="text" class="input" id="poll-q" placeholder="Where should we go for lunch?"></div>
    <div class="field"><label>Options</label><div id="poll-opts"></div>
      <div class="btn-row"><button class="btn btn-outline btn-sm" id="poll-add" type="button">+ Add option</button></div>
    </div>
    <div class="error" id="poll-maker-lite-error"></div>
    <div class="btn-row"><button class="btn btn-primary" id="poll-create" type="button">Create poll</button></div>
  </div>
  <div id="poll-live" style="display:none">
    <h3 id="poll-title" style="margin-top:0"></h3>
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="poll-total">0</div><div class="l">Total votes</div></div>
    </div>
    <div id="poll-results"></div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="poll-reset" type="button">Reset votes</button>
      <button class="btn btn-outline btn-sm" id="poll-new" type="button">New poll</button>
    </div>
    <p class="note">Click an option to cast a vote. Votes are stored on this device.</p>
  </div>
</div>
