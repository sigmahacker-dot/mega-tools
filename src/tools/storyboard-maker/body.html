<div class="tool-card">
  <div class="field">
    <label for="storyboard-maker-title">Project title</label>
    <input type="text" id="storyboard-maker-title" class="input" value="My Short Film" maxlength="50">
  </div>
  <div id="storyboard-maker-frames"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="storyboard-maker-download">Download storyboard</button>
  </div>
  <div class="result">
    <canvas id="storyboard-maker-canvas" style="width:100%;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="storyboard-maker-error"></div>
  <p class="note">Your images never leave your browser — the board is rendered locally.</p>
</div>
