<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="wire-gauge-converter-mode">Direction</label>
      <select class="select" id="wire-gauge-converter-mode">
        <option value="awg">AWG → diameter &amp; specs</option>
        <option value="dia">Diameter (mm) → AWG</option>
      </select>
    </div>
    <div class="field">
      <label for="wire-gauge-converter-val" id="wire-gauge-converter-lab">AWG number (0–40)</label>
      <input type="number" class="input" id="wire-gauge-converter-val" step="any" placeholder="e.g. 12">
    </div>
  </div>
  <div class="error" id="wire-gauge-converter-error"></div>
  <div class="result" id="wire-gauge-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="wire-gauge-converter-dmm">–</div><div class="l">Diameter (mm)</div></div>
      <div class="stat-card"><div class="v" id="wire-gauge-converter-area">–</div><div class="l">Cross-section (mm²)</div></div>
      <div class="stat-card"><div class="v" id="wire-gauge-converter-res">–</div><div class="l">Cu resistance (Ω/km)</div></div>
    </div>
    <p class="note" id="wire-gauge-converter-steps">Enter an AWG number to see its specs.</p>
  </div>
</div>
