<div class="tool-card">
  <div class="field">
    <label for="letter-spacing-tuner-text">Sample text</label>
    <input type="text" class="input" id="letter-spacing-tuner-text" value="DESIGN WITH SPACE" maxlength="60">
  </div>
  <div class="grid2">
    <div class="field"><label for="letter-spacing-tuner-ls">Letter spacing: <span id="letter-spacing-tuner-ls-v">2</span>px (<span id="letter-spacing-tuner-ls-em">0.05</span>em)</label><input type="range" id="letter-spacing-tuner-ls" min="-10" max="40" step="0.5" value="2"></div>
    <div class="field"><label for="letter-spacing-tuner-fs">Font size: <span id="letter-spacing-tuner-fs-v">40</span>px</label><input type="range" id="letter-spacing-tuner-fs" min="12" max="120" value="40"></div>
  </div>
  <div class="checkbox-row"><input type="checkbox" id="letter-spacing-tuner-upper" checked> <label for="letter-spacing-tuner-upper">Uppercase preview</label></div>
  <div class="error" id="letter-spacing-tuner-error"></div>
  <div class="result mt">
    <div id="letter-spacing-tuner-preview" style="border:1px solid var(--line);border-radius:12px;padding:32px 16px;text-align:center;font-weight:700;">DESIGN WITH SPACE</div>
    <div class="field mt">
      <label for="letter-spacing-tuner-css">CSS</label>
      <input type="text" class="input" id="letter-spacing-tuner-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="letter-spacing-tuner-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
