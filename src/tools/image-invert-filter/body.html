<div class="tool-card">
  <div class="dropzone" id="image-invert-filter-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop an image here</strong> or click to browse
    <input type="file" id="image-invert-filter-file" accept="image/*" class="hidden">
  </div>
  <div class="preview hidden" id="image-invert-filter-wrap" style="text-align:center">
    <canvas id="image-invert-filter-canvas" style="max-width:100%;height:auto;border-radius:8px"></canvas>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-invert-filter-download">Download PNG</button>
  </div>
  <div class="error" id="image-invert-filter-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
