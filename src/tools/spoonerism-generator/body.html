<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="spoonerism-generator-w1">First word</label>
      <input class="input" id="spoonerism-generator-w1" type="text" placeholder="light">
    </div>
    <div class="field">
      <label for="spoonerism-generator-w2">Second word</label>
      <input class="input" id="spoonerism-generator-w2" type="text" placeholder="fire">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="spoonerism-generator-go" type="button">Make Spoonerism</button>
    <button class="btn btn-outline" id="spoonerism-generator-random" type="button">Random Pair</button>
  </div>
  <div class="error" id="spoonerism-generator-error"></div>
  <div class="result" id="spoonerism-generator-output" style="margin-top:12px;font-size:1.3rem;text-align:center">Your spoonerism will appear here.</div>
  <p class="note">Classic example: “blushing crow” → “crushing blow”.</p>
</div>
