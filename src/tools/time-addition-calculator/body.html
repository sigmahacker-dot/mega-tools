<div class="tool-card">
  <div class="field">
    <label for="time-addition-calculator-input">Durations, one per line</label>
    <textarea class="textarea" id="time-addition-calculator-input" rows="6" placeholder="1:30&#10;2h&#10;45m&#10;-0:15"></textarea>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="time-addition-calculator-go">Calculate</button>
  </div>
  <div class="error" id="time-addition-calculator-error"></div>
  <div class="result" id="time-addition-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="time-addition-calculator-hmm">&ndash;</div><div class="l">Total (h:mm)</div></div>
      <div class="stat-card"><div class="v" id="time-addition-calculator-dec">&ndash;</div><div class="l">Decimal hours</div></div>
      <div class="stat-card"><div class="v" id="time-addition-calculator-min">&ndash;</div><div class="l">Total minutes</div></div>
    </div>
    <p class="note">Accepted: H:MM, 2h, 45m, 30s, bare number = minutes, leading − subtracts.</p>
  </div>
</div>
