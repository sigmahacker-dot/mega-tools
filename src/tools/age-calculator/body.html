<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="age-dob">Date of birth</label>
      <input type="date" class="input" id="age-dob" max="2026-12-31">
    </div>
    <div class="field">
      <label for="age-asof">Calculate age as of</label>
      <input type="date" class="input" id="age-asof">
    </div>
  </div>
  <div class="error" id="age-calculator-error"></div>
  <div class="result" id="age-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="age-years">–</div><div class="l">Years</div></div>
      <div class="stat-card"><div class="v" id="age-months">–</div><div class="l">Months</div></div>
      <div class="stat-card"><div class="v" id="age-days">–</div><div class="l">Days</div></div>
    </div>
    <table class="data">
      <tbody>
        <tr><th scope="row">Total months</th><td id="age-total-months">–</td></tr>
        <tr><th scope="row">Total weeks</th><td id="age-total-weeks">–</td></tr>
        <tr><th scope="row">Total days</th><td id="age-total-days">–</td></tr>
        <tr><th scope="row">Total hours</th><td id="age-total-hours">–</td></tr>
        <tr><th scope="row">Born on</th><td id="age-weekday">–</td></tr>
        <tr><th scope="row">Next birthday</th><td id="age-next">–</td></tr>
      </tbody>
    </table>
    <p class="note">Age is computed against the calendar, including leap years.</p>
  </div>
</div>
