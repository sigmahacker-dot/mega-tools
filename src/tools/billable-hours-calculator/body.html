<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="billable-hours-calculator-hours">Billable hours</label>
      <input class="input" id="billable-hours-calculator-hours" type="number" min="0" step="any" value="32">
    </div>
    <div class="field">
      <label for="billable-hours-calculator-rate">Hourly rate ($)</label>
      <input class="input" id="billable-hours-calculator-rate" type="number" min="0" step="any" value="50">
    </div>
    <div class="field">
      <label for="billable-hours-calculator-nonbill">Non-billable hours</label>
      <input class="input" id="billable-hours-calculator-nonbill" type="number" min="0" step="any" value="8">
    </div>
    <div class="field">
      <label for="billable-hours-calculator-exp">Expenses ($)</label>
      <input class="input" id="billable-hours-calculator-exp" type="number" min="0" step="any" value="0">
    </div>
    <div class="field">
      <label for="billable-hours-calculator-disc">Discount ($)</label>
      <input class="input" id="billable-hours-calculator-disc" type="number" min="0" step="any" value="0">
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="billable-hours-calculator-calc">Calculate</button>
    </div>
  </div>
  <div class="error" id="billable-hours-calculator-error"></div>
  <div id="billable-hours-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="billable-hours-calculator-sub">–</div><div class="l">Billable amount</div></div>
      <div class="stat-card"><div class="v" id="billable-hours-calculator-util">–</div><div class="l">Utilization</div></div>
      <div class="stat-card"><div class="v" id="billable-hours-calculator-total">–</div><div class="l">Invoice total</div></div>
    </div>
    <div class="result">
      <h3>Breakdown</h3>
      <div id="billable-hours-calculator-steps"></div>
    </div>
  </div>
  <p class="note">For information only — not financial advice. Taxes are not included.</p>
</div>
