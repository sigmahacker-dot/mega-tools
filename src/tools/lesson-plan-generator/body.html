<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="lesson-plan-generator-subject">Subject</label>
      <input class="input" type="text" id="lesson-plan-generator-subject" placeholder="e.g. Science">
    </div>
    <div class="field">
      <label for="lesson-plan-generator-grade">Grade level</label>
      <input class="input" type="text" id="lesson-plan-generator-grade" placeholder="e.g. Grade 5">
    </div>
    <div class="field">
      <label for="lesson-plan-generator-dur">Duration (minutes)</label>
      <input class="input" type="number" id="lesson-plan-generator-dur" min="1" value="45">
    </div>
  </div>
  <div class="field">
    <label for="lesson-plan-generator-topic">Lesson topic</label>
    <input class="input" type="text" id="lesson-plan-generator-topic" placeholder="e.g. The Water Cycle">
  </div>
  <div class="field">
    <label for="lesson-plan-generator-obj">Learning objectives (one per line)</label>
    <textarea class="textarea" id="lesson-plan-generator-obj" rows="3" placeholder="Students will be able to…"></textarea>
  </div>
  <div class="field">
    <label for="lesson-plan-generator-mat">Materials (one per line)</label>
    <textarea class="textarea" id="lesson-plan-generator-mat" rows="3" placeholder="Whiteboard, markers…"></textarea>
  </div>
  <div class="field">
    <label for="lesson-plan-generator-act">Activities — one per line as "activity | minutes"</label>
    <textarea class="textarea" id="lesson-plan-generator-act" rows="4" placeholder="Warm-up quiz | 5&#10;Group discussion | 15&#10;Worksheet practice | 20&#10;Wrap-up | 5"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="lesson-plan-generator-gen">Generate Plan</button>
    <button class="btn btn-outline" id="lesson-plan-generator-copy">Copy Plan</button>
    <button class="btn btn-outline" id="lesson-plan-generator-dl">Download .txt</button>
  </div>
  <div class="error" id="lesson-plan-generator-error"></div>
</div>

<div class="tool-card">
  <h3>Lesson plan</h3>
  <pre id="lesson-plan-generator-out" style="white-space:pre-wrap;font-family:inherit"></pre>
</div>
