<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="project-deadline-tracker-name">Project name</label>
      <input class="input" type="text" id="project-deadline-tracker-name" placeholder="e.g. Website relaunch" maxlength="80">
    </div>
    <div class="field">
      <label for="project-deadline-tracker-deadline">Deadline</label>
      <input class="input" type="date" id="project-deadline-tracker-deadline">
    </div>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="project-deadline-tracker-daysleft">—</div><div class="l">Days left</div></div>
    <div class="stat-card"><div class="v" id="project-deadline-tracker-progress">—</div><div class="l">Progress</div></div>
    <div class="stat-card"><div class="v" id="project-deadline-tracker-done">—</div><div class="l">Milestones done</div></div>
  </div>
  <div style="background:#e0e0e0;border-radius:6px;height:12px;overflow:hidden;margin-bottom:12px">
    <div id="project-deadline-tracker-bar" style="height:100%;width:0%;background:#2e7d32;border-radius:6px;transition:width .3s"></div>
  </div>
  <h3 style="margin:8px 0">Milestones</h3>
  <div class="grid2" style="margin-bottom:8px">
    <div class="field">
      <label for="project-deadline-tracker-mname">Milestone name</label>
      <input class="input" type="text" id="project-deadline-tracker-mname" placeholder="e.g. Design approved" maxlength="80">
    </div>
    <div class="field">
      <label for="project-deadline-tracker-mdate">Target date</label>
      <input class="input" type="date" id="project-deadline-tracker-mdate">
    </div>
  </div>
  <div class="btn-row" style="margin-bottom:12px">
    <button class="btn" id="project-deadline-tracker-addm">Add milestone</button>
  </div>
  <div id="project-deadline-tracker-list"></div>
  <div class="error" id="project-deadline-tracker-error"></div>
  <p class="hint">Everything saves automatically in this browser.</p>
</div>
