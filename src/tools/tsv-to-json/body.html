<div class="tool-card">
  <div class="field">
    <label for="tsv-to-json-input">TSV</label>
    <textarea class="textarea" id="tsv-to-json-input" rows="7" style="font-family:monospace">name	role	start
Ada Lovelace	Engineer	2024-01-15
Grace Hopper	CTO	2023-06-01</textarea>
  </div>
  <div class="grid2">
    <div class="field checkline">
      <input type="checkbox" id="tsv-to-json-header" checked>
      <label for="tsv-to-json-header">First row is header</label>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="tsv-to-json-pretty" checked>
      <label for="tsv-to-json-pretty">Pretty-print JSON</label>
    </div>
  </div>
  <div class="error" id="tsv-to-json-error"></div>
  <div class="field">
    <label for="tsv-to-json-output">JSON</label>
    <textarea class="textarea" id="tsv-to-json-output" rows="10" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="tsv-to-json-copy">Copy JSON</button>
    <button class="btn btn-outline" id="tsv-to-json-download">Download data.json</button>
  </div>
</div>
