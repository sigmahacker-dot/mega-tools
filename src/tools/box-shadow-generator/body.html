<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="box-shadow-generator-x">X offset: <span id="box-shadow-generator-x-val">10</span>px</label>
      <input type="range" id="box-shadow-generator-x" min="-100" max="100" value="10">
    </div>
    <div class="field">
      <label for="box-shadow-generator-y">Y offset: <span id="box-shadow-generator-y-val">10</span>px</label>
      <input type="range" id="box-shadow-generator-y" min="-100" max="100" value="10">
    </div>
    <div class="field">
      <label for="box-shadow-generator-blur">Blur: <span id="box-shadow-generator-blur-val">20</span>px</label>
      <input type="range" id="box-shadow-generator-blur" min="0" max="150" value="20">
    </div>
    <div class="field">
      <label for="box-shadow-generator-spread">Spread: <span id="box-shadow-generator-spread-val">0</span>px</label>
      <input type="range" id="box-shadow-generator-spread" min="-50" max="50" value="0">
    </div>
    <div class="field">
      <label for="box-shadow-generator-color">Shadow color</label>
      <input type="color" class="input" id="box-shadow-generator-color" value="#000000" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label>Options</label>
      <label style="display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" id="box-shadow-generator-inset"> Inset (inner shadow)
      </label>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div style="background:#f3f4f6;border-radius:12px;padding:48px;display:flex;align-items:center;justify-content:center;">
      <div id="box-shadow-generator-preview" style="width:140px;height:140px;background:#ffffff;border-radius:12px;"></div>
    </div>
  </div>
  <div class="error" id="box-shadow-generator-error"></div>
  <div class="result" id="box-shadow-generator-result">
    <div class="field">
      <label for="box-shadow-generator-css">CSS</label>
      <pre id="box-shadow-generator-css" style="background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;"></pre>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="box-shadow-generator-copy">Copy CSS</button>
    </div>
  </div>
</div>
