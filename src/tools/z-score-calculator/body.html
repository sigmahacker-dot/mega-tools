<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="z-score-calculator-x">Value (x)</label><input class="input" id="z-score-calculator-x" type="number" value="130" step="any"></div>
    <div class="field"><label for="z-score-calculator-mu">Mean (\u03BC)</label><input class="input" id="z-score-calculator-mu" type="number" value="100" step="any"></div>
    <div class="field"><label for="z-score-calculator-sigma">Std dev (\u03C3)</label><input class="input" id="z-score-calculator-sigma" type="number" value="15" min="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="z-score-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="z-score-calculator-z">2</div><div class="l">Z-score</div></div>
    <div class="stat-card"><div class="v" id="z-score-calculator-pct">97.72%</div><div class="l">Percentile</div></div>
  </div>
  <div class="result"><pre class="code" id="z-score-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="z-score-calculator-error"></div>
</div>
