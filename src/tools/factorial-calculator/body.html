<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="factorial-calculator-n">n (0 – 170)</label>
      <input type="number" class="input" id="factorial-calculator-n" min="0" max="170" step="1" placeholder="e.g. 10">
    </div>
  </div>
  <div class="error" id="factorial-calculator-error"></div>
  <div class="result" id="factorial-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="factorial-calculator-value">–</div><div class="l">n!</div></div>
      <div class="stat-card"><div class="v" id="factorial-calculator-sci">–</div><div class="l">Scientific notation</div></div>
      <div class="stat-card"><div class="v" id="factorial-calculator-zeros">–</div><div class="l">Trailing zeros</div></div>
    </div>
    <p class="note" id="factorial-calculator-steps">Enter n to compute its factorial.</p>
  </div>
</div>
