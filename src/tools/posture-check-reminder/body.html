<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 12px;text-align:left">
    <div class="field">
      <label for="posture-check-reminder-mins">Reminder every (minutes)</label>
      <input class="input" id="posture-check-reminder-mins" type="number" min="1" max="240" step="1" value="30">
    </div>
    <div class="field" style="align-self:end">
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn btn-primary" id="posture-check-reminder-start">Start</button>
        <button class="btn btn-outline" id="posture-check-reminder-stop">Stop</button>
      </div>
    </div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="posture-check-reminder-notify">Enable browser notifications</button>
  </div>
  <p class="muted" id="posture-check-reminder-status">Reminders are off.</p>
  <div class="result hidden" id="posture-check-reminder-banner" style="border-left:5px solid #2e7d32"></div>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance. Reminders run while this tab is open.</p>
  <div class="error" id="posture-check-reminder-error"></div>
</div>
