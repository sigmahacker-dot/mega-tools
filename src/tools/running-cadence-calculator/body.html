<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <label for="running-cadence-calculator-steps">Steps counted in 30 seconds</label>
    <input class="input" id="running-cadence-calculator-steps" type="number" min="1" max="200" step="1" placeholder="e.g. 85">
  </div>
  <div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="running-cadence-calculator-calc">Calculate</button></div>
  <div class="stat-cards hidden" id="running-cadence-calculator-out" style="max-width:520px;margin:12px auto 0">
    <div class="stat-card"><div class="v" id="running-cadence-calculator-spm">–</div><div class="l">Steps per minute</div></div>
    <div class="stat-card"><div class="v" id="running-cadence-calculator-rating" style="font-size:1em">–</div><div class="l">Rating</div></div>
  </div>
  <p class="hint" id="running-cadence-calculator-tip" style="margin-top:12px"></p>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance.</p>
  <div class="error" id="running-cadence-calculator-error"></div>
</div>
