<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="random-name-generator-gender">Gender</label>
      <select class="select" id="random-name-generator-gender">
        <option value="any">Any</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="random-name-generator-origin">Origin</label>
      <select class="select" id="random-name-generator-origin">
        <option value="international">International</option>
        <option value="pakistani">Pakistani</option>
        <option value="arabic">Arabic</option>
        <option value="western">Western</option>
        <option value="indian">Indian</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="random-name-generator-count">How many names</label>
    <select class="select" id="random-name-generator-count">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
      <option value="50">50</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="random-name-generator-generate">Generate Names</button>
  </div>
  <div class="error" id="random-name-generator-error"></div>
  <div id="random-name-generator-list" class="file-list mt"></div>
  <p class="note">Click any name to copy it to your clipboard. These are fictional, randomly combined names.</p>
</div>
