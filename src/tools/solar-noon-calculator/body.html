<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="solar-noon-calculator-date">Date</label>
      <input class="input" type="date" id="solar-noon-calculator-date">
    </div>
    <div class="field">
      <label for="solar-noon-calculator-lon">Longitude (−180 to 180)</label>
      <input class="input" type="number" id="solar-noon-calculator-lon" step="0.0001" min="-180" max="180" placeholder="e.g. 73.0479">
    </div>
  </div>
  <div class="field" style="max-width:260px">
    <label for="solar-noon-calculator-tz">Timezone UTC offset</label>
    <input class="input" type="number" id="solar-noon-calculator-tz" step="0.25" min="-12" max="14" placeholder="e.g. 5">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="solar-noon-calculator-calc">Calculate</button>
  </div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="solar-noon-calculator-noon" style="font-size:26px">—</div><div class="l">Solar noon (local)</div></div>
    <div class="stat-card"><div class="v" id="solar-noon-calculator-eot">—</div><div class="l">Equation of time</div></div>
  </div>
  <div class="result" id="solar-noon-calculator-out"></div>
  <div class="error" id="solar-noon-calculator-error"></div>
</div>
