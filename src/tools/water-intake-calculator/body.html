<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="water-weight">Body weight (kg)</label>
      <input type="number" class="input" id="water-weight" min="25" max="400" step="any" placeholder="75">
    </div>
    <div class="field">
      <label for="water-activity">Activity level</label>
      <select class="select" id="water-activity">
        <option value="sedentary">Sedentary</option>
        <option value="light">Light activity</option>
        <option value="moderate">Moderate activity</option>
        <option value="intense">Intense activity</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label><input type="checkbox" id="water-hot"> Hot climate (adds ~500 ml)</label>
  </div>
  <div class="error" id="water-intake-calculator-error"></div>
  <div class="result" id="water-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="water-liters">–</div><div class="l">Liters per day</div></div>
      <div class="stat-card"><div class="v" id="water-glasses">–</div><div class="l">Glasses (250 ml)</div></div>
      <div class="stat-card"><div class="v" id="water-oz">–</div><div class="l">Fluid ounces</div></div>
    </div>
    <p class="note">Guideline only — food provides water too. On very hot or hard-training days, drink to thirst.</p>
  </div>
</div>
