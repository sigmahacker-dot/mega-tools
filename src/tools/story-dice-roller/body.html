<div class="tool-card" style="text-align:center">
  <div id="story-dice-roller-board" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto"></div>
  <p class="muted" id="story-dice-roller-prompt" style="min-height:48px;margin:16px auto;max-width:480px"></p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="story-dice-roller-roll">🎲 Roll the dice</button>
    <button class="btn btn-outline" id="story-dice-roller-copy" disabled>Copy prompt</button>
  </div>
  <p class="note">Tap any die to re-roll just that one. Use every symbol in your story!</p>
  <div class="error" id="story-dice-roller-error"></div>
</div>
