<div class="tool-card">
  <h2>Text Reverser</h2>
  <p class="muted">Reverse text by characters, words or lines.</p>
  <div class="field">
    <label for="text-reverser-input">Your text</label>
    <textarea class="textarea" id="text-reverser-input" rows="6" placeholder="Paste your text here..."></textarea>
  </div>
  <div class="field">
    <label for="text-reverser-mode">Reverse mode</label>
    <select class="select" id="text-reverser-mode">
      <option value="chars">Characters (whole text backwards)</option>
      <option value="words">Words (word order reversed)</option>
      <option value="lines">Lines (line order reversed)</option>
      <option value="eachline">Each line (characters reversed per line)</option>
    </select>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="text-reverser-run">Reverse text</button>
    <button class="btn btn-outline" id="text-reverser-clear">Clear</button>
  </div>
  <div class="error" id="text-reverser-error"></div>
  <div class="result" id="text-reverser-result">
    <div class="field">
      <label for="text-reverser-output">Result</label>
      <textarea class="textarea" id="text-reverser-output" rows="6" readonly placeholder="Reversed text will appear here..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="text-reverser-copy">Copy result</button>
      <button class="btn btn-outline" id="text-reverser-download">Download .txt</button>
    </div>
  </div>
</div>
