<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="email-subject-line-generator-topic">Email topic</label>
      <input class="input" id="email-subject-line-generator-topic" type="text" placeholder="e.g. spring sale, new course launch" maxlength="80">
    </div>
    <div class="field">
      <label for="email-subject-line-generator-tone">Tone</label>
      <select class="select" id="email-subject-line-generator-tone">
        <option value="curious">Curious</option>
        <option value="urgent">Urgent</option>
        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
        <option value="funny">Funny</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="email-subject-line-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="email-subject-line-generator-error"></div>
  <div class="mt" id="email-subject-line-generator-list"></div>
</div>
