<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="vcard-first">First name</label><input type="text" class="input" id="vcard-first" placeholder="Ada"></div>
    <div class="field"><label for="vcard-last">Last name</label><input type="text" class="input" id="vcard-last" placeholder="Lovelace"></div>
    <div class="field"><label for="vcard-org">Company</label><input type="text" class="input" id="vcard-org" placeholder="Analytical Engines Ltd"></div>
    <div class="field"><label for="vcard-title">Job title</label><input type="text" class="input" id="vcard-title" placeholder="Mathematician"></div>
    <div class="field"><label for="vcard-phone">Work phone</label><input type="tel" class="input" id="vcard-phone" placeholder="+1 555 010 2030"></div>
    <div class="field"><label for="vcard-mobile">Mobile</label><input type="tel" class="input" id="vcard-mobile" placeholder="+1 555 010 7788"></div>
    <div class="field"><label for="vcard-email">Email</label><input type="email" class="input" id="vcard-email" placeholder="ada@example.com"></div>
    <div class="field"><label for="vcard-web">Website</label><input type="url" class="input" id="vcard-web" placeholder="https://example.com"></div>
    <div class="field"><label for="vcard-addr">Address</label><input type="text" class="input" id="vcard-addr" placeholder="12 Algorithm Ave, London"></div>
    <div class="field"><label for="vcard-note">Note</label><input type="text" class="input" id="vcard-note" placeholder="Met at the conference"></div>
  </div>
  <div class="error" id="vcard-generator-error"></div>
  <div class="result" id="vcard-result">
    <div class="field"><label for="vcard-out">vCard 3.0 output</label><textarea class="textarea" id="vcard-out" rows="12" readonly></textarea></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="vcard-dl" type="button">Download .vcf</button>
      <button class="btn btn-outline" id="vcard-copy" type="button">Copy text</button>
    </div>
  </div>
</div>
