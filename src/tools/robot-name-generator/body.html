<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="robot-name-generator-style">Style</label>
      <select class="select" id="robot-name-generator-style">
        <option value="model">Model number</option>
        <option value="designation">Unit designation</option>
        <option value="name">Friendly name</option>
      </select>
    </div>
    <div class="field">
      <label for="robot-name-generator-count">How many</label>
      <select class="select" id="robot-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="robot-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="robot-name-generator-error"></div>
  <div class="mt" id="robot-name-generator-list"></div>
</div>
