<div class="tool-card" style="text-align:center">
  <div style="font-size:72px;font-weight:800" id="metronome-tool-bpm-v">120</div>
  <div class="muted">BPM</div>
  <div class="field" style="max-width:420px;margin:12px auto;text-align:left">
    <label for="metronome-tool-bpm">Tempo (30–240 BPM)</label>
    <input type="range" class="input" id="metronome-tool-bpm" min="30" max="240" step="1" value="120">
  </div>
  <div class="grid2" style="max-width:420px;margin:0 auto;text-align:left">
    <div class="field">
      <label for="metronome-tool-beats">Beats per bar</label>
      <select class="input" id="metronome-tool-beats">
        <option value="2">2</option><option value="3">3</option>
        <option value="4" selected>4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option>
      </select>
    </div>
    <div class="field">
      <label for="metronome-tool-sub">Subdivision</label>
      <select class="input" id="metronome-tool-sub">
        <option value="1">Quarter notes</option>
        <option value="2">8th notes</option>
        <option value="3">Triplets</option>
        <option value="4">16th notes</option>
      </select>
    </div>
  </div>
  <div id="metronome-tool-dots" style="display:flex;gap:10px;justify-content:center;margin:18px 0"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="metronome-tool-toggle">▶ Start</button>
    <button class="btn btn-outline" id="metronome-tool-tap">Tap tempo</button>
  </div>
  <p class="muted" id="metronome-tool-tapinfo" style="min-height:24px"></p>
  <div class="error" id="metronome-tool-error"></div>
</div>
