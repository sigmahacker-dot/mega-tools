<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="area-converter-value">Value</label>
      <input type="number" step="any" class="input" id="area-converter-value" placeholder="e.g. 1">
    </div>
    <div class="field">
      <label for="area-converter-from">From</label>
      <select class="select" id="area-converter-from">
        <option value="mm2">Square millimeters (mm²)</option>
        <option value="cm2">Square centimeters (cm²)</option>
        <option value="m2" selected>Square meters (m²)</option>
        <option value="ha">Hectares (ha)</option>
        <option value="km2">Square kilometers (km²)</option>
        <option value="in2">Square inches (in²)</option>
        <option value="ft2">Square feet (ft²)</option>
        <option value="yd2">Square yards (yd²)</option>
        <option value="acre">Acres (ac)</option>
        <option value="mi2">Square miles (mi²)</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="area-converter-to">To</label>
      <select class="select" id="area-converter-to">
        <option value="mm2">Square millimeters (mm²)</option>
        <option value="cm2">Square centimeters (cm²)</option>
        <option value="m2">Square meters (m²)</option>
        <option value="ha">Hectares (ha)</option>
        <option value="km2">Square kilometers (km²)</option>
        <option value="in2">Square inches (in²)</option>
        <option value="ft2" selected>Square feet (ft²)</option>
        <option value="yd2">Square yards (yd²)</option>
        <option value="acre">Acres (ac)</option>
        <option value="mi2">Square miles (mi²)</option>
      </select>
    </div>
    <div class="field">
      <label aria-hidden="true">&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-outline" id="area-converter-swap" type="button">⇄ Swap units</button>
      </div>
    </div>
  </div>
  <div class="error" id="area-converter-error"></div>
  <div class="result" id="area-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="area-converter-result-value">–</div><div class="l">Result</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Unit</th><th>Value</th></tr></thead>
      <tbody id="area-converter-table"></tbody>
    </table>
  </div>
</div>
