<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="ef-expenses">Monthly expenses ($)</label><input type="number" class="input" id="ef-expenses" min="0" step="any" placeholder="3000"></div>
    <div class="field"><label for="ef-saved">Already saved ($)</label><input type="number" class="input" id="ef-saved" min="0" step="any" placeholder="2000"></div>
    <div class="field"><label for="ef-monthly">Monthly contribution ($)</label><input type="number" class="input" id="ef-monthly" min="0" step="any" placeholder="400"></div>
  </div>
  <div class="error" id="emergency-fund-calculator-error"></div>
  <div class="result" id="ef-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ef-target6">–</div><div class="l">6-month target</div></div>
      <div class="stat-card"><div class="v" id="ef-pct">–</div><div class="l">Funded</div></div>
      <div class="stat-card"><div class="v" id="ef-months">–</div><div class="l">Months to 6-month goal</div></div>
    </div>
    <div class="field"><label for="ef-bar">Progress to 6-month goal</label><progress class="input" id="ef-bar" max="100" value="0" style="width:100%"></progress></div>
    <table class="data">
      <thead><tr><th>Goal</th><th>Target</th><th>Still needed</th><th>Months away</th></tr></thead>
      <tbody id="ef-body"><tr><td colspan="4" class="muted">Enter your expenses to plan.</td></tr></tbody>
    </table>
  </div>
</div>
