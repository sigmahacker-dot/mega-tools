<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="nth-root-calculator-x">Number (x)</label>
      <input type="number" class="input" id="nth-root-calculator-x" step="any" placeholder="e.g. 27">
    </div>
    <div class="field">
      <label for="nth-root-calculator-n">Root degree (n)</label>
      <input type="number" class="input" id="nth-root-calculator-n" min="1" max="1000" step="1" placeholder="e.g. 3">
    </div>
  </div>
  <div class="error" id="nth-root-calculator-error"></div>
  <div class="result" id="nth-root-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="nth-root-calculator-res">–</div><div class="l" id="nth-root-calculator-lab">ⁿ√x</div></div>
      <div class="stat-card"><div class="v" id="nth-root-calculator-check">–</div><div class="l">Verification (rⁿ)</div></div>
      <div class="stat-card"><div class="v" id="nth-root-calculator-pow">–</div><div class="l">As x^(1/n)</div></div>
    </div>
    <p class="note" id="nth-root-calculator-steps">Enter x and the root degree n.</p>
  </div>
</div>
