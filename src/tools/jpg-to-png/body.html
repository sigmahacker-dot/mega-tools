<div class="tool-card">
  <div class="dropzone" id="jpg-to-png-drop">
    <span class="dz-icon">🖼️</span>
    <strong>Drop JPG files here</strong> or click to browse
    <input type="file" id="jpg-to-png-file" accept="image/jpeg,.jpg,.jpeg" multiple class="hidden">
  </div>
  <ul class="file-list" id="jpg-to-png-list"></ul>
  <div class="btn-row">
    <button class="btn btn-primary" id="jpg-to-png-go">Convert to PNG</button>
    <button class="btn btn-outline hidden" id="jpg-to-png-zip">Download all as ZIP</button>
  </div>
  <div class="result hidden" id="jpg-to-png-result">
    <table class="data">
      <thead><tr><th>File</th><th>Original</th><th>PNG size</th><th></th></tr></thead>
      <tbody id="jpg-to-png-rows"></tbody>
    </table>
  </div>
  <div class="error" id="jpg-to-png-error"></div>
  <p class="note">PNG files are lossless, so they are usually larger than the original JPG. Files never leave your device — everything is processed in your browser.</p>
</div>
