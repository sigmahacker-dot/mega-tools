<div class="tool-card">
  <div class="field">
    <label for="rail-fence-cipher-tool-input">Input text</label>
    <textarea class="textarea" id="rail-fence-cipher-tool-input" rows="5" placeholder="Type text to encode or decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="rail-fence-cipher-tool-rails">Rails (2–10)</label>
      <input class="input" type="number" id="rail-fence-cipher-tool-rails" min="2" max="10" value="3">
    </div>
    <div class="field">
      <label for="rail-fence-cipher-tool-mode">Mode</label>
      <select class="input" id="rail-fence-cipher-tool-mode">
        <option value="encode">Encode</option>
        <option value="decode">Decode</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="rail-fence-cipher-tool-run">Run</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="rail-fence-cipher-tool-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="rail-fence-cipher-tool-copy">Copy output</button></div>
  </div>
  <div class="error" id="rail-fence-cipher-tool-error"></div>
</div>
