<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="jump-rope-workout-generator-level">Level</label>
      <select class="select" id="jump-rope-workout-generator-level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
    <div class="field">
      <label for="jump-rope-workout-generator-duration">Duration (minutes, 5–60)</label>
      <input type="number" class="input" id="jump-rope-workout-generator-duration" min="5" max="60" step="1" value="20">
    </div>
  </div>
  <div class="btn-row"><button class="btn" id="jump-rope-workout-generator-go" type="button">Generate workout</button></div>
  <div class="error" id="jump-rope-workout-generator-error"></div>
  <div class="result" id="jump-rope-workout-generator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="jump-rope-workout-generator-rounds">&ndash;</div><div class="l">Rounds</div></div>
      <div class="stat-card"><div class="v" id="jump-rope-workout-generator-work">&ndash;</div><div class="l">Work time</div></div>
      <div class="stat-card"><div class="v" id="jump-rope-workout-generator-total">&ndash;</div><div class="l">Total time</div></div>
    </div>
    <div id="jump-rope-workout-generator-out"></div>
    <p class="note">Warm up before intense exercise and stop if you feel pain or dizziness. For information only &mdash; not medical advice.</p>
  </div>
</div>
