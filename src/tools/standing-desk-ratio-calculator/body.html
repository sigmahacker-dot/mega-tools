<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="standing-desk-ratio-calculator-hours">Work hours per day</label>
      <input class="input" id="standing-desk-ratio-calculator-hours" type="number" min="1" max="16" step="0.5" value="8">
    </div>
    <div class="field">
      <label for="standing-desk-ratio-calculator-ratio">Sit : stand ratio</label>
      <select class="input" id="standing-desk-ratio-calculator-ratio">
        <option value="3:1">3:1 — gentle start (45 sit / 15 stand)</option>
        <option value="2:1" selected>2:1 — balanced (40 sit / 20 stand)</option>
        <option value="1:1">1:1 — active (30 sit / 30 stand)</option>
        <option value="1:2">1:2 — mostly standing (20 sit / 40 stand)</option>
      </select>
    </div>
    <div class="field">
      <label for="standing-desk-ratio-calculator-start">Day starts at</label>
      <input class="input" id="standing-desk-ratio-calculator-start" type="time" value="09:00">
    </div>
    <div class="field" style="align-self:end">
      <button class="btn btn-primary" id="standing-desk-ratio-calculator-build">Build schedule</button>
    </div>
  </div>
  <div class="stat-cards hidden" id="standing-desk-ratio-calculator-out">
    <div class="stat-card"><div class="v" id="standing-desk-ratio-calculator-sit">–</div><div class="l">Sitting time</div></div>
    <div class="stat-card"><div class="v" id="standing-desk-ratio-calculator-stand">–</div><div class="l">Standing time</div></div>
  </div>
  <div class="result hidden" id="standing-desk-ratio-calculator-table"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Ease into standing gradually if you are new to it.</p>
  <div class="error" id="standing-desk-ratio-calculator-error"></div>
</div>
