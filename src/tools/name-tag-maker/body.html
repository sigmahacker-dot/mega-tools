<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="name-tag-maker-name">Name</label>
      <input type="text" id="name-tag-maker-name" class="input" value="Alex Morgan" maxlength="30">
    </div>
    <div class="field">
      <label for="name-tag-maker-sub">Subtitle (optional)</label>
      <input type="text" id="name-tag-maker-sub" class="input" value="Speaker" maxlength="40">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="name-tag-maker-count">Tags per sheet</label>
      <select class="select" id="name-tag-maker-count">
        <option value="4">4 — large</option>
        <option value="6" selected>6 — medium</option>
        <option value="8">8 — compact</option>
      </select>
    </div>
    <div class="field">
      <label for="name-tag-maker-color">Accent color</label>
      <input type="color" id="name-tag-maker-color" class="input" value="#d92b2b" style="height:42px;padding:4px;">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="name-tag-maker-download">Download sheet</button>
  </div>
  <div class="result">
    <canvas id="name-tag-maker-canvas" style="width:100%;max-width:420px;border:1px solid #e5e7eb;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="name-tag-maker-error"></div>
  <p class="note">The sheet is an A4-ratio PNG — print at 100% scale and cut along the guides. Your name is remembered in this browser only.</p>
</div>
