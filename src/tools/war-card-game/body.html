<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:560px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="war-card-game-you">26</div><div class="l">Your cards</div></div>
    <div class="stat-card"><div class="v" id="war-card-game-cpu">26</div><div class="l">CPU cards</div></div>
    <div class="stat-card"><div class="v" id="war-card-game-rounds">0</div><div class="l">Rounds</div></div>
    <div class="stat-card"><div class="v" id="war-card-game-wars">0</div><div class="l">Wars</div></div>
  </div>
  <div style="display:flex;gap:20px;justify-content:center;margin:12px 0;flex-wrap:wrap">
    <div>
      <p class="muted" style="margin:4px 0">You</p>
      <div id="war-card-game-ycard" style="width:100px;height:140px;margin:0 auto;border:2px solid #2e7d32;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold">?</div>
    </div>
    <div style="display:flex;align-items:center;font-size:28px">⚔️</div>
    <div>
      <p class="muted" style="margin:4px 0">CPU</p>
      <div id="war-card-game-ccard" style="width:100px;height:140px;margin:0 auto;border:2px solid #c62828;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold">?</div>
    </div>
  </div>
  <p class="muted" id="war-card-game-msg" style="min-height:24px">Press Battle to flip your top cards!</p>
  <div id="war-card-game-warinfo" class="note hidden" style="max-width:440px;margin:8px auto"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="war-card-game-battle">⚔️ Battle</button>
    <button class="btn btn-outline" id="war-card-game-auto">▶ Auto-play</button>
    <button class="btn btn-outline" id="war-card-game-new">↻ New game</button>
  </div>
  <div id="war-card-game-log" class="note" style="max-width:560px;margin:12px auto 0;text-align:left;max-height:110px;overflow:auto"></div>
  <div class="error" id="war-card-game-error"></div>
</div>
