<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="circle-calculator-known">Known value</label>
      <select class="input" id="circle-calculator-known">
        <option value="r">Radius</option><option value="d">Diameter</option>
        <option value="c">Circumference</option><option value="a">Area</option>
      </select>
    </div>
    <div class="field"><label for="circle-calculator-val">Value</label><input class="input" id="circle-calculator-val" type="number" value="5" min="0" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="circle-calculator-go">Calculate</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="circle-calculator-r">5</div><div class="l">Radius</div></div>
    <div class="stat-card"><div class="v" id="circle-calculator-d">10</div><div class="l">Diameter</div></div>
    <div class="stat-card"><div class="v" id="circle-calculator-c">31.416</div><div class="l">Circumference</div></div>
    <div class="stat-card"><div class="v" id="circle-calculator-a">78.540</div><div class="l">Area</div></div>
  </div>
  <div class="result"><pre class="code" id="circle-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="circle-calculator-error"></div>
</div>
