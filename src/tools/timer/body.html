<div class="tool-card">
  <div class="row">
    <div class="field">
      <label for="timer-hours">Hours</label>
      <input class="input" id="timer-hours" type="number" min="0" max="99" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <label for="timer-minutes">Minutes</label>
      <input class="input" id="timer-minutes" type="number" min="0" max="59" value="5" inputmode="numeric">
    </div>
    <div class="field">
      <label for="timer-seconds">Seconds</label>
      <input class="input" id="timer-seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-outline btn-sm" id="timer-preset-1" type="button">1m</button>
    <button class="btn btn-outline btn-sm" id="timer-preset-5" type="button">5m</button>
    <button class="btn btn-outline btn-sm" id="timer-preset-10" type="button">10m</button>
    <button class="btn btn-outline btn-sm" id="timer-preset-25" type="button">25m Pomodoro</button>
  </div>
  <div class="center mt">
    <div id="timer-display" style="font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.05em;">00:05:00</div>
  </div>
  <div class="progress mt" id="timer-progress"><div id="timer-progress-bar" style="width:0%;"></div></div>
  <div class="btn-row mt" style="justify-content:center;">
    <button class="btn btn-primary" id="timer-start" type="button">Start</button>
    <button class="btn btn-outline" id="timer-reset" type="button">Reset</button>
  </div>
  <div class="error" id="timer-error"></div>
  <p class="success hidden center" id="timer-done">Time&rsquo;s up!</p>
  <p class="note">The alarm beep needs this tab open with your volume up. The countdown is timestamp-based, so it stays accurate even in a background tab.</p>
</div>
