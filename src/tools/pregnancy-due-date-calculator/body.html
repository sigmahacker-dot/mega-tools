<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pregnancy-due-date-calculator-lmp">First day of last period</label>
      <input class="input" id="pregnancy-due-date-calculator-lmp" type="date">
    </div>
    <div class="field" style="align-self:end">
      <button class="btn btn-primary" id="pregnancy-due-date-calculator-calc">Calculate</button>
    </div>
  </div>
  <div class="stat-cards hidden" id="pregnancy-due-date-calculator-out">
    <div class="stat-card"><div class="v" id="pregnancy-due-date-calculator-due" style="font-size:1em">–</div><div class="l">Estimated due date</div></div>
    <div class="stat-card"><div class="v" id="pregnancy-due-date-calculator-week">–</div><div class="l">Current week</div></div>
    <div class="stat-card"><div class="v" id="pregnancy-due-date-calculator-tri">–</div><div class="l">Trimester</div></div>
  </div>
  <p class="hint" id="pregnancy-due-date-calculator-note"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Confirm dating with an ultrasound and your clinician.</p>
  <div class="error" id="pregnancy-due-date-calculator-error"></div>
</div>
