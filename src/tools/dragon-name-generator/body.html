<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="dragon-name-generator-title">Title epithet</label>
      <select class="select" id="dragon-name-generator-title">
        <option value="yes" selected>Include (e.g. the Ashwing)</option>
        <option value="no">Name only</option>
      </select>
    </div>
    <div class="field">
      <label for="dragon-name-generator-count">How many</label>
      <select class="select" id="dragon-name-generator-count">
        <option value="1">1 name</option>
        <option value="10" selected>10 names</option>
        <option value="25">25 names</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="dragon-name-generator-generate" type="button">Generate</button>
  </div>
  <div class="error" id="dragon-name-generator-error"></div>
  <div class="mt" id="dragon-name-generator-list"></div>
</div>
