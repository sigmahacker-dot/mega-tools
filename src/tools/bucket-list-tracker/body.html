<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="bucket-list-tracker-done">0/0</div><div class="l">Completed</div></div>
    <div class="stat-card"><div class="v" id="bucket-list-tracker-pct">0%</div><div class="l">Progress</div></div>
  </div>
  <div style="background:#222;border-radius:8px;height:14px;margin:12px 0">
    <div id="bucket-list-tracker-bar" style="background:#4D7C0F;height:14px;border-radius:8px;width:0%;transition:width .3s"></div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="bucket-list-tracker-goal">Goal</label>
      <input class="input" type="text" id="bucket-list-tracker-goal" placeholder="e.g. See the Northern Lights">
    </div>
    <div class="field">
      <label for="bucket-list-tracker-cat">Category</label>
      <select class="select" id="bucket-list-tracker-cat">
        <option value="Travel">Travel</option>
        <option value="Adventure">Adventure</option>
        <option value="Career">Career</option>
        <option value="Health">Health</option>
        <option value="Relationships">Relationships</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="bucket-list-tracker-add">Add Goal</button>
  </div>
  <div class="error" id="bucket-list-tracker-error"></div>
</div>

<div class="tool-card">
  <div id="bucket-list-tracker-list"></div>
</div>
