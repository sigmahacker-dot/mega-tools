<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="video-script-outline-generator-topic">Video topic</label>
      <input class="input" id="video-script-outline-generator-topic" type="text" placeholder="e.g. budget travel tips" maxlength="80">
    </div>
    <div class="field">
      <label for="video-script-outline-generator-length">Video length</label>
      <select class="select" id="video-script-outline-generator-length">
        <option value="short">Short (1–3 min)</option>
        <option value="medium" selected>Medium (5–10 min)</option>
        <option value="long">Long (15+ min)</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="video-script-outline-generator-generate" type="button">Generate Outline</button>
  </div>
  <div class="error" id="video-script-outline-generator-error"></div>
  <div class="mt" id="video-script-outline-generator-outline"></div>
</div>
