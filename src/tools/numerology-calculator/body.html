<div class="tool-card">
  <div class="field">
    <label for="numerology-calculator-name">Full name</label>
    <input type="text" class="input" id="numerology-calculator-name" placeholder="e.g. Ada Lovelace" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="error" id="numerology-calculator-error"></div>
  <div class="result" id="numerology-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="numerology-calculator-number">–</div><div class="l">Life-path number</div></div>
      <div class="stat-card"><div class="v" id="numerology-calculator-total">–</div><div class="l">Letter total</div></div>
    </div>
    <p id="numerology-calculator-meaning" class="center muted">Type your name to compute your number.</p>
    <p class="muted" id="numerology-calculator-steps"></p>
    <p class="note">For entertainment only — a number can't decide your destiny.</p>
  </div>
</div>
