<div class="tool-card">
  <div class="field">
    <label for="rhyme-finder-input">Word</label>
    <input class="input" type="text" id="rhyme-finder-input" placeholder="e.g. light" maxlength="24" autocomplete="off">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="rhyme-finder-run">Find rhymes</button>
  </div>
  <div class="field">
    <label>Rhymes</label>
    <div class="result"><div class="data" id="rhyme-finder-output" style="white-space:pre-wrap"></div></div>
  </div>
  <p class="hint">Click a rhyme to copy it. Built-in bank of ~40 rhyme families — it won't know every English word.</p>
  <div class="error" id="rhyme-finder-error"></div>
</div>
