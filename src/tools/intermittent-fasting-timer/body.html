<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="if-plan">Fasting plan</label>
      <select class="input" id="if-plan">
        <option value="16">16:8 — fast 16 h, eat 8 h</option>
        <option value="18">18:6 — fast 18 h, eat 6 h</option>
        <option value="20">20:4 — fast 20 h, eat 4 h</option>
        <option value="23">23:1 (OMAD) — fast 23 h</option>
      </select>
    </div>
    <div class="field"><label>&nbsp;</label>
      <div>
        <button class="btn" id="if-start">Start fasting</button>
        <button class="btn" id="if-stop">End fast</button>
      </div>
    </div>
  </div>
  <div class="error" id="intermittent-fasting-timer-error"></div>
  <div class="result" id="if-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="if-status">–</div><div class="l">Status</div></div>
      <div class="stat-card"><div class="v" id="if-remaining">–</div><div class="l" id="if-remaining-label">Fasting remaining</div></div>
      <div class="stat-card"><div class="v" id="if-elapsed">–</div><div class="l">Elapsed</div></div>
    </div>
    <div class="field"><label for="if-bar">Progress</label><progress class="input" id="if-bar" max="100" value="0" style="width:100%"></progress></div>
    <p class="muted" id="if-detail">No active fast. Choose a plan and press Start fasting.</p>
  </div>
</div>
