<div class="tool-card">
  <div class="field">
    <label for="derivative-calculator-fn">f(x) =</label>
    <input class="input" id="derivative-calculator-fn" type="text" placeholder="e.g. 3*x^2 + sin(x) - 5*ln(x)" value="3*x^2 + sin(x) - 5*ln(x)" style="font-family:monospace">
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="derivative-calculator-diff">Differentiate</button>
    <button type="button" class="btn btn-outline btn-sm" id="derivative-calculator-copy">Copy f′(x)</button>
  </div>
  <div class="error" id="derivative-calculator-error"></div>
  <div id="derivative-calculator-out" class="hidden">
    <div class="result">
      <h3>Derivative</h3>
      <p style="font-family:monospace;font-size:1.2em">f′(x) = <b id="derivative-calculator-result"></b></p>
    </div>
    <div class="result">
      <h3>Steps</h3>
      <div id="derivative-calculator-steps"></div>
    </div>
    <p class="note">Notation: sin, cos, tan, exp, ln (natural log), sqrt. Write 3*x not 3x.</p>
  </div>
</div>
