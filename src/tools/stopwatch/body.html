<div class="tool-card">
  <div class="center">
    <div id="stopwatch-display" style="font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.05em;">00:00.00</div>
  </div>
  <div class="btn-row mt" style="justify-content:center;">
    <button class="btn btn-primary" id="stopwatch-start" type="button">Start</button>
    <button class="btn btn-outline" id="stopwatch-lap" type="button">Lap</button>
    <button class="btn btn-outline" id="stopwatch-reset" type="button">Reset</button>
  </div>
  <div class="error" id="stopwatch-error"></div>
  <div class="field mt">
    <label>Laps</label>
    <ul class="file-list" id="stopwatch-laps"></ul>
    <p class="muted" id="stopwatch-laps-empty">No laps yet. Press &ldquo;Lap&rdquo; while the stopwatch is running.</p>
  </div>
</div>
