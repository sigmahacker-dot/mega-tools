<div class="tool-card">
  <div class="center">
    <canvas id="hangman-game-canvas" width="240" height="200" aria-label="Hangman drawing"></canvas>
  </div>
  <p class="center">Category: <strong id="hangman-game-category">–</strong> &nbsp;•&nbsp; Wrong guesses: <strong id="hangman-game-wrong">0 / 6</strong></p>
  <div class="center hg-word" id="hangman-game-word"></div>
  <div class="center">
    <div class="hg-letters" id="hangman-game-letters"></div>
  </div>
  <div class="btn-row center">
    <button type="button" class="btn btn-primary btn-sm" id="hangman-game-new">New word</button>
  </div>
  <div class="error" id="hangman-game-error"></div>
  <div class="result hidden center" id="hangman-game-result"></div>
  <style>
    #hangman-game-canvas{max-width:100%;height:auto}
    .hg-word{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
    .hg-slot{width:34px;height:44px;border-bottom:3px solid #0f172a;font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:#0f172a}
    .hg-letters{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:460px;margin:8px auto}
    .hg-letters button{height:40px;font-weight:700;border:2px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer;color:#0f172a}
    .hg-letters button:disabled{cursor:default;opacity:.4}
    .hg-letters button.good{background:#dcfce7;border-color:#16a34a;opacity:1;color:#15803d}
    .hg-letters button.bad{background:#fee2e2;border-color:#dc2626;opacity:1;color:#b91c1c}
  </style>
</div>
