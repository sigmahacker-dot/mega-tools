<div class="tool-card" style="text-align:center">
  <div class="btn-row" style="justify-content:center" id="white-noise-generator-types">
    <button class="btn" data-t="white">White</button>
    <button class="btn btn-outline" data-t="pink">Pink</button>
    <button class="btn btn-outline" data-t="brown">Brown</button>
  </div>
  <div class="field" style="max-width:420px;margin:16px auto;text-align:left">
    <label for="white-noise-generator-vol">Volume (<span id="white-noise-generator-vol-v">50</span>%)</label>
    <input type="range" class="input" id="white-noise-generator-vol" min="0" max="100" step="1" value="50">
  </div>
  <div class="field" style="max-width:420px;margin:0 auto;text-align:left">
    <label for="white-noise-generator-timer">Sleep timer</label>
    <select class="input" id="white-noise-generator-timer">
      <option value="0">Off — play until stopped</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">1 hour</option>
      <option value="90">90 minutes</option>
    </select>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:16px">
    <button class="btn" id="white-noise-generator-toggle">▶ Play</button>
  </div>
  <p class="muted" id="white-noise-generator-status" style="min-height:24px"></p>
  <div class="error" id="white-noise-generator-error"></div>
</div>
