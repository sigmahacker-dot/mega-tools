<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="instagram-post-preview-user">Username</label>
      <input class="input" type="text" id="instagram-post-preview-user" placeholder="yourhandle">
    </div>
    <div class="field">
      <label for="instagram-post-preview-file">Upload photo</label>
      <input class="input" type="file" id="instagram-post-preview-file" accept="image/*">
    </div>
  </div>
  <div class="field">
    <label for="instagram-post-preview-url">…or image URL</label>
    <input class="input" type="url" id="instagram-post-preview-url" placeholder="https://example.com/photo.jpg">
  </div>
  <div class="field">
    <label for="instagram-post-preview-cap">Caption</label>
    <textarea class="textarea" id="instagram-post-preview-cap" rows="4" placeholder="Your caption with #hashtags…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="instagram-post-preview-render">Render Preview</button>
    <button class="btn btn-outline" id="instagram-post-preview-copy">Copy Caption</button>
  </div>
  <div class="error" id="instagram-post-preview-error"></div>
</div>

<div class="tool-card">
  <h3>Preview</h3>
  <div id="instagram-post-preview-mock" style="max-width:480px"></div>
</div>
