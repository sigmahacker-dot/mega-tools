<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <label for="plank-progression-timer-base">Your current best hold (seconds)</label>
    <input class="input" id="plank-progression-timer-base" type="number" min="5" max="1200" step="1" placeholder="e.g. 60">
  </div>
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="plank-progression-timer-clock">0:00</div><div class="l">Hold timer</div></div>
    <div class="stat-card"><div class="v" id="plank-progression-timer-best">–</div><div class="l">Best hold (saved)</div></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="plank-progression-timer-start">Start</button>
    <button class="btn" id="plank-progression-timer-stop">Stop</button>
    <button class="btn btn-outline" id="plank-progression-timer-reset">Reset</button>
  </div>
  <p class="muted" id="plank-progression-timer-msg" style="min-height:24px"></p>
  <div class="result hidden" id="plank-progression-timer-chart" style="text-align:left"></div>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance. Keep your back flat and stop if you feel pain.</p>
  <div class="error" id="plank-progression-timer-error"></div>
</div>
