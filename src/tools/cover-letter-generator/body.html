<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cover-letter-generator-name">Your full name</label>
      <input class="input" id="cover-letter-generator-name" type="text" placeholder="e.g. Alex Khan" maxlength="60">
    </div>
    <div class="field">
      <label for="cover-letter-generator-role">Role applying for</label>
      <input class="input" id="cover-letter-generator-role" type="text" placeholder="e.g. Product Designer" maxlength="60">
    </div>
    <div class="field">
      <label for="cover-letter-generator-company">Company name</label>
      <input class="input" id="cover-letter-generator-company" type="text" placeholder="e.g. Acme Corp" maxlength="60">
    </div>
    <div class="field">
      <label for="cover-letter-generator-exp">Years of experience</label>
      <select class="select" id="cover-letter-generator-exp">
        <option value="1">1 year</option>
        <option value="2">2 years</option>
        <option value="3">3 years</option>
        <option value="5" selected>5 years</option>
        <option value="7">7 years</option>
        <option value="10">10+ years</option>
      </select>
    </div>
    <div class="field">
      <label for="cover-letter-generator-tone">Tone</label>
      <select class="select" id="cover-letter-generator-tone">
        <option value="enthusiastic">Enthusiastic</option>
        <option value="professional">Professional</option>
        <option value="concise">Concise</option>
      </select>
    </div>
    <div class="field">
      <label for="cover-letter-generator-opening">Custom opening line (optional)</label>
      <input class="input" id="cover-letter-generator-opening" type="text" placeholder="e.g. Your recent launch caught my eye…" maxlength="140">
    </div>
  </div>
  <div class="field">
    <label for="cover-letter-generator-skills">Top skills (comma separated)</label>
    <input class="input" id="cover-letter-generator-skills" type="text" placeholder="e.g. UI design, prototyping, user research" maxlength="200">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="cover-letter-generator-go" type="button">Write My Cover Letter</button>
  </div>
  <div class="error" id="cover-letter-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your cover letter</label>
    <div class="result" id="cover-letter-generator-output" style="white-space:pre-wrap">Your letter will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="cover-letter-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="cover-letter-generator-download" type="button">Download .txt</button>
  </div>
  <p class="note">Template only — personalize the details and proofread before sending.</p>
</div>
