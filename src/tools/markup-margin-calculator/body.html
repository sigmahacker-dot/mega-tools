<div class="tool-card">
  <div class="tabs" style="margin-bottom:12px">
    <button class="tab-btn" id="markup-margin-calculator-tab1" type="button">Cost + Price → Markup &amp; Margin</button>
    <button class="tab-btn" id="markup-margin-calculator-tab2" type="button">Cost + Target margin → Price</button>
  </div>
  <div id="markup-margin-calculator-mode1">
    <div class="grid2">
      <div class="field"><label for="markup-margin-calculator-cost1">Cost ($)</label><input class="input" id="markup-margin-calculator-cost1" type="number" min="0" step="any" value="40"></div>
      <div class="field"><label for="markup-margin-calculator-price1">Selling price ($)</label><input class="input" id="markup-margin-calculator-price1" type="number" min="0" step="any" value="60"></div>
    </div>
  </div>
  <div id="markup-margin-calculator-mode2" class="hidden">
    <div class="grid2">
      <div class="field"><label for="markup-margin-calculator-cost2">Cost ($)</label><input class="input" id="markup-margin-calculator-cost2" type="number" min="0" step="any" value="40"></div>
      <div class="field"><label for="markup-margin-calculator-margin2">Target margin (%)</label><input class="input" id="markup-margin-calculator-margin2" type="number" min="0" max="99.99" step="any" value="25"></div>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="markup-margin-calculator-calc">Calculate</button></div>
  <div class="error" id="markup-margin-calculator-error"></div>
  <div class="result" id="markup-margin-calculator-result">—</div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
