<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="ar-w">Width</label><input type="number" class="input" id="ar-w" min="0" step="any" placeholder="1920"></div>
    <div class="field"><label for="ar-h">Height</label><input type="number" class="input" id="ar-h" min="0" step="any" placeholder="1080"></div>
    <div class="field"><label for="ar-rw">Ratio width</label><input type="number" class="input" id="ar-rw" min="0" step="any" placeholder="16"></div>
    <div class="field"><label for="ar-rh">Ratio height</label><input type="number" class="input" id="ar-rh" min="0" step="any" placeholder="9"></div>
    <div class="field"><label for="ar-side">Known side</label>
      <select class="input" id="ar-side"><option value="w">Width</option><option value="h">Height</option></select>
    </div>
    <div class="field"><label for="ar-val">Known side value</label><input type="number" class="input" id="ar-val" min="0" step="any" placeholder="1280"></div>
  </div>
  <div class="error" id="aspect-ratio-calculator-error"></div>
  <div class="result" id="ar-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="ar-ratio">–</div><div class="l">Simplified ratio</div></div>
      <div class="stat-card"><div class="v" id="ar-missing">–</div><div class="l">Missing side</div></div>
      <div class="stat-card"><div class="v" id="ar-dec">–</div><div class="l">Decimal (w ÷ h)</div></div>
    </div>
    <p class="note">Ratio simplification uses the greatest common divisor of the two numbers.</p>
  </div>
</div>
