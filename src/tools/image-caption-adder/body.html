<div class="tool-card">
  <div class="field">
    <label for="image-caption-adder-file">Photo</label>
    <input type="file" id="image-caption-adder-file" accept="image/*" class="input">
  </div>
  <div class="field">
    <label for="image-caption-adder-text">Caption</label>
    <input type="text" id="image-caption-adder-text" class="input" value="A beautiful day at the lake" maxlength="140">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="image-caption-adder-pos">Position</label>
      <select class="select" id="image-caption-adder-pos">
        <option value="bottom">Bottom</option>
        <option value="top">Top</option>
      </select>
    </div>
    <div class="field">
      <label for="image-caption-adder-size">Font size: <span id="image-caption-adder-size-val">44</span>px</label>
      <input type="range" id="image-caption-adder-size" min="18" max="120" value="44">
    </div>
    <div class="field">
      <label for="image-caption-adder-pad">Padding: <span id="image-caption-adder-pad-val">24</span>px</label>
      <input type="range" id="image-caption-adder-pad" min="8" max="80" value="24">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="image-caption-adder-fg">Text color</label>
      <input type="color" id="image-caption-adder-fg" class="input" value="#ffffff" style="height:42px;padding:4px;">
    </div>
    <div class="field">
      <label for="image-caption-adder-bg">Bar color</label>
      <input type="color" id="image-caption-adder-bg" class="input" value="#111111" style="height:42px;padding:4px;">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="image-caption-adder-download">Download image</button>
  </div>
  <div class="result">
    <canvas id="image-caption-adder-canvas" style="width:100%;border-radius:8px;"></canvas>
  </div>
  <div class="error" id="image-caption-adder-error"></div>
  <p class="note">The caption bar becomes part of the exported image. Everything runs in your browser.</p>
</div>
