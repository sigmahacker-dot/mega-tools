<div class="tool-card">
  <div class="field">
    <label for="button-generator-text">Button text</label>
    <input class="input" id="button-generator-text" type="text" value="Click Me" maxlength="40">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="button-generator-bg">Background color</label>
      <input type="color" id="button-generator-bg" value="#166534" class="input">
    </div>
    <div class="field">
      <label for="button-generator-color">Text color</label>
      <input type="color" id="button-generator-color" value="#ffffff" class="input">
    </div>
  </div>
  <div class="field">
    <label for="button-generator-radius">Border radius: <span id="button-generator-radius-val">8</span>px</label>
    <input type="range" id="button-generator-radius" min="0" max="50" value="8" style="width:100%">
  </div>
  <div class="field">
    <label for="button-generator-padding">Padding: <span id="button-generator-padding-val">14</span>px</label>
    <input type="range" id="button-generator-padding" min="4" max="32" value="14" style="width:100%">
  </div>
  <div class="checkbox-row"><input type="checkbox" id="button-generator-shadow" checked> <label for="button-generator-shadow">Add drop shadow</label></div>
  <div class="center mt" id="button-generator-preview-wrap">
    <button id="button-generator-preview">Click Me</button>
  </div>
  <div class="result mt"><code id="button-generator-css" style="white-space:pre-wrap;word-break:break-all"></code></div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="button-generator-copy">Copy CSS</button>
  </div>
  <div class="error" id="button-generator-error"></div>
</div>
