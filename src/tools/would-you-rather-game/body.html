<div class="tool-card" style="text-align:center">
  <h3 style="margin-bottom:4px">Would you rather…</h3>
  <p class="muted" id="would-you-rather-game-count"></p>
  <div style="display:grid;gap:10px;max-width:480px;margin:16px auto" id="would-you-rather-game-opts">
    <button class="btn btn-outline" id="would-you-rather-game-a" style="padding:18px;font-size:17px;white-space:normal"></button>
    <button class="btn btn-outline" id="would-you-rather-game-b" style="padding:18px;font-size:17px;white-space:normal"></button>
  </div>
  <div id="would-you-rather-game-votes" hidden style="max-width:480px;margin:0 auto">
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:14px"><span>Option A</span><b id="would-you-rather-game-pa"></b></div>
      <div style="background:#eee;border-radius:6px;height:14px"><div id="would-you-rather-game-bara" style="height:100%;background:#43a047;border-radius:6px;width:50%"></div></div>
    </div>
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:14px"><span>Option B</span><b id="would-you-rather-game-pb"></b></div>
      <div style="background:#eee;border-radius:6px;height:14px"><div id="would-you-rather-game-barb" style="height:100%;background:#1e88e5;border-radius:6px;width:50%"></div></div>
    </div>
    <p class="muted" id="would-you-rather-game-total"></p>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:12px">
    <button class="btn" id="would-you-rather-game-next">Next question</button>
  </div>
  <div class="error" id="would-you-rather-game-error"></div>
</div>
