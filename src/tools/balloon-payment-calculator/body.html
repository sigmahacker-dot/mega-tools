<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="balloon-payment-calculator-amount">Loan amount ($)</label><input class="input" id="balloon-payment-calculator-amount" type="number" min="0" step="any" value="250000"></div>
    <div class="field"><label for="balloon-payment-calculator-rate">Interest rate (% APR)</label><input class="input" id="balloon-payment-calculator-rate" type="number" min="0" step="any" value="7"></div>
    <div class="field"><label for="balloon-payment-calculator-amort">Amortization period (years)</label><input class="input" id="balloon-payment-calculator-amort" type="number" min="1" step="any" value="30"></div>
    <div class="field"><label for="balloon-payment-calculator-due">Balloon due in (years)</label><input class="input" id="balloon-payment-calculator-due" type="number" min="1" step="any" value="7"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="balloon-payment-calculator-calc">Calculate</button></div>
  <div class="error" id="balloon-payment-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="balloon-payment-calculator-pmt">—</div><div class="l">Monthly payment</div></div>
    <div class="stat-card"><div class="v" id="balloon-payment-calculator-balloon">—</div><div class="l">Balloon balance due</div></div>
    <div class="stat-card"><div class="v" id="balloon-payment-calculator-paid">—</div><div class="l">Total paid before balloon</div></div>
    <div class="stat-card"><div class="v" id="balloon-payment-calculator-interest">—</div><div class="l">Interest paid before balloon</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
