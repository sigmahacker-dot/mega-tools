<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="car-total-cost-ownership-price">Purchase price ($)</label>
      <input type="number" class="input" id="car-total-cost-ownership-price" min="0" step="any" placeholder="28000">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-years">Years of ownership</label>
      <input type="number" class="input" id="car-total-cost-ownership-years" min="1" max="30" step="1" placeholder="8">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-miles">Miles driven / year</label>
      <input type="number" class="input" id="car-total-cost-ownership-miles" min="0" step="any" placeholder="12000">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-mpg">Fuel economy (mpg)</label>
      <input type="number" class="input" id="car-total-cost-ownership-mpg" min="1" step="any" placeholder="30">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-fuelprice">Fuel price ($/gallon)</label>
      <input type="number" class="input" id="car-total-cost-ownership-fuelprice" min="0" step="any" placeholder="3.50">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-insurance">Insurance ($/yr)</label>
      <input type="number" class="input" id="car-total-cost-ownership-insurance" min="0" step="any" placeholder="1400">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-maint">Maintenance & repairs ($/yr)</label>
      <input type="number" class="input" id="car-total-cost-ownership-maint" min="0" step="any" placeholder="800">
    </div>
    <div class="field">
      <label for="car-total-cost-ownership-resale">Expected resale value ($)</label>
      <input type="number" class="input" id="car-total-cost-ownership-resale" min="0" step="any" placeholder="9000">
    </div>
  </div>
  <div class="error" id="car-total-cost-ownership-error"></div>
  <div class="result" id="car-total-cost-ownership-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="car-total-cost-ownership-fuel">&ndash;</div><div class="l">Fuel / yr</div></div>
      <div class="stat-card"><div class="v" id="car-total-cost-ownership-running">&ndash;</div><div class="l">Running costs total</div></div>
      <div class="stat-card"><div class="v" id="car-total-cost-ownership-total">&ndash;</div><div class="l">Total ownership cost</div></div>
      <div class="stat-card"><div class="v" id="car-total-cost-ownership-peryear">&ndash;</div><div class="l">Cost / year</div></div>
      <div class="stat-card"><div class="v" id="car-total-cost-ownership-permile">&ndash;</div><div class="l">Cost / mile</div></div>
    </div>
    <div id="car-total-cost-ownership-out"></div>
    <p class="note">For information only &mdash; not financial advice. Excludes financing interest, taxes, and registration.</p>
  </div>
</div>
