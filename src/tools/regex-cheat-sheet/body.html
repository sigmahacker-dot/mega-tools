<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="regex-cheat-sheet-pattern">Pattern</label>
      <input class="input" id="regex-cheat-sheet-pattern" placeholder="(\w+)@(\w+\.\w+)" spellcheck="false">
    </div>
    <div class="field">
      <label>Flags</label>
      <div class="btn-row">
        <label class="checkbox-row"><input type="checkbox" id="regex-cheat-sheet-g" checked> g global</label>
        <label class="checkbox-row"><input type="checkbox" id="regex-cheat-sheet-i"> i ignore case</label>
        <label class="checkbox-row"><input type="checkbox" id="regex-cheat-sheet-m"> m multiline</label>
      </div>
    </div>
  </div>
  <div class="field">
    <label for="regex-cheat-sheet-text">Test text</label>
    <textarea class="textarea" id="regex-cheat-sheet-text" rows="4" placeholder="Type text to test against…"></textarea>
  </div>
  <div class="error" id="regex-cheat-sheet-error"></div>
  <div class="result hidden" id="regex-cheat-sheet-result">
    <div class="field">
      <label>Matches</label>
      <div class="code" id="regex-cheat-sheet-matches" style="white-space:pre-wrap;word-break:break-word"></div>
    </div>
    <div class="field">
      <label>Capture groups</label>
      <div id="regex-cheat-sheet-groups"></div>
    </div>
  </div>
  <hr>
  <div class="field">
    <label for="regex-cheat-sheet-search">Search tokens</label>
    <input class="input" id="regex-cheat-sheet-search" placeholder="e.g. digit, lookahead…">
  </div>
  <div id="regex-cheat-sheet-table"></div>
  <p class="muted hidden" id="regex-cheat-sheet-none">No tokens match your search.</p>
</div>
