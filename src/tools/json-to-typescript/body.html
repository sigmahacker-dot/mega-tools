<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="json-to-typescript-root">Root interface name</label>
      <input class="input" id="json-to-typescript-root" value="Root">
    </div>
    <div class="field checkline" style="align-self:end">
      <input type="checkbox" id="json-to-typescript-export" checked>
      <label for="json-to-typescript-export">Export interfaces</label>
    </div>
    <div class="field checkline" style="align-self:end">
      <input type="checkbox" id="json-to-typescript-optionalnull" checked>
      <label for="json-to-typescript-optionalnull">Nulls → optional</label>
    </div>
  </div>
  <div class="field">
    <label for="json-to-typescript-input">JSON</label>
    <textarea class="textarea" id="json-to-typescript-input" rows="8" style="font-family:monospace">{
  "id": 42,
  "name": "Ada Lovelace",
  "active": true,
  "score": 98.6,
  "tags": ["admin", "beta"],
  "address": { "city": "Lahore", "zip": "54000" },
  "manager": null
}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="json-to-typescript-generate">Generate TypeScript</button>
  </div>
  <div class="error" id="json-to-typescript-error"></div>
  <div class="field">
    <label for="json-to-typescript-output">TypeScript</label>
    <textarea class="textarea" id="json-to-typescript-output" rows="16" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="json-to-typescript-copy">Copy code</button>
    <button class="btn btn-outline" id="json-to-typescript-download">Download types.ts</button>
  </div>
</div>
