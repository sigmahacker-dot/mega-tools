<div class="tool-card">
  <div class="field">
    <label for="checklist-app-input">New task</label>
    <div style="display:flex;gap:8px">
      <input type="text" class="input" id="checklist-app-input" placeholder="What needs doing?" maxlength="200" style="flex:1">
      <button class="btn" id="checklist-app-add">Add</button>
    </div>
  </div>
  <div class="error" id="checklist-app-error"></div>
  <div class="result" id="checklist-app-result">
    <p class="muted" id="checklist-app-counts"></p>
    <div style="background:#eee;border-radius:8px;height:14px;margin-bottom:12px">
      <div id="checklist-app-bar" style="height:100%;background:#43a047;border-radius:8px;width:0%;transition:width .3s"></div>
    </div>
    <ul id="checklist-app-list" style="list-style:none;padding:0"></ul>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-sm btn-outline" id="checklist-app-clear">Clear completed</button>
      <button class="btn btn-sm btn-outline" id="checklist-app-clearall">Clear all</button>
    </div>
  </div>
</div>
