<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="running-log-dist">0</div><div class="l">Total km</div></div>
    <div class="stat-card"><div class="v" id="running-log-pace">—</div><div class="l">Avg pace /km</div></div>
    <div class="stat-card"><div class="v" id="running-log-runs">0</div><div class="l">Runs</div></div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="running-log-date">Date</label>
      <input class="input" type="date" id="running-log-date">
    </div>
    <div class="field">
      <label for="running-log-km">Distance (km)</label>
      <input class="input" type="number" id="running-log-km" min="0" step="0.1" placeholder="5.0">
    </div>
    <div class="field">
      <label for="running-log-time">Time (h:mm:ss)</label>
      <input class="input" type="text" id="running-log-time" placeholder="0:28:30">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="running-log-add">Log Run</button>
  </div>
  <div class="error" id="running-log-error"></div>
</div>

<div class="tool-card">
  <h3>Weekly totals</h3>
  <div id="running-log-weeks"></div>
</div>

<div class="tool-card">
  <h3>Run history</h3>
  <div id="running-log-list"></div>
</div>
