<div class="tool-card">
  <h2>Case Style Converter</h2>
  <p class="muted">Convert any text into camelCase, PascalCase, snake_case, kebab-case and more.</p>
  <div class="field">
    <label for="case-style-converter-input">Your text</label>
    <input type="text" class="input" id="case-style-converter-input" placeholder="e.g. hello world, myVarName, my-var-name...">
  </div>
  <div class="error" id="case-style-converter-error"></div>
  <div class="result" id="case-style-converter-result">
    <table class="data">
      <tbody id="case-style-converter-tbody">
        <tr><td colspan="3" class="muted">Type something above to see all styles.</td></tr>
      </tbody>
    </table>
  </div>
</div>
