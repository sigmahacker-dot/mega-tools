<div class="tool-card">
  <div class="field">
    <label for="color-picker-input">Pick a color</label>
    <input type="color" id="color-picker-input" value="#4d7c0f" class="input" style="height:60px">
  </div>
  <div class="field">
    <label for="color-picker-hex">Or type a HEX value</label>
    <input class="input" id="color-picker-hex" type="text" maxlength="7" placeholder="#4d7c0f">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="color-picker-random">Random Color</button>
  </div>
  <div class="error" id="color-picker-error"></div>
  <div class="mt">
    <div class="copy-row"><span class="tag">HEX</span> <code id="color-picker-hex-out"></code> <button class="btn btn-sm btn-outline" id="color-picker-copy-hex">Copy</button></div>
    <div class="copy-row"><span class="tag">RGB</span> <code id="color-picker-rgb-out"></code> <button class="btn btn-sm btn-outline" id="color-picker-copy-rgb">Copy</button></div>
    <div class="copy-row"><span class="tag">HSL</span> <code id="color-picker-hsl-out"></code> <button class="btn btn-sm btn-outline" id="color-picker-copy-hsl">Copy</button></div>
  </div>
  <div class="field mt">
    <label>Shades (darker) &amp; tints (lighter) — click to use</label>
    <div id="color-picker-palette" class="btn-row"></div>
  </div>
</div>
