<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="movie-title-generator-genre">Genre</label>
      <select class="select" id="movie-title-generator-genre">
        <option value="action">Action</option>
        <option value="comedy">Comedy</option>
        <option value="drama">Drama</option>
        <option value="horror">Horror</option>
        <option value="scifi">Sci-Fi</option>
        <option value="romance">Romance</option>
        <option value="thriller">Thriller</option>
        <option value="animation">Animation</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="movie-title-generator-go" type="button">Generate Titles</button>
      </div>
    </div>
  </div>
  <div class="error" id="movie-title-generator-error"></div>
  <div class="mt" id="movie-title-generator-list"></div>
</div>
