<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="bingo-mode">Card type</label>
      <select class="select" id="bingo-mode"><option value="numbers">Classic numbers (1–75)</option><option value="words">Custom words</option></select>
    </div>
    <div class="field"><label for="bingo-title">Card title</label><input type="text" class="input" id="bingo-title" placeholder="Family Bingo Night"></div>
  </div>
  <div class="field" id="bingo-words-wrap" style="display:none"><label for="bingo-words">Custom words <span class="hint">(one per line, up to 24)</span></label><textarea class="textarea" id="bingo-words" rows="4" placeholder="apple&#10;balloon&#10;..."></textarea></div>
  <div class="checkbox-row"><input type="checkbox" id="bingo-free" checked><label for="bingo-free">Free space in the center</label></div>
  <div class="error" id="bingo-card-generator-error"></div>
  <div class="result" id="bingo-result">
    <h3 id="bingo-head" style="text-align:center;margin:4px 0 10px"></h3>
    <div id="bingo-card" style="overflow-x:auto"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="bingo-go" type="button">New card</button>
      <button class="btn btn-outline" id="bingo-print" type="button">Print card</button>
    </div>
  </div>
</div>
