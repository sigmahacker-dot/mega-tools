<div class="tool-card">
  <h2>CSS Triangle Generator</h2>
  <p class="muted">CSS-only triangles built from borders — crisp at any size, zero images.</p>
  <div class="grid2">
    <div class="field">
      <label for="css-triangle-generator-direction">Direction</label>
      <select class="input" id="css-triangle-generator-direction">
        <option value="up">▲ Up</option>
        <option value="down">▼ Down</option>
        <option value="left">◀ Left</option>
        <option value="right">▶ Right</option>
      </select>
    </div>
    <div class="field">
      <label for="css-triangle-generator-color">Color</label>
      <input type="color" class="input" id="css-triangle-generator-color" value="#e11d48" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="css-triangle-generator-size">Size: <span id="css-triangle-generator-size-v">60px</span></label>
      <input type="range" class="input" id="css-triangle-generator-size" min="10" max="200" step="2" value="60">
    </div>
    <div class="field">
      <label for="css-triangle-generator-class">CSS class name</label>
      <input type="text" class="input" id="css-triangle-generator-class" value="my-triangle">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" style="min-height:200px;display:flex;align-items:center;justify-content:center">
    <div id="css-triangle-generator-stage"></div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="css-triangle-generator-copy">Copy CSS</button>
  </div>
  <h3 class="mt">Generated CSS</h3>
  <pre class="code" id="css-triangle-generator-code"></pre>
  <div class="error" id="css-triangle-generator-error"></div>
</div>
