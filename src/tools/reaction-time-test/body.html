<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="reaction-time-test-round">0/5</div><div class="l">Round</div></div>
    <div class="stat-card"><div class="v" id="reaction-time-test-last">–</div><div class="l">Last (ms)</div></div>
    <div class="stat-card"><div class="v" id="reaction-time-test-best">–</div><div class="l">Best avg (ms)</div></div>
  </div>
  <div class="center">
    <div class="rtt-box rtt-idle" id="reaction-time-test-box" role="button" tabindex="0" aria-label="Reaction test box">
      <span id="reaction-time-test-msg">Click to start</span>
    </div>
  </div>
  <div class="btn-row center">
    <button type="button" class="btn btn-outline btn-sm" id="reaction-time-test-reset">Reset</button>
  </div>
  <div class="error" id="reaction-time-test-error"></div>
  <div class="result hidden center" id="reaction-time-test-result"></div>
  <style>
    .rtt-box{width:100%;max-width:440px;height:220px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;margin:8px auto;font-size:1.3rem;font-weight:700;color:#fff;transition:background .15s;text-align:center;padding:16px}
    .rtt-idle{background:#64748b}
    .rtt-wait{background:#dc2626}
    .rtt-ready{background:#16a34a}
    .rtt-box:focus{outline:3px solid #4D7C0F;outline-offset:3px}
  </style>
</div>
