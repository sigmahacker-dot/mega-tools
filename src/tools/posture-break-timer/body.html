<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="pb-every">Break every</label>
      <select class="input" id="pb-every">
        <option value="15">15 minutes</option>
        <option value="20">20 minutes</option>
        <option value="30" selected>30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">60 minutes</option>
      </select>
    </div>
    <div class="field"><label>&nbsp;</label>
      <div>
        <button class="btn" id="pb-start">Start</button>
        <button class="btn" id="pb-pause">Pause</button>
        <button class="btn" id="pb-reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="error" id="posture-break-timer-error"></div>
  <div class="result" id="pb-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pb-time">–</div><div class="l">Next break in</div></div>
      <div class="stat-card"><div class="v" id="pb-count">0</div><div class="l">Breaks today</div></div>
    </div>
    <div class="field"><label for="pb-bar">Progress</label><progress class="input" id="pb-bar" max="100" value="0" style="width:100%"></progress></div>
    <p class="muted" id="pb-detail">Press Start to begin the countdown.</p>
  </div>
</div>
