<div class="tool-card">
  <div class="grid2">
    <div>
      <h3 style="margin-top:0">Offer A</h3>
      <div class="field"><label for="paycheck-comparison-a-salary">Base salary ($/yr)</label><input type="number" class="input" id="paycheck-comparison-a-salary" min="0" step="any" placeholder="90000"></div>
      <div class="field"><label for="paycheck-comparison-a-bonus">Annual bonus ($)</label><input type="number" class="input" id="paycheck-comparison-a-bonus" min="0" step="any" placeholder="5000"></div>
      <div class="field"><label for="paycheck-comparison-a-health">Health benefits value ($/yr)</label><input type="number" class="input" id="paycheck-comparison-a-health" min="0" step="any" placeholder="8000"></div>
      <div class="field"><label for="paycheck-comparison-a-match">Retirement match ($/yr)</label><input type="number" class="input" id="paycheck-comparison-a-match" min="0" step="any" placeholder="4500"></div>
      <div class="field"><label for="paycheck-comparison-a-pto">PTO days / yr</label><input type="number" class="input" id="paycheck-comparison-a-pto" min="0" step="1" placeholder="20"></div>
      <div class="field"><label for="paycheck-comparison-a-tax">Est. effective tax rate (%)</label><input type="number" class="input" id="paycheck-comparison-a-tax" min="0" max="100" step="any" value="22"></div>
    </div>
    <div>
      <h3 style="margin-top:0">Offer B</h3>
      <div class="field"><label for="paycheck-comparison-b-salary">Base salary ($/yr)</label><input type="number" class="input" id="paycheck-comparison-b-salary" min="0" step="any" placeholder="95000"></div>
      <div class="field"><label for="paycheck-comparison-b-bonus">Annual bonus ($)</label><input type="number" class="input" id="paycheck-comparison-b-bonus" min="0" step="any" placeholder="0"></div>
      <div class="field"><label for="paycheck-comparison-b-health">Health benefits value ($/yr)</label><input type="number" class="input" id="paycheck-comparison-b-health" min="0" step="any" placeholder="6000"></div>
      <div class="field"><label for="paycheck-comparison-b-match">Retirement match ($/yr)</label><input type="number" class="input" id="paycheck-comparison-b-match" min="0" step="any" placeholder="3000"></div>
      <div class="field"><label for="paycheck-comparison-b-pto">PTO days / yr</label><input type="number" class="input" id="paycheck-comparison-b-pto" min="0" step="1" placeholder="15"></div>
      <div class="field"><label for="paycheck-comparison-b-tax">Est. effective tax rate (%)</label><input type="number" class="input" id="paycheck-comparison-b-tax" min="0" max="100" step="any" value="22"></div>
    </div>
  </div>
  <div class="error" id="paycheck-comparison-error"></div>
  <div class="result" id="paycheck-comparison-result">
    <div id="paycheck-comparison-out"></div>
    <p class="note">For information only &mdash; not financial advice. Tax is a rough estimate; cost of living is not included.</p>
  </div>
</div>
