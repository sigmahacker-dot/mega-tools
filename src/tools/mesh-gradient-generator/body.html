<div class="tool-card">
  <h2>Mesh Gradient Generator</h2>
  <p class="muted">Four radial-gradient blobs blended into a trendy mesh gradient.</p>
  <div class="grid2">
    <div class="field">
      <label for="mesh-gradient-generator-c1">Color 1</label>
      <input type="color" class="input" id="mesh-gradient-generator-c1" value="#7c3aed" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="mesh-gradient-generator-c2">Color 2</label>
      <input type="color" class="input" id="mesh-gradient-generator-c2" value="#e11d48" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="mesh-gradient-generator-c3">Color 3</label>
      <input type="color" class="input" id="mesh-gradient-generator-c3" value="#0ea5e9" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="mesh-gradient-generator-c4">Color 4</label>
      <input type="color" class="input" id="mesh-gradient-generator-c4" value="#f59e0b" style="height:44px;padding:4px">
    </div>
    <div class="field">
      <label for="mesh-gradient-generator-spread">Blob spread: <span id="mesh-gradient-generator-spread-v">60%</span></label>
      <input type="range" class="input" id="mesh-gradient-generator-spread" min="20" max="100" step="1" value="60">
    </div>
    <div class="field">
      <label for="mesh-gradient-generator-bg">Base color</label>
      <input type="color" class="input" id="mesh-gradient-generator-bg" value="#ffffff" style="height:44px;padding:4px">
    </div>
  </div>
  <h3>Live preview</h3>
  <div class="preview" id="mesh-gradient-generator-stage" style="min-height:240px"></div>
  <div class="btn-row mt">
    <button class="btn btn-outline" id="mesh-gradient-generator-shuffle">🎲 Shuffle colors</button>
    <button class="btn btn-primary" id="mesh-gradient-generator-copy">Copy CSS</button>
  </div>
  <h3 class="mt">Generated CSS</h3>
  <pre class="code" id="mesh-gradient-generator-code"></pre>
  <div class="error" id="mesh-gradient-generator-error"></div>
</div>
