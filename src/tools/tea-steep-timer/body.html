<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:340px;margin:0 auto 12px;text-align:left">
    <label for="tea-steep-timer-type">Tea type</label>
    <select class="input" id="tea-steep-timer-type">
      <option value="green">🍃 Green tea — 2 min @ 80°C</option>
      <option value="white">🤍 White tea — 4 min @ 75°C</option>
      <option value="oolong">🫖 Oolong tea — 3 min @ 90°C</option>
      <option value="black">☕ Black tea — 4 min @ 100°C</option>
      <option value="herbal">🌿 Herbal tea — 6 min @ 100°C</option>
    </select>
  </div>
  <div class="stat-cards" style="max-width:440px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="tea-steep-timer-temp">80°C</div><div class="l">Water temp</div></div>
    <div class="stat-card"><div class="v" id="tea-steep-timer-time">2:00</div><div class="l">Steep time</div></div>
  </div>
  <div class="countdown-digits" style="margin-bottom:8px"><div class="cd-cell"><span id="tea-steep-timer-clock">2:00</span></div></div>
  <p class="note" id="tea-steep-timer-notes" style="max-width:480px;margin:0 auto 12px"></p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="tea-steep-timer-start">Start steeping</button>
    <button class="btn btn-outline" id="tea-steep-timer-stop">Stop</button>
  </div>
  <div class="error" id="tea-steep-timer-error"></div>
</div>
