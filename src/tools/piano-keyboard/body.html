<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto 12px;text-align:left">
    <label for="piano-keyboard-vol">Volume: <span id="piano-keyboard-vol-val">70</span>%</label>
    <input type="range" id="piano-keyboard-vol" min="0" max="100" value="70">
  </div>
  <div style="overflow:auto">
    <div id="piano-keyboard-keys" style="position:relative;display:inline-block;height:180px;user-select:none"></div>
  </div>
  <p class="hint" style="margin-top:8px">Computer keys: <span class="code">A W S E D F T G Y H U J K</span> = C4 … C5, <span class="code">O L P ; '</span> continue up. Click keys or use your keyboard.</p>
  <div class="error" id="piano-keyboard-error"></div>
  <p class="note">Files never leave your device — everything is processed in your browser.</p>
</div>
