<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="basic-auth-header-generator-user">Username</label>
      <input class="input" id="basic-auth-header-generator-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label for="basic-auth-header-generator-pass">Password</label>
      <input class="input" id="basic-auth-header-generator-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
  </div>
  <div class="error" id="basic-auth-header-generator-error"></div>
  <div class="field">
    <label for="basic-auth-header-generator-output">Authorization header</label>
    <textarea class="textarea" id="basic-auth-header-generator-output" rows="3" readonly></textarea>
  </div>
  <div class="field">
    <label for="basic-auth-header-generator-value">Encoded value only</label>
    <textarea class="textarea" id="basic-auth-header-generator-value" rows="2" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="basic-auth-header-generator-copy">Copy header</button>
    <button class="btn btn-outline" id="basic-auth-header-generator-copyval">Copy value</button>
    <button class="btn btn-outline" id="basic-auth-header-generator-download">Download .txt</button>
  </div>
  <p class="note">Encoded locally — your credentials never leave the browser. Always use Basic auth over HTTPS.</p>
</div>
