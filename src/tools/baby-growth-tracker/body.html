<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="baby-growth-tracker-dob">Baby's date of birth</label>
      <input class="input" id="baby-growth-tracker-dob" type="date">
    </div>
    <div class="field">
      <label for="baby-growth-tracker-date">Measurement date</label>
      <input class="input" id="baby-growth-tracker-date" type="date">
    </div>
    <div class="field">
      <label for="baby-growth-tracker-weight">Weight (kg)</label>
      <input class="input" id="baby-growth-tracker-weight" type="number" min="0.5" max="40" step="0.01" placeholder="e.g. 6.40">
    </div>
    <div class="field">
      <label for="baby-growth-tracker-height">Height (cm)</label>
      <input class="input" id="baby-growth-tracker-height" type="number" min="20" max="150" step="0.1" placeholder="e.g. 65">
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="baby-growth-tracker-add">Log measurement</button></div>
  <div class="result" id="baby-growth-tracker-list"></div>
  <p class="hint" id="baby-growth-tracker-note"></p>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. This is NOT a percentile chart; your pediatrician's growth chart is the authority.</p>
  <div class="error" id="baby-growth-tracker-error"></div>
</div>
