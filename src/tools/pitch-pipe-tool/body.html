<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:320px;margin:0 auto;text-align:left">
    <label for="pitch-pipe-tool-oct">Octave</label>
    <select class="input" id="pitch-pipe-tool-oct">
      <option value="0">Low (C3–B3)</option>
      <option value="1" selected>Middle (C4–B4)</option>
      <option value="2">High (C5–B5)</option>
    </select>
  </div>
  <div id="pitch-pipe-tool-notes" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin:16px auto"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-outline" id="pitch-pipe-tool-stop">⏹ Stop</button>
  </div>
  <p class="muted" id="pitch-pipe-tool-now" style="min-height:24px"></p>
  <div class="error" id="pitch-pipe-tool-error"></div>
</div>
