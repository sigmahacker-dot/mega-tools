<div class="tool-card">
  <div class="field">
    <label for="tap-code-translator-input">Input</label>
    <textarea class="textarea" id="tap-code-translator-input" rows="5" placeholder="Type text to encode, or dots like . . / .. . to decode"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="tap-code-translator-mode">Mode</label>
      <select class="input" id="tap-code-translator-mode">
        <option value="encode">Encode (text → taps)</option>
        <option value="decode">Decode (taps → text)</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="tap-code-translator-run">Run</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><div class="data" id="tap-code-translator-output" style="white-space:pre-wrap"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="tap-code-translator-copy">Copy output</button></div>
  </div>
  <p class="hint">Row-taps then column-taps. Letters separated by <span class="code">/</span>, words by <span class="code">//</span>. K is tapped as C.</p>
  <div class="error" id="tap-code-translator-error"></div>
</div>
