<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 12px">
    <div class="field" style="text-align:left">
      <label for="chess-clock-timer-mins">Minutes per player</label>
      <input class="input" type="number" id="chess-clock-timer-mins" value="10" min="1" max="180">
    </div>
    <div class="field" style="text-align:left">
      <label for="chess-clock-timer-inc">Increment (sec / move)</label>
      <input class="input" type="number" id="chess-clock-timer-inc" value="0" min="0" max="60">
    </div>
  </div>
  <div id="chess-clock-timer-sides" style="max-width:440px;margin:0 auto">
    <button id="chess-clock-timer-p1" style="display:block;width:100%;padding:26px 10px;margin-bottom:10px;font-size:44px;font-weight:700;border-radius:12px;border:2px solid #ccc;background:#f5f5f5;cursor:pointer;font-variant-numeric:tabular-nums" aria-label="Player 1 clock — tap to switch">10:00</button>
    <button id="chess-clock-timer-p2" style="display:block;width:100%;padding:26px 10px;font-size:44px;font-weight:700;border-radius:12px;border:2px solid #ccc;background:#f5f5f5;cursor:pointer;font-variant-numeric:tabular-nums" aria-label="Player 2 clock — tap to switch">10:00</button>
  </div>
  <p class="muted" id="chess-clock-timer-msg" style="min-height:24px;margin-top:10px">Tap a side to start. Tap your own side after your move.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="chess-clock-timer-pause">Pause</button>
    <button class="btn btn-outline" id="chess-clock-timer-reset">Reset</button>
  </div>
  <div class="error" id="chess-clock-timer-error"></div>
</div>
