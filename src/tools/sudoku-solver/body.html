<div class="tool-card">
  <div id="sudoku-solver-grid" style="display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-width:450px;margin:0 auto"></div>
  <div class="btn-row" style="margin-top:12px;justify-content:center">
    <button type="button" class="btn" id="sudoku-solver-solve">Solve</button>
    <button type="button" class="btn btn-outline" id="sudoku-solver-sample">Sample</button>
    <button type="button" class="btn btn-outline" id="sudoku-solver-clear">Clear</button>
  </div>
  <div class="error" id="sudoku-solver-error"></div>
  <div id="sudoku-solver-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="sudoku-solver-steps">–</div><div class="l">Placement attempts</div></div>
      <div class="stat-card"><div class="v" id="sudoku-solver-backs">–</div><div class="l">Backtracks</div></div>
      <div class="stat-card"><div class="v" id="sudoku-solver-time">–</div><div class="l">Solve time</div></div>
    </div>
    <p class="muted">Solution below — your original givens are shown in <b>bold green</b>.</p>
  </div>
</div>
