<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="fiscal-quarter-finder-date">Date</label>
      <input type="date" class="input" id="fiscal-quarter-finder-date">
    </div>
    <div class="field">
      <label for="fiscal-quarter-finder-start">Fiscal year starts in</label>
      <select class="select" id="fiscal-quarter-finder-start"></select>
    </div>
  </div>
  <div class="error" id="fiscal-quarter-finder-error"></div>
  <div class="result" id="fiscal-quarter-finder-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="fiscal-quarter-finder-fy">–</div><div class="l">Fiscal year</div></div>
      <div class="stat-card"><div class="v" id="fiscal-quarter-finder-q">–</div><div class="l">Quarter</div></div>
      <div class="stat-card"><div class="v" id="fiscal-quarter-finder-left">–</div><div class="l">Days left in quarter</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Detail</th><th>Value</th></tr></thead>
      <tbody id="fiscal-quarter-finder-body"></tbody>
    </table>
    <p class="note">Fiscal year is labelled by the calendar year in which it ends.</p>
  </div>
</div>
