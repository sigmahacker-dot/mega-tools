<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="monty-hall-simulator-n">Trials</label><input class="input" id="monty-hall-simulator-n" type="number" value="10000" min="100" max="1000000" step="1"></div>
    <div class="field"><label for="monty-hall-simulator-doors">Doors</label><input class="input" id="monty-hall-simulator-doors" type="number" value="3" min="3" max="10" step="1"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="monty-hall-simulator-go">Run simulation</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="monty-hall-simulator-stay">33.4%</div><div class="l">Win % if you STAY</div></div>
    <div class="stat-card"><div class="v" id="monty-hall-simulator-switch">66.6%</div><div class="l">Win % if you SWITCH</div></div>
  </div>
  <div id="monty-hall-simulator-bars" style="max-width:560px;margin:12px auto"></div>
  <p class="hint" id="monty-hall-simulator-theory"></p>
  <div class="error" id="monty-hall-simulator-error"></div>
</div>
