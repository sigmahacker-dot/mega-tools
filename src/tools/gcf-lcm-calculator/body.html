<div class="tool-card">
  <div class="field">
    <label for="gcf-lcm-calculator-input">Numbers (comma, space or newline separated)</label>
    <textarea class="textarea" id="gcf-lcm-calculator-input" rows="4" placeholder="e.g. 12, 18, 30"></textarea>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="gcf-lcm-calculator-go">Calculate</button>
  </div>
  <div class="error" id="gcf-lcm-calculator-error"></div>
  <div class="result" id="gcf-lcm-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="gcf-lcm-calculator-gcf">&ndash;</div><div class="l">GCF</div></div>
      <div class="stat-card"><div class="v" id="gcf-lcm-calculator-lcm">&ndash;</div><div class="l">LCM</div></div>
      <div class="stat-card"><div class="v" id="gcf-lcm-calculator-count">&ndash;</div><div class="l">Numbers</div></div>
    </div>
    <p class="note">GCF via Euclid's algorithm; LCM via |a&times;b| &divide; GCF, chained across the list.</p>
  </div>
</div>
