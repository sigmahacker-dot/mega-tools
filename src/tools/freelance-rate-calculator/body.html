<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="free-income">Target annual income ($)</label>
      <input type="number" class="input" id="free-income" min="1" step="any" placeholder="90000">
    </div>
    <div class="field">
      <label for="free-hours">Billable hours per week</label>
      <input type="number" class="input" id="free-hours" min="1" max="80" step="any" placeholder="25">
    </div>
    <div class="field">
      <label for="free-weeks">Working weeks per year</label>
      <input type="number" class="input" id="free-weeks" min="1" max="52" step="1" placeholder="46">
    </div>
    <div class="field">
      <label for="free-buffer">Buffer for taxes &amp; downtime (%)</label>
      <input type="number" class="input" id="free-buffer" min="0" max="200" step="any" placeholder="30">
    </div>
  </div>
  <div class="error" id="freelance-rate-calculator-error"></div>
  <div class="result" id="free-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="free-hourly">–</div><div class="l">Hourly rate</div></div>
      <div class="stat-card"><div class="v" id="free-daily">–</div><div class="l">8-hour day rate</div></div>
      <div class="stat-card"><div class="v" id="free-weekly">–</div><div class="l">Weekly rate</div></div>
    </div>
    <p class="note">The buffer is a rough margin for taxes, admin work and gaps between clients — adjust it to your situation.</p>
  </div>
</div>
