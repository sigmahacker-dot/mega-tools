<div class="tool-card">
  <div class="field">
    <label for="pdf-bates-stamper-file">PDF file</label>
    <input type="file" id="pdf-bates-stamper-file" accept="application/pdf" class="input">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="pdf-bates-stamper-prefix">Prefix</label>
      <input type="text" id="pdf-bates-stamper-prefix" class="input" value="DOC" maxlength="20">
    </div>
    <div class="field">
      <label for="pdf-bates-stamper-start">Start number</label>
      <input type="number" id="pdf-bates-stamper-start" class="input" value="1" min="0" max="999999999">
    </div>
    <div class="field">
      <label for="pdf-bates-stamper-digits">Digits</label>
      <select class="select" id="pdf-bates-stamper-digits">
        <option value="4">4 (0001)</option>
        <option value="6" selected>6 (000001)</option>
        <option value="8">8 (00000001)</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="pdf-bates-stamper-pos">Corner</label>
      <select class="select" id="pdf-bates-stamper-pos">
        <option value="br">Bottom right</option>
        <option value="bl">Bottom left</option>
        <option value="tr">Top right</option>
        <option value="tl">Top left</option>
      </select>
    </div>
    <div class="field">
      <label for="pdf-bates-stamper-size">Font size: <span id="pdf-bates-stamper-size-val">12</span>pt</label>
      <input type="range" id="pdf-bates-stamper-size" min="8" max="24" value="12">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pdf-bates-stamper-go">Stamp</button>
  </div>
  <div class="result hidden" id="pdf-bates-stamper-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-bates-stamper-pages">–</div><div class="l">Pages stamped</div></div>
      <div class="stat-card"><div class="v" id="pdf-bates-stamper-range">–</div><div class="l">Number range</div></div>
      <div class="stat-card"><div class="v" id="pdf-bates-stamper-size2">–</div><div class="l">Output size</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="pdf-bates-stamper-download">Download stamped PDF</button>
    </div>
  </div>
  <div class="error" id="pdf-bates-stamper-error"></div>
  <p class="note">The stamp is drawn permanently onto each page. Everything runs in your browser.</p>
</div>
