<div class="tool-card" style="text-align:center;max-width:560px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="24-game-deal">Deal</button>
    <button class="btn btn-outline" id="24-game-undo">Undo</button>
    <button class="btn btn-outline" id="24-game-hint">Hint</button>
    <button class="btn btn-outline" id="24-game-solve">Solution</button>
  </div>
  <p class="muted" id="24-game-status" style="min-height:24px;font-weight:600"></p>
  <div id="24-game-cards" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:96px"></div>
  <div id="24-game-ops" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px"></div>
  <div class="stat-cards" style="max-width:420px;margin:10px auto 0">
    <div class="stat-card"><div class="v" id="24-game-wins">0</div><div class="l">Solved</div></div>
    <div class="stat-card"><div class="v" id="24-game-plays">0</div><div class="l">Deals</div></div>
  </div>
  <p class="note">Tap a number → tap + − × ÷ → tap another number. Fractions are exact — 5 ÷ 2 = 2½ is fine.</p>
  <div class="error" id="24-game-error"></div>
</div>
