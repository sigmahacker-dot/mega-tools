<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="cal-sex">Sex</label>
      <select class="select" id="cal-sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="cal-age">Age (years)</label>
      <input type="number" class="input" id="cal-age" min="10" max="100" step="1" placeholder="30">
    </div>
    <div class="field">
      <label for="cal-height">Height (cm)</label>
      <input type="number" class="input" id="cal-height" min="100" max="250" step="any" placeholder="175">
    </div>
    <div class="field">
      <label for="cal-weight">Weight (kg)</label>
      <input type="number" class="input" id="cal-weight" min="25" max="400" step="any" placeholder="75">
    </div>
  </div>
  <div class="field">
    <label for="cal-activity">Activity level</label>
    <select class="select" id="cal-activity">
      <option value="1.2">Sedentary — little or no exercise</option>
      <option value="1.375">Light — light exercise 1–3 days/week</option>
      <option value="1.55">Moderate — moderate exercise 3–5 days/week</option>
      <option value="1.725">Active — hard exercise 6–7 days/week</option>
      <option value="1.9">Very active — physical job + hard exercise</option>
    </select>
  </div>
  <div class="error" id="calorie-calculator-error"></div>
  <div class="result" id="cal-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="cal-bmr">–</div><div class="l">BMR (kcal/day)</div></div>
      <div class="stat-card"><div class="v" id="cal-tdee">–</div><div class="l">TDEE (kcal/day)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Goal</th><th>Daily calories</th></tr></thead>
      <tbody>
        <tr><th scope="row">Lose weight (gradual)</th><td id="cal-lose">–</td></tr>
        <tr><th scope="row">Maintain weight</th><td id="cal-maintain">–</td></tr>
        <tr><th scope="row">Gain weight (gradual)</th><td id="cal-gain">–</td></tr>
      </tbody>
    </table>
    <p class="note">Estimate only, not medical advice. Individual needs vary — talk to a professional before a major diet change.</p>
  </div>
</div>
