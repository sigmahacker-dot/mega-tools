<div class="tool-card">
  <div class="field">
    <label for="easing-visualizer-fn">Easing function</label>
    <select class="select" id="easing-visualizer-fn">
      <option value="linear">linear</option>
      <option value="ease" selected>ease</option>
      <option value="easeIn">ease-in (quad)</option>
      <option value="easeOut">ease-out (quad)</option>
      <option value="easeInOut">ease-in-out (quad)</option>
      <option value="easeInCubic">ease-in-cubic</option>
      <option value="easeOutCubic">ease-out-cubic</option>
      <option value="easeInOutCubic">ease-in-out-cubic</option>
      <option value="easeInQuart">ease-in-quart</option>
      <option value="easeOutBack">ease-out-back</option>
      <option value="easeInOutSine">ease-in-out-sine</option>
      <option value="easeOutBounce">ease-out-bounce</option>
    </select>
  </div>
  <div class="error" id="easing-visualizer-error"></div>
  <div class="result mt">
    <canvas class="preview" id="easing-visualizer-canvas" width="640" height="300" style="background:#fff;width:100%;"></canvas>
    <div class="field mt">
      <label for="easing-visualizer-css">CSS</label>
      <input type="text" class="input" id="easing-visualizer-css" readonly style="font-family:ui-monospace,monospace;">
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="easing-visualizer-replay" type="button">Replay</button>
      <button class="btn btn-outline btn-sm" id="easing-visualizer-copy" type="button">Copy CSS</button>
    </div>
  </div>
</div>
