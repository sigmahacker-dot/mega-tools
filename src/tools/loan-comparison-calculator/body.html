<div class="tool-card">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px">
    <fieldset style="border:1px solid #ddd;border-radius:8px;padding:12px">
      <legend><b>Loan A</b></legend>
      <div class="field"><label for="loan-comparison-calculator-amount0">Amount ($)</label><input class="input" id="loan-comparison-calculator-amount0" type="number" min="0" step="any" value="20000"></div>
      <div class="field"><label for="loan-comparison-calculator-rate0">Rate (% APR)</label><input class="input" id="loan-comparison-calculator-rate0" type="number" min="0" step="any" value="8"></div>
      <div class="field"><label for="loan-comparison-calculator-term0">Term (years)</label><input class="input" id="loan-comparison-calculator-term0" type="number" min="1" step="any" value="5"></div>
    </fieldset>
    <fieldset style="border:1px solid #ddd;border-radius:8px;padding:12px">
      <legend><b>Loan B</b></legend>
      <div class="field"><label for="loan-comparison-calculator-amount1">Amount ($)</label><input class="input" id="loan-comparison-calculator-amount1" type="number" min="0" step="any" value="20000"></div>
      <div class="field"><label for="loan-comparison-calculator-rate1">Rate (% APR)</label><input class="input" id="loan-comparison-calculator-rate1" type="number" min="0" step="any" value="6.5"></div>
      <div class="field"><label for="loan-comparison-calculator-term1">Term (years)</label><input class="input" id="loan-comparison-calculator-term1" type="number" min="1" step="any" value="7"></div>
    </fieldset>
    <fieldset style="border:1px solid #ddd;border-radius:8px;padding:12px">
      <legend><b>Loan C</b></legend>
      <div class="field"><label for="loan-comparison-calculator-amount2">Amount ($)</label><input class="input" id="loan-comparison-calculator-amount2" type="number" min="0" step="any" value="18000"></div>
      <div class="field"><label for="loan-comparison-calculator-rate2">Rate (% APR)</label><input class="input" id="loan-comparison-calculator-rate2" type="number" min="0" step="any" value="9"></div>
      <div class="field"><label for="loan-comparison-calculator-term2">Term (years)</label><input class="input" id="loan-comparison-calculator-term2" type="number" min="1" step="any" value="4"></div>
    </fieldset>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="loan-comparison-calculator-calc">Compare</button></div>
  <div class="error" id="loan-comparison-calculator-error"></div>
  <table class="data" id="loan-comparison-calculator-table"></table>
  <p class="note" id="loan-comparison-calculator-verdict"></p>
</div>
