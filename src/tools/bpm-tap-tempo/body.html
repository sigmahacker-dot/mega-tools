<div class="tool-card" style="text-align:center">
  <div style="font-size:80px;font-weight:800" id="bpm-tap-tempo-bpm">–</div>
  <div class="muted">BPM</div>
  <button class="btn" id="bpm-tap-tempo-tap" style="font-size:24px;padding:32px 0;width:100%;max-width:420px;margin:16px auto;display:block;border-radius:16px">TAP</button>
  <div class="stat-cards" style="max-width:480px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="bpm-tap-tempo-count">0</div><div class="l">Taps</div></div>
    <div class="stat-card"><div class="v" id="bpm-tap-tempo-avg">–</div><div class="l">Avg interval</div></div>
    <div class="stat-card"><div class="v" id="bpm-tap-tempo-range">–</div><div class="l">Min–max BPM</div></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-outline" id="bpm-tap-tempo-reset">Reset</button>
  </div>
  <p class="note">Tip: press the Space bar to tap. Pausing 3+ seconds resets the count.</p>
  <div class="error" id="bpm-tap-tempo-error"></div>
</div>
