<div class="tool-card">
  <div class="grid2" id="border-radius-generator-sliders">
    <div class="field">
      <label for="border-radius-generator-tlh">Top-left horizontal: <span id="border-radius-generator-tlh-val">30</span>%</label>
      <input type="range" id="border-radius-generator-tlh" min="0" max="100" value="30">
    </div>
    <div class="field">
      <label for="border-radius-generator-tlv">Top-left vertical: <span id="border-radius-generator-tlv-val">30</span>%</label>
      <input type="range" id="border-radius-generator-tlv" min="0" max="100" value="30">
    </div>
    <div class="field">
      <label for="border-radius-generator-trh">Top-right horizontal: <span id="border-radius-generator-trh-val">70</span>%</label>
      <input type="range" id="border-radius-generator-trh" min="0" max="100" value="70">
    </div>
    <div class="field">
      <label for="border-radius-generator-trv">Top-right vertical: <span id="border-radius-generator-trv-val">30</span>%</label>
      <input type="range" id="border-radius-generator-trv" min="0" max="100" value="30">
    </div>
    <div class="field">
      <label for="border-radius-generator-brh">Bottom-right horizontal: <span id="border-radius-generator-brh-val">30</span>%</label>
      <input type="range" id="border-radius-generator-brh" min="0" max="100" value="30">
    </div>
    <div class="field">
      <label for="border-radius-generator-brv">Bottom-right vertical: <span id="border-radius-generator-brv-val">70</span>%</label>
      <input type="range" id="border-radius-generator-brv" min="0" max="100" value="70">
    </div>
    <div class="field">
      <label for="border-radius-generator-blh">Bottom-left horizontal: <span id="border-radius-generator-blh-val">70</span>%</label>
      <input type="range" id="border-radius-generator-blh" min="0" max="100" value="70">
    </div>
    <div class="field">
      <label for="border-radius-generator-blv">Bottom-left vertical: <span id="border-radius-generator-blv-val">30</span>%</label>
      <input type="range" id="border-radius-generator-blv" min="0" max="100" value="30">
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div style="background:#f3f4f6;border-radius:12px;padding:40px;display:flex;align-items:center;justify-content:center;">
      <div id="border-radius-generator-preview" style="width:220px;height:220px;background:linear-gradient(135deg,#4D7C0F,#166534);"></div>
    </div>
  </div>
  <div class="error" id="border-radius-generator-error"></div>
  <div class="result" id="border-radius-generator-result">
    <div class="field">
      <label for="border-radius-generator-css">CSS</label>
      <pre id="border-radius-generator-css" style="background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;"></pre>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="border-radius-generator-randomize">Randomize</button>
      <button class="btn btn-outline" id="border-radius-generator-copy">Copy CSS</button>
    </div>
  </div>
</div>
