<div class="tool-card" style="text-align:center;max-width:560px;margin:0 auto">
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="boggle-game-new">New game</button>
    <button class="btn btn-outline" id="boggle-game-end">End game</button>
  </div>
  <div class="stat-cards" style="margin-bottom:10px">
    <div class="stat-card"><div class="v" id="boggle-game-time">3:00</div><div class="l">Time left</div></div>
    <div class="stat-card"><div class="v" id="boggle-game-score">0</div><div class="l">Score</div></div>
    <div class="stat-card"><div class="v" id="boggle-game-words">0</div><div class="l">Words found</div></div>
    <div class="stat-card"><div class="v" id="boggle-game-possible">—</div><div class="l">Possible</div></div>
  </div>
  <p class="muted" id="boggle-game-status" style="min-height:24px;font-weight:600"></p>
  <div id="boggle-game-board" style="display:inline-grid;grid-template-columns:repeat(4,minmax(56px,76px));gap:8px;margin:8px 0"></div>
  <div style="font-size:26px;font-weight:800;letter-spacing:4px;min-height:40px" id="boggle-game-current"></div>
  <div class="btn-row" style="margin:8px 0">
    <button class="btn btn-primary" id="boggle-game-submit">Submit word</button>
    <button class="btn btn-outline" id="boggle-game-clear">Clear</button>
  </div>
  <div id="boggle-game-found" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:130px;overflow:auto;margin-top:8px"></div>
  <div class="stat-cards" style="margin-top:10px">
    <div class="stat-card"><div class="v" id="boggle-game-best">0</div><div class="l">Best score</div></div>
  </div>
  <div class="error" id="boggle-game-error"></div>
</div>
