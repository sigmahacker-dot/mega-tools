<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="stock-split-calculator-shares">Shares owned</label><input class="input" id="stock-split-calculator-shares" type="number" min="0" step="any" value="100"></div>
    <div class="field"><label for="stock-split-calculator-price">Price per share ($)</label><input class="input" id="stock-split-calculator-price" type="number" min="0" step="any" value="400"></div>
    <div class="field"><label for="stock-split-calculator-ratio">Split ratio</label><select class="input select" id="stock-split-calculator-ratio">
      <option value="2:1">2-for-1 (2:1)</option>
      <option value="3:1">3-for-1 (3:1)</option>
      <option value="4:1" selected>4-for-1 (4:1)</option>
      <option value="5:1">5-for-1 (5:1)</option>
      <option value="10:1">10-for-1 (10:1)</option>
      <option value="3:2">3-for-2 (3:2)</option>
      <option value="1:10">1-for-10 reverse (1:10)</option>
    </select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="stock-split-calculator-calc">Calculate</button></div>
  <div class="error" id="stock-split-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="stock-split-calculator-newshares">—</div><div class="l">New shares</div></div>
    <div class="stat-card"><div class="v" id="stock-split-calculator-newprice">—</div><div class="l">New price / share</div></div>
    <div class="stat-card"><div class="v" id="stock-split-calculator-before">—</div><div class="l">Value before</div></div>
    <div class="stat-card"><div class="v" id="stock-split-calculator-after">—</div><div class="l">Value after</div></div>
  </div>
  <p class="note" id="stock-split-calculator-proof"></p>
</div>
