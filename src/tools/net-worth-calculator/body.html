<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="nw-cash">Cash &amp; savings ($)</label><input type="number" class="input" id="nw-cash" min="0" step="any" placeholder="15000"></div>
    <div class="field"><label for="nw-invest">Investments ($)</label><input type="number" class="input" id="nw-invest" min="0" step="any" placeholder="40000"></div>
    <div class="field"><label for="nw-retire">Retirement accounts ($)</label><input type="number" class="input" id="nw-retire" min="0" step="any" placeholder="60000"></div>
    <div class="field"><label for="nw-home">Home value ($)</label><input type="number" class="input" id="nw-home" min="0" step="any" placeholder="300000"></div>
    <div class="field"><label for="nw-vehicle">Vehicles &amp; other ($)</label><input type="number" class="input" id="nw-vehicle" min="0" step="any" placeholder="15000"></div>
    <div class="field"><label for="nw-mortgage">Mortgage owed ($)</label><input type="number" class="input" id="nw-mortgage" min="0" step="any" placeholder="240000"></div>
    <div class="field"><label for="nw-carloan">Car loans ($)</label><input type="number" class="input" id="nw-carloan" min="0" step="any" placeholder="8000"></div>
    <div class="field"><label for="nw-student">Student loans ($)</label><input type="number" class="input" id="nw-student" min="0" step="any" placeholder="20000"></div>
    <div class="field"><label for="nw-cards">Credit cards ($)</label><input type="number" class="input" id="nw-cards" min="0" step="any" placeholder="3000"></div>
    <div class="field"><label for="nw-otherdebt">Other debt ($)</label><input type="number" class="input" id="nw-otherdebt" min="0" step="any" placeholder="0"></div>
  </div>
  <div class="error" id="net-worth-calculator-error"></div>
  <div class="result" id="nw-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="nw-net">–</div><div class="l">Net worth</div></div>
      <div class="stat-card"><div class="v" id="nw-assets">–</div><div class="l">Total assets</div></div>
      <div class="stat-card"><div class="v" id="nw-debts">–</div><div class="l">Total liabilities</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Category</th><th>Amount</th></tr></thead>
      <tbody id="nw-body"><tr><td colspan="2" class="muted">Enter your assets and debts.</td></tr></tbody>
    </table>
  </div>
</div>
