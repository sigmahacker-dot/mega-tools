<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="add-subtract-days-calculator-start">Start date</label>
      <input type="date" class="input" id="add-subtract-days-calculator-start">
    </div>
    <div class="field">
      <label for="add-subtract-days-calculator-op">Operation</label>
      <select class="select" id="add-subtract-days-calculator-op">
        <option value="add">Add (+)</option>
        <option value="sub">Subtract (−)</option>
      </select>
    </div>
    <div class="field">
      <label for="add-subtract-days-calculator-amt">Amount</label>
      <input type="number" class="input" id="add-subtract-days-calculator-amt" min="0" max="100000" step="1" placeholder="e.g. 90">
    </div>
    <div class="field">
      <label for="add-subtract-days-calculator-unit">Unit</label>
      <select class="select" id="add-subtract-days-calculator-unit">
        <option value="days">Days</option>
        <option value="weeks">Weeks</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select>
    </div>
  </div>
  <div class="field" style="margin-top:10px;">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input type="checkbox" id="add-subtract-days-calculator-biz" style="width:18px;height:18px;">
      Business days only (skip weekends — applies to days)
    </label>
  </div>
  <div class="error" id="add-subtract-days-calculator-error"></div>
  <div class="result" id="add-subtract-days-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="add-subtract-days-calculator-res" style="font-size:1.2rem;">–</div><div class="l">Resulting date</div></div>
      <div class="stat-card"><div class="v" id="add-subtract-days-calculator-dow">–</div><div class="l">Day of week</div></div>
      <div class="stat-card"><div class="v" id="add-subtract-days-calculator-fromtoday">–</div><div class="l">Days from today</div></div>
    </div>
    <p class="note" id="add-subtract-days-calculator-steps">Choose a start date and an amount.</p>
  </div>
</div>
