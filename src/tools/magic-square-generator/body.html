<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="magic-square-generator-n">Order n</label>
      <select class="select" id="magic-square-generator-n">
        <option value="3" selected>3 (Lo Shu)</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </div>
    <div class="field" style="align-self:end">
      <button type="button" class="btn" id="magic-square-generator-gen">Generate</button>
    </div>
  </div>
  <div class="error" id="magic-square-generator-error"></div>
  <div id="magic-square-generator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="magic-square-generator-const">–</div><div class="l">Magic constant</div></div>
      <div class="stat-card"><div class="v" id="magic-square-generator-verdict">–</div><div class="l">Verification</div></div>
    </div>
    <div class="result">
      <div id="magic-square-generator-grid" style="overflow-x:auto"></div>
    </div>
    <div class="result">
      <h3>Method</h3>
      <div id="magic-square-generator-steps"></div>
    </div>
  </div>
</div>
