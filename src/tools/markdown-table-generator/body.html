<div class="tool-card">
  <div class="field">
    <label for="markdown-table-generator-input">Rows — comma or tab separated, one row per line</label>
    <textarea class="textarea" id="markdown-table-generator-input" rows="6" placeholder="Name, Age, City&#10;Ali, 30, Lahore&#10;Sara, 25, Karachi"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="markdown-table-generator-header">First row is header</label>
      <select class="input" id="markdown-table-generator-header">
        <option value="yes">Yes — use as header</option>
        <option value="no">No — data only</option>
      </select>
    </div>
    <div class="field">
      <label for="markdown-table-generator-align">Alignment</label>
      <select class="input" id="markdown-table-generator-align">
        <option value="left">Left</option>
        <option value="center">Center</option>
        <option value="right">Right</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="markdown-table-generator-run">Generate table</button>
  </div>
  <div class="field">
    <label>Markdown output</label>
    <div class="result"><pre class="data" id="markdown-table-generator-output" style="overflow-x:auto"></pre></div>
    <div class="copy-row"><button class="btn btn-outline" id="markdown-table-generator-copy">Copy markdown</button></div>
  </div>
  <div class="error" id="markdown-table-generator-error"></div>
</div>
