<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="retirement-withdrawal-calculator-balance">Starting balance ($)</label><input class="input" id="retirement-withdrawal-calculator-balance" type="number" min="0" step="any" value="1000000"></div>
    <div class="field"><label for="retirement-withdrawal-calculator-withdraw">Annual withdrawal ($)</label><input class="input" id="retirement-withdrawal-calculator-withdraw" type="number" min="0" step="any" value="40000"></div>
    <div class="field"><label for="retirement-withdrawal-calculator-return">Annual return (%)</label><input class="input" id="retirement-withdrawal-calculator-return" type="number" step="any" value="5"></div>
    <div class="field"><label for="retirement-withdrawal-calculator-inflation">Annual inflation (%)</label><input class="input" id="retirement-withdrawal-calculator-inflation" type="number" step="any" value="2.5"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="retirement-withdrawal-calculator-calc">Simulate</button></div>
  <div class="error" id="retirement-withdrawal-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="retirement-withdrawal-calculator-years">—</div><div class="l">Years funded</div></div>
    <div class="stat-card"><div class="v" id="retirement-withdrawal-calculator-total">—</div><div class="l">Total withdrawn</div></div>
  </div>
  <div style="overflow:auto;max-height:320px"><table class="data" id="retirement-withdrawal-calculator-table"></table></div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
