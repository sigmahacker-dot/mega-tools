<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="wa-num">Phone number <span class="hint">(country code + number, digits only)</span></label><input type="tel" class="input" id="wa-num" placeholder="15550102030"></div>
    <div class="field"><label for="wa-msg">Pre-filled message <span class="hint">(optional)</span></label><input type="text" class="input" id="wa-msg" placeholder="Hi! I saw your listing."></div>
  </div>
  <div class="error" id="whatsapp-link-generator-error"></div>
  <div class="result" id="wa-result">
    <div class="field"><label for="wa-out">Generated link</label><input type="text" class="input" id="wa-out" readonly></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="wa-open" href="https://wa.me/" target="_blank" rel="noopener">Open chat</a>
      <button class="btn btn-outline" id="wa-copy" type="button">Copy link</button>
    </div>
  </div>
</div>
