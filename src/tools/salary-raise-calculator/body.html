<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="salary-raise-calculator-salary">Current annual salary ($)</label><input class="input" id="salary-raise-calculator-salary" type="number" min="0" step="any" value="75000"></div>
    <div class="field"><label for="salary-raise-calculator-raise">Raise (%)</label><input class="input" id="salary-raise-calculator-raise" type="number" min="0" step="any" value="5"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="salary-raise-calculator-calc">Calculate</button></div>
  <div class="error" id="salary-raise-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="salary-raise-calculator-new">—</div><div class="l">New salary</div></div>
    <div class="stat-card"><div class="v" id="salary-raise-calculator-annual">—</div><div class="l">Annual increase</div></div>
    <div class="stat-card"><div class="v" id="salary-raise-calculator-monthly">—</div><div class="l">Monthly increase</div></div>
    <div class="stat-card"><div class="v" id="salary-raise-calculator-newmonthly">—</div><div class="l">New monthly pay</div></div>
  </div>
  <p class="hint">Gross pay before taxes and deductions.</p>
</div>
