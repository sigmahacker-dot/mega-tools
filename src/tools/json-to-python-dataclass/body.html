<div class="tool-card">
  <div class="field">
    <label for="json-to-python-dataclass-root">Root class name</label>
    <input class="input" id="json-to-python-dataclass-root" value="Root" style="max-width:280px">
  </div>
  <div class="field">
    <label for="json-to-python-dataclass-input">JSON</label>
    <textarea class="textarea" id="json-to-python-dataclass-input" rows="8" style="font-family:monospace">{
  "id": 42,
  "name": "Ada Lovelace",
  "active": true,
  "score": 98.6,
  "tags": ["admin", "beta"],
  "address": { "city": "Lahore", "zip": "54000" },
  "manager": null
}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn" id="json-to-python-dataclass-generate">Generate dataclass</button>
  </div>
  <div class="error" id="json-to-python-dataclass-error"></div>
  <div class="field">
    <label for="json-to-python-dataclass-output">Python</label>
    <textarea class="textarea" id="json-to-python-dataclass-output" rows="16" readonly style="font-family:monospace"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="json-to-python-dataclass-copy">Copy code</button>
    <button class="btn btn-outline" id="json-to-python-dataclass-download">Download models.py</button>
  </div>
</div>
