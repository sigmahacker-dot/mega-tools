<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="beaufort-scale-converter-speed">Wind speed</label>
      <input type="number" step="any" min="0" class="input" id="beaufort-scale-converter-speed" placeholder="e.g. 45">
    </div>
    <div class="field">
      <label for="beaufort-scale-converter-unit">Unit</label>
      <select class="select" id="beaufort-scale-converter-unit">
        <option value="kmh" selected>km/h</option>
        <option value="mph">mph</option>
        <option value="kt">knots</option>
        <option value="ms">m/s</option>
      </select>
    </div>
  </div>
  <div class="error" id="beaufort-scale-converter-error"></div>
  <div class="result" id="beaufort-scale-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="beaufort-scale-converter-num">–</div><div class="l">Beaufort number</div></div>
      <div class="stat-card"><div class="v" id="beaufort-scale-converter-term">–</div><div class="l">Term</div></div>
    </div>
    <p class="note" id="beaufort-scale-converter-land"></p>
    <p class="note" id="beaufort-scale-converter-sea"></p>
    <table class="data">
      <thead><tr><th>Force</th><th>km/h</th><th>Term</th></tr></thead>
      <tbody id="beaufort-scale-converter-table"></tbody>
    </table>
  </div>
</div>
