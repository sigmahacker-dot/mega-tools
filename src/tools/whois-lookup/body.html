<div class="tool-card">
  <div class="error" id="whois-lookup-error"></div>
  <div class="field">
    <label for="whois-lookup-domain">Domain</label>
    <input class="input" id="whois-lookup-domain" type="text" placeholder="example.com" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="whois-lookup-lookup" type="button">Look Up</button>
  </div>
  <div class="result hidden" id="whois-lookup-summary">
    <table class="data" id="whois-lookup-table"><tbody></tbody></table>
  </div>
  <div class="result hidden" id="whois-lookup-raw">
    <p class="muted">Raw WHOIS record</p>
    <pre id="whois-lookup-text"></pre>
  </div>
  <p class="note">Some registries redact owner details for privacy; those fields simply won't appear.</p>
</div>
