<div class="tool-card">
  <div class="field">
    <label for="twitter-counter-input">Compose your post</label>
    <textarea class="textarea" id="twitter-counter-input" rows="5" placeholder="What's happening?" maxlength="2000"></textarea>
  </div>
  <div class="error" id="twitter-counter-error"></div>
  <div class="stat-cards mt">
    <div class="stat-card"><div class="v" id="twitter-counter-weighted">0</div><div class="l">Weighted chars / 280</div></div>
    <div class="stat-card"><div class="v" id="twitter-counter-left">280</div><div class="l">Remaining</div></div>
    <div class="stat-card"><div class="v" id="twitter-counter-urls">0</div><div class="l">URLs (×23)</div></div>
  </div>
  <div class="result mt">
    <div class="field">
      <label>Limit usage</label>
      <div style="background:rgba(0,0,0,.12);border-radius:8px;height:14px;overflow:hidden;"><div id="twitter-counter-bar" style="height:100%;width:0%;background:#1d9bf0;transition:width .15s;"></div></div>
    </div>
    <p class="note">Weighted count = text with each URL replaced by 23 chars (t.co rule). Emoji count by their UTF-16 code units, as X does.</p>
  </div>
</div>
