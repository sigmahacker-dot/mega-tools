<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="dy-div">Annual dividend per share ($)</label><input type="number" class="input" id="dy-div" min="0" step="any" placeholder="2.00"></div>
    <div class="field"><label for="dy-price">Share price ($)</label><input type="number" class="input" id="dy-price" min="0" step="any" placeholder="50"></div>
    <div class="field"><label for="dy-shares">Shares owned</label><input type="number" class="input" id="dy-shares" min="0" step="any" placeholder="100"></div>
  </div>
  <div class="error" id="dividend-yield-calculator-error"></div>
  <div class="result" id="dy-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="dy-yield">–</div><div class="l">Dividend yield</div></div>
      <div class="stat-card"><div class="v" id="dy-annual">–</div><div class="l">Annual income</div></div>
      <div class="stat-card"><div class="v" id="dy-monthly">–</div><div class="l">Monthly income</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Period</th><th>Dividend income</th></tr></thead>
      <tbody id="dy-body"><tr><td colspan="2" class="muted">Enter dividend details.</td></tr></tbody>
    </table>
    <p class="note">Before taxes and fees. Dividends are not guaranteed and can be cut.</p>
  </div>
</div>
