<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="hat-size-converter-circ">Head circumference</label>
      <input type="number" step="any" min="0" class="input" id="hat-size-converter-circ" placeholder="e.g. 57">
    </div>
    <div class="field">
      <label for="hat-size-converter-units">Measured in</label>
      <select class="select" id="hat-size-converter-units">
        <option value="cm" selected>Centimetres</option>
        <option value="in">Inches</option>
      </select>
    </div>
  </div>
  <div class="error" id="hat-size-converter-error"></div>
  <div class="result" id="hat-size-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="hat-size-converter-us">–</div><div class="l">US / UK size</div></div>
      <div class="stat-card"><div class="v" id="hat-size-converter-eu">–</div><div class="l">EU size (cm)</div></div>
      <div class="stat-card"><div class="v" id="hat-size-converter-jp">–</div><div class="l">JP size (cm)</div></div>
    </div>
    <table class="data">
      <thead><tr><th>US / UK</th><th>Inches</th><th>CM</th></tr></thead>
      <tbody id="hat-size-converter-table"></tbody>
    </table>
    <p class="note">Measure around your head just above the eyebrows and ears. Sizes between standards: round up for comfort.</p>
  </div>
</div>
