<div class="tool-card">
  <p class="muted">Solves <span style="font-family:monospace">ax + b = c</span></p>
  <div class="grid2">
    <div class="field"><label for="linear-equation-solver-a">a</label><input class="input" id="linear-equation-solver-a" type="number" value="3" step="any"></div>
    <div class="field"><label for="linear-equation-solver-b">b</label><input class="input" id="linear-equation-solver-b" type="number" value="5" step="any"></div>
    <div class="field"><label for="linear-equation-solver-c">c</label><input class="input" id="linear-equation-solver-c" type="number" value="20" step="any"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="linear-equation-solver-go">Solve</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="linear-equation-solver-x">5</div><div class="l">x =</div></div>
  </div>
  <div class="result"><pre class="code" id="linear-equation-solver-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="linear-equation-solver-error"></div>
</div>
