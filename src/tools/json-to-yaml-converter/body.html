<div class="tool-card">
  <div class="field">
    <label for="json-to-yaml-converter-input">JSON input</label>
    <textarea class="textarea" id="json-to-yaml-converter-input" rows="10" placeholder='Paste JSON here, e.g. {"server": {"port": 8080}}'></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="json-to-yaml-converter-indent">Indent</label>
      <select class="input" id="json-to-yaml-converter-indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button class="btn btn-primary" id="json-to-yaml-converter-convert">Convert to YAML</button>
        <button class="btn btn-outline" id="json-to-yaml-converter-sample">Load sample</button>
      </div>
    </div>
  </div>
  <div class="error" id="json-to-yaml-converter-error"></div>
  <div class="field">
    <label for="json-to-yaml-converter-output">YAML output</label>
    <textarea class="textarea" id="json-to-yaml-converter-output" rows="10" readonly placeholder="YAML will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="json-to-yaml-converter-copy">Copy YAML</button>
    <button class="btn btn-outline" id="json-to-yaml-converter-download">Download .yaml</button>
  </div>
</div>
