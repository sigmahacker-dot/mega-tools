<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="tire-size-calculator-w1">Current — width (mm)</label>
      <input type="number" class="input" id="tire-size-calculator-w1" step="any" min="1" placeholder="e.g. 205">
    </div>
    <div class="field">
      <label for="tire-size-calculator-a1">Current — aspect ratio (%)</label>
      <input type="number" class="input" id="tire-size-calculator-a1" step="any" min="1" placeholder="e.g. 55">
    </div>
    <div class="field">
      <label for="tire-size-calculator-r1">Current — rim (inches)</label>
      <input type="number" class="input" id="tire-size-calculator-r1" step="any" min="1" placeholder="e.g. 16">
    </div>
    <div class="field">
      <label for="tire-size-calculator-w2">New — width (mm)</label>
      <input type="number" class="input" id="tire-size-calculator-w2" step="any" min="1" placeholder="e.g. 225">
    </div>
    <div class="field">
      <label for="tire-size-calculator-a2">New — aspect ratio (%)</label>
      <input type="number" class="input" id="tire-size-calculator-a2" step="any" min="1" placeholder="e.g. 45">
    </div>
    <div class="field">
      <label for="tire-size-calculator-r2">New — rim (inches)</label>
      <input type="number" class="input" id="tire-size-calculator-r2" step="any" min="1" placeholder="e.g. 17">
    </div>
  </div>
  <div class="error" id="tire-size-calculator-error"></div>
  <div class="result" id="tire-size-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="tire-size-calculator-diff">–</div><div class="l">Diameter difference</div></div>
      <div class="stat-card"><div class="v" id="tire-size-calculator-speedo">–</div><div class="l">True speed at 100 km/h indicated</div></div>
      <div class="stat-card"><div class="v" id="tire-size-calculator-safe">–</div><div class="l">Within ±3%?</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Spec</th><th>Current tire</th><th>New tire</th></tr></thead>
      <tbody id="tire-size-calculator-body">
        <tr><td colspan="3" class="muted">Enter both tire sizes to compare.</td></tr>
      </tbody>
    </table>
    <p class="note">Speedometer assumes the current tire. A larger new tire makes the speedo read lower than your true speed.</p>
  </div>
</div>
