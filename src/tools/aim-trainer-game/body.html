<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:560px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="aim-trainer-game-score">0</div><div class="l">Hits</div></div>
    <div class="stat-card"><div class="v" id="aim-trainer-game-miss">0</div><div class="l">Misses</div></div>
    <div class="stat-card"><div class="v" id="aim-trainer-game-acc">–</div><div class="l">Accuracy</div></div>
    <div class="stat-card"><div class="v" id="aim-trainer-game-time">30</div><div class="l">Seconds</div></div>
    <div class="stat-card"><div class="v" id="aim-trainer-game-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="aim-trainer-game-arena" style="position:relative;max-width:560px;height:340px;margin:0 auto;background:#1b1b2f;border-radius:12px;overflow:hidden;cursor:crosshair"></div>
  <p class="muted" id="aim-trainer-game-msg" style="min-height:24px;margin:12px 0">Press Start, then click the targets.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="aim-trainer-game-start">Start</button>
  </div>
  <div class="error" id="aim-trainer-game-error"></div>
</div>
