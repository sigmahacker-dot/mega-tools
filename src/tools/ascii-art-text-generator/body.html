<div class="tool-card">
  <div class="field">
    <label for="ascii-art-text-generator-input">Text (A–Z, 0–9)</label>
    <input class="input" type="text" id="ascii-art-text-generator-input" placeholder="HELLO" maxlength="24" autocomplete="off">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="ascii-art-text-generator-font">Font</label>
      <select class="input" id="ascii-art-text-generator-font">
        <option value="block">Block — bold filled</option>
        <option value="banner">Banner — wide display</option>
        <option value="small">Small — compact</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btn-row"><button class="btn btn-primary" id="ascii-art-text-generator-run">Generate</button></div>
    </div>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><pre class="data" id="ascii-art-text-generator-output" style="font-size:12px;line-height:1.2;overflow-x:auto"></pre></div>
    <div class="copy-row"><button class="btn btn-outline" id="ascii-art-text-generator-copy">Copy ASCII art</button></div>
  </div>
  <div class="error" id="ascii-art-text-generator-error"></div>
</div>
