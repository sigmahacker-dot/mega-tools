<div class="tool-card" style="text-align:center">
  <div class="grid2" style="max-width:440px;margin:0 auto 12px;text-align:left">
    <div class="field">
      <label for="breathing-exercise-guide-pattern">Pattern</label>
      <select class="input" id="breathing-exercise-guide-pattern">
        <option value="478">4-7-8 Calming (in 4 · hold 7 · out 8)</option>
        <option value="box">Box breathing (4 · 4 · 4 · 4)</option>
        <option value="energize">Energize (in 4 · hold 2 · out 6)</option>
      </select>
    </div>
    <div class="field">
      <label for="breathing-exercise-guide-cycles">Cycles</label>
      <input class="input" id="breathing-exercise-guide-cycles" type="number" min="1" max="30" step="1" value="4">
    </div>
  </div>
  <div style="height:220px;display:flex;align-items:center;justify-content:center">
    <div id="breathing-exercise-guide-circle" style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #81c784, #2e7d32);transition:width 1s linear,height 1s linear,opacity 1s linear;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold"></div>
  </div>
  <p style="font-size:1.4em;font-weight:bold;min-height:32px" id="breathing-exercise-guide-phase">Ready</p>
  <p class="muted" id="breathing-exercise-guide-count">Cycle 0 / 4</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="breathing-exercise-guide-start">Start</button>
    <button class="btn btn-outline" id="breathing-exercise-guide-stop">Stop</button>
  </div>
  <p class="note" style="text-align:left">General information only — not medical advice. Consult a professional for personal guidance. Breathe through your nose and stop if you feel dizzy.</p>
  <div class="error" id="breathing-exercise-guide-error"></div>
</div>
