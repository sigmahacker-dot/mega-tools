<div class="tool-card">
  <div class="field">
    <label for="text-stroke-generator-text">Text</label>
    <input class="input" id="text-stroke-generator-text" value="OUTLINED">
  </div>
  <div class="grid3">
    <div class="field">
      <label for="text-stroke-generator-width">Stroke width (px)</label>
      <input class="input" id="text-stroke-generator-width" type="number" value="2" min="1" max="12" step="0.5">
    </div>
    <div class="field">
      <label for="text-stroke-generator-stroke">Stroke color</label>
      <input class="input" id="text-stroke-generator-stroke" type="color" value="#4d7c0f">
    </div>
    <div class="field">
      <label for="text-stroke-generator-fill">Fill color</label>
      <input class="input" id="text-stroke-generator-fill" type="color" value="#ffffff">
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="text-stroke-generator-size">Font size (px)</label>
      <input class="input" id="text-stroke-generator-size" type="number" value="72" min="12" max="200">
    </div>
    <div class="field checkline" style="align-self:end">
      <input type="checkbox" id="text-stroke-generator-transparent">
      <label for="text-stroke-generator-transparent">Transparent fill (hollow)</label>
    </div>
  </div>
  <div class="field">
    <label>Live preview</label>
    <div id="text-stroke-generator-preview" style="border:1px solid #27272a;border-radius:12px;padding:40px 16px;background:#18181b;text-align:center;overflow:hidden"></div>
  </div>
  <div class="error" id="text-stroke-generator-error"></div>
  <div class="field">
    <label for="text-stroke-generator-output">CSS</label>
    <textarea class="textarea" id="text-stroke-generator-output" rows="10" readonly></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="text-stroke-generator-copy">Copy CSS</button>
    <button class="btn btn-outline" id="text-stroke-generator-download">Download .css</button>
  </div>
</div>
