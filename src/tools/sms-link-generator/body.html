<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="sms-num">Phone number</label><input type="tel" class="input" id="sms-num" placeholder="+1 555 010 2030"></div>
    <div class="field"><label for="sms-msg">Message <span class="hint">(optional)</span></label><input type="text" class="input" id="sms-msg" placeholder="Hi! Just checking in."></div>
  </div>
  <div class="error" id="sms-link-generator-error"></div>
  <div class="result" id="sms-result">
    <div class="field"><label for="sms-out">Generated link</label><input type="text" class="input" id="sms-out" readonly></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="sms-open" href="sms:">Test SMS link</a>
      <button class="btn btn-outline" id="sms-copy" type="button">Copy link</button>
    </div>
    <p class="note">On iPhone the link opens as <span class="muted">sms:+1555...&amp;body=...</span> — both forms are handled automatically.</p>
  </div>
</div>
