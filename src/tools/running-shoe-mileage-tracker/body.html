<div class="tool-card">
  <div class="field">
    <label for="running-shoe-mileage-tracker-name">Shoe name</label>
    <div class="btn-row" style="justify-content:flex-start">
      <input class="input" id="running-shoe-mileage-tracker-name" type="text" placeholder="e.g. Nike Pegasus 41" style="flex:1">
      <button class="btn btn-primary" id="running-shoe-mileage-tracker-add">Add shoe</button>
    </div>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="running-shoe-mileage-tracker-shoe">Shoe</label>
      <select class="input" id="running-shoe-mileage-tracker-shoe"></select>
    </div>
    <div class="field">
      <label for="running-shoe-mileage-tracker-date">Run date</label>
      <input class="input" id="running-shoe-mileage-tracker-date" type="date">
    </div>
    <div class="field">
      <label for="running-shoe-mileage-tracker-km">Distance (km)</label>
      <input class="input" id="running-shoe-mileage-tracker-km" type="number" min="0.1" step="0.1" placeholder="e.g. 8.5">
    </div>
    <div class="field" style="align-self:end">
      <button class="btn" id="running-shoe-mileage-tracker-log">Log run</button>
    </div>
  </div>
  <div class="result" id="running-shoe-mileage-tracker-list"></div>
  <p class="note">General information only — not medical advice. Consult a professional for personal guidance. Replace shoes flagged past 500 km — worn cushioning raises injury risk.</p>
  <div class="error" id="running-shoe-mileage-tracker-error"></div>
</div>
