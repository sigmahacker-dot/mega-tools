<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="modular-arithmetic-calculator-a">a</label>
      <input type="number" class="input" id="modular-arithmetic-calculator-a" step="1" placeholder="e.g. 17">
    </div>
    <div class="field">
      <label for="modular-arithmetic-calculator-b">b</label>
      <input type="number" class="input" id="modular-arithmetic-calculator-b" step="1" placeholder="e.g. 5">
    </div>
    <div class="field">
      <label for="modular-arithmetic-calculator-m">Modulus m</label>
      <input type="number" class="input" id="modular-arithmetic-calculator-m" step="1" min="1" placeholder="e.g. 12">
    </div>
    <div class="field">
      <label for="modular-arithmetic-calculator-op">Operation</label>
      <select class="select" id="modular-arithmetic-calculator-op">
        <option value="add">(a + b) mod m</option>
        <option value="sub">(a − b) mod m</option>
        <option value="mul">(a × b) mod m</option>
        <option value="pow" selected>a^b mod m</option>
        <option value="gcd">gcd(a, b)</option>
        <option value="inv">a⁻¹ mod m (inverse)</option>
      </select>
    </div>
  </div>
  <div class="error" id="modular-arithmetic-calculator-error"></div>
  <div class="result" id="modular-arithmetic-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="modular-arithmetic-calculator-res">–</div><div class="l">Result</div></div>
      <div class="stat-card"><div class="v" id="modular-arithmetic-calculator-gcdv">–</div><div class="l">gcd(a, m)</div></div>
    </div>
    <p class="note" id="modular-arithmetic-calculator-steps">Enter a, b and m to compute.</p>
  </div>
</div>
