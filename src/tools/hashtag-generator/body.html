<div class="tool-card">
  <div class="field">
    <label for="hashtag-generator-input">Keyword</label>
    <input class="input" id="hashtag-generator-input" type="text" placeholder="e.g. travel, fitness, food..." maxlength="40">
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="hashtag-generator-generate" type="button">Generate Hashtags</button>
    <button class="btn btn-outline" id="hashtag-generator-copyall" type="button">Copy All</button>
  </div>
  <div class="error" id="hashtag-generator-error"></div>
  <div class="mt" id="hashtag-generator-list"></div>
  <p class="note">Template-based suggestions — check what's trending manually before posting.</p>
</div>
