<div class="tool-card">
  <div class="field">
    <label for="sparkles-text-decorator-input">Your text</label>
    <input class="input" type="text" id="sparkles-text-decorator-input" placeholder="Type something cute" maxlength="80" autocomplete="off">
  </div>
  <div class="field">
    <label>Choose a style — click to preview</label>
    <div id="sparkles-text-decorator-styles" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  </div>
  <div class="field">
    <label>Preview</label>
    <div class="result"><div class="data" id="sparkles-text-decorator-output" style="white-space:pre-wrap;font-size:1.2em"></div></div>
    <div class="copy-row"><button class="btn btn-outline" id="sparkles-text-decorator-copy">Copy decorated text</button></div>
  </div>
  <div class="error" id="sparkles-text-decorator-error"></div>
</div>
