<div class="tool-card" style="max-width:640px;margin:0 auto">
  <div class="grid3">
    <div class="field" style="text-align:left">
      <label for="scrabble-word-finder-rack">Your rack (? = blank)</label>
      <input class="input" id="scrabble-word-finder-rack" maxlength="15" placeholder="e.g. AEINRST" style="text-transform:uppercase;letter-spacing:3px">
    </div>
    <div class="field" style="text-align:left">
      <label for="scrabble-word-finder-minlen">Min length</label>
      <select class="input" id="scrabble-word-finder-minlen">
        <option value="2">2</option><option value="3">3</option><option value="4" selected>4</option>
        <option value="5">5</option><option value="6">6</option><option value="7">7</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="scrabble-word-finder-find" style="width:100%">Find plays</button>
    </div>
  </div>
  <p class="muted" id="scrabble-word-finder-status" style="min-height:24px"></p>
  <div class="result hidden" id="scrabble-word-finder-result" style="max-height:380px;overflow:auto"></div>
  <p class="note">Dictionary: 5,200 common English words. Scores use standard tile values; blanks (?) score 0. Board bonuses aren't included — this ranks raw word value.</p>
  <div class="error" id="scrabble-word-finder-error"></div>
</div>
