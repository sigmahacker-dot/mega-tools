<div class="tool-card" style="max-width:560px;margin:0 auto">
  <div class="field">
    <label for="scrabble-score-calculator-word">Word (letters only)</label>
    <input class="input" id="scrabble-score-calculator-word" maxlength="15" placeholder="e.g. QUIZZES" style="text-transform:uppercase;font-size:20px;letter-spacing:4px">
  </div>
  <div id="scrabble-score-calculator-tiles" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"></div>
  <div class="grid3">
    <div class="field" style="text-align:left">
      <label for="scrabble-score-calculator-wordmult">Word multiplier</label>
      <select class="input" id="scrabble-score-calculator-wordmult">
        <option value="1">None</option>
        <option value="2">Double word (DW)</option>
        <option value="3">Triple word (TW)</option>
        <option value="4">Double + Double</option>
        <option value="6">Double + Triple</option>
        <option value="9">Triple + Triple</option>
      </select>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <label class="checkline"><input type="checkbox" id="scrabble-score-calculator-bingo"> Bingo (all 7 tiles, +50)</label>
    </div>
    <div class="field" style="text-align:left">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="scrabble-score-calculator-calc" style="width:100%">Calculate</button>
    </div>
  </div>
  <div class="result hidden" id="scrabble-score-calculator-result" style="margin-top:10px"></div>
  <div class="error" id="scrabble-score-calculator-error"></div>
</div>
