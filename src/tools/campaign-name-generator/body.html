<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="campaign-name-generator-brand">Brand</label><input type="text" class="input" id="campaign-name-generator-brand" placeholder="e.g. Travel With Rawi" maxlength="40"></div>
    <div class="field"><label for="campaign-name-generator-campaign">Campaign</label><input type="text" class="input" id="campaign-name-generator-campaign" placeholder="e.g. Summer Sale" maxlength="40"></div>
    <div class="field"><label for="campaign-name-generator-channel">Channel</label>
      <select class="select" id="campaign-name-generator-channel">
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="google">Google Ads</option>
        <option value="tiktok">TikTok</option>
        <option value="email">Email</option>
        <option value="youtube">YouTube</option>
        <option value="linkedin">LinkedIn</option>
        <option value="organic">Organic</option>
      </select>
    </div>
    <div class="field"><label for="campaign-name-generator-date">Date (optional)</label><input type="date" class="input" id="campaign-name-generator-date" value="2026-10-01"></div>
  </div>
  <div class="error" id="campaign-name-generator-error"></div>
  <div class="result mt">
    <table class="data">
      <thead><tr><th>Format</th><th>Generated name</th><th></th></tr></thead>
      <tbody id="campaign-name-generator-body"><tr><td colspan="3" class="muted">Enter brand and campaign to generate names.</td></tr></tbody>
    </table>
    <p class="note">Names are sanitized: lowercased, accents stripped, spaces converted per format, special characters removed.</p>
  </div>
</div>
