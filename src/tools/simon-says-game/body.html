<div class="tool-card" style="text-align:center">
  <div class="stat-cards" style="max-width:420px;margin:0 auto 12px">
    <div class="stat-card"><div class="v" id="simon-says-game-level">–</div><div class="l">Level</div></div>
    <div class="stat-card"><div class="v" id="simon-says-game-best">0</div><div class="l">Best</div></div>
  </div>
  <div id="simon-says-game-board" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;margin:0 auto">
    <button id="simon-says-game-p0" style="aspect-ratio:1;border:none;border-radius:16px;background:#c62828;opacity:.55;cursor:pointer" aria-label="Red pad"></button>
    <button id="simon-says-game-p1" style="aspect-ratio:1;border:none;border-radius:16px;background:#1565c0;opacity:.55;cursor:pointer" aria-label="Blue pad"></button>
    <button id="simon-says-game-p2" style="aspect-ratio:1;border:none;border-radius:16px;background:#2e7d32;opacity:.55;cursor:pointer" aria-label="Green pad"></button>
    <button id="simon-says-game-p3" style="aspect-ratio:1;border:none;border-radius:16px;background:#f9a825;opacity:.55;cursor:pointer" aria-label="Yellow pad"></button>
  </div>
  <p class="muted" id="simon-says-game-msg" style="min-height:24px;margin:12px 0">Press Start to play.</p>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" id="simon-says-game-start">Start</button>
  </div>
  <div class="error" id="simon-says-game-error"></div>
</div>
