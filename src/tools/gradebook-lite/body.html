<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="gradebook-lite-name">Assignment</label>
      <input class="input" type="text" id="gradebook-lite-name" placeholder="e.g. Midterm">
    </div>
    <div class="field">
      <label for="gradebook-lite-score">Score earned</label>
      <input class="input" type="number" id="gradebook-lite-score" min="0" step="0.5" placeholder="85">
    </div>
    <div class="field">
      <label for="gradebook-lite-max">Max points</label>
      <input class="input" type="number" id="gradebook-lite-max" min="0" step="0.5" placeholder="100">
    </div>
    <div class="field">
      <label for="gradebook-lite-weight">Weight %</label>
      <input class="input" type="number" id="gradebook-lite-weight" min="0" max="100" step="0.5" placeholder="30">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="gradebook-lite-add">Add Assignment</button>
    <button class="btn btn-outline" id="gradebook-lite-clear">Clear All</button>
  </div>
  <div class="error" id="gradebook-lite-error"></div>
</div>

<div class="tool-card">
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="gradebook-lite-grade">—</div><div class="l">Weighted grade</div></div>
    <div class="stat-card"><div class="v" id="gradebook-lite-letter">—</div><div class="l">Letter</div></div>
    <div class="stat-card"><div class="v" id="gradebook-lite-wsum">0%</div><div class="l">Total weight</div></div>
  </div>
  <div id="gradebook-lite-list"></div>
</div>

<div class="tool-card">
  <h3>What-if tester</h3>
  <div class="grid3">
    <div class="field">
      <label for="gradebook-lite-wname">Assignment name</label>
      <input class="input" type="text" id="gradebook-lite-wname" placeholder="e.g. Final">
    </div>
    <div class="field">
      <label for="gradebook-lite-wscore">Hypothetical score %</label>
      <input class="input" type="number" id="gradebook-lite-wscore" min="0" max="100" step="0.5" placeholder="90">
    </div>
    <div class="field">
      <label for="gradebook-lite-ww">Weight %</label>
      <input class="input" type="number" id="gradebook-lite-ww" min="0" max="100" step="0.5" placeholder="25">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="gradebook-lite-test">Test What-If</button>
  </div>
  <div class="result" id="gradebook-lite-wresult" style="margin-top:10px"></div>
</div>
