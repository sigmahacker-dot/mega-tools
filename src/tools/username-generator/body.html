<div class="tool-card">
  <div class="field">
    <label for="username-generator-keyword">Keyword or name</label>
    <input class="input" id="username-generator-keyword" type="text" maxlength="24" placeholder="e.g. rawi, pixel, falcon">
  </div>
  <div class="field">
    <label for="username-generator-style">Style</label>
    <select class="select" id="username-generator-style">
      <option value="gamer">Gamer</option>
      <option value="professional">Professional</option>
      <option value="aesthetic">Aesthetic</option>
      <option value="funny">Funny</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="username-generator-generate">Generate Usernames</button>
  </div>
  <div class="error" id="username-generator-error"></div>
  <div id="username-generator-list" class="file-list mt"></div>
  <p class="note">Availability must be checked manually on each platform — popular names get taken fast.</p>
</div>
