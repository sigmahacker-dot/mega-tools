<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="mulch-length">Length (ft)</label><input type="number" class="input" id="mulch-length" min="0" step="any" placeholder="20"></div>
    <div class="field"><label for="mulch-width">Width (ft)</label><input type="number" class="input" id="mulch-width" min="0" step="any" placeholder="4"></div>
    <div class="field"><label for="mulch-depth">Depth (inches)</label><input type="number" class="input" id="mulch-depth" min="0" step="any" placeholder="3"></div>
  </div>
  <div class="error" id="mulch-soil-calculator-error"></div>
  <div class="result" id="mulch-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="mulch-yards">–</div><div class="l">Cubic yards</div></div>
      <div class="stat-card"><div class="v" id="mulch-bags">–</div><div class="l">2 cu ft bags</div></div>
      <div class="stat-card"><div class="v" id="mulch-feet">–</div><div class="l">Cubic feet</div></div>
    </div>
    <p class="note">Volume = L × W × (depth ÷ 12) ft³ ÷ 27. Bag count is rounded up.</p>
  </div>
</div>
