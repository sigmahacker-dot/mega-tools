<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="voice-changer-lite-file">Audio file</label>
      <input type="file" id="voice-changer-lite-file" accept="audio/*" class="input">
    </div>
    <div class="field">
      <label>Or record</label>
      <div class="btn-row" style="margin:0">
        <button class="btn btn-outline" id="voice-changer-lite-rec">● Record</button>
        <button class="btn btn-outline hidden" id="voice-changer-lite-stop">Stop</button>
      </div>
      <span class="hint" id="voice-changer-lite-rechint">Mic recording stays in your browser.</span>
    </div>
  </div>
  <div class="grid3">
    <div class="field">
      <label for="voice-changer-lite-pitch">Pitch / speed: <span id="voice-changer-lite-pitch-val">1.00</span>×</label>
      <input type="range" id="voice-changer-lite-pitch" min="0.5" max="2" step="0.05" value="1">
      <span class="hint">Like tape: pitch and speed change together.</span>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="voice-changer-lite-robot">
      <label for="voice-changer-lite-robot">🤖 Robot (ring modulation)</label>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="voice-changer-lite-echo">
      <label for="voice-changer-lite-echo">🔁 Echo (delay)</label>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="voice-changer-lite-go">Apply effects</button>
    <button class="btn btn-outline hidden" id="voice-changer-lite-play">Play result</button>
    <button class="btn btn-outline hidden" id="voice-changer-lite-download">Download WAV</button>
  </div>
  <div class="error" id="voice-changer-lite-error"></div>
  <p class="note"><strong>Lite = honest:</strong> pitch shifts speed too (tape-style), robot is ring modulation, echo is a simple delay. No formant-shifting magic is claimed. Everything runs in your browser.</p>
</div>
