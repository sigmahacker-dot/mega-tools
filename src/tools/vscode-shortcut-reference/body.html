<div class="tool-card">
  <div class="btn-row" style="margin-bottom:12px">
    <button class="btn btn-primary" id="vscode-shortcut-reference-win">Windows / Linux</button>
    <button class="btn btn-outline" id="vscode-shortcut-reference-mac">macOS</button>
  </div>
  <div class="field">
    <label for="vscode-shortcut-reference-search">Search shortcuts</label>
    <input class="input" id="vscode-shortcut-reference-search" placeholder="e.g. comment, terminal, fold…">
    <p class="hint">Click any shortcut to copy it.</p>
  </div>
  <div class="error" id="vscode-shortcut-reference-error"></div>
  <div id="vscode-shortcut-reference-list"></div>
  <p class="muted hidden" id="vscode-shortcut-reference-none">No shortcuts match your search.</p>
</div>
