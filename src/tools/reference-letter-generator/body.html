<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="reference-letter-generator-referee">Your name (referee)</label>
      <input class="input" id="reference-letter-generator-referee" type="text" placeholder="e.g. Dr. Sarah Ahmed" maxlength="60">
    </div>
    <div class="field">
      <label for="reference-letter-generator-title">Your title</label>
      <input class="input" id="reference-letter-generator-title" type="text" placeholder="e.g. Senior Manager" maxlength="60">
    </div>
    <div class="field">
      <label for="reference-letter-generator-candidate">Candidate's name</label>
      <input class="input" id="reference-letter-generator-candidate" type="text" placeholder="e.g. Alex Khan" maxlength="60">
    </div>
    <div class="field">
      <label for="reference-letter-generator-relation">Your relationship</label>
      <select class="select" id="reference-letter-generator-relation">
        <option value="manager">I was their manager</option>
        <option value="colleague">We were colleagues</option>
        <option value="professor">I was their professor</option>
        <option value="mentor">I was their mentor</option>
        <option value="client">They were my vendor / freelancer</option>
      </select>
    </div>
    <div class="field">
      <label for="reference-letter-generator-duration">Known for</label>
      <select class="select" id="reference-letter-generator-duration">
        <option value="1 year">1 year</option>
        <option value="2 years">2 years</option>
        <option value="3 years" selected>3 years</option>
        <option value="5 years">5 years</option>
        <option value="over 5 years">Over 5 years</option>
      </select>
    </div>
    <div class="field">
      <label for="reference-letter-generator-tone">Tone</label>
      <select class="select" id="reference-letter-generator-tone">
        <option value="professional">Professional</option>
        <option value="warm">Warm &amp; enthusiastic</option>
        <option value="academic">Academic</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Key strengths (pick up to 4)</label>
    <div class="grid3" id="reference-letter-generator-strengths">
      <label class="checkline"><input type="checkbox" value="leadership"> Leadership</label>
      <label class="checkline"><input type="checkbox" value="problem-solving"> Problem-solving</label>
      <label class="checkline"><input type="checkbox" value="communication"> Communication</label>
      <label class="checkline"><input type="checkbox" value="reliability"> Reliability</label>
      <label class="checkline"><input type="checkbox" value="creativity"> Creativity</label>
      <label class="checkline"><input type="checkbox" value="teamwork"> Teamwork</label>
      <label class="checkline"><input type="checkbox" value="work ethic"> Work ethic</label>
      <label class="checkline"><input type="checkbox" value="adaptability"> Adaptability</label>
      <label class="checkline"><input type="checkbox" value="attention to detail"> Attention to detail</label>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="reference-letter-generator-go" type="button">Write Reference Letter</button>
  </div>
  <div class="error" id="reference-letter-generator-error"></div>
  <div class="field" style="margin-top:12px">
    <label>Your reference letter</label>
    <div class="result" id="reference-letter-generator-output" style="white-space:pre-wrap">Your letter will appear here.</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline btn-sm" id="reference-letter-generator-copy" type="button">Copy</button>
    <button class="btn btn-outline btn-sm" id="reference-letter-generator-download" type="button">Download .txt</button>
  </div>
  <p class="note">Template only — only recommend people you genuinely know, and personalize before sending.</p>
</div>
