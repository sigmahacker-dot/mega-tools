<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="conc-length">Length (ft)</label><input type="number" class="input" id="conc-length" min="0" step="any" placeholder="10"></div>
    <div class="field"><label for="conc-width">Width (ft)</label><input type="number" class="input" id="conc-width" min="0" step="any" placeholder="12"></div>
    <div class="field"><label for="conc-thick">Thickness (inches)</label><input type="number" class="input" id="conc-thick" min="0" step="any" placeholder="4"></div>
  </div>
  <div class="error" id="concrete-calculator-error"></div>
  <div class="result" id="conc-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="conc-yards">–</div><div class="l">Cubic yards (order)</div></div>
      <div class="stat-card"><div class="v" id="conc-bags80">–</div><div class="l">80 lb bags</div></div>
      <div class="stat-card"><div class="v" id="conc-bags60">–</div><div class="l">60 lb bags</div></div>
    </div>
    <table class="data">
      <thead><tr><th>Measure</th><th>Value</th></tr></thead>
      <tbody id="conc-body"><tr><td colspan="2" class="muted">Enter slab dimensions to calculate.</td></tr></tbody>
    </table>
    <p class="note">Volume = L × W × (thickness ÷ 12) cubic feet ÷ 27. Bag counts include 10% waste.</p>
  </div>
</div>
