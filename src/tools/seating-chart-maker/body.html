<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="seat-rows">Rows</label><input type="number" class="input" id="seat-rows" min="1" max="20" value="4"></div>
    <div class="field"><label for="seat-cols">Columns</label><input type="number" class="input" id="seat-cols" min="1" max="20" value="5"></div>
  </div>
  <div class="field"><label for="seat-guests">Guests <span class="hint">(one per line)</span></label><textarea class="textarea" id="seat-guests" rows="6" placeholder="Ayesha&#10;Bilal&#10;Chen&#10;..."></textarea></div>
  <div class="error" id="seating-chart-maker-error"></div>
  <div class="result" id="seat-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="seat-count">–</div><div class="l">Seats</div></div>
      <div class="stat-card"><div class="v" id="seat-filled">–</div><div class="l">Assigned</div></div>
    </div>
    <div id="seat-grid" style="overflow-x:auto"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="seat-go" type="button">Assign seats</button>
      <button class="btn btn-outline" id="seat-dl" type="button">Download .txt</button>
    </div>
  </div>
</div>
