<div class="tool-card">
  <div class="btn-row">
    <button class="btn btn-primary" id="buzzword-bingo-card-new" type="button">New Card</button>
    <button class="btn btn-outline" id="buzzword-bingo-card-print" type="button">Print Card</button>
  </div>
  <div class="error" id="buzzword-bingo-card-error"></div>
  <div id="buzzword-bingo-card-board" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px"></div>
  <p class="note">Tip: click a cell to mark it when someone says the buzzword. Five in a row wins the meeting.</p>
</div>
