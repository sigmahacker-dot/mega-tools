<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="color-name-to-hex-search">Search colors</label>
      <input class="input" id="color-name-to-hex-search" placeholder="e.g. coral, #ff7f50…">
      <p class="hint">Click any color to copy its hex.</p>
    </div>
    <div class="field">
      <label for="color-name-to-hex-reverse">Hex → color name</label>
      <div style="display:flex;gap:8px">
        <input class="input" id="color-name-to-hex-reverse" placeholder="#ff6347" style="flex:1">
        <button class="btn btn-primary" id="color-name-to-hex-find">Find</button>
      </div>
      <p class="hint" id="color-name-to-hex-verdict" style="min-height:20px"></p>
    </div>
  </div>
  <div class="error" id="color-name-to-hex-error"></div>
  <div id="color-name-to-hex-list"></div>
  <p class="muted hidden" id="color-name-to-hex-none">No colors match your search.</p>
</div>
