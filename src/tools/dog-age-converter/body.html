<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="dog-age-converter-age">Dog's age (years)</label>
      <input type="number" step="any" min="0" class="input" id="dog-age-converter-age" placeholder="e.g. 5">
    </div>
    <div class="field">
      <label for="dog-age-converter-size">Size class</label>
      <select class="select" id="dog-age-converter-size">
        <option value="small" selected>Small (under 20 lb / 9 kg)</option>
        <option value="medium">Medium (21–50 lb / 9–23 kg)</option>
        <option value="large">Large (over 50 lb / 23 kg)</option>
      </select>
    </div>
  </div>
  <div class="error" id="dog-age-converter-error"></div>
  <div class="result" id="dog-age-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="dog-age-converter-epi">–</div><div class="l">Epigenetic formula (16·ln+31)</div></div>
      <div class="stat-card"><div class="v" id="dog-age-converter-chart">–</div><div class="l">Size-based chart</div></div>
      <div class="stat-card"><div class="v" id="dog-age-converter-stage">–</div><div class="l">Life stage</div></div>
    </div>
    <p class="note" id="dog-age-converter-note">Enter your dog's age to compare both methods.</p>
    <p class="note">For information only — not veterinary advice. Ageing varies by breed, health and lifestyle.</p>
  </div>
</div>
