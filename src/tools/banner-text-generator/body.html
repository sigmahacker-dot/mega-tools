<div class="tool-card">
  <div class="field">
    <label for="banner-text-generator-input">Text (one line per row)</label>
    <textarea class="textarea" id="banner-text-generator-input" rows="4" placeholder="Your text here"></textarea>
  </div>
  <div class="grid2">
    <div class="field">
      <label for="banner-text-generator-style">Border style</label>
      <select class="input" id="banner-text-generator-style">
        <option value="single">Single ─ ┌─┐</option>
        <option value="double">Double ─ ╔═╗</option>
        <option value="rounded">Rounded ─ ╭─╮</option>
        <option value="star">Star ─ ***</option>
      </select>
    </div>
    <div class="field">
      <label for="banner-text-generator-pad">Padding</label>
      <input class="input" type="number" id="banner-text-generator-pad" min="0" max="8" value="2">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="banner-text-generator-run">Generate</button>
  </div>
  <div class="field">
    <label>Output</label>
    <div class="result"><pre class="data" id="banner-text-generator-output" style="overflow-x:auto"></pre></div>
    <div class="copy-row"><button class="btn btn-outline" id="banner-text-generator-copy">Copy output</button></div>
  </div>
  <div class="error" id="banner-text-generator-error"></div>
</div>
