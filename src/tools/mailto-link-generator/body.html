<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="mailto-to">To <span class="hint">(comma separated)</span></label><input type="text" class="input" id="mailto-to" placeholder="hello@example.com"></div>
    <div class="field"><label for="mailto-cc">CC</label><input type="text" class="input" id="mailto-cc" placeholder="boss@example.com"></div>
    <div class="field"><label for="mailto-bcc">BCC</label><input type="text" class="input" id="mailto-bcc" placeholder=""></div>
    <div class="field"><label for="mailto-subject">Subject</label><input type="text" class="input" id="mailto-subject" placeholder="Quick question"></div>
  </div>
  <div class="field"><label for="mailto-body">Body</label><textarea class="textarea" id="mailto-body" rows="4" placeholder="Hi there,..."></textarea></div>
  <div class="error" id="mailto-link-generator-error"></div>
  <div class="result" id="mailto-result">
    <div class="field"><label for="mailto-out">Generated link</label><input type="text" class="input" id="mailto-out" readonly></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="mailto-open" href="mailto:">Open in email app</a>
      <button class="btn btn-outline" id="mailto-copy" type="button">Copy link</button>
    </div>
    <p class="note">Tip: paste the copied link into any <span class="muted">&lt;a href="..."&gt;</span> on your site.</p>
  </div>
</div>
