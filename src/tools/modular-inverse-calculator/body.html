<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="modular-inverse-calculator-a">a</label><input class="input" id="modular-inverse-calculator-a" type="number" value="3" step="1"></div>
    <div class="field"><label for="modular-inverse-calculator-m">modulus m</label><input class="input" id="modular-inverse-calculator-m" type="number" value="11" step="1"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="modular-inverse-calculator-go">Find inverse</button></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="modular-inverse-calculator-inv">4</div><div class="l">a\u207B\u00B9 mod m</div></div>
    <div class="stat-card"><div class="v" id="modular-inverse-calculator-gcd">1</div><div class="l">gcd(a, m)</div></div>
  </div>
  <div class="result"><pre class="code" id="modular-inverse-calculator-steps" style="text-align:left;white-space:pre-wrap"></pre></div>
  <div class="error" id="modular-inverse-calculator-error"></div>
</div>
