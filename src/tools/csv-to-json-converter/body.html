<div class="tool-card">
  <div class="field">
    <label for="csv-to-json-converter-in">CSV input (first row = headers)</label>
    <textarea class="textarea" id="csv-to-json-converter-in" rows="6" placeholder='name,age,note&#10;Ava,31,"loves, commas"&#10;Liam,28,plain' spellcheck="false"></textarea>
  </div>
  <div class="error" id="csv-to-json-converter-error"></div>
  <div class="result" id="csv-to-json-converter-result">
    <p class="muted" id="csv-to-json-converter-stats">Waiting for valid CSV…</p>
    <div class="field">
      <label for="csv-to-json-converter-out">JSON preview</label>
      <textarea class="textarea" id="csv-to-json-converter-out" rows="6" readonly spellcheck="false"></textarea>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary btn-sm" id="csv-to-json-converter-download">Download .json</button>
      <button type="button" class="btn btn-outline btn-sm" id="csv-to-json-converter-copy">Copy JSON</button>
    </div>
    <p class="note">A real CSV parser is used: quoted commas, doubled quotes (“”) and line breaks inside quoted fields all work.</p>
  </div>
</div>
