<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="roman-numeral-converter-mode">Direction</label>
      <select class="select" id="roman-numeral-converter-mode">
        <option value="to-roman">Number &rarr; Roman</option>
        <option value="to-num">Roman &rarr; Number</option>
      </select>
    </div>
    <div class="field">
      <label for="roman-numeral-converter-input">Value</label>
      <input type="text" class="input" id="roman-numeral-converter-input" placeholder="e.g. 2026 or MMXXVI" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="roman-numeral-converter-go">Convert</button>
  </div>
  <div class="error" id="roman-numeral-converter-error"></div>
  <div class="result" id="roman-numeral-converter-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="roman-numeral-converter-out">&ndash;</div><div class="l">Result</div></div>
    </div>
  </div>
</div>
