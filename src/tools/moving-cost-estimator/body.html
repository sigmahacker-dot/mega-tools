<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="moving-cost-estimator-distance">Distance (miles)</label><input class="input" id="moving-cost-estimator-distance" type="number" min="0" step="any" value="800"></div>
    <div class="field"><label for="moving-cost-estimator-bedrooms">Bedrooms</label><input class="input" id="moving-cost-estimator-bedrooms" type="number" min="0" step="1" value="3"></div>
    <div class="field"><label for="moving-cost-estimator-mode">Move type</label><select class="input select" id="moving-cost-estimator-mode"><option value="full">Full-service movers</option><option value="diy">DIY (truck rental)</option></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="moving-cost-estimator-calc">Estimate</button></div>
  <div class="error" id="moving-cost-estimator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="moving-cost-estimator-low">—</div><div class="l">Low estimate</div></div>
    <div class="stat-card"><div class="v" id="moving-cost-estimator-high">—</div><div class="l">High estimate</div></div>
    <div class="stat-card"><div class="v" id="moving-cost-estimator-mid">—</div><div class="l">Midpoint</div></div>
  </div>
  <table class="data" id="moving-cost-estimator-table"></table>
  <p class="hint">DIY model: $150 base + $0.35/mile + $80/bedroom. Full-service: $1,200 base + $1.05/mile + $350/bedroom. Range is ±15%.</p>
</div>
