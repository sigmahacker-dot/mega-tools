<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="protein-weight">Body weight</label><input type="number" class="input" id="protein-weight" min="0" step="any" placeholder="70"></div>
    <div class="field"><label for="protein-unit">Weight unit</label>
      <select class="input" id="protein-unit"><option value="kg">Kilograms (kg)</option><option value="lb">Pounds (lb)</option></select>
    </div>
    <div class="field"><label for="protein-goal">Activity level</label>
      <select class="input" id="protein-goal">
        <option value="0.8">Sedentary (0.8 g/kg)</option>
        <option value="1.2" selected>Moderately active (1.2 g/kg)</option>
        <option value="1.6">Very active (1.6 g/kg)</option>
        <option value="2.0">Building muscle (2.0 g/kg)</option>
        <option value="2.2">Athlete / cutting (2.2 g/kg)</option>
      </select>
    </div>
  </div>
  <div class="error" id="protein-intake-calculator-error"></div>
  <div class="result" id="protein-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="protein-daily">–</div><div class="l">Protein per day</div></div>
      <div class="stat-card"><div class="v" id="protein-meal3">–</div><div class="l">Per meal (3 meals)</div></div>
      <div class="stat-card"><div class="v" id="protein-meal4">–</div><div class="l">Per meal (4 meals)</div></div>
    </div>
    <p class="note">Based on 0.8–2.2 g per kg of body weight per day. This is general guidance, not medical advice.</p>
  </div>
</div>
