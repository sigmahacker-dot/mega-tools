<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="pdf-n-up-imposer-file">PDF file</label>
      <input type="file" id="pdf-n-up-imposer-file" accept="application/pdf" class="input">
    </div>
    <div class="field">
      <label for="pdf-n-up-imposer-n">Pages per sheet</label>
      <select class="select" id="pdf-n-up-imposer-n">
        <option value="2">2-up (1 × 2)</option>
        <option value="4" selected>4-up (2 × 2)</option>
        <option value="9">9-up (3 × 3)</option>
      </select>
    </div>
  </div>
  <div class="field checkline">
    <input type="checkbox" id="pdf-n-up-imposer-numbers" checked>
    <label for="pdf-n-up-imposer-numbers">Print page numbers on each cell</label>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="pdf-n-up-imposer-go">Impose</button>
  </div>
  <div class="result hidden" id="pdf-n-up-imposer-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="pdf-n-up-imposer-in">–</div><div class="l">Source pages</div></div>
      <div class="stat-card"><div class="v" id="pdf-n-up-imposer-out">–</div><div class="l">Sheets</div></div>
      <div class="stat-card"><div class="v" id="pdf-n-up-imposer-size">–</div><div class="l">Output size</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="pdf-n-up-imposer-download">Download imposed PDF</button>
    </div>
  </div>
  <div class="error" id="pdf-n-up-imposer-error"></div>
  <p class="note">Pages keep their aspect ratio — they are scaled, never stretched. Everything runs in your browser.</p>
</div>
