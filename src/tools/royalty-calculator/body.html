<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="royalty-calculator-units">Units sold</label>
      <input type="number" class="input" id="royalty-calculator-units" min="0" step="any" placeholder="12000">
    </div>
    <div class="field">
      <label for="royalty-calculator-price">Price per unit ($)</label>
      <input type="number" class="input" id="royalty-calculator-price" min="0" step="any" placeholder="18.99">
    </div>
    <div class="field">
      <label for="royalty-calculator-rate">Royalty rate (%)</label>
      <input type="number" class="input" id="royalty-calculator-rate" min="0" max="100" step="any" placeholder="12">
    </div>
    <div class="field">
      <label for="royalty-calculator-advance">Advance already paid ($)</label>
      <input type="number" class="input" id="royalty-calculator-advance" min="0" step="any" placeholder="15000">
    </div>
  </div>
  <div class="error" id="royalty-calculator-error"></div>
  <div class="result" id="royalty-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="royalty-calculator-gross">&ndash;</div><div class="l">Gross revenue</div></div>
      <div class="stat-card"><div class="v" id="royalty-calculator-earned">&ndash;</div><div class="l">Royalty earned</div></div>
      <div class="stat-card"><div class="v" id="royalty-calculator-recouped">&ndash;</div><div class="l">Advance recouped</div></div>
      <div class="stat-card"><div class="v" id="royalty-calculator-payable">&ndash;</div><div class="l">Payable to you now</div></div>
      <div class="stat-card"><div class="v" id="royalty-calculator-unrecouped">&ndash;</div><div class="l">Unrecouped balance</div></div>
    </div>
    <p class="note">For information only &mdash; not financial advice. Royalty statements follow your contract's exact price basis and deductions.</p>
  </div>
</div>
