<div class="tool-card">
  <div class="field">
    <label for="color-temperature-converter-k">Temperature: <span id="color-temperature-converter-k-v">3200</span> K</label>
    <input type="range" id="color-temperature-converter-k" min="1000" max="12000" step="50" value="3200">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="color-temperature-converter-exact">Or type exact Kelvin</label>
      <input type="number" class="input" id="color-temperature-converter-exact" min="1000" max="12000" step="1" value="3200">
    </div>
  </div>
  <div class="error" id="color-temperature-converter-error"></div>
  <div class="result mt">
    <div id="color-temperature-converter-swatch" style="height:120px;border-radius:12px;border:1px solid var(--line);"></div>
    <div class="stat-cards mt">
      <div class="stat-card"><div class="v" id="color-temperature-converter-hex" style="font-family:ui-monospace,monospace;">–</div><div class="l">HEX</div></div>
      <div class="stat-card"><div class="v" id="color-temperature-converter-rgb" style="font-family:ui-monospace,monospace;font-size:.95rem;">–</div><div class="l">RGB</div></div>
      <div class="stat-card"><div class="v" id="color-temperature-converter-label">–</div><div class="l">Tone</div></div>
    </div>
    <table class="data mt">
      <thead><tr><th>Reference</th><th>Kelvin</th></tr></thead>
      <tbody>
        <tr><td>Candle flame</td><td>~1900 K</td></tr>
        <tr><td>Warm incandescent bulb</td><td>~2700 K</td></tr>
        <tr><td>Studio / halogen</td><td>~3200 K</td></tr>
        <tr><td>Neutral white LED</td><td>~4000 K</td></tr>
        <tr><td>Direct sunlight</td><td>~5500 K</td></tr>
        <tr><td>Overcast sky</td><td>~6500 K</td></tr>
        <tr><td>Blue sky shade</td><td>~10000 K</td></tr>
      </tbody>
    </table>
  </div>
</div>
