<div class="tool-card">
  <div class="field">
    <label>Select your stack</label>
    <div class="grid2" id="gitignore-generator-stacks" style="gap:8px"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="gitignore-generator-generate">Generate .gitignore</button>
  </div>
  <div class="error" id="gitignore-generator-error"></div>
  <div class="field">
    <label for="gitignore-generator-output">Generated .gitignore</label>
    <textarea class="textarea" id="gitignore-generator-output" rows="14" readonly placeholder="Your .gitignore will appear here…"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" id="gitignore-generator-copy">Copy</button>
    <button class="btn btn-outline" id="gitignore-generator-download">Download .gitignore</button>
  </div>
</div>
