<div class="tool-card">
  <div class="grid2">
    <div class="field"><label for="invoice-late-fee-calculator-amount">Invoice amount ($)</label><input class="input" id="invoice-late-fee-calculator-amount" type="number" min="0" step="any" value="5000"></div>
    <div class="field"><label for="invoice-late-fee-calculator-rate">Penalty rate (% per month)</label><input class="input" id="invoice-late-fee-calculator-rate" type="number" min="0" step="any" value="1.5"></div>
    <div class="field"><label for="invoice-late-fee-calculator-due">Due date</label><input class="input" id="invoice-late-fee-calculator-due" type="date" value="2026-08-01"></div>
    <div class="field"><label for="invoice-late-fee-calculator-asof">As-of date</label><input class="input" id="invoice-late-fee-calculator-asof" type="date"></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="invoice-late-fee-calculator-calc">Calculate</button></div>
  <div class="error" id="invoice-late-fee-calculator-error"></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="v" id="invoice-late-fee-calculator-days">—</div><div class="l">Days late</div></div>
    <div class="stat-card"><div class="v" id="invoice-late-fee-calculator-fee">—</div><div class="l">Late fee</div></div>
    <div class="stat-card"><div class="v" id="invoice-late-fee-calculator-total">—</div><div class="l">Total due</div></div>
    <div class="stat-card"><div class="v" id="invoice-late-fee-calculator-months">—</div><div class="l">Months late</div></div>
  </div>
  <p class="note">Educational estimates only — not financial advice.</p>
</div>
