<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="love-calculator-name1">Your name</label>
      <input class="input" id="love-calculator-name1" type="text" placeholder="e.g. Alex" autocomplete="off" maxlength="60">
    </div>
    <div class="field">
      <label for="love-calculator-name2">Partner's name</label>
      <input class="input" id="love-calculator-name2" type="text" placeholder="e.g. Sam" autocomplete="off" maxlength="60">
    </div>
  </div>
  <div class="btn-row mt">
    <button class="btn btn-primary" id="love-calculator-calc" type="button">Calculate Love</button>
    <button class="btn btn-outline" id="love-calculator-clear" type="button">Clear</button>
  </div>
  <div class="error" id="love-calculator-error"></div>
  <div class="result hidden" id="love-calculator-result">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="love-calculator-score">&ndash;</div><div class="l">Compatibility</div></div>
    </div>
    <p class="center" id="love-calculator-message"></p>
    <p class="muted center" id="love-calculator-pair"></p>
  </div>
  <p class="note">Just for fun &mdash; not scientifically accurate (obviously).</p>
</div>
