<div class="tool-card">
  <div class="field">
    <label for="query-string-builder-base">Base URL (optional)</label>
    <input class="input" id="query-string-builder-base" placeholder="https://api.example.com/search">
  </div>
  <div class="field">
    <label>Parameters</label>
    <div id="query-string-builder-rows"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-outline" id="query-string-builder-add">+ Add row</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="query-string-builder-build">Build query string</button>
  </div>
  <div class="error" id="query-string-builder-error"></div>
  <div class="result hidden" id="query-string-builder-result">
    <div class="field">
      <label for="query-string-builder-output">Result</label>
      <div class="copy-row">
        <code class="code" id="query-string-builder-output" style="flex:1;word-break:break-all"></code>
        <button class="btn btn-outline" id="query-string-builder-copy">Copy</button>
      </div>
    </div>
  </div>
</div>
