<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="bayes-theorem-calculator-prior">Prior P(D) %</label>
      <input class="input" id="bayes-theorem-calculator-prior" type="number" min="0" max="100" step="any" value="1">
    </div>
    <div class="field">
      <label for="bayes-theorem-calculator-sens">Sensitivity P(+|D) %</label>
      <input class="input" id="bayes-theorem-calculator-sens" type="number" min="0" max="100" step="any" value="99">
    </div>
    <div class="field">
      <label for="bayes-theorem-calculator-spec">Specificity P(−|¬D) %</label>
      <input class="input" id="bayes-theorem-calculator-spec" type="number" min="0" max="100" step="any" value="99">
    </div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn" id="bayes-theorem-calculator-calc">Calculate</button>
  </div>
  <div class="error" id="bayes-theorem-calculator-error"></div>
  <div id="bayes-theorem-calculator-out" class="hidden">
    <div class="stat-cards">
      <div class="stat-card"><div class="v" id="bayes-theorem-calculator-post-pos">–</div><div class="l">P(D|+) — positive result</div></div>
      <div class="stat-card"><div class="v" id="bayes-theorem-calculator-post-neg">–</div><div class="l">P(D|−) — negative result</div></div>
      <div class="stat-card"><div class="v" id="bayes-theorem-calculator-p-pos">–</div><div class="l">P(+) overall</div></div>
    </div>
    <div class="result">
      <h3>Formula steps</h3>
      <div id="bayes-theorem-calculator-steps"></div>
    </div>
    <div class="result">
      <h3>Natural frequencies (per 10,000 people)</h3>
      <div style="overflow-x:auto"><table class="data"><thead><tr><th></th><th>Test +</th><th>Test −</th><th>Total</th></tr></thead><tbody id="bayes-theorem-calculator-freq"></tbody></table></div>
    </div>
  </div>
</div>
