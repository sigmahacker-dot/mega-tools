<div class="tool-card">
  <div class="field">
    <label for="app-icon-resizer-file">Upload icon artwork (square recommended)</label>
    <input type="file" class="input" id="app-icon-resizer-file" accept="image/*">
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-outline" id="app-icon-resizer-all" disabled>Download all sizes</button>
  </div>
  <div class="error" id="app-icon-resizer-error"></div>
  <div class="result" id="app-icon-resizer-result" hidden>
    <div id="app-icon-resizer-grid" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end"></div>
    <p class="note">Tip: a 1024×1024 master gives the sharpest small icons.</p>
  </div>
</div>
