<div class="tool-card">
  <div class="grid3">
    <div class="field">
      <label for="final-exam-calculator-current">Current grade %</label>
      <input class="input" type="number" id="final-exam-calculator-current" min="0" max="100" step="0.1" placeholder="82">
    </div>
    <div class="field">
      <label for="final-exam-calculator-weight">Final exam weight %</label>
      <input class="input" type="number" id="final-exam-calculator-weight" min="1" max="100" step="0.5" placeholder="30">
    </div>
    <div class="field">
      <label for="final-exam-calculator-target">Target grade %</label>
      <input class="input" type="number" id="final-exam-calculator-target" min="0" max="100" step="0.1" placeholder="90">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="final-exam-calculator-calc">Calculate Required Score</button>
  </div>
  <div class="error" id="final-exam-calculator-error"></div>
</div>

<div class="tool-card">
  <div class="result" id="final-exam-calculator-result"><p class="muted">Enter your numbers and calculate.</p></div>
</div>
