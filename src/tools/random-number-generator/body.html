<div class="tool-card">
  <div class="grid2">
    <div class="field">
      <label for="random-number-generator-min">Minimum</label>
      <input type="number" class="input" id="random-number-generator-min" step="1" value="1">
    </div>
    <div class="field">
      <label for="random-number-generator-max">Maximum</label>
      <input type="number" class="input" id="random-number-generator-max" step="1" value="100">
    </div>
    <div class="field">
      <label for="random-number-generator-count">How many (1–1000)</label>
      <input type="number" class="input" id="random-number-generator-count" min="1" max="1000" step="1" value="1">
    </div>
    <div class="field">
      <label>Options</label>
      <div style="display:flex;gap:16px;padding:8px 0">
        <label><input type="checkbox" id="random-number-generator-unique"> Unique</label>
        <label><input type="checkbox" id="random-number-generator-sort"> Sort</label>
      </div>
    </div>
  </div>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn" id="random-number-generator-go">Generate</button>
    <button class="btn btn-outline" id="random-number-generator-copy" disabled>Copy</button>
  </div>
  <div class="error" id="random-number-generator-error"></div>
  <div class="result" id="random-number-generator-result" hidden>
    <div id="random-number-generator-out" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
  </div>
</div>
