<div class="tool-card" style="text-align:center">
  <div class="field" style="max-width:420px;margin:0 auto">
    <label for="avatar-generator-seed">Seed word (same seed = same avatar)</label>
    <input class="input" id="avatar-generator-seed" type="text" placeholder="e.g. dragon42" maxlength="40">
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="avatar-generator-go" type="button">Generate Avatar</button>
    <button class="btn btn-outline" id="avatar-generator-shuffle" type="button">Shuffle</button>
  </div>
  <div class="error" id="avatar-generator-error"></div>
  <div id="avatar-generator-stage" style="margin:14px auto;width:220px;height:220px"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-outline btn-sm" id="avatar-generator-svg" type="button">Download SVG</button>
    <button class="btn btn-outline btn-sm" id="avatar-generator-png" type="button">Download PNG</button>
  </div>
</div>
