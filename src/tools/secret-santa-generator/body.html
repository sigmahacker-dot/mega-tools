<div class="tool-card">
  <div class="field"><label for="santa-names">Participants <span class="hint">(one per line, min 3)</span></label><textarea class="textarea" id="santa-names" rows="6" placeholder="Ayesha&#10;Bilal&#10;Chen&#10;Diana&#10;Elena&#10;Farid"></textarea></div>
  <div class="error" id="secret-santa-generator-error"></div>
  <div class="result" id="santa-result">
    <table class="data">
      <thead><tr><th>#</th><th>Giver</th><th>→</th><th>Receiver</th></tr></thead>
      <tbody id="santa-body"><tr><td colspan="4" class="muted">Enter names and press Draw names.</td></tr></tbody>
    </table>
    <div class="btn-row">
      <button class="btn btn-primary" id="santa-go" type="button">Draw names</button>
      <button class="btn btn-outline" id="santa-dl" type="button">Download .txt</button>
    </div>
    <p class="note">A derangement shuffle guarantees nobody draws their own name.</p>
  </div>
</div>
